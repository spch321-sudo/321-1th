καὶ ἀγάπης<\/td><td>thōraka pisteōs kai agapēs<\/td><td>信和愛的胸甲<\/td><td>這使我們想起賽 59:17<\/td><\/tr><tr><td>περικεφαλαίαν ἐλπίδα σωτηρίας<\/td><td>perikephalaian elpida sōtērias<\/td><td>得救盼望的頭盔<\/td><td>盼望護住頭<\/td><\/tr><\/table>","gram":"<p><strong>5:6--8 用三個假設語氣的勸勉串起來：μὴ καθεύδωμεν（mē katheudōmen）、γρηγορῶμεν（grēgorōmen）、νήφωμεν（nēphōmen）——主詞都是「我們」，不是「你們」。<\/strong><\/p><p>ἄρα οὖν（ara oun） 是保羅愛用的雙重推論詞（羅 5:18；加 6:10）：因為是白晝之子，所以……。命令從身分推出來，不是反過來。καθεύδω（katheudō） 在這裡是比喻，指屬靈上的昏睡、失去警覺；它和 4:13--15 的 κοιμάω（koimaō） 不同，那是信徒的死，是會醒的睡。全卷的「睡」有三種意思，這是第二種。ὡς οἱ λοιποί（hōs hoi loipoi） 回指 4:13 的 οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα（hoi loipoi hoi mē echontes elpida）——同一批「其餘的人」，在 4:13 是沒有指望地哭，在 5:6 是沒有警覺地睡。<\/p><p>γρηγορέω（grēgoreō） 是醒著、守夜；νήφω（nēphō） 本義是沒有喝酒、頭腦清醒。5:7 用一個生活觀察支撐：οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσιν（hoi gar katheudontes nyktos katheudousin），καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν（kai hoi methyskomenoi nyktos methyousin）。兩組都是「夜裡做的事」，νυκτὸς（nyktos） 是時間的所有格。睡對醒，醉對清醒：5:6 的兩個動詞，剛好各自回答 5:7 的一種夜。<\/p><p>5:8 ἡμέρας ὄντες（hēmeras ontes） 是分詞：既然屬白晝，就要 νήφωμεν（nēphōmen）。ἐνδυσάμενοι（endysamenoi） 是不定過去式分詞，「穿上了」。θώρακα（thōraka） 是胸甲，περικεφαλαίαν（perikephalaian） 是頭盔，這使我們想起以賽亞書裡神自己出征的裝備：「他以公義為鎧甲，以拯救為頭盔」（賽 59:17）。保羅把它交給嬰孩教會穿；弗 6:14--17 是他後來畫的完整盔甲。這裡只有兩件，裝的正是 1:3 的三個字：πίστεως καὶ ἀγάπης（pisteōs kai agapēs） 在胸，ἐλπίδα σωτηρίας（elpida sōtērias） 在頭。信愛望在 1:3 是三種勞動，在 5:8 成了盔甲。<\/p>","exp":"<p><strong>「所以，我們不要睡覺像別人一樣，總要警醒謹守。」（5:6）醒，不是不睡覺，是不昏睡。<\/strong><\/p><p>「警醒」兩個字在教會裡常被講得很累：熬夜禱告、時時緊繃、一刻不能鬆懈。可是保羅在 5:7 說得很平常：睡覺的人是在夜間睡，喝醉的人是在夜間醉。睡與醉都是夜裡的事，因為黑暗裡沒有人看見。5:6 的「睡覺」不是指身體休息——保羅自己也要睡——而是指活得好像沒有主要來一樣：麻木、隨便、對神的事失去知覺。<\/p><p>「謹守」原文是不醉、清醒。夜裡讓人醉的東西很多，不只是酒：成功、焦急、怨恨、滑不完的螢幕，都會讓人失去判斷。清醒的人不一定比別人知道得多，但他看得清自己在哪裡、在等誰。<\/p><p>接著是裝備：「但我們既然屬乎白晝，就應當謹守，把信和愛當作護心鏡遮胸，把得救的盼望當作頭盔戴上。」（5:8）守夜的兵要穿盔甲。這兩件不是新東西，是 1:3 那三根柱子：「因信心所做的工夫，因愛心所受的勞苦，因盼望我們主耶穌基督所存的忍耐」（1:3）。信、愛、望在第 1 章是三種勞動，到第 5 章成了盔甲。你在那裡勞苦過的地方，就是保護你的地方。<\/p><p>信和愛護胸——心是最容易受傷的地方：懷疑神、冷淡人，是夜裡最常見的兩種傷。盼望護頭——人最容易被打倒的，是腦海裡的聲音：「這樣下去不會好了」「一切都白費了」。得救的盼望像頭盔，不是讓這些念頭永遠不出現，而是讓它們打不穿。這就是全卷那條線在本章的畫面：在夜裡穿上白天的衣服。<\/p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,<\/p><p lang=\"grc\">τοῦ ἀποθανόντος περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.<\/p>","lit":"<p>因為神沒有把我們安置在忿怒裡，而是安置在得著救恩裡，藉著我們的主耶穌基督，<\/p><p>就是那為我們死的，好叫我們無論醒著或睡著，都一同與他活。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν<\/td><td>ouk etheto hēmas ho theos eis orgēn<\/td><td>神沒有把我們安置在忿怒裡<\/td><td>τίθημι：安置、指定<\/td><\/tr><tr><td>εἰς περιποίησιν σωτηρίας<\/td><td>eis peripoiēsin sōtērias<\/td><td>為了得著救恩<\/td><td>περιποίησιν：取得、擁有<\/td><\/tr><tr><td>τοῦ ἀποθανόντος περὶ ἡμῶν<\/td><td>tou apothanontos peri hēmōn<\/td><td>那為我們死的<\/td><td>全卷唯一說「為我們」死的一句<\/td><\/tr><tr><td>εἴτε γρηγορῶμεν εἴτε καθεύδωμεν<\/td><td>eite grēgorōmen eite katheudōmen<\/td><td>無論醒著或睡著<\/td><td>與 5:6 同一對字，意思翻轉<\/td><\/tr><tr><td>ἅμα σὺν αὐτῷ ζήσωμεν<\/td><td>hama syn autō zēsōmen<\/td><td>一同與他活<\/td><td>回扣 4:17 ἅμα σὺν αὐτοῖς<\/td><\/tr><\/table>","gram":"<p><strong>5:9 以 ὅτι（hoti） 開頭，給 5:8「得救的盼望」一個根據：οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας（ouk etheto hēmas ho theos eis orgēn alla eis peripoiēsin sōtērias）。<\/strong><\/p><p>ἔθετο（etheto） 是 τίθημι（tithēmi） 的不定過去式中間語態，「安置、指定」，和合本譯「預定」。這裡不是在建構一套預定論，而是在講方向：神把我們放在通往救恩的路上，不是通往忿怒的路上。ὀργὴν（orgēn） 回指 1:10「救我們脫離將來忿怒的耶穌」（1:10）。περιποίησιν（peripoiēsin） 是「取得、擁有」，弗 1:14 用來說神「所買的產業」。σωτηρίας（sōtērias） 連續兩節出現（5:8、5:9）：盼望的內容就是這個救恩。<\/p><p>5:10 τοῦ ἀποθανόντος περὶ ἡμῶν（tou apothanontos peri hēmōn） 是全卷唯一直說「為我們」死的一句；救恩的根據不是我們夠警醒，是他替我們死了。接著是全卷的鉸鏈：εἴτε γρηγορῶμεν εἴτε καθεύδωμεν（eite grēgorōmen eite katheudōmen）。γρηγορέω（grēgoreō） 與 καθεύδω（katheudō） 正是 5:6 那一對字，那裡說「不要睡，要醒」，這裡卻說「無論醒著，睡著」都與他同活。上下文要求意思翻轉：這裡的 καθεύδω（katheudō） 不可能是屬靈昏睡（否則等於說昏睡也無妨），而是回到 4:13--15 的話題——死了的信徒。這是全卷「睡」的第三種意思。ἅμα σὺν αὐτῷ ζήσωμεν（hama syn autō zēsōmen） 回扣 4:17 的 ἅμα σὺν αὐτοῖς（hama syn autois） 與 σὺν κυρίῳ ἐσόμεθα（syn kyriō esometha）。<\/p>","exp":"<p><strong>「因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救。」（5:9）給信徒的末世論，是一個應許。<\/strong><\/p><p>談到末日，很多人的第一個感覺是怕：怕自己不夠好，怕被丟下，怕那一天來的時候自己正在做錯事。保羅講完夜與賊、睡與醉，立刻給一句定心的話：神的方向不是忿怒，是救恩。這不是叫人隨便，而是叫人站穩：警醒的力量不是從恐懼來的，是從確知自己屬於誰來的。用「被提時你會被留下」來嚇人，是把 5:9 倒過來讀。<\/p><p>救恩的根據在 5:10：「他替我們死」。不是我們醒得夠久，是他死得夠徹底。然後保羅說了一句很溫柔的話：「叫我們無論醒著，睡著，都與他同活」（5:10）。剛剛他才叫人「不要睡覺」（5:6），現在又說「睡著」也與他同活——同一個字，意思翻過來了。這裡的「睡著」，是 4:13 那些已經離世的弟兄姊妹。<\/p><p>想想帖撒羅尼迦人讀到這裡的心情。教會裡有人過世了，他們擔心那些人錯過了主的再來。保羅在 4:13--18 已經回答過，到 5:10 又輕輕補上一筆：活著等候的，和已經睡了的，在主裡沒有兩個階級；醒著的與他同活，睡了的也與他同活。死亡沒有把任何一個人從這個家裡除名。腓立比書講義第 1 章講過保羅「情願離世與基督同在」（腓 1:23）——在新約最早的這封信裡，他已經說了同一件事。<\/p><p>所以 5:9--10 是兩種人都需要的話：對昏睡的人，它說「醒過來，你是屬於救恩的」；對哀傷的人，它說「睡了的也沒有失去」。321 說「一切都是神的恩典」——連我們的醒與睡，都被包在他的死裡。<\/p>"},{"a":11,"z":11,"star":1,"grk":"<p lang=\"grc\">διὸ παρακαλεῖτε ἀλλήλους καὶ οἰκοδομεῖτε εἷς τὸν ἕνα, καθὼς καὶ ποιεῖτε.<\/p>","lit":"<p>所以你們要彼此勸勉，並且一個建造另一個，正如你們也在做的。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>διὸ<\/td><td>dio<\/td><td>所以<\/td><td>把 5:1--10 收成一個命令<\/td><\/tr><tr><td>παρακαλεῖτε ἀλλήλους<\/td><td>parakaleite allēlous<\/td><td>彼此勸慰<\/td><td>與 4:18 同一句<\/td><\/tr><tr><td>οἰκοδομεῖτε εἷς τὸν ἕνα<\/td><td>oikodomeite heis ton hena<\/td><td>一個建造另一個<\/td><td>比「彼此」更具體：一對一<\/td><\/tr><tr><td>καθὼς καὶ ποιεῖτε<\/td><td>kathōs kai poieite<\/td><td>正如你們也在做<\/td><td>肯定，不是責備<\/td><\/tr><\/table>","gram":"<p><strong>5:11 與 4:18 是一對：ὥστε παρακαλεῖτε ἀλλήλους ἐν τοῖς λόγοις τούτοις（hōste parakaleite allēlous en tois logois toutois）；διὸ παρακαλεῖτε ἀλλήλους καὶ οἰκοδομεῖτε εἷς τὸν ἕνα（dio parakaleite allēlous kai oikodomeite heis ton hena）。<\/strong><\/p><p>兩段末世教導（4:13--18；5:1--10）用同一個命令收尾——保羅講末世，終點都落在彼此身上。παρακαλέω（parakaleō） 是本卷的追蹤字，意思寬：勸、求、安慰、在旁邊鼓勵。οἰκοδομεῖτε（oikodomeite） 是蓋房子的字，保羅後來在哥林多前書第 14 章用它衡量聚會的一切。εἷς τὸν ἕνα（heis ton hena） 是「一個對一個」，比 ἀλλήλους（allēlous） 更具體：不是大家籠統地彼此，是我這一個對你那一個。καθὼς καὶ ποιεῖτε（kathōs kai poieite） 是現在式：你們已經在做了。保羅的勸勉常以肯定收尾，像 4:1、4:10。<\/p>","exp":"<p><strong>「所以，你們該彼此勸慰，互相建立，正如你們素常所行的。」（5:11）末世論的終點，是一間會彼此照顧的教會。<\/strong><\/p><p>講完主的日子、賊、黑夜與盔甲，保羅最後要他們做的事，不是去研究更多預言，也不是去警告外人，而是轉過身去照顧身邊的人。這和 4:18 一樣：「所以，你們當用這些話彼此勸慰。」（4:18）兩段末世教導，兩次都收在「彼此」。一套末世觀若讓人更孤立、更緊張、更喜歡跟人辯論，就走偏了；照保羅的方向，它應該讓人更懂得安慰人。<\/p><p>「互相建立」原文是「一個建造另一個」。教會不是專家蓋好的一座建築，是一塊一塊彼此疊上去的。你被某個人建造過，你也去建造下一個人——這是 321 所說建立屬神體系的運作方式：不靠大場面，靠一對一。<\/p><p>最後一句很體貼：「正如你們素常所行的」。保羅不是責備他們沒做，而是說：你們已經在做了，繼續做。一間只有幾個月大的教會，在逼迫和喪親之中，已經學會彼此扶持。肯定，往往比命令更能讓人走下去。<\/p>"},{"a":12,"z":13,"star":2,"grk":"<p lang=\"grc\">Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,<\/p><p lang=\"grc\">καὶ ἡγεῖσθαι αὐτοὺς ὑπερεκπερισσοῦ ἐν ἀγάπῃ διὰ τὸ ἔργον αὐτῶν. εἰρηνεύετε ἐν ἑαυτοῖς<\/p>","lit":"<p>而我們求你們，弟兄們，要認識那些在你們中間勞苦、在主裡站在你們前面、並且勸戒你們的人，<\/p><p>並且因他們的工作，在愛裡極其格外地看重他們。你們中間要和睦。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἐρωτῶμεν δὲ ὑμᾶς<\/td><td>Erōtōmen de hymas<\/td><td>而我們求你們<\/td><td>請求的口吻，與 4:1 同<\/td><\/tr><tr><td>εἰδέναι<\/td><td>eidenai<\/td><td>認識、知道<\/td><td>和合本譯「敬重」<\/td><\/tr><tr><td>τοὺς κοπιῶντας ἐν ὑμῖν<\/td><td>tous kopiōntas en hymin<\/td><td>在你們中間勞苦的<\/td><td>第一個特徵是勞苦<\/td><\/tr><tr><td>προϊσταμένους ὑμῶν ἐν κυρίῳ<\/td><td>proistamenous hymōn en kyriō<\/td><td>在主裡站在你們前面的<\/td><td>帶領，也是照顧<\/td><\/tr><tr><td>νουθετοῦντας ὑμᾶς<\/td><td>nouthetountas hymas<\/td><td>勸戒你們的<\/td><td>把道理放進心裡<\/td><\/tr><tr><td>ὑπερεκπερισσοῦ ἐν ἀγάπῃ<\/td><td>hyperekperissou en agapē<\/td><td>極其格外地，在愛裡<\/td><td>3:10 也用此字<\/td><\/tr><tr><td>διὰ τὸ ἔργον αὐτῶν<\/td><td>dia to ergon autōn<\/td><td>因他們的工作<\/td><td>尊重的理由是工作，不是頭銜<\/td><\/tr><tr><td>εἰρηνεύετε ἐν ἑαυτοῖς<\/td><td>eirēneuete en heautois<\/td><td>你們中間要和睦<\/td><td>現在式命令<\/td><\/tr><\/table>","gram":"<p><strong>5:12 用 Ἐρωτῶμεν（Erōtōmen） 開頭——「我們求」，和 4:1 一樣，是家人之間請求的口吻，不是上級下達命令。<\/strong><\/p><p>和合本的「敬重」，原文是 εἰδέναι（eidenai），οἶδα（oida） 的不定詞，字面是「知道、認識」。多數注釋家認為在此是「承認、看重」之意。被認識的人用三個分詞描寫，共用一個冠詞 τοὺς（tous）：κοπιῶντας（kopiōntas）、προϊσταμένους（proistamenous）、νουθετοῦντας（nouthetountas）——同一群人的三個面向，不是三種職分。三個都是動詞，不是頭銜；第一個是勞苦到累。保羅在 1:3 說「愛心所受的勞苦」，在 2:9 說自己「辛苦勞碌」，這裡用同一個字根描寫領袖。<\/p><p>προϊσταμένους（proistamenous） 字面是「站在前面」，可以指帶領，也可以指照顧、保護（羅 12:8 和合本譯「治理」；提前 3:4--5 用於管理自己的家）。ἐν κυρίῳ（en kyriō） 限定了範圍：在主裡帶領，不是在一切事上。5:13 的 ἡγεῖσθαι αὐτοὺς ὑπερεκπερισσοῦ ἐν ἀγάπῃ（hēgeisthai autous hyperekperissou en agapē），ὑπερεκπερισσοῦ（hyperekperissou） 是三重加強的副詞（3:10 也用），尊重要「格外」，而且「在愛裡」。理由片語 διὰ τὸ ἔργον αὐτῶν（dia to ergon autōn） 很關鍵：尊重的根據是工作，不是地位。緊接著 εἰρηνεύετε ἐν ἑαυτοῖς（eirēneuete en heautois），有些抄本作 ἐν αὐτοῖς（en autois），「與他們和睦」；SBLGNT 作 ἑαυτοῖς（heautois），「你們自己中間」。<\/p>","exp":"<p><strong>「弟兄們，我們勸你們敬重那在你們中間勞苦的人，就是在主裡面治理你們、勸戒你們的」（5:12）——領袖的第一個特徵是勞苦。<\/strong><\/p><p>一間只有幾個月大的教會，創辦人被趕走了，留下來帶領的是誰？大概是一些剛信主不久、白天還要做工的人，也許是開放家裡給教會聚會的人。他們沒有受過甚麼訓練，也會犯錯，有人因此不服。保羅請教會「認識」他們——看見他們的勞苦，承認他們在主裡的帶領，接受他們的勸戒。<\/p><p>請注意保羅描寫領袖用的字：勞苦、在前面照顧、勸戒，全是動詞。他沒有說「敬重那些有頭銜的」，而是說「又因他們所做的工，用愛心格外尊重他們」（5:13）。尊重跟著工作走，不是跟著位子走。這和保羅自己的樣子一致：他「雖然可以叫人尊重」（2:6），卻選擇「晝夜做工」（2:9）。<\/p><p>所以 5:12--13 不能讀成「絕對順服屬靈父親」，也不能讀成「質疑牧者就是消滅聖靈」。同一段的後面，保羅要全教會「凡事察驗」（5:21），講台上說的話也在察驗之列。尊重與察驗並不衝突：真正勞苦的領袖，不怕被察驗；拿「敬重」來堵住問題的人，已經離開了 5:12 的樣子。屬靈父母的目標是孩子站穩（3:8），不是孩子離不開自己。<\/p><p>反過來，這一節也對會眾說話。勞苦的人常常是最少被感謝的人。「用愛心格外尊重」不是逢迎，是看見：一句謝謝、一次為他們禱告、不在背後傳話，都是尊重。然後是一句短短的命令：「你們也要彼此和睦」（5:13）。領袖與會眾之間、會眾彼此之間的和睦，本身就是對勞苦者最好的尊重。<\/p>"},{"a":14,"z":14,"star":3,"grk":"<p lang=\"grc\">παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.<\/p>","lit":"<p>而我們勸你們，弟兄們，要勸戒脫隊的人，要安慰心小的人，要扶持軟弱的人，要向所有人恆久忍耐。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>παρακαλοῦμεν δὲ ὑμᾶς<\/td><td>parakaloumen de hymas<\/td><td>而我們勸你們<\/td><td>追蹤字 παρακαλέω<\/td><\/tr><tr><td>νουθετεῖτε τοὺς ἀτάκτους<\/td><td>noutheteite tous ataktous<\/td><td>要勸戒脫隊的人<\/td><td>ἄτακτος：離開行列的兵<\/td><\/tr><tr><td>παραμυθεῖσθε τοὺς ὀλιγοψύχους<\/td><td>paramytheisthe tous oligopsychous<\/td><td>要安慰心小的人<\/td><td>心縮小了的人：要勉勵，不是責備<\/td><\/tr><tr><td>ἀντέχεσθε τῶν ἀσθενῶν<\/td><td>antechesthe tōn asthenōn<\/td><td>要抓住軟弱的人<\/td><td>撐住他，不放手<\/td><\/tr><tr><td>μακροθυμεῖτε πρὸς πάντας<\/td><td>makrothymeite pros pantas<\/td><td>要向所有人長久忍耐<\/td><td>與加 5:22 聖靈果子同字根<\/td><\/tr><\/table>","gram":"<p><strong>5:14 是四個現在式命令並排：四種人、四個動詞，最後一個擴大到 πάντας（pantas）。<\/strong><\/p><p>ἄτακτος（ataktos） 原是軍事用語，指不在行列中的兵，引申為不守秩序；在帖撒羅尼迦書信裡，它特指不肯做工、等著別人供養的人（4:11；帖後 3:6--11 的 ἀτάκτως（ataktōs））。對他們用 νουθετεῖτε（noutheteite），與 5:12 領袖「勸戒」的 νουθετοῦντας（nouthetountas） 同字：清楚、當面的提醒。<\/p><p>ὀλιγόψυχος（oligopsychos） 在新約只出現這一次，七十士譯本多次使用（如賽 35:4 的「膽怯的人」），字面是「魂小的」——心縮小了、膽怯、灰心的人。對他們用的動詞是 παραμυθεῖσθε（paramytheisthe），安慰、在旁邊溫和地說話；約 11:19 用同一個字描寫來安慰馬大、馬利亞的人。更動人的是，2:12 保羅形容自己像父親時，用的正是這個字 παραμυθούμενοι（和合本在 2:11 譯「安慰」）。灰心的人得到的不是 νουθετεῖτε（noutheteite），是 παραμυθεῖσθε（paramytheisthe）：動詞換了，對待也換了。<\/p><p>ἀντέχεσθε（antechesthe） 加所有格，意思是緊緊抓住、靠在旁邊撐著；ἀσθενῶν（asthenōn） 可以是身體、生計或信心上的軟弱。μακροθυμεῖτε（makrothymeite） 是「長氣」，與加 5:22 聖靈果子的「忍耐」同字根，對象是 πάντας（pantas）——包括前三種人，也包括讓你最難忍耐的那一位。四個命令是對 ἀδελφοί（adelphoi） 說的，主詞是全教會，不是只交給領袖。<\/p>","exp":"<p><strong>「我們又勸弟兄們，要警戒不守規矩的人，勉勵灰心的人，扶助軟弱的人，也要向眾人忍耐。」（5:14）四種人，四種對待。<\/strong><\/p><p>這一節最重要的發現是：保羅沒有用同一種方法對待所有人。對脫隊的人，要清楚地提醒；對灰心的人，要溫柔地鼓勵；對軟弱的人，要伸手撐住；對所有人，都要有長長的耐性。次序弄錯就會傷人：對一個灰心的人「警戒」，等於在他倒下的地方再踩一腳；對一個故意不做工的人只「勉勵」，等於幫他繼續躺著。牧養的智慧，是先看清眼前這個人是哪一種。321 的 920 說每一個「2」都不一樣，就是這個意思。<\/p><p>「灰心的人」原文是「心縮小了的人」。他們不是不信，是被重擔壓得心都縮起來了：在逼迫裡疲憊的，為過世的親人傷心的，信主後被家人冷落的。保羅給他們的動詞是「勉勵」，不是責備；不是「你信心太小」，而是坐到他旁邊說話——那正是保羅自己當父親時的樣子（2:11--12）。今天教會裡的灰心，有時是憂鬱症、焦慮症這樣真實的病。那時最需要的是陪伴，也要協助他就醫、尋求專業諮商；這和禱告並不衝突。對他說「你多讀經就好了」，是把勉勵換成了責備。<\/p><p>「扶助軟弱的人」，原文是抓住他、撐住他。軟弱的人不需要一篇講道，需要一隻手。至於「不守規矩的人」，保羅心裡有很具體的對象：那些仗著主快來了、或仗著弟兄的愛心而不肯做工的人（4:11）。這不是在貶低失業或一時找不到工作的人；保羅說的是離開隊伍、拒絕自己那一份的人。對他們，愛的表現是說真話。<\/p><p>最後一句把範圍放到最大：「也要向眾人忍耐」（5:14）。忍耐是聖靈的果子（加 5:22），不是脾氣好的人的專利。四個命令是對「弟兄們」說的，不是只交給牧者：一間嬰孩教會的每一個人，都要學會看人、扶人、等人。<\/p>"},{"a":15,"z":15,"star":1,"grk":"<p lang=\"grc\">ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.<\/p>","lit":"<p>你們要看著，不要有人以惡代替惡還給任何人，而要常常追求那善的，向著彼此，也向著所有人。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὁρᾶτε<\/td><td>horate<\/td><td>你們要看著<\/td><td>群體的命令：彼此看顧<\/td><\/tr><tr><td>μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ<\/td><td>mē tis kakon anti kakou tini apodō<\/td><td>不要有人以惡代替惡還給任何人<\/td><td>τις……τινι：任何人對任何人<\/td><\/tr><tr><td>πάντοτε τὸ ἀγαθὸν διώκετε<\/td><td>pantote to agathon diōkete<\/td><td>常常追求那善的<\/td><td>διώκω：追趕，也是「逼迫」<\/td><\/tr><tr><td>εἰς ἀλλήλους καὶ εἰς πάντας<\/td><td>eis allēlous kai eis pantas<\/td><td>向著彼此，也向著所有人<\/td><td>3:12 同一組對象<\/td><\/tr><\/table>","gram":"<p><strong>5:15 用 ὁρᾶτε（horate） 開頭——「你們要看著」：命令是給群體的，要互相看顧，不讓任何一個人走上報復的路。<\/strong><\/p><p>μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ（mē tis kakon anti kakou tini apodō） 有兩個不定代名詞 τις（tis） 與 τινι（tini）：任何一個人、對任何一個人。ἀντὶ（anti） 是「代替、對換」，ἀποδῷ（apodō） 是「償還」——報復像還債，一筆換一筆。羅 12:17「不要以惡報惡」（羅 12:17）與彼前 3:9 有同樣的教導，可能都承接主耶穌在山上的教訓（太 5:39、44）。<\/p><p>ἀλλὰ（alla） 帶出正面的命令：πάντοτε τὸ ἀγαθὸν διώκετε（pantote to agathon diōkete）。διώκω（diōkō） 是「追趕」，也是「逼迫」的字（2:15 的 ἐκδιωξάντων（ekdiōxantōn） 同字根）。帖撒羅尼迦人正被鄉親「追趕」，保羅卻叫他們用同樣的力氣去追趕善。對象是 εἰς ἀλλήλους καὶ εἰς πάντας（eis allēlous kai eis pantas），與 3:12「彼此相愛的心，並愛眾人的心」（3:12）同一組：先是教會，再是所有人。<\/p>","exp":"<p><strong>「你們要謹慎，無論是誰都不可以惡報惡」（5:15）——被逼迫的教會，最大的試探是還手。<\/strong><\/p><p>帖撒羅尼迦人有理由報復。他們「受了本地人的苦害」（2:14），耶孫的家被闖進，弟兄被拉去見官（徒 17:5--9），創辦人連夜被送走。在這樣的處境裡，「以惡報惡」不是一個理論問題，是每天的衝動：在市場上回嘴，在背後說壞話，有機會時也讓對方嘗嘗滋味。<\/p><p>保羅的命令是「謹慎」，原文是「你們要看著」——全教會要互相看顧。報復很少是一個人的事：一個受了委屈的人，身邊若有一群人陪他咬牙，他就回不了頭；身邊若有人提醒他、陪他哭，他就有可能停下來。<\/p><p>然後是更高的一步：「或是彼此相待，或是待眾人，常要追求良善」（5:15）。「追求」和「逼迫」在原文是同一個字根。世人用全力追趕他們，保羅叫他們用同樣的力氣去追趕善，對象包括「眾人」，也包括那些鄉親。這不是軟弱，是另一種力量。家人反對時也是這樣：用改變的生命代替對抗，用孝順作見證，比贏一場爭論更能讓人看見基督。<\/p>"},{"a":16,"z":18,"star":3,"grk":"<p lang=\"grc\">πάντοτε χαίρετε,<\/p><p lang=\"grc\">ἀδιαλείπτως προσεύχεσθε,<\/p><p lang=\"grc\">ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.<\/p>","lit":"<p>要常常喜樂，<\/p><p>要不間斷地禱告，<\/p><p>要在每一件事中感謝；因為這是神在基督耶穌裡向著你們的旨意。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>πάντοτε χαίρετε<\/td><td>pantote chairete<\/td><td>常常喜樂<\/td><td>現在式命令：生活方式<\/td><\/tr><tr><td>ἀδιαλείπτως προσεύχεσθε<\/td><td>adialeiptōs proseuchesthe<\/td><td>不間斷地禱告<\/td><td>1:2、2:13 先是保羅自己的樣子<\/td><\/tr><tr><td>ἐν παντὶ εὐχαριστεῖτε<\/td><td>en panti eucharisteite<\/td><td>在每一件事中感謝<\/td><td>「在」凡事中，不是「為」凡事<\/td><\/tr><tr><td>τοῦτο γὰρ θέλημα θεοῦ<\/td><td>touto gar thelēma theou<\/td><td>因為這是神的旨意<\/td><td>第二次直說「神的旨意」，回指 4:3<\/td><\/tr><tr><td>ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς<\/td><td>en Christō Iēsou eis hymas<\/td><td>在基督耶穌裡，向著你們<\/td><td>旨意的範圍與對象<\/td><\/tr><\/table>","gram":"<p><strong>5:16--18 三個命令，各由一個「全部」字開頭：πάντοτε（pantote）、ἀδιαλείπτως（adialeiptōs）、ἐν παντὶ（en panti）——時間上的全部、不間斷、處境上的全部。<\/strong><\/p><p>希臘文把副詞放在動詞前面，強調的是「常常」「不住」「凡事」。三個命令都是現在式，指持續的生活方式，不是一次的動作。ἀδιαλείπτως（adialeiptōs） 在本卷出現三次，前兩次都描寫保羅自己：1:2 不住地記念，2:13 不住地感謝——命令之前，保羅先活出來了。這個字在古代文獻裡也用來形容停不下來的咳嗽：不是每一分鐘都開口，而是一再回來，像呼吸。<\/p><p>關鍵在 5:18 的介系詞：ἐν παντὶ（en panti），「在每一件事中」，不是 ὑπὲρ πάντων（hyper pantōn），「為每一件事」。保羅沒有叫人為惡事本身謝恩，而是在任何處境裡，都找得到可以感謝的神。下半句 τοῦτο γὰρ θέλημα θεοῦ（touto gar thelēma theou） 是全卷第二次直說「神的旨意」，第一次在 4:3 τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ（touto gar estin thelēma tou theou）。兩次的內容都不是「你要去哪裡、做甚麼工作」，而是「你要成為怎樣的人」。τοῦτο（touto） 可能只指謝恩，也可能涵蓋 5:16--18 三個命令；多數注釋家認為三者一體，本講義從之。<\/p>","exp":"<p><strong>「要常常喜樂，不住地禱告，凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。」（5:16--18）這三句話，是寫給在夜裡的教會的。<\/strong><\/p><p>這三個命令常被當成牆上的標語，好像信徒應該永遠笑容滿面。可是寫信的人在 2:17 說自己像被奪去的孤兒，在 3:5 說「我既不能再忍」（3:5）；收信的人剛剛埋葬了親人，還在被逼迫。保羅不是對一群日子很好的人說「要開心」。他知道他們在哭，所以 4:13 沒有說不要憂傷，而是說不要「像那些沒有指望的人一樣」（4:13）。喜樂和眼淚可以同時存在——「耶穌哭了」（約 11:35）。<\/p><p>「凡事謝恩」最容易被用錯。原文是「在凡事中」謝恩，不是「為凡事」謝恩。保羅沒有要人為疾病、暴力、不公義感謝，好像那些是好東西；他要人在任何處境裡，都不要失去對神的感謝。一個守在病床邊的人可以說：主，這病我不感謝，但我感謝你在這裡。這不是否認情緒，是在最真實的情緒裡仍然向神開口。對一位正在哀傷的人說「凡事謝恩，所以你不可以難過」，就是把這節經文當鞭子用；保羅從來沒有說不可以難過。<\/p><p>「不住地禱告」也不是要人每一分鐘都閉眼跪著。這個字在保羅筆下先是他自己的樣子：「不住地記念」（1:3）、「不住地感謝」（2:13）。禱告像呼吸：會停下來做別的事，但一再回到神面前。<\/p><p>最後，這是「神的旨意」。很多人求問神的旨意，是想知道該選哪份工作、跟誰結婚。帖撒羅尼迦前書兩次直說神的旨意（4:3；5:18），都是關於你成為怎樣的人：成為聖潔，學會謝恩。321 說「凡事謝恩把榮耀歸給耶穌」——謝恩把眼光從處境移到那位在處境裡的主身上。<\/p>"},{"a":19,"z":22,"star":2,"grk":"<p lang=\"grc\">τὸ πνεῦμα μὴ σβέννυτε,<\/p><p lang=\"grc\">προφητείας μὴ ἐξουθενεῖτε·<\/p><p lang=\"grc\">πάντα δὲ δοκιμάζετε, τὸ καλὸν κατέχετε,<\/p><p lang=\"grc\">ἀπὸ παντὸς εἴδους πονηροῦ ἀπέχεσθε.<\/p>","lit":"<p>那靈不要熄滅，<\/p><p>先知講論不要藐視；<\/p><p>但一切都要察驗，那美好的要抓緊，<\/p><p>要遠離各種樣式的惡。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τὸ πνεῦμα μὴ σβέννυτε<\/td><td>to pneuma mē sbennyte<\/td><td>那靈不要熄滅<\/td><td>受詞放句首；聖靈像火<\/td><\/tr><tr><td>προφητείας μὴ ἐξουθενεῖτε<\/td><td>prophēteias mē exoutheneite<\/td><td>先知講論不要藐視<\/td><td>當作零、看不起<\/td><\/tr><tr><td>πάντα δὲ δοκιμάζετε<\/td><td>panta de dokimazete<\/td><td>但凡事要察驗<\/td><td>驗金子的字，回指 2:4<\/td><\/tr><tr><td>τὸ καλὸν κατέχετε<\/td><td>to kalon katechete<\/td><td>美好的要抓緊<\/td><td>察驗後的一邊<\/td><\/tr><tr><td>ἀπὸ παντὸς εἴδους πονηροῦ ἀπέχεσθε<\/td><td>apo pantos eidous ponērou apechesthe<\/td><td>要遠離各種樣式的惡<\/td><td>察驗後的另一邊<\/td><\/tr><\/table>","gram":"<p><strong>◆ 經文鑑別 5:19<\/strong>：原文只有四個字 τὸ πνεῦμα μὴ σβέννυτε（to pneuma mē sbennyte），「不要熄滅那靈」。和合本「不要消滅聖靈的感動」，其中「聖」與「的感動」是譯者的補充，在和合本排成小字，原文沒有。這不是抄本異文，是翻譯上的兩種讀法。一種照字面，指聖靈自己：聖靈像火，這使我們想起五旬節「有舌頭如火焰顯現出來」（徒 2:3），σβέννυμι（sbennymi） 正是滅火的字（太 12:20；弗 6:16）。一種如和合本，指聖靈在聚會中的工作與感動，特別是下一節的先知講論。本講義的判斷：原文的受詞是「那靈」，不宜把聖靈縮小成一種感覺；但從上下文看，熄滅的方式確實是藐視祂在聚會中的工作，所以和合本的補充指出了方向。<\/p><p>5:19--22 是五個命令，前兩個是否定（μὴ（mē）……μὴ（mē）），後三個是肯定，用 δὲ（de） 轉折。這個轉折很重要：不要熄滅、不要藐視，但也不是照單全收——πάντα δὲ δοκιμάζετε（panta de dokimazete）。δοκιμάζω（dokimazō） 是試驗金屬的字，2:4 保羅說神 δεδοκιμάσμεθα（dedokimasmetha），「驗中了我們」，又是 τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν（tō dokimazonti tas kardias hēmōn），「察驗我們心的神」。察驗之後分兩邊：τὸ καλὸν κατέχετε（to kalon katechete），美好的抓緊；ἀπὸ παντὸς εἴδους πονηροῦ ἀπέχεσθε（apo pantos eidous ponērou apechesthe），各樣的惡遠離。εἴδους（eidous） 可譯「外表、樣子」，也可譯「種類」，此處多數學者取「各種」。這使我們想起約伯「遠離惡事」（伯 1:1）。先知講論在今天的樣式，本講義回指哥林多前書 12--14 章議題。<\/p>","exp":"<p><strong>「不要消滅聖靈的感動；不要藐視先知的講論。但要凡事察驗」（5:19--21）——兩個「不要」，一個「但要」，保羅同時防著兩種錯。<\/strong><\/p><p>第一種錯是把火澆熄。一間被逼迫的教會，很容易變得只求平安無事：聚會越來越短，禱告越來越少，有人站起來說一句從神來的勸勉，大家就覺得尷尬。保羅說：不要熄滅那靈。聖靈像火，火是可以被一盆冷水、一句冷嘲熱諷澆熄的。藐視先知的講論，就是把神透過弟兄姊妹說的話當作零。<\/p><p>第二種錯是甚麼都信。保羅緊接著說「但要凡事察驗」，這是試驗金子的字。「凡事」包括先知講論，也包括講台上的講道、使徒自己的教導（2:4）、領袖的指示（5:12），以及任何自稱「神告訴我」的話。所以拿 5:19 來堵住人的問題——「你質疑我，就是消滅聖靈」——正好把 5:19 和 5:21 拆開了。察驗不是不尊重聖靈，而是尊重到要分辨哪一句真是祂說的：「總要試驗那些靈是出於神的不是」（約壹 4:1）。<\/p><p>察驗之後是兩個動作：「善美的要持守，各樣的惡事要禁戒不做」（5:21--22）。這是一間成熟教會的樣子——不怕火，也不怕驗。只有熱情沒有分辨的教會，會被假先知帶走；只有分辨沒有熱情的教會，會慢慢冷掉。保羅要嬰孩教會兩樣都有。這些命令都是對全教會說的：分辨不是少數屬靈人的專利，每一個弟兄姊妹都有份。<\/p>"},{"a":23,"z":23,"star":3,"grk":"<p lang=\"grc\">Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.<\/p>","lit":"<p>而那平安的神親自使你們全然成聖，並且願你們的靈和魂和身體完整無缺地、無可指摘地，在我們主耶穌基督的降臨中被保守。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης<\/td><td>Autos de ho theos tēs eirēnēs<\/td><td>而那平安的神親自<\/td><td>Αὐτὸς 放句首強調<\/td><\/tr><tr><td>ἁγιάσαι<\/td><td>hagiasai<\/td><td>願他使你們成聖<\/td><td>祈願語氣；成聖的主詞換成神<\/td><\/tr><tr><td>ὁλοτελεῖς<\/td><td>holoteleis<\/td><td>全然、徹底<\/td><td>新約只此一處<\/td><\/tr><tr><td>ὁλόκληρον<\/td><td>holoklēron<\/td><td>完整無缺<\/td><td>每一部分都在<\/td><\/tr><tr><td>τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα<\/td><td>to pneuma kai hē psychē kai to sōma<\/td><td>靈與魂與身子<\/td><td>三個名詞，一個形容詞，一個動詞<\/td><\/tr><tr><td>ἀμέμπτως<\/td><td>amemptōs<\/td><td>無可指摘地<\/td><td>回指 3:13<\/td><\/tr><tr><td>ἐν τῇ παρουσίᾳ<\/td><td>en tē parousia<\/td><td>在降臨中<\/td><td>五章都以主的來臨收尾<\/td><\/tr><tr><td>τηρηθείη<\/td><td>tērētheiē<\/td><td>願被保守<\/td><td>被動祈願：保守的是神<\/td><\/tr><\/table>","gram":"<p><strong>5:23 是一句雙祈願：ἁγιάσαι（hagiasai） 與 τηρηθείη（tērētheiē） 都是祈願語氣，前後包住整個人。<\/strong><\/p><p>Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης（Autos de ho theos tēs eirēnēs） 把「神親自」放在最前面，與 3:11 的 Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν（Autos de ho theos kai patēr hēmōn） 同一個開頭。4:3 說「神的旨意就是要你們成為聖潔」（4:3），聖潔是命令；5:23 成聖的主詞換成了神。ὁλοτελεῖς（holoteleis） 是 ὅλος（holos）「全部」加 τέλος（telos）「完成」，新約只此一處；ὁλόκληρον（holoklēron） 是 ὅλος（holos） 加 κλῆρος（klēros）「份」，每一份都在、沒有缺角，雅 1:4 用於「完備」。兩個字都在說「整個」：保羅的禱告不是哪一部分比較屬靈，而是一個都不要少。三個名詞 τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα（to pneuma kai hē psychē kai to sōma） 共用一個形容詞 ὁλόκληρον（holoklēron） 和一個單數動詞 τηρηθείη（tērētheiē）。這節怎樣理解人的構造，有三種讀法：<\/p><p><strong>三分說<\/strong>：人由靈、魂、體三部分組成；靈與神相交，魂是理智、情感、意志，體是身體。部分教父如此讀；在華人教會，倪柝聲弟兄的《屬靈人》以此節建立靈、魂、體的屬靈學，影響深遠，華人地方教會傳統與許多華人教會承接這個讀法。<\/p><p><strong>二分說<\/strong>：人由物質的身體與非物質的靈魂組成，「靈」與「魂」是同一實體的兩種說法。這使我們想起主耶穌只說「身體和靈魂」（太 10:28）；路 1:46--47 馬利亞的「我心」與「我靈」是平行句。奧古斯丁以來多數西方神學採此說。<\/p><p><strong>整全說<\/strong>：聖經看人是一個整體；5:23 列出三個詞，是修辭上的完整，像「盡心、盡性、盡意、盡力」（可 12:30）不是把人切成四塊。多數當代聖經學者採此說。本講義的判斷：三說各有傳統，持守的都是弟兄；但這一節自己的重點不在解剖人，而在 ὁλοτελεῖς（holoteleis） 與 ὁλόκληρον（holoklēron）——神要保守的是整個人。<\/p>","exp":"<p><strong>「願賜平安的神親自使你們全然成聖！又願你們的靈與魂與身子得蒙保守，在我們主耶穌基督降臨的時候，完全無可指摘！」（5:23）命令講完了，保羅開始禱告。<\/strong><\/p><p>5:12--22 是一連串的命令：敬重、和睦、警戒、勉勵、扶助、忍耐、喜樂、禱告、謝恩、察驗……一個剛信主的人讀到這裡，可能會倒抽一口氣：這麼多，我做得到嗎？保羅的下一句不是再加一條，而是轉向神：願神「親自」使你們成聖。4:3 說成聖是神的旨意，5:23 說成聖是神的工作。<\/p><p>這一節在華人教會常引出靈、魂、體的討論。倪柝聲弟兄的《屬靈人》幫助過無數華人信徒認真對待內在生命，他為主長年受苦的見證，值得每一個華人基督徒尊敬；本講義並陳三種讀法，不攻擊、不嘲笑任何一方。但無論採哪一說，有一種用法要避免：把「屬魂的」當成一個標籤，用來否定人的情感、理性與性格。一位弟兄流淚，不是「魂在作工」；一位姊妹提出質疑，不是「太屬魂」。神造人有情感、有思想、有性格，這些不是要被消滅的敵人，而是要被神保守、被神更新的部分。<\/p><p>保羅這一節最重的兩個字，是「全然」和「完全」。「全然」是徹徹底底，「完全」是每一部分都在、沒有缺角。他不是在排列哪一部分比較高級，而是在禱告：一個都不要少。你的靈——你與神的相交；你的魂——你的情感、思想、意志；你的身子——你的健康、你的性、你每天做工的手，全都在神的保守裡。這接上第 4 章：聖潔包括身體（4:4）；也接上本章：那顆縮小了的心（5:14），同樣在保守之內。<\/p><p>「在我們主耶穌基督降臨的時候」——全卷五章，每一章都以主的來臨收尾，這是第五次。「無可指摘」不是說到那時我們已經靠自己毫無瑕疵，而是說那位開始的神，會把我們一直保守到那一天。這是 3:13 那個禱告的回聲，也為下一節鋪路。<\/p>"},{"a":24,"z":24,"star":2,"grk":"<p lang=\"grc\">πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.<\/p>","lit":"<p>那呼召你們的是信實的，他也必做成。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>πιστὸς ὁ καλῶν ὑμᾶς<\/td><td>pistos ho kalōn hymas<\/td><td>那呼召你們的是信實的<\/td><td>πιστὸς 放句首，沒有「是」動詞<\/td><\/tr><tr><td>ὁ καλῶν<\/td><td>ho kalōn<\/td><td>那呼召的<\/td><td>現在分詞：一直在召<\/td><\/tr><tr><td>ὃς καὶ ποιήσει<\/td><td>hos kai poiēsei<\/td><td>他也必做<\/td><td>三個字，未來式；沒有受詞<\/td><\/tr><\/table>","gram":"<p><strong>5:24 的形容詞 πιστὸς（pistos） 放在最前面，句中沒有「是」動詞：πιστὸς ὁ καλῶν ὑμᾶς（pistos ho kalōn hymas）；後半句只有三個字：ὃς καὶ ποιήσει（hos kai poiēsei）。<\/strong><\/p><p>ὁ καλῶν（ho kalōn） 是現在分詞：「那正在呼召的」，不是過去召了一次就不管。2:12 也用同一個現在分詞 τοῦ καλοῦντος ὑμᾶς（tou kalountos hymas），4:7 則用不定過去式 ἐκάλεσεν（ekalesen）。神的呼召在本卷是從開始到現在一直在進行的事。ὃς καὶ ποιήσει（hos kai poiēsei） 是關係子句，καὶ（kai） 是「也」：他呼召，他也做成。ποιήσει（poiēsei） 沒有受詞，和合本補「這事」，所指的就是 5:23 的成聖與保守。用 πιστὸς（pistos） 形容神，是保羅常用的信實論證：林前 1:9、林前 10:13、帖後 3:3 都是同一個句式。<\/p>","exp":"<p><strong>「那召你們的本是信實的，他必成就這事。」（5:24）全卷的終點，落在神的信實。<\/strong><\/p><p>這是本章地勢的最高點，也是整封信的落腳處。原文只有幾個字：信實的，那召你們的，他也必做。保羅說了四章半的勸勉，最後不是說「所以你們要更努力」，而是說「他必成就」。整卷的命令都是真的，都要去做；但做成的保證不在我們，在祂。<\/p><p>對一間嬰孩教會，這句話是何等的安慰。他們的創辦人被趕走了，提摩太來了又走，一封信就是全部的教材；他們會跌倒、會灰心，會有人不做工、有人起爭執。保羅不能留下來看著他們長大。但他知道有一位會留下來：那召你們的，到如今仍在召你們。祂不是叫了你一聲就走開的神。<\/p><p>「他必成就這事」也改變了人怎樣看自己的失敗。一個人若以為成聖全靠自己，跌倒時只會有兩種反應：自責到放棄，或假裝沒事。若知道神是信實的，跌倒的人可以再站起來，因為工程的主人沒有放棄這棟房子。腓立比書說的是同一件事：「那在你們心裡動了善工的，必成全這工」（腓 1:6）。<\/p><p>321 說「一切都是神的恩典」。5:23--24 是這句話在本卷的本文：命令是給我們的，成就是神的。全卷那條線從「等候他兒子從天降臨」（1:10）開始，到這裡收束——等候的人不是靠自己撐到那一天，是被一位信實的神一路帶到那一天。<\/p>"},{"a":25,"z":28,"star":1,"grk":"<p lang=\"grc\">Ἀδελφοί, προσεύχεσθε περὶ ἡμῶν.<\/p><p lang=\"grc\">ἀσπάσασθε τοὺς ἀδελφοὺς πάντας ἐν φιλήματι ἁγίῳ.<\/p><p lang=\"grc\">ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν τοῖς ἀδελφοῖς.<\/p><p lang=\"grc\">ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μεθʼ ὑμῶν<\/p>","lit":"<p>弟兄們，要為我們禱告。<\/p><p>要用聖潔的親吻問候所有的弟兄。<\/p><p>我使你們指著主起誓，要讓這信被讀給所有的弟兄聽。<\/p><p>我們主耶穌基督的恩典與你們同在。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>προσεύχεσθε περὶ ἡμῶν<\/td><td>proseuchesthe peri hēmōn<\/td><td>要為我們禱告<\/td><td>WH、NA28 多一個 καὶ<\/td><\/tr><tr><td>ἐν φιλήματι ἁγίῳ<\/td><td>en philēmati hagiō<\/td><td>用聖潔的親吻<\/td><td>家人之間的問安<\/td><\/tr><tr><td>ἐνορκίζω ὑμᾶς τὸν κύριον<\/td><td>enorkizō hymas ton kyrion<\/td><td>我使你們指著主起誓<\/td><td>全卷最重的一個字<\/td><\/tr><tr><td>ἀναγνωσθῆναι τὴν ἐπιστολὴν<\/td><td>anagnōsthēnai tēn epistolēn<\/td><td>這信要被讀出來<\/td><td>被動不定詞：公開宣讀<\/td><\/tr><tr><td>πᾶσιν τοῖς ἀδελφοῖς<\/td><td>pasin tois adelphois<\/td><td>給所有的弟兄<\/td><td>一個都不能少<\/td><\/tr><tr><td>ἡ χάρις τοῦ κυρίου ἡμῶν<\/td><td>hē charis tou kyriou hēmōn<\/td><td>我們主的恩典<\/td><td>以恩開頭，以恩收尾<\/td><\/tr><\/table>","gram":"<p><strong>5:25--28 四節收尾：一個請求、一個問安、一個起誓、一個祝福。<\/strong><\/p><p>5:25 Ἀδελφοί（Adelphoi） 之後是 προσεύχεσθε περὶ ἡμῶν（proseuchesthe peri hēmōn）。WH 與 NA28 在 προσεύχεσθε（proseuchesthe） 之後有 καὶ（kai），「也」為我們禱告——呼應 5:17 與 1:2，保羅為他們禱告，也請他們為他禱告；SBLGNT 無 καὶ（kai）。兩讀意思相近，本講義照 SBLGNT。<\/p><p>5:26 ἐν φιλήματι ἁγίῳ（en philēmati hagiō） 也見於羅 16:16、林前 16:20、林後 13:12，彼前 5:14 作「愛心的」親嘴。親嘴問安是當時家人之間的問候；ἁγίῳ（hagiō） 讓它與世俗的親吻有分別。5:27 的 ἐνορκίζω（enorkizō） 是全卷最重的一個字，新約只此一處（SBLGNT 未標 Strong 編號），意思是使人在誓言之下，帶雙賓語 ὑμᾶς（hymas） 與 τὸν κύριον（ton kyrion）。人稱也從複數「我們」轉為單數「我」——全卷只有 2:18、3:5 和這裡。ἀναγνωσθῆναι（anagnōsthēnai） 是被動不定詞，「被讀出來」：當時的書信是在聚會中朗讀的（西 4:16；啟 1:3）。5:28 以 ἡ χάρις（hē charis） 收尾，與 1:1 的 χάρις ὑμῖν（charis hymin） 前後呼應；SBLGNT 句末沒有「阿們」。<\/p>","exp":"<p><strong>「請弟兄們為我們禱告。」（5:25）新約最早的一封信，結尾是使徒請嬰孩教會為他禱告。<\/strong><\/p><p>保羅是他們屬靈的父親、母親，可是他不站在孩子上面。他向他們求代禱，承認自己也需要扶持。屬靈權柄健康的樣子就是這樣：帶領的人也被禱告托住。<\/p><p>「與眾弟兄親嘴問安，務要聖潔」（5:26）是「書信」三問的好示範。帖撒羅尼迦人遇到的是一個新的家：奴隸和主人、本地人和外地人坐在一起。保羅推出的原則是：家人之間真誠、聖潔地接納彼此。今天這原則落在哪裡？形式隨文化：在華人教會，可能是一次握手、一句熱情的問候、一頓一起吃的飯；不變的是「務要聖潔」與「眾弟兄」——不挑人，也不越界。<\/p><p>最重的一句是：「我指著主囑咐你們，要把這信念給眾弟兄聽。」（5:27）保羅用起誓的語氣，只為一件事：這封信不能只給幾個人看。當時許多人不識字，有人是奴隸、主人不放人，有人在家照顧病人沒能來聚會。保羅要的是「眾」弟兄，一個都不能少。神的話不是少數人的專利，是全家人的飯。<\/p><p>最後一句是恩典：「願我主耶穌基督的恩常與你們同在！」（5:28）這封信以恩開頭（1:1），以恩結束；中間的一切命令、勸勉與盼望，都放在恩典裡面。<\/p>"}]},"serm":{"1":{"min":15,"blocks":[["h","《離棄偶像，歸向神》"],["p","弟兄姊妹平安，今天我們開始讀帖撒羅尼迦前書，先讀第一章。"],["p","我想先給你一個數字。很小的一個數字。"],["q","三。三個安息日。"],["q","「保羅照他素常的規矩進去，一連三個安息日，本著聖經與他們辯論」（徒 17:2）"],["p","三個安息日，就是三個禮拜六。從第一次講道算起，不到一個月。"],["p","有人信了。有許多虔敬的希臘人，尊貴的婦女也不少。"],["p","然後有人嫉妒，招聚了些市井匪類，闖進一個叫耶孫的人家裡。"],["q","「弟兄們隨即在夜間打發保羅和西拉往庇哩亞去。」（徒 17:10）"],["p","在夜間。連夜送走。沒有歡送會，沒有按立長老。"],["p","這間教會手上剩下甚麼？沒有會堂，沒有牧師，連一本新約也沒有。"],["p","只有三個安息日的記憶，和一個被鄉親盯上的家。"],["p","三個禮拜。一個嬰孩剛生下來三個禮拜，媽媽就被迫離開。"],["p","這個孩子，活得下來嗎？"],["p","幾個月以後，保羅在哥林多，寫了一封信回去。"],["p","這封信，很可能是新約裡最早寫成的一卷書。"],["p","請你留意，新約的第一封信，是寫給一間只有三個安息日大的教會。"],["q","神寫給教會的第一封信，收信人是一個嬰孩。"],["p","所以如果你剛信主，或者剛被家人反對，或者手上只有一本聖經，"],["p","這一卷書，是先寫給你的。"],["p","這一章有三個詞：工，印，歸。"],["p","我們沿著它走三步：信愛望的勞動，被蓋了印的人，轉身與等候。"],["p","先看第一節，很短。"],["q","「保羅、西拉、提摩太寫信給帖撒羅尼迦在父神和主耶穌基督裡的教會。」（1:1）"],["p","三個名字並排。保羅沒有給自己加任何頭銜，連「使徒」兩個字都沒有寫。"],["p","新約的第一封信，不是一個明星寫的，是一個團隊寫的。"],["p","可是保羅說，你們的地址還有一行：在父神和主耶穌基督裡。"],["p","一個剛被家人趕出門的新信徒，讀到這一行，就知道自己不是無家可歸。"],["q","第一步：信愛望的勞動。"],["q","「我們為你們眾人常常感謝神，禱告的時候提到你們」（1:2）"],["p","保羅寫給這間嬰孩教會的第一個動詞，是感謝。"],["p","不是糾正，不是提醒，是感謝。"],["p","「提到」，原文的意思是點名。一個一個名字，在禱告裡念出來。"],["p","然後第三節，他說他記得三樣東西。"],["q","「不住地記念你們因信心所做的工夫，因愛心所受的勞苦，因盼望我們主耶穌基督所存的忍耐。」（1:3）"],["p","請你留意，他記得的不是他們懂了多少。"],["p","三個安息日，能懂多少？三位一體講不清楚，末世論也還沒學。"],["p","保羅記得的，是看得見的三樣：手上的工，身上的累，心裡撐住的忍耐。"],["p","先看第一樣：信心所做的工夫。"],["p","「工夫」，原文是 ἔργον，工作。信心不是只在心裡點頭。"],["q","信心有手。"],["p","一個剛信主的媽媽，信心表現在哪裡？她開始為全家禱告。"],["p","早上全家還在睡，她一個人坐在餐桌前，一個一個名字念。"],["p","第二樣：愛心所受的勞苦。"],["p","「勞苦」，原文是 κόπος。不是一般的辛苦，是做到筋疲力盡。"],["q","愛心會累。"],["p","同一個媽媽，煮完一家人的晚飯，又提著一鍋湯去看生病的姊妹。"],["p","回到家，碗還沒洗。她很累。可是這個累，保羅記得。"],["p","第三樣：盼望所存的忍耐。"],["p","「忍耐」，原文是 ὑπομονή。字面是：在底下，留下來。"],["p","重擔壓在肩上，人卻沒有走開。"],["q","盼望站得住。"],["p","同一個媽媽，先生罵她信洋教，罵她不要祖宗。"],["p","她沒有離開，也沒有回罵。第二天照樣煮飯，照樣叫他一聲。"],["p","她盼望的是主耶穌。盼望不是心情，是一位要回來的人。"],["p","信，愛，望。這很可能是新約第一次把這三個字排在一起。"],["p","後來它成了一首詩。可是最早的這一次，信愛望是三種勞動。"],["p","工作，勞苦，忍耐。全是會流汗的字。"],["p","這是一個家的三根柱子。"],["p","而且保羅說，這些是「在神－我們的父面前」記念的。"],["p","那位媽媽清晨的禱告，沒有人看見。那一鍋湯，沒有人鼓掌。"],["q","沒人鼓掌的勞苦，在父面前都有記錄。"],["p","接著第四節，保羅叫了他們一聲。"],["q","「被神所愛的弟兄啊，我知道你們是蒙揀選的」（1:4）"],["p","「弟兄們」，這是全卷十四次的第一次。這是一封家書。"],["p","「被神所愛的」，原文是完成式：被愛了，而且一直被愛著。"],["p","然後是一個在華人教會常常引起焦慮的詞：揀選。"],["p","可是請你看保羅怎麼「知道」。他沒有打開一本秘密的名冊。"],["p","第五節第一個字，是「因為」。他是看見了，才認出來。"],["q","「因為我們的福音傳到你們那裡，不獨在乎言語，也在乎權能和聖靈，並充足的信心。」（1:5）"],["p","人心被打開了，生命被翻轉了，被逼迫了還站得住。"],["p","權能不一定是神蹟奇事。"],["p","一個拜了四十年偶像的人，肯把神像請出門，那就是權能。"],["q","揀選不是讓人睡不著的謎題，是回頭看時認出來的恩典。"],["p","第五節還有最後一句，常常被跳過。"],["q","「正如你們知道，我們在你們那裡，為你們的緣故是怎樣為人。」（1:5）"],["p","福音不是一封掛號信，送到就好。它帶著送信人的體溫。"],["q","信息怎樣來，信使就怎樣活。"],["p","今天你的家人，先讀到的往往不是講章，是你怎樣待他。"],["p","所以三個安息日，夠不夠？"],["p","要懂完全本聖經，不夠。要被神愛，要開始做工、受累、忍耐，夠了。"],["q","第二步：被蓋了印的人。"],["q","「並且你們在大難之中，蒙了聖靈所賜的喜樂，領受真道就效法我們，也效法了主」（1:6）"],["p","「效法」，原文是 μιμηταί。英文 mimic 就從這個字來。模仿者。"],["p","請你留意次序。先說效法我們，再補一句，也效法了主。"],["p","保羅不是把自己放在主前面。他是照他們實際經歷的次序寫的。"],["p","一個信主三個禮拜的人，還不會讀希臘文的福音書，"],["p","他能看的耶穌，就是住在耶孫家裡、白天做工、晚上講道的那幾個人。"],["p","這一節裡，有兩樣東西放在一起。"],["p","「在大難之中」。「大難」，原文是擠壓葡萄、擠壓橄欖的字。"],["p","對帖撒羅尼迦人，這不是比喻。家被闖，人被拖去見官，還要交保。"],["p","然後，同一節，「蒙了聖靈所賜的喜樂」。"],["p","原文是：帶著聖靈的喜樂。喜樂沒有取消大難，大難也沒有取消喜樂。"],["q","聖靈的喜樂不是止痛藥，是在痛裡多了一位同在的。"],["p","這一節很容易被讀歪，所以我要很小心地說幾句。"],["p","它不是說，受苦的人應該假裝沒事。一個人可以一邊流淚，一邊知道自己沒有被丟下。"],["p","如果你在家裡被打、被威脅，那不是為福音受的苦。"],["p","你不需要留在那裡證明自己屬靈。你需要的是安全，是被保護。"],["p","請你找一位信得過的人，說出來。"],["p","保羅說的，是為福音的緣故被反對的時候，神沒有缺席。"],["q","「甚至你們作了馬其頓和亞該亞所有信主之人的榜樣。」（1:7）"],["p","「榜樣」，原文是 τύπον。原本的意思，是打下去留下的印痕。"],["p","而且原文是單數。不是幾個明星信徒，是整間教會一起，成了一個印。"],["q","被蓋了印的人，自己也成了印。"],["p","主，蓋在保羅身上。保羅，蓋在帖撒羅尼迦人身上。"],["p","帖撒羅尼迦人，又蓋在馬其頓和亞該亞所有信主的人身上。"],["p","國度321空中團契常說：耶穌是我的榜樣。在這裡，它是一條鏈子，不是一張海報。"],["p","一間只有三個安息日大、創辦人被趕走的教會，成了兩個省的樣式。"],["p","今天這樣的印，長甚麼樣子？"],["p","一個年輕人因為信主，過年回家被冷落，飯桌上沒人跟他說話。"],["p","他沒有摔門，也沒有辯論。他洗碗，陪阿公散步，記得媽媽的生日。"],["p","三年以後，他的妹妹來問他：你到底信的是甚麼？"],["p","那就是印。蓋下去的時候沒聲音，印痕卻留下來了。"],["q","「因為主的道從你們那裡已經傳揚出來。」（1:8）"],["p","「傳揚出來」，原文是 ἐξήχηται。全本新約，只出現這一次。"],["p","它的字根是「聲音」。是鐘聲、號聲、雷聲，向四面響開。"],["p","而且是完成式：已經響出去了，回聲現在還在。"],["p","請你想像山谷裡敲了一口鐘。敲的人沒有動，聲音卻走遍了整個山谷。"],["p","這間教會沒有差派宣教士。他們只是活出來，消息就跟著往來的人走了。"],["p","保羅甚至說，「所以不用我們說甚麼話」。"],["p","他走到別的城，還沒開口，人家先告訴他：你聽說帖撒羅尼迦的事了嗎？"],["p","321 八大步驟裡有一步叫繁殖。它最自然的樣子，就在這裡。"],["p","不是辦一場活動，是一個生命被看見以後，自己傳開。"],["q","主的道，借他們的生命發聲。"],["p","影響力不是看人數，是看那口鐘有沒有被敲響。"],["p","那麼，別人到底在傳他們甚麼？"],["p","第九節告訴我們，傳出去的消息只有一件事：一個轉身。"],["q","第三步：轉身與等候。"],["q","「你們是怎樣離棄偶像，歸向神，要服事那又真又活的神」（1:9）"],["p","使徒行傳說，信的人裡面有許多希臘人。這一節證實了：教會大多是外邦人。"],["p","「歸向」，原文是 ἐπεστρέψατε。轉身。而且是一次決定性的轉身。"],["p","這就是本章的「歸」。全卷是一個孩子的成長，這是第一步：出生。"],["p","請你留意原文的字序。是先「向神」，後「離開偶像」。"],["p","他們不是先把家裡的偶像清乾淨，再慢慢去找神。"],["p","是先看見了神，偶像就留不住了。"],["q","不是先把家裡清乾淨才能來，是看見了神，手裡的東西就放下了。"],["p","轉身也有目的：「要服事那又真又活的神」。"],["p","活的，對照不會動、不會聽的木頭石頭。真的，對照一切虛假的。"],["p","信主不是只是「不拜了」。是開始服事一位活的、會回應的神。"],["p","今天華人的轉身，常常就發生在家裡的神明桌前，祖先牌位前。"],["p","這裡請你分清楚兩件事。"],["p","不再拜偶像，是轉身。記念祖先、孝敬父母，卻是神所喜悅的。"],["p","剛信主的人，不必用摔神像、和家人翻臉來證明自己信得真。"],["p","過年回家，不拜，但是可以第一個到，最後一個走。"],["q","轉身歸向神，同時轉身更愛家人。"],["p","帖撒羅尼迦人的鄰居看見的，就是這樣一個轉身。所以消息會傳開。"],["p","然後，第十節。這一章最高的地方。"],["q","「等候他兒子從天降臨，就是他從死裡復活的－那位救我們脫離將來忿怒的耶穌。」（1:10）"],["p","轉身的目的有兩面。一面是服事，一面是等候。"],["p","「等候」，原文是 ἀναμένειν。全本新約，也只出現這一次。"],["p","請你留意，他們等的不是一件事，是一個人。"],["p","三個安息日。保羅來不及教他們很多東西。"],["p","可是他教了「等候」。這是他們學到的第一課。"],["p","而且請你注意，他沒有給他們一張時間表。"],["p","到了第五章，他還明明地說："],["q","「弟兄們，論到時候、日期，不用寫信給你們」（5:1）"],["p","等候不是算日子。是一種活法。"],["p","轉過身來以後，臉朝著一個方向，盼望一個人。"],["q","我們等的不是一個日子，是一位主。"],["p","等候的根據，在中間那一句：「就是他從死裡復活的」。"],["p","我們等的不是一個傳說，是一位已經從墳墓走出來的人。"],["p","神既然叫他從死裡復活，就一定會叫他回來。"],["p","最後一句：「那位救我們脫離將來忿怒的耶穌」。"],["p","有人會問：慈愛的神，為甚麼有忿怒？"],["p","神的忿怒不是情緒失控，是神對罪與不義認真的反應。"],["p","可是這一節的重點，不在忿怒，在拯救。"],["p","「救」這個字，原文是現在分詞。不是「將要救」，是「正在救」。"],["p","忿怒是將來的。救，已經開始了。"],["p","第五章，保羅把這句話說完："],["q","「因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救。」（5:9）"],["p","所以這一節不是拿來嚇人的。用將來的忿怒嚇唬人信主，不是保羅的用法。"],["p","這一節給嬰孩教會的，是一個應許。"],["q","你們等候的那一位，就是救你們的那一位。"],["p","弟兄姊妹，我們回到開頭那個數字。"],["q","三個安息日。"],["p","保羅只陪了他們三個安息日，就在夜裡被送走了。"],["p","可是請你看，保羅沒有叫他們等保羅回來。"],["p","他叫他們等候「他兒子從天降臨」。"],["p","保羅可以被人連夜送出城。這一位，連墳墓都關不住他。"],["p","教會是建在一位從死裡復活、正在救他們、一定會回來的耶穌身上。"],["q","創辦人走了。教會的主沒有走。"],["p","所以三個安息日大的教會，可以活下來。"],["p","所以剛信主三個禮拜的你，也可以活下來。"],["p","不是因為你懂得夠多，是因為他抓得夠緊。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，想一個在你身邊默默做工、受累、忍耐的人。"],["p","像保羅一樣，在禱告裡點他的名字，為他感謝神。如果可以，也告訴他。"],["p","第二件，每天早上出門以前，抬頭一下。"],["p","對主說：主耶穌，我在等你。今天我要活得像一個等你回來的人。"],["p","如果你正在家裡、在職場，因為信主被反對，"],["p","請你記得，你不是一個人等。那位你等候的，現在就在救你。"],["p","我們一起低頭禱告。"]]},"2":{"min":17,"blocks":[["h","《如同母親乳養自己的孩子》"],["p","弟兄姊妹平安，今天我們一起讀帖撒羅尼迦前書第二章。"],["p","今天我想請你和我一起，停在一個畫面上。不要急著往前走。"],["q","夜裡，兩點多。房間裡只開了一盞很小的燈。"],["p","一個母親坐在床邊，懷裡抱著剛出生沒多久的孩子。"],["p","孩子哭醒了。她沒有開大燈，怕把孩子嚇著。"],["p","夜裡有一點涼。她把孩子貼在胸口，裹進自己的衣服裡，用體溫捂著他。"],["p","她很累，明天一早又要起來。可是她沒有看時間，她看的是孩子的小嘴。"],["p","孩子吃得慢，她就等。吃一口，停一下，她也等。"],["q","請你停在這裡。看她的手，看她的肩膀，看她低下來的頭。"],["p","她沒有教孩子甚麼，也沒有對孩子講道理。"],["p","她只是把自己的時間、自己的溫度，一點一點給出去。"],["p","孩子長大了，不會記得這一夜。她也不需要孩子記得。"],["p","好，畫面先停著。現在我要告訴你，這個畫面是誰畫的。"],["p","不是一位詩人，也不是一位母親。"],["p","是一個男人。一個剛被人用棍子打過、剛被人連夜送出城的男人。"],["p","他是使徒保羅。他畫的，是他自己。"],["q","「只在你們中間存心溫柔，如同母親乳養自己的孩子。」（2:7）"],["p","「母親」，原文是 τροφὸς，乳母，就是餵奶的那一位。"],["p","「乳養」，原文是 θάλπῃ，用體溫捂熱。母鳥張開翅膀伏在小鳥身上，就是這個字。"],["p","這一章有三個詞：膽，乳，冠。"],["p","我們沿著它走三步：討神喜歡，母親與父親，冠冕是人。"],["q","第一步：討神喜歡。"],["p","要看懂那個畫面，先要知道保羅是從哪裡走到那張床邊的。"],["p","使徒行傳講義第十七章講過："],["p","他在帖撒羅尼迦，只講了三個安息日，就被連夜送走。"],["p","他一走，城裡就有人說閒話：那個人講得好聽，一出事就跑了。"],["q","「弟兄們，你們自己原曉得我們進到你們那裡並不是徒然的。」（2:1）"],["p","「不是徒然的」，原文是「不是空的」。那一趟，沒有空手而回。"],["p","證據在哪裡？保羅沒有寄履歷表。"],["p","證據就是讀信的人：你們還在，你們還信。"],["p","接著，他輕輕提了一句別的城。"],["q","「我們從前在腓立比被害受辱，這是你們知道的」（2:2）"],["p","使徒行傳講義第十六章講過那一夜：剝了衣裳，用棍打，兩腳上了木狗。"],["p","可是保羅寫信的時候，只用兩個詞帶過：被害，受辱。"],["q","一個講自己傷口講太多的人，會把聽眾的眼睛留在自己身上。"],["p","傷還沒好，他就到了下一座城，「然而還是靠我們的神放開膽量」。"],["p","膽量不是他的性格，是從神來的。膽量也不是不怕，是怕了，還開口。"],["p","也許你這個禮拜剛被家人說了幾句，或者在公司因為信仰吃了虧。"],["p","請你聽：受辱不等於失敗，被趕走也不等於白來。"],["p","那個年代，城裡常有巡迴的演說家。講得動人，收了錢，風聲一緊就走。"],["p","保羅連夜走了，很容易被歸成同一類。"],["q","「我們的勸勉不是出於錯誤，不是出於污穢，也不是用詭詐。」（2:3）"],["p","「詭詐」這個字，原來是釣魚的餌。外面是食物，裡面是鉤子。"],["p","傳福音最大的試探，就是把福音當餌。保羅說：我們不釣人。"],["q","「不是要討人喜歡，乃是要討那察驗我們心的神喜歡。」（2:4）"],["p","「察驗」，原本是試驗金子成色的字。神一直在驗。"],["p","這不是壓力，是自由。只要向一位交帳，就不必向一千位演戲。"],["p","這不是說可以不在乎人。等一下你會看見，保羅有多在乎。"],["p","在乎人，是愛。討好人，是怕。"],["p","然後保羅攤開三樣東西。"],["p","一樣是嘴：諂媚的話。一樣是錢：藏在外衣底下的貪心。"],["p","一樣是名：「沒有向你們或向別人求榮耀」。"],["p","講話時偷看台下的臉色；講得屬靈，心裡算的是奉獻；做得辛苦，等一句「你好棒」。"],["p","它們不一定是大罪，可是有一個共同點：把自己放回中心。"],["p","然後是這一句。整章就在這裡轉彎。"],["q","「我們作基督的使徒，雖然可以叫人尊重」（2:6）"],["p","「可以叫人尊重」，原文是可以有分量。"],["p","可以擺使徒的架子，也可以要求教會供養。"],["p","保羅兩樣都放下了。他不是沒有資格，是有資格，而不用。"],["q","沒有權柄的人不擺架子，不算謙卑；有權柄的人把權柄放下，才是。"],["p","那麼，一個可以有分量的人，把分量放下以後，去了哪裡？"],["p","他沒有走到更高的地方。他走到了嬰兒床邊。"],["q","第二步：母親與父親。"],["p","我們回到開頭那個畫面。現在你知道，那個母親是誰了。"],["p","在原文，「可以叫人尊重」和「存心溫柔」是同一句話。"],["p","上半句，是一個可以壓人的使徒。下半句，是一個餵奶的母親。"],["p","「溫柔」這兩個字，古抄本有一點不同：有的是 ἤπιοι，溫柔；有的是 νήπιοι，嬰孩。"],["p","只差一個字母。本講義照和合本讀「溫柔」，議題頁有細講。"],["p","可是兩個讀法，落點是一樣的："],["q","有權柄的人，選擇了最小、最軟的位置。"],["p","而且是「在你們中間」，不是在你們上面。"],["p","是乳養「自己的」孩子。不是雇來的奶媽，是親生的母親。"],["p","母親餵奶，有幾件事省不了。"],["p","要坐下來，站著趕時間餵不好。要把孩子抱近，隔著桌子餵不了奶。"],["p","要配合孩子的節奏，不是配合自己的行程。"],["p","一間只有三個安息日大的嬰孩教會，保羅給他們的第一樣東西，不是規條，是溫度。"],["p","新朋友第一次來聚會，需要的常常不是一整套課程。"],["p","是有人記得他的名字，陪他吃一頓飯，他半夜傳訊息時，有人回一句。"],["q","溫柔不是軟弱，是有力量的人，願意放慢腳步。"],["p","然後，保羅說出了這個畫面的代價。"],["q","「我們既是這樣愛你們，不但願意將神的福音給你們，連自己的性命也願意給你們，因你們是我們所疼愛的。」（2:8）"],["p","「這樣愛你們」，原文是一個全本新約只出現一次的字。"],["p","有學者說，是哄孩子的口氣。"],["p","福音可以像快遞一樣送到：簽收，拆封，讀完。"],["p","保羅說，我們不是這樣傳的。我們是連人帶福音，一起給你們。"],["q","福音是神的；但福音走進一個人心裡的那條路，常常是另一個人的生命鋪出來的。"],["p","國度321空中團契常說「無己」。這一節，就是它在本卷的本文。"],["p","保羅在這封信裡有情緒，有渴想，會掛念到「不能再忍」。他不是沒有自己。"],["q","無己不是沒有自己，是把自己給出去。"],["p","也請你看給的方向：是父母給孩子，不是孩子給父母。"],["p","保羅沒有說，你們要把性命交給我們。他說，我們把性命給你們。"],["p","還有，給出去不是燒完。一個累垮了的母親，是餵不了孩子的。"],["q","「弟兄們，你們記念我們的辛苦勞碌，晝夜做工，傳神的福音給你們，免得叫你們一人受累。」（2:9）"],["p","保羅是織帳棚的。請你想像那個作坊：天還沒亮，他已經在縫線。"],["p","有人來買帳棚，他一邊量尺寸，一邊講耶穌。"],["p","不收錢，不是收錢不屬靈。"],["p","是這群剛離棄偶像的人正在受逼迫，城裡又有人說他是來騙錢的。"],["p","「受累」這個字，和「有分量」是同一個字根。"],["q","他可以有分量，卻不肯成為別人的重量。"],["p","所以你一邊上班一邊帶小組，請你知道：你的辦公桌，也可以是講台。"],["p","母親之後，保羅換了一個畫面。"],["q","「你們也曉得，我們怎樣勸勉你們，安慰你們，囑咐你們各人，好像父親待自己的兒女一樣」（2:11）"],["p","母親重在溫度，父親重在方向。孩子要學走路了，旁邊要有人說話。"],["p","勸勉，是推一把。安慰，是對灰心的人輕聲說話。囑咐，是把話說重，說清楚。"],["p","對軟弱的孩子不下重話，對任性的孩子不只是哄。"],["p","而且是「各人」，原文是一個一個地。保羅認得每一張臉。"],["q","「要叫你們行事對得起那召你們進他國、得他榮耀的神。」（2:12）"],["p","對得起的是神，不是對得起保羅。"],["p","屬靈父親把孩子帶到神面前，自己就退到一邊。"],["p","他的權柄，是可以讓人檢驗的：「有你們作見證，也有神作見證」。"],["p","不肯被檢驗的權柄，不是父親的權柄。"],["p","弟兄姊妹，講到這裡，我要很小心地說幾句話。"],["p","321 常講屬靈父母兒女。這幅畫是真的，也是全本新約最溫柔的一幅。"],["p","可是越溫柔的畫，越容易被人拿反。"],["p","保羅的父母權柄是用來餵養的，不是用來壓人的。"],["p","母親餵奶的目標，是孩子有一天不必再吃奶。下一章保羅說："],["q","「你們若靠主站立得穩，我們就活了。」（3:8）"],["q","屬靈父母的成功，是孩子站穩；不是孩子離不開。"],["p","如果有一個關係，讓你越來越不敢自己讀經、自己禱告、自己判斷，"],["p","如果有人用「屬靈遮蓋」的名義，要你絕對順服，不准提問，"],["p","那已經離開了第二章的母親和父親。請你找一位信得過的人，說出來。"],["p","保羅在信的末了，還要教會凡事察驗。講台也在裡面，包括今天這一篇。"],["p","如果你是帶人的人，這一段要問的不是「多少人跟著我」，是「我把甚麼給出去了」。"],["p","母親餵了，父親也教了。可是孩子能不能長大，還要看一樣東西。"],["p","那一樣，不在保羅手裡。"],["q","第三步：冠冕是人。"],["p","保羅花了十二節講自己怎樣傳、怎樣活。"],["p","到第十三節，他把功勞一把推開。"],["q","「這道實在是神的，並且運行在你們信主的人心中。」（2:13）"],["p","「運行」是現在式，沒有停過。"],["p","創辦人被趕走了，他們手上只剩下聽過的道，和這一封信。保羅說：夠了。"],["q","傳道人會離開，道不會離開。"],["p","今天身邊沒有牧者、手上只有一本聖經的弟兄姊妹，這一句是給你的。"],["p","道在他們心裡做工，是甚麼樣子？不是一帆風順。是受了苦，還站著。"],["q","「因為你們也受了本地人的苦害，像他們受了猶太人的苦害一樣。」（2:14）"],["p","「本地人」，原文是自己的鄉親。最痛的逼迫，常常是最近的人給的。"],["p","信了耶穌，被說不孝、背祖；過年回家，成了一年裡最難走的一段路。"],["p","保羅沒有叫他們反擊，也沒有叫他們跟家人斷絕。"],["p","他把他們放進一條更長的隊伍：在你們以前，已經有人這樣走過。"],["p","用改變了的生命代替對抗，用孝順作見證。"],["q","「這猶太人殺了主耶穌和先知，又把我們趕出去。」（2:15）"],["p","弟兄姊妹，這是新約最常被誤用的經文之一。"],["p","歷史上有人拿它當仇恨與屠殺的理由。"],["p","所以我要把三件事放在桌上，讓經文自己說話。"],["p","一件是：寫這句話的保羅，自己就是猶太人。他為同胞說過："],["q","「為我弟兄，我骨肉之親，就是自己被咒詛，與基督分離，我也願意。」（羅 9:3）"],["p","一件是：前一節的榜樣，正是猶太地的教會，一群猶太人基督徒。"],["p","還有一件：這一串話，說的是做了這些事的人。殺主，趕走使徒，攔阻福音。"],["q","說的是逼迫者，不是一個民族。"],["p","第十六節「神的忿怒」，「神的」是和合本補的小字，原文只說「那忿怒」。"],["p","補得沒錯，只是保羅說得含蓄。"],["p","神忍耐，給時間；攔阻別人得救，卻是把罪的量杯一直往上填。"],["p","這原則對誰都一樣，對教會也一樣。"],["q","「我且說，神棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）"],["p","如果今天有一位猶太朋友坐在我們中間，他不該覺得自己被當成敵人。"],["p","任何民族都不該。"],["p","保羅寫這幾句時，一定記得自己從前也是逼迫教會的人。"],["p","所以讀這兩節，不是指著別人，是低下頭問："],["p","我有沒有用手上的權力，攔住了別人親近神？"],["q","「弟兄們，我們暫時與你們離別，是面目離別，心裡卻不離別」（2:17）"],["p","「離別」，原文的字根是「孤兒」。"],["p","一章之內，保羅是母親，是父親；現在，成了孤兒。"],["p","被奪走孩子的父母，也是孤兒。"],["p","又是夜裡。開頭那個母親，在夜裡把孩子抱近；這一夜，孩子從他懷裡被抱走。"],["p","可是距離拆得開臉，拆不開心。"],["p","我們是空中團契，散在好幾個國家，常常只能在線上見面。"],["p","見不到面，不等於不在一起。"],["q","「我－保羅有一兩次要去，只是撒但阻擋了我們。」（2:18）"],["p","「阻擋」，原文是在路上挖斷。"],["p","是撒但攔阻，還是神關門？保羅沒有給公式，常常要回頭才看清。"],["p","可是他的反應很清楚："],["p","不怪人，不自責，也不停止愛。"],["p","去不了，就寫信，就打發提摩太去。"],["q","撒但能挖斷保羅的路，挖不斷保羅的心。"],["p","然後，全章最低的地方，緊接著全章最高的地方。"],["q","「我們的盼望和喜樂，並所誇的冠冕是甚麼呢？豈不是我們主耶穌來的時候、你們在他面前站立得住嗎？」（2:19）"],["p","「來的時候」，原文是 παρουσίᾳ，君王駕臨一座城，全城出去迎接。"],["p","這是本卷第一次出現。"],["p","「冠冕」，不是王冠，是勝利者頭上的花冠。"],["p","「站立得住」，是和合本補的小字。原文只說：豈不就是你們嗎？"],["p","補得合乎文意。可是原文的重點是：你們就是。"],["p","不是等你們表現夠好才算數。"],["q","「因為你們就是我們的榮耀，我們的喜樂。」（2:20）"],["p","那一天，保羅要帶到主面前的，不是講過幾堂道，是一張一張的臉。"],["q","保羅的冠冕是人。"],["p","主一定會回來。保羅提這件事，不是要排時間表，是給一個被拆散的家一個重逢的日子。"],["p","弟兄姊妹，我們最後一次，回到那個畫面。"],["q","夜裡，一盞小燈。一個母親，用自己的體溫捂著孩子。"],["p","保羅說，那就是我。可是他知道，自己不是第一個這樣做的人。"],["q","「領受真道就效法我們，也效法了主」（1:6）"],["p","保羅會餵人，因為他先被餵過。"],["p","他願意把性命給出去，因為有一位，先把性命給了他。"],["q","「他替我們死，叫我們無論醒著，睡著，都與他同活。」（5:10）"],["p","那一天迎接我們的，是主耶穌自己。"],["p","不是一位要算帳的陌生人，是一個家終於團圓。"],["p","所以你不必更佩服保羅，也不必更佩服今天台上的人。"],["q","只要更愛那一位，先用自己的生命捂熱了你的主。"],["p","這個禮拜，請你想一個剛來聚會的人。記得他的名字，陪他吃一頓飯。"],["p","如果你正被家人反對，覺得自己像一個孤兒，請你記得："],["p","面目離別，心裡卻不離別。"],["p","我們一起低頭禱告。"]]},"3":{"min":16,"blocks":[["h","《你們若靠主站立得穩，我們就活了》"],["p","弟兄姊妹平安，今天我們一起讀帖撒羅尼迦前書第三章。"],["p","請你跟我走一趟，到兩千年前的雅典。"],["q","雅典，午後。大理石的廊柱，市場上的人聲，滿街都是神像。"],["p","有一個人，在這座城裡走來走去。"],["p","先是帖撒羅尼迦，暴動，有人闖進耶孫的家。弟兄們趁著夜裡，把他送走。"],["p","再是庇哩亞，又起了風波。弟兄們又把他往海邊送。"],["p","現在，他一個人。"],["q","「保羅在雅典等候他們的時候，看見滿城都是偶像，就心裡著急」（徒 17:16）"],["p","他的眼睛看著雅典，他的心，一直望著北方的那條路。"],["p","那條路的盡頭，是帖撒羅尼迦。"],["p","那裡有一群他只陪了幾個禮拜的人。"],["p","剛剛離棄偶像，剛剛被鄰居打，剛剛失去了帶他們信主的人。"],["p","他們還好嗎？還在嗎？還信嗎？"],["p","然後，我們換一個地方。"],["q","哥林多，幾個月以後。一間做帳棚的作坊，皮革的味道，針線，還有一盞油燈。"],["p","門外有腳步聲。"],["p","一個年輕人走進來，滿身塵土，鞋子都磨破了。"],["p","是提摩太。"],["p","保羅放下手上的針。他還沒有開口，心已經提到喉嚨。"],["p","他們說了甚麼，我們不知道。"],["p","可是我們知道，保羅聽完以後，拿起筆，寫下了這一句："],["q","「你們若靠主站立得穩，我們就活了。」（3:8）"],["p","這一句，是整封帖撒羅尼迦前書的樞紐。"],["p","這一章有三個字：忍，穩，增。"],["p","我們沿著它走三步：不能再忍，我們就活了，愛的增長。"],["q","第一步：不能再忍。"],["q","「我們既不能再忍，就願意獨自等在雅典」（3:1）"],["p","他說：我撐不住了。"],["p","「不能再忍」，原文 μηκέτι στέγοντες。"],["p","στέγω 這個字，和「屋頂」是同一個字根。屋頂的工作，是擋住風雨，承受得住。"],["p","保羅說：我心裡那一片屋頂，撐不住了。"],["q","寫下全卷最穩的那一句話的人，先承認自己撐不住了。"],["p","屬靈的父母，也有承受的極限。承認這個極限，不是失敗，也不是信心不夠。"],["p","可是撐不住的他，身邊只剩下一個同伴。他把這唯一的同伴，送走了。"],["q","「打發我們的兄弟在基督福音上作神執事的提摩太前去，堅固你們，並在你們所信的道上勸慰你們」（3:2）"],["p","他選擇「獨自」。原文那個「獨自」，放在句子的最後一個字。最重。"],["p","孤單，是他自己付的代價。好讓那群孩子，不孤單。"],["p","他給提摩太兩個身分。第一個是：「我們的兄弟」。"],["p","第二個，和合本是「作神執事的」。不少古卷寫的是「神的同工」，和合本的小字註腳也記著。"],["p","多數學者認為「神的同工」是原來的讀法。兩種讀法，議題頁都有整理。"],["p","我們 321 說「235」，那個「2」，是屬靈的同伴。同伴不是助手，是同工。"],["p","提摩太去做兩件事：堅固，勸慰。"],["p","「勸慰」這個字，原文是兩個部分拼起來的：「旁邊」，加上「呼喚」。"],["q","勸慰，就是走到一個人旁邊，叫他的名字。"],["q","受苦的人最先需要的，不是一篇講章。是一個被打發來的人。"],["p","今天，教會裡有一位肢體在苦中，我們的第一個反應常常是：寄一段經文給他。"],["p","經文很好。可是有時候，更好的是：派一個人去，坐在他旁邊。"],["q","「免得有人被諸般患難搖動。因為你們自己知道，我們受患難原是命定的。」（3:3）"],["p","「搖動」，原文 σαίνεσθαι。全本新約，只用了這一次。"],["p","這個字，原來是說一隻狗，對著主人搖尾巴。"],["p","外面，有人用拳頭搖你。旁邊，有人用好話哄你。"],["p","「回來吧。何必呢？拜一拜又不會怎樣。」"],["p","苦難從外面搖，諂媚從旁邊哄。保羅說：一個也不要被搖走。"],["p","然後是這一章最重的一句話：「我們受患難原是命定的。」"],["p","「命定」，原文 κείμεθα，意思是「被安放」。我們被放在這個位置上。"],["q","「我們在你們那裡的時候，預先告訴你們，我們必受患難，以後果然應驗了，你們也知道。」（3:4）"],["p","「預先告訴」，原文的時態，是一說再說。他不是只提過一次。"],["q","信耶穌，不保證一帆風順。可是保證：你不是一個人受苦。"],["p","這一節，我必須很小心地講。因為它最容易被用錯，而且錯得很傷人。"],["p","三章三節說的患難，是為福音受的苦。"],["p","因為信主，因為跟隨基督，而來的壓力。"],["p","它不是家暴。不是虐待。"],["p","不是職場霸凌。也不是任何讓你身體、心靈處在危險裡的關係。"],["p","如果有人對一位被打的姊妹說：「這就是你命定要受的患難，回去忍耐。」"],["q","那不是帖撒羅尼迦前書三章三節。那是把一節經文，變成了一道鎖。"],["p","如果你今天就在這樣的處境裡，請你聽清楚：離開危險，尋求保護，找信得過的人和專業的幫助，不是沒有信心。"],["p","保羅沒有說：沒有被逼迫，就不是真基督徒。"],["p","他也沒有叫人去激怒官府，去和家人吵翻。"],["p","苦難來了，就面對它。它不是勳章，不必去找。"],["p","有一種講法說：你真的信，神就讓你健康、發財、事事順利。"],["p","保羅沒有對帖撒羅尼迦人說：你們受苦，是因為信心不夠。"],["p","他說：這是我們被安放的位置。"],["p","被安放，就有一位安放的人。他知道你在哪裡。"],["q","被安放的人，不是棄子。是被看守的人。"],["p","所以保羅說完「命定」，接著說的不是「忍一忍」，是「我打發提摩太去」。"],["p","神把人安放在苦裡，也把人安放在受苦的人身邊。"],["p","也許你是剛信主的人，家裡的人罵你「不要祖宗了」。"],["p","請你不要和他們對打。用一個改變的生命，回答他們。"],["p","更孝順，更體貼，更願意回家吃飯。你的孝順，就是你最好的見證。"],["q","「為此，我既不能再忍，就打發人去，要曉得你們的信心如何，恐怕那誘惑人的到底誘惑了你們，叫我們的勞苦歸於徒然。」（3:5）"],["p","他怕的不是人數變少，是「你們的信心如何」。"],["p","逼迫從前門打進來。那誘惑人的，從後門溜進來。"],["p","真信徒會不會離開信仰？這個問題，神學家討論了兩千年，議題頁有整理。"],["p","可是保羅在這裡，沒有給一套理論。他給的，是一個父親的反應：打發人去。"],["q","不要讓任何一個人，獨自面對試探。"],["p","「勞苦歸於徒然」：我花了這麼多力氣，會不會全白費了？每一個服事過的人，心裡都聽過這個聲音。"],["p","所以，雅典那個望著北方的人，心裡掛著的，就是這一句：會不會白費了？"],["p","然後，他到了哥林多。然後，作坊的門打開了。"],["q","第二步：我們就活了。"],["q","「但提摩太剛才從你們那裡回來，將你們信心和愛心的好消息報給我們」（3:6）"],["p","「剛才」，原文 Ἄρτι，就是「剛剛」。"],["p","請你再聽一個字。「報給我們」，原文 εὐαγγελισαμένου。"],["p","保羅用「傳福音」這個字，來說提摩太帶回來的消息。"],["q","當初，保羅把福音帶到帖撒羅尼迦。如今，提摩太把帖撒羅尼迦的福音，帶回給保羅。"],["p","一間教會還站著，本身就是一個好消息。"],["p","提摩太報了三件事。信心還在。愛心還在。"],["q","「又說你們常常記念我們，切切地想見我們，如同我們想見你們一樣。」（3:6）"],["p","保羅是被連夜送走的，可是孩子們沒有怨他。他們還記得他，還想見他。"],["p","可是這一份好消息裡，少了一樣東西。"],["p","提摩太報了信心，報了愛心。盼望，沒有報。"],["p","為甚麼？"],["p","我們到第四章就會明白。教會裡有人過世了，他們不知道，死了的人在主來的時候會怎樣。"],["q","「所以，弟兄們，我們在一切困苦患難之中，因著你們的信心就得了安慰。」（3:7）"],["p","第二節，提摩太是去「勸慰」他們的。第七節，卻是保羅自己「得了安慰」。"],["q","本來是父母安慰孩子。現在，是孩子安慰了父母。"],["p","我們 321 說建立屬神的體系，就是這樣運作的：彼此勸慰，互相建立。"],["p","「一切困苦患難之中」——困苦還在，患難也還在。改變的，是他心裡有了一股氣。"],["q","「你們若靠主站立得穩，我們就活了。」（3:8）"],["p","「我們就活了」，原文是 νῦν ζῶμεν：現在，我們活了。"],["p","屬靈父親的生命，掛在孩子站不站得住。"],["p","「站立得穩」，原文 στήκετε，就是站住、站定。"],["p","全卷五章是一個孩子的成長：第一章出生，第二章被餵養，到了第三章，他自己站起來了。"],["p","做過父母的人都記得那一天。孩子鬆開你的手指，搖搖晃晃，站住了。"],["p","請你留意，站著的人是誰。是「你們」。"],["p","保羅不在，提摩太也走了。沒有人扶著他們。他們自己站著。"],["q","屬靈父母最大的成就，不是孩子離不開你。是你不在的時候，他們仍然站得住。"],["p","帶領人可以問自己：我的喜樂，是建立在人需要我，還是建立在人站在主裡？"],["p","一個像保羅的帶領人，會因為孩子在他不在的時候站穩了，而說：「我們就活了。」"],["p","還有兩個字，不能漏掉：「靠主」。原文是「在主裡」。"],["p","站得穩，不靠腿力，靠地面。"],["q","「我們在神面前，因著你們甚是喜樂；為這一切喜樂，可用何等的感謝為你們報答神呢？」（3:9）"],["p","保羅問：我能拿甚麼還給神？答案是：怎麼謝都不夠。"],["p","孩子站穩了，功勞不在父母，在那一位托住地面的神。"],["p","可是下一句，保羅沒有說：「好了，這樣就夠了。」"],["q","「我們晝夜切切地祈求，要見你們的面，補滿你們信心的不足。」（3:10）"],["p","這是一間站穩了的教會，也是一間信心還有缺口的教會。"],["p","兩件事，同時成立。"],["p","「補滿」，原文 καταρτίσαι。這是漁夫補網的字。"],["p","漁夫看見網破了，不會罵網。他坐下來，一個洞一個洞地補。"],["q","信心有缺口，不是被定罪的理由。是被修補的地方。"],["p","如果你今天覺得，自己的信心這裡破一個洞，那裡漏一個角，"],["p","請你不要急著責備自己。保羅不是寫信罵他們，他是晝夜為他們禱告。"],["p","白天縫帳棚，晚上為一張一張的臉禱告。"],["p","第三章的最後三節，他不再對帖撒羅尼迦人說話。他轉過身，向神說話。"],["q","第三步：愛的增長。"],["q","「願神－我們的父和我們的主耶穌一直引領我們到你們那裡去。」（3:11）"],["q","「我－保羅有一兩次要去，只是撒但阻擋了我們。」（2:18）"],["p","他試過，沒有成功。到了這裡，他不再說「我要再試一次」。他把這條路交出去。"],["p","「引領」這個字，原文是把路修直。被攔住的路，交給神修直。"],["p","主詞有兩個：「神我們的父」，和「我們的主耶穌」。動詞，卻只有一個，而且是單數。"],["p","這些人剛從滿城神像的世界走出來，才認識獨一的神。"],["p","保羅卻在新約最早的書信之一裡，毫不猶豫地，把耶穌放在這位神的身邊，一同開路。"],["p","也許你今天也有一條被攔住的路。"],["p","三章十一節教我們的，不是硬闖，也不是放棄。"],["p","是把那一條路說出來，交給父與子。然後在等候裡，做手上能做的事。"],["q","「又願主叫你們彼此相愛的心，並愛眾人的心都能增長，充足，如同我們愛你們一樣」（3:12）"],["p","保羅為一間被逼迫的教會禱告，求的是甚麼？"],["p","不是求逼迫的人受報應，也不是求教會躲起來。"],["p","他求他們的愛，多起來。"],["p","「增長，充足」，原文是兩個意思很接近的字，疊在一起：πλεονάσαι καὶ περισσεύσαι。"],["q","像水漲了，又漲，漫過了堤岸。"],["p","愛有兩個方向：「彼此相愛」，也「愛眾人」。"],["p","愛，沒有圈內圈外。"],["p","這不是叫受苦的人假裝沒事，也不是叫他們回到危險裡。"],["p","愛眾人，不等於讓人一直傷害你。"],["p","是叫他們不要被苦難變成一個硬心的人。"],["q","逼迫可以把一間教會打散，也可以把它打硬。保羅求主，讓它變大。"],["q","「好使你們當我們主耶穌同他眾聖徒來的時候，在我們父神面前，心裡堅固，成為聖潔，無可責備。」（3:13）"],["p","「心裡堅固」，又是那個字：στηρίξαι。"],["p","第二節，提摩太被打發去「堅固」他們。第十三節，保羅求主「堅固」他們的心。"],["q","這一章，從人去堅固開始，在主親自堅固結束。"],["p","「無可責備」，不是說從來沒有破洞。第十節剛說過，信心還有不足。"],["p","是補好了，站穩了，在主來的那一天，可以抬起頭來。"],["p","「同他眾聖徒」，指的是天使，還是已經睡了的信徒？各家看法不同，議題頁都有陳列。"],["p","弟兄姊妹，最後，我們回到雅典。"],["p","那個站在滿城偶像中間，一直望著北方那條路的人。"],["p","他很想回去，卻去不了。"],["p","所以他只能打發人：打發提摩太，寫一封信，晝夜禱告。"],["p","可是第三章最後一節，說到另一位。"],["p","「我們主耶穌……來的時候」。這個「來」，原文是 παρουσίᾳ，就是「親自在場」。"],["q","保羅去不了，只能打發人去。可是有一位，不打發別人。他要親自來。"],["p","保羅等的，是提摩太回來。帖撒羅尼迦人等的，是主耶穌從天降臨。"],["p","這一位，不會被撒但攔住，也不必打發別人。"],["p","他要親自來，看見他的孩子心裡堅固，站在父面前。"],["p","主耶穌給的，比提摩太更多。他把自己給了我們，而且他一定會回來。"],["p","所以你今天如果撐不住了，可以像保羅一樣說出來。"],["p","如果你身邊有一個人撐不住了，請你做那個被打發去的提摩太。"],["p","這個禮拜，第一件，想一位最近在苦中、而你很久沒聯絡的弟兄姊妹。"],["p","不要只寄一段經文。打一通電話，或者約他喝一杯茶，坐在他旁邊。"],["p","第二件，想一位你曾經帶過、扶過的人。"],["p","如果他今天還站在主裡，請你為他感謝神。"],["p","如果他的網破了，請你為他晝夜禱告。"],["p","我們一起低頭禱告。"]]},"4":{"min":18,"blocks":[["h","《神的旨意就是要你們成為聖潔》"],["p","弟兄姊妹平安，今天我們一起讀帖撒羅尼迦前書第四章。"],["p","我想先帶你到一個很安靜的地方。"],["q","一場追思禮拜。台前放著一具棺木，旁邊是一張放大的照片。"],["p","詩歌唱完了，司會請大家安靜一分鐘，為家屬禱告。"],["p","就在那一分鐘裡，第一排有一個五歲的小男孩，拉了拉媽媽的袖子。"],["p","他沒有壓低聲音。整個會堂都聽見了。"],["q","「媽媽，阿公還會醒嗎？」"],["p","然後，是一段很長的沉默。"],["p","媽媽沒有回答。她只是把孩子抱緊，眼淚一直掉。"],["p","坐在後面的我們，也沒有一個人開口。"],["p","不是因為我們不知道答案。是因為那一刻，答案太重，一句話扛不起來。"],["q","那一段沉默，你也許聽過。也許，你就是那個說不出話的人。"],["p","兩千年前，在帖撒羅尼迦，也有過一段一樣的沉默。"],["p","那是一間只有幾個月大的教會。創辦人保羅被趕走了，他們手上只有一封信。"],["p","就在這幾個月裡，教會裡有人過世了。"],["p","這群剛剛離開偶像的人，第一次站在一位弟兄的墳前。"],["p","他們心裡的問題，和那個小男孩一模一樣：他還會醒嗎？"],["p","保羅在這一章的後半，回答了這個問題。我們今天會走到那裡。"],["p","可是請你留意，保羅沒有從墳前開始。"],["p","他先從走路開始。"],["q","「弟兄們，我還有話說」（4:1）"],["p","從第四章開始，他要教這群孩子怎樣過日子。"],["p","這一章有三個字：聖，靜，遇。"],["p","我們沿著它走三步：神的旨意，拚命去安靜，還會再見面。"],["q","第一步：神的旨意。"],["q","「知道該怎樣行可以討神的喜悅，就要照你們現在所行的更加勉勵。」（4:1）"],["p","「行」這個字，原文 περιπατεῖν，就是走路。"],["p","這一卷書，講的是一個孩子的成長。第一章出生，第二章被餵養，第三章站起來。"],["p","第四章，孩子要學走路了。"],["p","一位父親教孩子學步。孩子搖搖晃晃跨出一步，他不會說：「走得真差。」"],["p","他會拍手，然後說：「再來一步。」"],["p","保羅就是這樣開口的。「照你們現在所行的」，意思是：你們已經在走了。"],["p","「更加勉勵」，原文是滿出來。做得好的孩子，被邀請走得更遠。"],["p","然後，保羅說了一句很多人找了一輩子的話。"],["q","「神的旨意就是要你們成為聖潔，遠避淫行」（4:3）"],["p","我們常常為神的旨意禱告：念哪一科？換哪一份工作？跟誰結婚？"],["p","這封信直接說「神的旨意」，只有兩次。一次在這裡，一次在第五章，「凡事謝恩」。"],["p","兩次都不是告訴你要去哪裡。是告訴你，要成為甚麼樣的人。"],["q","神最在乎的，不是你站在哪個位置，是你在那個位置上成為誰。"],["p","而這個「成為」，包括身體。"],["p","帖撒羅尼迦是一座港口大城。男人在婚姻以外找女人，社會幾乎不過問。"],["p","保羅沒有含糊。「淫行」這個字，涵蓋婚姻以外一切的性。"],["p","今天的帖撒羅尼迦，不在希臘。它在每一支手機裡。"],["p","同居、婚外情、色情網站，講台要講，而且要講清楚，因為這是神明說的旨意。"],["p","可是怎樣講，和講不講一樣要緊。"],["p","「聖潔」，原文 ἁγιασμὸς，是一個過程，不是一張只能用一次的證書。"],["p","所以，請不要用「你已經不純潔了」這種話，把一個人定終身。"],["q","聖潔的道，要講到讓人想回家，不是讓人想躲起來。"],["p","第四節有一個字，歷代的讀法不太一樣。"],["q","「要你們各人曉得怎樣用聖潔、尊貴守著自己的身體」（4:4）"],["p","「身體」，原文是 σκεῦος，器皿。和合本讀成身體。"],["p","也有人讀成娶妻，因為彼得也稱妻子是器皿。議題頁兩種讀法都有整理。"],["p","可是兩種讀法，落點是一樣的："],["q","性不是拿來用的，是放在尊重裡的。"],["p","「尊貴」這兩個字很要緊。身體不是骯髒的。身體有價值，所以要被尊重。"],["p","接下來第六節，翻轉了很多人對性的罪的想像。"],["q","「不要一個人在這事上越分，欺負他的弟兄」（4:6）"],["p","我們常常把這方面的罪，想成「髒了」的問題。"],["p","可是保羅在這裡用的，是兩個講不公義的字。"],["p","「越分」，原文 ὑπερβαίνειν，是跨過一條不該跨的線。"],["p","「欺負」，原文 πλεονεκτεῖν，是多拿，拿走不屬於你的東西。"],["p","婚外情拿走的，是另一個家的信任。"],["p","用哄騙、用職位、用年紀的落差得來的性，拿走的是另一個人的身體和尊嚴。"],["p","所以這一節，也包括權勢性侵和性暴力。"],["p","這裡，我必須說得非常清楚。"],["q","錯在越界的那一方。被侵害的人，不是不聖潔的人。"],["p","他不需要為別人的罪悔改。"],["p","我們不可以對他說「你自己也有責任」，也不可以用「要饒恕、不要張揚」，把事情壓下去。"],["p","「主必報應」，原文是「主是伸冤者」。"],["p","這句話先是對受害的人說的：你的冤屈，神看見了。他站在你這一邊。"],["p","如果你今天坐在這裡，心裡有一段一直不敢說出口的經歷，"],["p","聚會以後，你可以單獨來找我，或找一位你信得過的同工。"],["p","我們會先相信你，陪著你，也會協助你找專業的輔導和法律的幫助。"],["p","教會要保護的，是受傷的人。不是誰的名聲，也不是教會的面子。"],["p","那麼，一個孩子要怎樣學會聖潔地走路？靠咬緊牙關嗎？"],["q","「所以，那棄絕的，不是棄絕人，乃是棄絕那賜聖靈給你們的神。」（4:8）"],["p","請留意，保羅在這裡把自己移開了。"],["p","「不是棄絕人」，意思是：這不是保羅的規矩，也不是哪一位牧者的喜好。"],["p","所以這一節，不能拿來對人說：「你不聽我，就是不聽神。」"],["p","然後他說，神是「那賜聖靈給你們的神」。"],["p","「賜」，原文 διδόντα，是現在式：一直在賜。"],["p","神不是在你信主那一天，給了一次聖靈就走開。他今天還在給，明天也會給。"],["p","一位在這件事上反覆跌倒的弟兄姊妹，需要聽見的，不只是「你要努力」。"],["p","還有：那要你聖潔的神，親自住在你裡面，而且他不放棄你。"],["p","這封信的最後，保羅會這樣說："],["q","「那召你們的本是信實的，他必成就這事。」（5:24）"],["p","命令是給我們的。成就，是神的。"],["p","孩子學會走路，下一步，是走到別人身邊去。"],["p","所以保羅從一個人的身體，轉到了一家人。"],["q","第二步：拚命去安靜。"],["q","「論到弟兄們相愛，不用人寫信給你們；因為你們自己蒙了神的教訓，叫你們彼此相愛。」（4:9）"],["p","「蒙了神的教訓」，原文只有一個字：θεοδίδακτοί，神親自教的。"],["p","是神自己，教一群素不相識的人，彼此叫一聲「弟兄」。"],["p","保羅稱讚完，又說了第二次：「要更加勉勵」。"],["q","愛沒有及格線。做得好的，被邀請做得更多。"],["q","「又要立志作安靜人，辦自己的事，親手做工」（4:11）"],["p","「立志」，原文 φιλοτιμεῖσθαι，本來是愛面子、爭榮譽的字。"],["p","保羅把它和「安靜」，ἡσυχάζειν，綁在一起。"],["q","拚了命，去安靜。"],["p","為甚麼這樣說？可能有人想：主快要來了，何必上班？"],["p","保羅說：愛弟兄的人，會盡力不成為弟兄的重擔。"],["q","愛的樣子，包括不讓別人替你付帳。"],["p","保羅自己就是這樣。他在帖撒羅尼迦晝夜做工，用自己的手縫帳棚。"],["p","在一個看不起手工的城裡，他用一雙長了繭的手，給福音作了一張名片。"],["q","「叫你們可以向外人行事端正，自己也就沒有甚麼缺乏了。」（4:12）"],["p","「行事」，又是那個走路的字。"],["p","教會外面的家人、同事、鄰居，是先看我們怎樣走路，才聽我們說甚麼。"],["p","我也要說清楚兩件事。"],["p","「安靜」，不是不關心社會。基督徒當然要關心城市，關心公義；只是第一步，常常是先把手上的工作做好。"],["p","「親手做工」，也不是拿來責備失業的人。"],["p","保羅後來責備的，是「不肯」做工的人，不是「不能」做工的人。"],["p","失業的、生病的、在家照顧父母孩子的，是教會要扶一把的人，不是要被指指點點的人。"],["p","還有一件事：保羅剛講完怎樣做工，下一句，就講主的再來。"],["q","等候主的人，手上是有活兒的。"],["p","現在，我們要回到那一場追思禮拜了。"],["q","第三步：還會再見面。"],["q","「論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣。」（4:13）"],["p","請你仔細聽這一節。它在喪禮上，常常被讀錯。"],["p","有人對著哭泣的家屬說：「聖經說不要憂傷。你應該高興，他回天家了。」"],["p","可是保羅沒有這樣說。"],["p","這一節裡，也有一段沉默。保羅沒有說出口的那一句，就是「不要憂傷」。"],["q","他說的是：不要像那些沒有指望的人一樣憂傷。"],["p","問題不在眼淚。問題在盼望。"],["p","耶穌站在拉撒路的墳前。他明明知道，過一會兒就要叫拉撒路出來。"],["p","聖經還是記下了最短的一節："],["q","「耶穌哭了。」（約 11:35）"],["p","主自己都哭了。我們就不必要求任何人，在棺木前面忍住眼淚。"],["p","所以那位抱著孩子的媽媽，她的眼淚不是信心不夠。那是愛。"],["p","如果你最近送走了一位親人，今天你可以哭。在這裡哭，是安全的。"],["p","我也要對陪伴的人說一句：遇到喪親的家庭，先坐下來，陪著，不要急著解釋。"],["p","特別是失去孩子的、意外失去家人的、親人自己結束生命的家庭。"],["p","不要說「這是神的旨意」，也不要急著引經文。一起哭，比一篇道理更像福音。"],["p","需要的話，陪他們去找哀傷輔導。那不是信心軟弱，那是被好好照顧。"],["p","保羅給哭泣的人一個字。"],["p","「睡了的人」，原文是 κοιμάω，就是睡覺。"],["q","睡，是會醒的。"],["p","可是第十四節，有一個地方，保羅換了一個字。"],["q","「我們若信耶穌死而復活了，那已經在耶穌裡睡了的人，神也必將他們與耶穌一同帶來。」（4:14）"],["p","說到耶穌，保羅用的是「死」，ἀπέθανεν。"],["p","說到信徒，保羅用的是「睡」。"],["p","在這一節裡，真正的「死」，只用在耶穌一個人身上。"],["q","他替我們嚐了真正的死，所以我們的死，只是睡。"],["p","耶穌自己也這樣說過。拉撒路死了，他對門徒說："],["q","「我們的朋友拉撒路睡了，我去叫醒他。」（約 11:11）"],["p","那麼，睡了的人，現在在哪裡？"],["p","腓立比書講義第一章講過，保羅說他情願離世，與基督同在。"],["p","「在耶穌裡睡了」，意思是：死亡沒有把他們從耶穌裡面拿走。"],["p","他們不是漂泊的孤魂，也不需要後人供奉才能安息。他們在主那裡。"],["p","那麼，那些沒有信主就過世的親人呢？"],["p","保羅在這裡沒有討論。我們也不要替任何一個人下斷語，尤其不在家屬面前。"],["p","我們把他交在那位又公義、又慈愛的神手中。"],["p","清明掃墓、家裡祭祖的時候，基督徒不拜偶像，但可以盡孝，可以記念，可以感恩。"],["p","接著，保羅回答了帖撒羅尼迦人心裡最怕的一件事。"],["p","他們怕的是：先走的人，會不會錯過主再來的那一天？"],["q","「我們這活著還存留到主降臨的人，斷不能在那已經睡了的人之先。」（4:15）"],["p","先走的人不但不會錯過，他們還排在最前面。"],["q","「那在基督裡死了的人必先復活。」（4:16）"],["q","等得最久的人，先被叫醒。"],["p","保羅說「我們這活著的人」，把自己也算在裡面。"],["p","這不是他定了日子。他從來沒有說過，主哪一年回來。"],["p","這是一種姿態：每一代信徒，都活得像主可能在自己這一生回來。"],["q","「因為主必親自從天降臨，有呼叫的聲音和天使長的聲音，又有神的號吹響」（4:16）"],["p","是主親自。不是差一位天使來代表他。"],["p","這兩節帶來的，是平安，不是恐慌。"],["p","一位會親自回來的主，一定會親自照顧他那些先睡了的人。"],["p","然後，我們來到這一封信的最高點。"],["q","「以後我們這活著還存留的人必和他們一同被提到雲裡，在空中與主相遇。這樣，我們就要和主永遠同在。」（4:17）"],["p","全卷最低的一點，是第十三節的「沒有指望」。最高的一點，就是這一節。"],["p","中間，只隔了四節。保羅從墳前出發，一路把哭泣的人帶上山頂。"],["p","請你聽「和他們一同」這四個字。"],["p","那些你在喪禮上送走的人，那一天，會站在你身邊。"],["p","「相遇」，原文 ἀπάντησιν，是一個很有畫面的字。"],["p","當時，王要來到一座城，城裡的人會出城迎接，再陪著王一起進城。"],["q","這不是逃難。這是迎駕。"],["p","我們不是被救出火場的難民。我們是出城迎接王的城民。"],["p","被提是在大災難之前、之中，還是之後？千禧年又怎樣讀？"],["p","敬虔愛主的弟兄姊妹各有所持，議題頁都有整理。各派都是弟兄，講台不需要為此彼此攻擊。"],["p","經文自己的重點，不在路線圖。在最後那一句。"],["q","「這樣，我們就要和主永遠同在。」（4:17）"],["p","不是一座金城的描寫，也不是一張時間表。是一個關係：永遠和他在一起。"],["p","華人教會很熟悉另一種講法。"],["p","「被提的時候，你若沒有準備好，就會被留下來。」"],["p","可是那不是這段經文的語氣。"],["p","保羅寫這段話，對象是正在哭的人。他要安慰，不是恐嚇。"],["p","歷史上每一次有人宣布「某年某月主要來」，都落空了。每一次，都傷了一批最單純的信徒。"],["p","保羅在下一章，明明白白地說："],["q","「論到時候、日期，不用寫信給你們」（5:1）"],["p","他拒絕給時間表。他給的，是這一句："],["q","「所以，你們當用這些話彼此勸慰。」（4:18）"],["q","被提的經文，是寫來彼此勸慰的。"],["p","請你留意，保羅不是說「我來安慰你們」。他說「你們彼此」。"],["p","「勸慰」，原文 παρακαλεῖτε，是在旁邊扶一把。而且是現在式：一直扶下去。"],["p","這就是我們 321 說的「彼此勸慰，互相建立」：不是一個人扛，是一家人一起扶。"],["p","弟兄姊妹，我們回到那一場追思禮拜。"],["p","回到那一段沉默，和那一個問題。"],["q","「媽媽，阿公還會醒嗎？」"],["p","可是如果有一天，那個孩子再問一次，我們可以怎樣回答？"],["p","我想，我們可以先抱著他，一起哭。"],["p","然後，用保羅的話，輕輕地告訴他："],["q","會的。阿公只是睡了。他還會醒。我們還會再見面。"],["p","為甚麼這麼確定？不是因為我們生性樂觀。"],["p","是因為有一個人，曾經真的死了。"],["p","他被釘在十字架上，被放進墳墓。那不是睡，那是真正的死。"],["p","第三天，他從死裡復活了。"],["p","他替我們嚐了真正的死，所以屬他的人，只是睡。"],["p","他在拉撒路墳前流過淚，所以他懂得你在棺木前的眼淚。"],["q","先從死裡醒過來的那一位，會回來，叫醒他所愛的人。"],["p","那一天，我們會和先睡了的人一同，出城去迎接他。然後，永遠和他在一起。"],["p","所以，我們今天學走路，不是怕被扣分。是因為我們要去見的那一位，值得我們好好地走。"],["p","讀完這一章，請你問自己一個問題：我是更害怕主來，還是更想念主來？"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，想一位最近失去親人的弟兄姊妹。"],["p","如果他願意，就用第四章這幾句話，和他彼此勸慰。"],["p","第二件，如果你在聖潔這條路上跌倒了，請不要躲起來。"],["p","那賜聖靈的神，今天還在給。找一位信得過的人，一起禱告，再走一步。"],["p","我們一起低頭禱告。"]]},"5":{"min":18,"blocks":[["h","《總要警醒謹守》"],["p","弟兄姊妹平安，今天我們一起讀帖撒羅尼迦前書第五章。"],["p","我想先問大家一個問題。這個問題，你也許從來沒有在教會裡大聲問過。"],["q","主到底甚麼時候來？"],["p","也許是一個很晚的夜裡。看完一則新聞，關掉手機，躺在床上，心裡冒出一句：是不是快了？"],["p","也許是一場追思禮拜之後。送走了一位你很愛的人，你站在墓園的風裡問：主啊，我還要等多久，才能再見到他？"],["p","也有人是被問的。孩子睡前拉著你的手：「耶穌甚麼時候回來？明天會不會來？」"],["p","弟兄姊妹，這不是一個壞問題。這是一個愛主的人才會問的問題。"],["q","帖撒羅尼迦，一間租來的屋子。燈油快燒完了，一群人圍著一封剛剛送到的信。"],["p","這間教會，才三個安息日大，創辦人就被連夜送出城了。"],["p","他們被鄉親逼迫，又有人過世了。"],["p","保羅在上一章說：主要降臨，我們要和主永遠同在。"],["p","讀到這裡，他們下一個問題一定是：那是甚麼時候？還要多久？"],["p","保羅的回答，就是第五章第一節。"],["q","「弟兄們，論到時候、日期，不用寫信給你們」（5:1）"],["p","他不回答。"],["p","不是這個問題不重要，是他要給他們一個比日期更好的東西。"],["p","今天這一章有三個字：光，醒，成。"],["p","我們沿著它走三步：白天的人，四種人四種對待，他必成就。"],["q","第一步：白天的人。"],["p","先看第一節的兩個字：「時候、日期」。"],["p","原文是 χρόνων 和 καιρῶν。前一個是時間的長度，後一個是那一刻。"],["p","主耶穌在世的時候說過，那日子，那時辰，沒有人知道，惟獨父知道。"],["p","所以如果有人拿著一張圖表，告訴你哪一年、哪一天，請你溫和地、清楚地把它放下。"],["p","連主耶穌都說只有父知道的事，我們不需要比他知道得更多。"],["p","保羅不給日期，他給了一幅畫。"],["q","「因為你們自己明明曉得，主的日子來到，好像夜間的賊一樣。」（5:2）"],["p","這是主耶穌自己講過的比喻。"],["q","「家主若知道幾更天有賊來，就必警醒，不容人挖透房屋」（太 24:43）"],["p","賊最大的特點，不是可怕，是不預告。"],["p","所以這幅畫要你做的，不是去猜賊幾點來。"],["p","是每天晚上，都把門顧好。"],["q","認真等候主的人，不是緊張地盯著日曆，是平靜地過好每一天。"],["q","「人正說『平安穩妥』的時候，災禍忽然臨到他們」（5:3）"],["p","「平安穩妥」，很可能是當時羅馬的口號：有凱撒，就有和平，就有安全。"],["p","保羅說：把盼望放在人造的平安上，像懷胎的婦人以為今天不會生。日子一到，躲不掉。"],["p","這一節，常常被拿來對新聞。"],["p","哪裡簽了一份和平協議，哪裡停火了，就有人說：你看，五章三節應驗了。"],["p","弟兄姊妹，請聽清楚：那是把保羅拒絕給的時間表，從後門偷偷塞回去。"],["q","五章三節不是一則新聞預告。是對每一個自以為穩妥的人的提醒。"],["p","可是保羅講到這裡，轉了一個彎。前面說「他們」，這裡換成「你們」。"],["q","「弟兄們，你們卻不在黑暗裡，叫那日子臨到你們像賊一樣。」（5:4）"],["p","請你想一想：賊來的時候，誰會被嚇到？睡著的屋主。"],["p","如果燈亮著，人醒著，門口有人來，那不叫驚嚇，那叫迎接。"],["p","保羅說：那日子不會像賊一樣抓住你。"],["p","差別不在誰手上有時間表。差別在你住在哪裡。"],["q","「你們都是光明之子，都是白晝之子。」（5:5）"],["p","保羅沒有說：你們要努力，變成光明之子。"],["p","他說：你們已經是了。"],["p","「白晝之子」更奇妙。「白晝」和「主的日子」，原文是同一個字。"],["p","意思是：你是那一天的孩子。"],["q","主再來的那一天，不是闖進你家的陌生人，是你所屬的那一天終於到了。"],["p","這就是保羅的回答。你問他：主甚麼時候來？"],["p","他說：你不必知道。"],["q","天還沒亮，你已經是白天的人了。"],["p","既然是白天的人，就活得像白天。"],["q","「所以，我們不要睡覺像別人一樣，總要警醒謹守。」（5:6）"],["p","可是「警醒」這兩個字，在教會裡常常被講得很累。"],["p","保羅卻說得很平常：睡了的人是在夜間睡，醉了的人是在夜間醉。"],["p","保羅自己也要睡覺。他說的「睡」，不是身體休息。"],["p","是活得好像沒有主要來一樣：麻木，隨便，對神的事沒有知覺。"],["p","「謹守」，原文 νήφωμεν，本來的意思是：沒有喝醉，頭腦清醒。"],["p","成功會讓人醉，怨恨會讓人醉，一直滑不完的螢幕，也會讓人醉。"],["p","清醒的人，看得清楚：我在哪裡，我在等誰。"],["p","守夜的兵，要穿盔甲。"],["q","「把信和愛當作護心鏡遮胸，把得救的盼望當作頭盔戴上。」（5:8）"],["p","信愛望，在第一章是三種勞動。到第五章，成了三件盔甲。"],["p","你在那裡勞苦過的地方，就是保護你的地方。"],["p","信和愛護住胸口。因為夜裡最常見的兩種傷，就是懷疑神，和冷淡人。"],["p","盼望護住頭。因為人最容易被打倒的，是腦海裡的聲音。"],["p","「一切都白費了。」頭盔不是讓這種聲音永遠不出現，是讓它打不穿。"],["q","在夜裡，穿上白天的衣服。"],["p","可是，萬一我穿得不夠好呢？萬一主來的時候，我正好跌倒了呢？"],["q","「因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救。」（5:9）"],["p","這是給信徒的末世論：不是一個威脅，是一個應許。"],["p","所以，請不要用「被提的時候你會被留下來」去嚇唬人。"],["p","那是把五章九節倒過來讀。"],["p","警醒的力量，不是從恐懼來的。是從確知自己屬於誰來的。"],["p","救恩的根據，在下一節。"],["q","「他替我們死，叫我們無論醒著，睡著，都與他同活。」（5:10）"],["p","不是我們醒得夠久，是他死得夠徹底。"],["p","五章六節說「不要睡覺」。五章十節卻說「睡著」也與他同活。"],["p","這裡的「睡著」，是上一章那些已經離世的弟兄姊妹。"],["p","保羅用同一個字，一邊叫醒昏睡的人，一邊安慰哀傷的人。"],["q","死亡，沒有把任何一個人從這個家裡除名。"],["p","如果你剛送走一位在主裡的家人，這一節是寫給你的。"],["p","你可以哭。保羅從來沒有說不可以哭。只是你的哭，是有指望的哭。"],["q","「所以，你們該彼此勸慰，互相建立，正如你們素常所行的。」（5:11）"],["p","保羅最後要他們做的，是轉過身，照顧旁邊的人。"],["p","上一章講被提，也收在彼此勸慰。兩段講末世，兩次都收在「彼此」。"],["p","一套末世觀，如果讓你更孤立、更緊張、更愛跟人辯論，就走偏了。"],["p","可是，「彼此勸慰」說起來容易。"],["p","真的轉過身，你會發現每一個人都不一樣。有的人需要被提醒，有的人需要被扶起來。"],["p","保羅接下去，就教這間嬰孩教會，怎樣看人。"],["q","第二步：四種人，四種對待。"],["q","「弟兄們，我們勸你們敬重那在你們中間勞苦的人，就是在主裡面治理你們、勸戒你們的」（5:12）"],["p","勞苦，治理，勸戒，三個都是動詞，沒有一個是頭銜。而且排第一的，是勞苦。"],["q","「又因他們所做的工，用愛心格外尊重他們。」（5:13）"],["p","尊重的理由，是他們所做的工。不是他們坐的位子。"],["p","這兩節，不能講成「絕對順服屬靈父親」。"],["p","也不能講成「你質疑牧者，就是消滅聖靈」。"],["p","同一段後面，保羅要全教會「凡事察驗」。講台上說的話，也在察驗之列。"],["p","包括我今天早上講的。"],["p","保羅自己雖然可以叫人尊重，卻選擇像母親一樣餵養，晝夜做工。"],["p","屬靈父母的目標，是孩子站穩，不是孩子離不開自己。"],["q","「我們又勸弟兄們，要警戒不守規矩的人，勉勵灰心的人，扶助軟弱的人，也要向眾人忍耐。」（5:14）"],["p","請你數一數：四種人，四個動詞。"],["p","保羅沒有用同一種方法，對待所有的人。"],["p","第一種，「不守規矩的人」。"],["p","原文是脫了隊的兵。在這封信裡，指的是那些不肯做工、等著別人供養的人。"],["p","對他們，要「警戒」。清楚地、當面地提醒。"],["p","這不是看不起失業的人。保羅說的是離開隊伍、拒絕自己那一份的人。對他們，愛的表現是說真話。"],["p","第二種，「灰心的人」。"],["p","原文 ὀλιγοψύχους，字面是「魂小的人」，心縮小了的人。"],["p","被重擔壓得心都縮起來了：在逼迫裡疲憊的，為過世的親人傷心的，信主以後被家人冷落的。"],["p","對他們，保羅用的動詞換了：不是「警戒」，是「勉勵」。"],["p","原文 παραμυθεῖσθε，是坐到他旁邊，溫和地說話。"],["q","灰心的人，需要的不是一頓責備，是一個坐下來的人。"],["p","請不要對一個灰心的人說：「你就是信心太小。」那等於在他倒下的地方再踩一腳。"],["p","今天教會裡的灰心，有時候是憂鬱症、焦慮症這樣真實的病。"],["p","那時候，最需要的是陪伴。也要陪他去看醫生，去找專業的協助。這和禱告並不衝突。"],["p","如果你今天就是那個心縮小了的人，我想對你說：你不是教會的負擔。你是保羅特別點名要被勉勵的人。"],["p","第三種，「軟弱的人」。"],["p","「扶助」，原文 ἀντέχεσθε，是抓住他，撐住他，不放手。"],["p","軟弱的人，不需要一篇講道。他需要一隻手。"],["p","第四種，是「眾人」。"],["p","「忍耐」，原文是長長的一口氣。和聖靈所結的果子裡，那個「忍耐」，是同一個字根。"],["p","眾人，包括前面三種人，也包括讓你最難忍耐的那一位。"],["p","次序弄錯了，就會傷人。"],["q","牧養的智慧，是先看清楚：眼前這個人，是哪一種。"],["p","我們 321 說「920」，每一個「2」都不一樣，就是這個意思。"],["p","然後，是三句很短的話。"],["q","「要常常喜樂，不住地禱告，凡事謝恩」（5:16-18）"],["p","可是請你記得，這封信寫給誰。"],["p","一群剛剛埋葬了親人、還在被逼迫的人。"],["p","保羅知道他們在哭。"],["q","常常喜樂，不是不准哭。喜樂可以和眼淚，坐在同一張椅子上。"],["p","「不住地禱告」，也不是每一分鐘都閉著眼睛跪著。"],["p","像停不下來的咳嗽：不是一直開口，是一再回來。像呼吸一樣。"],["p","最容易被用錯的，是「凡事謝恩」。"],["p","原文是 ἐν παντὶ，意思是「在」凡事中謝恩，不是「為」凡事謝恩。"],["p","保羅不是叫你為疾病、為不公義謝恩，是叫你在任何處境裡，都不要失去對神的感謝。"],["p","一位守在病床邊的姊妹可以說："],["q","主啊，這個病，我不感謝。但是我感謝你在這裡。"],["p","這不是否認情緒。這是在最真實的情緒裡，仍然向神開口。"],["p","所以請不要對哀傷的人說：「凡事謝恩，你不可以難過。」"],["p","然後保羅說：「這是神在基督耶穌裡向你們所定的旨意。」"],["p","這封信只有兩次直接說「神的旨意」。第一次在第四章：要你們成為聖潔。第二次就在這裡。"],["p","兩次都是告訴你：你要成為怎樣的人。"],["p","我們 321 說「凡事謝恩，把榮耀歸給耶穌」，根就在這裡。"],["p","謝恩，是把眼光從處境，移到那位在處境裡的主身上。"],["p","最後，是兩個「不要」，和一個「但要」。"],["q","「不要消滅聖靈的感動；不要藐視先知的講論。但要凡事察驗」（5:19-21）"],["p","原文只有四個字：不要熄滅那靈。「聖」和「的感動」是和合本補的小字。"],["p","「熄滅」，原文 σβέννυτε，是滅火的字。聖靈像火。"],["p","可是保羅馬上接著說：但要凡事察驗。"],["p","「察驗」，原文 δοκιμάζετε，是驗金子的字。「凡事」，也包括講台。"],["p","只有熱情沒有分辨的教會，會被帶走；只有分辨沒有熱情的教會，會慢慢冷掉。"],["p","保羅要這間嬰孩教會，兩樣都有：不怕火，也不怕驗。"],["p","講到這裡，你可能有一點喘不過氣來。"],["p","這麼多，我做得到嗎？"],["p","保羅沒有再加一條命令。他停下來，開始禱告。"],["q","第三步：他必成就。"],["q","「願賜平安的神親自使你們全然成聖！」（5:23）"],["p","第四章說，成聖是神的旨意。第五章說，成聖是神親自的工作。"],["p","主詞換了。"],["q","「又願你們的靈與魂與身子得蒙保守，在我們主耶穌基督降臨的時候，完全無可指摘！」（5:23）"],["p","這一節常引出靈、魂、體的討論：有三分說，有二分說，也有整全說。倪柝聲弟兄的《屬靈人》，幫助過無數華人信徒認真對待內在的生命。"],["p","他為主長年受苦的見證，值得我們尊敬。各種讀法，講義的議題頁都有整理，持守的都是弟兄。"],["p","可是有一種用法，我們要避免：把「屬魂的」當成一張標籤，去否定人的情感、思想和性格。流淚的弟兄，不是「魂在作工」。"],["p","這一節最重的，其實是兩個字：「全然」和「完全」。"],["p","「全然」，原文 ὁλοτελεῖς，是徹徹底底。"],["p","「完全」，原文 ὁλόκληρον，是每一份都在，沒有缺角。"],["p","你與神的相交，你的眼淚和思想，你的身體和每天做工的手，"],["p","連那一顆縮小了的心，全都在神的保守裡。"],["p","然後，是全卷的最高點。"],["q","「那召你們的本是信實的，他必成就這事。」（5:24）"],["p","原文的後半句，只有三個字：ὃς καὶ ποιήσει。他，也，必做。"],["p","保羅講了四章半的勸勉，最後不是說「你們要更努力」，是說「他必成就」。"],["q","命令是給我們的，成就是神的。"],["p","那召你們的，原文是那一直在召你們的。他不是叫了你一聲，就走開的神。"],["p","保羅被趕走了，不能留下來看著他們長大。但他知道，有一位會留下來。"],["p","所以跌倒的人，不必自責到放棄，也不必假裝沒事。那召你的是信實的，你可以再站起來。"],["p","因為工程的主人，沒有放棄這棟房子。"],["p","我們 321 說「一切都是神的恩典」，這兩節，就是它在這卷書裡的本文。"],["p","然後，是全卷最重的一個字。"],["q","「我指著主囑咐你們，要把這信念給眾弟兄聽。」（5:27）"],["p","「囑咐」，原文 ἐνορκίζω，是叫人指著主起誓。"],["p","全卷只有這裡用起誓的語氣，為的只是一件事：這封信，不能只給幾個人看。"],["p","當時很多人不識字，有人是奴隸，有人沒能來聚會。"],["q","眾弟兄，一個都不能少。"],["p","神的話，不是少數人的專利，是全家人的飯。"],["q","「願我主耶穌基督的恩常與你們同在！」（5:28）"],["p","弟兄姊妹，最後，我們回到開頭那個問題。"],["p","主到底甚麼時候來？保羅的回答，我們聽了四句。"],["p","第一句，他說：你們都是光明之子，都是白晝之子。"],["p","你不必知道日期。因為天還沒亮，你已經是白天的人了。"],["p","第二句，他說：凡事謝恩。"],["p","在等候的夜裡，在病床邊，在墓園的風裡，你仍然可以向神開口。"],["p","第三句，他說：那召你們的本是信實的，他必成就這事。"],["p","你不是靠自己撐到那一天。是一位信實的神，一路把你帶到那一天。"],["p","第四句，他說：要把這信念給眾弟兄聽。"],["p","這個盼望，要念給那個灰心的人聽，念給還在哭的人聽。"],["p","為甚麼保羅敢這樣說？因為這一章的正中間，有一句話。"],["q","「他替我們死，叫我們無論醒著，睡著，都與他同活。」（5:10）"],["p","那一位要來的，就是在最黑的夜裡，替我們死的主。"],["p","他走進了我們的夜，所以我們可以成為白天的人。"],["q","我們等的不是一個日期。我們等的，是一個人。"],["p","所以，當孩子再問你：耶穌甚麼時候回來？"],["p","你可以摸摸他的頭，說：我不知道是哪一天。"],["p","可是我知道是誰要來。他很愛我們。我們每天都把燈點著，等他。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，想一想你身邊，有沒有一個心縮小了的人。"],["p","不要給他一篇道理。坐到他旁邊，陪他一下。需要的話，陪他去找專業的幫助。"],["p","第二件，每天晚上睡覺以前，在凡事中，找一件事感謝神。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"書信的處境與原則——一封寫給嬰孩教會的家書；今天的帖撒羅尼迦在哪裡？","r":"1:5--10；2:14--20；3:1--10；4:13","ch":[],"why":"一、原則照守、落點隨處境——沿用哥林多前書立場一（林前議題「書信的處境與原則」），本卷補述：一間出生幾個月、創辦人被趕走、信徒被逼迫、已經有人過世的教會。帖撒羅尼迦前書沒有錯謬教師，也沒有一長串要回答的問題，於是常被讀成兩種樣子：一種是把 4:13–5:11 抽出來，當成一份末世預言講義；一種是把它當成一篇沒有處境的溫馨小品。這封信為甚麼寫、寫給一間怎樣的教會、今天的帖撒羅尼迦在哪裡，必須在開卷講定，全卷五章的落點才不會飄在半空。","pos":[["【一】經文問的是甚麼","","<p>書信的總原則，本講義沿用哥林多前書立場一，不重寫：保羅寫信給特定地區、特定年代、遇到特定問題的教會；讀信的人要先找出他的「因為」，原則照守，落點隨處境，判斷的理由一定要講出來。全卷每一章照「書信」三問來讀：帖撒羅尼迦人遇到甚麼？保羅從福音推出甚麼原則？今天這原則落在哪裡？<\/p><p>本卷要補的只有一段：<strong>帖撒羅尼迦前書是寫給一間只有幾個月大的教會。<\/strong>保羅在那裡「一連三個安息日，本著聖經與他們辯論」（徒 17:2），接著是暴動，信徒耶孫被拉到地方官面前，「弟兄們隨即在夜間打發保羅和西拉往庇哩亞去」（徒 17:10）。這間教會出生不久就失去了父母——「我們暫時與你們離別，是面目離別，心裡卻不離別」（2:17）。<\/p><p>留下來的人處境很難：外面有逼迫——「你們也受了本地人的苦害」（2:14）；裡面有人過世了——「論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣」（4:13）；城裡性很隨便（4:3–8），也有人不做工（4:11；5:14）。新約一卷都還沒寫成，他們手上只有這一封信，所以保羅最後說：「我指著主囑咐你們，要把這信念給眾弟兄聽」（5:27）。<strong>經文問的是：這封信的處境到底是甚麼？是一份末世講義、一篇自我辯護，還是一封家書？今天要把它放在誰手裡讀？<\/strong><\/p>"],["末世教導說（全卷的核心是 4:13–5:11，其餘是鋪陳）","","<p>認為帖撒羅尼迦前書是一封以末世論為中心的信：每一章都以主的來臨收尾（1:10；2:19；3:13；4:13–18；5:23），4:13–5:11 是全卷篇幅最集中的教導段，教會的問題是「死了的人會不會錯過主來」與「主甚麼時候來」，所以讀這卷書，就是讀保羅的末世論。這派抓住了一件真實的事：主的來臨確實是全卷的主軸，而且這是新約最早把被提、復活、主的日子放在一起講的一段。<\/p><p><strong>難處：<\/strong>第 1 到第 3 章佔了全信一半以上，講的幾乎全是關係——感謝、回憶、掛念、打發提摩太、「你們若靠主站立得穩，我們就活了」（3:8）。把這一半讀成鋪陳，等於把一封父親的信讀成一份講義。更要緊的是，保羅自己說「論到時候、日期，不用寫信給你們」（5:1），寫末世的理由是「恐怕你們憂傷」（4:13），結論是「彼此勸慰」（4:18）。把末世段抽出來單獨讀，最容易滑向時間表與恐嚇（見議題「主再來、被提與末世時間表」、紅線一）。<\/p>"],["辯護書信說（2:1–12 是保羅在回應外人的毀謗）","","<p>認為保羅寫這封信的一個主要理由，是為自己辯護。2:3–6 一連串的「不是」——「我們的勸勉不是出於錯誤，不是出於污穢，也不是用詭詐」（2:3），「因為我們從來沒有用過諂媚的話」（2:5），也沒有藏著貪心、沒有求榮耀——聽起來像在回應指控。〔背景〕使徒行傳 17 章那些心裡嫉妒的人，很可能在保羅連夜離開以後，說他是一個騙了錢就跑的遊方哲士。這派的優點是認真看待第 2 章的語氣，也解釋了保羅為甚麼要一再說「你們自己原曉得」（2:1）。<\/p><p><strong>難處：<\/strong>信裡沒有點名任何對手，教會對保羅的態度也不是懷疑，而是想念——提摩太回報說他們「切切地想見我們，如同我們想見你們一樣」（3:6）。古代的道德教師常用「我不是那樣的人」來描繪理想的榜樣，2:1–12 未必是在答辯，更可能是在給一群孩子看一個可以效法的生命。若把全卷讀成辯護，會把一位父親的心讀成自我防衛。<\/p>"],["牧養家書說（一封父母寫給剛出生孩子的勸勉信）","","<p>認為帖撒羅尼迦前書最接近古代的「勸勉書信」：寫信的人不教新東西，而是叫讀信的人想起他們已經知道的，並且更加這樣行。信裡「你們自己知道」一類的話出現十幾次；保羅在八十九節裡十四次稱他們「弟兄們」；保羅把自己比作母親（2:7）、父親（2:11），也比作被奪去孩子的孤兒（2:17）；4:1、4:10 兩次說「更加勉勵」——不是糾正，是鼓勵已經做得好的人再多一點。這派的優點是接住了全卷的語氣：這是一封家書。<\/p><p><strong>難處：<\/strong>若只講溫情，會漏掉這封信嚴肅的地方：4:3–8 對性的命令很直接，還說「因為這一類的事，主必報應」（4:6）；5:14 也要「警戒不守規矩的人」。家書也有家規。把帖撒羅尼迦前書只讀成一張問候卡，就聽不見父親在孩子學走路時那幾句很重的提醒。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。本卷補一段：帖撒羅尼迦前書是一封寫給嬰孩教會的家書——創辦人被趕走、信徒被逼迫、已經有人過世、手上只有一封信。<\/strong>本講義以牧養家書為框架，吸收辯護書信說的觀察：2:1–12 保羅確實在講自己的為人，因為孩子對福音的信任，和他們對傳福音的人的信任綁在一起；也吸收末世教導說的觀察：主的來臨確實是全卷的主軸——<strong>但末世的教導是放在家書裡的，用途是安慰與預備，不是恐嚇。<\/strong><\/p><p>所以全卷五章是一個孩子的成長：<strong>歸<\/strong>——「離棄偶像，歸向神」（1:9）；<strong>養<\/strong>——「如同母親乳養自己的孩子」（2:7）；<strong>穩<\/strong>——「你們若靠主站立得穩，我們就活了」（3:8）；<strong>聖<\/strong>——「神的旨意就是要你們成為聖潔」（4:3）；<strong>醒<\/strong>——「總要警醒謹守」（5:6）。<\/p><p><strong>今天的帖撒羅尼迦，就是每一個剛信主、剛被家人反對、剛失去親人、手上只有一本聖經的弟兄姊妹。<\/strong>全卷五章的落點，都照這一條量：一間嬰孩教會，怎樣在今天的家、喪禮、職場與夜裡，等候那位一定會回來的主？<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，知道這封信的處境，正是一種安慰。新約的第一批書信之一，不是寫給一間成熟、穩定、有長老有會堂的教會，而是寫給一群信主才幾個月、連聖經都沒有的人。保羅沒有等他們長大才寫信給他們，他寫信，就是為了讓他們站得住。<\/p><p>如果你剛信主不久，家裡只有你一個基督徒，或者帶你信主的人已經離開了，帖撒羅尼迦前書是寫給你的。<strong>那位在一間三個安息日大的教會裡動工的神，沒有因為他們小就放下他們；這封信的最後一個應許是：「那召你們的本是信實的，他必成就這事」（5:24）。<\/strong><\/p>"]],"con":[],"say":"本講義的全卷立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。帖撒羅尼迦前書是一封寫給嬰孩教會的家書：創辦人被趕走、信徒被逼迫、已經有人過世、手上只有一封信；全卷的末世教導是放在家書裡的，用途是安慰與預備。今天的帖撒羅尼迦，就是每一個剛信主、剛被家人反對、剛失去親人、手上只有一本聖經的弟兄姊妹。","care":"牧養底線：講「今天的帖撒羅尼迦」時，要想到席上那幾種人——全家只有自己信主、每次回家都被說「入洋教」的人；剛辦完喪事、還不敢在教會哭的人；帶他信主的同工搬走了、覺得自己被留在原地的人。不要把他們當成講道的例子點名，也不要用「你信主這麼久了還這樣」去催他們長大——保羅對嬰孩教會的第一句話是感謝（1:2），不是責備。也不要把這封家書講成一份末世講義，讓剛信主的人第一次讀聖經，就讀出害怕來。"},{"id":"ISS00_2","t":"主再來、被提與末世時間表——災前、災中、災後？能不能知道日子？","r":"1:10；4:13--18；5:1--11；5:23","ch":[],"why":"二、主一定親自回來；各派被提觀並陳、都是弟兄；不定時間表、不算日子、不把時事對號入座、不用被留下來恐嚇人；這段經文的用途是安慰——本講義的全卷立場之二（本卷新立）。這是本卷最重要的一條。4:13–5:11 是華人教會最熟悉、也最常被講成時間表與恐懼的一段：有人照著它排出末世路線圖、推算年份，有人用「被提的時候你會被留下來」嚇人，也有人一聽到末世就害怕，乾脆不講。主怎樣再來、被提是甚麼、能不能知道日子、這段經文到底要我們做甚麼，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>主耶穌會怎樣再來？「被提」是甚麼？在大災難之前還是之後？我們能知道日子嗎？先讓經文自己說五件事。<strong>一、主一定會親自回來<\/strong>：「主必親自從天降臨」（4:16）——αὐτὸς ὁ κύριος，<strong>不是代表，是他自己<\/strong>。<strong>二、死了的信徒不會錯過<\/strong>：「那在基督裡死了的人必先復活」（4:16）。<strong>三、重點是與主同在<\/strong>：「這樣，我們就要和主永遠同在」（4:17）——「被提」ἁρπαγησόμεθα 只說怎樣上去，「相遇」εἰς ἀπάντησιν 說上去做甚麼，保羅沒有說之後往哪裡去。<\/p><p><strong>四、日子沒有人知道，也不必知道<\/strong>：「論到時候、日期，不用寫信給你們」（5:1）；「主的日子來到，好像夜間的賊一樣」（5:2）——這使我們想起主耶穌自己的話：「但那日子，那時辰，沒有人知道，連天上的使者也不知道，子也不知道，惟獨父知道」（太 24:36）。<strong>五、這段教導的用途是安慰與預備<\/strong>：「所以，你們當用這些話彼此勸慰」（4:18）；「所以，我們不要睡覺像別人一樣，總要警醒謹守」（5:6）。<strong>經文問的是：在這五件事之外，各派爭的是甚麼？我們該站在哪裡？<\/strong><\/p>"],["災前被提（時代論前千禧：主分兩階段再來）","","<p>十九世紀達秘（J. N. Darby）提出、經司可福串註本傳遍英語世界的讀法：主的再來分兩個階段——先在空中接走教會（4:17），然後地上有七年大災難，災難之後主才與聖徒一同降到地上，建立千年國度。根據包括 1:10「救我們脫離將來忿怒」與 5:9「神不是預定我們受刑」：教會不經過神忿怒的大災難。二十世紀華人福音派受這個讀法影響很深；它的長處是真實的：它叫信徒天天預備主來，也推動了許多人熱心傳福音。<\/p><p><strong>難處：<\/strong>「兩階段再來」在帖撒羅尼迦前書本文裡沒有明說；4:16 有呼叫的聲音、天使長的聲音、神的號，很難說是一次安靜、秘密的接走。它最常見的副作用不在學說本身，而在講法：「被提的時候車子沒有司機」「你若不夠屬靈就會被留下來」——這種恐嚇不是 4:13–18 的語氣，本講義不用（紅線一）。<\/p>"],["災中被提／忿怒前被提（教會經過大災難的一部分）","","<p>認為教會會經過大災難的前半或大部分，在神的忿怒傾倒之前被提。這派想同時接住兩組經文：一組說教會必受患難——「我們受患難原是命定的」（3:3）；另一組說信徒不受神的忿怒——「因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救」（5:9）。它的優點是分清楚「人加給教會的患難」與「神審判世界的忿怒」，這個分辨本身很有幫助。<\/p><p><strong>難處：<\/strong>要定出「哪一段是患難、哪一段是忿怒、被提落在第幾年」，必須把啟示錄與但以理書的時序拼得非常細，遠超過帖撒羅尼迦前書自己說的範圍；在講台上也最容易滑向排時間表。持守這一派的弟兄姊妹人數不多，但同樣敬虔愛主。<\/p>"],["災後被提（只有一次再來：出城迎接，陪王進城）","","<p>歷代多數教父、改教家、改革宗與許多福音派學者的讀法：主只有一次再來；教會經過大災難，在主降臨時被提「在空中與主相遇」，然後陪他一起降到地上。關鍵字是 ἀπάντησις——當時君王或官長到訪，城裡的人出城迎接，再陪他一起進城。新約另外兩處正是這樣用：「半夜有人喊著說：『新郎來了，你們出來迎接他！』」（太 25:6），以及羅馬的弟兄出城迎接保羅（徒 28:15）。這派也引帖撒羅尼迦後書：「因為那日子以前，必有離道反教的事」（帖後 2:3）。<\/p><p><strong>難處：<\/strong>單憑一個字的常見用法不能定案，保羅在 4:17 確實沒有說被提之後往哪裡去；若講得不好，會讓信徒對大災難過度焦慮，或把心力放在辨認誰是敵基督上。它和災前被提一樣，都可能被講成恐懼——差別只是怕的東西不同。<\/p>"],["千禧年三說（與上面三種被提觀交叉）","","<p><strong>前千禧<\/strong>：主先再來，然後在地上作王一千年（啟 20 章照字面讀）；又分歷史前千禧與時代論前千禧。<strong>無千禧<\/strong>：啟 20 章的一千年是象徵，指從基督升天到再來之間、基督現在藉著教會掌權的時代；奧古斯丁以來許多改革宗與信義宗採此說。<strong>後千禧<\/strong>：福音廣傳、世界逐漸被基督化之後主才再來；十八、十九世紀的復興與宣教運動中一度盛行。三說都承認主要親自再來、死人要復活、審判是真實的。<\/p><p><strong>難處：<\/strong>三說都必須依賴啟示錄 20 章的解釋，而帖撒羅尼迦前書本身一個字也沒有提到千年；所以這一卷不是解決千禧年問題的地方。前千禧要回答千年國度裡為甚麼還有死亡與叛亂，無千禧要回答象徵讀法的界線在哪裡，後千禧要回答兩次世界大戰之後「世界越來越好」的盼望怎樣站得住。<strong>各派都有敬虔愛主的人，各派都是弟兄。<\/strong><\/p>"],["推算日期與時事對號入座——本講義明確不採","","<p>這不是一個學派，卻是教會歷史上一再出現的做法：把但以理書、啟示錄的數字換算成年份，或把戰爭、地震、疫情、某個國家的動向，對號入座成「預言應驗了」，宣布「主要在某年某月回來」。十九世紀美國的米勒耳（William Miller）推算主在 1844 年再來，結果成了著名的「大失望」；1992 年韓國有教會宣布 10 月 28 日被提，海外華人教會也有人跟著傳。說的人多半出於對主的熱切，也抓住了一件真實的事：主確實要回來，我們確實要警醒。<\/p><p><strong>難處：<\/strong>它與經文直接衝突。保羅說「論到時候、日期，不用寫信給你們」（5:1），主耶穌說「父憑著自己的權柄所定的時候、日期，不是你們可以知道的」（徒 1:7）。<strong>歷史上每一次「某年某月」都落空了，每一次都傷了一批最單純的信徒<\/strong>——有人辭了工作、賣了房子，有人從此不再相信。把今天的新聞說成 5:3 的「應驗」，正是本卷紅線一的頭號目標。<strong>本講義明確不採。<\/strong><\/p>"],["【三】本講義站在哪裡","","<p><strong>堅持各派共同承認的：主耶穌會親自、身體地、可見地再來；死人要復活；信的人要永遠與主同在；審判是真實的。<\/strong>這幾件事是全卷的地基，也是第 4 章原文解經的落點。<\/p><p><strong>不替各教會決定被提的時間點。<\/strong>災前、災中、災後被提，前千禧、無千禧、後千禧，第 4、5 章原文解經並陳；<strong>各派都是弟兄<\/strong>，講台不需要為此彼此攻擊。<strong>不算日子、不定時間表、不把時事對號入座<\/strong>（鐵律四）。<\/p><p><strong>不用恐懼佈道。<\/strong>「被留下來」的恐嚇不是 4:13–18 的語氣：保羅寫這段的對象是正在哭的人，理由是「恐怕你們憂傷」（4:13），結論是「所以，你們當用這些話彼此勸慰」（4:18）。<strong>給信徒的末世論，是一個應許<\/strong>：「因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救」（5:9）。講台的落點只有兩句：<strong>被提的重點不是「提」，是「與主同在」；這段經文的用途不是恐嚇，是安慰。<\/strong>而警醒（5:6）的樣子，就是 4:11 的「辦自己的事，親手做工」與 5:14 的「扶助軟弱的人」——不是停下生活去等。<\/p>"],["【四】這件事該不該影響你的信心","","<p><strong>時間點不該；主一定會來，該<\/strong>——而且應該讓我們更想念他，不是更怕他。各派爭的是過程與次序，沒有一派否認「主必親自從天降臨」（4:16），也沒有一派否認「我們就要和主永遠同在」（4:17）。<\/p><p>如果你曾經被末世的講道嚇過——夜裡醒來發現家裡沒聲音，心裡一沉，以為自己被留下了——請重新讀 5:10：「他替我們死，叫我們無論醒著，睡著，都與他同活」（5:10）。<strong>那位要回來的，就是替你死的那一位。<\/strong>他回來不是來抓你的錯，是來接你回家，也把你所愛、先睡了的人一同帶來。鐵律六說：果效是忍耐，不是恐慌；1:3 說，盼望生出來的是「忍耐」。<\/p>"]],"con":[],"say":"本講義的全卷立場：主耶穌會親自、身體地、可見地再來；死人要復活；信的人要永遠與主同在；審判是真實的。災前、災中、災後被提與前千禧、無千禧、後千禧並陳，各派都是弟兄，本講義不替各教會決定時間點；不算日子、不定時間表、不把時事對號入座、不用「被留下來」恐嚇人。被提的重點是與主同在，這段經文的用途是安慰（4:18）；給信徒的末世論是一個應許（5:9）。","care":"牧養底線：不推算日期、不預言時事、不轉傳末日訊息（紅線一）；不批評、不嘲笑持不同被提觀點的教會與牧者；不讓「主快來了」成為不工作、不讀書、不照顧家人的理由——4:11–12 就緊接在前面。席上會有從小被「被留下來」嚇大、至今聽到末世就心跳加速的人，有每天看新聞就焦慮世界末日的人，也有被轉傳末日訊息、想辭職賣房的人。對前兩種人，先講 5:9–10 的應許，陪他把害怕說出來；對第三種人，溫柔而清楚地勸阻，會後單獨跟進。若焦慮已經影響睡眠與生活，協助尋求專業協助。"},{"id":"ISS00_3","t":"哀傷與盼望：死亡、喪禮與祭祖——基督徒可以哭嗎？","r":"4:13--18；5:9--11","ch":[],"why":"三、可以哀傷，只是不像沒有指望的人；喪禮上不叫人不要哭；不對未信主的亡者下斷語；不拜但盡孝——本講義的全卷立場之三（本卷新立；回指腓立比書立場三）。4:13–18 是全世界華人教會追思禮拜最常讀的經文之一，也最常被讀錯成「基督徒不可以難過」；而華人信徒面對的喪禮，又同時牽動家族、祖先牌位、清明掃墓與未信主的親人。基督徒可以哭嗎、死了的人在哪裡、祭祖怎麼辦，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>基督徒可以為死去的人哭嗎？死了的人現在在哪裡？華人的喪禮、清明、祭祖，基督徒怎樣面對？帖撒羅尼迦教會出生才幾個月就有人過世了，他們問的不是一個末世論的題目，而是：我們的家人，主再來的時候會不會錯過？<\/p><p>先讓經文自己說四件事。<strong>一、可以哀傷，只是不像沒有指望的人<\/strong>：「論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣」（4:13）——<strong>保羅沒有說「不要憂傷」<\/strong>。這使我們想起拉撒路的墳前，「耶穌哭了」（約 11:35）——他明知道要叫拉撒路復活，還是哭了。<strong>二、死了的信徒是「睡了」<\/strong>（4:13–15）——κοιμάω，會醒的睡。<strong>三、他們「在耶穌裡」<\/strong>：「那已經在耶穌裡睡了的人，神也必將他們與耶穌一同帶來」（4:14）——死亡沒有把他們從基督裡拿走。<strong>四、我們還會見面<\/strong>：「以後我們這活著還存留的人必和他們一同被提到雲裡，在空中與主相遇」（4:17）——「和他們一同」σὺν αὐτοῖς，<strong>是重逢<\/strong>。<\/p>"],["「信心壓過眼淚」的喪禮文化（「他已經在天家了，你應該高興」）","","<p>這不是一個學派，卻是華人教會喪禮上最常聽見的一類話：「他已經回天家了，不要哭」「你哭得這麼傷心，是不是信心不夠？」「基督徒的喪禮應該是歡喜的」。說的人多半出於好意，想用盼望把喪家拉出來；也抓住了一件真實的事：基督徒的喪禮確實和沒有指望的人不一樣，追思禮拜裡確實可以唱詩、可以感恩。<\/p><p><strong>難處：<\/strong>它把 4:13 讀反了。保羅說的是「不要像那些沒有指望的人一樣」憂傷，不是不要憂傷；新約自己說「與喜樂的人要同樂；與哀哭的人要同哭」（羅 12:15）。這類話的實際效果，是讓剛喪親的人把眼淚吞回去，在教會裡不敢哭，回家才崩潰；有人從此覺得教會不是可以難過的地方。<strong>本講義不採（紅線二）。<\/strong><\/p>"],["死後的中間狀態：與主同在說／靈魂睡覺說","","<p>多數福音派與改革宗認為：信徒死後靈魂立刻與基督同在、有知覺、得安息，等候主再來時身體復活——「我正在兩難之間，情願離世與基督同在，因為這是好得無比的」（腓 1:23）。另有部分傳統認為死後進入無意識的狀態，直到復活，根據之一正是本卷的「睡了」（4:13–15）。這一題本系列已在腓立比書立場三詳細並陳，本卷不重寫。<\/p><p><strong>難處：<\/strong>與主同在說要小心不把身體講輕了——帖撒羅尼迦前書的盼望落在復活（4:16），不是靈魂得釋放；靈魂睡覺說則要面對 4:14「在耶穌裡」與腓 1:23「好得無比」的分量。「睡了」在新約多半是對死亡的溫柔說法，重點在「會醒來」，未必是在描述死後沒有知覺。<strong>兩說都同意：睡了的人會醒，而且我們會一同與主相遇。<\/strong><\/p>"],["未信主而過世的親人：斷言結局說／交託說","","<p>有人認為講台應當清楚地說：沒有信主的人死了就沉淪，這是對活人最誠實的警告，喪禮正是傳福音最有力的時機。這派的心志是嚴肅看待福音，確實有許多人在親人的喪禮上第一次想到永恆。另一種做法是交託：福音照樣清楚地傳，但講台不替任何一個已經過世的人宣判結局，因為人臨終的時候心裡發生了甚麼，只有神知道。<\/p><p><strong>難處：<\/strong>斷言結局說的難處是，它在家屬最痛的時候，替神下了判斷，常常把喪家推離教會，也和 4:13–18 安慰的語氣不合；交託說的難處是，若講得含糊，會被誤聽成「信不信都一樣」。所以交託不是不講福音，而是把審判留給審判的主：「審判全地的主豈不行公義嗎？」（創 18:25）<\/p>"],["祭祖的三種做法：完全不參與／參與但不跪拜燒香／以追思禮拜取代","","<p>華人信徒信主以後，最常遇到的難處之一就是祭祖。<strong>完全不參與<\/strong>：為了清楚表明「離棄偶像，歸向神」（1:9），不到祭拜現場、不參加家族祭典；優點是立場清楚，難處是常被家人看成不孝、斷了關係，見證反而關了門。<strong>參與但不跪拜燒香<\/strong>：回家、掃墓、打掃墓地、獻花、在一旁安靜禱告，但不上香、不跪拜、不吃祭物；優點是保住孝與見證，難處是界線要每家每次重新判斷，有時被親戚誤會或施壓。<\/p><p><strong>以追思禮拜取代<\/strong>：在清明或忌日辦家庭追思聚會，讀經、禱告、說說先人的故事；優點是把記念與感恩放回信仰裡，難處是家中長輩未必接受，若強推反而成了對抗。<strong>三種做法都有愛主的弟兄姊妹，要看家庭處境、信主年日與良心。<\/strong><\/p>"],["【三】本講義站在哪裡","","<p><strong>基督徒的哀傷是被允許的，而且需要被陪伴。<\/strong>4:13 是「不要像那些沒有指望的人一樣」，不是不要憂傷；喪禮上不對家屬說「你應該高興」，也不把眼淚當成信心不足。基督徒的眼淚裡有一個指望：睡了的人會醒，「這樣，我們就要和主永遠同在」（4:17）。死後的中間狀態，回指腓立比書立場三，本卷不另立。<\/p><p><strong>未信主而過世的親人：講台不替任何一個人下判斷<\/strong>，福音照樣清楚地傳，把亡者交在公義又慈愛的神手中。<\/p><p><strong>祭祖：不拜偶像（1:9），但盡孝、記念、感恩。<\/strong>參加家族掃墓、以鮮花與禱告記念，照神所吩咐的「要孝敬父母，使你得福，在世長壽」（弗 6:2–3）；<strong>用溫柔而不是對抗，讓家人看見基督徒是最孝順的人。<\/strong>三種做法並陳，本講義建議多數處境採「參與但不跪拜燒香」，並在家中長輩願意時加上追思聚會。<\/p>"],["【四】這件事該不該影響你的信心","","<p><strong>死後狀態的細節不該；「我們還會再見面」該——這是信心最溫柔的地方。<\/strong>各派爭的是中間的過程，沒有一派否認「那在基督裡死了的人必先復活」（4:16）。<\/p><p>如果你剛送走一位家人，你不必在教會裡假裝堅強。主耶穌在墳前哭過，保羅也沒有叫帖撒羅尼迦人不要難過；他只是在他們的眼淚旁邊放了一句話：還會再見面。主耶穌說：「哀慟的人有福了！因為他們必得安慰」（太 5:4）；到那一天，「神要擦去他們一切的眼淚」（啟 21:4）——<strong>是神親手擦，不是我們自己忍住。<\/strong><\/p>"]],"con":[],"say":"本講義的全卷立場：可以哀傷，只是不像沒有指望的人（4:13）——保羅沒有說不要憂傷；死了的信徒是睡了、在耶穌裡，我們還會再見面（4:14–17）。喪禮上不叫人不要哭、不說「你應該高興」；不對未信主的亡者下斷語，交在公義又慈愛的神手中；祭祖不拜偶像，但盡孝、記念、感恩，用溫柔而不是對抗作見證。死後的中間狀態回指腓立比書立場三。","care":"牧養底線：任何時候都不在喪禮上用 4:13 叫人不要哭（紅線二）；不對未信主的亡者下斷語，尤其不在家屬面前。遇到自殺者家屬、嬰孩夭折、流產、意外喪親：先陪伴，不解釋，不說「這是神的旨意」「神要他回去了」；不追問細節，不對正在流淚的人說「你要有信心」；會後單獨關心，在忌日、清明、節日主動問候，必要時協助尋求哀傷輔導，並回指腓立比書立場三保護生命的原則。對因祭祖與家人起衝突的弟兄姊妹，不在講台上指責他們的家人，也不催他們在最痛的時候表態，陪他們一起想下一步怎麼做。"},{"id":"ISS00_4","t":"聖潔、性與整個人：身體、婚姻與靈魂體——4:3--8、5:23 怎樣讀？","r":"4:1--8；5:22--24","ch":[],"why":"四、聖潔是神的旨意，也是神親自成就；性要放在尊重與聖潔裡；被侵害的人不是不聖潔的人；5:23 的重點是神要保守整個人——本講義的全卷立場之四（本卷新立；回指腓立比書立場四）。4:3–8 是新約最早、也最直接談性的段落之一，常被講成羞辱與恐嚇；4:4 的 σκεῦος 是「身體」還是「妻子」學界未定；5:23「靈與魂與身子」在華人教會又因倪柝聲《屬靈人》而影響極深。聖潔怎麼講才保護人、不壓傷人，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>4:3–8「遠避淫行」今天怎麼講？4:4 的 σκεῦος 是身體還是妻子？5:23「靈與魂與身子」是甚麼意思？先讓經文自己說五件事。<strong>一、聖潔是神的旨意<\/strong>：「神的旨意就是要你們成為聖潔，遠避淫行」（4:3）——不是某些特別屬靈的人的選修。<strong>二、聖潔包括身體<\/strong>：「要你們各人曉得怎樣用聖潔、尊貴守著自己的身體」（4:4）——身體是尊貴的，不是骯髒的。<strong>三、性的罪也是對別人的不公義<\/strong>：「不要一個人在這事上越分，欺負他的弟兄」（4:6）——ὑπερβαίνειν 越界、πλεονεκτεῖν 佔便宜。<\/p><p><strong>四、聖潔的力量是聖靈<\/strong>：「所以，那棄絕的，不是棄絕人，乃是棄絕那賜聖靈給你們的神」（4:8）——διδόντα 是現在式，<strong>一直在賜<\/strong>。<strong>五、成聖是神做的<\/strong>：「願賜平安的神親自使你們全然成聖！又願你們的靈與魂與身子得蒙保守，在我們主耶穌基督降臨的時候，完全無可指摘！」（5:23）「那召你們的本是信實的，他必成就這事」（5:24）。<strong>命令是給我們的，成就是神的。<\/strong><\/p>"],["4:4 σκεῦος 讀作「自己的身體」","","<p>和合本、多數中文譯本與許多古代解經家的讀法：σκεῦος（器皿）指人自己的身體，κτᾶσθαι 解作「掌管、管好」。保羅在別處也用器皿比喻人的身體——「我們有這寶貝放在瓦器裡」（林後 4:7）。這個讀法的優點是男女都適用，也與上下文的「不放縱私慾的邪情」（4:5）相合：聖潔就是學會管好自己的身體，並且把它當成尊貴的器皿。這使我們想起保羅後來說的：「豈不知你們的身子就是聖靈的殿嗎？」（林前 6:19）<\/p><p><strong>難處：<\/strong>κτάομαι 通常的意思是「取得、得著」，用來說「掌管已經有的身體」稍嫌勉強；也有少數學者把 σκεῦος 讀成身體某一部分的委婉說法，方向相同，但更難從字面確定。<\/p>"],["4:4 σκεῦος 讀作「娶妻」","","<p>奧古斯丁與一些現代英文譯本的讀法：「取得自己的器皿」就是娶一位妻子，κτάομαι 正好是「取得」。彼得前書稱妻子為「較軟弱的器皿」，和合本譯「因她比你軟弱」（彼前 3:7）。這樣讀，4:4 是在說：面對性的試探，正路是在婚姻裡，「用聖潔、尊貴」對待自己的配偶，而不是像外邦人那樣把對方當成發洩私慾的對象。這派的優點是字義直接，也把婚姻放回聖潔的中心。<\/p><p><strong>難處：<\/strong>這樣讀，整句只對男人說話，而且把妻子比作一件可以「取得」的器物，這與 4:6 保護弟兄、不越界佔便宜的方向有些張力；4:3「你們」也明顯是全教會。<strong>兩種讀法的落點相同：性要放在尊重與聖潔裡，不放在私慾與佔有裡。<\/strong><\/p>"],["5:23 三分說（靈、魂、體三部分；倪柝聲《屬靈人》）","","<p>認為人由三部分組成：靈與神相交，魂是理智、情感、意志，體是身體。部分教父如此讀；在華人教會，倪柝聲弟兄的《屬靈人》以此節建立靈、魂、體的屬靈學，影響深遠，華人地方教會傳統與許多華人教會承接這個讀法。這個傳統幫助過無數華人信徒認真對待內在生命，不滿足於外表的宗教；倪柝聲弟兄為主長年受苦、至死忠心的見證，值得每一個華人基督徒尊敬。<\/p><p><strong>難處：<\/strong>5:23 三個名詞共用一個形容詞 ὁλόκληρον、一個單數動詞 τηρηθείη，經文的重點在「整個」，未必在劃分構造。更大的難處在應用：若把「魂」等同於「天然的、要被對付的」，就容易把人的情感、理性與性格都貼上「屬魂」的標籤——這不是倪柝聲弟兄一生用心的本意，卻是講台上常見的誤用（紅線五）。<\/p>"],["5:23 二分說（身體與靈魂）","","<p>認為人由物質的身體與非物質的靈魂兩部分組成，「靈」與「魂」是同一實體的兩種說法。主耶穌說「那殺身體不能殺靈魂的，不要怕他們」（太 10:28），只分身體與靈魂；馬利亞的「我心尊主為大，我靈以神我的救主為樂」（路 1:46–47）是平行句，心（魂）與靈互換。奧古斯丁以來多數西方神學採此說。它的優點是保護了人的統一，也不把情感、理性放在比較低的位置。<\/p><p><strong>難處：<\/strong>它要解釋為甚麼保羅在 5:23 特意把靈與魂分開列出，以及「魂」與「靈」在新約某些地方確實有不同的用法（例如林前 2:14–15「屬血氣的」與「屬靈的」）。<\/p>"],["5:23 整全說（聖經的人是一個整體，三個詞是修辭上的完整）","","<p>多數當代聖經學者的讀法：聖經看人是一個整體，不是幾個零件拼成的。5:23 列出三個詞，像主耶穌說「盡心、盡性、盡意、盡力」（可 12:30）一樣，不是解剖學，而是用幾個角度說「整個人」。ὁλοτελεῖς（全然）是 ὅλος 加 τέλος，徹徹底底；ὁλόκληρον（完全）是 ὅλος 加 κλῆρος，每一份都在、沒有缺角——兩個字都在說：一個都不要少。<\/p><p><strong>難處：<\/strong>若講得太快，會讓人以為聖經對人的內在沒有任何區分，也可能讓重視內在生命的華人信徒覺得自己的傳統被一筆抹掉。所以整全說要同時尊重三分說、二分說各自看見的東西，並承認保羅確實用了三個詞。<\/p>"],["羞恥式的貞潔教育——本講義明確不採","","<p>這不是一個學派，卻在不少教會的青年聚會裡出現過：用「被嚼過的口香糖」「被撕掉的玫瑰花瓣」「被弄髒的白紙」比喻有過性經驗的人，說「你已經不純潔了，誰還會要你」。說的人多半想保護年輕人，也抓住了一件真實的事：性確實是嚴肅的，4:6 說「因為這一類的事，主必報應」。<\/p><p><strong>難處：<\/strong>它和福音衝突。聖潔是神的恩典——「願賜平安的神親自使你們全然成聖」（5:23）——不是一張只能用一次的證書。這類比喻最深的傷害，落在被性侵、被性暴力的人身上：他們沒有越界，卻被說成「不純潔」。4:6 講得很清楚，錯在越界佔便宜的一方。<strong>本講義明確不採（紅線四）。<\/strong><\/p>"],["【三】本講義站在哪裡","","<p><strong>σκεῦος 兩讀並陳<\/strong>，照和合本讀作「身體」；兩種讀法的落點相同：<strong>性要放在尊重與聖潔裡，不放在私慾與佔有裡。<\/strong><\/p><p><strong>性的聖潔要講，而且要講清楚<\/strong>——婚前性行為、婚外情、色情、網路性剝削；<strong>但講的方式要讓人想回家，不是想躲起來。<\/strong><strong>4:6「欺負」包括權勢性侵與性暴力：被侵害的人不是「不聖潔」的人；講台要明說：錯在越界的一方。<\/strong><\/p><p><strong>靈魂體：三分說、二分說、整全說並陳；尊重倪柝聲弟兄對華人教會的貢獻與為主受苦的見證，不攻擊、不嘲笑。<\/strong>講台的落點是 5:23 自己最重的兩個字「全然」與「完全」：<strong>神要保守的是整個你——你的靈、你的情感與思想、你的身體——到主來的那一天。<\/strong>成聖與完全的總原則，回指腓立比書立場四。<\/p>"],["【四】這件事該不該影響你的信心","","<p><strong>σκεῦος 與靈魂體的解釋不該；聖潔是神的旨意，該——而且是好消息：神親自要使我們成聖。<\/strong>三分說、二分說、整全說爭的是人的構造怎樣描述，沒有一派否認神要保守整個人，也沒有一派否認「他必成就這事」（5:24）。<\/p><p>如果你在性的事上跌倒過，或者曾經被人傷害、從此覺得自己髒了，請重新讀 5:23–24：主詞是神。<strong>神不是要你先把自己洗乾淨再來，他是「親自」使你成聖的那一位。<\/strong>你的身體不是你的恥辱，是他要保守到那一天的器皿。<\/p>"]],"con":[],"say":"本講義的全卷立場：聖潔是神的旨意（4:3），包括身體，也是神親自成就（5:23–24）；4:4 σκεῦος 身體／娶妻兩讀並陳，落點相同——性要放在尊重與聖潔裡，不放在私慾與佔有裡；性的罪也是對人的不公義，4:6 包括權勢性侵，錯在越界的一方，被侵害的人不是不聖潔的人。5:23 三分說、二分說、整全說並陳，尊重倪柝聲弟兄；重點是「全然」與「完全」——神要保守整個人。成聖與完全回指腓立比書立場四。","care":"牧養底線：不羞辱、不公開點名、不用「你已經不純潔了」定一個人的終身（紅線四）；不把性侵、性暴力的受害者算成犯罪者，絕不說「你自己也有責任」；遇到這樣的分享，不追問細節、不要求原諒，會後單獨關心，協助尋求專業與法律協助，並確認他現在是否安全。不把「屬魂的」當成標籤，不用「你這是魂在作工」否定一個人的眼淚、思想或質疑（紅線五）。席上會有正在與色情掙扎、不敢開口的年輕人，對他們先講 4:8 的聖靈與 5:24 的信實，再陪他找可信任的同行者。"},{"id":"ISS00_5","t":"受苦、逼迫與家人反對——患難是命定的嗎？2:14--16 是在罵猶太人嗎？","r":"1:6；2:2；2:14--16；3:3--4","ch":[],"why":"五、患難不是意外，但不美化、不追求，更不要求人留在暴力裡；2:14–16 說的是逼迫者，不是一個民族；面對家人反對，用改變的生命代替對抗——本講義的全卷立場之五（本卷新立）。這間教會在大難中出生，逼迫來自自己的鄉親；華人信徒最常遇到的，也是被家人罵「不孝」「背祖」「入洋教」。而 2:14–16「這猶太人殺了主耶穌」在兩千年教會史裡被用來支持反猶太人的言論太多次，3:3「受患難原是命定的」也可能被拿來要求受虐的人忍耐。這一題關係到全卷前三章的落點，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>1:6「在大難之中」、2:14「受了本地人的苦害」、3:3「受患難原是命定的」——基督徒一定會受苦嗎？家人反對我信主怎麼辦？2:14–16 是在罵猶太人嗎？先讓經文自己說五件事。<strong>一、患難不是意外<\/strong>：「免得有人被諸般患難搖動。因為你們自己知道，我們受患難原是命定的」（3:3）——κείμεθα，<strong>被放在這個位置上<\/strong>；而且保羅「預先告訴你們，我們必受患難」（3:4）。<strong>二、患難裡有喜樂<\/strong>：「並且你們在大難之中，蒙了聖靈所賜的喜樂」（1:6）——不是喜歡受苦，是苦裡有聖靈。<strong>三、逼迫常常來自最近的人<\/strong>：「因為你們也受了本地人的苦害」（2:14）——συμφυλετῶν，同族的人、自己的鄉親。<\/p><p><strong>四、2:14–16 是一個猶太人寫的<\/strong>：保羅說他為了骨肉之親，「為我弟兄，我骨肉之親，就是自己被咒詛，與基督分離，我也願意」（羅 9:3）；而且他在 2:14 舉的榜樣，正是「你們曾效法猶太中在基督耶穌裡神的各教會」（2:14）——一群猶太人基督徒。<strong>五、受苦的目的是站穩<\/strong>，不是證明自己屬靈：保羅打發提摩太去，是要「堅固你們，並在你們所信的道上勸慰你們」（3:2）。<\/p>"],["2:14–16 保羅原文說（多數學者）","","<p>所有現存的抄本都有這三節，多數學者認為是保羅自己寫的。讀法的關鍵在文法：2:15–16 是一串冠詞分詞，全部掛在 2:14 末了的「猶太人」後面，描寫的是一群特定的人——殺害先知與主耶穌、把使徒趕出去、攔阻向外邦人傳福音的那一群；〔背景〕使徒行傳 17 章正是帖撒羅尼迦的猶太人聳動暴動，又追到庇哩亞（徒 17:5、13）。保羅自己從前也是這樣的人：「你們聽見我從前在猶太教中所行的事，怎樣極力逼迫殘害神的教會」（加 1:13）。這是一個被逼迫的猶太人，在描述逼迫他的猶太同胞，語氣接近舊約先知對自己百姓的責備。<\/p><p><strong>難處：<\/strong>2:16「神的忿怒臨在他們身上已經到了極處」（2:16）語氣非常重，與羅 11 章「神棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）放在一起，需要仔細解釋：「神的」二字是和合本補的，原文只說「那忿怒」；εἰς τέλος 可以是「到了極處」，也可以是「終於臨到」。不論怎樣讀，這一節說的是逼迫者的處境，不是一個民族永遠的命運。<\/p>"],["2:14–16 後人插入說（少數學者）","","<p>二十世紀有少數學者主張 2:13–16 或 2:14–16 是後人插入的。理由包括：語氣與羅 9–11 章差距太大；2:16「忿怒……已經到了極處」像是在回顧主後 70 年耶路撒冷被毀；而且 2:13 的感謝在 2:17 之後才自然接上。這派的心志值得尊重：他們不願意保羅的名字被用來支持反猶太主義，也誠實地面對了這幾節的張力。<\/p><p><strong>難處：<\/strong>沒有任何一份抄本缺這幾節，插入說完全建立在內證上；「忿怒臨到」在保羅之前已經發生過許多次災難，未必要指主後 70 年；而保羅在別處也說過很重的話，與他對同胞的愛並不衝突。本講義陳列，不採用——<strong>我們不需要把經文刪掉才能拒絕反猶太主義，照經文讀清楚就夠了。<\/strong><\/p>"],["歷代用 2:14–16 支持反猶太主義的錯誤——本講義明確拒絕","","<p>這不是一個解經學派，而是教會歷史上真實發生過、而且一再發生的錯誤：從古代教會講台上攻擊猶太人的講章，到中世紀的屠殺與驅逐、路德晚年寫下的反猶太文字，一直到近代歐洲的大屠殺，「猶太人殺了耶穌，所以被神咒詛」這一類的話，常常引用這三節作根據。這些話曾經被許多基督徒聽成理所當然。<\/p><p><strong>難處：<\/strong>它把經文讀反了。保羅自己是猶太人（羅 11:1），2:14 的榜樣是猶太地的教會，這三節說的是逼迫者，不是一個民族；釘死耶穌的，是猶太領袖與羅馬官兵一起，而福音說他是「為我們的罪死了」（林前 15:3）。<strong>本講義明確拒絕任何反猶太人的應用（紅線三）<\/strong>，也拒絕用同樣的方式貶低任何民族。<\/p>"],["成功神學與苦難浪漫化——本講義兩者都不採","","<p><strong>成功神學<\/strong>說：信耶穌就會一帆風順，受苦是因為信心不夠；<strong>苦難浪漫化<\/strong>則走到另一端：沒有被逼迫就不是真基督徒，越苦越屬靈，甚至鼓勵人故意激怒家人或政府來「為主受苦」。兩者都各自抓住了一點真實：神確實祝福人，受苦確實可以使人成長；1:6 也真的說，大難之中有聖靈所賜的喜樂。<\/p><p><strong>難處：<\/strong>成功神學與 3:3 直接衝突——保羅說患難是命定的，「預先告訴你們，我們必受患難」（3:4）。苦難浪漫化則忘了保羅自己的反應：他「既不能再忍」，打發提摩太去堅固他們（3:1–2），聽見他們站穩了才說「我們就活了」（3:8）——他沒有把他們的苦當成勳章，而是把它當成需要陪伴的重擔。更危險的是，它會被用來要求受家暴、受虐待的人「忍耐」（紅線六）。<strong>本講義兩者都不採。<\/strong><\/p>"],["【三】本講義站在哪裡","","<p><strong>2:14–16 照經文解，但明確拒絕任何反猶太人的應用<\/strong>（紅線三）：保羅自己是猶太人，2:14 的榜樣是猶太地的教會，這三節說的是逼迫者，不是一個民族；神沒有棄絕他的百姓（羅 11:1）。插入說陳列不採。<\/p><p><strong>受苦是真實的，但不美化、不追求<\/strong>：不鼓勵人故意激怒家人或政府來「為主受苦」；<strong>更不把留在家暴、虐待中講成「受患難原是命定的」<\/strong>（紅線六）——為福音受的苦，和家庭暴力、虐待，是兩件事。<strong>成功神學明確不採<\/strong>：3:3 明說患難是命定的——信耶穌不保證一帆風順；但 1:6 也說苦裡有喜樂——<strong>信耶穌保證你不是一個人受苦。<\/strong><\/p><p><strong>家人反對：不是對抗，是讓家人看見改變。<\/strong>用 1:9 的「歸向」與 4:12 的「叫你們可以向外人行事端正」——<strong>孝順是基督徒的見證，不是信仰的敵人。<\/strong>不拜偶像的界線要守住，但守的方式是溫柔、尊重、加倍地愛家人（見議題「哀傷與盼望：死亡、喪禮與祭祖」）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該被患難搖動——「免得有人被諸般患難搖動」（3:3）；<strong>但受苦的人需要的不是講道，是陪伴<\/strong>：保羅打發提摩太去（3:2），不是寄一份講章。帖撒羅尼迦人站穩了，不是因為他們夠堅強，而是因為有人掛念他們、為他們晝夜切切地祈求（3:10）。<\/p><p>如果你因為信主正被家人反對，或者在職場、學校裡因為信仰被排擠，請記得：這間教會從出生那天就是這樣，而且他們成了「馬其頓和亞該亞所有信主之人的榜樣」（1:7）。<strong>你的忍耐不是白費的，你的家人正在看。<\/strong>但如果你遇到的不是反對，而是暴力或威脅，請先保護自己的安全，告訴可信任的人——那不是不夠屬靈，那是神要你做的。<\/p>"]],"con":[],"say":"本講義的全卷立場：患難不是意外（3:3），苦裡有聖靈的喜樂（1:6）；但不美化、不追求，不要求人留在暴力裡，不鼓吹對抗。2:14–16 照經文解，說的是逼迫者，不是一個民族——保羅自己是猶太人，榜樣是猶太地的教會；明確拒絕任何反猶太人的應用。家人反對時用改變的生命與孝順作見證；成功神學明確不採——信耶穌不保證一帆風順，但保證你不是一個人受苦。","care":"牧養底線：不用 2:14–16 說任何貶低猶太人或其他民族的話（紅線三）——設想一位猶太朋友或任何少數族群的人坐在台下。不用 3:3「命定的」要求人留在暴力或不安全的處境裡（紅線六）：聽見有人在家中受暴，不叫他「再忍耐、多禱告」，會後單獨關心，協助他找到安全與專業的幫助。不浪漫化逼迫、不鼓吹對抗；為受逼迫的弟兄姊妹禱告，也尊重各地肢體的處境與判斷，不在講台上替他們決定該怎麼做。席上會有因信主被家人斷絕往來的人，先陪他難過，不急著叫他「要有見證」。"},{"id":"ISS00_6","t":"作者、寫作地點與年代：新約最早的一封信？與加拉太書孰先？","r":"1:1；3:1--6；徒 18:5","ch":[],"why":"全卷通用：保羅、西拉、提摩太三人署名；寫於哥林多，約主後 50–51 年。帖撒羅尼迦前書常被稱為「新約最早寫成的一卷書」，但這要看加拉太書寫於何時——若加拉太書寫於耶路撒冷會議之前，它就比帖撒羅尼迦前書更早。這封信由三個人署名，卻在 2:18 忽然出現「我－保羅」；它是在保羅離開帖撒羅尼迦多久以後、從哪裡寄出的，也決定我們怎樣讀第 3 章的掛念與提摩太的回報，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>信的開頭有三個名字：「保羅、西拉、提摩太寫信給帖撒羅尼迦在父神和主耶穌基督裡的教會」（1:1）。全卷大多用「我們」，只有幾處跳出「我」：「我－保羅有一兩次要去，只是撒但阻擋了我們」（2:18）；「為此，我既不能再忍」（3:5）。信裡也留下寫作時間的線索：保羅曾「願意獨自等在雅典」（3:1），打發提摩太回去，然後「但提摩太剛才從你們那裡回來」（3:6）。<\/p><p>〔背景〕使徒行傳說，保羅從雅典到了哥林多，「西拉和提摩太從馬其頓來的時候」（徒 18:5），他在那裡住了一年零六個月；後來「到迦流作亞該亞方伯的時候」（徒 18:12），猶太人把他拉到公堂。在希臘德爾斐出土的一塊銘文，可以把迦流任方伯的時間定在主後 51–52 年左右。<strong>經文問的是：誰寫了這封信？寫於何地、何時？它真的是新約最早的一卷嗎？<\/strong><\/p>"],["保羅作者說（幾乎沒有爭議）","","<p>從早期教會到今天，絕大多數學者都認為帖撒羅尼迦前書是保羅寫的。字彙、語氣、神學都與羅馬書、哥林多前後書、加拉太書相合；信裡的人物與行程，與使徒行傳 17–18 章彼此印證；二世紀的教會已經把它列在保羅書信中。十九世紀杜賓根學派的鮑爾（F. C. Baur）曾經懷疑

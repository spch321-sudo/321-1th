——前兩個用 ἐκ（ek）「出於」，講源頭與動機；第三個換成 ἐν（en）「在……裡」，講手段。πλάνη（planē） 是走岔的路，ἀκαθαρσία（akatharsia） 是不潔（當時的巡迴宗教人物常被指控藉傳道斂財、騙色），δόλος（dolos） 原指釣魚的餌：外面是食物，裡面是鉤子。<\/p><p>2:4 有一組同字根的對照：δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ（dedokimasmetha hypo tou theou） 是完成式被動，「已經被神驗過、合格了」；句末 τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν（tō dokimazonti tas kardias hēmōn） 是現在分詞，「那一直在察驗我們心的」。<strong>驗中是過去的事，被驗卻沒有停過。<\/strong>δοκιμάζω（dokimazō） 原是試驗金屬、檢定官員的字。<\/p><blockquote><p>καθὼς（kathōs）……οὕτως（houtōs） 是「正如……照樣」：神怎樣託付，我們就照樣講，不多加、不打折。οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ θεῷ（ouch hōs anthrōpois areskontes alla theō）——ἀρέσκω（areskō） 本章還會在 2:15 出現，用在那些「不得神的喜悅」的人身上。<\/p><\/blockquote>","exp":"<p>〔背景〕徒 17:1--4（使徒行傳講義第 17 章）<\/p><p>保羅在帖撒羅尼迦「一連三個安息日，本着聖經與他們辯論」（徒 17:2）。那個年代，城裡常有巡迴的演說家與宗教人物，講得動人，收了錢，風聲一緊就離開。保羅連夜走了，很容易被歸成同一類人。所以 2:3 一口氣說了三個「不是」：我們的勸勉不是出於錯誤，不是出於污穢，也不是用詭詐。不是源頭有問題，不是動機有問題，也不是手段有問題。<\/p><p>「詭詐」那個字原是魚餌。傳福音最大的試探，就是把福音當餌：先說你想聽的，再把真正要賣的東西藏在裡面。保羅說，我們不釣人。<\/p><p>他的理由在 2:4：「神既然驗中了我們，把福音託付我們，我們就照樣講」（2:4）。福音不是保羅的產品，是神寄存在他手裡的東西；寄存的人只有一個責任，就是原樣交出去。所以「不是要討人喜歡，乃是要討那察驗我們心的神喜歡」（2:4）。<\/p><p>這不是說傳道人或基督徒不必在乎別人的感受——2:7--8 會看見保羅有多在乎。差別在於：誰是那個打分數的人。在乎人，是愛；討好人，是怕。<strong>一個人若讓台下的掌聲決定台上講甚麼，他就從僕人變成了藝人。<\/strong>那位察驗人心的神一直在看，這不是壓力，是自由：只要向一位交帳，就不必向一千位演戲。<\/p>"},{"a":5,"z":6,"star":1,"grk":"<p lang=\"grc\">οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,<\/p><p lang=\"grc\">οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφʼ ὑμῶν οὔτε ἀπʼ ἄλλων,<\/p>","lit":"<p>因為我們從來沒有在諂媚的話裡，正如你們所知道的；也沒有在貪心的藉口裡，神是見證；<\/p><p>也沒有從人尋求榮耀，不從你們，也不從別人，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἐν λόγῳ κολακείας<\/td><td>en logō kolakeias<\/td><td>在諂媚的話裡<\/td><td>用嘴：說人愛聽的<\/td><\/tr><tr><td>καθὼς οἴδατε<\/td><td>kathōs oidate<\/td><td>正如你們知道<\/td><td>看得見的，請你們作證<\/td><\/tr><tr><td>ἐν προφάσει πλεονεξίας<\/td><td>en prophasei pleonexias<\/td><td>在貪心的藉口裡<\/td><td>用錢：外衣底下藏著要<\/td><\/tr><tr><td>θεὸς μάρτυς<\/td><td>theos martys<\/td><td>神是見證<\/td><td>看不見的，請神作證<\/td><\/tr><tr><td>ζητοῦντες ἐξ ἀνθρώπων δόξαν<\/td><td>zētountes ex anthrōpōn doxan<\/td><td>從人尋求榮耀<\/td><td>用名<\/td><\/tr><\/table>","gram":"<p><strong>2:5--6 是三個 οὔτε（oute） 排成一列：<\/strong>οὔτε（oute）……ἐν λόγῳ κολακείας（en logō kolakeias）、οὔτε ἐν προφάσει πλεονεξίας（oute en prophasei pleonexias）、οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν（oute zētountes ex anthrōpōn doxan）。嘴、錢、名，三種有己的事奉。<\/p><p>中間兩個見證人分工得很細：諂媚是說出口的，所以 καθὼς οἴδατε（kathōs oidate），你們聽過，你們作證；貪心藏在 πρόφασις（prophasis） 底下——這個字是「藉口、掩護、外衣」——人看不見，所以 θεὸς μάρτυς（theos martys），請神作證。外面的事請人看，裡面的事請神看。<\/p><p>和合本 2:6 的下半「雖然可以叫人尊重」，在 SBLGNT 屬 2:7 句首：δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι（dynamenoi en barei einai hōs Christou apostoloi）。βάρος（baros） 是重量，有兩種讀法：一說是「有分量、有威嚴」，可以擺使徒的架子；一說是「成為負擔」，可以要求教會供養（2:9 的 ἐπιβαρέω（epibareō） 正是同字根）。本講義認為兩義都在：使徒可以有分量，也有權接受供養；保羅兩樣都放下了。<\/p>","exp":"<p>「因為我們從來沒有用過諂媚的話，這是你們知道的；也沒有藏著貪心，這是神可以作見證的」（2:5）。這三樣東西，事奉的人都很熟。嘴：說人愛聽的，換人喜歡我。錢：說得屬靈，算的卻是奉獻。名：做得辛苦，等的是一句稱讚。它們不一定犯了甚麼大罪，卻都有一個共同點——把自己放在中心。<\/p><p>保羅說，我們沒有「向你們或向別人求榮耀」（2:6）。不從你們要，也不從別處要。這句話的分量在後面那一句：「雖然可以叫人尊重」（2:6）。他不是沒有資格，是有資格而不用。沒有權柄的人不擺架子，不算謙卑；有權柄的人把權柄放下，才是。321 說：驕傲是離開本位抓住權力；謙卑是放下權力回到本位。這兩節先把「抓」的三種樣子攤開來，下一節才讓我們看見「放下」長甚麼樣子。<\/p>"},{"a":7,"z":7,"star":3,"grk":"<p lang=\"grc\">δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·<\/p>","lit":"<p>雖然能夠作為基督的使徒在分量裡；反而我們在你們中間成了溫柔的，就像乳母用體溫捂暖她自己的孩子；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>δυνάμενοι ἐν βάρει εἶναι<\/td><td>dynamenoi en barei einai<\/td><td>能夠在分量裡<\/td><td>可以有分量、可以壓人<\/td><\/tr><tr><td>ἐγενήθημεν ἤπιοι<\/td><td>egenēthēmen ēpioi<\/td><td>我們成了溫柔的<\/td><td>SBLGNT＝和合本「存心溫柔」<\/td><\/tr><tr><td>νήπιοι<\/td><td>nēpioi<\/td><td>嬰孩<\/td><td>WH、NA28 的讀法<\/td><\/tr><tr><td>ἐν μέσῳ ὑμῶν<\/td><td>en mesō hymōn<\/td><td>在你們中間<\/td><td>不在上面，在中間<\/td><\/tr><tr><td>τροφὸς<\/td><td>trophos<\/td><td>乳母<\/td><td>餵奶的人<\/td><\/tr><tr><td>θάλπῃ<\/td><td>thalpē<\/td><td>用體溫捂暖<\/td><td>母鳥伏雛的字<\/td><\/tr><tr><td>τὰ ἑαυτῆς τέκνα<\/td><td>ta heautēs tekna<\/td><td>她自己的孩子<\/td><td>不是雇來的奶媽，是親生的母親<\/td><\/tr><\/table>","gram":"<p><strong>◆ 經文鑑別：ἤπιοι（ēpioi） 還是 νήπιοι（nēpioi）？<\/strong>SBLGNT 作 ἀλλὰ ἐγενήθημεν ἤπιοι ἐν μέσῳ ὑμῶν（alla egenēthēmen ēpioi en mesō hymōn），「我們在你們中間成了溫柔的」，與 Tregelles、RP、NIV 同，也就是和合本的「存心溫柔」。WH 與 NA28 作 νήπιοι（nēpioi），「我們在你們中間成了嬰孩」。兩個字只差一個字母 ν（n），而前一個字 ἐγενήθημεν（egenēthēmen） 正好以 ν（n） 結尾：抄寫的人多寫一個 ν（n），就成了「嬰孩」；少寫一個，就成了「溫柔」。<\/p><p>兩方的理由都很硬。νήπιοι（nēpioi） 有較早、較多的抄本支持，也是「較難的讀法」——使徒、嬰孩、乳母，一句之內連換三個意象，抄寫者較可能把難的改順，不太會把順的改難。ἤπιοι（ēpioi） 的理由是上下文：「溫柔，像乳母」意象一致；而且 νήπιος（nēpios） 在保羅筆下多半是負面的「不成熟」。兩派都承認，光憑抄本無法完全決定。本講義照和合本與 SBLGNT 讀「溫柔」，但並陳「嬰孩」；兩讀的落點相同：使徒放下了權柄，選擇最小、最軟的位置。<\/p><blockquote><p>τροφός（trophos） 是乳母、餵奶的人；但 τὰ ἑαυτῆς τέκνα（她自己的孩子）說明這不是雇來的奶媽，是親生的母親在餵自己的孩子。θάλπῃ（thalpē） 是用體溫捂暖，七十士譯本申命記 22:6 用它寫母鳥伏在雛鳥或蛋上；弗 5:29 的「保養顧惜」也是它。ὡς ἐάν（hōs ean） 加假設語氣：「就像任何一位母親會做的那樣」。<\/p><\/blockquote>","exp":"<p>這一節是全章的心臟，也是本卷最大的試探：讀到「母親」就以為讀到了自己的理念。所以先讓畫面自己站穩。<\/p><p>上半節是一個可以壓人的使徒：「我們作基督的使徒，雖然可以叫人尊重」（2:6）。下半節是一個餵奶的母親：「只在你們中間存心溫柔，如同母親乳養自己的孩子」（2:7）。中間只隔了一個「只」字，原文是 ἀλλά（alla）。保羅從講台走下來，不是走到更高的地方，是走到嬰兒床邊。<\/p><p>母親餵奶有幾件事是不能省的。要坐下來，不能站著趕時間；要把孩子抱近，靠體溫；要配合孩子的節奏，不是配合自己的行程。θάλπῃ（thalpē） 那個字就是這樣：母鳥張開翅膀，把自己的體溫給出去。帖撒羅尼迦是一間只有三個安息日大的嬰孩教會，保羅給他們的第一樣東西不是規條，是溫度。<\/p><p>不論讀「溫柔」還是讀「嬰孩」，畫面都指向同一件事：有權柄的人，選擇了最小的位置。這就是 321 說的謙卑——不是沒有權力，是放下權力回到本位；這也是 321「屬靈父母兒女」最溫柔的一幅畫。<\/p><p>但要分清楚：保羅的母親權柄是用來餵養的，不是用來壓人的。母親餵奶的目標，是孩子有一天不必再吃奶。第 3 章會說出這個目標：「你們若靠主站立得穩，我們就活了」（3:8）。<strong>屬靈父母的成功，是孩子站穩；不是孩子離不開。<\/strong>任何借「屬靈母親」「屬靈遮蓋」之名要人絕對順服、不准提問的作法，都是把這一節讀反了。<\/p><p>這一節也給今天帶人的人一面鏡子。新朋友第一次來教會，需要的常常不是一整套裝備課程，而是有人記得他的名字、陪他吃一頓飯、在他半夜傳訊息時回一句話。溫柔不是軟弱，是有力量的人願意放慢腳步。嬰孩教會先需要被抱，才學得會站。<\/p>"},{"a":8,"z":8,"star":3,"grk":"<p lang=\"grc\">οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ἐγενήθητε<\/p>","lit":"<p>這樣切切愛慕著你們，我們樂意分給你們的不只是神的福音，也是我們自己的性命，因為你們成了我們所親愛的。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὁμειρόμενοι ὑμῶν<\/td><td>homeiromenoi hymōn<\/td><td>切切愛慕你們<\/td><td>全本新約只此一次<\/td><\/tr><tr><td>εὐδοκοῦμεν<\/td><td>eudokoumen<\/td><td>我們樂意<\/td><td>不是勉強，是心甘情願<\/td><\/tr><tr><td>μεταδοῦναι<\/td><td>metadounai<\/td><td>分給<\/td><td>把自己有的分出去<\/td><\/tr><tr><td>τὸ εὐαγγέλιον τοῦ θεοῦ<\/td><td>to euangelion tou theou<\/td><td>神的福音<\/td><td>要給的第一樣<\/td><\/tr><tr><td>τὰς ἑαυτῶν ψυχάς<\/td><td>tas heautōn psychas<\/td><td>我們自己的性命<\/td><td>要給的第二樣：生命、自己<\/td><\/tr><tr><td>ἀγαπητοὶ ἡμῖν ἐγενήθητε<\/td><td>agapētoi hēmin egenēthēte<\/td><td>你們成了我們所親愛的<\/td><td>理由在愛，不在責任<\/td><\/tr><\/table>","gram":"<p><strong>ὁμειρόμενοι（homeiromenoi） 是全本新約只出現這一次的字。<\/strong>它的意思是渴念、切切思慕；有學者認為它帶著哄孩子的親暱語氣，接在 2:7 母親的畫面後面，很自然。保羅沒有用比較常見的 ἀγαπάω（agapaō），而是挑了一個最軟的字。<\/p><p>εὐδοκοῦμεν μεταδοῦναι ὑμῖν（eudokoumen metadounai hymin）：εὐδοκέω（eudokeō） 是「樂意、看為美好」，不是被迫；μεταδοῦναι（metadounai） 是「分給」，把自己手裡有的分一份出去。分甚麼？οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς（ou monon to euangelion tou theou alla kai tas heautōn psychas）——「不只……而且……」。ψυχή（psychē） 在這裡不是「靈魂」對「身體」，是整個人、性命、自己。<\/p><blockquote><p>本章有一條 γίνομαι（ginomai） 的線：2:1 γέγονεν（gegonen），2:5、7、10 ἐγενήθημεν（我們成了……），2:8、14 ἐγενήθητε（你們成了……）。保羅一直在說「我們成了怎樣的人」，到 2:8 末了第一次換成「你們成了我們所親愛的」——διότι（dioti） 引出理由：不是工作需要，是你們已經是我們的家人。<\/p><\/blockquote>","exp":"<p>「我們既是這樣愛你們，不但願意將神的福音給你們，連自己的性命也願意給你們，因你們是我們所疼愛的」（2:8）。這一節在全卷地勢圖上是一塊高地。母親的畫面到這裡說出了代價：餵奶的人，給出去的是自己的身體。<\/p><p>福音可以像快遞一樣送達：簽收、拆封、讀完。保羅說，我們不是這樣傳的。我們是連人帶福音一起給。帖撒羅尼迦人聽到的道，是從一個晚上織帳棚、白天陪他們讀聖經、為他們流過淚的人口中出來的。<strong>福音是神的；但福音走進一個人心裡的那條路，常常是另一個人的生命鋪出來的。<\/strong><\/p><p>這是 321「無己」在本卷的本文。無己不是沒有自己——保羅在這封信裡有情緒、有渴想、有掛念、會「不能再忍」（3:1）。無己是把自己給出去。沒有自己的人，沒有東西可以給；有自己而不肯給的人，給出去的只是資訊。<\/p><p>還要注意給的方向：是父母給孩子，不是孩子給父母。保羅沒有說「你們要把性命交給我們」，他說「我們把性命給你們」。凡是要別人為自己擺上一切的屬靈領袖，已經把這一節倒過來讀了。今天的牧者、小組長、帶門徒的人，讀到這裡要問的不是「我有多少人跟隨」，而是「我把甚麼給出去了」。<\/p><p>同時也要說清楚：把性命給出去，不是把自己耗盡到倒下。保羅會休息、會求人代禱、會打發同工分擔（3:2）。給出去的是愛裡的自己，不是被壓榨的自己。一位累垮了的母親餵不了孩子；真正的無己，是長久地給，而不是一次燒完。<\/p>"},{"a":9,"z":9,"star":1,"grk":"<p lang=\"grc\">Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.<\/p>","lit":"<p>因為你們記得，弟兄們，我們的勞苦和辛勞；夜裡和白天做工，為要不加重擔在你們任何一人身上，我們向你們宣講了神的福音。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Μνημονεύετε<\/td><td>Mnēmoneuete<\/td><td>你們記得<\/td><td>又一次請讀信的人作證<\/td><\/tr><tr><td>τὸν κόπον ἡμῶν καὶ τὸν μόχθον<\/td><td>ton kopon hēmōn kai ton mochthon<\/td><td>我們的勞苦和辛勞<\/td><td>兩個押韻的字疊在一起<\/td><\/tr><tr><td>νυκτὸς καὶ ἡμέρας ἐργαζόμενοι<\/td><td>nyktos kai hēmeras ergazomenoi<\/td><td>夜裡和白天做工<\/td><td>夜在前：天沒亮就開工<\/td><\/tr><tr><td>πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν<\/td><td>pros to mē epibarēsai tina hymōn<\/td><td>不加重擔在你們任何一人身上<\/td><td>與 2:7 βάρει 同字根<\/td><\/tr><tr><td>ἐκηρύξαμεν<\/td><td>ekēryxamen<\/td><td>我們宣講了<\/td><td>傳令官的字<\/td><\/tr><\/table>","gram":"<p><strong>κόπος（kopos） 與 μόχθος（mochthos） 是一對押韻的近義詞<\/strong>，帖後 3:8 與林後 11:27 也把它們連在一起用：前者強調累，後者強調苦。νυκτὸς καὶ ἡμέρας（nyktos kai hēmeras） 是時間屬格，「在夜裡、在白天」；猶太人以日落為一天的開始，夜放在前面，也正好描寫工匠天沒亮就開工。<\/p><p>最要緊的是 πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν（pros to mē epibarēsai tina hymōn）：ἐπιβαρέω（epibareō） 是「加重量在……身上」，與 2:7 的 ἐν βάρει（en barei） 同一個字根 βάρος（baros）。兩節之間形成一個對照：保羅「可以有分量」，卻不肯「成為重量」。主要動詞 ἐκηρύξαμεν（ekēryxamen） 是傳令官宣告的字，與分詞 ἐργαζόμενοι（ergazomenoi） 並排：一邊做工，一邊宣講。<\/p>","exp":"<p>「弟兄們，你們記念我們的辛苦勞碌，晝夜做工，傳神的福音給你們，免得叫你們一人受累」（2:9）。保羅做的是織帳棚的手藝，「保羅因與他們同業，就和他們同住做工」（徒 18:3）。在帖撒羅尼迦大概也是這樣：在作坊裡一邊切皮、縫線，一邊跟來買帳棚的人講耶穌。<\/p><p>為甚麼不收錢？不是因為收錢不屬靈。保羅在別處明說傳福音的人有權靠福音養生，他自己也收過腓立比教會的饋送。他在這裡不收，是為了這一間教會的處境：一群剛離棄偶像、多半是手藝人與勞工的嬰孩信徒，又正在受逼迫；城裡還有人說他是來騙錢的。保羅選擇不成為他們的重擔，也不給人說閒話的把柄。<\/p><p>所以帶職事奉與全職事奉沒有哪一個比較屬靈。問的不是收不收，而是怎樣做最不會攔阻福音、最能餵養眼前這群人。對今天在職場上一邊上班、一邊帶小組的弟兄姊妹，這一節是一個安慰：你的作坊，也可以是講台。<\/p>"},{"a":10,"z":12,"star":2,"grk":"<p lang=\"grc\">ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,<\/p><p lang=\"grc\">καθάπερ οἴδατε ὡς ἕνα ἕκαστον ὑμῶν ὡς πατὴρ τέκνα ἑαυτοῦ<\/p><p lang=\"grc\">παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.<\/p>","lit":"<p>你們是見證人，神也是，我們向你們這些信的人是何等聖潔、公義、無可指摘地成為了；<\/p><p>正如你們知道，我們怎樣對你們每一個人，好像父親對他自己的兒女，<\/p><p>勸勉你們，安慰，並且見證，要你們行事配得上神，就是那呼召你們進入他自己的國和榮耀的。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὑμεῖς μάρτυρες καὶ ὁ θεός<\/td><td>hymeis martyres kai ho theos<\/td><td>你們是見證人，神也是<\/td><td>人與神兩位見證人<\/td><\/tr><tr><td>ὁσίως καὶ δικαίως καὶ ἀμέμπτως<\/td><td>hosiōs kai dikaiōs kai amemptōs<\/td><td>聖潔、公義、無可指摘地<\/td><td>三個副詞：向神、向人、向控告者<\/td><\/tr><tr><td>ἕνα ἕκαστον ὑμῶν<\/td><td>hena hekaston hymōn<\/td><td>你們每一個人<\/td><td>一個一個地<\/td><\/tr><tr><td>ὡς πατὴρ τέκνα ἑαυτοῦ<\/td><td>hōs patēr tekna heautou<\/td><td>如同父親對自己的兒女<\/td><td>母親之後是父親<\/td><\/tr><tr><td>παρακαλοῦντες<\/td><td>parakalountes<\/td><td>勸勉<\/td><td>站在旁邊呼喚<\/td><\/tr><tr><td>παραμυθούμενοι<\/td><td>paramythoumenoi<\/td><td>安慰<\/td><td>對灰心的人輕聲說話<\/td><\/tr><tr><td>μαρτυρόμενοι<\/td><td>martyromenoi<\/td><td>囑咐（見證）<\/td><td>鄭重地作見證<\/td><\/tr><tr><td>περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ<\/td><td>peripatein hymas axiōs tou theou<\/td><td>你們行事配得上神<\/td><td>目標是孩子會走路<\/td><\/tr><\/table>","gram":"<p><strong>分節注意：<\/strong>和合本 2:11 的「勸勉你們，安慰你們，囑咐你們各人」，三個分詞在 SBLGNT 屬 2:12：παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι（parakalountes hymas kai paramythoumenoi kai martyromenoi）。2:11 原文其實沒有動詞，只有 καθάπερ οἴδατε ὡς ἕνα ἕκαστον ὑμῶν ὡς πατὴρ τέκνα ἑαυτοῦ（kathaper oidate hōs hena hekaston hymōn hōs patēr tekna heautou），句子要等到 2:12 才完成。本講義引原文照 SBLGNT 分節。<\/p><p>2:10 的三個副詞 ὁσίως καὶ δικαίως καὶ ἀμέμπτως（hosiōs kai dikaiōs kai amemptōs） 各有方向：ὁσίως（hosiōs） 是向神虔敬，δικαίως（dikaiōs） 是向人公道，ἀμέμπτως（amemptōs） 是面對控告時無話可說。見證人又是兩位：ὑμεῖς μάρτυρες καὶ ὁ θεός（hymeis martyres kai ho theos），與 2:5 同一個手法。<\/p><p>父親的三個分詞各有語氣：παρακαλέω（parakaleō） 是站在旁邊呼喚，παραμυθέομαι（paramytheomai） 是對灰心、喪氣的人輕聲安慰（5:14 的「勉勵灰心的人」是同字根），μαρτύρομαι（martyromai） 是鄭重地作見證，和合本譯「囑咐」。目標用 εἰς τὸ（eis to） 引出：περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ（peripatein hymas axiōs tou theou）。τοῦ καλοῦντος（tou kalountos） 是現在分詞：神不是「從前召過」，是一直在呼召。<\/p>","exp":"<p>母親之後是父親。「你們也曉得，我們怎樣勸勉你們，安慰你們，囑咐你們各人，好像父親待自己的兒女一樣」（2:11）。母親的畫面重在餵養與溫度，父親的畫面重在方向：孩子要走路了，要有人在旁邊說話。<\/p><p>三個動詞是三種說話方式。勸勉是推一把；安慰是扶一下；囑咐是把話說重，說清楚。好的父親三樣都會，也知道甚麼時候用哪一樣：對軟弱的孩子不下重話，對任性的孩子不只哄。這就是 321 的 920——每一個 2 都不一樣，所以要「各人」，原文是一個一個地。保羅沒有對全教會廣播，他認得每一張臉。<\/p><p>目標是：「要叫你們行事對得起那召你們進他國、得他榮耀的神」（2:12）。<strong>對得起的是神，不是對得起保羅。<\/strong>屬靈父親把孩子帶到神面前，自己就退到一邊。他的權柄來自 2:10 的生活——聖潔、公義、無可指摘，而且是可以讓人檢驗的：「有你們作見證，也有神作見證」（2:10）。不肯被檢驗的權柄，不是父親的權柄。<\/p><p>所以「屬靈父親」不是一個頭銜，是一種用生命換來的關係；它的果子是兒女自己會走路，自己向神負責。若一個關係讓人越來越不敢自己讀經、自己禱告、自己判斷，那就已經離開了 2:11--12 的父親。<\/p>"},{"a":13,"z":13,"star":2,"grk":"<p lang=\"grc\">Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρʼ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.<\/p>","lit":"<p>也因此我們也不住地感謝神，因為你們從我們領受了所聽見的神的道，你們接受了，不是當作人的道，而是照它真實所是的，神的道，它也在你們這些信的人裡面運行。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀδιαλείπτως<\/td><td>adialeiptōs<\/td><td>不住地<\/td><td>與 1:2、5:17 同字<\/td><\/tr><tr><td>παραλαβόντες λόγον ἀκοῆς<\/td><td>paralabontes logon akoēs<\/td><td>領受了所聽見的道<\/td><td>接過傳下來的東西<\/td><\/tr><tr><td>ἐδέξασθε<\/td><td>edexasthe<\/td><td>你們接受了<\/td><td>歡迎、接待<\/td><\/tr><tr><td>οὐ λόγον ἀνθρώπων<\/td><td>ou logon anthrōpōn<\/td><td>不是人的道<\/td><td><\/td><\/tr><tr><td>ἀληθῶς<\/td><td>alēthōs<\/td><td>真實地<\/td><td>照它本來所是的<\/td><\/tr><tr><td>ὃς καὶ ἐνεργεῖται ἐν ὑμῖν<\/td><td>hos kai energeitai en hymin<\/td><td>它也在你們裡面運行<\/td><td>道會做工<\/td><\/tr><\/table>","gram":"<p><strong>2:13 有兩個「接受」：<\/strong>παραλαβόντες（paralabontes） 與 ἐδέξασθε（edexasthe）。παραλαμβάνω（paralambanō） 是接過傳下來的東西，猶太拉比傳授教訓、保羅傳主的晚餐都用它（林前 11:23），重在內容的傳遞；δέχομαι（dechomai） 是歡迎、接待一位客人，重在心的態度。帖撒羅尼迦人兩樣都做了：聽進去，也迎進來。<\/p><p>λόγον ἀκοῆς παρʼ ἡμῶν τοῦ θεοῦ（logon akoēs par' hēmōn tou theou） 字序很擠：「聽見的道——從我們——神的」。從誰口中出來？保羅。是誰的道？神的。接著用 οὐ（ou）……ἀλλὰ（alla） 對照：οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ（ou logon anthrōpōn alla kathōs alēthōs estin logon theou）。ἀληθῶς（alēthōs） 是「照它真實所是的」。<\/p><p>關係代名詞 ὃς（hos） 是陽性，λόγος（logos） 與 θεός（theos） 都是陽性，文法上兩者皆可；多數學者連到 λόγος（logos）：是道在做工。ἐνεργεῖται（energeitai） 是現在式，運行沒有停；ἀδιαλείπτως（adialeiptōs） 與 1:2、5:17 同字，保羅的感謝也沒有停。<\/p>","exp":"<p>「為此，我們也不住地感謝神，因你們聽見我們所傳神的道就領受了；不以為是人的道，乃以為是神的道」（2:13）。保羅前面花了十二節說自己怎樣傳、怎樣活，到這裡把功勞一把推開：你們接受的不是我們的道。<\/p><p>這是新約對聖經最早的一段自我描述之一。從誰口中出來是人，是誰的話是神。人寫的，怎麼是神的話？保羅沒有給一套理論，他給了一個現象：「這道實在是神的，並且運行在你們信主的人心中」（2:13）。證據不只在書房裡，也在人身上：離棄了偶像的人、受了逼迫還站著的人。<\/p><p>這對今天手上只有一本聖經的弟兄姊妹很重要。帖撒羅尼迦人的創辦人被趕走了，他們手上只剩下聽過的道和一封信。保羅說，夠了，因為那道本身會做工。<strong>傳道人會離開，道不會離開。<\/strong>321 把聖經放在根基的位置，原因就在這裡：不是因為講的人可靠，是因為說話的那一位可靠。<\/p><p>反過來說，講道的人也要被這一節約束：既然是神的道，講的人就不可以把自己的意見包裝成「神說」。保羅在 5:21 會叫教會「凡事察驗」，講台也在其中。尊重神的道，和察驗人的話，兩件事不衝突。<\/p><p>下一節的 γάρ（gar） 會說出道做工的第一個樣子，出人意料：不是順利，是受苦還站得住。<\/p>"},{"a":14,"z":14,"star":1,"grk":"<p lang=\"grc\">ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων<\/p>","lit":"<p>因為你們成了效法者，弟兄們，效法那些在猶太、在基督耶穌裡的神的眾教會，因為你們也從你們自己的同族人受了同樣的苦，正如他們也從那些猶太人受了一樣，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>μιμηταὶ ἐγενήθητε<\/td><td>mimētai egenēthēte<\/td><td>你們成了效法者<\/td><td>1:6 的效法再一次<\/td><\/tr><tr><td>τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ<\/td><td>tōn ekklēsiōn tou theou tōn ousōn en tē Ioudaia<\/td><td>在猶太的神的眾教會<\/td><td>榜樣是猶太信徒的教會<\/td><\/tr><tr><td>τὰ αὐτὰ ἐπάθετε<\/td><td>ta auta epathete<\/td><td>受了同樣的苦<\/td><td><\/td><\/tr><tr><td>ὑπὸ τῶν ἰδίων συμφυλετῶν<\/td><td>hypo tōn idiōn symphyletōn<\/td><td>從你們自己的同族人<\/td><td>本地鄉親<\/td><\/tr><tr><td>ὑπὸ τῶν Ἰουδαίων<\/td><td>hypo tōn Ioudaiōn<\/td><td>從那些猶太人<\/td><td>與上一行平行：各自的同族<\/td><\/tr><\/table>","gram":"<p><strong>2:14 用 γάρ（gar） 解釋 2:13：<\/strong>道在你們裡面運行，證據就是你們成了效法者——μιμηταὶ ἐγενήθητε（mimētai egenēthēte），與 1:6 同一個字。效法的對象很特別：τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ（tōn ekklēsiōn tou theou tōn ousōn en tē Ioudaia en Christō Iēsou）——猶太地的神的眾教會，成員幾乎全是猶太人。<\/p><p>句子是一組平行：你們 ὑπὸ τῶν ἰδίων συμφυλετῶν（hypo tōn idiōn symphyletōn），他們 ὑπὸ τῶν Ἰουδαίων（hypo tōn Ioudaiōn）。συμφυλέτης（symphyletēs） 是同一個 φυλή（族群、鄉里）的人，就是本地鄉親。平行的重點是「被自己人逼迫」：帖撒羅尼迦的信徒被帖撒羅尼迦人逼迫，猶太地的信徒被猶太地的人逼迫。所以這裡的 Ἰουδαίων（Ioudaiōn） 首先是「猶太地那些逼迫教會的同族人」，不是對一個民族下定義。<\/p>","exp":"<p>「弟兄們，你們曾效法猶太中在基督耶穌裡神的各教會；因為你們也受了本地人的苦害，像他們受了猶太人的苦害一樣」（2:14）。先看保羅舉的榜樣是誰：一群猶太人基督徒。這一節第一個要讀出來的是尊敬，不是敵意。<\/p><p>第二件事是：逼迫常常來自最近的人。「本地人」原文是同族、同鄉、自己的鄉親。帖撒羅尼迦人信了耶穌，最難受的不是陌生人的敵意，是鄰居、親戚、同業公會的人翻臉。這在華人處境裡非常熟悉：信主以後被說不孝、背祖、入洋教，過年回家變成最難的一段路。<\/p><p>保羅沒有教他們反擊，也沒有叫他們跟家人斷絕。他把他們放進一條更長的隊伍：在你們以前，已經有人這樣走過，而且走得過來。家人反對的時候，用改變的生命代替對抗，用孝順作見證，讓家人看見信耶穌的人更懂得愛父母。這比任何辯論都有力。<\/p>"},{"a":15,"z":16,"star":3,"grk":"<p lang=\"grc\">τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,<\/p><p lang=\"grc\">κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπʼ αὐτοὺς ἡ ὀργὴ εἰς τέλος.<\/p>","lit":"<p>就是那些殺了主耶穌和眾先知、又把我們趕出去的，他們也不討神喜歡，並且與所有的人為敵，<\/p><p>攔阻我們向外邦人講說好叫他們得救，以致他們的罪總是被填滿。那忿怒卻已經臨到他們身上，到了盡頭。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν<\/td><td>tōn kai ton kyrion apokteinantōn Iēsoun<\/td><td>那些也殺了主耶穌的<\/td><td>τῶν 接上 2:14 末字<\/td><\/tr><tr><td>ἐκδιωξάντων<\/td><td>ekdiōxantōn<\/td><td>把我們趕出去的<\/td><td>徒 17:5--10 的那一夜<\/td><\/tr><tr><td>θεῷ μὴ ἀρεσκόντων<\/td><td>theō mē areskontōn<\/td><td>不討神喜歡的<\/td><td>與 2:4 ἀρέσκοντες 對照<\/td><\/tr><tr><td>κωλυόντων<\/td><td>kōlyontōn<\/td><td>攔阻<\/td><td>攔阻向外邦人傳福音<\/td><\/tr><tr><td>εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε<\/td><td>eis to anaplērōsai autōn tas hamartias pantote<\/td><td>以致總是填滿他們的罪<\/td><td>罪的量杯<\/td><\/tr><tr><td>ἔφθασεν<\/td><td>ephthasen<\/td><td>已經臨到<\/td><td>不定過去式<\/td><\/tr><tr><td>ἡ ὀργὴ εἰς τέλος<\/td><td>hē orgē eis telos<\/td><td>那忿怒到了盡頭<\/td><td>原文無「神的」<\/td><\/tr><\/table>","gram":"<p><strong>2:15--16 是一串冠詞分詞，<\/strong>全部掛在 2:14 末了的 τῶν Ἰουδαίων（tōn Ioudaiōn） 後面：τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν（tōn kai ton kyrion apokteinantōn Iēsoun）、ἐκδιωξάντων（ekdiōxantōn）、θεῷ μὴ ἀρεσκόντων（theō mē areskontōn）、πᾶσιν ἀνθρώποις ἐναντίων（pasin anthrōpois enantiōn）、κωλυόντων（kōlyontōn）。古抄本沒有標點，後人在 2:14 末了加不加逗點，意思就不同：不加，是限定的「那些殺了主耶穌……的猶太人」，指一群特定的逼迫者；加了，就容易被讀成「猶太人——他們殺了主」，變成對整個民族的定義。從 2:14 的平行與保羅自己的身分看，限定的讀法較合文意。<\/p><p>θεῷ μὴ ἀρεσκόντων（theō mē areskontōn） 呼應 2:4：保羅討神喜歡，攔阻福音的人不討神喜歡；而保羅自己從前正是這樣的人（加 1:13；腓 3:6）。εἰς τὸ ἀναπληρῶσαι（eis to anaplērōsai） 是把量杯填滿的意象。<\/p><blockquote><p>◆ 經文鑑別 2:16：原文是 ἔφθασεν δὲ ἐπʼ αὐτοὺς ἡ ὀργὴ εἰς τέλος（ephthasen de ep' autous hē orgē eis telos），只說「那忿怒」，沒有「神的」；和合本以小字補「神的」，NIV 同。兩種讀法：照原文只讀「那忿怒」，保留保羅的含蓄；或照和合本補明是神的忿怒。本講義判斷補字的意思正確——1:10 已說到「將來的忿怒」，這忿怒當然屬神——但讀者要知道「神的」是補的小字。εἰς τέλος（eis telos） 又有三種讀法：「到了極處」「終於」「直到末了」，並陳。ἔφθασεν（ephthasen） 是不定過去式，有學者指向當時某件歷史事件（如主後 49 年羅馬驅逐猶太人），也有人讀成先知式的「必定臨到」。少數學者主張 2:14--16 是後人插入，但沒有任何抄本支持，本講義陳列但不採。<\/p><\/blockquote>","exp":"<p>這兩節是全本新約最常被誤用的經文之一。中世紀與近代歐洲，有人拿「這猶太人殺了主耶穌」（2:15）當作仇恨、驅逐、屠殺的理由。所以讀這兩節以前，先把三件事放在桌上，這不是替經文辯護，是讓經文自己說話。<\/p><p>第一，寫這句話的人自己是猶太人。他在別處說，為了骨肉之親，「就是自己被咒詛，與基督分離，我也願意」（羅 9:3）。第二，2:14 的榜樣正是猶太地的教會。第三，這一串話描寫的是「做了甚麼事的人」：殺主、趕走使徒、攔阻福音。說的是逼迫者，不是一個民族。<strong>把這兩節讀成猶太人被神棄絕、活該受報應，是錯讀，也是違背福音。<\/strong>保羅自己後來問：「上帝棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）<\/p><p>那麼「常常充滿自己的罪惡。神的忿怒臨在他們身上已經到了極處」（2:16）說的是甚麼？這使我們想起創 15:16：「亞摩利人的罪孽還沒有滿盈」（創 15:16）。神忍耐，給時間；但攔阻別人得救，是把罪的量杯一直往上填。這個原則對誰都一樣，包括外邦人，也包括教會：任何人用權力攔阻福音，都站在同一個危險的位置上。<\/p><p>今天的應用因此很清楚：這兩節不能被用來貶低任何民族——一位猶太朋友，或任何少數族群的人坐在台下，不該覺得自己被當成敵人。受逼迫的人要知道，神看見了，審判在神手裡，不在我們手裡；我們的責任是像 2:14 的猶太信徒一樣，站穩，不報復。<\/p><p>還有一層：這幾節也照出我們自己。保羅寫「他們不得神的喜悅」（2:15）時，一定記得自己從前也是逼迫教會的人。讀這段經文最好的姿勢不是指著別人，是低頭想：我有沒有在家裡、職場或教會裡，用自己的權力攔住了別人親近神？<\/p>"},{"a":17,"z":18,"star":2,"grk":"<p lang=\"grc\">Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφʼ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.<\/p><p lang=\"grc\">διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.<\/p>","lit":"<p>但我們，弟兄們，被奪離你們如同成了孤兒，只一個時辰的時間，是面不是心，我們更加竭力，在許多的渴想中要見你們的面。<\/p><p>所以我們想要到你們那裡，我保羅也一次又兩次，撒但卻截斷了我們。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀπορφανισθέντες ἀφʼ ὑμῶν<\/td><td>aporphanisthentes aph' hymōn<\/td><td>被奪離你們，成了孤兒<\/td><td>父母反成孤兒<\/td><\/tr><tr><td>πρὸς καιρὸν ὥρας<\/td><td>pros kairon hōras<\/td><td>一個時辰的時間<\/td><td>只是暫時<\/td><\/tr><tr><td>προσώπῳ οὐ καρδίᾳ<\/td><td>prosōpō ou kardia<\/td><td>是面不是心<\/td><td>面目離別，心不離別<\/td><\/tr><tr><td>ἐν πολλῇ ἐπιθυμίᾳ<\/td><td>en pollē epithymia<\/td><td>在許多的渴想中<\/td><td>ἐπιθυμία 在這裡是好的<\/td><\/tr><tr><td>καὶ ἅπαξ καὶ δίς<\/td><td>kai hapax kai dis<\/td><td>一次又兩次<\/td><td>不只一次<\/td><\/tr><tr><td>ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς<\/td><td>enekopsen hēmas ho Satanas<\/td><td>撒但截斷了我們<\/td><td>在路上挖斷<\/td><\/tr><\/table>","gram":"<p><strong>ἀπορφανισθέντες（aporphanisthentes） 是本章第三個家人的意象。<\/strong>ἀπορφανίζω（aporphanizō） 出自 ὀρφανός（孤兒），指被奪去親人；用在孩子身上是失去父母，用在父母身上是失去孩子。一章之內，保羅是母親（2:7）、是父親（2:11），現在成了孤兒。被動式：不是他走的，是被拆開的。<\/p><p>πρὸς καιρὸν ὥρας（pros kairon hōras） 是「只一個時辰的時間」，προσώπῳ οὐ καρδίᾳ（prosōpō ou kardia） 是兩個與格的對照：面離開了，心沒有。ἐπιθυμία（epithymia） 在新約多半指私慾，這裡卻是正面的渴想——同一個字，看它朝向誰。<\/p><p>ἐνέκοψεν（enekopsen） 出自 ἐγκόπτω（enkoptō），原是在路上挖溝、截斷道路，軍隊用來阻擋敵軍前進。主詞是 ὁ Σατανᾶς（ho Satanas）。對照徒 16:6--7，那一次攔住保羅的是聖靈與「耶穌的靈」；這一次保羅清楚說是撒但。同樣是「去不成」，來源不同。<\/p>","exp":"<p>〔背景〕徒 17:5--10（使徒行傳講義第 17 章）<\/p><p>本系列使徒行傳講義第 17 章講過那一夜：暴民闖進耶孫的家，「弟兄們隨即在夜間打發保羅和西拉往庇哩亞去」（徒 17:10）。保羅不是自己離開的，是被拆開的。所以他用了一個很重的字：「我們暫時與你們離別」（2:17），原文是成了孤兒。這是全卷地勢圖上的一個低谷。<\/p><p>但他馬上補一句：「是面目離別，心裡卻不離別」（2:17）。距離拆得開臉，拆不開心。這句話對今天在線上聚會、散居各地的弟兄姊妹特別親切：見不到面，不等於不在一起。<\/p><p>「我－保羅有一兩次要去，只是撒但阻擋了我們」（2:18）。怎樣分辨撒但攔阻，還是神關門？保羅沒有給一個公式。在使徒行傳 16 章，他把去不成讀成聖靈的引導；在這裡，他讀成撒但的攔阻。兩次都是後來回頭看才說得清楚。可以確定的是他的反應：不怪罪帖撒羅尼迦人，不陷入自責，也不停止愛。去不了，就寫信；寫信不夠，就打發提摩太（3:2）。<strong>撒但能挖斷保羅的路，挖不斷保羅的心。<\/strong>今天遇到一扇關上的門，最要緊的不是立刻判定是誰關的，而是像保羅一樣，換一條路繼續愛。<\/p>"},{"a":19,"z":20,"star":3,"grk":"<p lang=\"grc\">τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;<\/p><p lang=\"grc\">ὑμεῖς γάρ ἐστε ἡ δόξα ἡμῶν καὶ ἡ χαρά.<\/p>","lit":"<p>因為甚麼是我們的盼望或喜樂或誇耀的冠冕——豈不也是你們嗎——在我們主耶穌面前，在他的來臨中？<\/p><p>因為你們就是我們的榮耀和喜樂。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τίς γὰρ ἡμῶν ἐλπὶς<\/td><td>tis gar hēmōn elpis<\/td><td>甚麼是我們的盼望<\/td><td>信愛望追蹤：盼望<\/td><\/tr><tr><td>ἢ χαρὰ<\/td><td>ē chara<\/td><td>或喜樂<\/td><td><\/td><\/tr><tr><td>ἢ στέφανος καυχήσεως<\/td><td>ē stephanos kauchēseōs<\/td><td>或誇耀的冠冕<\/td><td>勝利者的花冠<\/td><\/tr><tr><td>ἢ οὐχὶ καὶ ὑμεῖς<\/td><td>ē ouchi kai hymeis<\/td><td>豈不也是你們嗎<\/td><td>破折號插進來的答案<\/td><\/tr><tr><td>ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ<\/td><td>emprosthen tou kyriou hēmōn Iēsou<\/td><td>在我們主耶穌面前<\/td><td><\/td><\/tr><tr><td>ἐν τῇ αὐτοῦ παρουσίᾳ<\/td><td>en tē autou parousia<\/td><td>在他的來臨中<\/td><td>παρουσία 本卷第一次<\/td><\/tr><tr><td>ἡ δόξα ἡμῶν καὶ ἡ χαρά<\/td><td>hē doxa hēmōn kai hē chara<\/td><td>我們的榮耀和喜樂<\/td><td>答案再說一次<\/td><\/tr><\/table>","gram":"<p><strong>◆ 經文鑑別 2:19：和合本「站立得住」是小字補充。<\/strong>原文 τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως（tis gar hēmōn elpis ē chara ē stephanos kauchēseōs）— ἢ οὐχὶ καὶ ὑμεῖς（ē ouchi kai hymeis）— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ（emprosthen tou kyriou hēmōn Iēsou en tē autou parousia）; 直譯是：「我們的盼望、喜樂、誇耀的冠冕是甚麼——豈不就是你們嗎——在我們主耶穌面前、在他來的時候？」保羅說到一半，用破折號插進答案；句子沒有「站立」這個動詞。<\/p><p>兩種讀法：和合本補上「站立得住」，把句子讀成「你們在主面前站得住，就是我們的冠冕」，意思通順，也與 3:8、3:13 的主題相合；照原文不補，重點落在「你們本身就是冠冕」，不以表現為條件。本講義判斷：補字合乎全卷文意，但要知道它是小字；保羅在這一節說的不是「你們若怎樣」，是「你們就是」。<\/p><blockquote><p>παρουσία（parousia） 在本卷第一次出現（3:13；4:15；5:23 還有），原是君王或皇帝正式駕臨一座城，全城出去迎接。στέφανος（stephanos） 是競技勝利者或凱旋者頭上的花冠，不是王冠 διάδημα（diadēma）。ἢ（ē）……ἢ（ē）……ἢ（ē） 連三個「或」，2:20 的 γάρ（gar） 再把答案說一次，加上冠詞：ἡ δόξα ἡμῶν καὶ ἡ χαρά（hē doxa hēmōn kai hē chara）。<\/p><\/blockquote>","exp":"<p>「我們的盼望和喜樂，並所誇的冠冕是甚麼呢？豈不是我們主耶穌來的時候、你們在他面前站立得住嗎？」（2:19）這一節是全章的山峰，緊接在 2:17 的低谷之後，中間只隔一節。被拆散成孤兒的人，抬起頭就看見主來的那一天。<\/p><p>第 1 章以「等候他兒子從天降臨」（1:10）收尾，第 2 章也以主的來臨收尾——本卷五章，每一章都這樣。主一定會回來；保羅提到這件事，不是為了排時間表，是為了給一個被拆散的家一個重逢的日子。<\/p><p>那一天保羅想拿甚麼到主面前？不是講過多少堂道、建過多少間教會，是一張一張的臉。<strong>保羅的冠冕是人。<\/strong>勝利者的花冠在運動場上會枯萎，保羅的冠冕卻會活到永遠。「因為你們就是我們的榮耀，我們的喜樂」（2:20）。<\/p><p>這裡也有一個提醒：冠冕是人，不是人數。保羅誇的不是規模，是這些人在主面前；而且照原文，他們本身就是冠冕，不是等他們表現夠好才算。今天帶人的牧者、小組長、父母，可以問自己：我盼望在主面前帶著的，是我的成績，還是我所愛的人？<\/p><p>這一節也把第 2 章接到第 3 章。冠冕要在主來的時候戴上，那麼現在呢？保羅放不下，所以打發提摩太去，然後寫下全卷的樞紐：「你們若靠主站立得穩，我們就活了」（3:8）。<\/p><p>讀完這一節，人應該更想念主來，而不是更害怕主來。保羅講主的來臨，講的是重逢、喜樂、冠冕；那是一個家終於團圓的日子。盼望主再來的人，今天就會更珍惜身邊每一張臉，因為那些臉就是將來的冠冕。<\/p>"}],"3":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Διὸ μηκέτι στέγοντες εὐδοκήσαμεν καταλειφθῆναι ἐν Ἀθήναις μόνοι,<\/p><p lang=\"grc\">καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ συνεργὸν τοῦ θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ὑπὲρ τῆς πίστεως ὑμῶν<\/p>","lit":"<p>所以，當我們再也撐不住的時候，我們甘願被獨自留在雅典，<\/p><p>並且我們差了提摩太，我們的弟兄，也是神在基督的福音上的同工，為要堅固你們，並為了你們的信心勸慰你們，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>μηκέτι στέγοντες<\/td><td>mēketi stegontes<\/td><td>再也撐不住了<\/td><td>στέγω 原是屋頂遮住、承受得住<\/td><\/tr><tr><td>εὐδοκήσαμεν<\/td><td>eudokēsamen<\/td><td>我們甘願、定意<\/td><td>不是被迫，是自己選的<\/td><\/tr><tr><td>καταλειφθῆναι<\/td><td>kataleiphthēnai<\/td><td>被留下<\/td><td>被動式：像被丟在後面<\/td><\/tr><tr><td>ἐν Ἀθήναις μόνοι<\/td><td>en Athēnais monoi<\/td><td>獨自在雅典<\/td><td>μόνοι 放在句末，最重<\/td><\/tr><tr><td>συνεργὸν τοῦ θεοῦ<\/td><td>synergon tou theou<\/td><td>神的同工<\/td><td>SBLGNT；和合本跟另一讀「執事」<\/td><\/tr><tr><td>στηρίξαι<\/td><td>stērixai<\/td><td>堅固、撐住<\/td><td>3:13 再出現，前後包住全章<\/td><\/tr><tr><td>παρακαλέσαι<\/td><td>parakalesai<\/td><td>勸慰、在旁邊鼓勵<\/td><td>παρά「旁邊」＋καλέω「呼喚」<\/td><\/tr><\/table>","gram":"<p><strong>3:1 開頭的 Διὸ（Dio） 把第 3 章接在 2:17--20 的思念上：保羅在 2:17 用 ἀπορφανισθέντες（aporphanisthentes） 形容自己，像被奪去孩子的父母，想回去又被攔阻，「所以」才有這一章。<\/strong><\/p><p>μηκέτι στέγοντες（mēketi stegontes） 是現在分詞。στέγω（stegō） 的字根和「屋頂」同源，原意是遮蓋、擋住、承受得住；林前 13:7 用它說愛「凡事包容」。保羅用這個字的否定形說：那層屋頂撐不住了。這不是一句客套，是一個人承認自己的承受力到了邊界。3:5 他又用一次，改成單數 στέγων（stegōn），兩次把 3:1--5 框成一段。<\/p><p>εὐδοκήσαμεν（eudokēsamen） 是「我們甘願」，接著卻是被動不定詞 καταλειφθῆναι（kataleiphthēnai）「被留下」，句末再補一個 μόνοι（monoi）「獨自」。甘願與被留下放在同一句，正是這一節的張力：決定是自己做的，孤單也是真的。複數「我們」多半是保羅以團隊名義說話，3:5 κἀγὼ（kagō） 才露出單數的「我」。<\/p><p><strong>◆ 經文鑑別 3:2<\/strong>：SBLGNT 與 NA28 作 συνεργὸν τοῦ θεοῦ（synergon tou theou）「神的同工」；WH、Treg 作 διάκονον（diakonon）「執事」，和合本「作神執事的」就是跟這一讀；拜占庭本兩個都有，成了「神的執事和我們的同工」；和合本正文雖作「執事」，註腳保留了「有古卷是與神同工的」。判斷的關鍵是哪一個讀法能解釋其他讀法：「神的同工」很大膽，好像把人放到與神並肩的位置，抄寫的人容易改成較保守的「執事」；反過來，把「執事」改成「同工」的動機很難想像。拜占庭本的兩字並列，正是兩種讀法被合併的痕跡。所以多數學者以 συνεργόν（synergon） 為原文，本講義從之；App 原文欄照 SBLGNT 顯示，講台上照和合本讀「執事」也無妨，但要知道保羅很可能寫的是「同工」。林前 3:9 保羅也說 θεοῦ γάρ ἐσμεν συνεργοί（theou gar esmen synergoi），那裡說的是一起為神做工的同工。<\/p><p>差派的目的是兩個不定詞：一是 στηρίξαι（stērixai），撐住、使站穩；二是 παρακαλέσαι（parakalesai），站在旁邊呼喚。ὑπὲρ τῆς πίστεως ὑμῶν（hyper tēs pisteōs hymōn） 是「為了你們的信心」：提摩太去不是查帳，是去扶一把。<\/p>","exp":"<p>〔背景〕徒 17:14--16（使徒行傳講義第 17 章）<\/p><p><strong>「我們既不能再忍，就願意獨自等在雅典」（3:1）——寫下全卷最穩的一句話的人，先承認自己撐不住了。<\/strong><\/p><p>使徒行傳講義第 17 章講過這一段路：帖撒羅尼迦的暴動之後，弟兄們連夜把保羅送走；庇哩亞又起風波，「當時弟兄們便打發保羅往海邊去，西拉和提摩太仍住在庇哩亞」（徒 17:14）。保羅一個人到了雅典，「看見滿城都是偶像，就心裡著急」（徒 17:16）。使徒行傳寫的是他在亞略巴古的講論；帖撒羅尼迦前書讓我們看見同一段時間的另一面——他心裡掛著一間只有三個安息日大的教會。比對兩處，提摩太似乎曾到雅典與保羅會合，又被打發回帖撒羅尼迦；路加把這一段省略了，保羅自己補上。<\/p><p>這一節值得每一位帶領人的人停下來。保羅沒有假裝自己很剛強，他說屋頂撐不住了。屬靈的父母也有承受的極限，承認這個極限不是失敗。可是他撐不住的時候做了甚麼？他把身邊唯一的同伴送走，寧可自己「獨自」在一座滿城偶像的城裡。孤單是他自己付的代價，好讓那群孩子不孤單。<\/p><p>被送去的那個人，保羅給了他兩個身分：「我們的兄弟」，以及「神的同工」（和合本作「作神執事的」）。提摩太年輕，帖撒羅尼迦人卻要從他身上看見：這人不是保羅的跑腿，是和保羅一樣、與神一同做工的人。這是 321「235」裡的那個 2：同伴不是助手，是同工。<\/p><p>他去做兩件事：「堅固你們，並在你們所信的道上勸慰你們」（3:2）。受苦的人最先需要的，不是一封講章，是一個被打發來的人。保羅沒有寄去一份教材，他把自己最好的同工送出去。今天教會面對一位在苦中的肢體，最好的回應常常不是更多的道理，而是派一個人去，坐在他旁邊。<\/p>"},{"a":3,"z":4,"star":3,"grk":"<p lang=\"grc\">τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·<\/p><p lang=\"grc\">καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.<\/p>","lit":"<p>好叫沒有一個人在這些患難中被搖動。因為你們自己知道，我們就是被安放在這上面的；<\/p><p>因為當我們在你們那裡的時候，我們就一再預先告訴你們，我們將要受擠壓，正如也發生了，而且你們知道。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τὸ μηδένα σαίνεσθαι<\/td><td>to mēdena sainesthai<\/td><td>免得有人被搖動<\/td><td>σαίνω 原指狗搖尾巴；新約只此一次<\/td><\/tr><tr><td>ἐν ταῖς θλίψεσιν ταύταις<\/td><td>en tais thlipsesin tautais<\/td><td>在這些患難中<\/td><td>指示代名詞：就是你們正在經歷的<\/td><\/tr><tr><td>αὐτοὶ γὰρ οἴδατε<\/td><td>autoi gar oidate<\/td><td>你們自己知道<\/td><td>全卷反覆訴諸他們的記憶<\/td><\/tr><tr><td>εἰς τοῦτο κείμεθα<\/td><td>eis touto keimetha<\/td><td>我們被放在這個位置上<\/td><td>κεῖμαι：被安放、被設立<\/td><\/tr><tr><td>προελέγομεν<\/td><td>proelegomen<\/td><td>我們預先一再告訴<\/td><td>未完成式：不是說一次<\/td><\/tr><tr><td>μέλλομεν θλίβεσθαι<\/td><td>mellomen thlibesthai<\/td><td>我們必要受壓<\/td><td>θλίβω 本義是擠壓<\/td><\/tr><\/table>","gram":"<p><strong>3:3 的 σαίνεσθαι（sainesthai） 是全本新約唯一的一次。σαίνω（sainō） 本是狗對主人搖尾巴，引申為被討好、被花言巧語哄得心動，也有「被搖晃、動搖」的意思。<\/strong><\/p><p>兩個引申義都通，而且放在一起讀更有味道：苦難從外面搖，諂媚從旁邊哄。逼迫者一面施壓，一面可能說「回來吧，何必呢」。和合本「搖動」取的是第一義。τὸ μηδένα σαίνεσθαι（to mēdena sainesthai） 用冠詞帶不定詞，說明 3:2 差派的目的：一個也不要被搖走。μηδένα（mēdena） 是「沒有一個人」——保羅數的是人頭，不是平均值。<\/p><p>αὐτοὶ γὰρ οἴδατε（autoi gar oidate） 是全卷的口頭禪（1:5；2:1、2、5、11；3:3、4；4:2；5:2）：保羅不是告訴他們新消息，是叫他們想起已經知道的事。εἰς τοῦτο κείμεθα（eis touto keimetha） 的 κεῖμαι（keimai） 是「被放置、被安放」，路 2:34 說這孩子 κεῖται（keitai）「被立」，腓 1:16 保羅說自己 εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι（eis apologian tou euangeliou keimai）。和合本譯「命定」，意思是被神安放在這個處境裡，不是偶然掉進去的；但這個字說的是位置，不是命運的宿命論。主詞是「我們」，包括保羅自己。<\/p><p>3:4 的 προελέγομεν（proelegomen） 是未完成式，表示當時不只說一次；μέλλομεν θλίβεσθαι（mellomen thlibesthai） 的 θλίβω（thlibō） 是擠壓，與 θλῖψις（thlipsis） 同字根。καθὼς καὶ ἐγένετο（kathōs kai egeneto）「也果然發生了」：和合本譯「果然應驗了」，這裡的「應驗」是保羅自己的預告成真，不是引用舊約。<\/p>","exp":"<p><strong>「我們受患難原是命定的」（3:3）——信耶穌不保證一帆風順，但保證你不是一個人受苦。<\/strong><\/p><p>帖撒羅尼迦人信主不到幾個月，就經歷了暴動、家門被闖、領袖被拖到官長面前、創辦人被連夜送走。一個新信徒很自然會問：是不是我信錯了？神若是愛我，為甚麼信了以後反而更難？保羅的回答很直接：這不是意外，「我們在你們那裡的時候，預先告訴你們，我們必受患難」（3:4）。主耶穌也說過：「在世上，你們有苦難」（約 16:33）。這是成功神學最清楚的反駁——信主換來的不是一帆風順的保證書。<\/p><p>可是這一節最容易被用錯，而且錯得很傷人。3:3 說的患難，是「為福音」受的苦：因為信主、因為傳道、因為跟隨基督而來的壓力。它不是家暴，不是虐待，不是職場霸凌，也不是任何讓人身體或心靈處在危險中的關係。對一位被配偶打的姊妹說「這就是你命定要受的患難，要忍耐」，絕不是 3:3 的意思，是把經文拿來綁住受害的人。遇到暴力，教會該做的是保護、陪伴，協助她找到安全的地方與專業和法律的協助。保羅打發提摩太是去「堅固」人，不是去勸人留在危險裡。<\/p><p>同樣，這一節也沒有叫人去追求苦難。保羅沒有說「沒有被逼迫就不是真基督徒」，也沒有鼓勵帖撒羅尼迦人去激怒官府或家人。苦難要來，就面對它；它不是勳章，不必去找。<\/p><p>那麼，「命定」的安慰在哪裡？在於苦難沒有在神的手外面。原文是「我們被安放在這裡」：一位安放者知道你在哪裡。被安放的人不是棄子，是被看守的人。所以保羅緊接著說的不是「忍一忍」，而是「打發提摩太去」。神把人安放在苦裡，也把人安放在苦裡的人身邊。今天一位剛信主就被家人罵「背祖」的弟兄，需要聽見兩句話：這不是你信錯了；你也不是一個人。<\/p>"},{"a":5,"z":5,"star":1,"grk":"<p lang=\"grc\">διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.<\/p>","lit":"<p>因此，連我也再撐不住了，就差人去要知道你們的信心，恐怕那試探者已經試探了你們，而我們的勞苦就變成空的。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>κἀγὼ<\/td><td>kagō<\/td><td>連我也<\/td><td>從「我們」轉成「我」：保羅自己<\/td><\/tr><tr><td>εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν<\/td><td>eis to gnōnai tēn pistin hymōn<\/td><td>要知道你們的信心<\/td><td>掛念的是信心，不是人數<\/td><\/tr><tr><td>ὁ πειράζων<\/td><td>ho peirazōn<\/td><td>那試探者<\/td><td>分詞當名詞，撒但的名號；太 4:3 同字<\/td><\/tr><tr><td>εἰς κενὸν<\/td><td>eis kenon<\/td><td>歸於空<\/td><td>與 2:1 οὐ κενὴ 呼應<\/td><\/tr><tr><td>ὁ κόπος ἡμῶν<\/td><td>ho kopos hēmōn<\/td><td>我們的勞苦<\/td><td>1:3、2:9 的同一個字<\/td><\/tr><\/table>","gram":"<p><strong>3:5 的 κἀγὼ（kagō） 是全章第一次單數「我」。前面一直是「我們」，到這裡保羅放下團隊的語氣：連我自己也撐不住了。<\/strong><\/p><p>μηκέτι στέγων（mēketi stegōn） 重複 3:1，只是改成單數，把 3:1--5 框成一段。μή πως ἐπείρασεν（mē pōs epeirasen） 用過去式直說語氣，表達的是擔心一件可能已經發生的事：「恐怕他已經試探了你們」；後面 γένηται（genētai） 卻是假設語氣，「免得勞苦變成空的」——試探可能已經來了，結果還沒有定。ὁ πειράζων（ho peirazōn） 是分詞當名詞，太 4:3 也用來稱呼撒但；2:18 說「撒但阻擋了我們」，3:5 說他還想從另一邊下手。<\/p><p>εἰς κενὸν（eis kenon） 和 2:1 「並不是徒然的」（2:1）用的是同一個字 κενὴ（kenē）。2:1 回頭看，說保羅的進入不是空的；3:5 往前看，擔心勞苦會不會落空。ὁ κόπος（ho kopos） 是 1:3「因愛心所受的勞苦」（1:3）的「勞苦」：愛的勞苦，最怕的是愛落空。<\/p>","exp":"<p><strong>「恐怕那誘惑人的到底誘惑了你們，叫我們的勞苦歸於徒然」（3:5）——這是本章地勢最低的一節。<\/strong><\/p><p>保羅擔心的不是教會人數變少，也不是奉獻減少，是「你們的信心如何」。他知道外面的逼迫是一回事，裡面的試探是另一回事；逼迫從前門打進來，那誘惑人的從後門溜進來，在人最累、最孤單的時候說：放棄吧，這條路太苦了。<\/p><p>這一節常引起一個問題：真信徒會不會離開信仰？保羅在這裡沒有給系統的答案，他給的是一個父親的反應。他沒有說「真得救的人不會跌倒，不用擔心」，也沒有說「你們隨時可能失去救恩」。他做的是打發人去。兩派神學都同意的事，正是保羅做的事：不要讓任何人一個人面對試探。本章的議題頁會陳列各家立場。<\/p><p>還有一件事值得看見：寫這封信的人，也有怕的時候。「勞苦歸於徒然」是每一位服事者心裡都有過的聲音——我花了這麼多力氣，會不會全白費了？保羅沒有把這個怕藏起來，他說出來，然後採取行動。被允許害怕，也被允許承認害怕，這是屬靈的父母給後來的服事者最誠實的禮物。<\/p>"},{"a":6,"z":6,"star":2,"grk":"<p lang=\"grc\">Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφʼ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,<\/p>","lit":"<p>但如今提摩太從你們那裡來到我們這裡，並且把你們的信心和愛心當作好消息報給我們，又說你們對我們常有好的記念，渴想見我們，正如我們也渴想見你們，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἄρτι δὲ<\/td><td>Arti de<\/td><td>但剛剛<\/td><td>時間就是現在：信是在消息剛到時寫的<\/td><\/tr><tr><td>εὐαγγελισαμένου<\/td><td>euangelisamenou<\/td><td>報了好消息<\/td><td>與「傳福音」同一個字<\/td><\/tr><tr><td>τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν<\/td><td>tēn pistin kai tēn agapēn hymōn<\/td><td>你們的信心和愛心<\/td><td>信愛望只報了兩樣<\/td><\/tr><tr><td>μνείαν ἡμῶν ἀγαθὴν<\/td><td>mneian hēmōn agathēn<\/td><td>對我們好的記念<\/td><td>孩子沒有忘記父母<\/td><\/tr><tr><td>ἐπιποθοῦντες<\/td><td>epipothountes<\/td><td>渴想<\/td><td>ἐπί 加強的「想念」<\/td><\/tr><tr><td>καθάπερ καὶ ἡμεῖς ὑμᾶς<\/td><td>kathaper kai hēmeis hymas<\/td><td>正如我們也想你們<\/td><td>想念是雙向的<\/td><\/tr><\/table>","gram":"<p><strong>3:6 的 Ἄρτι（Arti） 是「剛剛」，整封信的寫作時間就定在這一刻：提摩太一進門，保羅就提筆。<\/strong><\/p><p>εὐαγγελισαμένου（euangelisamenou） 是 εὐαγγελίζομαι（euangelizomai） 的分詞，新約裡這個字幾乎都用在「傳福音」；保羅在這裡用它來說提摩太帶回來的消息，這是全本新約少數不指耶穌福音的用法（路 1:19 天使報施洗約翰的出生是另一例）。對保羅來說，一間教會還站著的消息，本身就是一個福音。<\/p><p>報的內容是 τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν（tēn pistin kai tēn agapēn hymōn）。對照 1:3 信、愛、望三根柱子，這裡只報了兩根，盼望沒有提。這不一定是提摩太漏報，更可能是盼望正是他們缺的那一根：教會裡有人過世了，他們不知道死了的人在主來時怎麼樣。保羅在 3:10 說要「補滿你們信心的不足」，到 4:13 才直接處理這個缺口。<\/p><p>ἐπιποθοῦντες ἡμᾶς ἰδεῖν（epipothountes hēmas idein） 對上 2:17 保羅自己「很願意見你們的面」；καθάπερ καὶ ἡμεῖς ὑμᾶς（kathaper kai hēmeis hymas） 收尾，句子沒有動詞，卻把兩邊的想念扣在一起。<\/p>","exp":"<p>〔背景〕徒 18:5（使徒行傳講義第 18 章）<\/p><p><strong>「但提摩太剛才從你們那裡回來，將你們信心和愛心的好消息報給我們」（3:6）——一間教會還站著，就是一個福音。<\/strong><\/p><p>使徒行傳講義第 18 章講過這一刻的另一面：「西拉和提摩太從馬其頓來的時候，保羅為道迫切，向猶太人證明耶穌是基督」（徒 18:5）。保羅那時已經從雅典到了哥林多，白天做帳棚，安息日在會堂辯論。同工帶著好消息與馬其頓的供應一到，他整個人被釋放出來。這封信就是在那份鬆了一口氣之中寫的。<\/p><p>提摩太帶回三件事。第一，信心還在：逼迫沒有把他們搖走。第二，愛心還在：他們彼此相愛，甚至愛到馬其頓全地（4:10）。第三，他們沒有怨恨保羅：「常常記念我們，切切地想見我們」（3:6）。最後這一件對保羅特別重要。他是被連夜送走的，城裡一定有人說：你們看，那個傳道的出事就跑了。孩子們可能被教唆去怪父母，結果沒有，他們仍然想念他。<\/p><p>原文裡「報好消息」就是「傳福音」那個字。這是一個很美的翻轉：當初保羅把福音帶到帖撒羅尼迦，如今提摩太把帖撒羅尼迦的福音帶回給保羅。傳福音的人，也需要聽見福音；牧養的人，也需要被好消息餵養。今天一位疲倦的傳道人最好的消息，常常不是事工的數字，而是「那個你帶過的人，還站著」。<\/p><p>只是報告裡少了一樣：盼望。信心和愛心報了，盼望沒有報。保羅沒有因此責備他們，他只是記下來，接著禱告要「補滿」（3:10），到第 4 章再細細地教。<\/p>"},{"a":7,"z":8,"star":3,"grk":"<p lang=\"grc\">διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφʼ ὑμῖν ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν διὰ τῆς ὑμῶν πίστεως,<\/p><p lang=\"grc\">ὅτι νῦν ζῶμεν ἐὰν ὑμεῖς στήκετε ἐν κυρίῳ.<\/p>","lit":"<p>因此我們被安慰了，弟兄們，因著你們，在我們一切的困苦和患難上，藉著你們的信心；<\/p><p>因為現在我們活了，若你們在主裡站立。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>παρεκλήθημεν<\/td><td>pareklēthēmen<\/td><td>我們被安慰了<\/td><td>3:2 去勸慰人，3:7 自己被安慰<\/td><\/tr><tr><td>ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν<\/td><td>epi pasē tē anankē kai thlipsei hēmōn<\/td><td>在我們一切的困苦與患難中<\/td><td>保羅在哥林多的處境沒有改變<\/td><\/tr><tr><td>νῦν ζῶμεν<\/td><td>nyn zōmen<\/td><td>現在我們活了<\/td><td>νῦν：此刻，消息到的這一刻<\/td><\/tr><tr><td>ἐὰν ὑμεῖς στήκετε<\/td><td>ean hymeis stēkete<\/td><td>若你們站立<\/td><td>ἐάν 接直說語氣：少見的組合<\/td><\/tr><tr><td>ἐν κυρίῳ<\/td><td>en kyriō<\/td><td>在主裡<\/td><td>站的地面，不是站的力氣<\/td><\/tr><\/table>","gram":"<p><strong>3:7 的 παρεκλήθημεν（pareklēthēmen） 是被動式：3:2 保羅打發提摩太去 παρακαλέσαι（parakalesai） 他們，3:7 卻是保羅自己被安慰了。勸慰的方向翻轉了。<\/strong><\/p><p>ἐφʼ ὑμῖν（eph' hymin）「因為你們」，ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν（epi pasē tē anankē kai thlipsei hēmōn）「在我們一切的困苦和患難中」，διὰ τῆς ὑμῶν πίστεως（dia tēs hymōn pisteōs）「藉著你們的信心」。三個介系詞片語疊在一起：處境沒有變，困苦還在，安慰卻從孩子的信心流回到父母身上。ὑμῶν（hymōn） 放在冠詞與名詞之間，語氣落在「你們的」。<\/p><p>3:8 是全卷的樞紐：ὅτι νῦν ζῶμεν ἐὰν ὑμεῖς στήκετε ἐν κυρίῳ（hoti nyn zōmen ean hymeis stēkete en kyriō）。ἐάν（ean） 通常接假設語氣，這裡卻接直說語氣 στήκετε（stēkete）。文法家多認為，這樣的組合讓條件帶著現實感：「既然你們（正）站著」，同時保留勸勉的力道：「只要你們繼續站著」。和合本「若……就」保留了條件的形式，讀的時候要聽出它的雙重聲音——是喜訊，也是邀請。<\/p><p>στήκετε（stēkete） 是 στήκω（stēkō） 的現在式，從完成式 ἕστηκα（hestēka） 新造出來的動詞，有「站得住、站定」的意思；腓 4:1 οὕτως στήκετε ἐν κυρίῳ（houtōs stēkete en kyriō） 是同樣的組合。νῦν（nyn） 不是「從今以後」，是「此刻」：消息進門的這一刻，保羅活過來了。前半卷是回憶與等待，後半卷是教導與勸勉，這一節是轉軸。<\/p>","exp":"<p><strong>「你們若靠主站立得穩，我們就活了。」（3:8）屬靈父母的生命，掛在孩子站不站得住。<\/strong><\/p><p>這是全卷的樞紐。第 1 章孩子出生（1:9 歸向神），第 2 章孩子被餵養（2:7 如同母親乳養），到了第 3 章，孩子自己站起來了。全卷五章是一個孩子的成長：歸、養、穩、聖、醒；本章是「穩」——孩子站起來的那一天。<\/p><p>請注意站的人是誰：「你們」。保羅不在現場，提摩太也走了，帖撒羅尼迦人沒有被誰扶著，他們自己站著。這是屬靈父母最大的成就：不是孩子離不開你，是你不在的時候，他們仍然站得住。2:7 保羅說他「如同母親」，若讀成一種控制——孩子要一直依賴我、凡事問我——就讀反了。父母的目標是孩子站穩，而且是「靠主」站穩，不是靠保羅。原文「在主裡」：站的地面是主，不是傳道人。<\/p><p>所以這一節也是一面鏡子。帶領人可以問自己：我的喜樂，是建立在人需要我，還是建立在人站在主裡？一個需要被需要的牧者，會不知不覺讓人離不開自己；一個像保羅的牧者，會因為孩子在他不在時站穩而說「我們就活了」。<\/p><p>還有一層：3:7 說保羅「得了安慰」。安慰本來是父母給孩子的，這裡卻是孩子安慰了父母。3:2 提摩太是去勸慰他們，3:7 是他們的信心安慰了保羅。屬神的家不是單行道。321 說建立屬神的體系，運作的方式就是 5:11 的「彼此勸慰」——年長的扶年幼的，年幼的站穩了，也成了年長者的力量。<\/p><p>保羅說「我們就活了」，不是誇張。他在哥林多，困苦與患難一樣都沒少；他活過來，是因為一間被逼迫的教會站住了。今天一位為人禱告多年的母親，聽見孩子在外地仍然去聚會，那一刻她懂這一節。<\/p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν διʼ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,<\/p><p lang=\"grc\">νυκτὸς καὶ ἡμέρας ὑπερεκπερισσοῦ δεόμενοι εἰς τὸ ἰδεῖν ὑμῶν τὸ πρόσωπον καὶ καταρτίσαι τὰ ὑστερήματα τῆς πίστεως ὑμῶν;<\/p>","lit":"<p>因為我們能用甚麼感謝為你們回報神，為著我們因你們在我們的神面前所喜樂的一切喜樂？<\/p><p>夜裡和白天極其懇切地祈求，要看見你們的面，並且補全你們信心的不足之處。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τίνα γὰρ εὐχαριστίαν<\/td><td>tina gar eucharistian<\/td><td>用何等的感謝<\/td><td>修辭問句：怎麼謝都不夠<\/td><\/tr><tr><td>ἀνταποδοῦναι<\/td><td>antapodounai<\/td><td>回報、償還<\/td><td>ἀντί「對等」＋ἀποδίδωμι「歸還」<\/td><\/tr><tr><td>νυκτὸς καὶ ἡμέρας<\/td><td>nyktos kai hēmeras<\/td><td>夜裡和白天<\/td><td>2:9 做工也是「晝夜」<\/td><\/tr><tr><td>ὑπερεκπερισσοῦ<\/td><td>hyperekperissou<\/td><td>極其、超乎尋常地<\/td><td>三重複合字，未標號<\/td><\/tr><tr><td>καταρτίσαι<\/td><td>katartisai<\/td><td>補滿、修整<\/td><td>補網、接骨、使完備<\/td><\/tr><tr><td>τὰ ὑστερήματα τῆς πίστεως ὑμῶν<\/td><td>ta hysterēmata tēs pisteōs hymōn<\/td><td>你們信心的缺口<\/td><td>複數：好幾處不足<\/td><\/tr><\/table>","gram":"<p><strong>3:9 是一個修辭問句：τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι（tina gar eucharistian dynametha tō theō antapodounai）——我們能用甚麼感謝回報神？答案是：沒有一種夠。<\/strong><\/p><p>ἀνταποδοῦναι（antapodounai） 是「對等地歸還」，常用在還債或報應。保羅把它用在感謝上：神給了這麼大的喜樂，我們拿甚麼還？γάρ（gar） 把 3:9 接在 3:8 後面，說明「我們就活了」的人，第一個反應是感謝神，不是誇讚自己的牧養。ἔμπροσθεν τοῦ θεοῦ ἡμῶν（emprosthen tou theou hēmōn） 也出現在 1:3 與 3:13：喜樂是在神面前的喜樂。<\/p><p>3:10 的 ὑπερεκπερισσοῦ（hyperekperissou） 由 ὑπέρ（hyper）、ἐκ（ek）、περισσοῦ（perissou） 三層疊成，在新約只出現於本卷 3:10、5:13 與弗 3:20，是保羅自己喜歡的強調字；SBLGNT 這個字沒有 Strong 標號。δεόμενοι（deomenoi） 是現在分詞，「晝夜」與 2:9「晝夜做工」相對：保羅白天黑夜做帳棚，白天黑夜也禱告。<\/p><p>καταρτίσαι（katartisai） 是補網、接骨、把東西修整到能用的字：太 4:21 雅各、約翰在船上 καταρτίζοντας τὰ δίκτυα αὐτῶν（katartizontas ta diktya autōn），加 6:1 用它說把人「挽回過來」。τὰ ὑστερήματα（ta hysterēmata） 是複數「不足之處」。信心有缺口，不是被定罪的理由，是被修補的對象。<\/p>","exp":"<p><strong>「我們晝夜切切地祈求，要見你們的面，補滿你們信心的不足。」（3:10）好消息之後，保羅沒有說「這樣就夠了」。<\/strong><\/p><p>3:9 和 3:10 放在一起很有意思。前一節，保羅喜樂到不知道怎麼感謝神；後一節，他說他們的信心還有「不足」。兩件事同時成立：這是一間站穩了的教會，也是一間信心還有缺口的教會。保羅沒有因為喜樂而看不見缺口，也沒有因為缺口而收回喜樂。<\/p><p>信心不夠是罪嗎？這一節給了很溫柔的答案。保羅用的字是補網的字：漁夫看見網破了，不會罵網，他坐下來補。帖撒羅尼迦人的「不足」，從第 4、5 章看得出來是甚麼——對聖潔的生活還不清楚（4:3--8），對死去的親人沒有盼望（4:13），有人不做工（4:11）。這些不是叛逆，是一間只有幾個月大的教會還沒學到的功課。信心會缺，缺了可以補；補的方法是教導、陪伴和禱告，不是羞辱。<\/p><p>保羅補網的方式也值得看：先感謝，再禱告，然後想去見面。他沒有先寄一張「缺點清單」，他先為他們感謝神。牧養的次序在這裡：先看見神在人身上已經做的，再看見還沒做完的。一位帶小組的弟兄若只看見組員的不足，他會變成檢查員；若只看見優點，他會變成啦啦隊。保羅兩樣都看見，所以他是父親。<\/p><p>「晝夜」兩個字也不能略過。保羅白天做工、晚上禱告，「晝夜」都在為一群他見不到面的人用力。321 說「人比事重要」：他為之晝夜禱告的，是一張一張的臉。<\/p>"},{"a":11,"z":11,"star":1,"grk":"<p lang=\"grc\">Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·<\/p>","lit":"<p>而願神自己，就是我們的父，和我們的主耶穌，修直我們往你們那裡去的路；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Αὐτὸς δὲ ὁ θεὸς<\/td><td>Autos de ho theos<\/td><td>願神自己<\/td><td>5:23 用同樣的開頭<\/td><\/tr><tr><td>ὁ κύριος ἡμῶν Ἰησοῦς<\/td><td>ho kyrios hēmōn Iēsous<\/td><td>我們的主耶穌<\/td><td>與父並列為主詞<\/td><\/tr><tr><td>κατευθύναι<\/td><td>kateuthynai<\/td><td>願他修直<\/td><td>單數祈願語氣<\/td><\/tr><tr><td>τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς<\/td><td>tēn hodon hēmōn pros hymas<\/td><td>我們到你們那裡的路<\/td><td>2:18 被撒但攔阻的那條路<\/td><\/tr><\/table>","gram":"<p><strong>3:11 有兩個主詞——ὁ θεὸς καὶ πατὴρ ἡμῶν（ho theos kai patēr hēmōn） 與 ὁ κύριος ἡμῶν Ἰησοῦς（ho kyrios hēmōn Iēsous）——卻只有一個單數動詞 κατευθύναι（kateuthynai）。<\/strong><\/p><p>κατευθύναι（kateuthynai） 是過去式祈願語氣，第三人稱單數。希臘文兩個主詞通常配複數動詞；保羅卻讓父與子共用一個單數動詞。這不能單靠文法證明三一論，但在新約最早的一封信裡，保羅已經自然地把耶穌放在與父同一個行動的位置上：引領道路的，是父與子一同。3:12 接著的 ὁ κύριος（ho kyrios） 又是單數主詞，祈求的對象直接是主。<\/p><p>Αὐτὸς δὲ ὁ θεὸς（Autos de ho theos） 的 Αὐτὸς（Autos） 是加強語氣：「神自己」。5:23 Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης（Autos de ho theos tēs eirēnēs） 用的是同樣的開頭，兩處禱告前後呼應。κατευθύνω（kateuthynō） 是把路「修直」：2:18 ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς（enekopsen hēmas ho Satanas），撒但把路切斷；3:11 保羅求神把路修直。<\/p>","exp":"<p><strong>「願神－我們的父和我們的主耶穌一直引領我們到你們那裡去。」（3:11）被撒但攔阻的路，交給神修直。<\/strong><\/p><p>2:18 保羅說：「我－保羅有一兩次要去，只是撒但阻擋了我們」（2:18）。他試過，不只一次，都沒有成功。到了這裡，他不再說「我要再試一次」，他把這條路交出去：願神自己引領。這不是放棄，是把方向盤交給真正能開路的那一位。<\/p><p>這個禱告後來蒙了應允，只是不在保羅以為的時間。使徒行傳記載他幾年後重回馬其頓，「走遍了那一帶地方，用許多話勸勉門徒」（徒 20:2）。禱告的答案有時是「是」，有時是「等」。在等的那幾年裡，神沒有讓帖撒羅尼迦人空等：他們手上有這封信，有提摩太，有彼此。<\/p><p>在這一節裡還有一件事是新約最早的見證之一：保羅向「神我們的父」和「我們的主耶穌」一同禱告，用的卻是一個單數的動詞，好像兩位是一個行動。帖撒羅尼迦人剛離棄偶像不久（1:9），他們從多神的世界走出來，認識的是一位神；保羅卻毫不猶豫地把耶穌放在這位神的身邊，一同引領道路。這是他們每天禱告的對象。<\/p><p>今天許多弟兄姊妹也有一條被攔住的路：想回去探望的家人、想重修的關係、想去服事卻去不了的地方。3:11 教我們的不是硬闖，也不是放棄，而是像保羅一樣把那條路說出來，交給父與子，然後在等候中做手上能做的事。<\/p>"},{"a":12,"z":13,"star":2,"grk":"<p lang=\"grc\">ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,<\/p><p lang=\"grc\">εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ μετὰ πάντων τῶν ἁγίων αὐτοῦ<\/p>","lit":"<p>而願主使你們在愛上增多並且滿溢，向彼此，也向所有的人，正如我們也向你們一樣，<\/p><p>為要堅固你們的心，在聖潔中無可指摘，在神，就是我們的父面前，在我們的主耶穌同他一切的聖者來臨的時候。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>πλεονάσαι καὶ περισσεύσαι<\/td><td>pleonasai kai perisseusai<\/td><td>增多並且滿溢<\/td><td>兩個近義動詞疊用<\/td><\/tr><tr><td>εἰς ἀλλήλους καὶ εἰς πάντας<\/td><td>eis allēlous kai eis pantas<\/td><td>向彼此，也向所有人<\/td><td>愛沒有圈內圈外<\/td><\/tr><tr><td>στηρίξαι ὑμῶν τὰς καρδίας<\/td><td>stērixai hymōn tas kardias<\/td><td>堅固你們的心<\/td><td>與 3:2 前後呼應<\/td><\/tr><tr><td>ἀμέμπτους ἐν ἁγιωσύνῃ<\/td><td>amemptous en hagiōsynē<\/td><td>在聖潔中無可指摘<\/td><td>ἁγιωσύνη：聖潔的狀態<\/td><\/tr><tr><td>ἐν τῇ παρουσίᾳ<\/td><td>en tē parousia<\/td><td>在他來臨的時候<\/td><td>全卷第二次 παρουσία<\/td><\/tr><tr><td>μετὰ πάντων τῶν ἁγίων αὐτοῦ<\/td><td>meta pantōn tōn hagiōn autou<\/td><td>同他所有的聖者<\/td><td>天使或已死的信徒<\/td><\/tr><\/table>","gram":"<p><strong>3:12 的兩個動詞 πλεονάσαι καὶ περισσεύσαι（pleonasai kai perisseusai） 都是過去式祈願語氣，意思相近，疊在一起像水漲了又漲，漫過堤岸。<\/strong><\/p><p>ὑμᾶς δὲ（hymas de） 放在句首，與 3:11 的「我們」對照：我們的路求神修直，你們的愛求主加增。愛的方向有兩個：εἰς ἀλλήλους（eis allēlous）「向彼此」與 εἰς πάντας（eis pantas）「向所有人」。第二個介系詞片語把愛推出教會的門外；καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς（kathaper kai hēmeis eis hymas） 是榜樣：照我們愛你們的樣子。<\/p><p>3:13 以 εἰς τὸ（eis to） 帶不定詞說明目的：στηρίξαι ὑμῶν τὰς καρδίας（stērixai hymōn tas kardias）——「堅固」又出現了。3:2 提摩太去 στηρίξαι（stērixai），3:13 求主 στηρίξαι（stērixai），前後把全章包起來：人去堅固，最後是主堅固。ἀμέμπτους ἐν ἁγιωσύνῃ（amemptous en hagiōsynē） 是「在聖潔裡無可責備」，為第 4 章「神的旨意就是要你們成為聖潔」（4:3）鋪路；ἐν τῇ παρουσίᾳ（en tē parousia） 是全卷第二次 παρουσία（第一次在 2:19），第 3 章照例以主的來臨收尾。<\/p><p>μετὰ πάντων τῶν ἁγίων αὐτοῦ（meta pantōn tōn hagiōn autou） 的「眾聖徒」是誰，各家說法有三：一、天使，這使我們想起「耶和華－我的神必降臨，有一切聖者同來」（亞 14:5），太 25:31 與帖後 1:7 也說主同天使降臨；二、已死的信徒，4:14 說神「必將他們與耶穌一同帶來」（4:14）；三、兩者都包括。ἅγιοι（hagioi） 在保羅書信裡幾乎都指信徒，但這裡的語境是舊約神顯現的畫面。本講義認為兩者並存最合語境，議題頁並陳各說。<\/p>","exp":"<p><strong>「又願主叫你們彼此相愛的心，並愛眾人的心都能增長，充足」（3:12）——禱告的終點不是保羅回去，是愛滿出來。<\/strong><\/p><p>保羅為一間被本地人逼迫的教會禱告，求的是甚麼？不是求逼迫者受報應，也不是求教會躲起來，而是求他們的愛加增——「彼此相愛」，也「愛眾人」。眾人包括誰？包括那些闖進耶孫家裡的鄰居，包括罵他們背祖的親戚。主耶穌說「要愛你們的仇敵，為那逼迫你們的禱告」（太 5:44），保羅在這裡把它變成禱告。基督徒的愛沒有圈內圈外：它從家裡開始，但不停在家門口。<\/p><p>對一位信主後被家人反對的弟兄姊妹，這一節指出一條路：不是對抗，而是讓愛滿溢到家裡去。用改變的生命、加倍的孝順，讓家人看見信耶穌的人更會愛。這不是要人吞下一切委屈，也不是要人留在不安全的處境裡；是在能力範圍內，讓愛成為最有說服力的見證。<\/p><p>愛加增的目的是甚麼？「好使你們當我們主耶穌同他眾聖徒來的時候，在我們父神面前，心裡堅固，成為聖潔，無可責備」（3:13）。愛和聖潔在這裡連在一起：聖潔不是把自己關起來保持乾淨，是愛得更多、更真。主來的時候要被看見的，是一群愛得滿溢的人。<\/p><p>本章以「堅固」開始，也以「堅固」結束。開頭是提摩太被打發去堅固他們（3:2），結尾是求主自己堅固他們的心。人能做的，是去陪伴、去勸慰；能把心堅固到主來那天的，只有主。這正是全卷的終點要說的：「那召你們的本是信實的，他必成就這事」（5:24）。<\/p>"}],"4":[{"a":1,"z":2,"star":1,"grk":"<p lang=\"grc\">Λοιπὸν οὖν ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ἵνα καθὼς παρελάβετε παρʼ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, καθὼς καὶ περιπατεῖτε, ἵνα περισσεύητε μᾶλλον.<\/p><p lang=\"grc\">οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.<\/p>","lit":"<p>那麼其餘的，弟兄們，我們在主耶穌裡求你們、勸你們：正如你們從我們領受了你們該怎樣行走、並討神的喜悅——正如你們也正在行走——好叫你們更加滿溢。<\/p><p>因為你們知道，我們藉著主耶穌給了你們哪些命令。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Λοιπὸν οὖν<\/td><td>Loipon oun<\/td><td>那麼，其餘的<\/td><td>全卷後半的轉折：從回憶轉入教導<\/td><\/tr><tr><td>ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν<\/td><td>erōtōmen hymas kai parakaloumen<\/td><td>我們求你們，也勸你們<\/td><td>一個是朋友的請求，一個是在旁扶持<\/td><\/tr><tr><td>πῶς δεῖ ὑμᾶς περιπατεῖν<\/td><td>pōs dei hymas peripatein<\/td><td>你們該怎樣行走<\/td><td>περιπατέω：生活就是走路<\/td><\/tr><tr><td>ἀρέσκειν θεῷ<\/td><td>areskein theō<\/td><td>討神的喜悅<\/td><td>2:4 保羅自己的方向<\/td><\/tr><tr><td>καθὼς καὶ περιπατεῖτε<\/td><td>kathōs kai peripateite<\/td><td>正如你們也正在走<\/td><td>插入的一句肯定<\/td><\/tr><tr><td>ἵνα περισσεύητε μᾶλλον<\/td><td>hina perisseuēte mallon<\/td><td>好叫你們更加滿溢<\/td><td>做得好的，還要更多<\/td><\/tr><tr><td>παραγγελίας<\/td><td>parangelias<\/td><td>命令、號令<\/td><td>軍中傳令的字；複數<\/td><\/tr><\/table>","gram":"<p><strong>4:1 是一個被打斷又接回來的長句：ἵνα καθὼς παρελάβετε（hina kathōs parelabete）……καθὼς καὶ περιπατεῖτε（kathōs kai peripateite），ἵνα περισσεύητε μᾶλλον（hina perisseuēte mallon）——第一個 ἵνα（hina） 還沒說完，保羅先插一句「你們正在這樣走」，再用第二個 ἵνα（hina） 把句子接回來。<\/strong><\/p><p>Λοιπὸν οὖν（Loipon oun） 字面是「那麼，其餘的」。它不是「最後一句」，而是轉折：第 1--3 章是回憶、感恩與等待，到 3:13 的禱告收住；第 4 章起，信的後半轉入教導與勸勉。全卷樞紐 3:8 之後，孩子站起來了，現在要學走路。<\/p><p>兩個動詞並排：ἐρωτῶμεν（erōtōmen） 在古典希臘文多半是「問」，在新約常是平輩之間的請求；παρακαλοῦμεν（parakaloumen） 是勸勉、在旁邊扶一把，這是本章追蹤字的第一站，4:10、4:18 還會再出現。保羅要下命令了，卻先用請求的口氣。<\/p><p>περιπατεῖν（peripatein） 是「行走」，這是舊約「行在耶和華的道上」的說法，保羅在 2:12 已經用過：「要叫你們行事對得起那召你們進他國、得他榮耀的神」（2:12）。4:12 會再用一次 περιπατῆτε（peripatēte）。<\/p><p>4:2 的 παραγγελίας（parangelias） 是軍中傳令、官方下達的命令，4:11 的 παρηγγείλαμεν（parēngeilamen） 是同一個字根。但出處寫得很清楚：διὰ τοῦ κυρίου Ἰησοῦ（dia tou kyriou Iēsou）——命令是「藉著主耶穌」給的，不是保羅自己的意思。這一點到 4:8 會說得更重。<\/p>","exp":"<p><strong>「弟兄們，我還有話說：我們靠著主耶穌求你們，勸你們」（4:1）——教一個孩子走路，第一句話是「你已經在走了」。<\/strong><\/p><p>第 4 章是全卷「歸・養・穩・聖・醒」的第四步：聖，孩子學走路。保羅的開場很溫柔。他沒有說「你們走得太差」，而是說「照你們現在所行的更加勉勵」（4:1）。原文在這裡插了一句肯定：你們已經在這樣走了。好的父母教孩子學步，不會等孩子走得完美才誇獎；孩子跨出一步，父母就拍手，然後說：再來一步。<\/p><p>走路的方向是「討神的喜悅」。這幾個字很要緊。一個剛離開偶像的人（1:9），過去敬拜的神明要的是祭物與香火，只要供品到位，生活怎樣都可以；現在他們跟隨的這位神，在乎的是你每天怎樣走路。信仰從廟裡走進了臥室、市場與飯桌。<\/p><p>「命令」這個字帶著軍令的口氣，但保羅說，這些命令是「憑主耶穌」傳的。他不是拿自己的權柄壓人，他只是傳令兵。這給今天的講台一條界線：牧者可以傳主的命令，卻不能把自己的喜好包裝成主的命令。帖撒羅尼迦人能分辨，因為他們「原曉得」（4:2），保羅在的時候都講過了。<\/p><p>學走路的孩子會跌倒。下面六節要談的，正是最容易跌倒的地方。但開場已經定了語氣：這是一位父親扶著孩子，說「再走一步」，不是一位考官拿著扣分表。<\/p>"},{"a":3,"z":3,"star":3,"grk":"<p lang=\"grc\">τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,<\/p>","lit":"<p>因為這就是神的旨意：你們的成聖，要你們遠離淫行，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ<\/td><td>touto gar estin thelēma tou theou<\/td><td>因為這就是神的旨意<\/td><td>θέλημα 沒有冠詞<\/td><\/tr><tr><td>ὁ ἁγιασμὸς ὑμῶν<\/td><td>ho hagiasmos hymōn<\/td><td>你們的成聖<\/td><td>與「旨意」同位；過程名詞<\/td><\/tr><tr><td>ἀπέχεσθαι ὑμᾶς<\/td><td>apechesthai hymas<\/td><td>要你們遠離<\/td><td>現在式中間語態：持續地自己保持距離<\/td><\/tr><tr><td>ἀπὸ τῆς πορνείας<\/td><td>apo tēs porneias<\/td><td>離開淫行<\/td><td>涵蓋婚姻以外一切的性<\/td><\/tr><\/table>","gram":"<p><strong>4:3 的骨架是一個等號：τοῦτο（touto）……θέλημα τοῦ θεοῦ（thelēma tou theou），ὁ ἁγιασμὸς ὑμῶν（ho hagiasmos hymōn）——「神的旨意」就是「你們的成聖」，接著三個不定詞把它說具體：ἀπέχεσθαι（4:3）、εἰδέναι（4:4）、τὸ μὴ ὑπερβαίνειν（4:6）。<\/strong><\/p><p>θέλημα（thelēma） 在這裡沒有冠詞，可以讀成「神旨意的一部分」：神的旨意當然不只這一件，但這一件是確定的。全卷另一處同樣直說神旨意的是 5:18 τοῦτο γὰρ θέλημα θεοῦ（touto gar thelēma theou），對象是「凡事謝恩」。兩處都不是在告訴人該選哪一份工作、該嫁給誰，而是在說：你要成為怎樣的人。<\/p><p>ἁγιασμός（hagiasmos） 是動作名詞，指「成聖」這個過程，不只是一個靜止的狀態。本章用了三次：4:3、4:4 ἐν ἁγιασμῷ（en hagiasmō）、4:7 ἀλλʼ ἐν ἁγιασμῷ（all' en hagiasmō）；4:8 再以 τὸ πνεῦμα αὐτοῦ τὸ ἅγιον（to pneuma autou to hagion） 收尾。整段 4:1--8 就是用這個字根縫起來的。<\/p><p>ἀπέχεσθαι（apechesthai） 是現在式中間語態：自己持續地保持距離。πορνεία（porneia） 的字根與 πόρνη（妓女）相同，但在新約已經擴大為婚姻以外一切的性關係。在希臘羅馬城市，男人與奴隸、妓女、廟妓發生關係是社會默許的事；保羅的要求，在當時是逆風而行。<\/p>","exp":"<p><strong>「神的旨意就是要你們成為聖潔，遠避淫行」（4:3）——很多人一輩子在找神的旨意，這裡有一句明說的。<\/strong><\/p><p>基督徒常問：神的旨意是要我念哪一科、做哪一份工作、跟誰結婚？這些問題都重要，但新約很少直接回答。帖撒羅尼迦前書直說了兩次「神的旨意」，一次在這裡，一次在 5:18「凡事謝恩」。兩次都不是關於你要「去哪裡」，而是關於你要「成為誰」。神最在乎的，不是你站在哪個位置，是你在那個位置上成為甚麼樣的人。<\/p><p>而這個「成為」包括身體。帖撒羅尼迦是一座港口大城，性很隨便，而且有雙重標準：女人要守貞，男人在婚外的關係幾乎沒有人過問。許多廟宇的祭祀本身就和性連在一起。這群信徒剛剛「離棄偶像，歸向神」（1:9），他們離開的不只是一尊神像，也是一整套身體的生活方式。保羅不迴避，他把話說清楚：遠避淫行。<\/p><p>今天的帖撒羅尼迦，就在每一支手機裡。婚前性行為、同居、婚外情、色情、網路上的性剝削——講台要講，而且要講清楚，因為這是神明說的旨意。但怎樣講同樣要緊。「成聖」在原文是一個過程，不是一張只能用一次的證書。保羅寫給的是一群剛學走路的孩子，不是一群已經及格的考生。所以講台不是用「你已經不純潔了」把一個人定終身，也不在台上點名、讓人羞愧得不敢再回來。聖潔的道要講到讓人想回家，不是想躲起來。<\/p><p>還有一件事很容易被忽略：這一節的主詞是神。是神的旨意要你成聖，到 5:23--24 保羅會說：「願賜平安的神親自使你們全然成聖……那召你們的本是信實的，他必成就這事。」（5:23--24）命令是給我們的，成就是神的。一個在這方面跌倒過的人，聽見的不該只是「你要聖潔」，還有「神要使你聖潔，而且他不放棄」。321 說「一切都是神的恩典」，在這裡最具體。<\/p>"},{"a":4,"z":5,"star":3,"grk":"<p lang=\"grc\">εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,<\/p><p lang=\"grc\">μὴ ἐν πάθει ἐπιθυμίας καθάπερ καὶ τὰ ἔθνη τὰ μὴ εἰδότα τὸν θεόν,<\/p>","lit":"<p>要你們每一個人知道在聖潔和尊貴中取得（或作：掌管）自己的器皿，<\/p><p>不在私慾的激情中，正如那些不認識神的外邦人一樣，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>εἰδέναι ἕκαστον ὑμῶν<\/td><td>eidenai hekaston hymōn<\/td><td>要你們每一個人知道<\/td><td>一個一個，不是籠統的「大家」<\/td><\/tr><tr><td>τὸ ἑαυτοῦ σκεῦος<\/td><td>to heautou skeuos<\/td><td>自己的器皿<\/td><td>身體？妻子？兩讀<\/td><\/tr><tr><td>κτᾶσθαι<\/td><td>ktasthai<\/td><td>取得、掌管<\/td><td>現在式不定詞<\/td><\/tr><tr><td>ἐν ἁγιασμῷ καὶ τιμῇ<\/td><td>en hagiasmō kai timē<\/td><td>在聖潔與尊貴裡<\/td><td>τιμή：價值、敬重<\/td><\/tr><tr><td>μὴ ἐν πάθει ἐπιθυμίας<\/td><td>mē en pathei epithymias<\/td><td>不在私慾的激情裡<\/td><td>被慾望推著走<\/td><\/tr><tr><td>τὰ ἔθνη τὰ μὴ εἰδότα τὸν θεόν<\/td><td>ta ethnē ta mē eidota ton theon<\/td><td>那不認識神的外邦人<\/td><td>與 4:4 εἰδέναι 前後呼應<\/td><\/tr><\/table>","gram":"<p><strong>◆ 4:4 τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ（to heautou skeuos ktasthai en hagiasmō kai timē）——σκεῦος（skeuos） 是「器皿」，保羅沒有說是哪一個器皿。歷代有兩種主要讀法。<\/strong><\/p><p><strong>讀法一：自己的身體。<\/strong>和合本、多數中文譯本與許多古代解經家採這個讀法。保羅在林後 4:7 說 ἐν ὀστρακίνοις σκεύεσιν（en ostrakinois skeuesin），和合本譯「我們有這寶貝放在瓦器裡」（林後 4:7），器皿指人的身體。這樣讀，κτᾶσθαι（ktasthai） 要解作「掌管、管好」。困難是 κτάομαι（ktaomai） 通常的意思是「取得」，用來說「掌管已經有的身體」稍嫌勉強。也有少數學者把 σκεῦος（skeuos） 讀成身體某一部分的委婉說法，方向與讀法一相同。<\/p><p><strong>讀法二：娶妻。<\/strong>彼前 3:7 稱妻子為 ἀσθενεστέρῳ σκεύει（asthenesterō skeuei），和合本譯「因她比你軟弱」（彼前 3:7），「器皿」指妻子；κτάομαι（ktaomai） 正好是「取得」，「取得自己的器皿」就是娶一位妻子。奧古斯丁與一些現代英文譯本這樣讀。困難是這樣讀，整句只對男人說話，而且把妻子比作一件器物。<\/p><p>本講義照和合本讀作「身體」，同時陳列「娶妻」一讀。兩種讀法的落點相同：ἐν ἁγιασμῷ καὶ τιμῇ（en hagiasmō kai timē） 對 μὴ ἐν πάθει ἐπιθυμίας（mē en pathei epithymias）——性要放在聖潔與尊重裡，不放在私慾與佔有裡。<\/p><p>4:4 的 εἰδέναι（eidenai） 與 4:5 的 τὰ μὴ εἰδότα τὸν θεόν（ta mē eidota ton theon） 用同一個「知道」：你們要「知道」怎樣守身，因為你們已經「認識」神；外邦人放縱，是因為不認識神。倫理從認識神長出來。這使我們想起耶利米的禱告：「願你將忿怒傾在不認識你的列國中」（耶 10:25）。<\/p>","exp":"<p><strong>「要你們各人曉得怎樣用聖潔、尊貴守著自己的身體」（4:4）——身體不是骯髒的，是尊貴的。<\/strong><\/p><p>希臘世界對身體有兩種極端。一種看不起身體：靈魂才是真正的自己，身體只是一座牢房，所以身體做甚麼都無所謂。另一種崇拜身體的享受：既然身體會朽壞，不如趁現在放縱。兩種態度最後走到同一個地方——身體可以隨便用。保羅兩邊都不站。他用了「尊貴」這個字：身體有價值，所以要被尊重。<\/p><p>「各人」也值得停一下。保羅不是對「大家」籠統地喊口號，他是對每一個人說：你自己要曉得。聖潔不能靠集體的氣氛撐住，每一個人要在沒有人看見的地方，學會怎樣對待自己的身體。<\/p><p>如果採「娶妻」的讀法，這一節同樣有力：在一個男人可以任意找女人的城市裡，保羅說，基督徒的婚姻要在「聖潔、尊貴」裡建立。妻子不是滿足慾望的器具，是要被敬重的人。彼得也說「要敬重她」（彼前 3:7）。兩種讀法放在一起，看見的是同一件事：性不是拿來用的，是放在尊重裡的。<\/p><p>「不放縱私慾的邪情，像那不認識神的外邦人」（4:5）——保羅診斷的根源不是意志力不夠，是不認識神。一個人若不認識神，自己的慾望就成了他的神。今天的色情工業就是這樣訓練人：把人看成物件，把慾望看成主人。聖潔恰好相反：學會把每一個人看成一個「人」，有名字、有尊嚴、是神所愛的。這不是一天學會的事，所以保羅用的是「曉得怎樣」——這是一門要學的功課，學的人會跌倒，教的人要有耐心。<\/p>"},{"a":6,"z":6,"star":3,"grk":"<p lang=\"grc\">τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.<\/p>","lit":"<p>不在這事上越界、佔他弟兄的便宜，因為主是這一切事的伸冤者，正如我們也預先告訴過你們、並鄭重見證過的。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τὸ μὴ ὑπερβαίνειν<\/td><td>to mē hyperbainein<\/td><td>不越界<\/td><td>跨過不該跨的線；新約只此一次<\/td><\/tr><tr><td>πλεονεκτεῖν<\/td><td>pleonektein<\/td><td>佔便宜、多拿<\/td><td>拿走不屬於自己的<\/td><\/tr><tr><td>ἐν τῷ πράγματι<\/td><td>en tō pragmati<\/td><td>在這件事上<\/td><td>冠詞指回前文的性<\/td><\/tr><tr><td>τὸν ἀδελφὸν αὐτοῦ<\/td><td>ton adelphon autou<\/td><td>他的弟兄<\/td><td>受害的是一個有名有姓的人<\/td><\/tr><tr><td>ἔκδικος κύριος<\/td><td>ekdikos kyrios<\/td><td>主是伸冤者<\/td><td>替受害者討回公道<\/td><\/tr><tr><td>προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα<\/td><td>proeipamen hymin kai diemartyrametha<\/td><td>我們預先說過，也鄭重見證過<\/td><td>不是第一次說<\/td><\/tr><\/table>","gram":"<p><strong>4:6 用兩個不定詞形容性的罪：τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν（to mē hyperbainein kai pleonektein）——越界，然後佔便宜。這兩個字都不是「污穢」的語言，是「不公義」的語言。<\/strong><\/p><p>ὑπερβαίνειν（hyperbainein） 在新約只出現這一次，字面是「跨過去」，指越過一條不該越過的界線。πλεονεκτεῖν（pleonektein） 是「多拿」，拿走不屬於自己的；它的名詞 πλεονεξία（pleonexia） 在保羅書信常與性的罪並列（弗 4:19；西 3:5）。受詞是 τὸν ἀδελφὸν αὐτοῦ（ton adelphon autou）：被越界、被佔便宜的，是一個人。ἀδελφοί（adelphoi） 在本卷向來包括姊妹，這裡的「弟兄」也不只指男人。<\/p><p>ἐν τῷ πράγματι（en tō pragmati） 有兩種讀法。少數解經家讀作「在生意上」，認為保羅轉到商業上的欺詐；但冠詞 τῷ（tō） 指向「剛才說的那件事」，前後文（4:3--5、4:7）都在談性，所以多數學者讀作「在這事上」，和合本亦同。本講義採後者。<\/p><p>διότι（dioti） 引出理由：ἔκδικος κύριος（ekdikos kyrios）。ἔκδικος（ekdikos） 是執行公道、替人伸冤的人，羅 13:4 用同一個字說掌權的是「伸冤的」。περὶ πάντων τούτων（peri pantōn toutōn），「這一類的事」全都在內。最後 προείπαμεν（proeipamen） 與 διεμαρτυράμεθα（diemartyrametha） 兩個動詞，說明這不是新規矩：保羅在帖撒羅尼迦那短短幾個星期裡，就已經鄭重講過了。<\/p>","exp":"<p><strong>「不要一個人在這事上越分，欺負他的弟兄」（4:6）——性的罪不只是一個人自己弄髒了，它是對另一個人的不公義。<\/strong><\/p><p>這一節翻轉了很多人對性的罪的想像。我們常把它想成「純潔」的問題：做錯的人不乾淨了。保羅的用字卻是「越分」與「欺負」——越過別人的界線，拿走別人的東西。婚外情拿走的是另一個家庭的信任；強迫、哄騙、利用職位與年紀的落差得到的性，拿走的是另一個人的身體與尊嚴。這是 321 所說「人比事重要」的反面：把一個人變成滿足自己的工具。<\/p><p>所以這一節也包括權勢性侵與性暴力。教會必須在這裡說清楚：錯在越界的一方。被侵害的人不是「不聖潔」的人，他不需要為別人的罪悔改。絕不可以對受害者說「你自己也有責任」，也不可以用「要饒恕、要合一、不要張揚」把事情壓下去。大衛的女兒她瑪當年說「我哥哥，不要玷辱我」（撒下 13:12），聖經記下的是她的拒絕，定罪的是那個不肯聽的人。<\/p><p>「主必報應」原文是「主是伸冤者」。這句話首先是對受害者說的：你的冤屈，神看見了，他站在你這一邊。神不是一位只關心規矩的神，他關心被欺負的人。這句話也是對越界的人說的：你以為沒有人知道，但有一位會替對方討回公道。<\/p><p>牧養上，若有人在聚會中或之後說出自己被侵害的經歷，不要在台上回應，也不要當眾追問；會後單獨關心，先相信、先陪伴，協助他尋求專業輔導與法律協助，必要時通報。教會要保護的是受害的人，不是加害者的名聲，也不是教會的面子。<\/p>"},{"a":7,"z":8,"star":2,"grk":"<p lang=\"grc\">οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλʼ ἐν ἁγιασμῷ.<\/p><p lang=\"grc\">τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν καὶ διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.<\/p>","lit":"<p>因為神召我們，不是為了污穢，而是在聖潔中。<\/p><p>因此，那棄絕的，不是棄絕人，而是棄絕那也一直把他的靈、那聖的，賜進你們裡面的神。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἐπὶ ἀκαθαρσίᾳ<\/td><td>epi akatharsia<\/td><td>為了污穢<\/td><td>ἐπί：召的目的（否定）<\/td><\/tr><tr><td>ἀλλʼ ἐν ἁγιασμῷ<\/td><td>all' en hagiasmō<\/td><td>而是在聖潔裡<\/td><td>ἐν：召的範圍與氛圍<\/td><\/tr><tr><td>τοιγαροῦν<\/td><td>toigaroun<\/td><td>所以、因此<\/td><td>語氣很重的推論詞<\/td><\/tr><tr><td>ὁ ἀθετῶν<\/td><td>ho athetōn<\/td><td>那棄絕的<\/td><td>把東西當作無效、作廢<\/td><\/tr><tr><td>οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν<\/td><td>ouk anthrōpon athetei alla ton theon<\/td><td>不是棄絕人，而是棄絕神<\/td><td>保羅把自己移開<\/td><\/tr><tr><td>τὸν καὶ διδόντα<\/td><td>ton kai didonta<\/td><td>那也一直在賜的<\/td><td>現在分詞；RP 作 δόντα<\/td><\/tr><tr><td>εἰς ὑμᾶς<\/td><td>eis hymas<\/td><td>進到你們裡面<\/td><td>不只是「給你們」<\/td><\/tr><\/table>","gram":"<p><strong>4:7 用兩個介系詞作對照：οὐ（ou）……ἐπὶ ἀκαθαρσίᾳ ἀλλʼ ἐν ἁγιασμῷ（epi akatharsia all' en hagiasmō）——神召我們不是「為了」污穢，而是「在」聖潔裡。<\/strong><\/p><p>ἐπὶ（epi） 說的是目的，ἐν（en） 說的是範圍：神的呼召不只指向聖潔這個終點，它本身就發生在聖潔的氛圍裡。ἐκάλεσεν（ekalesen） 是不定過去式，指信主那一刻的呼召（2:12「那召你們進他國」，5:24「那召你們的本是信實的」）。<\/p><p>4:8 以 τοιγαροῦν（toigaroun） 起頭，這是一個份量很重的「所以」，新約只用兩次（另一次在來 12:1）。ὁ ἀθετῶν（ho athetōn） 是把東西當作無效，像撕掉一份契約。保羅特意說 οὐκ ἄνθρωπον ἀθετεῖ（ouk anthrōpon athetei）：不是棄絕人——不是棄絕保羅、西拉或提摩太——而是棄絕神。<\/p><p><strong>◆ 經文鑑別 4:8<\/strong>：SBLGNT 作 τὸν καὶ διδόντα（ton kai didonta），現在分詞，「那一直在賜」；RP（拜占庭本）作 δόντα（donta），不定過去分詞，「那曾經賜了」。包括西乃抄本、梵蒂岡抄本在內的較早抄本支持 διδόντα（didonta），亞歷山大抄本與多數拜占庭抄本作 δόντα（donta）。保羅別處說到賜聖靈常用不定過去式（林後 1:22、5:5），抄寫者容易順手改成熟悉的時態；較不順的現在式反而較可能是原文。本講義採 SBLGNT：神不是只在信主那天給了一次聖靈，他一直在給。<\/p><p>τὸ πνεῦμα αὐτοῦ τὸ ἅγιον（to pneuma autou to hagion） 把 ἅγιον（hagion） 放在句末，以冠詞重複強調：「他的靈，那位『聖』的。」4:3、4:4、4:7 的 ἁγιασμός（hagiasmos） 在這裡落地。εἰς ὑμᾶς（eis hymas） 是「進到你們裡面」，這使我們想起以西結的應許：「我必將我的靈放在你們裡面」（結 37:14）。<\/p>","exp":"<p><strong>「神召我們，本不是要我們沾染污穢，乃是要我們成為聖潔。」（4:7）呼召決定方向。<\/strong><\/p><p>一個人信主，不只是得到一張赦罪的收據，而是被叫進一條路。這條路有方向：從污穢走向聖潔。帖撒羅尼迦人以前的生活不是全壞，但它的方向是「隨自己」；現在他們的方向換了。學走路的孩子會跌倒，但只要方向對了，跌倒是學步的一部分，不是走錯了路。<\/p><p>4:8 這句話很容易被用錯。有人拿它說：「你不聽我，就是不聽神。」可是保羅的用意正相反——他把自己移開了。「不是棄絕人」，也就是說，這些關於聖潔的教導，不是保羅個人的規矩，不是教會領袖的喜好，所以也不能拿來抬高任何一位領袖的權柄。屬靈的父母，是把孩子帶到神面前，不是把自己放在神的位置上。<\/p><p>那麼，力量從哪裡來？保羅給聖潔的命令加上一句描述：神是「那賜聖靈給你們的神」，原文是一直在賜。聖潔不是靠咬緊牙關。那位要你聖潔的神，同時把他的靈放進你裡面，天天在給。一位在這件事上反覆跌倒的弟兄姊妹，需要聽見的不是更大聲的「你要努力」，而是：那位聖靈今天還在給你，明天也會。正如 5:24 所說：「那召你們的本是信實的，他必成就這事。」（5:24）<\/p>"},{"a":9,"z":10,"star":1,"grk":"<p lang=\"grc\">Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·<\/p><p lang=\"grc\">καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,<\/p>","lit":"<p>而論到弟兄相愛，你們不需要人寫給你們，因為你們自己是被神教導的，為要彼此相愛；<\/p><p>因為你們也確實向整個馬其頓的眾弟兄這樣行。而我們勸你們，弟兄們，要更加滿溢，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Περὶ δὲ τῆς φιλαδελφίας<\/td><td>Peri de tēs philadelphias<\/td><td>而論到弟兄相愛<\/td><td>περὶ δέ：轉入新的題目<\/td><\/tr><tr><td>οὐ χρείαν ἔχετε<\/td><td>ou chreian echete<\/td><td>你們不需要<\/td><td>「不必說」卻還是說了<\/td><\/tr><tr><td>θεοδίδακτοί<\/td><td>theodidaktoi<\/td><td>被神教導的<\/td><td>新約只此一次<\/td><\/tr><tr><td>εἰς τὸ ἀγαπᾶν ἀλλήλους<\/td><td>eis to agapan allēlous<\/td><td>為要彼此相愛<\/td><td>神教的目的<\/td><\/tr><tr><td>ἐν ὅλῃ τῇ Μακεδονίᾳ<\/td><td>en holē tē Makedonia<\/td><td>在整個馬其頓<\/td><td>腓立比、庇哩亞的弟兄<\/td><\/tr><tr><td>περισσεύειν μᾶλλον<\/td><td>perisseuein mallon<\/td><td>更加滿溢<\/td><td>回應 4:1<\/td><\/tr><\/table>","gram":"<p><strong>4:9 Περὶ δὲ τῆς φιλαδελφίας（Peri de tēs philadelphias） 是一個新題目的開頭；同樣的 περὶ δέ（peri de） 會在 5:1 再出現，4:13 也以相近的套語開始。<\/strong><\/p><p>哥林多前書的 περὶ δέ（peri de） 是在逐條回答教會的來信（林前 7:1）。帖撒羅尼迦人有沒有寫信，經文沒有說；但提摩太剛從那裡回來（3:6），他帶回來的消息與問題，很可能就是 4:9、4:13、5:1 這三個題目。<\/p><p>φιλαδελφία（philadelphia） 原本只用在有血緣的兄弟姊妹之間；把它用在一群沒有血緣的人身上，是早期教會很大膽的說法。οὐ χρείαν ἔχετε γράφειν ὑμῖν（ou chreian echete graphein hymin） 是修辭上的「不必說」——說不必寫，然後還是寫了。理由是 αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε（autoi gar hymeis theodidaktoi este）：θεοδίδακτοί（theodidaktoi） 在新約只出現這一次，可能是保羅自己組合的字，「神」加上「被教導的」。這使我們想起「你的兒女都要受耶和華的教訓」（賽 54:13）與耶 31:34 新約的應許。它也與 4:5「不認識神的外邦人」成對：認識神的人，被神親自教導去愛。<\/p><p>4:10 以 καὶ γὰρ ποιεῖτε（kai gar poieite） 承認他們已經在做，接著又是 περισσεύειν μᾶλλον（perisseuein mallon），與 4:1 的 περισσεύητε μᾶλλον（perisseuēte mallon） 前後呼應。<\/p>","exp":"<p>〔腓〕腓 4:15--16（腓立比書講義第 4 章）<\/p><p><strong>「你們自己蒙了神的教訓，叫你們彼此相愛。」（4:9）愛弟兄是神親自教的課。<\/strong><\/p><p>帖撒羅尼迦人怎樣學會愛的？沒有人寫教材給他們，新約一卷都還沒寫成。是神自己教的：聖靈把一群素不相識的人，變成彼此稱「弟兄」的一家人。「馬其頓全地的眾弟兄」就是腓立比、庇哩亞的信徒。腓立比書講義第 4 章講過，保羅在帖撒羅尼迦的時候，腓立比人「也一次兩次地打發人供給我的需用」（腓 4:16）——馬其頓的教會彼此照顧，是從保羅在這裡缺錢的時候就開始了。<\/p><p>保羅稱讚他們，然後說：「要更加勉勵。」愛沒有及格線。做得好的人，被邀請做得更多，不是因為不夠好，是因為愛本來就是會滿溢出來的東西。下一節，保羅要告訴他們，這份愛在日常生活裡長甚麼樣子。<\/p>"},{"a":11,"z":12,"star":2,"grk":"<p lang=\"grc\">καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν,<\/p><p lang=\"grc\">ἵνα περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω καὶ μηδενὸς χρείαν ἔχητε.<\/p>","lit":"<p>並且要以安靜為志向，做自己的事，用你們的手做工，正如我們吩咐過你們的，<\/p><p>好叫你們向外面的人行走得體，並且不需要任何人（或作：沒有任何缺乏）。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>φιλοτιμεῖσθαι<\/td><td>philotimeisthai<\/td><td>以……為榮、拚命追求<\/td><td>原是愛面子、爭榮譽<\/td><\/tr><tr><td>ἡσυχάζειν<\/td><td>hēsychazein<\/td><td>安靜下來<\/td><td>與上一字是刻意的反差<\/td><\/tr><tr><td>πράσσειν τὰ ἴδια<\/td><td>prassein ta idia<\/td><td>做自己的事<\/td><td>不越界管閒事<\/td><\/tr><tr><td>ἐργάζεσθαι ταῖς χερσὶν ὑμῶν<\/td><td>ergazesthai tais chersin hymōn<\/td><td>用你們的手做工<\/td><td>多數信徒是手藝人<\/td><\/tr><tr><td>εὐσχημόνως<\/td><td>euschēmonōs<\/td><td>合宜地、體面地<\/td><td>林前 14:40 同字<\/td><\/tr><tr><td>πρὸς τοὺς ἔξω<\/td><td>pros tous exō<\/td><td>向外面的人<\/td><td>教會外的鄰舍與家人<\/td><\/tr><tr><td>μηδενὸς χρείαν ἔχητε<\/td><td>mēdenos chreian echēte<\/td><td>不需要任何人或任何東西<\/td><td>μηδενὸς 可作陽性或中性<\/td><\/tr><\/table>","gram":"<p><strong>4:11 把兩個相反的字綁在一起：φιλοτιμεῖσθαι ἡσυχάζειν（philotimeisthai hēsychazein）——「拚命爭取榮譽」去「安靜」。<\/strong><\/p><p>φιλοτιμέομαι（philotimeomai） 字面是「愛榮譽」，希臘城邦裡的有錢人用它說自己捐建築、辦慶典、在公共場合出風頭。保羅說：把這股拚勁，拿去安靜。這是刻意的反諷。三個不定詞 ἡσυχάζειν（hēsychazein）、πράσσειν τὰ ἴδια（prassein ta idia）、ἐργάζεσθαι ταῖς χερσὶν ὑμῶν（ergazesthai tais chersin hymōn） 一層一層具體：安靜、做自己的事、親手做工。καθὼς ὑμῖν παρηγγείλαμεν（kathōs hymin parēngeilamen） 與 4:2 的 παραγγελίας（parangelias） 同字根，這也是保羅在場時就講過的。<\/p><p>為甚麼要這樣說？學者有兩個解釋。一是末世的興奮：既然主快來了，何必工作？帖後 3:10--11 顯示，後來真有人這樣。二是希臘羅馬的恩庇制度：窮人依附有錢的恩主過活，替他捧場、為他奔走。兩者可能都有。<\/p><p>4:12 以 ἵνα（hina） 說目的：περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω（peripatēte euschēmonōs pros tous exō），「行走」又出現了（4:1）。μηδενὸς χρείαν ἔχητε（mēdenos chreian echēte） 的 μηδενὸς（mēdenos） 可以是陽性「不必依賴任何人」，也可以是中性「沒有甚麼缺乏」；和合本取後者。兩讀都通，前者更貼近恩庇制度的背景。<\/p>","exp":"<p><strong>「又要立志作安靜人，辦自己的事，親手做工」（4:11）——愛的樣子，包括不讓別人替你付帳。<\/strong><\/p><p>這一節緊接在「彼此相愛」之後，不是偶然。一間彼此相愛的教會，很容易出現一種人：反正弟兄姊妹會幫忙，我就不必工作了。保羅說，愛弟兄的人，會盡力不成為弟兄的重擔。他自己就是榜樣：他在帖撒羅尼迦「晝夜做工」（2:9），在哥林多與亞居拉夫婦「本是製造帳棚為業」（徒 18:3）。希臘文化看不起手工，覺得那是奴隸的事；保羅偏偏用自己的手，給福音作了一張名片。<\/p><p>「安靜」不是不說話，也不是不關心社會。它的反面是到處張揚、四處攪動、靠別人供養卻管別人的事。基督徒當然要關心城市、關心公義，耶利米叫被擄的人為那城求平安；但關心社會的第一步，常常是先把自己的工作做好，讓鄰舍看見一個可靠的人。這就是「向外人行事端正」：教會外的家人、同事與鄰居，是在看我們怎樣過日子，然後才聽我們說甚麼。<\/p><p>這一節也不能拿來貶低失業的人。帖後 3:10 說的是「若有人不肯做工，就不可吃飯」（帖後 3:10）——是「不肯」，不是「不能」。失業、生病、照顧家人而無法上班的人，是教會要扶持的對象，不是要被責備的人。今天的職場，一邊是過勞與加班文化，一邊是躺平；安靜做工的人，兩邊都不跟：不讓工作吞掉生命，也不讓自己的生活變成別人的負擔。<\/p><p>還有一個提醒：主再來的盼望，從來不是不工作、不讀書、不照顧家人的理由。保羅剛講完怎樣做工，下一節就講主的再來。等候主的人，手上是有活兒的。<\/p>"},{"a":13,"z":13,"star":3,"grk":"<p lang=\"grc\">Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν κοιμωμένων ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.<\/p>","lit":"<p>而我們不願你們不知道，弟兄們，關於那些睡著的人，免得你們憂傷，正如其餘那些沒有盼望的人一樣。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν<\/td><td>Ou thelomen de hymas agnoein<\/td><td>而我們不願你們不知道<\/td><td>保羅要說重要的事時的套語<\/td><\/tr><tr><td>ἀδελφοί<\/td><td>adelphoi<\/td><td>弟兄們<\/td><td>在最痛的題目前，先叫一聲家人<\/td><\/tr><tr><td>περὶ τῶν κοιμωμένων<\/td><td>peri tōn koimōmenōn<\/td><td>關於那些睡了的人<\/td><td>κοιμάω：會醒的睡<\/td><\/tr><tr><td>ἵνα μὴ λυπῆσθε<\/td><td>hina mē lypēsthe<\/td><td>免得你們憂傷<\/td><td>現在式<\/td><\/tr><tr><td>καθὼς καὶ οἱ λοιποὶ<\/td><td>kathōs kai hoi loipoi<\/td><td>正如其餘的人<\/td><td>比較的對象<\/td><\/tr><tr><td>οἱ μὴ ἔχοντες ἐλπίδα<\/td><td>hoi mē echontes elpida<\/td><td>那些沒有盼望的人<\/td><td>問題不在眼淚，在盼望<\/td><\/tr><\/table>","gram":"<p><strong>4:13 的關鍵在 καθώς（kathōs）：ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα（hina mē lypēsthe kathōs kai hoi loipoi hoi mē echontes elpida）——不是「免得你們憂傷」，是「免得你們像那些沒有盼望的人那樣憂傷」。<\/strong><\/p><p>Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν（Ou thelomen de hymas agnoein） 是保羅要教導一件重要的事時常用的套語（羅 1:13；林前 10:1；林前 12:1；林後 1:8）。他把問題診斷為「不知道」：帖撒羅尼迦人的痛，有一部分來自他們不知道死了的信徒在主再來時會怎樣。解藥是知識——不是一句「節哀」，而是一段教導。<\/p><p>κοιμωμένων（koimōmenōn） 是 κοιμάω（koimaō） 的現在分詞，「睡著的人」。用「睡」說死，在希臘文學裡本是委婉語；但在基督徒口中，它有了新的內容：會醒的睡。後來的教會把埋葬信徒的地方叫做 κοιμητήριον（koimētērion），「睡覺的地方」，這就是英文「墓園」一字的來源。本卷「黑夜與白晝，睡與醒」的對照在這裡開始：4:13--15 的 κοιμάω（koimaō） 指死了的信徒，5:6--7 的 καθεύδω（katheudō） 指屬靈昏睡，5:10 又用 καθεύδω（katheudō） 指死了的信徒——「無論醒著，睡著，都與他同活」（5:10）。<\/p><p>οἱ μὴ ἔχοντες ἐλπίδα（hoi mē echontes elpida） 是本章追蹤字 ἐλπίς（elpis） 的一站，也是全卷地勢的最低點。古代的墓誌銘與弔唁信常寫出這種沒有盼望：一封二世紀的埃及蒲草紙弔唁信說，面對這種事，人甚麼也做不了，所以你們彼此安慰吧。保羅在 4:18 也說「彼此勸慰」，但他給的安慰有內容。<\/p>","exp":"<p><strong>「論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣。」（4:13）保羅沒有說「不要憂傷」。<\/strong><\/p><p>這一節在喪禮上常被讀錯。有人對哭泣的家屬說：「聖經說不要憂傷，你應該高興，他去天家了。」可是保羅不是這樣說的。他說的是不要「像那些沒有指望的人一樣」憂傷。問題不在眼淚，在盼望。基督徒可以哭，可以哀傷，而且需要被陪伴。耶穌站在拉撒路的墳前，明知道幾分鐘後就要叫他復活，聖經還是記下：「耶穌哭了」（約 11:35）。如果主自己都哭了，我們就不必要求任何人在喪禮上忍住眼淚。保羅在別處也說：「與哀哭的人要同哭」（羅 12:15）。<\/p><p>帖撒羅尼迦的教會只有幾個月大，卻已經有人過世了。他們是怎樣死的，經文沒有說——可能是逼迫，也可能是病與意外。保羅在的時候教過他們主要再來，他們可能因此擔心：那些來不及等到主來的人，是不是錯過了？這是一群嬰孩信徒第一次站在墳前的問題。保羅沒有責備他們信心小，他寫了一段教導，用「睡」這個字，把盼望交給他們：睡了的人，會醒。<\/p><p>這一節的盼望是給「睡了的人」——在主裡的人——說的。至於未信主而過世的親人，保羅在這裡沒有討論，講台也不要替任何一個人下判斷，尤其不在家屬面前。把他交在公義又慈愛的神手中，正如亞伯拉罕所說：「審判全地的主豈不行公義嗎？」（創 18:25）<\/p><p>遇到自殺者的家屬、嬰孩夭折、流產、意外喪親，先陪伴，不解釋；不說「這是神的旨意」，也不急著引經文。坐下來，一起哭，比一篇道理更像福音。必要時，協助家屬尋求哀傷輔導。這是全卷地勢最低的一點，但再往下讀四節，就是最高的一點。<\/p>"},{"a":14,"z":14,"star":2,"grk":"<p lang=\"grc\">εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.<\/p>","lit":"<p>因為既然我們信耶穌死了又復活了，照樣，神也要把那些藉著耶穌睡了的人，與他一同帶來。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>εἰ γὰρ πιστεύομεν<\/td><td>ei gar pisteuomen<\/td><td>因為既然我們信<\/td><td>εἰ 是真實的條件：既然<\/td><\/tr><tr><td>Ἰησοῦς ἀπέθανεν καὶ ἀνέστη<\/td><td>Iēsous apethanen kai anestē<\/td><td>耶穌死了，又復活了<\/td><td>早期信條的口吻<\/td><\/tr><tr><td>οὕτως καὶ ὁ θεὸς<\/td><td>houtōs kai ho theos<\/td><td>照樣，神也<\/td><td>從信條推到應許<\/td><\/tr><tr><td>τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ<\/td><td>tous koimēthentas dia tou Iēsou<\/td><td>藉著耶穌睡了的人<\/td><td>διὰ 掛在哪一邊？<\/td><\/tr><tr><td>ἄξει σὺν αὐτῷ<\/td><td>axei syn autō<\/td><td>必把他們與他一同帶來<\/td><td>未來式；σύν：一同<\/td><\/tr><\/table>","gram":"<p><strong>4:14 用了兩個不同的字：說耶穌是 ἀπέθανεν（apethanen），「死了」；說信徒是 κοιμηθέντας（koimēthentas），「睡了」。<\/strong><\/p><p>保羅沒有說「耶穌睡了」。在這一節裡，真正的「死」只用在耶穌身上；信徒的死，因為他的死與復活，被改稱為「睡」。Ἰησοῦς ἀπέθανεν καὶ ἀνέστη（Iēsous apethanen kai anestē） 的語氣很像早期教會的信條，林前 15:3--4 有更完整的版本。<\/p><p>句子結構有一點不平衡：前半是 εἰ γὰρ πιστεύομεν（ei gar pisteuomen），「既然我們信」；後半卻不是「我們也信」，而是直接跳到 οὕτως καὶ ὁ θεὸς（houtōs kai ho theos）……ἄξει（axei）——「照樣，神也必帶來」。保羅從我們的信，直接跳到神的作為：我們信的是一件歷史上發生的事，神要做的是同一件事的下半場。<\/p><p>διὰ τοῦ Ἰησοῦ（dia tou Iēsou） 可以掛在前面，也可以掛在後面。掛在前面：「藉著耶穌睡了的人」，也就是和合本「在耶穌裡睡了的人」，他們是因與耶穌的關係而睡；少數人讀作為主殉道的人。掛在後面：「神藉著耶穌，必把睡了的人與他一同帶來」。兩種讀法在文法上都可以，本講義認為落點相同：無論死時或復活時，耶穌都是那位中保。<\/p><p>ἄξει σὺν αὐτῷ（axei syn autō） 是「帶來，與他一同」：主再來時，睡了的人與他一同來。這暗示他們現在已經與主同在，與腓 1:23「離世與基督同在」一致；另有「靈魂睡眠」一說，認為死後到復活之間沒有知覺，本講義在議題頁並陳。<\/p>","exp":"<p>〔腓〕腓 1:23（腓立比書講義第 1 章）<\/p><p><strong>「我們若信耶穌死而復活了，那已經在耶穌裡睡了的人，神也必將他們與耶穌一同帶來。」（4:14）他替我們嚐了真正的死，所以我們的死只是睡。<\/strong><\/p><p>基督徒的盼望不是一種樂觀的心情，它釘在一件歷史事實上：耶穌死了，又復活了。保羅的推論很簡單：既然那件事是真的，這件事也會是真的。死亡最可怕的部分，已經由耶穌親身承受；輪到我們的時候，它被改了一個名字。耶穌自己就是這樣說的：「我們的朋友拉撒路睡了，我去叫醒他。」（約 11:11）司提反被石頭打死，聖經記下的是：「說了這話，就睡了。」（徒 7:60）<\/p><p>那麼，睡了的人現在在哪裡？腓立比書講義第 1 章講過，保羅說他「情願離世與基督同在，因為這是好得無比的」（腓 1:23）。「在耶穌裡」睡了——死亡沒有把他們從耶穌裡面拿走。他們不是漂泊的孤魂，也不需要後人的供奉才能安息，他們在主那裡。<\/p><p>這對華人家庭是很實際的安慰。清明掃墓、追思禮拜時，基督徒不拜偶像（1:9），但可以盡孝、記念、感恩：帶一束花，說說他生前的故事，為他的一生感謝神。用溫柔而不是對抗，讓家人看見，信耶穌的人是最懂得記念親人的人。而最深的安慰在這一節的結尾：神必將他們「與耶穌一同帶來」。我們還會再見面。<\/p>"},{"a":15,"z":16,"star":2,"grk":"<p lang=\"grc\">τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·<\/p><p lang=\"grc\">ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπʼ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,<\/p>","lit":"<p>因為這事我們在主的話裡告訴你們：我們這些活著、存留到主來臨的人，絕不會搶在那些睡了的人之先；<\/p><p>因為主自己，在號令中，在天使長的聲音中，並在神的號筒中，要從天降下，而在基督裡的死人要先復活，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἐν λόγῳ κυρίου<\/td><td>en logō kyriou<\/td><td>在主的話裡<\/td><td>耶穌的教導，或先知啟示<\/td><\/tr><tr><td>ἡμεῖς οἱ ζῶντες<\/td><td>hēmeis hoi zōntes<\/td><td>我們這些活著的<\/td><td>保羅把自己算在可能活著的人裡<\/td><\/tr><tr><td>εἰς τὴν παρουσίαν τοῦ κυρίου<\/td><td>eis tēn parousian tou kyriou<\/td><td>直到主的來臨<\/td><td>παρουσία：君王駕臨<\/td><\/tr><tr><td>οὐ μὴ φθάσωμεν<\/td><td>ou mē phthasōmen<\/td><td>絕不會搶先<\/td><td>雙重否定：最強的否定<\/td><\/tr><tr><td>αὐτὸς ὁ κύριος<\/td><td>autos ho kyrios<\/td><td>主自己<\/td><td>不是代表<\/td><\/tr><tr><td>ἐν κελεύσματι<\/td><td>en keleusmati<\/td><td>在號令中<\/td><td>新約只此一次；軍令<\/td><\/tr><tr><td>ἐν σάλπιγγι θεοῦ<\/td><td>en salpingi theou<\/td><td>在神的號筒中<\/td><td>西乃山的角聲<\/td><\/tr><tr><td>ἀναστήσονται πρῶτον<\/td><td>anastēsontai prōton<\/td><td>必先復活<\/td><td>「先」是對活著的信徒說<\/td><\/tr><\/table>","gram":"<p><strong>4:15 以 ἐν λόγῳ κυρίου（en logō kyriou） 開頭，保羅自己標明：下面的話不是他的推想。<\/strong><\/p><p>「主的話」指甚麼，有三種看法：一、耶穌在地上的教導，例如太 24:30--31 人子駕雲降臨、用號筒招聚選民；二、福音書沒有記下、但教會口傳的一句主的話；三、復活的主藉先知給保羅的啟示。三者都有可能，但無論哪一種，權柄都在主，不在保羅。<\/p><p>ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι（hēmeis hoi zōntes hoi perileipomenoi） 把保羅自己算進「活著的人」裡。這不等於他定了日子：他只是把自己放在每一代信徒都該站的位置上——主可能在我有生之年來。同一位保羅在腓 1:23 預備離世，在林後 5:8 說「更願意離開身體與主同住」（林後 5:8）。εἰς τὴν παρουσίαν（eis tēn parousian） 是本章追蹤字的一站：παρουσία（parousia） 在當時用來說君王或官長正式駕臨一座城。οὐ μὴ φθάσωμεν（ou mē phthasōmen） 是 οὐ μή（ou mē） 加假設語氣，希臘文最強的否定：活著的人「絕對不會」比睡了的人先一步。<\/p><p>4:16 以 ὅτι（hoti） 說明理由。αὐτὸς ὁ κύριος（autos ho kyrios） 放在句首：主自己，不是差一位天使代表。接著三個 ἐν（en） 片語：ἐν κελεύσματι（en keleusmati） 是號令，軍官對部隊、舵手對划槳手發的口令，新約只此一次；ἐν φωνῇ ἀρχαγγέλου（en phōnē archangelou）；ἐν σάλπιγγι θεοῦ（en salpingi theou），神的號。這使我們想起西乃山「角聲甚大」（出 19:16）與「你們要在錫安吹角」（珥 2:1）；保羅自己後來在林前 15:52 把它連上「號筒末次吹響」。καταβήσεται ἀπʼ οὐρανοῦ（katabēsetai ap' ouranou） 呼應 1:10 等候他兒子 ἐκ τῶν οὐρανῶν（ek tōn ouranōn）。最後 πρῶτον（prōton） 的「先」是相對於活著的信徒說的，不是在談信徒與不信者兩次復活的先後。<\/p>","exp":"<p>〔太〕太 24:30--31（馬太講義第 24 章）<\/p><p>〔林前〕林前 15:51--52（哥林多前書講義第 15 章）<\/p><p><strong>「那在基督裡死了的人必先復活」（4:16）——睡了的人不會錯過，他們排在最前面。<\/strong><\/p><p>帖撒羅尼迦人擔心的是：死了的弟兄姊妹，會不會錯過主再來的那一天？保羅的回答是：不但不會錯過，他們還要「先」。活著的人「斷不能在那已經睡了的人之先」（4:15）。在神的次序裡，沒有人被遺漏，等得最久的人，先被叫醒。<\/p><p>「我們這活著還存留到主降臨的人」，保羅把自己也算在裡面。這不是在給日期，他從來沒有說主哪一年會來；這是一種姿態：每一代信徒都該活得像主可能在自己這一生回來。所以這節經文不能拿來推算年份，也不能拿來說「保羅錯了」。他後來面對死亡同樣平安，因為無論活著見主來，或先睡了，結局都是與主同在。<\/p><p>主的再來不是一件秘密的事。「主必親自從天降臨」：是他自己，不是代表；有呼叫的聲音、天使長的聲音、神的號——這是一個公開的、全宇宙都聽得見的日子。馬太講義第 24 章講過，主耶穌自己說人子要「駕著天上的雲降臨」，要「用號筒的大聲，將他的選民……都招聚了來」（太 24:30--31）。哥林多前書講義第 15 章講過號筒末次吹響的時候，「死人要復活成為不朽壞的，我們也要改變」（林前 15:52）。<\/p><p>這兩節的果效是平安，不是恐慌。一位會親自回來的主，一定會親自照顧他那些先睡了的人。<\/p>"},{"a":17,"z":18,"star":3,"grk":"<p lang=\"grc\">ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.<\/p><p lang=\"grc\">ὥστε παρακαλεῖτε ἀλλήλους ἐν τοῖς λόγοις τούτοις.<\/p>","lit":"<p>然後我們這些活著、存留的人，要與他們一同在雲中被奪取上去，到空中迎接主；這樣，我們就要永遠與主同在。<\/p><p>所以，你們要用這些話彼此勸慰。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἔπειτα<\/td><td>epeita<\/td><td>然後<\/td><td>次序，不是時間表<\/td><\/tr><tr><td>ἅμα σὺν αὐτοῖς<\/td><td>hama syn autois<\/td><td>與他們一起<\/td><td>重逢<\/td><\/tr><tr><td>ἁρπαγησόμεθα<\/td><td>harpagēsometha<\/td><td>我們將被奪取上去<\/td><td>被動；拉丁文 rapiemur→rapture<\/td><\/tr><tr><td>ἐν νεφέλαις<\/td><td>en nephelais<\/td><td>在雲中<\/td><td>神同在的記號<\/td><\/tr><tr><td>εἰς ἀπάντησιν τοῦ κυρίου<\/td><td>eis apantēsin tou kyriou<\/td><td>為了迎接主<\/td><td>出城迎接來訪的君王<\/td><\/tr><tr><td>εἰς ἀέρα<\/td><td>eis aera<\/td><td>到空中<\/td><td>天與地之間<\/td><\/tr><tr><td>πάντοτε σὺν κυρίῳ ἐσόμεθα<\/td><td>pantote syn kyriō esometha<\/td><td>我們將永遠與主同在<\/td><td>全卷地勢最高點<\/td><\/tr><tr><td>ὥστε παρακαλεῖτε ἀλλήλους<\/td><td>hōste parakaleite allēlous<\/td><td>所以，你們要彼此勸慰<\/td><td>現在式命令：一直勸慰下去<\/td><\/tr><\/table>","gram":"<p><strong>◆ 4:17 的兩個關鍵字：ἁρπαγησόμεθα（被提）與 εἰς ἀπάντησιν（迎接）。前者說怎樣上去，後者說上去做甚麼。<\/strong><\/p><p>ἁρπαγησόμεθα（harpagēsometha） 是 ἁρπάζω（harpazō） 的未來被動式，「被奪取、被搶去」，是一個有力、突然的字：腓利被主的靈「提」去（徒 8:39），保羅「被提」到第三層天（林後 12:2）。拉丁文武加大譯本譯作 rapiemur，英文 rapture 一字由此而來。ἅμα σὺν αὐτοῖς（hama syn autois）：與那些先復活的人一起——這個「一起」本身就是安慰。ἐν νεφέλαις（en nephelais） 的雲，在聖經裡常是神同在的記號（出 19:16；徒 1:9）。<\/p><p>ἀπάντησιν（apantēsin） 是 ἀπάντησις（apantēsis） 的受格。這個字在當時有專門的用法：君王或官長到訪，城裡的人出城迎接，然後陪他一起進城。新約另外兩處正是這樣用：十個童女「出來迎接」新郎（太 25:6），羅馬的弟兄「出來……迎接」保羅，再陪他進城（徒 28:15）。這個用法支持「迎接之後與主同來」的讀法，但單憑一個字不能定案。<\/p><p>由此產生歷代對「被提」時間點的不同讀法：<strong>災前被提<\/strong>（時代論：主分兩階段再來，先在空中接走教會，大災難之後再與聖徒降到地上；二十世紀華人福音派影響最深）；<strong>災中被提<\/strong>或<strong>忿怒前被提<\/strong>（教會經過大災難的前半或大部分，在神的忿怒傾倒前被提）；<strong>災後被提<\/strong>（只有一次再來，教會經過大災難，出城迎接主之後陪他降到地上；許多教父、改革宗與福音派學者採此說）。千禧年觀與此交叉：<strong>前千禧<\/strong>（歷史前千禧、時代論前千禧）、<strong>無千禧<\/strong>、<strong>後千禧<\/strong>。各派都有敬虔愛主的人，各派都是弟兄。本講義堅持各派共同承認的：主要親自、可見地再來，死人要復活，信的人要永遠與主同在；不替各教會決定被提的時間點，也不算日子。<\/p><p>經文自己沒有說被提之後往哪裡去，只說 καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα（kai houtōs pantote syn kyriō esometha）——οὕτως（houtōs） 是「這樣」，重點落在「與主同在」，不落在路線圖。4:18 以 ὥστε（hōste） 帶出結論，παρακαλεῖτε（parakaleite） 是現在式命令，ἐν τοῖς λόγοις τούτοις（en tois logois toutois），「用這些話」：不是另外的新消息，就是剛才這幾句話。5:11 會再說一次「彼此勸慰」。<\/p>","exp":"<p><strong>「這樣，我們就要和主永遠同在。所以，你們當用這些話彼此勸慰。」（4:17--18）被提的重點不是「提」，是「與主同在」。<\/strong><\/p><p>全卷地勢的最低點在 4:13，最高點在 4:17，中間只隔四節。保羅從墳前開始，一路把哭泣的人帶上山頂。山頂上的畫面是一場重逢：活著的人「必和他們一同被提到雲裡」（4:17）。「和他們一同」——那些你在喪禮上送走的人，那天會在你身邊。然後是一句最簡單的話：「我們就要和主永遠同在。」（4:17）不是一座金城的描述，不是一張時間表，是一個關係：永遠和他在一起。主耶穌自己說過：「我在哪裡，叫你們也在那裡。」（約 14:3）<\/p><p>「在空中與主相遇」這個「相遇」，是城裡的人出城迎接君王的字。這幅畫不是逃難，是迎駕：我們不是被救出火場的難民，是出城迎接王的城民。災前、災中、災後的各種讀法，敬虔的弟兄姊妹各有所持，講台不需要為此彼此攻擊。<\/p><p>華人教會很熟悉另一種講法：「被提的時候你若沒準備好，就會被留下來。」這不是 4:13--18 的語氣，也不是本講義的講法。保羅寫這段話，對象是正在哭的人，目的是安慰，不是恐嚇。歷史上每一次有人宣布「某年某月主要來」，都落空了，而且每一次都傷了一批最單純的信徒。保羅在下一章明說：「論到時候、日期，不用寫信給你們」（5:1）。他拒絕給時間表；他給的是一個應許：「神不是預定我們受刑，乃是預定我們……得救」（5:9）。<\/p><p>所以這一段的結論不是「要害怕」，而是「所以，你們當用這些話彼此勸慰」（4:18）。被提的經文，是寫來彼此勸慰的。在喪禮上讀這段，是為了讓哭的人知道：他們還會再見面。這也是 321 所說彼此勸慰、互相建立的屬神體系：保羅沒有說「我來安慰你們」，而是說「你們彼此安慰」——一間嬰孩教會，已經可以用神的話扶起彼此。<\/p><p>讀完這一段，該問自己的是：我是更害怕主來，還是更想念主來？主一定會回來；他回來，是為了接我們到他那裡去，也為了把我們所愛、先睡了的人一同帶來。<\/p>"}],"5":[{"a":1,"z":3,"star":3,"grk":"<p lang=\"grc\">Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι,<\/p><p lang=\"grc\">αὐτοὶ γὰρ ἀκριβῶς οἴδατε ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.<\/p><p lang=\"grc\">ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.<\/p>","lit":"<p>而關於那些時間和那些時機，弟兄們，你們沒有需要有甚麼寫給你們，<\/p><p>因為你們自己準確地知道，主的日子像賊在夜間那樣來到。<\/p><p>當他們說「平安與穩妥」的時候，那時突然的毀滅臨到他們，如同產痛臨到腹中懷孕的婦人，他們絕不能逃脫。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν<\/td><td>Peri de tōn chronōn kai tōn kairōn<\/td><td>論到那些時間和時機<\/td><td>Περὶ δὲ：回應來信所問（4:9、4:13）<\/td><\/tr><tr><td>οὐ χρείαν ἔχετε<\/td><td>ou chreian echete<\/td><td>你們沒有需要<\/td><td>與 4:9 論弟兄相愛同一句<\/td><\/tr><tr><td>ἀκριβῶς οἴδατε<\/td><td>akribōs oidate<\/td><td>準確地知道<\/td><td>準確知道的，正是沒有人知道<\/td><\/tr><tr><td>ἡμέρα κυρίου<\/td><td>hēmera kyriou<\/td><td>主的日子<\/td><td>舊約先知的「耶和華的日子」<\/td><\/tr><tr><td>ὡς κλέπτης ἐν νυκτὶ<\/td><td>hōs kleptēs en nykti<\/td><td>像夜間的賊<\/td><td>耶穌自己的比喻（太 24:43）<\/td><\/tr><tr><td>Εἰρήνη καὶ ἀσφάλεια<\/td><td>Eirēnē kai asphaleia<\/td><td>平安與穩妥<\/td><td>很可能呼應羅馬的口號<\/td><\/tr><tr><td>αἰφνίδιος ὄλεθρος<\/td><td>aiphnidios olethros<\/td><td>突然的毀滅<\/td><td>αἰφνίδιος 放句首強調<\/td><\/tr><tr><td>ἡ ὠδὶν<\/td><td>hē ōdin<\/td><td>產痛<\/td><td>時刻不能預知，來臨不能避免<\/td><\/tr><tr><td>οὐ μὴ ἐκφύγωσιν<\/td><td>ou mē ekphygōsin<\/td><td>絕不能逃脫<\/td><td>雙重否定，新約最強的否定<\/td><\/tr><\/table>","gram":"<p><strong>5:1 以 Περὶ δὲ（Peri de） 開頭，和 4:9、4:13 一樣，像是在回答提摩太帶回來的問題；但這一次，保羅的回答是「不用寫」。<\/strong><\/p><p>τῶν χρόνων καὶ τῶν καιρῶν（tōn chronōn kai tōn kairōn） 是一對：χρόνος（chronos） 指時間的長度——還要多久；καιρός（kairos） 指時機——是哪一刻。兩個字並列，等於問「還要等多久？到底是哪一天？」復活的主對門徒用的也是這一對字：「父憑著自己的權柄所定的時候、日期，不是你們可以知道的」（徒 1:7）。保羅的回答 οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι（ou chreian echete hymin graphesthai），與 4:9 論弟兄相愛幾乎同句——不是題目不重要，是他們已經知道該知道的。<\/p><p>5:2 的 γὰρ（gar） 給出理由：αὐτοὶ γὰρ ἀκριβῶς οἴδατε（autoi gar akribōs oidate）。ἀκριβῶς（akribōs） 是「準確地、仔細地」，放在這裡近乎反諷：你們準確知道的，正是沒有人能準確知道。ἡμέρα κυρίου（hēmera kyriou） 是舊約先知的「耶和華的日子」（珥 2:1；摩 5:18），在保羅筆下，κύριος（kyrios） 就是耶穌。ὡς κλέπτης ἐν νυκτὶ（hōs kleptēs en nykti） 是耶穌自己的比喻（太 24:43；路 12:39），保羅大概是從口傳的主的話領受的；彼後 3:10、啟 3:3、啟 16:15 都沿用。ἔρχεται（erchetai） 是現在式，表達確定會來，不是在描寫已經來了。<\/p><p>5:3 換成第三人稱 λέγωσιν（legōsin）：說話的是「他們」，不是「你們」。Εἰρήνη καὶ ἀσφάλεια（Eirēnē kai asphaleia） 很可能呼應羅馬帝國的宣傳口號 pax et securitas——錢幣與碑文上常見的「羅馬和平」；這也使我們想起耶利米時代的假先知：「平安了！平安了！其實沒有平安」（耶 6:14）。αἰφνίδιος（aiphnidios） 放在句首強調「忽然」；ὠδὶν（ōdin） 產痛的比喻有兩面：時刻不能預知，來臨卻無可避免。οὐ μὴ ἐκφύγωσιν（ou mē ekphygōsin） 是雙重否定加假設語氣，是希臘文最強的否定。<\/p>","exp":"<p>〔太〕太 24:42--44（馬太講義第 24 章）<\/p><p><strong>「弟兄們，論到時候、日期，不用寫信給你們」（5:1）——一間剛失去親人的教會最想問的題目，保羅不回答。<\/strong><\/p><p>帖撒羅尼迦人有理由問。他們剛聽完 4:13--18：主要降臨，死人要復活，活著的要被提。下一個問題自然是：甚麼時候？還要等多久？今天許多教會也這樣問，而且總有人樂意回答——排圖表、對新聞、算年份。保羅手上明明有機會，卻拒絕給時間表。這不是含糊其詞，是主耶穌自己說過：「但那日子，那時辰，沒有人知道，連天上的使者也不知道，子也不知道，惟獨父知道。」（太 24:36）連子都說不知道的事，使徒不寫，我們更不必推算。<\/p><p>他給的是一幅畫：「主的日子來到，好像夜間的賊一樣」（5:2）。馬太講義第 24 章講過這個比喻：「家主若知道幾更天有賊來，就必警醒」（太 24:43）。賊的特點不是可怕，是不預告。所以這幅畫要人做的，不是去猜賊幾點來，而是每天晚上都把門顧好。認真的末世論，結果不是緊張地盯著日曆，是平靜地過好每一天。<\/p><p>5:3 說的是「他們」：「人正說『平安穩妥』的時候，災禍忽然臨到他們」（5:3）。帖撒羅尼迦人天天聽羅馬說：有凱撒就有和平，就有安全。保羅說，把盼望放在人造的平安上，就像懷胎的婦人以為今天不會生——日子一到，躲不掉。這一節常被拿來對號入座：某國簽了和平協議、某地停火了，就說 5:3 應驗了。這是把保羅拒絕給的時間表，從後門偷偷塞回去。5:3 不是一則新聞預告，是對所有自以為穩妥的人的提醒——也包括那些以為自己已經算準了日子的人。<\/p><p>產難的比喻還有另一面：痛是真的，但它是為了生產。保羅下一節立刻轉向信徒（5:4）。給教會的末世論，起點不是恐慌，是身分。讀完這三節，人應當更想念主來，而不是更害怕主來。321 說「耶穌是我的生命」——生命交在他手裡的人，不必知道日期，只要知道是誰要來。<\/p>"},{"a":4,"z":5,"star":2,"grk":"<p lang=\"grc\">ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς κλέπτης καταλάβῃ,<\/p><p lang=\"grc\">πάντες γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·<\/p>","lit":"<p>但你們，弟兄們，不在黑暗中，以致那日子像賊一樣抓住你們；<\/p><p>因為你們全都是光的兒子，也是白晝的兒子。我們不屬於夜，也不屬於黑暗；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὑμεῖς δέ<\/td><td>hymeis de<\/td><td>但你們<\/td><td>從「他們」轉到「你們」<\/td><\/tr><tr><td>οὐκ ἐστὲ ἐν σκότει<\/td><td>ouk este en skotei<\/td><td>不在黑暗裡<\/td><td>陳述身分，不是命令<\/td><\/tr><tr><td>ὡς κλέπτης καταλάβῃ<\/td><td>hōs kleptēs katalabē<\/td><td>像賊一樣抓住<\/td><td>καταλαμβάνω：突襲、逮住<\/td><\/tr><tr><td>υἱοὶ φωτός<\/td><td>hyioi phōtos<\/td><td>光的兒子<\/td><td>希伯來式說法：屬光的人<\/td><\/tr><tr><td>υἱοὶ ἡμέρας<\/td><td>hyioi hēmeras<\/td><td>白晝的兒子<\/td><td>ἡμέρα 與「主的日子」同字<\/td><\/tr><tr><td>οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους<\/td><td>ouk esmen nyktos oude skotous<\/td><td>我們不屬夜，也不屬黑暗<\/td><td>人稱從「你們」換成「我們」<\/td><\/tr><\/table>","gram":"<p><strong>◆ 經文鑑別 5:4<\/strong>：SBLGNT 作 ὡς κλέπτης（hōs kleptēs），單數主格，賊是比喻那日子：「那日子臨到你們像賊一樣」，和合本與此相同。亞歷山大抄本、梵蒂岡抄本等作 κλέπτας（kleptas），複數直接受詞，韋斯科特—賀特（WH）採之，意思變成「那日子抓住你們，如同抓住賊一樣」——賊成了人，像天亮時被逮個正著的竊賊。<\/p><p>兩種讀法各有道理。κλέπτας（kleptas） 是較難的讀法，而且與前面的 ὑμᾶς（hymas） 同為受格，抄寫者若把 κλέπτης（kleptēs） 改成 κλέπτας（kleptas），可能是受 ὑμᾶς（hymas） 字尾的牽引，也可能反過來，是為了與 5:2 的 κλέπτης（kleptēs） 一致而改回單數。多數現代版本採 κλέπτης（kleptēs）：見證較廣，且直接接續 5:2 的比喻。本講義照 SBLGNT 與和合本；兩種讀法的落點相同：屬黑夜的人才會被天亮嚇到。<\/p><p>5:5 的 υἱοὶ φωτός（hyioi phōtos） 與 υἱοὶ ἡμέρας（hyioi hēmeras） 是希伯來式的「……之子」，表示屬於、帶著那個性質（路 16:8；約 12:36；弗 5:8）。ἡμέρας（hēmeras） 與 5:2 的 ἡμέρα κυρίου（hēmera kyriou） 同一個字：信徒是那個「日子」的孩子。後半句 οὐκ ἐσμὲν（ouk esmen） 人稱從 ἐστε（este） 換成 ἐσμὲν（esmen），保羅把自己放進去；νυκτὸς（nyktos） 與 σκότους（skotous） 是歸屬的所有格，答案不是「我們不在夜裡」，是「我們不屬夜」。<\/p>","exp":"<p><strong>「弟兄們，你們卻不在黑暗裡，叫那日子臨到你們像賊一樣。」（5:4）同一個日子，對兩種人是兩種經驗。<\/strong><\/p><p>賊來的時候，誰會被嚇到？睡著的屋主。醒著、燈亮著的人，看見有人來，不是驚嚇，是迎接。5:4 沒有說主的日子不會臨到信徒，也沒有說信徒知道日期；它說的是：那日子不會「像賊一樣」抓住你們。差別不在誰掌握了時間表，在誰住在哪裡。<\/p><p>「你們都是光明之子，都是白晝之子」（5:5）。這是陳述句，不是命令。保羅不是說「你們要努力變成光明之子」，而是說「你們已經是」。「……之子」是希伯來人的說法，意思是屬於、帶著那個性質：光明之子就是屬光的人。「白晝之子」更特別——「白晝」和「主的日子」原文是同一個字 ἡμέρα（hēmera）。帖撒羅尼迦人是那個「日子」的孩子：主再來的那一天，不是闖進他們家的陌生人，是他們所屬的那一天終於到了。<\/p><p>然後人稱悄悄換了：「我們不是屬黑夜的，也不是屬幽暗的」（5:5）。前半句是「你們」，後半句是「我們」。保羅站進他們中間，使徒與嬰孩教會同屬一個白晝。這是 2:7 那位母親的口吻——不是站在高處指著底下說「你們要醒」，是把自己也放進去。<\/p><p>第 5 章是全卷的「醒」。可是醒之前，先有身分。一個人若一直被提醒「你可能是黑夜的人」，他會惶惶不安地檢查自己；一個人若知道「你是白晝之子」，他會自然地想活得像白天。天還沒亮，你已經是白天的人了——這是保羅在夜裡給嬰孩教會的第一句話。<\/p>"},{"a":6,"z":8,"star":3,"grk":"<p lang=\"grc\">ἄρα οὖν μὴ καθεύδωμεν ὡς οἱ λοιποί, ἀλλὰ γρηγορῶμεν καὶ νήφωμεν.<\/p><p lang=\"grc\">οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσιν, καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν·<\/p><p lang=\"grc\">ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·<\/p>","lit":"<p>所以，我們不要像其餘的人那樣睡，而要醒著，並且清醒。<\/p><p>因為睡的人在夜間睡，醉的人在夜間醉；<\/p><p>但我們既屬於白晝，就要清醒，穿上信和愛的胸甲，並得救之盼望的頭盔；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἄρα οὖν<\/td><td>ara oun<\/td><td>所以、因此<\/td><td>保羅愛用的雙重推論詞<\/td><\/tr><tr><td>μὴ καθεύδωμεν<\/td><td>mē katheudōmen<\/td><td>我們不要睡<\/td><td>καθεύδω：屬靈昏睡，不是 4:13 的 κοιμάω<\/td><\/tr><tr><td>ὡς οἱ λοιποί<\/td><td>hōs hoi loipoi<\/td><td>像其餘的人<\/td><td>與 4:13 同一批「其餘的人」<\/td><\/tr><tr><td>γρηγορῶμεν καὶ νήφωμεν<\/td><td>grēgorōmen kai nēphōmen<\/td><td>我們要醒著、要清醒<\/td><td>一個對睡，一個對醉；篇名「醒」<\/td><\/tr><tr><td>οἱ μεθυσκόμενοι<\/td><td>hoi methyskomenoi<\/td><td>喝醉的人<\/td><td>夜裡的另一種狀態<\/td><\/tr><tr><td>ἡμέρας ὄντες<\/td><td>hēmeras ontes<\/td><td>既屬於白晝<\/td><td>分詞：因為是，所以要<\/td><\/tr><tr><td>θώρακα πίστεως

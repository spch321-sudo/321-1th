    /* 想更深：問 */
    deeper: [
      '我們在這裡想更深一點。有人會問，',
      '這裡容我多說一句。可能有人心裡正在問，',
      '我知道有人讀到這裡會停下來問，',
      '讓我們把這一段再往裡走一步。有人問，',
      '這裡有一個問題值得停下來。有人問，',
      '也許你正在想這個問題：'
    ],
    /* 想更深：答 */
    deeperAnswer: [
      '我的回答是這樣。',
      '我是這樣看的。',
      '我們可以這樣想。',
      '這一題我會這樣回答。',
      '讓我這樣說。',
      '答案其實就在經文裡。'
    ],
    /* 五步驟：{k} 是「看」「聽」「想」「講」「行」，{t} 是內容 */
    step: [
      '這一步是「{k}」。{t}',
      '接下來我們「{k}」。{t}',
      '「{k}」這一步：{t}',
      '先來「{k}」。{t}',
      '我們「{k}」。{t}'
    ],
    /* 收尾 */
    wrap: [
      '我們來收尾。',
      '最後，我們把這一段收起來。',
      '到這裡，我們收個尾。',
      '讓我們把這一段收在一起。'
    ],
    /* 表格：畫面上是表，耳朵裡是一段話 */
    table: [
      '這裡有一張表，我用說的帶你看過一遍。',
      '接下來這一段本來是一張表，我把它讀成一段話。',
      '這一段我整理成了表格，用聽的是這樣。',
      '底下是一張對照表，我一列一列說。'
    ],
    /* 條列 */
    list: [
      '這裡有幾點。',
      '底下分成幾點來看。',
      '這一段有幾點。',
      '我列了幾點。'
    ],
    /* 引用經文 */
    quote: [
      '經上說：',
      '聖經這樣說：',
      '我們來讀這一節：',
      '這一節是這樣寫的：'
    ],

    /* ── 開始、暫停、停止、接續 ──────────────────────────────────
     * 這四件事本來沒有聲音：按下去就開始唸，按停就沒聲了。
     * 少了這一句話，聽的人不知道自己在哪裡——尤其是「從書籤繼續」，
     * 冷不防從半路唸起，耳朵會以為前面漏掉了。
     *
     * 一位牧者不會這樣帶人。他會說「我們接著上次停的地方」。
     * ------------------------------------------------------------- */

    /* 開始：{t} 是這一課的名字 */
    start: [
      '我們一起來讀{t}。',
      '{t}。我們開始。',
      '來，我們讀{t}。',
      '我們從{t}開始。',
      '{t}，我們一起聽。'
    ],
    /* 開始，可是不知道叫什麼名字 */
    startBare: [
      '我們開始。',
      '來，我們一起來讀。',
      '我們一起來讀這一段。',
      '好，我們開始讀。'
    ],
    /* 指定從第幾段開始：{n} 段序，{t} 標題 */
    startAt: [
      '我們從第{n}段開始，{t}。',
      '這一次從第{n}段起，{t}。',
      '我們直接來到第{n}段，{t}。',
      '從第{n}段讀起。{t}。',
      '我們從第{n}段往下讀，{t}。'
    ],
    /* 指定從第幾段開始，可是那一段沒有標題 */
    startAtBare: [
      '我們從第{n}段開始。',
      '這一次從第{n}段起。',
      '我們直接來到第{n}段。',
      '從第{n}段讀起。'
    ],
    /* 接著上次停的地方：{n} 段序 */
    resume: [
      '我們接著上次停的地方，從第{n}段繼續。',
      '上一次讀到第{n}段，我們從那裡接下去。',
      '我們回到第{n}段，接著往下讀。',
      '接著剛才停下來的地方，第{n}段。',
      '我們從第{n}段再往下走。'
    ],
    /* 暫停 */
    pause: [
      '我們先停在這裡。',
      '先停一下。',
      '到這裡先歇一口氣。',
      '我們暫時停在這裡。'
    ],
    /* 停止 */
    stop: [
      '今天先讀到這裡。',
      '我們就讀到這裡。',
      '這一段先停在這裡。',
      '好，我們先到這裡。'
    ]
  };

  /* 表格與條列讀出來的零件。
   *
   * 這一組本來寫死在程式裡，英文版於是唸成
   * 「What follows was laid out as a table. 先看「x」，y。」——
   * 一半英文一半中文，而且所有測試都過，因為沒有人驗長相。
   *
   * 凡是會被唸出來或看到的字，一律要能換掉。 */
  var W = {
    rowFirst: ['先看', '我們先看', '第一個'],
    rowMid: ['再看', '接著', '然後', '再來', '接下來'],
    rowLast: ['最後'],
    cols: '這張表有{n}欄：{list}。',
    row2: '{link}「{label}」，{value}。',      // 兩欄表
    rowN: '{link}「{label}」：{parts}。',      // 三欄以上
    pair: '{col}是{value}',
    pairSep: '；',
    listSep: '、',
    itemFirst: '第{n}，',
    itemLast: '最後，',
    end: '。'
  };

  var DEF = {
    seed: 0,             // 換一課就換一個起點，整課的節奏不會跟上一課一樣
    speakUnit: true,
    cls: 'nar',          // HTML 的 class 前綴
    words: null,         // 上面那一組零件；英文版整組換掉
    /* 序號怎麼寫。預設中文數字（第三段）；英文版給 String（Section 3）。
       這一格漏了的話，英文版會唸成「Section 三」——模板全換成英文了，
       塞進去的數字還是中文，而且每一項測試都過，因為沒有人驗長相。 */
    num: null,           // fn(n) -> string
    labels: { col: '欄', row: '列' }
  };

  var C = null;

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cfg() { return C || (C = ext({}, DEF)); }

  /* 中文數字。跟 REF321 的那一份刻意各留一份——
     這兩個模組不互相依賴，要能單獨掛。 */
  function cn(n) {
    n = parseInt(n, 10);
    var d = '零一二三四五六七八九';
    if (isNaN(n)) return '';
    if (n < 10) return d.charAt(n);
    if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');
    if (n < 100) return d.charAt(Math.floor(n / 10)) + '十' + (n % 10 ? d.charAt(n % 10) : '');
    return String(n);
  }

  /* ── 挑一套 ────────────────────────────────────────────────────────
   * 用位置算，不用亂數。同一課唸兩次要一模一樣——
   * 亂數的話逐句標示與跟讀會對不上，而且使用者會覺得「怎麼跟剛才不一樣」。
   *
   * 各種帶入詞不可以同步：如果每一種都用 i % n，那麼第 0 個分段配第 0 個
   * 題目、第 1 個分段配第 1 個題目，整課的節奏會出現一種說不上來的規律感。
   * 所以混進種類名字的雜湊，讓每一種各走各的。
   * ------------------------------------------------------------------- */

  function hash(kind) {
    var h = 0, i;
    for (i = 0; i < kind.length; i++) h = (h * 31 + kind.charCodeAt(i)) % 9973;
    return h;
  }

  /* 序號：數字才轉，已經是字串的就原樣送出（宿主給「十二」那種） */
  function num(n) {
    if (typeof n !== 'number') return n == null ? '' : String(n);
    var f = cfg().num;
    if (f) { try { return String(f(n)); } catch (e) {} }
    return cn(n);
  }

  function pick(kind, i) {
    var arr = T[kind];
    if (!arr || !arr.length) return '';
    var n = (Math.abs(parseInt(i, 10) || 0) + hash(kind) + (cfg().seed | 0)) % arr.length;
    return arr[n];
  }

  function fill(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] != null ? String(vars[k]) : '';
    });
  }

  /* ── 對外的幾種帶入 ─────────────────────────────────────────────── */

  function lead(kind, i, vars) { return fill(pick(kind, i), vars || {}); }

  function section(title, n, i) {
    title = String(title == null ? '' : title).replace(/[。．.]$/, '');
    if (n == null || n === '') return fill(pick('heading', i), { t: title });
    return fill(pick('section', i), { n: num(n), t: title });
  }

  function numbered(n, i) {
    return fill(pick('numbered', i), { n: num(n) });
  }

  function step(key, body, i) {
    return fill(pick('step', i), { k: key, t: String(body == null ? '' : body) });
  }

  function deeper(q, i) { return pick('deeper', i) + String(q == null ? '' : q); }
  function deeperAnswer(i) { return pick('deeperAnswer', i); }
  function wrap(i) { return pick('wrap', i); }

  /* ── 開始、暫停、停止、接續 ────────────────────────────────────────
   * `i` 是輪替的位置。分段、題目那些有天然的位置（第幾塊），
   * 這四種沒有——所以慣例是：
   *
   *   · 開始／接續：傳 0（種子已經一課一換，整課的第一句自然就不一樣）
   *   · 暫停／停止：傳「這一課按了第幾次」，同一課連按兩次才不會一樣
   *
   * 標題末尾的句號要去掉，不然會唸成「創世記第一章。。我們開始」。
   * ------------------------------------------------------------------- */

  function title_(t) {
    return String(t == null ? '' : t).replace(/[。．.\s]+$/, '');
  }

  function start(title, i) {
    var t = title_(title);
    if (!t) return pick('startBare', i);
    return fill(pick('start', i), { t: t });
  }

  function startAt(n, title, i) {
    var t = title_(title);
    var v = { n: num(n), t: t };
    if (!t) return fill(pick('startAtBare', i), v);
    return fill(pick('startAt', i), v);
  }

  function resume(n, i) {
    return fill(pick('resume', i), { n: num(n) });
  }

  function pause(i) { return pick('pause', i); }
  function halt(i) { return pick('stop', i); }

  /* ── Markdown ─────────────────────────────────────────────────────
   * 只認小智真的會用到的那幾種：標題、粗體、條列、編號、表格、引用、行內碼。
   * 不做完整的 Markdown——做完整的話要處理巢狀、參考式連結、HTML 混排，
   * 那是一整個函式庫，而且錯了會把整段答案弄亂。
   * ------------------------------------------------------------------- */

  function isTableLine(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isDivider(l) { return /^\s*\|[\s:|-]*\|\s*$/.test(l) && l.indexOf('-') >= 0; }

  function cells(l) {
    var t = String(l).replace(/^\s*\|/, '').replace(/\|\s*$/, '');
    var out = t.split('|'), i;
    for (i = 0; i < out.length; i++) out[i] = out[i].replace(/^\s+|\s+$/g, '');
    return out;
  }

  /* 把整段切成一塊一塊：段落、標題、條列、編號、表格、引用 */
  function blocks(md) {
    var lines = String(md == null ? '' : md).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (!l.replace(/\s/g, '')) { i++; continue; }

      if (isTableLine(l) && i + 1 < lines.length && isDivider(lines[i + 1])) {
        var head = cells(l), rows = [];
        i += 2;
        while (i < lines.length && isTableLine(lines[i])) { rows.push(cells(lines[i])); i++; }
        out.push({ k: 'table', head: head, rows: rows });
        continue;
      }
      var m = l.match(/^\s*(#{1,6})\s*(.+)$/);
      if (m) { out.push({ k: 'h', n: m[1].length, t: m[2] }); i++; continue; }
      if (/^\s*>/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push({ k: 'quote', t: q.join('\n') });
        continue;
      }
      if (/^\s*([-*・]|\d+[.、)])\s+/.test(l)) {
        var items = [], ord = /^\s*\d+[.、)]/.test(l);
        while (i < lines.length && /^\s*([-*・]|\d+[.、)])\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*・]|\d+[.、)])\s+/, '')); i++;
        }
        out.push({ k: 'list', ord: ord, items: items });
        continue;
      }
      var p = [];
      while (i < lines.length && lines[i].replace(/\s/g, '') &&
             !isTableLine(lines[i]) && !/^\s*(#{1,6}\s|>|[-*・]\s|\d+[.、)]\s)/.test(lines[i])) {
        p.push(lines[i]); i++;
      }
      /* 一行都沒收進來的話，i 就不會動——那是一個無窮迴圈，而且會把
         陣列撐爆。會走到這裡的是「長得像表格、可是下一行不是分隔線」
         那種行（例如只有一行的 `| 這不是表格 |`）。
         這種行就當成普通一段，硬收一行再往下走。 */
      if (!p.length) { p.push(lines[i]); i++; }
      out.push({ k: 'p', t: p.join('\n') });
    }
    return out;
  }

  /* 行內：粗體、行內碼。斜體不做——`*` 跟條列的記號同一個，
     分不乾淨的時候寧可原樣留著，也不要把句子拆壞。 */
  function inlineHTML(t) {
    return esc(t)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }
  function inlineText(t) {
    return String(t == null ? '' : t)
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^\s+|\s+$/g, '');
  }

  /* ── 給眼睛看的 ──────────────────────────────────────────────────── */

  function html(md) {
    var bs = blocks(md), out = [], i, b, j, c = cfg().cls;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'h') {
        out.push('<p class="' + c + 'h' + (b.n <= 2 ? '' : ' sm') + '">' + inlineHTML(b.t) + '</p>');
      } else if (b.k === 'quote') {
        out.push('<blockquote class="' + c + 'q">' + inlineHTML(b.t) + '</blockquote>');
      } else if (b.k === 'list') {
        var tag = b.ord ? 'ol' : 'ul';
        var li = '';
        for (j = 0; j < b.items.length; j++) li += '<li>' + inlineHTML(b.items[j]) + '</li>';
        out.push('<' + tag + ' class="' + c + 'l">' + li + '</' + tag + '>');
      } else if (b.k === 'table') {
        var h = '<div class="' + c + 'tw"><table class="' + c + 't"><thead><tr>';
        for (j = 0; j < b.head.length; j++) h += '<th>' + inlineHTML(b.head[j]) + '</th>';
        h += '</tr></thead><tbody>';
        for (j = 0; j < b.rows.length; j++) {
          h += '<tr>';
          for (var k = 0; k < b.head.length; k++) {
            h += '<td>' + inlineHTML(b.rows[j][k] || '') + '</td>';
          }
          h += '</tr>';
        }
        out.push(h + '</tbody></table></div>');
      } else {
        out.push('<p>' + inlineHTML(b.t) + '</p>');
      }
    }
    return out.join('');
  }

  /* ── 給耳朵聽的 ──────────────────────────────────────────────────── */

  /* 一張表讀成一段話。
     第一欄當成那一列在講什麼，其餘各欄是它的內容。
     兩欄表最單純：「甲，是乙。」 */
  function w() { return (cfg().words) || W; }

  function tableSpeech(b, i) {
    var head = b.head || [], rows = b.rows || [], out = [], j, k, ww = w();
    out.push(pick('table', i));
    /* 兩欄表不必報欄數——「這張表有二欄」是廢話，而且拖慢節奏。
       三欄以上才值得先說一聲，不然聽的人跟不上後面的對照。 */
    if (head.length >= 3) {
      out.push(fill(ww.cols, { n: num(head.length), list: head.join(ww.listSep) }));
    }
    for (j = 0; j < rows.length; j++) {
      var r = rows[j], label = inlineText(r[0] || '');
      var link = j === 0 ? ww.rowFirst[(i + j) % ww.rowFirst.length]
               : (j === rows.length - 1 && rows.length > 2 ? ww.rowLast[0]
                  : ww.rowMid[(i + j) % ww.rowMid.length]);
      if (head.length === 2) {
        out.push(fill(ww.row2, { link: link, label: label, value: inlineText(r[1] || '') }));
      } else {
        var parts = [];
        for (k = 1; k < head.length; k++) {
          var v = inlineText(r[k] || '');
          if (v) parts.push(fill(ww.pair, { col: inlineText(head[k]), value: v }));
        }
        out.push(fill(ww.rowN, { link: link, label: label, parts: parts.join(ww.pairSep) }));
      }
    }
    return out.join('');
  }

  function listSpeech(b, i) {
    var out = [], j;
    if (b.items.length > 2) out.push(pick('list', i));
    for (j = 0; j < b.items.length; j++) {
      var t = inlineText(b.items[j]);
      if (!t) continue;
      /* 前兩點說「第一」「第二」，後面換成連接詞——
         十點全部報數，聽的人會累。 */
      var ww = w();
      var head = j < 2 ? fill(ww.itemFirst, { n: num(j + 1) })
               : (j === b.items.length - 1 ? ww.itemLast
                  : fill(pick('item', i + j), { n: num(j + 1) }));
      out.push(head + t + (/[。！？.!?]$/.test(t) ? '' : ww.end));
    }
    return out.join('');
  }

  /* 整段 Markdown → 適合唸出來的純文字。
     opt.drop：一個 fn(text)->text，唸之前還要拿掉的東西
     （例如括號裡的經文出處：REF321.dropParenRefs）。 */
  function speech(md, opt) {
    opt = opt || {};
    var bs = blocks(md), out = [], i, b, t;
    var base = opt.i || 0;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'table') { out.push(tableSpeech(b, base + i)); continue; }
      if (b.k === 'list') { out.push(listSpeech(b, base + i)); continue; }
      if (b.k === 'h') {
        t = inlineText(b.t);
        /* 「一、神的呼召」這種本身帶序號的標題，序號交給模板去說 */
        var m = t.match(/^([一二三四五六七八九十\d]+)[、．.]\s*(.+)$/);
        out.push(m ? section(m[2], m[1], base + i) : section(t, null, base + i));
        continue;
      }
      if (b.k === 'quote') {
        out.push(pick('quote', base + i) + inlineText(b.t));
        continue;
      }
      t = inlineText(b.t);
      /* 已經有句末標點的不補。冒號、分號、頓號也算——
         「三個立場：」後面接一張表，補成「三個立場：。」很難聽。 */
      if (t) out.push(t + (/[。！？；：、，,.:;!?」』）)]$/.test(t) ? '' : '。'));
    }
    var s = out.join('\n');
    if (opt.drop) { try { s = opt.drop(s); } catch (e) {} }
    return s;
  }

  /* ── 掛上 ─────────────────────────────────────────────────────────── */

  function init(c) {
    C = ext(ext({}, DEF), c || {});
    /* words 給了就跟預設合併——英文版只想換幾個零件時不必整組重寫 */
    C.words = ext(ext({}, W), (c && c.words) || {});
    if (c && c.templates) {
      for (var k in c.templates) {
        if (c.templates.hasOwnProperty(k)) T[k] = c.templates[k];
      }
    }
    return API;
  }

  var API = {

輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷戰，怎麼先伸出手？", "怎麼把心裡的話好好說給另一半聽？", "對方做錯事傷了我，我真的要饒恕嗎？", "我們為金錢與家務的事常常意見不同，怎麼辦？", "夫妻怎麼一起禱告、一起親近神？", "忙碌的日子裡，夫妻感情變淡了，怎麼重新連結？", "請幫我寫一段為我們婚姻祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明夫妻怎麼把它用在好好說、好好聽，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🤝", "饒恕", "請針對你剛才的回答，說明夫妻怎麼把它用在彼此認錯與饒恕，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["💞", "親密", "請針對你剛才的回答，說明夫妻怎麼把它用在重新連結感情、表達愛與感謝，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["👨‍👩‍👧", "同心", "請針對你剛才的回答，說明夫妻怎麼把它用在金錢、家務與教養上同心，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["📖", "同讀", "請針對你剛才的回答，說明夫妻怎麼一起讀經、一起親近神，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段夫妻可以一起禱告的短禱告。"]]}, "pastor": {"sys": " 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。", "write": "\n讀者是牧者與傳道同工：口吻尊重、平等、真誠，像同工彼此扶持；不要用表情符號。", "style": "風格：給牧者與傳道同工，題目貼近牧養、講道預備、帶領團隊、面對疲累與屬靈爭戰；口氣尊重真誠，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話先餵養了牧者，也必流向羊群。"], "q": ["這段經文對事奉中的我有什麼提醒？", "請幫我找這段經文的講道架構與切入點。", "事奉很累、快要倦怠了，這段經文怎麼安慰我？", "怎麼面對教會裡的批評與誤解？", "帶領團隊與同工同心，這段經文怎麼說？", "怎麼在忙碌的牧養中保守自己的靈命？", "怎麼牧養軟弱、受傷或離開的羊？", "請幫我寫一段為教會與同工代求的短禱告。"], "fu": [["📖", "講道", "請針對你剛才的回答，提供一個可用於講道或查經的架構（三個要點與一個應用），並提醒我自己先在神面前領受。"], ["🐑", "牧養", "請針對你剛才的回答，說明怎麼把它用在牧養羊群與關心個別的人，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "團隊", "請針對你剛才的回答，說明怎麼把它用在帶領團隊、同工同心與處理衝突，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "安息", "請針對你剛才的回答，說明怎麼把它用在自己的疲累與靈命保守，並給我一個這個星期做得到的具體小步驟。"], ["⚔️", "爭戰", "請針對你剛才的回答，說明怎麼把它用在面對批評、孤單與屬靈爭戰，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "代禱", "請把你剛才說的重點，寫成一段我可以為教會與同工代求的短禱告。"]]}}};

  async function aiRaw(sys, ask, ms, maxT) {

    for (let a = 0; a <= waits.length; a++) {

      try {
        const r = await fetch(SVC.xz, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: SVC.model, max_tokens: maxT || 1600, system: sys, messages: [{ role: 'user', content: ask }] }),
          signal: ac ? ac.signal : undefined
        });
        if (!r.ok) throw new Error('http ' + r.status);
        const d = await r.json().catch(() => null);
        if (d && d.content && d.content.length) out = d.content.map(b => b.text || '').join('');
        else if (d) out = d.reply || d.text || d.message || '';
        if (!out) why = T('回覆是空的', 'empty reply');
        clearTimeout(tm);

      } catch (e) {
        clearTimeout(tm);
        why = (e && e.name === 'AbortError') ? T('逾時', 'timeout') : ((e && e.message) ? String(e.message) : 'network');
        if (a === waits.length) break;
        await new Promise(rs => setTimeout(rs, waits[a]));
      }
    }
    return { out: String(out || '').trim(), why };
  }

${st}請用繁體中文。只回傳 JSON，不要任何說明、不要 markdown 圍欄：{"r":[{"t":"人物","h":["提示1","提示2","提示3"],"a":"答案","alt":["別名"],"v":"3","e":"亮點"}]}`;

  function plParse(text) {
    let s = String(text || '').replace(/```(?:json)?/gi, '').trim();
    const st = s.indexOf('{'); if (st < 0) return null;
    s = s.slice(st);
    try { return JSON.parse(s.slice(0, s.lastIndexOf('}') + 1)); } catch (e) {}
    const m = s.match(/"(q|r)"\s*:\s*\[/); if (!m) return null;
    let i = m.index + m[0].length; const items = [];
    while (i < s.length) {
      while (i < s.length && s[i] !== '{') i++;
      if (i >= s.length) break;
      let depth = 0, inStr = false, es = false, j = i;
      for (; j < s.length; j++) {
        const c = s[j];
        if (inStr) { if (es) es = false; else if (c === '\\') es = true; else if (c === '"') inStr = false; }
        else if (c === '"') inStr = true;

      try { items.push(JSON.parse(s.slice(i, j + 1))); } catch (e) {}

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  function vOf(v) {

  function normQuiz(list, src, k) {

      const as = String(x.a).trim();
      const ai = /^[A-Da-d]$/.test(as) ? 'abcd'.indexOf(as.toLowerCase()) : (as === '' ? NaN : +x.a);

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;
  const top=mx_boxes(b,0,b.length);
  const ftyp=mx_one(top,"ftyp");
  const moov=mx_one(top,"moov");
  if(!moov)throw new Error("no moov");
  const moofs=mx_find(top,"moof");
  if(!moofs.length)return null;              /* 不是分段 MP4，不用處理 */

  const mvBoxes=mx_children(b,moov);
  const mvhd=mx_one(mvBoxes,"mvhd");
  const mvTimescale=mx_u32(b,mvhd.body+(b[mvhd.body]===1?20:12));
  const traks=mx_find(mvBoxes,"trak");

  /* 收集每個 track 的所有 sample */
  const tracks={};
  traks.forEach(tk=>{
    const tkhd=mx_one(mx_children(b,tk),"tkhd");
    const v=b[tkhd.body];
    const id=mx_u32(b,tkhd.body+(v===1?20:12));
    tracks[id]={trak:tk,samples:[]};
  });

  moofs.forEach(mf=>{
    const trafs=mx_find(mx_children(b,mf),"traf");
    trafs.forEach(tf=>{
      const tfc=mx_children(b,tf);
      const tfhdBox=mx_one(tfc,"tfhd");
      if(!tfhdBox)return;
      const tfhd=mx_parseTfhd(b,tfhdBox);
      const t=tracks[tfhd.trackId];
      if(!t)return;
      /* 基準位移：預設是 moof 起點（default-base-is-moof） */
      const base=tfhd.hasBase?tfhd.base:mf.start;
      let running=null;
      mx_find(tfc,"trun").forEach(tr=>{
        const flags=mx_u32(b,tr.body)&0xffffff;
        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};
  let cur=0;
  order.forEach(o=>{
    if(!newOff[o.id])newOff[o.id]=[];
    newOff[o.id][o.i]=cur;cur+=o.size;
  });

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){
    const ss=tracks[id].samples;
    const offs=newOff[id]||[];
    const old=mx_children(b,stblOld);
    const keep=[];
    ["stsd"].forEach(t=>{const x=mx_one(old,t);if(x)keep.push(b.slice(x.start,x.end));});

    /* stts */
    const stts=[];
    let runDur=-1,runCnt=0;
    ss.forEach(s=>{
      if(s.dur===runDur){runCnt++;}
      else{if(runCnt)stts.push([runCnt,runDur]);runDur=s.dur;runCnt=1;}
    });
    if(runCnt)stts.push([runCnt,runDur]);
    const sttsBody=[mx_b32(0),mx_b32(stts.length)];
    stts.forEach(e=>{sttsBody.push(mx_b32(e[0]));sttsBody.push(mx_b32(e[1]));});
    keep.push(mx_box("stts",mx_cat(sttsBody)));

  const PUN = /[\s，。、；：？！「」『』（）《》〈〉“”‘’—…·,.;:?!"'()\[\]\-–]/g;
  function normV(x) {

    const head = q.slice(0, 30), tail = q.slice(-30);
    const order = [];
    const N = GX.NCH();
    if (hint >= 1 && hint <= N) order.push(hint);
    for (let c = 1; c <= N; c++) if (c !== hint) order.push(c);
    for (const c of order) {
      const vs = D.txt[c] || [];

      const i = joined.indexOf(head);
      if (i < 0) continue;
      let j = joined.indexOf(tail, i);
      if (j < 0) j = i + head.length - 1; else j = j + tail.length - 1;
      let a = 0, b = 0;
      for (let k = 0; k < starts.length; k++) { if (starts[k] <= i) a = k; if (starts[k] <= j) b = k; }

<script>/* ===== 321帖撒羅尼迦前書講義 ===== */
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH = D.ch, BLK = D.blk;
/* 每一節 → 所屬的解經段落 */
const VMAP = {};
Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;
  b.ref = c + ':' + (b.a === b.z ? b.a : b.a + '–' + b.z);
  for (let v = b.a; v <= b.z; v++) VMAP[c + ':' + v] = b;
}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>　${esc(t[v - 1] || '')}</p>`; return h; };
const KEY = 'r321.v1';
const DAY = 864e5, GAPS = [0, 1, 3, 7, 16, 35, 75];

let S = load();
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (o && o.v === 1){ o.lnote = o.lnote || {}; return o; }   // 舊存檔補上新欄位
  } catch(e){}
  return { v:1, last:1, steps:{}, notes:{}, lnote:{}, prac:{}, mem:{},
           set:{ fs:1, grk:1, dark:0, sc:0, role:'' }, seen:{} };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ═══ 繁 → 簡：對照表由 scripts/make_scmap.py 從本檔自動推導並驗證過 ═══
   逐字表 m ＝ [繁體字串, 簡體字串]；詞組表 p 用來處理一對多的字（計畫→计划、甚好→甚好）。
   演算法：由左到右掃一次，先試最長的詞組，沒中才套逐字表——詞組是覆蓋，不是先替換。
   這與 Python 端完全相同，兩邊的結果逐字比對過。 */
const SCMAP = (() => { try { return JSON.parse(document.getElementById('SCMAP').textContent); } catch(e){ return null; } })();
const SC_M = new Map(), SC_P = new Map(), SC_HEAD = new Set();
let SC_LENS = [];
if (SCMAP) {
  const [tc, sc] = SCMAP.m;
  for (let i = 0; i < tc.length; i++) SC_M.set(tc[i], sc[i]);
  const L = new Set();
  for (const pr of (SCMAP.p || [])) { SC_P.set(pr[0], pr[1]); L.add(pr[0].length); SC_HEAD.add(pr[0][0]); }
  SC_LENS = [...L].sort((a, b) => b - a);
}
function toSC(s){
  if (!s || !SCMAP) return s;
  let out = '', i = 0;
  const n = s.length;
  while (i < n) {
    const c = s[i];
    if (SC_HEAD.has(c)) {
      let hit = false;
      for (const L of SC_LENS) {
        const r = SC_P.get(s.substr(i, L));
        if (r !== undefined) { out += r; i += L; hit = true; break; }
      }
      if (hit) continue;
    }
    const m = SC_M.get(c);
    out += (m === undefined ? c : m);
    i++;
  }
  return out;
}
const SC_SKIP = { SCRIPT:1, STYLE:1, TEXTAREA:1 };
function scWalk(n){
  if (!n) return;
  if (n.nodeType === 3) { const t = n.nodeValue, v = toSC(t); if (v !== t) n.nodeValue = v; return; }
  if (n.nodeType !== 1 || SC_SKIP[n.tagName]) return;
  for (const a of ['placeholder', 'title', 'alt']) {
    if (n.hasAttribute && n.hasAttribute(a)) { const t = n.getAttribute(a), v = toSC(t); if (v !== t) n.setAttribute(a, v); }
  }
  for (let c = n.firstChild; c; c = c.nextSibling) scWalk(c);
}
function scApply(){ if (S.set.sc) scWalk(document.body); }
/* 之後每一次重繪都會被這個觀察器接住；toSC 是冪等的，重複轉換不會出事 */
try {
  new MutationObserver(ms => {
    if (!S.set.sc) return;
    for (const m of ms) {
      if (m.type === 'characterData') scWalk(m.target);
      else m.addedNodes.forEach(scWalk);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
} catch(e){}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1700); }
const meta = n => CH[n - 1];

/* ===== 進度 ===== */
const STEPS = [
  ['資訊','讀完本章卡片'], ['啟示','讀經文，寫下你看見的一件事'], ['信服','記住本章金句'],
  ['實踐','選一項本週操練'], ['檢討','第七天回填：做了嗎'], ['修正','回到哪一節重讀'],
  ['反覆','複習通過三次'], ['繁殖','講給一位課外的人聽'],
];
const stepsOf = n => S.steps[n] || [];
function toggleStep(n, i){
  const a = stepsOf(n), k = a.indexOf(i);
  if (k >= 0) a.splice(k, 1); else a.push(i);
  S.steps[n] = a; save(); render();
}
const doneCh = () => CH.filter(c => stepsOf(c.n).length === 8).length;
const startedCh = () => CH.filter(c => stepsOf(c.n).length > 0).length;

/* ===== 複習 ===== */
function memAdd(n){ if (S.mem[n]) return false; S.mem[n] = { box:0, due:Date.now(), hit:0 }; save(); return true; }
function memGrade(n, ok){
  const r = S.mem[n]; if (!r) return;
  r.box = ok ? Math.min(GAPS.length - 1, r.box + 1) : 0;
  r.hit = (r.hit || 0) + (ok ? 1 : 0);
  r.due = Date.now() + (ok ? GAPS[r.box] : 0.4) * DAY;
  save();
}
const due = () => Object.keys(S.mem).filter(n => S.mem[n].due <= Date.now()).map(Number);
function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return ch.map((c, i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}

/* ===== 朗讀 ===== */
let VOICE = null;
function say(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g, ''));
  u.lang = 'zh-TW'; u.rate = 0.94;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const plain = el => (el || $('#view')).innerText.slice(0, 3000);

/* ===== 路由 ===== */
let R = { tab:'today', ch:0, sub:'' };
function go(tab, ch, sub){ R = { tab, ch: ch || 0, sub: sub || '' }; if (ch) { S.last = ch; save(); } render(); window.scrollTo(0, 0); }
document.addEventListener('click', e => {
  const b = e.target.closest('nav.tabs button'); if (!b) return;
  go(b.dataset.t);
});
$('#back').onclick = () => { if (R.ch) go(R.tab === 'text' ? 'text' : 'course'); else go('today'); };
/* 頁首的 🔊：在講義那一頁，直接讀講義本文（不念卷名、提詞機與目錄） */
$('#spk').onclick = () => {
  if (SPK.on) return stopSpeak();
  if (R.tab === 'course' && R.ch && R.sub === 'lesson' && (D.lesson || {})[R.ch]) return lesSpeak(R.ch);
  speak(plain(), $('#ttl').textContent);
};
$('#spk').onlongpress = null;
(function(){ let t; const b = $('#spk');
  const st = () => { t = setTimeout(() => { voiceSheet(); t = null; }, 550); };
  const cl = () => { if (t){ clearTimeout(t); t = null; } };
  b.style.webkitTouchCallout = 'none'; b.style.webkitUserSelect = 'none'; b.style.userSelect = 'none';
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('touchstart', st, { passive:true });
  b.addEventListener('touchend', cl); b.addEventListener('touchmove', cl);
  b.addEventListener('mousedown', st); b.addEventListener('mouseup', cl);
})();
$('#fsz').onclick = () => { S.set.fs = (S.set.fs + 1) % 5; save(); applyFS(); toast('字級 ' + (S.set.fs + 1) + ' / 5'); };
function applyFS(){ document.documentElement.style.setProperty('--fs', [15, 17, 19, 22, 25][S.set.fs] + 'px'); }

/* 繁 ↔ 简：頁首一鍵切換。按鈕上寫的是「要切過去的那一邊」。 */
function applyLang(){
  document.documentElement.setAttribute('lang', S.set.sc ? 'zh-Hans' : 'zh-Hant');
  for (const id of ['#lang', '#fLang']) {
    const b = $(id);

  }
}
function toggleSC(){
  S.set.sc = S.set.sc ? 0 : 1; save();
  // 轉簡是單向的：切回繁體要重讀一次，否則靜態外殼的字回不來
  if (!S.set.sc) { location.reload(); return; }
  render();
  try { if (typeof F !== 'undefined' && F) fDraw(); } catch(e){}   // 全螢幕模式也要跟著換
  scApply(); applyLang();
  toast(S.set.sc ? '已切換為简体中文' : '已切換為繁體中文');
}
if ($('#lang')) $('#lang').onclick = toggleSC;

/* ===== 地形圖 ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = 5;
  const x = c => pad + (c - 0.5) / LAST * (W - pad * 2);   // 每章兩到三點：c 是章內位置（章中心＝整數）
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(0.5)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(LAST + 0.5)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // ── 標籤排版：以方框做二維避讓，放不下就往外推 ──
  const lab = P.filter(p => p[4]);
  const fs = lab.length > 10 ? 6.6 : (lab.length > 6 ? 7.4 : 8.5);
  const boxes = [], out = [];
  const hit = (a, b) => !(a.x1 < b.x0 - 1 || a.x0 > b.x1 + 1 || a.y1 < b.y0 - 1 || a.y0 > b.y1 + 1);
  // 圓點與「目前所在」的圈也是障礙物，標籤不壓在線上
  const obst = [];
  P.forEach(p => { const cx = x(p[0]), cy = y(p[1]), r = (p[4] ? 3.2 : 2.2) + 1.5;
    obst.push({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }); });
  if (cur) { const cx = x(cur), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }
  obst.forEach(o => boxes.push(o));
  lab.slice().sort((a, b) => a[0] - b[0]).forEach(p => {
    const txt = String(p[3] || '');
    let w = 0;
    for (const ch of txt) w += /[一-鿿　-〿＀-￯]/.test(ch) ? fs : fs * 0.55;
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));
    const base = y(p[1]);
    const up = [-7, -16, -25, -34, -43], dn = [11, 20, 29, 38, 47];
    const cand = (p[4] === 'bot' ? dn.concat(up) : up.concat(dn));
    let yy = base + cand[0];
    for (const off of cand) {
      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="帖撒羅尼迦前書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">歸 · 養 · 穩 · 聖 · 醒</p></div>`;
}

/* ===== 今日 ===== */
function vToday(){

  h += `<div class="foot">全書五章 89 節經文、${Object.keys(BLK).reduce((a,c)=>a+BLK[c].length,0)} 段逐節解經、5 篇講章逐字稿，全部收錄。<br>
    內容出自《321帖撒羅尼迦前書解經與講章》。經文引用《和合本》。</div>`;
  return h;
}
const practiceItems = n => [meta(n).prac.main].concat(meta(n).prac.items);

/* ===== 經文 ===== */
function vText(){
  setTitle('經文', false);
  if (!R.ch){
    let h = `<div class="sect"><p class="eyebrow">帖撒羅尼迦前書</p><h2 class="big">從第一章讀到第五章。</h2>
      <p class="sm muted">點任何一節，該節的解經就會打開。</p>
      <div class="row" style="margin:14px 0">`;
    for (let i = 1; i <= 5; i++){
      const n = (D.txt[i] || []).length;
      h += `<button class="pill on" onclick="go('text',${i})">${i}　${n}節</button>`;
    }
    h += `</div><p class="xs muted">全書五章 89 節，逐節解經 ${Object.keys(BLK).reduce((a,c)=>a+BLK[c].length,0)} 段，全部收錄。</p></div>`;
    return h;
  }
  const n = R.ch, m = meta(n);
  setTitle('帖撒羅尼迦前書 ' + n, false);

      <span class="vn" ${b ? `onclick="openV('${ref}')"` : ''}>${vn}</span>
      <span class="vt">${vb}${note}${tag}</span></div>` + notes;
  });
  h += '</div>';
  h += `<div class="hr"></div><button class="btn" onclick="go('course',${n})">看第 ${n} 章講義 ›</button>`;
  return h;
}

/* ===== 節解經（六層）===== */
let OPENL = { 1:1, 2:0, 3:1, 4:0, 5:0, 6:1 };
function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">
      <span class="n">${['','①','②','③','④','⑤','⑥'][i]}</span><span>${name}</span>
      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>帖撒羅尼迦前書 ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ 重點段落　' : ''}第 ${v.ch} 章</p>
    ${L(1, '和合本', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, '原文', v.grk, 'grk') : ''}
    ${v.lit ? L(3, '直譯', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, '關鍵字', v.key) : ''}
    ${v.gram ? L(5, '文法解析', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, '經文解釋', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ 上一段</button>` : ''}
    ${next ? `<button class="btn" onclick="openV('${v.ch}:${next.a}')">下一段 ›</button>` : ''}
    <button class="btn" onclick="sayV('${ref}')">🔊 朗讀</button>
    <button class="btn" onclick="askXz(blkPlain('${ref}'))">✨ 問小智</button>
    <button class="btn" onclick="go('course',${v.ch})">整章講義</button></div>`;
  sheet(h);
}
function blkPlain(ref){ const v = VMAP[ref]; if (!v) return '';
  const t = D.txt[v.ch] || []; let c = '';
  for (let i = v.a; i <= v.z; i++) c += (t[i - 1] || '') + ' ';
  return c + '\n' + (v.lit || '').replace(/<[^>]+>/g, ' ') + '\n' + (v.exp || '').replace(/<[^>]+>/g, ' '); }
function sayV(ref){ const v = VMAP[ref]; if (!v) return;
  speak(blkPlain(ref), '羅 ' + v.ch + ':' + v.a); }
function sayMV(n){ const m = meta(n); speak(m.mv.t + '。' + m.mv.r, '本章金句'); }
function tglL(i, ref){ OPENL[i] = OPENL[i] ? 0 : 1; openV(ref); }

/* ── 講義朗讀：跳過卷名、提詞機與目錄，直接從本文開始 ──
   節標題、想更深、三個化的段落，都用口語的方式帶進去，
   聽起來像一位老師在講，不像螢幕在念版面。 */
const DEEP_LEAD = [
  '我們在這裡想更深一點。有人會問，',
  '這裡容我多說一句。可能有人心裡正在問，',
  '我知道有人讀到這裡會停下來問，',
  '讓我們把這一段再往裡走一步。有人問，',
];
const DEEP_ANS = ['我的回答是這樣。', '我是這樣看的。', '我們可以這樣想。', '這一題我會這樣回答。'];
/* 把純文字切成句子（與畫面上的 .mks 完全同一套規則，這樣才對得起來）*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* 朗讀單位：一句一個，並且記著它在畫面上是哪一塊的第幾句
   { t:要念的字, i:區塊序號, part:'t'|'a', j:句序（-1 表示整塊） }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* 一整塊：第一句套用口語的帶入詞，其餘照念，句序與畫面對得起來 */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 一、xxx → 第一段，xxx。
        const p = String(t).split('、');
        push(p.length > 1 ? `第${p[0]}段，${p.slice(1).join('、')}。` : String(t) + '。', i, 't', -1);
        break;
      }
      case 'd':                                     // 想更深：一問一答
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // 三個化的段標（括號裡的分鐘數不念）
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^收尾/.test(s) ? '我們來收尾。' : `接下來是${s}。`, i, 't', 0);
        break;
      }
      case 't': {                                   // 【看】【聽】【想】【講】【行】
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? `這一步是「${m[1]}」，${m[2]}。` : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // 帶領說明／提醒：本身已自帶稱謂
        if (/優先順序標示/.test(t)) break;           // 星號是印在紙上的記號，念出來沒有意義
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ 題目 → 第一題。題目
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /【必做】/.test(String(t));
        block(t, i, 't', `第${cnNum(qi)}題。${must ? '這一題必做。' : ''}`, /^\d+\.\s*(★+)?\s*(【必做】)?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* 把單位併成「一次抓一段語音」的段落：同一塊之內合併到 60 字以上再切，
   太碎會一直等網路，太大又會遲遲不開口。每一段記著它涵蓋畫面上的哪幾句。 */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `第${cnNum(n)}課　${String(L.title).split('——')[0]}` : '講義';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  playSegs(segs, lesTitle(n), n);
}
/* 預先下載：把整課的語音抓進 IndexedDB，之後離線也能聽 */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  if (!S.set.human) return toast('目前用的是裝置語音，不需要下載');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ 下載中 ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ 預先下載' : '✓ 已下載';
  toast(fail ? `有 ${fail} 段沒下載到，請再試一次` : '整課語音已存進這台裝置，可以離線聽了');
}
/* 進到講義頁時，看看這一課是不是已經下載過了 */
function lesDlCheck(n){
  const b = $('#lesDl' + n);
  if (!b || !S.set.human) return;
  const segs = lesSegs(n); if (!segs.length) return;
  const keys = segs.map(s => voiceName() + '|' + rateAttr() + '|' + s.t);
  ttsCount(keys, got => {
    const el = $('#lesDl' + n); if (!el) return;
    el.textContent = got >= keys.length ? '✓ 已下載'
      : got ? `⤓ 預先下載（已有 ${got}/${keys.length}）` : '⤓ 預先下載';
  });
}

const TTS_DB = 'r321_tts';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
/* 這些段落已經下載了幾段？（一次交易查完，不逐段開連線）*/
function ttsCount(keys, cb){
  if (!keys.length) return cb(0);
  ttsDB(db => { if (!db) return cb(0);
    try {
      const st = db.transaction('a').objectStore('a');
      let n = 0, done = 0;
      keys.forEach(k => {
        const q = st.getKey ? st.getKey(k) : st.count(k);
        q.onsuccess = () => { if (q.result !== undefined && q.result !== 0) n++; if (++done === keys.length) cb(n); };
        q.onerror   = () => { if (++done === keys.length) cb(n); };
      });
    } catch(e){ cb(0); } });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}

const voiceName = () => (TTS_VOICES[S.set.voice] || TTS_VOICES.yunfan).name;
const rateAttr  = () => (S.set.rate >= 0 ? '+' : '') + (S.set.rate * 5) + '%';

/* 原文（希伯來文／希臘文）中文語音念不出來。
   後面若跟著括號裡的拼音，就只念那個拼音；沒有拼音就整段略過——只念一遍，不重複。 */
const ORIG_CH  = '\\u0590-\\u05FF\\u0370-\\u03FF\\u1F00-\\u1FFF';
const ORIG_RUN = '[' + ORIG_CH + '][' + ORIG_CH + "\\s'\u2019\\-\u05be\u05f3\u05f4\u00b7]*";
const RE_ORIG_ROMAN = new RegExp(ORIG_RUN + "\\s*[（(]\\s*([A-Za-z][A-Za-z'\u2019\u0101\u0113\u012b\u014d\u016b\\- ]*)\\s*[）)]", 'g');
const RE_ORIG_RUN   = new RegExp(ORIG_RUN, 'g');

/* 讀音修正：只改送去語音的字，畫面上的字完全不動。
   「地」在天地、地球、地是……應讀 ㄉㄧˋ，語音引擎常誤讀成輕聲的 ㄉㄜ˙；
   換成同音的「帝」就讀得對（聽起來一模一樣）。要再加字就往這張表加。 */
const TTS_SAY = [
  [/天地/g, '天帝'],
  [/地球/g, '帝球'],
  [/地是/g, '帝是'],
];

/* 朗讀前的文字整理 */
function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '和').replace(/&lt;|&gt;/g, ' ');
  // 原文只念一遍：有拼音就只念拼音，沒有拼音就整段略過
  t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
  // 略過原文之後，把「……原文是。」這種懸在半空的接續詞一起收乾淨
  t = t.replace(/[（(]\s*\u0000\s*[）)]/g, '\u0000');
  t = t.replace(/[是叫作為的]?\s*\u0000\s*(?=[，。；、！？])/g, '');
  t = t.replace(/\s*\u0000\s*/g, ' ');
  t = t.replace(/[（(]\s*[）)]/g, ' ');
  t = t.replace(/\*\*/g, '').replace(/[《》「」『』【】]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|·/g, ' ');
  // 經節寫法口語化：8:28 → 八章二十八節
  t = t.replace(/(\d{1,3}):(\d{1,3})(?:[–-](\d{1,3}))?/g, (m, a, b, c) =>
    cnNum(a) + '章' + cnNum(b) + (c ? '到' + cnNum(c) : '') + '節');
  t = t.replace(/321/g, '三二一').replace(/920/g, '九二零').replace(/235/g, '二三五');
  t = t.replace(/[：]/g, '，');
  TTS_SAY.forEach(r => { t = t.replace(r[0], r[1]); });
  t = t.replace(/\s+([，。！？；、])/g, '$1');
  return t.replace(/\s{2,}/g, ' ').trim();
}
function cnNum(n){
  n = parseInt(n, 10); const d = '零一二三四五六七八九';
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  return String(n);
}
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (const ch of t){ buf += ch; if ('。！？；\n'.includes(ch) && buf.length >= 110){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  const fin = [];
  out.forEach(s => { while (s.length > 300){ fin.push(s.slice(0, 300)); s = s.slice(300); } if (s) fin.push(s); });
  return fin.length ? fin : [t];
}
async function ttsFetch(piece){
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  const res = await fetch(SVC.tts, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  ttsPut(key, blob);
  return blob;
}

let AUP = null, SPK = { on:false, pause:false, tok:0, list:[], i:0, title:'', prep:0, total:0 };
/* 兩個播放器輪流用：一個在播，另一個先把下一段 load 好，接起來不會卡 */
function audioPair(){
  if (!AUP){
    AUP = [0, 1].map(() => {
      const a = new Audio(); a.preload = 'auto'; a.loop = false;
      a.setAttribute('playsinline', '');
      /* 背景播放：鎖屏／切到別的 App 時，系統的播放控制列要能操作 */
      a.addEventListener('play',  () => { mediaState('playing'); });
      a.addEventListener('pause', () => { if (!SPK.on) mediaState('paused'); });
      return a;
    });
  }
  return AUP;
}
const audioEl = () => audioPair()[0];
/* 鎖屏／耳機／車機的播放控制 */
function mediaState(st){
  try { if (navigator.mediaSession) navigator.mediaSession.playbackState = st; } catch(e){}
}
function appIcon(){
  const l = document.querySelector('link[rel="apple-touch-icon"], link[rel="icon"]');
  return (l && l.getAttribute('href')) || '';
}
function mediaSetup(title){
  if (!navigator.mediaSession || !window.MediaMetadata) return;
  try {
    const ic = appIcon();
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title || '朗讀中',
      artist: '321帖撒羅尼迦前書講義',
      album: '國度321空中團契',
      artwork: ic ? [{ src: ic, sizes:'180x180', type:'image/png' }] : [],
    });
    navigator.mediaSession.setActionHandler('play',  () => { if (SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (!SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('stop',  () => stopSpeak());
    navigator.mediaSession.setActionHandler('previoustrack', () => spkStep(-1));
    navigator.mediaSession.setActionHandler('nexttrack',     () => spkStep(1));
    navigator.mediaSession.setActionHandler('seekbackward',  () => spkStep(-1));
    navigator.mediaSession.setActionHandler('seekforward',   () => spkStep(1));
  } catch(e){}
}
/* ── 串流播放器 ───────────────────────────────────────────
   一段一段抓、一段一段播：抓到前兩段就開始播，其餘邊播邊抓。
   兩個 <audio> 輪流用（下一段先 load 好），所以段與段之間不會卡住。
   每一段都記著它對應到畫面上的哪幾句，播到那一段就把那幾句標起來、捲過去。  */
const PRE_START = 2;      // 抓到幾段就開播
const PRE_AHEAD = 8;      // 播放中隨時往前多抓幾段
const SILENT_MP3 = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA';

let PL = null;
function playSegs(segs, title, lesson){
  if (!segs.length) return;
  if (!S.set.human) return sayNative(segs.map(s => s.t).join('\n'));
  stopSpeak();
  const my = ++SPK.tok;
  SPK = { on:true, pause:false, tok:my, list:segs, i:0, title:title || '朗讀中', prep:0, total:segs.length };
  PL = { tok:my, segs, blobs:new Array(segs.length), pend:new Array(segs.length).fill(0),
         try:new Array(segs.length).fill(0),
         i:0, cur:0, lesson:lesson || 0, fail:0, running:0 };
  const els = audioPair();
  els.forEach(a => { try { a.pause(); a.removeAttribute('src'); a.load(); } catch(e){} });
  /* 使用者按下按鈕的這一刻，把兩個播放器都解鎖（iOS 只認手勢當下的 play）*/
  els.forEach(a => { try { a.src = SILENT_MP3; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch(e){} });
  setTimeout(() => els.forEach(a => { try { if (a !== els[0]) a.pause(); } catch(e){} }), 0);
  mediaSetup(SPK.title);
  drawBar();
  plPump();
  plWaitAndStart();
}
function plFetch(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (PL.blobs[k] || PL.pend[k]) return;
  PL.pend[k] = 1; PL.running++;
  ttsFetch(PL.segs[k].t).then(b => { if (PL && PL.tok === SPK.tok) PL.blobs[k] = b; },
                               () => { if (PL){ PL.fail++; PL.try[k] = (PL.try[k] || 0) + 1; } })
    .then(() => {
      if (!PL || PL.tok !== SPK.tok) return;
      PL.pend[k] = 0; PL.running--;
      SPK.prep = PL.blobs.filter(Boolean).length; drawBar(); plPump();
    });
}
/* 從正在播的那一段往前看幾段，缺的就補抓（抓壞的也會自動重試）*/
function plPump(){
  if (!PL || PL.tok !== SPK.tok) return;
  const end = Math.min(PL.segs.length, Math.max(PRE_START, PL.i + 1 + PRE_AHEAD));
  for (let k = PL.i; k < end && PL.running < 4; k++){
    if ((PL.try[k] || 0) < 3) plFetch(k);
  }
}
function plWaitAndStart(){
  const my = SPK.tok;
  const tick = () => {
    if (!PL || PL.tok !== my || !SPK.on) return;
    const ready = PL.blobs[0] && (PL.blobs[1] || PL.segs.length < 2);
    if (ready) return plPlay(0);
    if (PL.fail >= 3 && !PL.blobs[0]){
      const txt = PL.segs.map(s => s.t).join('\n');
      stopSpeak(); toast('真人語音連不上，改用裝置語音'); return sayNative(txt);
    }
    setTimeout(tick, 120);
  };
  tick();
}
function plPlay(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (k >= PL.segs.length) return stopSpeak();
  const b = PL.blobs[k];
  if (!b){
    if ((PL.try[k] || 0) >= 3){              // 這一段真的抓不到，跳過去，不要卡住整課
      PL.i = k; SPK.i = k; return plPlay(k + 1);
    }
    SPK.buffering = true; SPK.i = k; drawBar(); plPump();   // 還沒到，等一下再播（不跳過）
    return setTimeout(() => plPlay(k), 150);
  }
  SPK.buffering = false;
  PL.i = k; SPK.i = k;
  const els = audioPair(), a = els[PL.cur];
  a.src = URL.createObjectURL(b);
  a.onended = () => {
    if (!PL || PL.tok !== SPK.tok) return;
    try { URL.revokeObjectURL(a.src); } catch(e){}
    PL.cur = 1 - PL.cur;
    plPlay(k + 1);
  };
  a.onerror = () => { if (PL && PL.tok === SPK.tok){ PL.cur = 1 - PL.cur; plPlay(k + 1); } };
  const p = a.play(); if (p && p.catch) p.catch(() => {});
  spkMark(PL.segs[k]);
  drawBar();
  plPump();
  /* 下一段先 load 好，接得上 */
  const nb = PL.blobs[k + 1];
  if (nb){ const nx = els[1 - PL.cur];
    try { nx.src = URL.createObjectURL(nb); nx.load(); } catch(e){} }
}
async function speak(text, title){
  const chunks = ttsChunks(text);
  if (!chunks.length) return;
  playSegs(chunks.map(t => ({ t })), title);
}
function sayNative(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(sanitize(t));
  u.lang = 'zh-TW'; u.rate = 0.94 + S.set.rate * 0.05;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function stopSpeak(){
  SPK.tok++; SPK.on = false; SPK.pause = false; SPK.buffering = false;
  PL = null;
  try { audioPair().forEach(a => { a.pause(); a.onended = null; a.onerror = null; }); } catch(e){}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  spkClear();
  drawBar();
}
function plCurEl(){ const els = audioPair(); return els[PL ? PL.cur : 0]; }
function togglePause(){
  const a = plCurEl();
  if (SPK.pause){ const p = a.play(); if (p && p.catch) p.catch(() => {}); SPK.pause = false; }
  else { a.pause(); SPK.pause = true; }
  drawBar();
}
/* 往前／往後跳一句 */
function spkStep(d){
  if (!PL) return;
  const k = Math.max(0, Math.min(PL.segs.length - 1, PL.i + d));
  try { plCurEl().pause(); plCurEl().onended = null; } catch(e){}
  PL.i = k; SPK.pause = false;
  plPump(); plPlay(k);
}
function drawBar(){
  let el = $('#spkbar');
  if (!SPK.on){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement('div'); el.id = 'spkbar'; el.className = 'spkbar';
    document.body.appendChild(el);
  }
  const st = SPK.buffering ? `<span class="pv">緩衝中…</span>`
    : SPK.total ? `<span class="pv">${(SPK.i || 0) + 1}/${SPK.total}</span>` : '';
  const follow = PL && PL.lesson
    ? `<button class="${S.set.follow === 0 ? '' : 'on'}" title="自動捲動"
         onclick="toggleFollow()">${S.set.follow === 0 ? '⇕' : '⇳'}</button>` : '';
  el.innerHTML = `<span class="dot"></span><b>${esc(SPK.title)}</b>${st}
    <button onclick="spkStep(-1)" title="上一句">⏮</button>
    <button onclick="togglePause()">${SPK.pause ? '▶' : '⏸'}</button>
    <button onclick="spkStep(1)" title="下一句">⏭</button>${follow}
    <button onclick="stopSpeak()">✕</button>`;
}
function toggleFollow(){
  S.set.follow = S.set.follow === 0 ? 1 : 0; save(); drawBar();
  if (S.set.follow && PL) spkMark(PL.segs[PL.i]);
  toast(S.set.follow ? '朗讀時自動捲動' : '不自動捲動，畫面由你控制');
}

/* ── 標示正在讀的那一句，並且捲到它 ── */
let SPK_LAST = [];
function spkClear(){
  document.querySelectorAll('.spk-now').forEach(e => e.classList.remove('spk-now'));
  SPK_LAST = [];
}
function spkMark(seg){
  if (!seg || !PL || !PL.lesson) return;
  if (R.tab !== 'course' || R.ch !== PL.lesson || R.sub !== 'lesson') return;  // 不在這一頁就不動畫面
  spkClear();
  const n = PL.lesson;

/* 依句號切句；HTML 標籤不會被切斷，句末的引號跟著前一句走 */
const EN_SENT = false;
function splitHTML(html){
  const out = []; let cur = '', depth = 0, inTag = false, tag = '';
  for (let i = 0; i < html.length; i++){
    const ch = html[i];
    if (!inTag && ch === '<'){ inTag = true; tag = '<'; cur += ch; continue; }
    if (inTag){
      cur += ch; tag += ch;
      if (ch === '>'){
        inTag = false;
        if (/^<\//.test(tag)) depth--;
        else if (!/\/>$/.test(tag) && !/^<(br|img|hr|input|wbr)\b/i.test(tag)) depth++;
      }
      continue;
    }
    cur += ch;
    if (depth !== 0) continue;                       // 標籤內不切
    let brk = '。！？'.includes(ch);
    if (!brk && EN_SENT && '.!?'.includes(ch)){      // 英文：句點後須接空白
      const nx = html[i + 1];
      brk = (nx === undefined || nx === ' ' || nx === '\n') && !/\b[A-Z]$/.test(cur.slice(-2, -1));
    }
    if (!brk) continue;
    while (i + 1 < html.length && '」』）”"\''.includes(html[i + 1])){ i++; cur += html[i]; }
    while (i + 1 < html.length && html[i + 1] === ' '){ i++; cur += html[i]; }
    out.push(cur); cur = '';
  }
  if (cur.replace(/<[^>]*>|\s|&nbsp;/g, '').length) out.push(cur);
  else if (cur && out.length) out[out.length - 1] += cur;
  return out.length ? out : [html];
}
/* 取出某一層的所有句子（順序與畫面完全一致）*/
function sentsOf(html){
  const out = [];
  String(html || '').replace(/<p>([\s\S]*?)<\/p>/g, (m, inner) => { splitHTML(inner).forEach(t => out.push(t)); return m; });
  return out;
}
/* 把解經 HTML 的每一句變成可點的句子 */
function tagParas(html, kp){
  if (!html) return '';
  let i = -1;
  return html.replace(/<p>([\s\S]*?)<\/p>/g, (m, inner) => {
    const body = splitHTML(inner).map(t => {

  });
}

let F = null, FT = null, WAKE = null;
function fOpen(mode, n){
  F = { mode, n, i:0, run:true, left:0, tele:mode !== 'live' };
  document.documentElement.setAttribute('data-tele', F.tele ? '1' : '0');
  if (mode === 'lesson'){                       // 教學講義逐字稿
    const s = (D.lesson || {})[n];
    // 「想更深」是備而不用的問答，不上提詞機
    F.pages = s ? telePages(s.blocks.filter(b => b[0] !== 'd')) : outlinePages(n);
    F.total = (s ? s.min : 40) * 60;
    F.left = F.total;
    // 標題列只放主標題，副標題太長會擠成兩行
    $('#ftitle').textContent = '《' + (s ? s.title.split('——')[0] : meta(n).t) + '》';
  } else if (mode === 'tele'){
    const s = D.serm[n];
    F.pages = s ? telePages(s.blocks) : outlinePages(n);
    F.total = (s ? s.min : 35) * 60;
    F.left = F.total;
    $('#ftitle').textContent = '《' + meta(n).t + '》';
  } else {
    F.pages = livePages(n);
    F.total = F.pages.reduce((a, p) => a + p.sec, 0);
    F.left = F.pages[0].sec;
    $('#ftitle').textContent = '第' + n + '章 · 小組';
  }
  $('#full').classList.add('on');
  keepAwake(true);
  fDraw(); fTick();
}

async function keepAwake(on){

  } catch(e){}

function telePages(bl){
  const pages = []; let cur = [];
  const push = () => { if (cur.length){ pages.push(cur); cur = []; } };
  bl.forEach(b => {
    if (b[0] === 'h' || b[0] === 's'){ push(); cur = [b]; return; }
    if (b[0] === 'w'){ cur.push(b); push(); return; }   // 稿中的停頓 ＝ 換頁
    cur.push(b);
    const chars = cur.reduce((a, x) => a + (typeof x[1] === 'string' ? x[1].length : 0), 0);
    if (cur.length >= 6 || chars > 190) push();
  });
  push();
  return pages.map(p => ({ blocks:p }));
}

  const m = meta(n), ps = [{ blocks:[['h','《' + m.t + '》'], ['p', m.sub], ['q', m.mv.t + '　' + m.mv.r]] }];
  m.serm.pts.forEach(p => ps.push({ blocks:[['h', p[0]], ['p', '經文　' + p[1]], ['p', p[2]]] }));

  const s = Math.max(0, Math.round(F.left)), over = F.left < 0;
  const t = (over ? '-' : '') + String(Math.floor(Math.abs(F.left) / 60)).padStart(2, '0') + ':' +
            String(Math.floor(Math.abs(F.left) % 60)).padStart(2, '0');
  const c = $('#fclock'); c.textContent = t; c.classList.toggle('over', F.left < 0);
}
function fTick(){
  clearInterval(FT);
  FT = setInterval(() => { if (!F) return clearInterval(FT); if (F.run) F.left--; fClock(); }, 1000);
}
function fGo(d){
  if (!F) return;
  const i = F.i + d;
  if (i < 0) return;
  if (i >= F.pages.length){ toast('已經是最後一段'); return; }
  F.i = i; fDraw();
}

/* ===== 搜尋 ===== */
function vSearch(){
  setTitle('搜尋', false);
  const q = (R.q || '').trim();
  let h = `<div class="sect"><p class="eyebrow">搜尋</p>
    <input class="sbox" id="sq" placeholder="經節、原文、關鍵字…（例：4:17、無己、παρουσία）" value="${esc(q)}">
    <p class="xs muted" style="margin:8px 0 0">搜尋五章講義、教學講義逐字稿、重點節解經、原文軌跡與爭議地圖。</p></div>`;
  if (q.length >= 1){
    const hit = (t) => t && t.indexOf(q) >= 0;
    const mk = (t) => esc(t).split(esc(q)).join('<mark>' + esc(q) + '</mark>');
    let r = '';
    // 經節
    const vs = [];
    Object.keys(D.txt).forEach(c => (D.txt[c] || []).forEach((t, i) => {
      const ref = c + ':' + (i + 1);
      if (hit(t) || hit(ref)) vs.push([ref, t]);
    }));
    const ex = [];
    Object.keys(BLK).forEach(c => BLK[c].forEach(b => {
      if (hit(b.exp) || hit(b.gram) || hit(b.grk) || hit(b.key) || hit(b.lit)) ex.push(b);
    }));
    if (vs.length){ r += `<h3 class="sec">經文　${vs.length}</h3>`;
      vs.slice(0, 15).forEach(v => r += `<button class="chrow" onclick="openV('${v[0]}')">
        <span class="chn">${esc(v[0])}</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(v[1])}</b></span></button>`);
      if (vs.length > 15) r += `<p class="xs muted">（只顯示前 15 筆）</p>`; }
    const my = Object.keys(S.mk).filter(k => hit(mkText(k)) || hit(mkNote(k)));
    if (my.length){ r += `<h3 class="sec">我的畫線　${my.length}</h3>`;
      my.slice(0, 10).forEach(k => r += `<button class="chrow" onclick="mkSheet('${k}')">
        <span class="chn">✍</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(mkText(k).slice(0, 40))}…</b>
        ${mkNote(k) ? `<span class="s">${mk(mkNote(k).slice(0, 30))}</span>` : ''}</span></button>`); }
    if (ex.length){ r += `<h3 class="sec">解經　${ex.length}</h3>`;
      ex.slice(0, 12).forEach(b => r += `<button class="chrow" onclick="openV('${b.ch}:${b.a}')">
        <span class="chn">${b.ch}:${b.a === b.z ? b.a : b.a + '–' + b.z}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(((D.txt[b.ch] || [])[b.a - 1] || '').slice(0, 38))}…</b></span></button>`);
      if (ex.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 章
    const chs = CH.filter(c => hit(c.t) || hit(c.sub) || hit(c.truth) || hit(c.self) ||
      c.card.some(hit) || c.grp.some(hit) || c.safe.some(hit) || hit(c.mv.t));
    if (chs.length){ r += `<h3 class="sec">講義　${chs.length}</h3>`;
      chs.forEach(c => r += `<button class="chrow" onclick="go('course',${c.n})">
        <span class="chn">${String(c.n).padStart(2,'0')}</span>
        <span style="flex:1"><b>${mk(c.t)}</b><span class="s">${mk(c.truth)}</span></span></button>`); }
    // 教學講義逐字稿
    const ls = [];
    Object.keys(D.lesson || {}).forEach(k => {
      const L = D.lesson[k];
      if (hit(L.title)) { ls.push([k, L.title]); return; }
      for (const x of L.blocks){
        const parts = Array.isArray(x[1]) ? x[1] : [x[1]];   // 想更深是一問一答
        const p = parts.find(hit);
        if (p) { ls.push([k, p]); break; }
      }
    });
    if (ls.length){ r += `<h3 class="sec">教學講義　${ls.length}</h3>`;
      ls.slice(0, 12).forEach(x => r += `<button class="chrow" onclick="go('course',${x[0]},'lesson')">
        <span class="chn">${String(x[0]).padStart(2,'0')}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(x[1].slice(0, 44))}${x[1].length > 44 ? '…' : ''}</b></span></button>`);
      if (ls.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 軌跡
    const tk = D.tracks.filter(t => hit(t.gk) || hit(t.gl) || hit(t.tr) || hit(t.ins) || hit(t.head));
    if (tk.length){ r += `<h3 class="sec">原文軌跡　${tk.length}</h3>`;
      tk.forEach(t => r += `<button class="chrow" onclick="go('tools',0,'tracks')">
        <span class="chn">原</span><span style="flex:1"><b>${mk(t.gk)}</b><span class="s">${mk(t.gl)}　·　${mk(t.ins)}</span></span></button>`); }
    // 爭議
    const is = D.issues.filter(i => hit(i.t) || hit(i.why) || hit(i.say));
    if (is.length){ r += `<h3 class="sec">爭議　${is.length}</h3>`;
      is.forEach(i => r += `<button class="chrow" onclick="openIssue('${i.id}')">
        <span class="chn">⚖</span><span style="flex:1"><b>${mk(i.t)}</b><span class="s">羅 ${esc(i.r)}</span></span></button>`); }
    h += r || `<p class="sm muted" style="margin-top:18px">找不到「${esc(q)}」。試試經節（4:17）、原文（παρουσία）或關鍵字（無己、盼望、聖潔）。</p>`;
  }
  return h;
}

/* ═══════════════════════════════════════════════════════════════════
   畫線範圍（照《321互動聖經》）：往前加一句、往後加一句／少一句、整節、整段
   一條畫線仍只記在第一句的 key 上，S.mk[k].sp = 這條畫線共幾句。
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  /* 較早一代的範本（羅馬書、馬可、啟示錄）沒有顏色與定位工具，這裡補上 */
  if (typeof window.mkColor !== 'function') window.mkColor = k => (S.mk[k] && S.mk[k].c) || '';
  if (typeof window.mkKeep !== 'function') window.mkKeep = (k, fn) => {
    const sel = '[data-k="' + k + '"]', b = document.querySelector(sel), top = b ? b.getBoundingClientRect().top : null;
    fn(); if (top === null) return;
    const a = document.querySelector(sel); if (a) { const d = a.getBoundingClientRect().top - top; if (Math.abs(d) > 1) window.scrollBy(0, d); }
  };
  const TT = (zh, en) => (window.GX && GX.T) ? GX.T(zh, en) : zh;
  const MKS_TEXT = window.mkText, MKS_SHEET = window.mkSheet, MKS_TAP = window.mkTap;
  const sp = k => Math.max(1, +((S.mk[k] || {}).sp) || 1);
  /* 經文：由資料攤平整章的句子（不靠畫面，哪裡打開都算得對） */
  function seqV(c) {
    const out = [];
    (D.txt[c] || []).forEach((t, i) => {
      const ss = splitHTML(esc(t)), n = ss.length, ref = c + ':' + (i + 1);
      /* 空的節（和合本把兩節合成一節時，後一節是空的）不算一句 */
      for (let s = 0; s < n; s++) if (String(ss[s]).replace(/<[^>]+>/g, '').trim())
        out.push({ k: 'v|' + ref + (n > 1 ? '|' + s : ''), v: i + 1 });
    });
    return out;
  }
  /* 其他（講義、解經、三句話）：照畫面上的順序 */
  const grp = p => p[0] === 'l' ? 'l|' + p[1] + '|' : p.slice(0, -1).join('|') + '|';
  function seqDom(k) {
    backfill();
    const g = grp(k.split('|')), seen = {}, out = [];
    document.querySelectorAll('.mks[data-k],.mkp[data-k]').forEach(e => {
      const x = e.dataset.k;
      if (x.indexOf(g) === 0 && !seen[x]) { seen[x] = 1; out.push({ k: x }); }
    });
    if (!seen[k]) out.unshift({ k });
    return out;
  }
  function seq(k) {
    const p = k.split('|');
    return p[0] === 'v' ? seqV(p[1].split(':')[0]) : seqDom(k);
  }
  function keysOf(k) {
    const L = seq(k), i = L.findIndex(x => x.k === k);
    if (i < 0) return [k];
    return L.slice(i, i + sp(k)).map(x => x.k);
  }
  /* 整節／整段要畫幾句 */
  function spanTo(k, mode) {
    const L = seq(k), i = L.findIndex(x => x.k === k), p = k.split('|');
    if (i < 0) return 1;
    let n = 1;
    if (p[0] === 'v') {
      const c = p[1].split(':')[0], v = L[i].v;
      let z = v;
      if (mode === 'p') { const b = VMAP[c + ':' + v]; z = b && b.z ? b.z : v; }
      while (i + n < L.length && L[i + n].v <= z) n++;
    } else {
      const pre = p[0] === 'l' ? p.slice(0, 4).join('|') + '|' : grp(p);
      while (i + n < L.length && L[i + n].k.indexOf(pre) === 0) n++;
    }
    return n;
  }
  /* 出處：經文算出「出埃及記 1:6-7」；其他交給美圖自己去查 */
  function refOf(k) {
    const p = k.split('|');
    if (p[0] !== 'v') return GX.chLabel(+String(p[1] || '').split(':')[0] || R.ch || S.last || 1);
    const ks = keysOf(k), a = ks[0].split('|')[1].split(':'), z = ks[ks.length - 1].split('|')[1].split(':');
    return (GX.BK ? TT(GX.BK.zh, GX.BK.en) : (GX.BOOK || '')) + ' ' + a[0] + ':' + a[1] + (z[1] !== a[1] ? '-' + z[1] : '');
  }
  window.mkText = function (k) {
    if (!S.mk[k] || sp(k) < 2) return MKS_TEXT(k);
    /* 中文直接接；英文（前後都是英數標點）中間補一個空格 */
    return keysOf(k).map(x => String(MKS_TEXT(x) || '').trim()).filter(Boolean).reduce((s, x) =>
      !s ? x : (/[\x21-\x7E”’]$/.test(s) && /^[\x21-\x7E“‘]/.test(x)) || k[0] !== 'v' ? s + ' ' + x : s + x, '');
  };
  /* 把多句畫線延伸到後面幾句（只改畫面，不另外存） */
  /* 較早的範本句子沒有 data-k，只把 key 寫在 onclick 裡：補上 */
  function backfill() {
    document.querySelectorAll('.mks:not([data-k]),.mkp:not([data-k])').forEach(e => {
      const mm = /mkTap\('([^']+)'/.exec(e.getAttribute('onclick') || '');
      if (mm) e.setAttribute('data-k', mm[1]);
    });
  }
  function paint() {
    backfill();
    document.querySelectorAll('[data-own]').forEach(e => {
      if (!mkHas(e.dataset.own) && !mkHas(e.dataset.k)) { e.classList.remove('hl'); e.removeAttribute('data-c'); }
      e.removeAttribute('data-own');
    });
    Object.keys(S.mk).forEach(k => {
      if (sp(k) < 2) return;
      const c = mkColor(k);
      keysOf(k).slice(1).forEach(x => document.querySelectorAll('[data-k="' + x + '"]').forEach(e => {
        if (mkHas(x)) return;
        e.classList.add('hl'); e.dataset.own = k;
        if (c) e.setAttribute('data-c', c); else e.removeAttribute('data-c');
      }));
    });
  }
  window.mkPaintSpans = paint;
  const R0 = window.render;
  window.render = function () { const r = R0.apply(this, arguments); try { paint(); } catch (e) {} return r; };
  /* 點到被別條畫線蓋住的句子，就打開那一條 */
  window.mkTap = function (k, el) {
    const own = el && el.dataset && el.dataset.own;
    if (own && mkHas(own) && !mkHas(k)) return window.mkSheet(own);
    if (mkHas(k)) return window.mkSheet(k);
    return MKS_TAP(k, el);
  };
  const SC0 = window.mkSetColor;
  if (typeof SC0 === 'function') window.mkSetColor = function (k, c) { SC0(k, c); try { paint(); } catch (e) {} };
  /* 儲存領受時保留範圍 */
  window.mkSave = function (k) {
    const v = ($('#mkin') || {}).value || '';
    const o = S.mk[k] || {};
    S.mk[k] = { n: v.trim(), at: Date.now(), c: mkColor(k) };
    if (o.sp > 1) S.mk[k].sp = o.sp;
    save();
    $('#sheet').classList.remove('on'); mkKeep(k, render); toast(TT('領受已存', 'Saved'));
  };
  if (window.GXS) {
    window.mkSpanCard = function (k) {
      const n = ($('#mkin') || {}).value || mkNote(k), sh = $('#sheet');
      if (sh) sh.classList.remove('on');
      GXS.open({ text: window.mkText(k), note: n, ref: refOf(k) });
    };
    if (typeof window.mkCard !== 'function') window.mkCard = window.mkSpanCard;
  } else if (typeof window.mkRef === 'function') {
    /* 自帶美圖的範本（路加福音）：沿用它自己的「做一張圖」，只把出處改成範圍 */
    const REF0 = window.mkRef;
    window.mkRef = function (k) {
      const r = REF0(k);
      if (k[0] !== 'v' || sp(k) < 2) return r;
      const ks = keysOf(k), a = ks[0].split('|')[1].split(':'), z = ks[ks.length - 1].split('|')[1].split(':');
      return r.replace(/\s\S+$/, ' ' + a[0] + ':' + a[1] + (z[1] !== a[1] ? '-' + z[1] : ''));
    };
  }
  function rowHTML(k) {
    const isV = k[0] === 'v';
    return `<div class="hlrow mkspan"><span class="lb">${TT('範圍', 'Range')}</span>
      <button class="spb" data-sp="back" title="${TT('往前加一句', 'Add the sentence before')}">${TT('↑前一句', '↑ Prev')}</button>
      <button class="spb" data-sp="-1">－</button>
      <span class="spn" id="mkSpn">${TT(sp(k) + ' 句', sp(k) + '')}</span>
      <button class="spb" data-sp="1">＋</button>
      ${isV ? '<button class="spb" data-sp="v">' + TT('整節', 'Verse') + '</button>' : ''}

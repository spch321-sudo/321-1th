，理由是它太少談論保羅其他書信裡的核心爭論，但今天幾乎沒有學者跟隨。<\/p><p><strong>難處：<\/strong>這一說本身幾乎沒有難處，要面對的是一個細節：既然是保羅寫的，為甚麼信裡沒有加拉太書、羅馬書那樣的「因信稱義」論證？答案正在這封信的處境：帖撒羅尼迦沒有猶太派的教師要外邦人受割禮，保羅不需要辯論；他面對的是逼迫與喪親，所以他講的是盼望與站穩。<\/p>"],["三人合寫說（「我們」是真的團隊，不只是書信的客套）","","<p>認為 1:1 的三個名字不是掛名，而是真正的合寫者：全卷「我們」用得非常多，遠多於保羅其他書信，只在 2:18、3:5、5:27 才出現保羅單獨的「我」。西拉與保羅一同在腓立比被打、在帖撒羅尼迦建立教會，提摩太剛從那裡回來，三個人都認識這間教會的每一張臉。保羅後來回憶哥林多的事工時也說：「我和西拉並提摩太，在你們中間所傳神的兒子耶穌基督」（林後 1:19）。這派的優點是讓我們看見：新約的第一批書信之一，是一個團隊寫的。<\/p><p><strong>難處：<\/strong>古代書信常用「我們」作為一種書寫習慣，不一定表示每一句都是三人共擬；2:18 的「我－保羅」也顯示主要的聲音是保羅。所以合寫說的觀察是對的——這是團隊的信——但不必把它推到「三個人一起逐句寫成」。<\/p>"],["帖撒羅尼迦前書最早說（北加拉太說下，加拉太書寫得較晚）","","<p>若加拉太書是寫給小亞細亞北部的加拉太人（北加拉太說），它就寫於保羅第二次或第三次旅行之後，約主後 50 年代中，那麼帖撒羅尼迦前書（約 50–51 年）就是新約最早寫成的一卷。這派也有內證：信裡的神學看起來很「早」——沒有教會職分的發展，沒有因信稱義的長篇論證，主的再來在保羅心中非常近（4:15「我們這活著還存留到主降臨的人」）。<\/p><p><strong>難處：<\/strong>「看起來早」是一個危險的論證——保羅沒有寫稱義，可能只是因為這間教會不需要。北加拉太說本身也有難處：使徒行傳沒有記載保羅在北加拉太建立教會。這個判斷要和加拉太書的年代一起定，不能單從帖撒羅尼迦前書決定。<\/p>"],["加拉太書最早說（南加拉太早期說，加拉太書寫於耶路撒冷會議之前）","","<p>若加拉太書是寫給保羅第一次旅行所建立的南加拉太教會（彼西底的安提阿、以哥念、路司得、特庇），而且寫於耶路撒冷會議（徒 15 章，約主後 49 年）之前，它就寫於主後 48–49 年左右，比帖撒羅尼迦前書早。這派的理由包括：加拉太書爭的正是割禮，若耶路撒冷會議已經作出決定，保羅為甚麼不引用？加 2 章的耶路撒冷之行也可以對應徒 11 章的賑濟之行。<\/p><p><strong>難處：<\/strong>南加拉太說內部又分早期與晚期兩種，晚期說仍把加拉太書放在 50 年代；加 2:1–10 與徒 15 章的對應，學界也意見分歧。所以「新約最早的一卷」這個稱號，要誠實地說成「最早的一卷，或最早的兩卷之一」。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：作者是保羅，與西拉、提摩太一同署名，保羅是主要的聲音；寫於哥林多，約主後 50–51 年，在提摩太從帖撒羅尼迦回來之後不久（3:6；〔背景〕徒 18:5）。<\/strong><\/p><p><strong>帖撒羅尼迦前書是新約最早寫成的一卷，或最早的兩卷之一；與加拉太書孰先，學界未定，本講義不定先後。<\/strong>加拉太書的收信地與年代，見本系列加拉太書講義議題「受苦、逼迫與家人反對」；保羅在帖撒羅尼迦、雅典與哥林多的行程，見使徒行傳講義第 17–18 章。<\/p><p>講台只講一句：<strong>新約最早的書信之一，是一個團隊寫給一間嬰孩教會的家書。<\/strong>各章碰到作者、地點與年代的問題，一句帶過，回指這裡。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，這一題是給信心的禮物。這封信寫於耶穌釘十字架之後大約二十年，那時許多親眼見過耶穌的人還活著。而在這麼早的一封信裡，保羅已經把耶穌和父神並列：「願神－我們的父和我們的主耶穌一直引領我們到你們那裡去」（3:11）——兩個主詞，原文用的卻是一個單數動詞；他也已經清楚地說：「我們若信耶穌死而復活了」（4:14）。<\/p><p><strong>耶穌是主、他從死裡復活、他要再來——這些不是後來慢慢發展出來的教義，而是教會最早的信。<\/strong>不論它是第一封還是第二封，帖撒羅尼迦人手上那封信說的，和你今天手上這本聖經說的，是同一位主。<\/p>"]],"con":[],"say":"本講義的判斷：作者是保羅，與西拉、提摩太一同署名，保羅是主要的聲音；寫於哥林多，約主後 50–51 年，提摩太回來之後不久。帖撒羅尼迦前書是新約最早的一卷，或最早的兩卷之一；與加拉太書孰先學界未定，本講義不定先後（加拉太書年代見加拉太書講義議題「受苦、逼迫與家人反對」）。這個判斷不影響解經。","care":"這一題容易在查經班裡變成考據課，讓不熟悉學術的弟兄姊妹覺得自己讀不懂聖經；講台上一兩句帶過就好，不要把學者的名字、銘文的年份當成炫耀的資本。遇到真心被「新約是不是後人編的」這類問題困擾的人，會後單獨陪他讀，先肯定他願意誠實發問，再指給他看 3:11 與 4:14 這些最早的信仰告白。也可以帶會眾留意 1:1 的三個名字：事奉從來不是一個人的事，席上那些覺得自己只是「配角」的同工，需要聽見這一點。"},{"id":"ISS00_7","t":"帖撒羅尼迦城與教會的誕生——從使徒行傳十七章的三個安息日到這封信，這是一間怎樣的教會？","r":"徒 17:1--10；2:1--2；2:17","ch":[],"why":"全卷通用：一間只有三個安息日大的教會。帖撒羅尼迦教會的誕生記在使徒行傳 17 章：會堂裡的辯論、虔敬的希臘人與尊貴的婦女、嫉妒的人聳動暴動、耶孫被拉到地方官面前、保羅連夜被送走。保羅到底在那裡待了多久？教會是由哪些人組成的？「另有一個王耶穌」這句控告，又怎樣影響信裡的「降臨」「相遇」「平安穩妥」？這段歷史決定讀者怎樣聽全卷的掛念、逼迫與盼望，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>帖撒羅尼迦是馬其頓省的省會，位在貫穿巴爾幹、連接羅馬與東方的埃格那提亞大道上，又有良港，是一座人來人往的商業大城；它以亞歷山大大帝的妹妹命名，今天仍是希臘的第二大城。〔背景〕使徒行傳記載：「保羅照他素常的規矩進去，一連三個安息日，本著聖經與他們辯論」（徒 17:2）；「他們中間有些人聽了勸，就附從保羅和西拉，並有許多虔敬的希臘人，尊貴的婦女也不少」（徒 17:4）。<\/p><p>接著是暴動：「但那不信的猶太人心裡嫉妒」（徒 17:5），找不到保羅，就把耶孫拉到地方官面前，控告說：「這些人都違背凱撒的命令，說另有一個王耶穌」（徒 17:7）；當夜，弟兄們就把保羅、西拉送走（徒 17:10）。<strong>經文問的是：保羅在那裡待了多久？這間教會是由哪些人組成的？這段歷史怎樣幫助我們讀這封信？<\/strong><\/p>"],["短暫停留說（照字面：大約三、四個星期）","","<p>認為保羅在帖撒羅尼迦只待了「三個安息日」，也就是三、四個星期，然後就被趕走了。這派的優點是緊貼使徒行傳的記載，也讓這封信的處境格外動人：一間教會在不到一個月裡出生，創辦人就被迫離開，難怪保羅說他們「在大難之中」領受真道（1:6），難怪他「既不能再忍」（3:1）。這也是本卷第 1 章開場「三個安息日」這個數字的來源。<\/p><p><strong>難處：<\/strong>信裡有幾處線索不太容易放進三、四個星期：保羅說他們「晝夜做工」（2:9），像是一段相當長的日子；他「囑咐你們各人，好像父親待自己的兒女一樣」（2:11），一個一個地勸勉；腓立比書又說「就是我在帖撒羅尼迦，你們也一次兩次地打發人供給我的需用」（腓 4:16）——從腓立比送兩次供給，三個星期似乎太短。<\/p>"],["較長停留說（三個安息日是會堂階段，之後在外邦人中多留了一段時間）","","<p>認為「三個安息日」指的是保羅在會堂裡辯論的那一段；之後他離開會堂，在外邦人中間繼續工作，可能又待了幾個星期到兩、三個月，才發生暴動。理由是：信裡的信徒大多是「離棄偶像，歸向神」（1:9）的外邦人，不像是會堂裡的敬虔希臘人；保羅晝夜做工、腓立比兩次供給，都需要較長的時間。這派的優點是同時接住了使徒行傳與兩封書信的線索。<\/p><p><strong>難處：<\/strong>使徒行傳沒有記載這段額外的時間，這是推論；而且不論多留了幾個星期，這間教會仍然非常年輕——兩說的差別是「一個月」與「兩三個月」，都是嬰孩。所以這個爭論不改變這封信的處境，只改變我們想像保羅在城裡生活的畫面。<\/p>"],["作坊教會說（教會的核心是一群做手工的人）","","<p>認為這間教會的核心是一群工匠與勞動者：保羅自己「晝夜做工」（2:9），〔背景〕他在哥林多也是製造帳棚為業（徒 18:3）；他吩咐信徒「親手做工」（4:11）、「警戒不守規矩的人」（5:14）。所以保羅很可能是在作坊裡一邊做工、一邊傳福音，教會就在作坊與住家裡長出來。這派的優點是讓 4:11–12 與 5:14 有了很具體的畫面，也說明為甚麼這封信那麼在乎「向外人行事端正」。<\/p><p><strong>難處：<\/strong>使徒行傳也說有「尊貴的婦女也不少」（徒 17:4），耶孫有房子可以收留保羅，所以這間教會不只是勞動階層，而是各種人混在一起。作坊是一個重要的場景，卻不是全部。<\/p>"],["「另有一個王」的政治背景說（帝國崇拜與這封信的詞彙）","","<p>認為帖撒羅尼迦人對「另有一個王耶穌」（徒 17:7）特別敏感：這座城享有自由城的地位，與羅馬關係密切，城裡有對羅馬與皇帝的崇拜。信裡幾個關鍵字在當時也是政治詞彙：παρουσία（降臨）用來說皇帝或官長的正式到訪；ἀπάντησις（相遇）是城民出城迎接；「人正說『平安穩妥』的時候」（5:3）很可能是在呼應羅馬帝國的宣傳口號。這派的優點是解釋了逼迫為甚麼那麼快、那麼重：信耶穌在這座城裡，不只是換一個宗教，是換一位王。<\/p><p><strong>難處：<\/strong>若講得太滿，會把這封信讀成一份政治宣言，把信仰講成反帝國的運動；保羅自己的吩咐卻是「立志作安靜人」（4:11）、「向外人行事端正」（4:12）。政治背景是舞台，不是劇本；它幫助我們聽懂詞彙，但不叫教會去對抗政府（見議題「受苦、逼迫與家人反對」）。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：帖撒羅尼迦教會是一間在大難中出生、大多由離棄偶像的外邦人組成的嬰孩教會；保羅在會堂辯論了三個安息日，在城裡的時間可能稍長一些，但不論長短，這間教會出生不久就失去了父母。<\/strong>作坊的場景與「另有一個王」的背景都是真的，它們交會的中心是 1:9–10：「你們是怎樣離棄偶像，歸向神，要服事那又真又活的神」（1:9）——歸向一位神，等候一位王。<\/p><p>這條歷史線讓全卷的幾個字都有了重量：<strong>離別<\/strong>——「我們暫時與你們離別」（2:17）原文是被奪去孩子；<strong>逼迫<\/strong>——來自自己的鄉親（2:14）；<strong>降臨與相遇<\/strong>——城民出城迎接的不是凱撒，是主；<strong>榜樣<\/strong>——這間嬰孩教會，「甚至你們作了馬其頓和亞該亞所有信主之人的榜樣」（1:7）。<\/p><p>各章的〔背景〕互見行指向本系列使徒行傳講義第 16 章（腓立比受辱）、第 17 章（帖撒羅尼迦、庇哩亞、雅典）與第 18 章（提摩太回到哥林多）；馬其頓的姊妹教會見腓立比書講義。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，這段歷史是給信心的禮物。這間教會只有三個安息日大、創辦人連夜被送走、手上沒有聖經，可是幾個月以後，「因為主的道從你們那裡已經傳揚出來」（1:8）——像鐘聲一樣響到各處。神建立教會，不需要等一切條件都齊備。<\/p><p>如果你所在的教會很小、很新、剛經歷人事變動、牧者剛離開，帖撒羅尼迦的故事對你說：<strong>父母可以被迫離開，福音卻留下來了；道在你們裡面運行（2:13），不靠傳道的人一直在場。<\/strong>那召你們的本是信實的，他必成就這事（5:24）。<\/p>"]],"con":[],"say":"本講義的立場：帖撒羅尼迦教會是一間在大難中出生、大多由離棄偶像的外邦人組成的嬰孩教會（徒 17:1–10；1:9）；保羅在會堂辯論了三個安息日，在城裡可能稍長一些，但不論長短，教會出生不久就失去了父母。作坊的場景與「另有一個王」的政治背景都是真的，交會在 1:9–10：歸向一位神，等候一位王；背景是舞台，不是叫教會對抗政府。","care":"這一題容易被講成「帖撒羅尼迦教會那麼快就成了榜樣，你們信主這麼久了還不如他們」——不要這樣用，那會壓傷正在掙扎的人。席上會有剛經歷牧者離職、教會分裂、同工搬走的弟兄姊妹，覺得自己被留下來了；對他們，先講保羅的掛念（3:1–5），讓他們知道被留下的人在神心裡沒有被忘記。講到「另有一個王」時，不要把它變成政治動員，也要顧及來自不同處境、對政府有不同經驗的肢體。"},{"id":"ISS00_8","t":"帖撒羅尼迦前書與後書：兩封信是甚麼關係？","r":"4:13--5:11；5:14","ch":[],"why":"全卷通用：主再來的教導與帖撒羅尼迦後書（將來另立一卷）。兩封信寫給同一間教會，都談主的再來、患難與不做工的人，語句也非常相似；但前書說主的日子「好像夜間的賊一樣」，後書卻說「那日子以前，必有離道反教的事」。哪一封在先？後書是不是保羅寫的？兩封信對主再來的說法是否矛盾？這一題決定全卷第 4、5 章怎樣與後書互見，也提醒讀者不要只讀一封就排出末世路線圖，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>前書說：「主的日子來到，好像夜間的賊一樣」（5:2），又說「論到時候、日期，不用寫信給你們」（5:1）。後書卻提到一個新的狀況：「無論有靈、有言語、有冒我名的書信，說主的日子現在到了，不要輕易動心，也不要驚慌」（帖後 2:2），並且說「因為那日子以前，必有離道反教的事」（帖後 2:3）。前書勸人「親手做工」（4:11）、「警戒不守規矩的人」（5:14）；後書則嚴厲得多：「若有人不肯做工，就不可吃飯」（帖後 3:10）。<\/p><p>後書還有一句特別的話：「我－保羅親筆問你們安。凡我的信都以此為記」（帖後 3:17）。<strong>經文問的是：兩封信哪一封在先？是不是同一位作者？一封說像賊突然來，一封說之前會有徵兆，矛盾嗎？<\/strong><\/p>"],["傳統次序說（前書在先，後書幾個月後處理新的誤解）","","<p>教會傳統與多數學者的看法：前書寫成以後不久，教會裡出現了新的狀況——有人宣稱「主的日子現在到了」，也許還拿著一封冒保羅之名的信；有些人因此更不做工了。保羅於是寫了後書，一方面安慰受患難的人，一方面說明「還沒有到」，並且更嚴厲地處理不做工的人。這派的優點是兩封信的發展很自然：前書對憂傷的人說「主必來」，後書對驚慌的人說「還沒有到」；前書溫和地勸，後書在勸了沒用以後下了命令。<\/p><p><strong>難處：<\/strong>它要解釋兩封信為甚麼在很短的時間裡語氣差那麼多，以及後書的開頭為甚麼和前書幾乎一字一句相似。傳統的回答是：同一個作者、同一批同工、同一間教會，相隔幾個月寫信，語句相似本來就很自然。<\/p>"],["次序顛倒說（後書其實在先）","","<p>少數學者認為今天叫「後書」的那一封其實先寫：後書裡的患難正在進行，前書裡的患難像是已經過去；後書 3:17 的親筆記號，放在一間教會收到的第一封信裡最合理；前書 4:9、5:1「不用寫信給你們」，可能是在回應教會讀過前一封信以後提出的問題。兩封信在新約裡的次序，可能只是因為「前書」比較長，被排在前面。<\/p><p><strong>難處：<\/strong>前書 2:17–3:10 詳細回憶保羅離開以後的掛念與提摩太的回報，讀起來非常像是保羅離開以後寫的第一封信，若之前已經寫過一封，很難解釋為甚麼完全沒有提到；而後書 2:15「信上寫的」較自然地指向一封已經寫過的信。多數學者因此不採次序顛倒說。<\/p>"],["後書託名說（後書是保羅門徒借他的名寫的）","","<p>部分學者認為後書不是保羅寫的，而是保羅死後，他的門徒借他的名、模仿前書寫成，用來糾正一種「主的日子已經到了」的熱狂。理由是：後書的末世觀（先有徵兆）與前書（像賊一樣）不同；後書的句子與前書相似得太刻意；語氣也比前書冷。這派的心志是認真面對兩封信的差異。<\/p><p><strong>難處：<\/strong>「像賊」與「先有徵兆」在主耶穌自己的教導裡就是放在一起的——馬太福音 24 章先講徵兆，再說「所以，你們要警醒，因為不知道你們的主是哪一天來到」（太 24:42）；對不警醒的人，日子像賊；對警醒的人，前書也說「你們卻不在黑暗裡，叫那日子臨到你們像賊一樣」（5:4）。而且一封託名的信特別警告「冒我名的書信」（帖後 2:2），也是一個很難解釋的地方。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：照傳統次序讀——前書在先，後書在幾個月後寫成，兩封都是保羅與西拉、提摩太寫給同一間教會的信。<\/strong>次序顛倒說、後書託名說照實陳列，後書的作者與年代等議題，留待本系列帖撒羅尼迦後書講義另立，本卷不先定。<\/p><p><strong>兩封信是互補的，不是矛盾的。<\/strong>前書對憂傷的人說：主必來，睡了的人不會錯過，「這樣，我們就要和主永遠同在」（4:17）；後書對驚慌的人說：還沒有到，不要動心，「所以，弟兄們，你們要站立得穩」（帖後 2:15）。<strong>一封給盼望，一封給忍耐；合起來，就是 1:3「因盼望……所存的忍耐」。<\/strong><\/p><p>這也是一個讀經的提醒：只讀前書的「像賊」，容易焦慮；只讀後書的「先有徵兆」，容易開始排時間表。兩封一起讀，才會得到保羅要的那種警醒——不慌、不睡、照常做工（4:11），並且彼此勸慰（5:11）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩封信的次序與後書的作者問題，爭的是這兩封信怎樣成形，不是它們所說的主。兩封信都說主必親自再來、信的人要與他同在、受患難的人要得安息；也都說，在等候的日子裡，要安靜做工、彼此相愛。<\/p><p>這一題還給今天一個很實際的安慰：<strong>第一代的教會也有人誤解末世、也有人因此驚慌、不做工<\/strong>，保羅沒有因此放棄他們，而是再寫一封信，耐心地再講一次。如果你曾經被末世的說法弄得很亂，你不是第一個；那位寫了兩封信的牧者，也願意陪你再讀一次。<\/p>"]],"con":[],"say":"本講義的立場：照傳統次序讀——前書在先，後書在幾個月後寫成，兩封都是寫給同一間教會的信；次序顛倒說與後書託名說照實陳列，後書的議題留待帖撒羅尼迦後書講義另立。兩封信互補不矛盾：前書對憂傷的人給盼望，後書對驚慌的人給忍耐；「像賊」是對不警醒的人說的，兩封一起讀，才不會焦慮，也不會排時間表。","care":"這一題容易被講成「你看，連保羅那時候就有人亂講末世」，接著去嘲笑某些教會或某些弟兄的末世觀——不要這樣用（見議題「主再來、被提與末世時間表」）。席上會有曾經相信過某個日期、後來落空、至今覺得羞愧的人；對他們，講保羅怎樣耐心地再寫一封信，不要讓他們成為笑話。也要想到因為「主快來了」而放下工作、學業的年輕人與他們焦急的家人：溫柔地勸回日常的生活，會後單獨跟進。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"5:21--24","ch":[],"why":"全卷通用：爭議與信心。這一卷的議題頁要陳列許多爭論：災前、災中、災後被提；前千禧、無千禧、後千禧；4:4 σκεῦος 是身體還是妻子；5:23 三分說、二分說、整全說；2:7「溫柔」還是「嬰孩」；3:2「執事」還是「同工」；2:14–16 是不是後人插入；前後書的次序與作者。有些讀者會因此鬆一口氣，有些讀者卻會開始不安：連主怎樣再來都有爭論，我信的到底可不可靠？甚麼可以有不同看法、甚麼不能讓，必須在開卷講清楚。","pos":[["【一】經文問的是甚麼","","<p>帖撒羅尼迦前書的最後一串命令，正好碰到這一題：「不要消滅聖靈的感動；不要藐視先知的講論。但要凡事察驗；善美的要持守，各樣的惡事要禁戒不做」（5:19–22）。保羅沒有叫一間嬰孩教會「甚麼都信」，也沒有叫他們「甚麼都不信」，而是「凡事察驗」——δοκιμάζετε，像試驗金子一樣；察驗之後，「善美的要持守」。<\/p><p>緊接著是全卷最後的禱告與應許：「願賜平安的神親自使你們全然成聖」（5:23），「那召你們的本是信實的，他必成就這事」（5:24）。<strong>經文問的是：甚麼是要持守、不能讓的？甚麼是可以有不同看法、繼續察驗的？知道了這麼多爭議以後，信心該建立在哪裡？<\/strong><\/p>"],["完美答案說（每一題都必須有唯一的標準答案，信心才站得住）","","<p>認為一位真正信靠聖經的人，在每一個議題上都應當有清楚而唯一的答案；承認有爭議，就是承認聖經不清楚，信心就會動搖。所以教會應當在被提的時間、千禧年、靈魂體的構造等每一題上都立好標準答案，要信徒照著相信。這派的心志是保護信徒不被錯誤的教導帶走，這份心是好的——5:21 確實說要「凡事察驗」，5:22 也說惡事要禁戒。<\/p><p><strong>難處：<\/strong>它把「凡事察驗」變成了「凡事已經察驗完畢」。保羅自己說「論到時候、日期，不用寫信給你們」（5:1），他沒有給被提時間表；他也承認「我們如今彷彿對著鏡子觀看，模糊不清」（林前 13:12）。把每一題都升格成不能讓的中心，教會就會為了被提觀分裂；而信心若建立在每一題都答對上，任何一題的答案一動，整個信仰就跟著倒。<\/p>"],["爭議即不可靠說（既然甚麼都有爭論，信仰就只剩個人意見）","","<p>認為既然學者們連主怎樣再來、人由幾部分組成、這封信是不是最早都意見分歧，那就表示聖經沒有確定的教導，每個人照自己的感覺讀就好；合一就是不談真理、不說對錯。這派誠實地面對了爭議的存在，也提醒教會不要假裝一切都很簡單、不要用自己的答案壓人。<\/p><p><strong>難處：<\/strong>它把爭議的「細節」與爭議的「範圍」混在一起了。災前、災中、災後被提爭的是次序，沒有一派否認「主必親自從天降臨」（4:16）；三分說、二分說、整全說爭的是人的構造怎樣描述，沒有一派否認神要保守整個人（5:23）；前後書次序爭的是寫作過程，沒有一派否認「我們若信耶穌死而復活了」（4:14）。而且 5:21 不只說「察驗」，也說「持守」——沒有任何要持守的東西，察驗就沒有意義。<\/p>"],["中心與邊緣說（福音的中心不能讓，其餘的事可以有不同看法）","","<p>認為帖撒羅尼迦前書本身就劃出了一個中心，就在 1:9–10：離棄偶像，歸向又真又活的神；等候他兒子從天降臨；他從死裡復活；他救我們脫離將來的忿怒。加上 4:14 的「耶穌死而復活」、4:17 的「永遠與主同在」、5:9–10 的「他替我們死」、5:24 的「他必成就」。<strong>這些是要持守的<\/strong>；被提的時間、千禧年、人的構造、經文異文的取捨、前後書的次序，<strong>是可以繼續察驗、彼此有不同看法的<\/strong>。<\/p><p><strong>難處：<\/strong>中心與邊緣的界線本身有時也會被爭論——有人會說被提的時間點就是中心。所以劃線的時候，要以經文自己最清楚、最反覆強調的事為中心，而不是以某一個宗派最在意的事為中心；也要記得，邊緣的事不等於不重要的事——它們常常牽動人的生命（例如喪禮上的眼淚、被侵害者的羞恥），所以要謹慎、溫柔地處理（見議題「主再來、被提與末世時間表」–5）。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採中心與邊緣的讀法，以 1:9–10 為中心。<\/strong>「你們是怎樣離棄偶像，歸向神，要服事那又真又活的神，等候他兒子從天降臨，就是他從死裡復活的－那位救我們脫離將來忿怒的耶穌」（1:9–10）——這幾件事各派都同意，兩千年沒有被任何學術爭論動搖。加上帖撒羅尼迦前書自己的福音：耶穌死而復活（4:14），主必親自降臨、死人要復活、我們要永遠與主同在（4:16–17），他替我們死（5:10），他必成就（5:24）。<\/p><p>其餘的事，本講義照鐵律三：先陳列各家、說出各自的難處、再給判斷，並且把判斷的理由講出來；講台與教學場上一句帶過，指向議題頁與「書信的處境與原則」–5。2:7 的「溫柔」與「嬰孩」、3:2 的「執事」與「同工」，都照實交代，不講成懷疑——兩種讀法的落點都相同。判斷的標準就是 5:21 的兩個動詞：<strong>凡事察驗，善美的要持守。<\/strong><\/p><p>全卷的地勢最高點是 4:17，引它時一律帶出它的用途：「這樣，我們就要和主永遠同在。所以，你們當用這些話彼此勸慰」（4:17–18）。爭議可以留在議題頁裡，這兩句要帶回家。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。信心不是建立在「我對每一題都有答案」上，而是建立在「那召你們的本是信實的，他必成就這事」（5:24）的神身上。學者的爭論會一直持續下去；但你可以在不知道被提是災前還是災後、不確定人是二分還是三分的情況下，完全確定那位替你死的主一定會回來，而且你會「和主永遠同在」（4:17）。<\/p><p>這一卷要讀完的人，<strong>不是更會辯論，而是更會彼此勸慰<\/strong>——在不同意彼此的時候，仍然「用愛心格外尊重他們」（5:13）、「你們也要彼此和睦」（5:13）；在等候的夜裡，仍然「勉勵灰心的人，扶助軟弱的人」（5:14）。<strong>讀完這一卷的人，是更愛主，還是更佩服作者？<\/strong>是更害怕主來，還是更想念主來？若是更愛主、更想念主，爭議就各歸其位了。<\/p>"]],"con":[],"say":"本講義的立場：以 1:9–10 為中心——歸向又真又活的神、等候他兒子從天降臨、他從死裡復活、救我們脫離將來的忿怒；加上耶穌死而復活（4:14）、主必降臨與永遠同在（4:16–17）、他替我們死（5:10）、他必成就（5:24）。被提時間、千禧年、靈魂體、異文、前後書次序等，先陳列各家、說出難處、再給判斷，講台一句帶過、指向議題頁與「書信的處境與原則」–5。判準是 5:21：凡事察驗，善美的要持守。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人，也會有一聽到「各派看法不同」就不安、覺得教會怎麼甚麼都不確定的人，還有曾經在某一題上——被提的恐嚇、喪禮上不准哭、貞潔的羞辱、屬魂的標籤——被教會傷過、因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」，也不要急著用一堆答案堵住他，先陪他；對第二種人，指給他看 1:9–10 與 5:24 那幾件從來沒有被任何爭議動搖的事；對第三種人，讓他知道傷他的是人錯用了經文，不是那位替他死、要回來接他的主。疑惑若伴隨長期的失眠、無望感或輕生念頭，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"1:4「我知道你們是蒙揀選的」——揀選是甚麼？保羅怎麼「知道」？","r":"1:4--5；弗 1:4；約 15:16","ch":[1],"why":"「揀選」在華人教會常常不是一個安慰的字，而是一個讓人睡不著的字：我是不是被揀選的？我的孩子呢？我那沒有信主就過世的父母呢？神學上，揀選又是改革宗與循道宗（阿民念傳統）幾百年的爭論。可是 1:4 是保羅寫給一間只有幾個禮拜大的嬰孩教會的話，他說「我知道」，而且下一節馬上說出他怎麼知道。這一題要把揀選放回它在這封信裡的用途。","pos":[["【一】經文問的是甚麼","","<p>「被神所愛的弟兄啊，我知道你們是蒙揀選的」（1:4）。原文 εἰδότες……τὴν ἐκλογὴν ὑμῶν，「知道你們的揀選」，是掛在 1:2「我們感謝神」底下的第三個分詞——揀選在這裡是感謝的內容，不是辯論的題目。接著 1:5 用 ὅτι（因為）交代根據：福音臨到他們，不獨在乎言語，也在乎權能和聖靈。問題有兩層：揀選是甚麼？一個人憑甚麼「知道」別人（或自己）是蒙揀選的？<\/p>"],["無條件揀選說（改革宗）：神在創世以前主權地揀選個人","","<p>這一派根據「就如神從創立世界以前，在基督裡揀選了我們」（弗 1:4）與「不是你們揀選了我，是我揀選了你們」（約 15:16），認為揀選是神主權的恩典，不以人的行為或預見的信心為條件；1:4 的「被神所愛的」用完成式，正是在說神的愛走在人的回應前面。保羅「知道」，是因為看見神已經在他們身上動工的記號。<\/p><p><strong>難處：<\/strong>講得不小心，容易讓人把揀選當成一份看不見的名冊，往前推算誰在名單上、誰不在，反而生出焦慮與驕傲；也較難向會眾解釋「他願意萬人得救」（提前 2:4）這一類經文。<\/p>"],["預知揀選說（阿民念／循道傳統）：神預先知道誰會相信而揀選他們","","<p>這一派根據「就是照父神的先見被揀選」（彼前 1:2），認為神的揀選與他預先知道人的信心相連，強調人真實的回應與責任；1:6 說他們「領受真道」，1:9 說他們「歸向神」，都是人真實的動作。保羅「知道」，是因為看見他們真實地信了、轉身了。<\/p><p><strong>難處：<\/strong>若揀選最後取決於人的信心，就較難解釋 1:4 為甚麼把一切放在「被神所愛」的被動式底下，也容易讓人把得救的確據放回自己信得夠不夠堅定上。<\/p>"],["群體揀選說：在基督裡被揀選的，是一群人","","<p>也有學者強調，保羅在這裡用的是複數「你們的揀選」，對象是整間教會；就像舊約以色列被稱為神所愛、所揀選的民，如今一群離棄偶像的外邦人也被稱為「被神所愛的弟兄」。揀選首先是「在基督裡」成為神的子民，個人藉著信進入這一群人。<\/p><p><strong>難處：<\/strong>這一說點出了經文的群體焦點，卻沒有真正回答個人層面的問題；保羅別處也有個人化的揀選語言，群體說不能把個人的問題取消掉。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義不在 1:4 替各派裁決預定論，各派都是弟兄；本講義要守住的是這一節自己的走法：保羅是從果效「認出」揀選，不是從名冊「推算」揀選。<\/strong>1:5 的「因為」指向看得見的事——福音帶著權能和聖靈臨到、他們在大難中領受真道、轉身離開偶像。揀選在這封信裡是一句安慰嬰孩教會的話：你們的信不是偶然的，是神先愛了你們。<\/p><p>所以揀選是回頭看時認出來的恩典，不是往前看的審查；它的果效應該是感謝與確據，而不是焦慮與篩選。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：得救是出於神的恩典，人要真實地信；神的愛走在我們前面。爭的是神的主權與人的回應怎樣配合。<\/p><p>對你今天最重要的不是先解開這個奧秘，而是像帖撒羅尼迦人一樣，轉向那一位已經愛你的神。到我這裡來的，主說他「總不丟棄」（約 6:37）。爭議與信心的全卷立場見議題「這些爭議該不該影響一個人的信心？」。<\/p>"]],"con":[],"say":"本講義的立場：揀選是神的恩典，神的愛走在人的回應前面；預定論各派並陳、都是弟兄，本講義不在本章裁決。1:4–5 的重點是保羅從福音的果效「認出」揀選——那是回頭看時的感恩，不是往前看的名冊。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上一定有常常懷疑自己是否得救的人，有為未信主的孩子擔心的父母，也有父母沒有信主就過世、心裡一直不敢問的弟兄姊妹。不要在講台上用揀選嚇人，也不要對任何人或任何亡者說「他大概不是被揀選的」。對懷疑的人，陪他回頭數算神在他身上做過的事；對擔心家人的人，陪他繼續禱告、繼續愛；對喪親的人，先陪伴，不解釋，把亡者交在公義又慈愛的神手中。"},{"id":"ISS01_2","t":"1:5「不獨在乎言語，也在乎權能和聖靈」——傳福音一定要有神蹟嗎？","r":"1:5；林前 2:4；林後 12:12","ch":[1],"why":"有些教會說：沒有神蹟奇事、醫治趕鬼的福音是「只有言語」的福音，是沒有能力的；另一些教會則認為，神蹟屬於使徒時代，今天追求神蹟就是偏差。1:5 正好站在這兩種聲音中間。這一題關係到一般信徒怎樣看自己的見證，也關係到教會會不會因為恩賜的爭論而彼此看輕。","pos":[["【一】經文問的是甚麼","","<p>「因為我們的福音傳到你們那裡，不獨在乎言語，也在乎權能和聖靈，並充足的信心」（1:5）。原文 οὐκ……ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει——不是只在話語裡，而是也在能力裡。保羅沒有否定話語，他在會堂講了三個安息日的聖經。問題是：δύναμις（dynamis）在這裡指神蹟奇事，還是指聖靈使人信服、使生命改變的能力？是不是每一次傳福音都要有神蹟伴隨，才算「也在乎權能」？<\/p>"],["神蹟說：權能就是伴隨福音的神蹟奇事","","<p>這一派指出，保羅別處說他「藉著神蹟、奇事、異能顯出使徒的憑據來」（林後 12:12），希伯來書也說神「用神蹟、奇事和百般的異能，並聖靈的恩賜，同他們作見證」（來 2:4）。在帖撒羅尼迦，福音很可能也有神蹟伴隨；今天的教會也應當期待聖靈以神蹟印證所傳的道。<\/p><p><strong>難處：<\/strong>使徒行傳 17 章記載帖撒羅尼迦的事，沒有提到任何神蹟；本卷也沒有描述一件神蹟。把「權能」限定成神蹟，等於把經文沒有說的事讀進去，也容易讓沒有看過神蹟的信徒覺得自己的福音是「次等的」。<\/p>"],["內在能力說：權能是聖靈使人信服、生命被翻轉","","<p>另一派認為，1:5 的三個片語「權能」「聖靈」「充足的信心」是同一件事的三面：聖靈帶著能力，使聽的人被說服，也使傳的人有充足的確信。保羅對哥林多人說，他講的道是「用聖靈和大能的明證」（林前 2:4），重點在人心被改變。1:6–10 列出的證據也正是這些：在大難中領受、喜樂、轉身離開偶像。<\/p><p><strong>難處：<\/strong>這一說若講過頭，會變成「今天神只在人心裡動工、不再行神蹟」的終止論立場，這是從經文沒有明說的地方推出的另一個結論，對那些真實經歷過醫治的弟兄姊妹並不公平。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採較寬的讀法：1:5 的「權能」包括、但不限於神蹟奇事；它首先是聖靈使福音進入人心、翻轉生命的能力。<\/strong>一個拜了一輩子偶像的人肯轉身，就是權能；神今天仍可以行神蹟，教會可以為病人禱告、期待神作工，但福音的真實不靠場面證明。<\/p><p>神蹟是否延續到今天、屬靈恩賜怎樣運用，本講義不在本章另立說法，回指哥林多前書 12–14 章的議題。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：福音不只是一套說法，是神親自帶著能力在人身上作工；聖靈是傳福音真正的主角。爭的是這能力在外面怎樣顯出來。<\/p><p>你也許從來沒有看過神蹟，但你看過一個人變了——也許就是你自己。那就是 1:5 說的權能。爭議與信心的全卷立場見議題「這些爭議該不該影響一個人的信心？」。<\/p>"]],"con":[],"say":"本講義的立場：1:5 的「權能」包括、但不限於神蹟；它首先是聖靈使福音進入人心、翻轉生命的能力。神今天仍可以行神蹟，但福音不靠場面證明。屬靈恩賜與神蹟延續的爭議回指哥林多前書 12–14 章議題；本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有從靈恩背景來、曾經被說「你沒有方言就是沒有聖靈」的人，也有從保守背景來、對神蹟很戒慎的人，還有為家人禱告醫治卻沒有得醫治、心裡受傷的人。不要用這一節貶低任何一邊的弟兄姊妹，也不要對沒有得醫治的人說「是你信心不夠」。陪那些覺得自己「沒有能力」的平凡信徒看見：他們默默的愛與忍耐，正是聖靈的作為。"},{"id":"ISS01_3","t":"1:6「在大難之中，蒙了聖靈所賜的喜樂」——受苦時還要喜樂，是不是否認痛苦？","r":"1:6--7；林後 6:10；來 12:2","ch":[1],"why":"1:6 把「大難」和「喜樂」放在同一節。這一節常被用來對受苦的人說「你要喜樂」「屬靈的人不會難過」，結果讓受苦的人多背一層羞愧；也有人用它要求正在受家暴、虐待的人留下來「喜樂忍耐」。這一題關係到教會怎樣陪伴受苦的人，是本卷紅線六（受苦）與紅線八（情緒）的交會點。","pos":[["【一】經文問的是甚麼","","<p>「並且你們在大難之中，蒙了聖靈所賜的喜樂，領受真道就效法我們，也效法了主」（1:6）。原文是兩個介詞片語並排：ἐν θλίψει πολλῇ（在許多的患難中）與 μετὰ χαρᾶς πνεύματος ἁγίου（帶著聖靈的喜樂）。θλῖψις 原是擠壓的字，帖撒羅尼迦人的大難是真實的逼迫（〔背景〕徒 17:5–9）。問題是：這裡的喜樂是叫人壓下痛苦嗎？還是喜樂和痛苦可以同時存在？這一節是描述，還是命令？<\/p>"],["勝利說：真正屬靈的人在苦中只會喜樂","","<p>有一種講法把 1:6 當作標準：聖靈充滿的人在患難中會喜樂，所以如果你憂愁、沮喪、哭泣，就表示你的屬靈生命出了問題。這一派常配合「落在百般試煉中，都要以為大喜樂」（雅 1:2）來講，用意是鼓勵人不要被環境打倒。<\/p><p><strong>難處：<\/strong>1:6 是描述，不是對受苦者的指責；同一位保羅說自己「似乎憂愁，卻是常常快樂的」（林後 6:10），憂愁和快樂同時存在。這種講法把喜樂變成一種表演，也讓真正痛苦的人不敢說出來，甚至延誤需要的幫助。<\/p>"],["延後說：今生只能忍，喜樂是將來的事","","<p>另一種讀法認為，受苦的人在今生能做的只有忍耐，喜樂要等到主來的那一天才會真正來到；1:3 的「因盼望……所存的忍耐」與 1:10 的「等候」似乎支持這個方向：苦是現在的，喜樂是將來的。<\/p><p><strong>難處：<\/strong>經文說他們是「在大難之中」就已經蒙了聖靈的喜樂，不是等大難過去以後；把喜樂完全推到將來，會讓受苦的人以為神在現在的苦裡是缺席的，與 1:6 的「帶著」不合。<\/p>"],["並存說：喜樂與痛苦同在，喜樂是聖靈的同在","","<p>許多解經家認為，1:6 的重點在「聖靈所賜」：這喜樂不是人自己擠出來的情緒，也不是否認痛苦，而是在痛裡多了一位同在的。耶穌自己也是如此：「他因那擺在前面的喜樂，就輕看羞辱，忍受了十字架的苦難」（來 12:2）——喜樂沒有讓十字架變輕，卻讓他沒有離開；他在客西馬尼也說自己「甚是憂傷」。<\/p><p><strong>難處：<\/strong>並存說需要細心說明，否則仍可能被聽成「你哭可以，但心裡要喜樂」，變成另一種壓力；也要清楚分辨：為福音受的苦，與家暴、虐待是兩回事。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採並存說：1:6 是描述神在逼迫中的同在，不是命令受苦的人假裝快樂；大難與喜樂在同一節，誰也沒有取消誰。<\/strong>可以流淚，可以說出痛苦；聖靈的喜樂是知道自己沒有被丟下。<\/p><p>同時，1:6 的大難是「為福音」的逼迫，不是家暴或虐待；不要求任何人留在暴力或不安全的處境裡，也不美化受苦、不追求受苦，更不講「信主就一帆風順」的成功神學（全卷立場見議題「受苦、逼迫與家人反對」）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該——反而應該讓你得安慰。新約最早的一封信，第一章就承認信主的人會遇到大難；信耶穌不保證沒有苦，保證的是苦裡有他。<\/p><p>如果你今天正在哭，你不是屬靈不及格。帖撒羅尼迦人也在大難中；聖靈的喜樂，是在眼淚旁邊坐下來的那一位。爭議與信心的全卷立場見議題「這些爭議該不該影響一個人的信心？」。<\/p>"]],"con":[],"say":"本講義的立場：1:6 是描述，不是對受苦者的命令——大難與聖靈的喜樂同在一節，誰也沒有取消誰；可以流淚，喜樂是知道自己沒有被丟下。為福音受的苦不等於家暴與虐待，不要求人留在暴力裡，也不講成功神學。本講義的全卷立場見議題「受苦、逼迫與家人反對」。","care":"會眾席上可能有因信主被家人冷落、被趕出門的人，有正在經歷家暴、虐待卻以為那是「為主受苦」的人，也有正在憂鬱、焦慮中掙扎的人。不追問細節，不對正在流淚的人說「你要喜樂」「你要有信心」，也不要求他原諒或留下。會後單獨關心；若有人身安全的疑慮，協助他找到安全的地方與專業、法律的協助；面對長期的憂鬱與無望感，陪他尋求專業協助。"},{"id":"ISS01_4","t":"1:9「離棄偶像，歸向神」——華人信主後，家裡的神明、祖先牌位怎麼辦？","r":"1:9；出 20:12；林前 10:20","ch":[1],"why":"對許多華人信徒來說，1:9 不是一節古代經文，而是信主後第一個過年、第一個清明、第一次喪禮就要面對的事：神明桌要不要撤？祖先牌位怎麼辦？拿香、鞠躬可不可以？父母會不會說我「不要祖宗」？處理得不好，信仰的開始就變成家庭的裂痕；處理得好，一個轉身可以成為全家看得見的見證。","pos":[["【一】經文問的是甚麼","","<p>「你們是怎樣離棄偶像，歸向神，要服事那又真又活的神」（1:9）。帖撒羅尼迦信徒大多是外邦人，他們的家裡原本有守護神的神龕、街上有廟、行會要吃祭偶像的飯。原文 ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων，先「向神」，後「離開偶像」。問題是：今天華人家裡的神明、祖先牌位、拿香祭拜，哪些是 1:9 說的偶像？哪些是孝道與記念？信主的人要怎樣轉身，才不是轉身離開家人？<\/p>"],["全面斷絕說：凡與祭祀有關的一律清除、一律不參與","","<p>這一派強調，保羅說外邦人「所獻的祭是祭鬼」（林前 10:20），所以神像、牌位、香爐都應清除；不拿香、不鞠躬、不吃祭物、不參與任何儀式，才是乾淨的轉身。許多早期華人教會與宣教士採取這樣的做法，用意是保守信仰的純正。<\/p><p><strong>難處：<\/strong>常常變成剛信主的人強行清除家人的神像、牌位，甚至在喪禮上與長輩衝突；家人記住的不是又真又活的神，而是「信耶穌就不要祖宗」。這也忽略了「當孝敬父母」（出 20:12）同樣是神的誡命。<\/p>"],["文化相容說：祭祖只是孝道的文化表達，可以照常參與","","<p>另一派認為，祭祖的核心是孝道與記念，與拜偶像不同；就像明末利瑪竇等宣教士在「禮儀之爭」中主張的，上香、鞠躬可以理解為對先人的敬意，不必視為宗教敬拜，基督徒可以照常參與，以免阻礙家人接受福音。<\/p><p><strong>難處：<\/strong>實際的祭祖儀式中，常常包括向亡靈祈求保佑、供奉飲食給亡者享用等信念，很難完全與宗教敬拜分開；若一律照舊，1:9「離棄偶像」的轉身就可能變得模糊。<\/p>"],["分辨與替代說：不拜，但更孝；用新的方式記念","","<p>許多華人教會採取中間的路：自己不再拜神明、不向亡者祈求，但以更積極的方式盡孝與記念——回家過節第一個到、最後一個走；清明掃墓獻花、鞠躬致意、說出先人的故事；喪禮中以追思、感恩代替祭拜。家中的神像與牌位，屬於自己的，可以在合適的時候用尊重的方式處理；屬於家人的，不強拆、不破壞，而是用生命與禱告等候。<\/p><p><strong>難處：<\/strong>界線需要在每個家庭裡具體分辨（例如「鞠躬可以、拿香不行」的判斷，各教會不一），初信者需要有人陪著判斷，否則容易兩頭不是人。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「分辨與替代」：不拜偶像，但盡孝、記念、感恩；用溫柔與孝順作見證，不用對抗。<\/strong>1:9 的字序是先「向神」，再「離開偶像」——轉身是被神吸引過去，不是先砸了甚麼來證明。屬於家人的神明與牌位不強拆；喪禮、祭祖的具體做法，可與牧者、家人一起商量。<\/p><p>祭祖與喪禮的全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」；家人反對的處理見議題「受苦、逼迫與家人反對」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：基督徒只敬拜又真又活的神，也都同意要孝敬父母；爭的是在具體的儀式裡，界線畫在哪裡。<\/p><p>帖撒羅尼迦人的轉身會被各處傳開，是因為鄰居看見了一個改變的生命。你家裡的人也一樣：他們會先看你怎樣待他們，再決定要不要聽你信的是誰。爭議與信心的全卷立場見議題「這些爭議該不該影響一個人的信心？」。<\/p>"]],"con":[],"say":"本講義的立場：不拜偶像，但盡孝、記念、感恩；屬於家人的神明與牌位不強拆，用改變的生命與孝順作見證，不用對抗。本講義的全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」（祭祖與喪禮）與議題「受苦、逼迫與家人反對」（家人反對）。","care":"會眾席上可能有剛信主、正為過年回家發愁的人，有因為不拿香被長輩罵「不孝」的人，也有父母沒有信主就過世、心裡一直內疚自己當年怎麼處理喪禮的人。不要叫初信者回家去拆、去燒，也不要說「你的祖先都在地獄」。陪他一起想：這一次回家，可以怎樣更孝敬；對已經和家人起衝突的人，陪他回去修補關係；對為過去的喪禮內疚的人，告訴他神看得見他的心，並把亡者交在神的手中。"},{"id":"ISS01_5","t":"1:10「救我們脫離將來忿怒」——慈愛的神為甚麼有忿怒？","r":"1:10；5:9；羅 1:18；羅 5:9","ch":[1],"why":"很多人聽到「神的忿怒」就想到一個脾氣暴躁、隨時要懲罰人的神，這和「神就是愛」似乎矛盾；也有人被「將來的忿怒」嚇怕了，或被人用它來恐嚇信主。1:10 是本卷第一次提到忿怒，而且是在一間嬰孩教會的信仰摘要裡。這一題關係到人怎樣認識神，也關係到我們傳福音的方式——是用愛邀請，還是用恐懼逼迫。","pos":[["【一】經文問的是甚麼","","<p>「等候他兒子從天降臨，就是他從死裡復活的－那位救我們脫離將來忿怒的耶穌」（1:10）。原文 τὸν ῥυόμενον ἡμᾶς ἐκ τῆς ὀργῆς τῆς ἐρχομένης：「救」與「來」都是現在分詞——忿怒正在來，拯救已經在進行。問題是：ὀργή（orgē）是指神位格性的怒氣，還是指罪自然帶來的後果？一位慈愛的神，怎麼會有忿怒？<\/p>"],["位格忿怒說：忿怒是神聖潔公義對罪的反應","","<p>古典的讀法認為，神的忿怒是神自己對罪與不義認真的、位格性的反應：「原來，神的忿怒從天上顯明在一切不虔不義的人身上」（羅 1:18）。它不是情緒失控，而是聖潔的愛對惡的拒絕——一位對惡毫不在意的神，也不可能真的愛受害的人。所以十字架是神自己承擔了這忿怒：「藉著他免去神的忿怒」（羅 5:9）。<\/p><p><strong>難處：<\/strong>若講得只剩忿怒，容易讓人以為神是一位需要被安撫的暴君，耶穌是在一位憤怒的父面前替我們求情；這就把父與子對立起來，忘了是「神愛世人」差了兒子來。<\/p>"],["後果說：忿怒是罪自然帶來的毀壞過程","","<p>二十世紀有學者（如英國的陶德）主張，保羅說的「忿怒」不是神的情緒或態度，而是一個非位格的過程：神任憑人走自己的路，罪就帶來它自己的毀壞與審判。羅馬書 1 章三次說「神任憑他們」，似乎支持這樣的讀法；這一說的用意是避免把神講得像人一樣暴躁。<\/p><p><strong>難處：<\/strong>經文說的是「神的忿怒」，而且是「將來」的、與主來臨相連的；把它完全變成一個自然過程，就難以解釋聖經中神親自審判的語言，也會讓審判失去它的道德嚴肅性。<\/p>"],["只講愛說：忿怒是舊約的形象，新約的神只有愛","","<p>還有一種常見的講法認為，忿怒是舊約的神觀，新約啟示的神只有愛，所以今天不必再講忿怒，只需要講接納與包容。這一說出於對受傷者的體貼，不希望人再被「神會懲罰你」嚇壞。<\/p><p><strong>難處：<\/strong>這與新約本身不合——講「神愛世人」的約翰福音也說「神的震怒常在他身上」（約 3:36），新約最早的這封信第一章就提到忿怒。把忿怒取消，也就把拯救的意思取消了；而且受過不公的人反而失去了「神會為公義作主」的盼望。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採位格忿怒說，但落點放在 1:10 自己放的地方：拯救。<\/strong>神的忿怒是聖潔的愛對罪與不義的拒絕；而 1:10 的主詞是耶穌——「救我們」的那一位，現在分詞，已經在救。本卷第 5 章說完這句話：「因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救」（5:9）。<\/p><p>所以 1:10 不是拿來恐嚇人的。不用將來的忿怒嚇人信主，不用它來推算主來的日子；給信徒的末世論是一個應許（全卷立場見議題「主再來、被提與末世時間表」）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該——應該讓你更安心。一位對罪與不義沒有忿怒的神，也無法為被欺負的人伸冤；一位有忿怒卻親自來救人的神，才是福音。<\/p><p>你等候的那一位，就是救你的那一位。讀完 1:10，你應該更想念主來，而不是更害怕主來。爭議與信心的全卷立場見議題「這些爭議該不該影響一個人的信心？」。<\/p>"]],"con":[],"say":"本講義的立場：神的忿怒是聖潔的愛對罪與不義的拒絕，不是情緒失控；但 1:10 的落點是拯救——耶穌現在就在救我們，神預定我們得救（5:9）。不用忿怒恐嚇人信主，也不據此推算日子。本講義的全卷立場見議題「主再來、被提與末世時間表」。","care":"會眾席上可能有從小被「神會懲罰你」嚇大的人，有在嚴厲、暴怒的父親底下長大、一聽到「神的忿怒」就發抖的人，也有被人用「末日審判」逼著信主、至今仍活在恐懼裡的人。不要用忿怒恐嚇人，也不要說「你不信就等著受審判」。陪他們先看見那位「救我們」的耶穌；對有創傷的人，不要急著糾正他的神觀，先陪伴，必要時協助尋求專業協助。"},{"id":"ISS01_6","t":"新約最早的一封信？帖撒羅尼迦前書與加拉太書孰先，有甚麼關係？","r":"1:1；加 2:1；徒 15:2","ch":[1],"why":"常聽到「帖撒羅尼迦前書是新約最早的一卷書」，也有人說加拉太書更早。這個問題看起來只是年代學，卻關係到我們怎樣讀保羅：他在最早的書信裡已經怎樣稱呼耶穌、怎樣講主的再來；也提醒我們，新約的第一封信是寫給一間嬰孩教會的家書。這一題要讓會眾知道學界的討論，卻不被它困住。","pos":[["【一】經文問的是甚麼","","<p>「保羅、西拉、提摩太寫信給帖撒羅尼迦在父神和主耶穌基督裡的教會」（1:1）。這封信自己沒有寫年代，但從內容可以推算：保羅剛在第二次旅行中被趕離帖撒羅尼迦（〔背景〕徒 17:1–10），到雅典、再到哥林多，提摩太回來報告之後不久寫成，約主後 50–51 年。加拉太書的年代則因收信人是「南加拉太」還是「北加拉太」而有很大差別。問題是：哪一封才是保羅最早的信？<\/p>"],["帖前最早說：主後 50–51 年，新約最早的一卷","","<p>許多學者認為加拉太書寫於第三次旅行期間（約主後 53–57 年），所以帖撒羅尼迦前書是保羅現存最早的書信，也是新約最早寫成的一卷。照這一說，新約的第一封信是三人署名、寫給一間幾個禮拜大的教會，信中已經稱耶穌為「主」、與父神並列，已經在等候他從天降臨。<\/p><p><strong>難處：<\/strong>這一說倚重「北加拉太說」或較晚的年代推算；若加拉太書寫給第一次旅行建立的南加拉太教會，它就可能比帖撒羅尼迦前書更早。<\/p>"],["加拉太書較早說：主後 48–49 年，耶路撒冷會議以前","","<p>另一些學者主張「南加拉太說」：加拉太書寫給第一次旅行建立的教會，而且寫在使徒行傳 15 章耶路撒冷會議以前——因為加拉太書沒有提到會議的決議；加 2:1 的上耶路撒冷，也可能是徒 11 章送救濟的那一次，而不是徒 15 章「為所辯論的，上耶路撒冷去見使徒和長老」（徒 15:2）那一次。若是如此，加拉太書就是新約最早的一卷。<\/p><p><strong>難處：<\/strong>加 2 章與徒 15 章的內容有許多相似之處，許多學者仍認為兩者說的是同一次；年代的重建倚賴多項推論，至今沒有定論。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：帖撒羅尼迦前書是新約最早的一卷，或最早的兩卷之一；與加拉太書孰先，學界未定，本講義不定先後。<\/strong>作者是保羅，與西拉、提摩太一同署名；寫於哥林多，約主後 50–51 年（全卷立場見議題「作者、寫作地點與年代」）。加拉太書的年代見加拉太書講義議題「受苦、逼迫與家人反對」。<\/p><p>無論哪一封在前，這兩封信放在一起很動人：一封為恩典爭戰，一封為嬰孩教會的等候安慰——都是福音最早的聲音。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這個判斷不影響解經：兩派都同意帖撒羅尼迦前書寫在耶穌受死復活之後二十年左右，而且信中已經敬拜耶穌為主、等候他再來。<\/p><p>對你今天最重要的，不是背下哪一封排第一，而是記得：神寫給教會最早的信裡，有一封是寫給剛信主、被反對、只有一點點的人。如果你也是這樣，這封信是先寫給你的。爭議與信心的全卷立場見議題「這些爭議該不該影響一個人的信心？」。<\/p>"]],"con":[],"say":"本講義的立場：帖撒羅尼迦前書是新約最早的一卷，或最早的兩卷之一（約主後 50–51 年，寫於哥林多）；與加拉太書孰先學界未定，本講義不定先後，這不影響解經。本講義的全卷立場見議題「作者、寫作地點與年代」。","care":"會眾席上可能有對聖經成書過程感到好奇、卻擔心「年代有爭議就表示聖經不可靠」的人，也有覺得這種討論離生活太遠的人。不要在講台上把年代學講成炫耀學問，也不要嘲笑提問的人。陪前者看見：最早的信就已經敬拜耶穌為主，這反而堅固信心；對後者，帶他回到 1:1 那一行地址——在父神和主耶穌基督裡。"},{"id":"ISS02_1","t":"2:4「不是要討人喜歡」——傳道人、基督徒可以在乎別人的看法嗎？","r":"2:3--6；加 1:10；林前 10:33；羅 15:2","ch":[2],"why":"華人文化很重面子與人情，教會也常聽到兩種極端：一種人把 2:4 當成「我只對神負責，不必理會你們的意見」，拒絕一切回饋；另一種人一直活在別人的眼光裡，怕被說、怕被比較，連服事都是為了被看見。保羅在別處又說「我凡事都叫眾人喜歡」，這兩句話怎麼放在一起，關係到我們怎樣當領袖、也怎樣當一個健康的人。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「不是要討人喜歡，乃是要討那察驗我們心的神喜歡」（2:4）。背景是他被連夜送走以後，城裡有人把他歸成到處騙錢的巡迴演說家。他攤開三樣「有己的事奉」：諂媚的話（嘴）、藏著的貪心（錢）、求人的榮耀（名）。ἀρέσκοντες 是「討好、取悅」。問題是：保羅在這裡是叫人不要在乎別人，還是叫人不要被別人的眼光牽著走？他在林前 10:33 又說自己「凡事都叫眾人喜歡」，兩處是不是矛盾？<\/p>"],["只向神交帳說：人的看法不重要","","<p>有些講法強調 2:4 與「我豈是討人的喜歡嗎？若仍舊討人的喜歡，我就不是基督的僕人了」（加 1:10）：福音的僕人只向神交帳，人的掌聲與批評都不該影響他。這一說保護了講台的誠實，不叫傳道人為了奉獻與人數把信息講軟。<\/p><p><strong>難處：<\/strong>這一讀容易滑成拒絕一切回饋，甚至把每一次被批評都當成「為主受苦」；而保羅自己在同一章裡一再請帖撒羅尼迦人作見證（2:5、2:10），顯示他非常在意人怎樣看他的行事——只是他不靠討好來得到認可。<\/p>"],["動機與目的說：可以叫人喜歡，但不可以討好人","","<p>另一些學者指出，保羅反對的是以討好為動機、以自己為目的的事奉；他贊成的是為了別人的益處而體貼人：「我們各人務要叫鄰舍喜悅，使他得益處，建立德行」（羅 15:2）。同一個字 ἀρέσκω，方向不同意義就不同：為了自己被接納而取悅人，是怕；為了別人得救而體貼人，是愛。<\/p><p><strong>難處：<\/strong>動機藏在心裡，自己也常看不清，這一說需要一位「察驗人心的神」來分辨，不能只靠自我宣稱「我是為了你好」；否則同樣可以替討好人或操控人找藉口。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採動機與目的說：在乎人，是愛；討好人，是怕。<\/strong>保羅不靠諂媚、不藏貪心、不求榮耀，但他極在乎人——請人作見證、極力想見他們的面、把性命也給出去。2:4 的核心不是「不必理會人」，而是「交帳的對象只有一位」：因為只向一位察驗人心的神交帳，所以可以不必向一千個人演戲，也因此能說真話、聽批評。<\/p><p>這也是書信三問的落點：處境是被人中傷的創辦人；原則是事奉的動機要在神面前被驗過；今天落在每一個在講台、職場、社群媒體上被眼光牽著走的人身上。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一題要處理的不是教義的對錯，而是心裡的方向。若你發現自己很怕別人的眼光，不必先責備自己，這正是 2:4 要把你帶回去的地方：有一位神已經「驗中」了你，把福音託付你，你不必再用別人的讚來證明自己。<\/p><p>若你是領袖，2:4 不是盾牌，而是邀請：讓神先察驗你，你就有勇氣讓人也來察驗你。書信的處境與原則見全卷立場議題「書信的處境與原則」。<\/p>"]],"con":[],"say":"本講義的立場：2:4 不是叫人不在乎人，而是叫人只向一位察驗人心的神交帳——在乎人是愛，討好人是怕；保羅不討好人，卻請人作見證、把性命也給出去。本講義的全卷立場見議題「書信的處境與原則」。","care":"會眾席上有兩種人會因這一題受傷：一種是長期活在別人眼光裡、很怕犯錯的人，聽到「討人喜歡就不是基督的僕人」會更自責；另一種是曾被領袖拿 2:4 當擋箭牌、提出意見就被說「不屬靈」的人。對前者，先講神已經驗中他、接納他；對後者，承認他的意見值得被聽，不要說「你這是在論斷屬靈領袖」。"},{"id":"ISS02_2","t":"2:6--9「可以叫人尊重」「晝夜做工」——傳道人的權柄與薪資：保羅為甚麼不收他們的錢？","r":"2:6--9；林前 9:12--18；帖後 3:8--9；提前 5:17--18","ch":[2],"why":"教會常為傳道人的薪資與待遇爭論：有人用 2:9 說「好的傳道人應該不收錢、自己養自己」，有人用 2:6 說「傳道人有權柄，會眾應該供養、應該尊重」。保羅在別處明說傳福音的可以靠福音養生，在帖撒羅尼迦卻晝夜做工、分文不取，這中間的判斷理由，正是書信三問最好的練習。","pos":[["【一】經文問的是甚麼","","<p>「我們作基督的使徒，雖然可以叫人尊重」（2:6），原文 ἐν βάρει εἶναι，可以有分量；βάρος 也可以指「成為負擔」，要求供養。接著保羅說：「晝夜做工，傳神的福音給你們，免得叫你們一人受累」（2:9），ἐπιβαρέω 與 βάρος 同字根。問題是：保羅不收錢，是因為傳道人本來就不該收錢，還是他在這個處境中放下了一個本來有的權利？<\/p>"],["原則說：傳道人應該帶職、自養，不收教會的錢","","<p>有些人把 2:9 與「我這兩隻手常供給我和同人的需用」（徒 20:34）當作原則：傳道人最好像保羅一樣有一份職業，不靠教會供養，才不會被奉獻綁住、才能說真話。這一說提醒教會，傳道不是一份工作的保障，而是一份託付。<\/p><p><strong>難處：<\/strong>保羅自己明說「主也是這樣命定，叫傳福音的靠著福音養生」（林前 9:14），也教導「那勞苦傳道教導人的，更當如此」（提前 5:17）。把 2:9 當作普遍規條，會與保羅自己的教導衝突，也讓會眾輕看供養工人的責任。<\/p>"],["權利說：傳道人有權受供養，保羅是放下權利","","<p>多數學者認為：使徒有權受供養，這權利是真的；保羅在帖撒羅尼迦放下了它，是處境中的選擇。他自己解釋：「這並不是因我們沒有權柄，乃是要給你們作榜樣，叫你們效法我們」（帖後 3:9），又說「我們沒有用過這權柄，倒凡事忍受，免得基督的福音被阻隔」（林前 9:12）。在一個有人中傷他騙錢、信徒又在受逼迫的城裡，不收錢是保護福音。<\/p><p><strong>難處：<\/strong>這一說若講得太快，容易變成「傳道人什麼都有權拿」，忽略保羅放下權利的榜樣；也可能讓教會把傳道人的清貧當成理所當然。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採權利說：傳道人有權受供養，這是主的命定；保羅在帖撒羅尼迦放下這權利，是為了福音不被阻隔、為了不叫嬰孩教會受累。<\/strong>原則是：權柄是用來餵養的，不是用來壓人的；用不用一項權利，要看怎樣對福音最好、對最軟弱的人最好。<\/p><p>因此今天的落點有兩面：會眾當公平、甘心地供養傳道人，「工人得工價是應當的」（路 10:7）；傳道人當像保羅一樣，不藏貪心、帳目透明，必要時願意放下自己可以要的東西。屬靈權柄的全卷討論回指哥林多後書立場三。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一題不是在問誰比較屬靈，而是在問怎樣讓福音不被阻隔。看見有傳道人收入不錯，不必立刻懷疑他；看見有傳道人帶職辛苦，也不必把他當成唯一的榜樣。<\/p><p>要問的是：這位工人是否「沒有藏著貪心」（2:5），他的權柄是否可以被檢驗？而你自己，是否願意分擔供養的責任？書信的處境與原則見全卷立場議題「書信的處境與原則」。<\/p>"]],"con":[],"say":"本講義的立場：傳道人有權受供養（林前 9:14），保羅在帖撒羅尼迦放下這權利，是處境中為了福音不被阻隔的選擇，不是給所有傳道人的規條；原則是權柄用來餵養、帳目要經得起察驗。本講義的全卷立場見議題「書信的處境與原則」；屬靈權柄回指哥林多後書立場三。","care":"會眾席上可能坐著收入微薄、長期被要求「為主犧牲」的傳道人家庭，也可能有因教會財務不透明而受傷、從此不敢奉獻的人。不要在講台上用 2:9 暗示「領薪水的不屬靈」，也不要用 2:6 要求會眾無條件供奉。牧者要陪傷心的人看見：財務透明是保護所有人，提出疑問不是背叛，傳道人的家人也需要被照顧。"},{"id":"ISS02_3","t":"2:7「溫柔」還是「嬰孩」？——一個字母的異文，該怎麼讀？","r":"2:7","ch":[2],"why":"2:7 是新約裡最有名的異文之一：古抄本有的寫 ἤπιοι（溫柔），有的寫 νήπιοι（嬰孩），只差一個字母 ν。和合本照「溫柔」翻譯，但有些現代譯本改成「嬰孩」。會眾讀到不同譯本，常會問：聖經到底寫的是哪一個？這會不會表示聖經不可靠？","pos":[["【一】經文問的是甚麼","","<p>「只在你們中間存心溫柔，如同母親乳養自己的孩子」（2:7）。原文前一個字是 ἐγενήθημεν，以 ν 結尾；下一個字若是 ἤπιοι，讀成「我們成了溫柔的」；若是 νήπιοι，讀成「我們成了嬰孩」。抄寫的時候，ν 多寫一次或少寫一次都很容易。問題是：哪一個是保羅原來寫的？兩種讀法對這一節的意思有甚麼影響？<\/p>"],["「溫柔」說（ἤπιοι；SBLGNT、和合本、NIV 1984）","","<p>支持「溫柔」的理由主要是上下文：一個溫柔的人，像乳母餵奶，意象連貫；而且 νήπιος 在保羅筆下多半是負面的「不成熟」（如林前 3:1 的「在基督裡為嬰孩的」），很難想像保羅用它形容使徒自己。SBLGNT 與和合本都採這個讀法。<\/p><p><strong>難處：<\/strong>「溫柔」的抄本支持較晚、較少；而且正因為意思通順，抄寫者較可能把難讀的「嬰孩」改成順口的「溫柔」，這在經文鑑別上是對它不利的。<\/p>"],["「嬰孩」說（νήπιοι；WH、NA28）","","<p>支持「嬰孩」的理由主要是抄本：較早、較多的重要抄本作 νήπιοι；它也是「較難的讀法」——一句之內使徒、嬰孩、乳母三個意象連換，抄寫者較可能把它改順，而不是把順的改難。若照此讀，保羅是說：我們本可以擺使徒的架子，卻在你們中間成了像嬰孩一樣不設防、不用心機的人。<\/p><p><strong>難處：<\/strong>同一句裡保羅先是嬰孩、緊接著又是乳母，意象跳得很急；νήπιος 在保羅書信中幾乎都帶負面意思，用在這裡需要額外的解釋。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義照和合本與 SBLGNT 讀「溫柔」，但並陳「嬰孩」，不把任何一讀說成定論。<\/strong>兩派都承認光憑抄本無法完全決定；而兩個讀法的落點相同：可以叫人尊重的使徒，選擇了最小、最軟的位置——不是在你們上面，而是「在你們中間」。無論是溫柔的乳母，還是不設防的嬰孩，都是放下分量。<\/p><p>講台上一句帶過即可：「這裡有一個字的抄本差異，本講義的議題頁有細講。」<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約的抄本數量遠超過任何古代文獻，大多數異文像這一處一樣，是一個字母、一個字序的差別，而且沒有一個異文動搖任何核心信仰。正因為我們有這麼多抄本可以比對，才知道這裡有差別、也知道差別有多大。<\/p><p>這一處異文反而讓我們看見：無論哪一個讀法，聖靈要我們看見的那個放下權柄的畫面都沒有改變。爭議與信心見全卷立場議題「這些爭議該不該影響一個人的信心？」。<\/p>"]],"con":[],"say":"本講義的立場：2:7 照和合本與 SBLGNT 讀「溫柔」（ἤπιοι），並陳 WH、NA28 的「嬰孩」（νήπιοι）；兩讀落點相同——使徒放下權柄，選擇最小、最軟的位置。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有剛開始讀不同譯本、第一次發現「聖經有不同抄本」而心裡動搖的人，也可能有被網路上「聖經被竄改」的說法困擾的慕道朋友。不要嘲笑這種疑問，也不要用「這不重要」敷衍過去。陪他看見異文是怎麼被發現的、範圍有多小，再陪他回到這一節的畫面：神的話經得起被檢查。"},{"id":"ISS02_4","t":"2:7、11「母親」「父親」——屬靈父母可不可以變成控制？屬靈遮蓋與屬靈虐待怎麼分辨？","r":"2:7--12；3:8；5:12--13；5:21；林前 4:15；林後 1:24；彼前 5:3","ch":[2],"why":"2:7–11 是全本新約最溫柔的屬靈父母畫面，也是最容易被拿反的經文。有些群體用「屬靈父親」「屬靈遮蓋」要求絕對順服、不准提問、控制婚姻、工作與金錢，離開就被說成悖逆。這一題直接關係到會眾的安全，也關係到 321「屬靈父母兒女」能不能被正確地活出來。","pos":[["【一】經文問的是甚麼","","<p>保羅說自己「如同母親乳養自己的孩子」（2:7），又「好像父親待自己的兒女一樣」（2:11），勸勉、安慰、囑咐。他在別處也說「師傅雖有一萬，為父的卻是不多」（林前 4:15）。問題是：屬靈父母的權柄是甚麼樣的權柄？它的範圍到哪裡？兒女要順服到甚麼程度？當一個屬靈關係開始讓人害怕、不敢提問，經文給我們甚麼判斷的標準？<\/p>"],["遮蓋順服說：屬靈父親有權柄，兒女要順服他的遮蓋","","<p>有些教導從 2:11 與 5:12–13「敬重那在你們中間勞苦的人」推出一套屬靈遮蓋的架構：每一位信徒都要在一位屬靈父親之下，接受他的指導與保護；不在遮蓋之下，就容易被仇敵攻擊。這一說看重屬靈傳承、看重被牧養，也提醒個人主義的信仰需要群體。<\/p><p><strong>難處：<\/strong>經文裡沒有「屬靈遮蓋」這個詞與架構；5:13 敬重的理由是「因他們所做的工」，不是因為他們的地位。這一說若沒有界線，容易變成控制：要求絕對順服、干涉私人決定、把提問當成悖逆，正是彼前 5:3「也不是轄制所託付你們的」所禁止的。<\/p>"],["餵養陪伴說：屬靈父母的權柄是放下、餵養、使人站穩","","<p>另一種讀法從 2:6–9 的次序來看：保羅可以有分量，卻選擇放下；他的權柄表現在餵養、自己做工、請人作見證（2:10）。目標是孩子「靠主站立得穩」（3:8），不是離不開。保羅自己說：「我們並不是轄管你們的信心，乃是幫助你們的快樂，因為你們憑信才站立得住」（林後 1:24）；他還教教會「凡事察驗」（5:21），講台也在其中。<\/p><p><strong>難處：<\/strong>這一說若講得太快，可能讓人輕看屬靈長輩的勸戒、凡事只聽自己；保羅的父親也會「囑咐」，原文是鄭重見證，把話說重。餵養不等於放任。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採餵養陪伴說：屬靈父母的權柄是用來餵養的，不是用來壓人的；它的果子是兒女自己會讀經、會禱告、會向神負責。<\/strong>敬重是因為勞苦的工作（5:13），不是因為頭銜；任何屬靈權柄都要可以被檢驗（2:10；5:21）。<\/p><p>分辨的標準可以很具體：這個關係讓我越來越認識主，還是越來越怕某一個人？我可以提問、可以說不、可以離開，而不被威嚇嗎？我的婚姻、金錢、工作與身體，是我在神面前負責的，還是要交給某個人決定？若答案是後者，那已經是屬靈虐待，要找信得過的人說出來。屬靈權柄的全卷討論回指哥林多後書立場三。<\/p>"],["【四】這件事該不該影響你的信心","","<p>若你曾在一個屬靈關係裡受傷，那不是你信心不夠，也不是神的心意。2:7 的母親、2:11 的父親，正是被誤用的那一位領袖應該成為、卻沒有成為的樣子。神仍然是那位「召你們進他國、得他榮耀的神」（2:12），你可以直接到他面前。<\/p><p>若你是帶人的人，這一題不是叫你不敢帶人，而是叫你常常問：我是在餵，還是在抓？書信的處境與原則見全卷立場議題「書信的處境與原則」。<\/p>"]],"con":[],"say":"本講義的立場：屬靈父母的權柄是放下、餵養、自己做工，目標是孩子靠主站立得穩（3:8），不是離不開；敬重是因為勞苦的工作（5:13），任何權柄都要經得起察驗（5:21）；「絕對順服」、「質疑就是悖逆」不是 2:7–11。屬靈權柄回指哥林多後書立場三；本講義的全卷立場見議題「書信的處境與原則」。","care":"會眾席上可能有曾在教會或屬靈團體裡被控制、被羞辱、被要求絕對順服的人，有些人至今聽到「屬靈父親」就會發抖，也可能有正在這樣的關係裡、還不敢說出來的人。不追問細節、不要求他立刻原諒、不說「你要順服才有祝福」。會後單獨關心，陪他找一位安全、可信任的屬靈同伴；涉及性、金錢或人身控制，協助尋求專業與法律協助。"},{"id":"ISS02_5","t":"2:9「晝夜做工」——帶職事奉與全職事奉，哪一個比較屬靈？","r":"2:9；4:11；徒 18:3；徒 20:34；林前 9:14","ch":[2],"why":"華人教會常不自覺地把全職傳道看成「最屬靈的道路」，把在職場上班的信徒看成次一等的「平信徒」；也有人反過來，用保羅織帳棚說「全職傳道是靠教會吃飯」。這一題關係到大多數在職場的弟兄姊妹怎樣看自己的工作，也關係到教會怎樣看待所有的工人。","pos":[["【一】經文問的是甚麼","","<p>「你們記念我們的辛苦勞碌，晝夜做工，傳神的福音給你們」（2:9）。ἐργαζόμενοι（做工）與 ἐκηρύξαμεν（傳）並排：保羅一邊做工、一邊傳。使徒行傳記他「因與他們同業，就和他們同住做工」（徒 18:3）。問題是：保羅帶職，是更高的榜樣，還是一個處境中的選擇？全職與帶職，有沒有屬靈高低？<\/p>"],["帶職優先說：保羅的帶職事奉是更好的模式","","<p>有些人主張保羅的帳棚事奉是新約的範本：傳道人與信徒一樣在職場中生活，更了解會眾的處境、不依賴教會、也把福音帶進作坊與市場。今天許多宣教工場、植堂與創啟地區，正是用帶職的方式把福音傳進去。<\/p><p><strong>難處：<\/strong>保羅並沒有說帶職比較屬靈，他也接受過腓立比教會的供應（腓 4:16），後來在哥林多，西拉和提摩太來了以後，他更專心傳道（徒 18:5）。把帶職說成唯一的範本，會讓全職同工被輕看，也忽略教會供養的責任。<\/p>"],["全職優先說：專心傳道是更高的呼召","","<p>另一些人強調使徒「專心以祈禱傳道為事」（徒 6:4）的榜樣：教會需要有人全時間投入教導與牧養，這是神的呼召；全職服事的人放下職業與收入，是更大的委身。這一說提醒教會珍惜專職的工人，也正確地看重教導與牧養的分量。<\/p><p><strong>難處：<\/strong>這一說若變成屬靈階級，會讓在職場的信徒以為自己的工作「只是謀生」，也讓全職同工背上「比較屬靈」的重擔；經文從沒有把呼召分成高低兩等。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：沒有哪一種比較屬靈；全職與帶職都是神的呼召，判斷的標準是怎樣讓福音不被阻隔、不叫人受累。<\/strong>保羅在帖撒羅尼迦帶職，是處境中的選擇；在別處接受供應，也是處境中的選擇。原則是同一個：福音要連同生命一起給出去。<\/p><p>4:11 保羅還吩咐所有信徒「親手做工」——工作本身就是見證。你的辦公桌、店面、教室、廚房，都可以是傳福音的地方。書信的處境與原則見全卷立場議題「書信的處境與原則」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你在職場，請你知道你不是二等基督徒；你每天的工作，連同你在工作中的誠實、忍耐與關心人，都是在「晝夜做工，傳神的福音」。若你是全職同工，也請你知道你的價值不在於比別人犧牲更多，而在於被神託付。<\/p><p>不論哪一條路，問題都是同一個：我把甚麼給出去了？我有沒有叫別人因我受累？<\/p>"]],"con":[],"say":"本講義的立場：全職與帶職都是神的呼召，沒有屬靈高低；保羅帶職是處境中為了福音不被阻隔、不叫人受累的選擇，原則是福音連同生命一起給出去，工作本身就是見證。本講義的全卷立場見議題「書信的處境與原則」。","care":"會眾席上可能有長年在職場、覺得自己「不夠屬靈」所以不敢服事的人；也可能有因為健康、家庭或經濟而離開全職、心裡覺得自己「退後了」的前任同工；還有失業、找不到工作的人。不要說「你若真愛主就該全職」，也不要說「不工作就是懶惰」。陪每一個人看見，自己所在的位置都可以被神使用。"},{"id":"ISS02_6","t":"2:13「這道實在是神的」——聖經的默示：人寫的，怎麼是神的話？","r":"2:13；提後 3:16；彼後 1:21；徒 17:11","ch":[2],"why":"2:13 是新約最早一段談「神的道」本質的經文之一：帖撒羅尼迦人聽的是保羅的嘴，領受的卻是神的道。今天的會眾也會問：聖經明明是人寫的，有不同的文體、性格與處境，怎麼能說是神的話？這關係到我們怎樣讀經，也關係到神的道今天怎樣在人心裡做工。","pos":[["【一】經文問的是甚麼","","<p>「因你們聽見我們所傳神的道就領受了；不以為是人的道，乃以為是神的道。這道實在是神的，並且運行在你們信主的人心中」（2:13）。原文 λόγον ἀκοῆς παρʼ ἡμῶν τοῦ θεοῦ，「從我們聽來的、神的道」；ἐνεργεῖται（運行）是現在式。問題是：從人的口裡說出來的話，怎麼「實在是神的」？這與我們今天手上的聖經有甚麼關係？<\/p>"],["機械口述說：神逐字口述，人只是記錄的工具","","<p>有些人為了保護聖經的權威，把默示理解成神一字一句口述、作者只是被動地記錄。這一說看重聖經的每一個字都出於神，「聖經都是上帝所默示的」（提後 3:16），不容人隨意增減。<\/p><p><strong>難處：<\/strong>這一說難以解釋聖經作者明顯的個性、文體與處境：保羅在 2:17 說自己想念他們、在 2:18 說自己去不成，這些都是真實的人在真實處境中寫下的話。把作者講成打字機，反而看不見神怎樣使用一個人的生命。<\/p>"],["有機默示說：神感動人，透過人的性格與處境說出神的話","","<p>多數福音派學者採有機默示：「乃是人被聖靈感動，說出上帝的話來」（彼後 1:21）。神使用作者的性格、語言、經歷與處境，所寫的仍然完全是神要說的話。所以帖撒羅尼迦前書既是一封保羅的家書，滿了他的眼淚與想念，也實在是神的道。<\/p><p><strong>難處：<\/strong>這一說需要小心分辨「人的成分」與「神的權威」之間的關係，若講得含糊，可能被誤解為聖經只是「包含」神的話，讀者可以自行挑選哪些部分算數。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採有機默示說：聖經是人寫的，也實在是神的道；神透過真實的人、真實的處境說話，所說的完全可靠。<\/strong>2:13 還多說了一層：神的道不只是被寫下來的，它在人心裡「運行」。帖撒羅尼迦人的創辦人被趕走了，他們手上只剩下聽過的道和一封信，那道卻繼續在受苦的人心中做工。<\/p><p>領受神的道，也包括察驗它——庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11），被稱為「賢於帖撒羅尼迦的人」。察驗不是懷疑神，是認真對待神的話。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。對聖經怎樣被默示，教會有不同的說明方式，但都承認聖經是神的話、有最終的權威。最重要的不是先能解釋所有問題，而是像帖撒羅尼迦人一樣，把它當作神的道來領受，讓它在你裡面運行。<\/p><p>你今天也許身邊沒有牧者、手上只有一本聖經；2:13 告訴你：那就夠了，因為那道會自己做工。爭議與信心見全卷立場議題「這些爭議該不該影響一個人的信心？」。<\/p>"]],"con":[],"say":"本講義的立場：採有機默示——聖經是神感動真實的人在真實處境中寫成的，實在是神的道，完全可靠；它不只被寫下，也在信的人心中運行（2:13）。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有在大學或網路上第一次聽到「聖經是人編的」而動搖的年輕人，也可能有曾被人用經文逐字壓迫、因此害怕讀經的人。不要嘲笑提問的人，也不要只丟一句「你要有信心」。陪前者一起查考，陪後者重新看見：這道是要在他心裡運行、使他得生命的，不是用來壓他的。"},{"id":"ISS02_7","t":"2:14--16「這猶太人殺了主耶穌」——新約反猶太人嗎？","r":"2:14--16；羅 9:3；羅 11:1；約 4:22","ch":[2],"why":"這幾節是新約最常被誤用的經文之一。中世紀與近代歐洲，有人拿「這猶太人殺了主耶穌」當作仇恨、驅逐、屠殺猶太人的理由；今天也有人據此說「新約是反猶的書」。這一題不只是學術問題，關係到教會怎樣對待任何一個民族，也關係到我們有沒有照經文本來的意思讀經。","pos":[["【一】經文問的是甚麼","","<p>保羅說帖撒羅尼迦人「受了本地人的苦害，像他們受了猶太人的苦害一樣」（2:14），接著說「這猶太人殺了主耶穌和先知，又把我們趕出去」（2:15）。原文 2:14 末尾的 τῶν Ἰουδαίων 與 2:15 的一串分詞相連，描寫的是做了這些事的人。問題是：保羅是在指控整個猶太民族，還是在描寫某一群逼迫者？一位猶太人使徒，為甚麼會寫出這樣的話？<\/p>"],["民族指控說：保羅在指控整個猶太民族","","<p>有些讀者（包括一些批評新約的學者）認為，這幾節是對猶太人作為一個民族的整體控訴，反映早期教會與猶太會堂分裂後的敵意；也有少數學者因此主張 2:14–16 是保羅以後的人插入的，因為它與羅馬書 9–11 章的語氣差得太遠。<\/p><p><strong>難處：<\/strong>插入說沒有任何抄本支持，所有現存抄本都有這幾節。民族指控的讀法也無法解釋：寫的人自己是猶太人，2:14 的榜樣正是「猶太中在基督耶穌裡神的各教會」——一群猶太人基督徒；耶穌自己也說「救恩是從猶太人出來的」（約 4:22）。<\/p>"],["逼迫者說：保羅描寫的是攔阻福音的人，不是一個民族","","<p>多數解經者認為，2:15–16 的一串分詞（殺了、趕出、不得喜悅、與人為敵、不許傳道）描寫的是一群做了這些事的人，而不是血統；保羅用的是先知式的責備語言，就像舊約先知責備自己的同胞。這與保羅「為我弟兄，我骨肉之親，就是自己被咒詛，與基督分離，我也願意」（羅 9:3）的心並不衝突。<\/p><p><strong>難處：<\/strong>和合本「這猶太人」的譯法與後人的斷句，容易讓讀者聽成泛指；講解時需要多花一點力氣說明，才不會被片段引用。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採逼迫者說，並明確拒絕任何反猶太人或貶低任何民族的應用。<\/strong>三件事要放在桌上：保羅自己是猶太人；2:14 的榜樣是猶太地的教會；這幾節說的是逼迫者，不是一個民族。把這兩節讀成猶太人被神棄絕、活該受報應，是錯讀，也是違背福音——耶穌在十字架上說的是「父啊！赦免他們；因為他們所做的，他們不曉得」（路 23:34）。<\/p><p>這幾節也照出我們自己：保羅寫這幾句時，一定記得自己從前也是逼迫教會的人。任何人用權力攔阻福音，都站在同一個危險的位置上。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約不是反猶的書：耶穌是猶太人，使徒都是猶太人，最早的教會是猶太人的教會。歷史上教會誤用這幾節造成的傷害是真實的，我們要承認、要悔改，而不是替它辯護。<\/p><p>讀這幾節最好的姿勢不是指著別人，是低頭問自己：我有沒有用手上的權力，攔住了別人親近神？受苦、逼迫與 2:14–16 的全卷立場見議題「受苦、逼迫與家人反對」。<\/p>"]],"con":[],"say":"本講義的立場：2:14–16 說的是殺主、趕走使徒、攔阻福音的逼迫者，不是一個民族；保羅自己是猶太人，2:14 的榜樣是猶太地的教會；本講義明確拒絕任何反猶太人或貶低任何民族的應用。本講義的全卷立場見議題「受苦、逼迫與家人反對」。","care":"會眾席上可能有猶太裔或其他少數族群的朋友、有曾因民族或出身被歧視的人，也可能有在海外生活、深知被當成「外人」滋味的華人。講台上不要開任何民族的玩笑，不要說「他們就是這樣」。若有人因這幾節受傷或對信仰起了疑問，會後單獨陪他讀羅馬書 9–11 章，讓他看見保羅為同胞流淚的心。"},{"id":"ISS02_8","t":"2:16「神的忿怒臨在他們身上已經到了極處」——是指甚麼？神棄絕以色列了嗎？","r":"2:16；羅 11:1；羅 11:28--29；創 15:16","ch":[2],"why":"2:16 的末句常被拿來說「神已經永遠棄絕了以色列」，也常被拿來對號入座某一場歷史災難或今天的中東新聞。這一句的原文有補字、有幾種讀法，又牽涉到保羅在羅馬書 11 章對以色列前途的教導；講錯了，一頭落進反猶，一頭落進末世時間表。","pos":[["【一】經文問的是甚麼","","<p>「常常充滿自己的罪惡。神的忿怒臨在他們身上已經到了極處」（2:16）。原文是 ἔφθασεν δὲ ἐπʼ αὐτοὺς ἡ ὀργὴ εἰς τέλος，只說「那忿怒」，「神的」是和合本補的小字；εἰς τέλος 可讀「到了極處」「終於」「直到末了」；ἔφθασεν 是不定過去式「已經臨到」。問題是：這忿怒指的是甚麼？是一件歷史事件，是末日的審判，還是神對以色列最終的棄絕？<\/p>"],["歷史事件說：指保羅當時已經發生的某件災禍","","<p>有些學者根據 ἔφθασεν 的不定過去式，認為保羅指的是一件已經發生的事，例如主後 49 年羅馬皇帝驅逐猶太人、或當時猶太地的饑荒與動亂。也有人認為這是後人在主後 70 年聖殿被毀後的回顧，並以此支持插入說。<\/p><p><strong>難處：<\/strong>沒有一件事件能被確定；插入說也沒有抄本支持。把一件歷史災難說成「神的忿怒臨到猶太人」，很容易被延伸成「猶太人的苦難都是報應」，這正是歷史上反猶主義的推論。<\/p>"],["先知式宣告說：忿怒必定臨到攔阻福音的人，但不是最終棄絕","","<p>另一些解經者把 ἔφθασεν 讀成先知式的過去式：在神眼中確定要發生的事，就像已經發生一樣。這使我們想起創 15:16：「亞摩利人的罪孽還沒有滿盈」（創 15:16）——神忍耐、給時間，攔阻別人得救卻是把罪的量杯一直往上填。這忿怒是對攔阻福音的人，不是對一個民族；而且保羅後來清楚說：「上帝棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）<\/p><p><strong>難處：<\/strong>「先知式過去式」的讀法需要從上下文推斷，不是文法上唯一的可能；而 2:16 的語氣確實比羅馬書 11 章嚴厲，兩處要一起讀才不會偏。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：「神的」補字意思正確，εἰς τέλος 幾種讀法並陳；這忿怒是神對攔阻福音之人的審判，原則對誰都一樣，包括外邦人，也包括教會；它不是神對以色列的最終棄絕。<\/strong>保羅自己說：「就著揀選說，他們為列祖的緣故是蒙愛的」（羅 11:28），「因為上帝的恩賜和選召是沒有後悔的」（羅 11:29）。<\/p><p>講台上不把這一句對號入座任何歷史事件、任何國家或新聞；以色列的末世角色與時間表屬於全卷立場議題「主再來、被提與末世時間表」的範圍，本章不另立說法。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一句提醒我們神的公義是真實的，攔阻人得救是嚴重的事；但它沒有把神的慈愛收回。同一位神，在羅馬書 11 章仍然向以色列伸出手，也在今天向每一個人伸出手。<\/p><p>若你聽過有人用這一節說某個民族「活該」，或把它和新聞配在一起，請你記得：審判在神手裡，不在我們手裡。受苦與 2:14–16 的全卷立場見議題「受苦、逼迫與家人反對」。<\/p>"]],"con":[],"say":"本講義的立場：「神的」是和合本補字、意思正確，εἰς τέλος 幾讀並陳；這忿怒是對攔阻福音之人的審判，不是神對以色列的最終棄絕（羅 11:1、29），也不對號入座任何時事。本講義的全卷立場見議題「受苦、逼迫與家人反對」；末世時間表見議題「主再來、被提與末世時間表」。","care":"會眾席上可能有對中東局勢有強烈情緒、或曾聽過「這是預言應驗」講道而焦慮的人，也可能有猶太裔或與以色列有關係的朋友。不要在講台上把新聞配上經文，不要說任何民族「活該」。若有人因為末世的講法而恐慌，會後陪他回到 5:9 的應許與 4:18 的安慰，讓他看見神的心是救人。"},{"id":"ISS02_9","t":"2:18「撒但阻擋了我們」——怎麼分辨是撒但攔阻，還是神關門？","r":"2:17--18；徒 16:6--7；林前 16:9；林後 2:12--13；羅 8:28","ch":[2],"why":"基督徒遇到計畫受阻——簽證被拒、工作沒談成、病倒、宣教行程取消——常常馬上問：這是撒但攔阻，要繼續爭戰？還是神關門，要順服停下？兩種判斷都有人用來替自己的決定背書，也有人因此活在驚慌或自責裡。保羅在這一節與使徒行傳 16 章給了兩個不同的讀法，值得放在一起看。","pos":[["【一】經文問的是甚麼","","<p>「我－保羅有一兩次要去，只是撒但阻擋了我們」（2:18）。ἐνέκοψεν 出自 ἐγκόπτω，原是在路上挖斷、截斷道路。可是在徒 16:6–7，同樣是去不成，保羅讀成「聖靈既然禁止」「耶穌的靈卻不許」。問題是：同樣是一扇關上的門，保羅怎麼知道哪一次是撒但、哪一次是神？我們今天有沒有一個可以套用的公式？<\/p>"],["屬靈爭戰說：受阻多半是撒但攻擊，要禱告突破","","<p>有些教導強調 2:18 與「務要抵擋魔鬼，魔鬼就必離開你們逃跑了」（雅 4:7）：神的旨意常會遇到攔阻，信徒要用禱告與信心去爭戰，不要輕易放棄。這一說提醒我們屬靈爭戰是真實的，保羅也承認撒但會阻擋。<\/p><p><strong>難處：<\/strong>若每一次受阻都歸給撒但，人就不再檢討自己的計畫、時機與動機，也容易活在驚慌與爭戰的情緒裡；保羅在 2:18 並沒有說他靠爭戰突破了，他是改用寫信、打發提摩太去。<\/p>"],["神的主權說：受阻多半是神關門，要順服停下","","<p>另一些人強調徒 16:6–7 與「萬事都互相效力，叫愛上帝的人得益處」（羅 8:28）：神掌管一切，門關了就是神不許，要安靜等候、另尋方向。這一說保護人不至於硬闖，也提醒人神的主權在撒但之上。<\/p><p><strong>難處：<\/strong>若每一次受阻都說是神關門，人可能把自己的懶惰、害怕或錯誤屬靈化；保羅在林前 16:9 說「有寬大又有功效的門為我開了，並且反對的人也多」——門開著的時候，反對也可能很多。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：保羅沒有給一個公式；兩次都是事後回頭才說得清楚，撒但的攔阻也在神的主權之下。<\/strong>可以確定的是他面對受阻的反應：不怪罪人、不陷入自責、也不停止愛。去不了，就寫信；寫信不夠，就打發提摩太（3:2）。<\/p><p>因此今天遇到一扇關上的門，最要緊的不是立刻判定是誰關的，而是問：我還可以怎樣繼續愛？可以和屬靈同伴一起禱告、查驗動機與時機，但不要急著替每一次受阻貼上標籤。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你不必因為分辨不出是撒但還是神而焦慮；保羅自己也常常要回頭才看清。撒但能挖斷保羅的路，挖不斷保羅的心；也挖不斷神把福音送到帖撒羅尼迦的計畫——這封信就是證據。<\/p><p>你的計畫受阻，不代表你被神丟下，也不代表你信心不夠。爭議與信心見全卷立場議題「這些爭議該不該影響一個人的信心？」。<\/p>"]],"con":[],"say":"本講義的立場：分辨撒但攔阻與神關門，保羅沒有給公式，兩次都是回頭才說清楚；撒但的攔阻也在神的主權之下。重點是他的反應——不怪人、不自責、不停止愛，換一條路繼續愛。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有計畫一再受阻而灰心的人：求職屢次失敗、簽證被拒、不孕、病倒、婚事告吹。不要對他說「這是撒但攻擊，你要更有信心」，也不要說「這是神關門，你就認了吧」。先陪他說出失望，陪他一起禱告；若長期無望、失眠或情緒低落，協助他尋求專業協助。"},{"id":"ISS03_1","t":"3:3「我們受患難原是命定的」——基督徒一定會受苦嗎？成功神學錯在哪裡？","r":"3:3--4；1:6；2:14；約16:33；徒14:22；提後3:12","ch":[3],"why":"華人教會裡兩種聲音同時存在：一種說「信耶穌就會平安順利，受苦是因為信心不夠」，另一種說「受苦越多越屬靈」。更危險的是第三種用法：把「命定」拿來勸家暴、虐待的受害者「回去忍耐」。3:3 是全卷說苦難最直接的一節，讀準它，關乎一個新信徒會不會被搖走，也關乎一個受害者會不會被留在危險裡。","pos":[["【一】經文問的是甚麼","","<p>「免得有人被諸般患難搖動。因為你們自己知道，我們受患難原是命定的。」（3:3）原文 <strong>εἰς τοῦτο κείμεθα<\/strong>（eis touto keimetha）是「我們被安放在這上面」；3:4 <strong>προελέγομεν<\/strong>（proelegomen）是未完成式，保羅在帖撒羅尼迦時一再預先告訴他們要受患難。問題是：基督徒「一定」會受苦嗎？「命定」是宿命論嗎？受苦是信心不夠的記號，還是信心真實的記號？這一節說的「患難」，範圍到哪裡？<\/p>"],["成功神學（興盛福音）","","<p>主張神的旨意是要信徒健康、富足、事事順利；只要信心夠、宣告對、奉獻足，苦難就可以被趕走。長期受苦，多半表示信心不足或有隱藏的罪。它吸引人的地方是真實的：神確實是賜福的神，也確實垂聽禱告、醫治人。<\/p><p><strong>難處：<\/strong>它與本章直接衝突。保羅「預先告訴你們，我們必受患難」（3:4），帖撒羅尼迦人信主以後反而更難；主耶穌也說「在世上，你們有苦難」（約 16:33）。這種講法把受苦的人推進雙重的痛：苦難本身，再加上「你一定哪裡做錯了」的論斷。<\/p>"],["苦難必然說（受苦是真信徒的記號）","","<p>認為新約一再把苦難與跟隨基督連在一起：「我們進入神的國，必須經歷許多艱難」（徒 14:22），「凡立志在基督耶穌裡敬虔度日的，也都要受逼迫」（提後 3:12）。所以受苦是常態，沒有受苦反而要檢討。這一說在受逼迫的地區給了許多信徒極大的力量。<\/p><p><strong>難處：<\/strong>若推到極端，就會浪漫化逼迫、追求苦難，甚至鼓勵新信徒去激怒家人與官府來證明信心；也會讓沒有受明顯逼迫的人懷疑自己的得救。保羅說患難不是意外，卻從沒有叫人去找苦吃。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見議題「受苦、逼迫與家人反對」：患難不是意外，苦裡有聖靈的喜樂（1:6）；但不美化、不追求，不要求人留在暴力裡，不鼓吹對抗；成功神學明確不採。<\/strong><\/p><p>3:3 的「命定」是位置，不是宿命：受苦的人被安放在神看得見的地方，所以保羅緊接著做的是「打發提摩太去」。這一節的患難是為福音、為跟隨基督而來的壓力，<strong>不是家暴、虐待、性暴力或職場霸凌<\/strong>；遇到這些，教會該做的是保護與陪伴，協助尋求專業與法律協助（紅線六）。家人反對時，用改變的生命與孝順代替對抗。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你信主以後遇到的難處，不證明你信錯了，也不證明神不愛你；保羅說，這是他早就告訴過的。你也不必為了證明自己的信心去找苦吃。苦來了，記得 3:3 的下一步：你不是一個人，神會差人到你身邊；你也可以開口說「我撐不住了」——寫這一節的人，自己也說過。<\/p>"]],"con":[],"say":"本講義的立場：信主不保證一帆風順，患難不是意外，「命定」是神安放的位置，不是宿命；成功神學明確不採，也不浪漫化逼迫。3:3 的患難是為福音受的苦，不是家暴與虐待，不可用它要人留在危險裡。本講義的全卷立場見議題「受苦、逼迫與家人反對」。","care":"會眾席上可能有正在家裡被打、卻被教會長輩勸「這是你的十字架」的姊妹，有信主後被家人趕出門的年輕人，也有被「你受苦是因為信心不夠」傷過的病人與失業者。講台上不說「受苦就是信心不夠」，也不說「這是命定的，忍耐吧」。會後單獨關心，不追問細節、不要求原諒加害者、不對正在流淚的人說「你要有信心」；涉及暴力時，先確認他的安全，協助他尋求專業與法律協助。"},{"id":"ISS03_2","t":"3:5「恐怕那誘惑人的到底誘惑了你們」——真信徒會不會離開信仰？","r":"3:5；3:8；5:23--24；腓1:6；約10:28；來6:4--6","ch":[3],"why":"幾乎每一間教會都有人離開了：曾經熱心的同工、帶過小組的人、甚至傳道人。留下來的人會問：他當初是真的得救嗎？我會不會也有一天離開？3:5 保羅自己怕「勞苦歸於徒然」，這一題同時關乎得救的確據、對離開者的態度，以及牧養的實際行動。","pos":[["【一】經文問的是甚麼","","<p>「為此，我既不能再忍，就打發人去，要曉得你們的信心如何，恐怕那誘惑人的到底誘惑了你們，叫我們的勞苦歸於徒然。」（3:5）<strong>ὁ πειράζων<\/strong>（ho peirazōn）是撒但的名號；<strong>μή πως ἐπείρασεν<\/strong>（mē pōs epeirasen）用直說語氣，表示擔心試探可能已經來了，<strong>εἰς κενὸν γένηται<\/strong>（eis kenon genētai）卻是假設語氣，結果還沒有定。問題是：保羅是在擔心他們會失去救恩嗎？一個真正信主的人，有沒有可能最終離開信仰？<\/p>"],["永蒙保守說（改革宗為主）","","<p>認為真正重生的人，神必保守到底：「那在你們心裡動了善工的必成全這工」（腓 1:6），「誰也不能從我手裡把他們奪去」（約 10:28）；本卷結尾也說「那召你們的本是信實的，他必成就這事」（5:24）。一個人若最終完全離開，表示他當初可能沒有真正重生；3:5 的擔心是牧者看不見人心時的真實掛慮。<\/p><p><strong>難處：<\/strong>這一說給了堅固的確據，但若用得不慎，會讓人輕易斷定離開的人「從來沒有得救」，也會讓人忽略新約裡真實的警戒（來 6:4--6）；而保羅在這裡確實是認真地怕，不是假裝的。<\/p>"],["可能失落說（衛斯理宗與阿民念傳統）","","<p>認為神的恩典是真實的，人的回應也是真實的；一個真正信主的人，若持續、刻意地離棄基督，有可能失去救恩。3:5 保羅擔心「勞苦歸於徒然」，3:8 說「你們若靠主站立得穩」，都顯示持守是真實的呼召，不是自動的結果。<\/p><p><strong>難處：<\/strong>這一說認真看待警戒，但若講得不好，敏感的人會活在「我是不是已經失去了」的恐懼裡，把信仰變成一場永遠不確定的考試；而本卷的終點是神的信實（5:24），不是人的表現。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩說並陳，都是弟兄；兩派共同承認的事，正是保羅在 3:5 做的事。<\/strong>他沒有說「真信徒不會跌倒，不用擔心」，也沒有說「你們隨時會失去救恩」；他打發人去，要曉得他們的信心如何。神學可以並陳，牧養只有一條路：不讓任何人獨自面對試探。<\/p><p>對已經離開的人，本講義不下斷語——不說「他從來沒得救」，也不說「他已經沉淪」，把他交在信實的神手中，同時像保羅一樣去找他。全卷「爭議與信心」的立場見議題「這些爭議該不該影響一個人的信心？」；逼迫中的跌倒，見議題「受苦、逼迫與家人反對」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你恐慌。如果你擔心自己會離開，這份擔心本身就說明你在乎主；把它說出來，讓人陪你。你的確據不在你抓得多緊，在「那召你們的本是信實的」（5:24）。如果你掛念一位已經離開的人，你不必先替他的永恆下結論，你可以先做提摩太：去問一聲他好不好。<\/p>"]],"con":[],"say":"本講義的立場：永蒙保守說與可能失落說並陳，都是弟兄；保羅在 3:5 給的不是一套理論，而是一個行動——打發人去，不讓人獨自面對試探。對已經離開的人不下斷語，把他交在信實的神手中，也去找他。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有正在懷疑、快要離開的人，有家人或孩子已經離開教會的父母，也有曾經離開、剛回來、怕被人議論的人。講台上不要說「離開的人就是被撒但抓走了」「他從來沒有得救」，也不要用失去救恩恐嚇人。會後陪伴時，讓懷疑的人說出他的懷疑而不被責備；對掛念離開者的家人，陪他一起禱告，不催他去勸、去辯，先去愛。"},{"id":"ISS03_3","t":"3:2 和合本「作神執事的」與 SBLGNT「神的同工」，哪一個是保羅寫的？","r":"3:2；林前3:9；林後6:1","ch":[3],"why":"這是本卷唯一一處和合本正文與 SBLGNT 意思不同的地方，App 原文欄顯示的是「同工」，和合本讀的是「執事」，細心的讀者一定會問。有人因此說「和合本譯錯了，聖經不可靠」，也有人一聽到異文就緊張。這一題關乎聖經怎樣傳到我們手上，也關乎提摩太在保羅眼中是誰。","pos":[["【一】經文問的是甚麼","","<p>和合本 3:2 作「打發我們的兄弟在基督福音上作神執事的提摩太前去」，註腳說「有古卷是與神同工的」。SBLGNT 與 NA28 作 <strong>συνεργὸν τοῦ θεοῦ<\/strong>（synergon tou theou）「神的同工」；WH 與 Treg 作 <strong>διάκονον<\/strong>（diakonon）「執事」；拜占庭傳統兩個都有，成了「神的執事和我們的同工」。問題是：保羅原來寫的是哪一個？差別會不會改變經文的意思？<\/p>"],["「神的同工」為原文說（SBLGNT、NA28）","","<p>文本鑑別的原則是：能解釋其他讀法如何產生的，最可能是原文。「神的同工」很大膽，好像把一個人放到與神並肩的位置，抄寫的人很容易改成較保守的「執事」，或加上「我們的」改成「我們的同工」；反過來，把「執事」改成「神的同工」的動機很難想像。拜占庭本兩字並列，正是兩種讀法被合併的痕跡。保羅在林前 3:9 也說「我們是與神同工的」，用語相合。<\/p><p><strong>難處：<\/strong>支持「神的同工」的古抄本在數量上不算最多，必須倚重內證推理；推理再合理，也只是「最可能」，不是「已證明」。<\/p>"],["「神的執事」為原文說（WH、Treg，和合本所從）","","<p>十九世紀的 Westcott-Hort 與 Tregelles 依據幾份重要的古抄本取「執事」，和合本翻譯時所用的底本也是這一讀。這一說認為「執事」（僕人）更合保羅對同工一貫的稱呼，也有早期見證支持。<\/p><p><strong>難處：<\/strong>這一讀很難解釋「神的同工」和兩字並列的讀法怎麼產生；後來的抄本研究與鑑別原則，使多數學者轉向「神的同工」。WH 本身也是在這個問題上被後來的版本修正的例子之一。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義從多數學者，以 συνεργόν（synergon）「神的同工」為原文；App 原文欄照 SBLGNT 顯示，講台上照和合本讀「作神執事的」也無妨，但要知道保羅很可能寫的是「同工」。<\/strong><\/p><p>兩種讀法都說提摩太是在基督福音上服事神的人，沒有任何一條教義因此改變。差別在語氣：保羅把一個年輕人稱為「神的同工」，是要帖撒羅尼迦人知道，被差來的不是保羅的跑腿，是與神一同做工的人。全卷「爭議與信心」的立場見議題「這些爭議該不該影響一個人的信心？」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約的抄本多到可以彼此對照，異文能被找出、被陳列、被討論，正說明聖經的傳承經得起檢驗；和合本自己把另一讀放在註腳裡，就是一種誠實。你手上的和合本，在提摩太是誰、福音是甚麼這些事上，與原文完全一致。你今天也可以是那個被差去的「同工」。<\/p>"]],"con":[],"say":"本講義的立場：3:2 從多數學者以「神的同工」為原文，和合本「作神執事的」跟另一讀，註腳已經記著；兩讀都不改變任何教義，講台上照和合本讀也無妨。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有剛在網路上讀到「聖經有幾十萬處異文」而動搖的大學生，也有一聽到「和合本可能不是原文」就緊張、甚至生氣的長輩。講台上不要誇大、也不要掩蓋；不嘲笑提問的人，也不嘲笑捍衛和合本的人。會後陪伴時，可以帶他翻開和合本的註腳，一起看見教會一直是誠實地傳下這本書；需要的話，介紹一本可靠的入門書給他。"},{"id":"ISS03_4","t":"3:10「補滿你們信心的不足」——信心會不夠嗎？信心不夠是罪嗎？","r":"3:10；3:6；4:13；可9:24；路17:5；加6:1","ch":[3],"why":"「你信心不夠」大概是華人教會裡最常聽見、也最傷人的一句話：病沒好、孩子不信、生意不順，都可能被歸到信心不足。可是保羅在稱讚一間教會「靠主站立得穩」之後，緊接著就說他們的信心有「不足」。這一題關乎信心是甚麼、缺了怎麼辦，以及我們怎樣對待信心有缺口的人。","pos":[["【一】經文問的是甚麼","","<p>「我們晝夜切切地祈求，要見你們的面，補滿你們信心的不足。」（3:10）<strong>καταρτίσαι<\/strong>（katartisai）是補網、接骨的字；<strong>τὰ ὑστερήματα<\/strong>（ta hysterēmata）是複數：好幾處不足。上一節保羅才說他們叫他喜樂到不知道怎麼感謝神，3:6 提摩太也報了他們信心的好消息。問題是：一個站穩了的信徒，信心怎麼還會不足？這「不足」是罪，還是還沒長成的地方？<\/p>"],["信心的量說（信心是可以多、可以少的信靠）","","<p>認為信心是對神的信靠，有大有小、會增會減：門徒求「加增我們的信心」（路 17:5），那位父親說「我信！但我信不足，求主幫助」（可 9:24），主耶穌也常說「你們這小信的人」。所以信心不足是真實的狀態，需要被堅固；主耶穌對小信的人是責備，也是伸手拉住。<\/p><p><strong>難處：<\/strong>若只講「量」，很容易落入「信心夠多，病就會好」的算術，把禱告沒有照自己的意思蒙應允，全部算成信心不夠——那正是成功神學的路。<\/p>"],["信心的內容說（不足的是所信的道還沒教完）","","<p>認為 3:10 的「信心」偏重「所信的內容」：帖撒羅尼迦人信主才幾個月，保羅就被趕走了，很多事還沒教。從第 4、5 章看得出缺口在哪裡：聖潔的生活（4:3--8）、死了的信徒怎麼樣（4:13）、主的日子（5:1--11）、不做工的人（4:11）。所以「補滿」主要靠教導，這封信本身就是在補。<\/p><p><strong>難處：<\/strong>這一說把缺口講得很具體，但若只當成知識不夠，就漏掉了 3:5 那種信靠被搖動的真實危險；信心不只是知道，也是在患難裡仍然靠主站著。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩說並收：信心的不足，有信靠被搖動的部分，也有所信的道還沒學完的部分；兩樣都不是叛逆，是一間嬰孩教會還沒長成的地方。<\/strong>保羅用補網、接骨的字，表示信心會缺，缺了可以補；補的方法是感謝、禱告、見面與教導，不是羞辱。<\/p><p>信心不足本身不等於罪；拒絕神、不肯信才是。保羅在同一章裡稱讚他們站得穩，又說他們有不足——<strong>站穩和有缺口，可以同時是真的。<\/strong>這也是全卷「一封寫給嬰孩教會的家書」的讀法（全卷立場見議題「書信的處境與原則」）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你自責。你的信心有破洞，不表示你不是神的孩子；保羅不是寫信罵帖撒羅尼迦人，是晝夜為他們禱告。你可以像那位父親一樣說「我信不足，求主幫助」——那正是一句有信心的禱告。找一個人陪你補，讀經、問問題、一起禱告；補網的漁夫不會罵網。<\/p>"]],"con":[],"say":"本講義的立場：信心會不足，缺了可以補；3:10 的不足有信靠被搖動、也有所信的道還沒學完，都不是叛逆，補的方法是感謝、禱告、陪伴與教導，不是羞辱。站穩與有缺口可以同時是真的。本講義的全卷立場見議題「書信的處境與原則」。","care":"會眾席上一定有被說「你的病沒好是因為信心不夠」的病人，有為不信的孩子禱告多年、被說「你禱告不夠迫切」的父母，也有流產、不孕、喪親之後一直責怪自己信心不足的人。講台上絕不把禱告沒有照我們的意思蒙應允，說成對方信心不夠，也不對正在流淚的人說「你要有信心」。會後單獨關心，不追問細節；若伴隨長期的無望感，陪伴他，必要時協助尋求專業協助。"},{"id":"ISS03_5","t":"3:12「愛眾人的心」——基督徒的愛有沒有圈內圈外？","r":"3:12；4:9--10；5:15；太5:44；加6:10；羅12:18","ch":[3],"why":"受逼迫的群體很容易變成一個封閉的圈子：對內很溫暖，對外很冷淡，甚至敵視。華人信徒常遇到具體的難題：家人反對我信主，我要怎樣愛他們？愛眾人，是不是表示要容忍一切、包括傷害我的人？加 6:10 說「向眾人行善，向信徒一家的人更當這樣」，教會的愛到底有沒有優先次序？","pos":[["【一】經文問的是甚麼","","<p>「又願主叫你們彼此相愛的心，並愛眾人的心都能增長，充足，如同我們愛你們一樣」（3:12）。<strong>εἰς ἀλλήλους καὶ εἰς πάντας<\/strong>（eis allēlous kai eis pantas）：向彼此，也向所有的人。保羅這樣禱告的對象，是一間正被本地鄉親逼迫的教會（2:14）。問題是：「眾人」包括逼迫他們的人嗎？教會內的愛與教會外的愛，有沒有先後與不同？<\/p>"],["同心圓說（愛有次序，但沒有邊界）","","<p>認為新約的愛有一個次序：先是信徒一家（加 6:10「向信徒一家的人更當這樣」），再推到眾人；「彼此相愛」是基督的家的記號，「愛眾人」是這份愛自然滿溢出去。帖前 4:9--10 說他們已經愛「馬其頓全地」的弟兄，5:15 又說「或是彼此相待，或是待眾人，常要追求良善」。兩者都要，次序是家先暖起來，再漫出門外。<\/p><p><strong>難處：<\/strong>若次序講得太重，就會變成「先顧好自己人，外面的人以後再說」，教會在社區裡只剩下一道門，而不是一扇窗。<\/p>"],["無差別說（愛仇敵是同一份愛）","","<p>認為主耶穌已經拆掉了圈內圈外：「要愛你們的仇敵，為那逼迫你們的禱告」（太 5:44）。保羅為一間被逼迫的教會禱告，不求逼迫者受報應，只求愛滿溢到「眾人」，眾人當然包括闖進耶孫家的鄰居與罵他們背祖的親戚。所以基督徒的愛不分內外。<\/p><p><strong>難處：<\/strong>若沒有分辨，「愛眾人」會被拿來要求受害者繼續留在加害者身邊、不設界線；也可能讓人把愛眾人講成放下信仰去配合家人的一切要求。愛仇敵與保護自己，在聖經裡並不衝突（羅 12:18 說的是「若是能行」）。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見議題「受苦、逼迫與家人反對」：愛沒有圈內圈外，它從家裡開始，但不停在家門口；<\/strong>愛的對象包括逼迫者，愛的方式是祝福、禱告與行善，不是報復，也不是對抗。<\/p><p>但<strong>愛眾人不等於沒有界線<\/strong>：不要求受害者與加害者同住或立刻和好，不要求人為了「愛家人」去拜偶像。家人反對時，用改變的生命與孝順作見證——更體貼、更願意回家吃飯，守住信仰也守住愛（紅線六）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你為難到放棄。如果你的家人反對你信主，你不必在「放棄信仰」和「跟家人翻臉」之間二選一；3:12 給你第三條路：讓愛滿出來。這份愛不是你自己擠出來的，保羅的禱告是「願主叫你們」——是主讓愛增長。若家裡讓你不安全，先保護好自己；愛也包括讓人不再傷害你。<\/p>"]],"con":[],"say":"本講義的立場：基督徒的愛沒有圈內圈外——從家裡開始，滿溢到眾人，包括逼迫者；但愛眾人不等於沒有界線，不要求人留在傷害裡，也不要求人為了愛家人放下信仰；家人反對時用改變的生命與孝順作見證。本講義的全卷立場見議題「受苦、逼迫與家人反對」。","care":"會眾席上可能有家族裡第一個信主、過年回家就被圍著責問的弟兄姊妹，有被家人逼著上香而內疚的人，也有被教會勸「要愛他、要饒恕他」而回到施暴者身邊的姊妹。講台上不要把愛講成沒有界線，也不要鼓動信徒與家人對抗。會後陪伴時，先聽他家裡的真實情況，陪他想出一兩件具體可做的孝順；涉及暴力時，先確認安全，協助尋求專業與法律協助。"},{"id":"ISS03_6","t":"3:13「同他眾聖徒來的時候」——眾聖徒是天使還是已死的信徒？","r":"3:13；4:14；亞14:5；太25:31；帖後1:7","ch":[3],"why":"3:13 是全卷第二次提到主的 παρουσία，「眾聖徒」是誰，牽動讀者怎樣想像主再來的那一天，也連到第 4 章已死的信徒、被提與末世次序的問題。有人拿這一節來排末世時間表，也有剛失去親人的信徒，從這裡第一次問：我的家人會不會跟主一起回來？","pos":[["【一】經文問的是甚麼","","<p>「好使你們當我們主耶穌同他眾聖徒來的時候，在我們父神面前，心裡堅固，成為聖潔，無可責備。」（3:13）原文 <strong>μετὰ πάντων τῶν ἁγίων αὐτοῦ<\/strong>（meta pantōn tōn hagiōn autou），<strong>ἅγιοι<\/strong>（hagioi）可以譯「聖者」，也可以譯「聖徒」。問題是：跟著主一同來的，是天使，是已經睡了的信徒，還是兩者都有？<\/p>"],["天使說","","<p>認為這句話的背景是舊約神顯現的畫面：「耶和華－我的神必降臨，有一切聖者同來」，這使我們想起亞 14:5；那裡的「聖者」指天上的軍隊。主耶穌說人子「在他榮耀裡，同著眾天使降臨」（太 25:31），帖後 1:7 也說主「和他有能力的天使從天上在火焰中顯現」。所以 3:13 是在說主帶著天上的眾軍降臨。<\/p><p><strong>難處：<\/strong>ἅγιοι 在保羅書信裡幾乎都指信徒（例如各書信開頭的「眾聖徒」），很少直接稱天使；單憑舊約背景定案，就跳過了保羅自己最常用的字義。<\/p>"],["已死的信徒說","","<p>認為保羅的用字習慣支持「聖徒」就是信徒；而且下一章正好說「神也必將他們與耶穌一同帶來」（4:14），那些在耶穌裡睡了的人，要跟主一起回來。3:13 為 4:13--18 鋪路，回答帖撒羅尼迦人缺的那一根柱子——盼望。<\/p><p><strong>難處：<\/strong>這一說很有安慰，但 3:13 的語境是審判台前「無可責備」的莊嚴畫面，與亞 14:5 的神顯現語言很近；而且若把它拿來排列「信徒先升天、再同主降臨」的精確次序，就超出了經文自己願意說的範圍。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為兩者並存最合語境：主再來時，天上的眾軍與在他裡面睡了的信徒，都與他同在；議題本身各說並陳，都是弟兄。<\/strong>這一節不是用來排時間表的：主再來的次序與各派被提觀，本講義的全卷立場見議題「主再來、被提與末世時間表」，本章不另立說法，也不算日子。<\/p><p>3:13 真正的重心在主詞：是主親自堅固人的心。帖撒羅尼迦人信心還有不足（3:10），保羅卻求主使他們在主來的那一天「心裡堅固，成為聖潔，無可責備」——那是主的工作，不是人的考試。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論「眾聖徒」是天使、是信徒，還是兩者都有，有一件事是確定的：主耶穌一定會親自回來，而且他不是一個人回來。若你正想念一位在主裡睡了的親人，第 4 章會告訴你更多；今天你可以先知道，主來的那一天，是團聚的日子，不是恐懼的日子。<\/p>"]],"con":[],"say":"本講義的立場：「眾聖徒」天使說與已死信徒說並陳，本講義認為兩者並存最合語境；這一節不用來排時間表，重心是主親自堅固人的心。主再來的次序與各派被提觀，本講義的全卷立場見議題「主再來、被提與末世時間表」。","care":"會眾席上可能有剛送走信主的父母、配偶或孩子的人，一聽到「同他眾聖徒來」就想起那一張臉；也可能有家人未信主就過世、一聽到這類經文就心裡發緊的人。講台上不要在這一節上展開末世時間表的辯論，更不要對未信主的亡者下斷語（全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」）。會後陪伴時，先陪他想念、讓他哭，不急著解釋；必要時協助尋求哀傷輔導。"},{"id":"ISS04_1","t":"4:3「遠避淫行」——婚前性行為、同居、色情：今天的華人教會怎樣講才不羞辱人？","r":"4:3--5；4:7--8；5:23--24；約8:11","ch":[4],"why":"4:3 是新約少數直說「神的旨意」的地方，而且說的是性。華人教會面對這一節，常常只有兩種聲音：一種是不講，怕尷尬、怕得罪人；一種是講得很重，用羞辱、點名與「你已經不純潔了」把人趕走。會眾席上有同居多年想回來的情侶、深夜離不開色情的青年、婚前懷孕的姊妹，這一題決定他們會不會再回來。","pos":[["【一】經文問的是甚麼","","<p>「神的旨意就是要你們成為聖潔，遠避淫行」（4:3）。原文 <strong>θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν<\/strong> 是一個等號：神的旨意就是你們的成聖；<strong>πορνεία<\/strong> 涵蓋婚姻以外一切的性關係，<strong>ἀπέχεσθαι<\/strong> 是現在式中間語態：自己持續地保持距離。帖撒羅尼迦是一座性很隨便、有雙重標準的港口城市。經文要問的不是「要不要講」，而是：今天的教會怎樣把這個清楚的標準，講成一條讓人想回家的路，而不是一道把人趕出去的門？<\/p>"],["紀律優先說（清楚定罪、公開處理）","","<p>認為 4:3 的標準清楚，教會的責任是守住界線：講台要直說婚前性行為、同居、色情都是罪；已經同居或婚前懷孕的會友，要公開認罪、暫停事奉或聖餐，才能保護群體的聖潔，也讓年輕人知道後果。支持者引林前 5 章保羅要求教會處理淫亂的事。<\/p><p><strong>難處：<\/strong>林前 5 章處理的是不肯悔改、還以此自誇的人，不是正在掙扎、想要回頭的人；公開羞辱常常讓人選擇隱藏，而不是悔改，也容易只追究被看見的（例如懷孕的姊妹），放過看不見的。更要緊的是，4:3 的語氣是父親扶孩子學走路（4:1「照你們現在所行的更加勉勵」），不是考官扣分。<\/p>"],["處境淡化說（時代不同，愛就好）","","<p>認為保羅說話的對象是古代港口的廟妓與奴隸制度，今天兩個相愛的成年人彼此承諾地同居，與 4:3 所指不同；教會若一直講性的罪，只會讓年輕人覺得教會落伍、充滿控制，不如少講，把重點放在愛與接納。<\/p><p><strong>難處：<\/strong>πορνεία 在新約不只指廟妓，而是婚姻以外一切的性；保羅給的理由也不是當時的文化，而是「神的旨意」與「神召我們……乃是要我們成為聖潔」（4:7）。用處境取消原則，等於讓年輕人在最需要清楚指引的地方失去指引，也剝奪了那些正想回頭的人聽見福音的機會。<\/p>"],["恩典中的真理說（清楚講標準，私下牧養，成聖是過程）","","<p>認為標準要講清楚，因為這是神明說的旨意；但 ἁγιασμός 是過程名詞，成聖是一條路，不是一張只能用一次的證書。所以講台說原則、不點名；牧養在私下，按每一個人的處境一步一步陪伴；跌倒的人可以安全地回來。耶穌對那個被拉到眾人面前的婦人，既說「我也不定你的罪」，也說「從此不要再犯罪了」（約 8:11）。<\/p><p><strong>難處：<\/strong>這個立場最難的是執行：「不羞辱」容易滑向「不說」，「陪伴」容易拖成「不處理」；遇到牽涉權勢、未成年或傷害他人的情況，私下牧養也不能取代保護與通報。它需要有成熟、彼此問責的同工群體才走得下去。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「恩典中的真理」。<\/strong>4:3 的標準要講清楚：婚前性行為、同居、婚外情與色情都不合神的旨意，講台不迴避。但怎樣講和講不講一樣要緊：不點名、不說「你已經不純潔了」、不把一個人定終身；聖潔是神的旨意，也是神的恩典——那要你聖潔的神，是「那賜聖靈給你們的神」（4:8），原文是一直在賜；到了 5:24，保羅說「那召你們的本是信實的，他必成就這事」（5:24）。<\/p><p>本講義的全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」；牽涉權勢與侵害的部分，見本章議題「4:6『欺負他的弟兄』」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你正在這方面掙扎，或者曾經跌倒，4:3 不是一張宣布你出局的判決書，是一位父親說「再走一步」。帖撒羅尼迦人剛剛離開偶像，他們的過去不會比你乾淨；保羅仍然稱他們「弟兄們」。神沒有在你信主那天給了一次聖靈就離開，他今天還在給。你可以找一位信得過的同性同伴，一起禱告，再走一步。<\/p>"]],"con":[],"say":"本講義的立場：4:3 的標準要講清楚——婚姻以外的性不合神的旨意；但成聖是過程，不是一次用完的證書，講台不羞辱、不點名、不說「你已經不純潔了」，牧養在私下，那一直在賜聖靈的神要親自成就。本講義的全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」。","care":"會眾席上有同居多年、想回教會卻不敢踏進門的情侶，有婚前懷孕、曾被教會冷落的姊妹，有深夜離不開色情、每週都在悔改又跌倒的弟兄，也有被性侵後一直覺得自己「髒了」的人。講台上不要用口香糖、白紙被揉皺一類的比喻，不要公開點名或要求當眾認罪。會後陪伴時，先聽，不追問細節；對反覆跌倒的人，陪他找一位同性的問責同伴；若牽涉未成年、權勢或傷害，先保護，必要時協助尋求專業與法律協助。"},{"id":"ISS04_2","t":"4:4「守著自己的身體」——σκεῦος 是「身體」還是「妻子」？","r":"4:4；林後4:7；彼前3:7","ch":[4],"why":"和合本譯「守著自己的身體」，但原文 σκεῦος 只是「器皿」，保羅沒有說是哪一個器皿；一些英文譯本與古代解經家讀作「娶妻」。這不只是學術問題：讀成「娶妻」，有人會推論出妻子是丈夫的器具；讀成「身體」，有人會忽略保羅對婚姻的要求。讀者需要看見兩讀的理由與難處，才不會被任何一邊誤用。","pos":[["【一】經文問的是甚麼","","<p>「要你們各人曉得怎樣用聖潔、尊貴守著自己的身體」（4:4）。原文 <strong>τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ<\/strong>，直譯是「在聖潔與尊貴中取得（或作：掌管）自己的器皿」。爭議有兩處：<strong>σκεῦος<\/strong>（器皿）指甚麼？<strong>κτάομαι<\/strong> 是「取得」還是「掌管」？兩個問題互相牽動，決定這一節是在談自我節制，還是在談婚姻。<\/p>"],["身體說（和合本）","","<p>認為器皿指人自己的身體：保羅在林後 4:7 說「我們有這寶貝放在瓦器裡」（林後 4:7），器皿就是人的身體；這樣讀，整句對「各人」說，男女都適用，與 4:3「遠避淫行」、4:5「不放縱私慾的邪情」緊緊相連。和合本、多數中文譯本與許多古代解經家採此讀。也有少數學者把 σκεῦος 讀作身體某一部分的委婉說法，方向相同。<\/p><p><strong>難處：<\/strong>κτάομαι 通常的意思是「取得、獲得」，用來說「掌管已經有的身體」稍嫌勉強，需要把它讀成較少見的「控制、管好」才通順。<\/p>"],["娶妻說","","<p>認為器皿指妻子：彼得說作丈夫的要與妻子同住，「因她比你軟弱」，原文就是較軟弱的器皿 ἀσθενεστέρῳ σκεύει（彼前 3:7）；κτάομαι 正好是「取得」，「取得自己的器皿」就是娶一位妻子。這樣讀，保羅是在說：在一個男人可以任意找女人的城市裡，基督徒要在聖潔與尊重裡建立婚姻，而不是在私慾裡佔有一個人。奧古斯丁與一些現代英文譯本這樣讀。<\/p><p><strong>難處：<\/strong>這樣讀，整句似乎只對男人說話，而保羅在本卷一向稱呼「弟兄們」包括姊妹；把妻子比作「器皿」也容易被誤用成「妻子是丈夫的器具」。而且婚姻本身並不保證聖潔，林前 7 章保羅也不是把婚姻當成解決慾望的工具。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義照和合本讀作「身體」，同時陳列「娶妻」一讀，兩讀的落點相同。<\/strong>ἐν ἁγιασμῷ καὶ τιμῇ（在聖潔與尊貴中）對 μὴ ἐν πάθει ἐπιθυμίας（不在私慾的邪情中）：性要放在聖潔與尊重裡，不放在私慾與佔有裡。不論讀哪一種，身體都不是骯髒的，是尊貴的；配偶也不是滿足慾望的器具，是要被敬重的人。<\/p><p>本講義明確拒絕把「娶妻」一讀講成「妻子是丈夫的器具」。本講義的全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。一個字有兩種讀法，正說明聖經是在真實的歷史與語言裡寫成的；兩種讀法都通往同一個方向。你不必先解決 σκεῦος 的爭論，才知道今天要怎樣對待自己的身體與別人的身體：在聖潔與尊重裡，而不是在私慾與佔有裡。保羅說的是「各人曉得」——這是你可以今天就開始學的一門功課。<\/p>"]],"con":[],"say":"本講義的立場：照和合本讀作「身體」，並陳「娶妻」一讀；兩讀落點相同——性要放在聖潔與尊重裡，不放在私慾與佔有裡。明確拒絕把「器皿」講成「妻子是丈夫的器具」。本講義的全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」。","care":"會眾席上可能有在婚姻裡被當成工具、被要求「盡妻子的本分」而受傷的姊妹，也有因為身體的樣子、病痛或過去的經歷而厭惡自己身體的人。講台上不要用這一節說「女人就是器皿」，也不要讓人以為身體是骯髒的。會後陪伴時，若有人透露婚姻裡的脅迫或暴力，先相信他、保護他的安全，必要時協助尋求專業與法律協助，不要只勸他「要順服」。"},{"id":"ISS04_3","t":"4:6「欺負他的弟兄」——性的罪也是對別人的不公義嗎？性暴力與權勢性侵，錯在誰？","r":"4:6--8；撒下13:12；羅13:4","ch":[4],"why":"我們常把性的罪想成「髒了」的問題，於是被侵害的人也覺得自己髒了，甚至被教會要求「也要反省」。4:6 卻用了兩個講不公義的字：越界與佔便宜。這一題決定教會面對權勢性侵時，站在受害者那一邊，還是站在加害者的名聲與教會的面子那一邊。華人教會在這件事上的沉默，已經傷了太多人。","pos":[["【一】經文問的是甚麼","","<p>「不要一個人在這事上越分，欺負他的弟兄；因為這一類的事，主必報應」（4:6）。<strong>ὑπερβαίνειν<\/strong> 是跨過一條不該跨的線，<strong>πλεονεκτεῖν<\/strong> 是多拿、拿走不屬於自己的；受詞是 <strong>τὸν ἀδελφὸν αὐτοῦ<\/strong>，一個有名有姓的人；<strong>ἔκδικος κύριος<\/strong> 是「主是伸冤者」。經文引出兩個問題：「在這事上」指的是性，還是生意？性的罪若是對人的不公義，教會遇到權勢性侵時該怎樣站位？<\/p>"],["商業欺詐說（「在生意上」）","","<p>少數解經家認為 ἐν τῷ πράγματι 可讀作「在生意上」，πλεονεκτεῖν 常用在金錢上的貪婪，所以保羅在 4:6 轉到另一個題目：不要在買賣上欺騙弟兄。這樣讀，4:3--8 是兩件事：性的聖潔與商業的誠實。<\/p><p><strong>難處：<\/strong>冠詞 τῷ 指向「剛才說的那件事」，前後文 4:3--5 與 4:7「沾染污穢」都在談性；4:6 中間突然轉到生意，再於 4:7 轉回來，並不自然。多數學者與和合本都讀作「在這事上」，指性的事。<\/p>"],["私德說（性的罪主要是個人的不潔）","","<p>許多教會實際上採取的立場：性的罪主要是一個人「不潔淨」了，是他與神之間的事；所以處理方式是當事人私下悔改、彼此饒恕、恢復關係，教會不宜張揚，以免絆倒人、破壞合一。遇到牽涉同工的事件，往往勸雙方「都要反省」。<\/p><p><strong>難處：<\/strong>這正是 4:6 要翻轉的想像。保羅用的不是「污穢」的語言，是「不公義」的語言：有人越界，有人被奪走。把權勢性侵當成兩人之間的私德，會要求受害者為別人的罪「一起反省」、「趕快饒恕」，讓加害者繼續留在可以傷人的位置上。她瑪當年說「我哥哥，不要玷辱我」（撒下 13:12），聖經記下的是她的拒絕，定罪的是那個不肯聽的人。<\/p>"],["公義與保護說（性的罪也是對人的不公義）","","<p>認為 4:6 把性的罪放在公義的範疇：越界的一方拿走了另一個人的身體、尊嚴與信任，主是替受害者伸冤的那一位。所以利用職位、年紀、屬靈權威或金錢的落差得到的性，是權勢性侵；錯在越界的一方，被侵害的人不是不聖潔的人。教會的責任是相信、保護、陪伴，依法通報，並讓加害者離開可以接觸受害者的位置。<\/p><p><strong>難處：<\/strong>教會不是法庭，無法調查所有事實；處理不當也可能傷及被誤指的人。所以需要事前訂好清楚的保護與通報流程，交由受過訓練的人與專業、法律機構處理，而不是由講台或小組自行判案。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「在這事上」＝性的讀法，並採「公義與保護說」。<\/strong>4:6 說性的罪也是對別人的不公義；包括權勢性侵與性暴力——錯在越界的一方。被侵害的人不是不聖潔的人，不需要為別人的罪悔改；絕不可以對受害者說「你自己也有責任」，也不可以用「要饒恕、要合一、不要張揚」把事情壓下去。<\/p><p>「主必報應」首先是對受害者說的：你的冤屈，神看見了。4:8 保羅把自己移開，這一節也不能被任何領袖拿來保護自己。本講義的全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>如果你曾在教會裡被侵害，你對教會失望，甚至對神失望，都是可以說出來的。可是請聽 4:6 的最後一句：主是伸冤者。傷害你的人，沒有代表神；替你伸冤的，才是神。你的身體與尊嚴在神眼中仍然是尊貴的（4:4），你也值得被一群人相信、保護、陪伴。<\/p>"]],"con":[],"say":"本講義的立場：4:6 的「越分」、「欺負」是不公義的語言——性的罪也是對人的不公義，包括權勢性侵與性暴力；錯在越界的一方，被侵害的人不是不聖潔的人。「主必報應」首先是對受害者說的。本講義的全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」。","care":"會眾席上一定有曾被侵害、至今沒有說出口的人，可能是姊妹，也可能是弟兄；有人是在教會、營會或被屬靈長輩傷害的。講台上不要說「她自己也有責任」「要饒恕、不要張揚」，不追問細節，不要求原諒，也不要求與加害者和好。若有人在聚會中或會後說出經歷，不要在台上回應，會後單獨關心：先相信、先陪伴，協助他尋求專業輔導與法律協助，必要時依法通報；牽涉未成年者，一律通報。教會要保護的是受傷的人，不是加害者的名聲，也不是教會的面子。"},{"id":"ISS04_4","t":"4:11--12「作安靜人……親手做工」——基督徒可以不關心社會嗎？加班文化、躺平與失業？","r":"4:11--12；帖後3:10--11；耶29:7","ch":[4],"why":"「作安靜人，辦自己的事」常被讀成「基督徒不要管社會的事」；「親手做工」又常被拿來責備失業或在家照顧家人的人。另一方面，今天的職場一邊是過勞與加班文化，一邊是躺平。這一題要分清楚保羅當時處理的問題，才不會把一段愛弟兄的教導，變成對公義的沉默或對失業者的指責。","pos":[["【一】經文問的是甚麼","","<p>「又要立志作安靜人，辦自己的事，親手做工」（4:11）。<strong>φιλοτιμεῖσθαι ἡσυχάζειν<\/strong> 把兩個相反的字綁在一起：拚了命爭取的，是安靜；<strong>πράσσειν τὰ ἴδια<\/strong> 是做自己的事；<strong>ἐργάζεσθαι ταῖς χερσὶν ὑμῶν<\/strong> 是用自己的手做工；目的是「叫你們可以向外人行事端正，自己也就沒有甚麼缺乏了」（4:12）。經文問的是：安靜的反面是甚麼？保羅為甚麼在講弟兄相愛之後，立刻講做工？<\/p>"],["末世興奮說","","<p>認為有些帖撒羅尼迦信徒以為主很快就要來，於是不再工作，靠弟兄供養，到處張揚；後書說「在你們中間有人不按規矩而行，甚麼工都不做，反倒專管閒事」（帖後 3:11），似乎證實了這一點。保羅的意思是：等候主的人，手上是有活兒的。<\/p><p><strong>難處：<\/strong>4:11 本身沒有提到主再來，保羅說這是「我們從前所吩咐你們的」，表示在末世問題浮現之前他就這樣教了；只用末世興奮解釋，可能看漏了更廣的社會背景。<\/p>"],["恩庇制度說","","<p>認為希臘羅馬城市有一套恩庇制度：窮人依附有錢的恩主過活，替他捧場、在公共場合為他奔走，換取接濟。保羅要信徒脫離這種依附，親手做工、不必依賴任何人；4:12 的 μηδενὸς 也可以讀成陽性「不必依賴任何人」。「安靜」就是不再為恩主到處攪動。<\/p><p><strong>難處：<\/strong>恩庇制度的背景是真實的，但經文沒有明說；兩種解釋很可能同時存在。而且這個讀法若被推得太遠，會變成「基督徒不可接受任何人的幫助」，這與 4:9--10 弟兄相愛、彼此供給的畫面不合。<\/p>"],["政治退隱說（基督徒不要管社會）","","<p>部分華人教會傳統把「安靜」讀成不參與公共事務：基督徒的責任是傳福音、過好自己的生活，社會與政治是屬世的事，最好不要碰，免得分心、免得得罪人。<\/p><p><strong>難處：<\/strong>ἡσυχάζειν 的反面是到處攪動、靠人供養卻管別人的事，不是對公義沉默；舊約先知叫被擄的人「為那城求平安」（耶 29:7），保羅自己也在腓立比為不公的對待開口（徒 16:37）。把 4:11 讀成不關心社會，是把一個關於生活秩序的勸勉，變成了對鄰舍苦難的冷漠。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為末世興奮與恩庇制度兩說可能同時存在，並明確不採政治退隱說。<\/strong>安靜做工的原則是：愛弟兄的人，會盡力不成為弟兄的重擔；教會外的人是先看我們怎樣走路，才聽我們說甚麼（4:12）。這個原則今天落在兩邊：不讓工作吞掉家庭、身體與敬拜（過勞與無止境的加班不是 4:11 的要求），也不把自己的生活變成別人的負擔。<\/p><p>「親手做工」不是拿來責備失業的人。後書責備的是「不肯」做工，不是「不能」做工。本講義的全卷立場見議題「書信的處境與原則」（處境與原則），並見紅線八。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你正失業、生病，或在家照顧父母與孩子，4:11 不是在指著你說話；你是 4:9--10 那個彼此相愛的家要扶持的人。如果你每天被工作壓到深夜，4:11 也不是叫你再撐一點，而是邀請你「安靜」——在神面前重新安排你的生活。保羅用自己織帳棚的手告訴我們：工作有尊嚴，但工作不是主。<\/p>"]],"con":[],"say":"本講義的立場：安靜做工是愛弟兄的樣子——不成為別人的重擔，向外人行事端正；它不是叫人不關心社會，不是替過勞背書，也不是責備失業的人（後書責備的是「不肯」不是「不能」）。本講義的全卷立場見議題「書信的處境與原則」，並見紅線八。","care":"會眾席上有剛被裁員、不敢說出口的中年父親，有長期生病無法工作的人，有在家照顧失智父母、沒有收入的姊妹，也有每天加班到深夜、和家人說不上話的工程師，以及關心社會公義、曾被說「太屬世」的年輕人。講台上不要說「你就是懶」「基督徒不要管社會」。會後陪伴時，對失業的人先問實際的需要，教會能幫的就具體地幫；若失業帶來長期的無望感或憂鬱，單獨關心並協助尋求專業協助。"},{"id":"ISS04_5","t":"4:13「不要憂傷」——基督徒可以在喪禮上哭嗎？","r":"4:13；約11:35；羅12:15；傳3:4","ch":[4],"why":"這是華人喪禮上最常被引用、也最常被讀錯的一節。家屬在棺木前哭，有人拍拍他說「聖經說不要憂傷，他回天家了，你應該高興」。這句話讓許多喪親的人覺得自己的眼淚是不信，於是在教會裡把眼淚藏起來。這一題要把保羅真正說的話讀清楚，讓流淚的人知道他們可以帶著眼淚來到主面前。","pos":[["【一】經文問的是甚麼","","<p>「論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣」（4:13）。關鍵在 <strong>καθώς<\/strong>：<strong>ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα<\/strong>——不是單單「免得你們憂傷」，而是「免得你們像那些沒有盼望的人那樣憂傷」。經文問的是：保羅禁止的是眼淚，還是沒有盼望的眼淚？<\/p>"],["禁止憂傷說（「不要憂傷」是命令本身）","","<p>這是許多喪禮上的實際講法：把「恐怕你們憂傷」讀成保羅要信徒不要憂傷，因為死了的信徒已經在主那裡，基督徒應該以喜樂面對死亡；太過傷心，表示對天家的盼望不夠確定。有些人也受了中國文化「節哀」與希臘斯多葛「不動心」的影響。<\/p><p><strong>難處：<\/strong>這個讀法略過了 καθώς「像……一樣」，把一個比較句讀成了禁令。它也與聖經其他地方衝突：耶穌在拉撒路墳前，明知要叫他復活，還是「耶穌哭了」（約 11:35）；保羅自己說「與哀哭的人要同哭」（羅 12:15）；傳道書說「哭有時，笑有時」（傳 3:4）。<\/p>"],["比較說（不是不要憂傷，是不像沒有指望的人）","","<p>認為 καθώς 是比較：基督徒會憂傷，但憂傷的樣子不同。沒有盼望的人面對死亡只剩下結束；古代一封蒲草紙弔唁信說，面對這種事人甚麼也做不了，所以彼此安慰吧。保羅給的安慰有內容：睡了的人會醒，神必將他們與耶穌一同帶來（4:14）。所以保羅回應的方式，是一段教導，而不是一句「節哀」。<\/p><p><strong>難處：<\/strong>這個讀法若被推成「有盼望的人哭得比較少」，又會變成另一種量眼淚的尺；比較的是盼望的有無，不是眼淚的多少。有盼望的人，也可能哭得很久。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採比較說，並明確拒絕禁止憂傷說。<\/strong>4:13 不是「不要憂傷」，是不要「像那些沒有指望的人一樣」憂傷——問題不在眼淚，在盼望。喪禮上不叫人不要哭，不說「你應該高興」，也不把哀傷的長短當成信心的分數。主自己都哭了，我們就不必要求任何人在棺木前忍住眼淚。<\/p><p>本講義的全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你在喪禮上哭了，或者到今天還會在某一首詩歌、某一個節日突然掉淚，那不是信心不夠，那是愛。盼望不是叫眼淚停下來，是讓眼淚有一個方向：你哭的那一位，在耶穌裡睡了，而睡是會醒的。有一天，「神要擦去他們一切的眼淚」（啟 21:4）——是神來擦，不是你自己先擦乾。<\/p>"]],"con":[],"say":"本講義的立場：4:13 不是「不要憂傷」，是不要「像那些沒有指望的人一樣」憂傷——問題不在眼淚，在盼望；喪禮上不叫人不要哭、不說「你應該高興」，這使我們想起耶穌哭了。本講義的全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」。","care":"會眾席上有剛送走親人的人，有喪禮過後幾個月、別人以為他「應該走出來了」卻每晚還在哭的人，有失去孩子、經歷流產、親人自殺或意外過世的家庭，也有曾在喪禮上被說「你哭就是不信」而受傷的人。講台上不要對正在流淚的人說「你要有信心」。陪伴時先陪伴、不解釋，不說「這是神的旨意」，也不急著引經文；若哀傷長期影響睡眠與生活，或出現輕生的念頭，單獨關心、保護生命，協助尋求哀傷輔導與專業協助。"},{"id":"ISS04_6","t":"4:14「神也必將他們與耶穌一同帶來」——人死後到哪裡去？「睡了」是靈魂睡眠嗎？","r":"4:14；腓1:23；林後5:8；路23:43","ch":[4],"why":"4:13--15 一再用「睡了」說死了的信徒，有人因此主張死後到復活之間人沒有知覺，像睡著一樣；也有華人信徒擔心親人死後是否成了漂泊的孤魂，需要後人供奉才能安息。喪親的家庭最常問的就是「他現在在哪裡」，這一題需要讀清楚「睡」這個字說了甚麼，也說清楚它沒有說甚麼。","pos":[["【一】經文問的是甚麼","","<p>「我們若信耶穌死而復活了，那已經在耶穌裡睡了的人，神也必將他們與耶穌一同帶來」（4:14）。說耶穌，保羅用 <strong>ἀπέθανεν<\/strong>（死了）；說信徒，用 <strong>κοιμηθέντας<\/strong>（睡了）。<strong>ἄξει σὺν αὐτῷ<\/strong> 是「與他一同帶來」：主再來時，睡了的人與他同來。經文引出的問題是：「睡」是在說死後的狀態，還是在說死亡的性質？死後到復活之間，信徒在哪裡？<\/p>"],["與主同在說（死後有知覺地與基督同在）","","<p>認為「睡」是基督徒對死亡的稱呼，重點是「會醒」，不是在描述死後沒有知覺。保羅說「情願離世與基督同在，因為這是好得無比的」（腓 1:23），又說「更願意離開身體與主同住」（林後 5:8）；主耶穌對十字架上的強盜說「今日你要同我在樂園裡了」（路 23:43）。4:14「與耶穌一同帶來」也暗示他們現在已經與主同在。多數教父、改教家與福音派採此說。<\/p><p><strong>難處：<\/strong>新約對這段「中間狀態」說得很少，不能描繪細節；而且這個說法若講過了頭，容易把盼望落在「死後上天堂」，而忽略 4:16 身體復活才是終點。<\/p>"],["靈魂睡眠說（死後無知覺，直到復活）","","<p>認為人是一個整體，死後整個人進入無知覺的狀態，直到主再來時復活；「睡了」就是字面上的描寫。支持者指出舊約常說死人「不能稱謝」，強調聖經的盼望在復活，不在靈魂不死。安息日會等群體採此說，歷史上也有一些改教時期的人主張。<\/p><p><strong>難處：<\/strong>「睡」在希臘文學與猶太文獻裡本是死亡的委婉語，不必然描寫知覺；這個說法也難以解釋腓 1:23「好得無比」與路 23:43「今日」。若死後只是沒有知覺，「離世與基督同在」就很難說是更好的。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採與主同在說，並陳靈魂睡眠說。<\/strong>「睡」說的是死亡的性質：因為耶穌替我們嚐了真正的死，屬他的人的死被改了一個名字——睡是會醒的。死後的中間狀態，本講義回指腓立比書立場三：離世與基督同在；終點是身體的復活（4:16）與永遠和主同在（4:17）。<\/p><p>在耶穌裡睡了的人，不是漂泊的孤魂，也不需要後人的供奉才能安息，他們在主那裡。本講義的全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩種說法的人都相信同一件最重要的事：耶穌死了又復活了，所以在他裡面睡了的人，一定會醒。你不必先弄清楚死後每一個細節，才能在親人的墳前得安慰。保羅給哭泣的人的，不是一張地圖，是一個名字：在「耶穌」裡睡了。死亡沒有把他們從耶穌裡面拿走。<\/p>"]],"con":[],"say":"本講義的立場：「睡」說的是死亡的性質——在耶穌裡睡了的人會醒；死後的中間狀態採與主同在說、並陳靈魂睡眠說，回指腓立比書立場三；終點是身體復活與永遠和主同在。本講義的全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」。","care":"會眾席上有剛失去親人、每晚問「他現在在哪裡」的人，有擔心親人成了孤魂、因而不安的長輩，也有失去未出生孩子、不知道該怎樣想像的父母。講台上不要為了辯論中間狀態而讓喪親的人更困惑，也不要對未信主的亡者下斷語。陪伴時不急著解釋神學，先聽他說親人的故事；若他問起，溫柔地說：在耶穌裡睡了的，在主那裡，我們還會再見面。"},{"id":"ISS04_7","t":"4:13--18 與華人喪葬：追思禮拜、清明、祭祖、為亡者禱告，基督徒可以怎樣做？","r":"4:13--18；1:9；4:12；出20:12","ch":[4],"why":"華人基督徒最常與家人起衝突的時刻，就是喪禮與清明：拿不拿香、鞠不鞠躬、要不要燒紙錢、能不能為過世的親人禱告。處理不好，信主的子女被說成不孝，家人也從此對福音關上門。4:13--18 是寫給喪親的人的盼望，這一題要問：這份盼望在華人的靈堂與墳前，落在甚麼樣的行動上？","pos":[["【一】經文問的是甚麼","","<p>帖撒羅尼迦人「離棄偶像，歸向神」（1:9），他們離開的不只是一尊神像，也是一整套圍繞死亡的祭祀。4:13--18 給他們的是另一種面對死亡的方式：在耶穌裡睡了的人會醒，「所以，你們當用這些話彼此勸慰」（4:18）；4:12 又要他們「向外人行事端正」。經文問的是：一個不再拜偶像的人，怎樣在仍然拜祖先的家族裡，記念先人、孝敬父母，又不背棄他所歸向的神？<\/p>"],["全面分別說（不進靈堂、不拿香、不鞠躬）","","<p>認為祭祖儀式與拜偶像分不開，拿香、鞠躬、燒紙錢都帶著敬拜的意義；為了清楚見證「離棄偶像」（1:9），基督徒應該一律不參與，甚至不進靈堂，以免絆倒人或讓家人以為信耶穌也可以拜祖先。<\/p><p><strong>難處：<\/strong>這個做法常讓家人覺得信主的人不孝、冷漠，在家人最脆弱的時候造成決裂；鞠躬在華人文化裡也常只是敬意，不全是敬拜。把一切都劃成偶像，容易忽略「當孝敬父母」（出 20:12）的命令，也忽略 4:12「向外人行事端正」的見證。<\/p>"],["處境融合說（儀式照做，心裡不拜）","","<p>認為儀式只是文化，基督徒可以照樣拿香、跪拜、燒紙錢，只要心裡知道自己敬拜的是神就好；這樣可以維持家庭和諧，也讓家人不覺得信耶穌就是背棄祖先。有些人也主張可以為亡者禱告，求神讓他安息。<\/p><p><strong>難處：<\/strong>拿香跪拜在家族的理解裡，常常就是祭拜，向亡者祈求保佑；「心裡不拜」對旁人並不清楚，對信主的人自己也容易模糊界線。至於為亡者禱告，天主教與東正教有此傳統，新教多認為 4:13--18 把亡者交在神手中，盼望不在活人的祈求，而在主的再來。<\/p>"],["轉化與記念說（不拜偶像，但盡孝、記念、感恩）","","<p>認為基督徒不參與向亡者祈求或拜祭的部分，但可以用其他方式盡孝與記念：守靈陪伴家人、鞠躬致敬、獻花、清明一起去掃墓、在追思禮拜裡說亡者的故事、為他的一生感謝神；事前溫和地與家人溝通，事後多承擔實際的工作。<\/p><p><strong>難處：<\/strong>哪些行為是敬意、哪些是敬拜，不同地區、不同家族的理解不一樣，需要逐一分辨，沒有一張可以通用的清單；而且即使做得溫和，有時仍免不了家人的誤解，需要長期用生命去證明。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採轉化與記念說。<\/strong>基督徒不拜偶像（1:9），不向亡者祈求，但可以盡孝、記念、感恩；用溫柔而不是對抗作見證，讓家人看見信耶穌的人是最懂得記念親人的人。哪些行為可以參與，按各地處境判斷，判斷的理由要說出來。為亡者禱告的部分，本講義採新教一般的理解：把亡者交在公義又慈愛的神手中，為活著的家人禱告。<\/p><p>本講義的全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」；家人反對時的見證，見議題「受苦、逼迫與家人反對」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你在家人的喪禮上不知道該怎樣做，或曾經因為不拿香和家人吵起來，你不是唯一一個。帖撒羅尼迦的第一代信徒，也站在仍拜偶像的家族中間。保羅沒有叫他們和家人決裂，他叫他們向外人行事端正，並且帶著盼望記念睡了的人。你可以在下一次清明，帶一束花，說一段他生前的故事，為他的一生感謝神。<\/p>"]],"con":[],"say":"本講義的立場：基督徒不拜偶像、不向亡者祈求，但可以盡孝、記念、感恩——守靈、鞠躬致敬、獻花、掃墓、在追思禮拜說亡者的故事；用溫柔而不是對抗作見證，把亡者交在公義又慈愛的神手中。本講義的全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」，家人反對時見議題「受苦、逼迫與家人反對」。","care":"會眾席上有因為不拿香而被家族排斥、被說成不孝的信徒，有在喪禮上和長輩起衝突、至今後悔的人，也有父母剛過世、不知道該怎樣面對家族儀式的年輕人。講台上不要說「拿香就是拜偶像、就是背道」，也不要對未信主的亡者下斷語。陪伴時，事前幫他想好可以怎樣溫和地溝通、可以多承擔哪些實際的工作；事後若家庭關係受傷，陪他慢慢修補，不要只說「為主受逼迫是應當的」。"},{"id":"ISS04_8","t":"4:16--17「被提」——災前、災中、災後？主來了以後往哪裡去？","r":"4:16--17；太25:6；徒28:15；約14:3","ch":[4],"why":"「被提」一詞就出自 4:17，二十世紀以來，華人教會深受災前被提的時代論影響，許多人從小聽過「被提的時候你會被留下來」。也有教會把被提時間點當成正統的標記，彼此攻擊。這一題要把各派讀法與難處攤開，也把這段經文自己的重點找回來：不是路線圖，是與主同在；不是恐嚇，是彼此勸慰。","pos":[["【一】經文問的是甚麼","","<p>「以後我們這活著還存留的人必和他們一同被提到雲裡，在空中與主相遇。這樣，我們就要和主永遠同在」（4:17）。<strong>ἁρπαγησόμεθα<\/strong> 是「被奪取上去」（拉丁文 rapiemur，英文 rapture 由此而來）；<strong>εἰς ἀπάντησιν τοῦ κυρίου<\/strong> 是「為了迎接主」——ἀπάντησις 在當時指城裡的人出城迎接來訪的君王，再陪他進城。經文本身沒有提到大災難，也沒有說被提之後往哪裡去。爭議在於：把這一段放進整本聖經的末世圖畫時，被提發生在甚麼時候？<\/p>"],["災前被提說","","<p>時代論的讀法：主的再來分兩階段，先在空中秘密地接走教會，地上隨後經歷七年大災難，之後主再與聖徒一同降到地上，建立千年國度（前千禧）。支持者引 5:9「神不是預定我們受刑」與約 14:3「就必再來接你們到我那裡去」（約 14:3），認為教會不會經過神的忿怒。二十世紀華人福音派受此說影響最深。<\/p><p><strong>難處：<\/strong>4:16 有呼叫、天使長的聲音、神的號，很難讀成一件秘密的事；ἀπάντησις 的用法是迎接之後陪王回城，較不支持「接回天上」；而且新約沒有一處明說主的再來分成兩次。<\/p>"],["災中被提說（含忿怒前被提說）","","<p>認為教會會經歷大災難的前半或大部分（人的逼迫），但在神的忿怒傾倒之前被提；忿怒前被提說把時間點放在災難後段、神的審判開始之前。支持者試圖同時回應兩邊的經文：信徒要經歷患難（3:3），卻不受神的忿怒（5:9）。<\/p><p><strong>難處：<\/strong>這需要把啟示錄的時序切分得非常精細，而各家切法不一；帖撒羅尼迦前書本身沒有提供這種細節，用它來支持某一個切點，容易把經文推得比它說的更遠。<\/p>"],["災後被提說","","<p>認為主只有一次再來：教會經過大災難，主降臨時，死人先復活，活著的信徒被提到空中，像城民出城迎接君王一樣，「出來迎接」之後陪他降到地上——太 25:6 的童女、徒 28:15 羅馬的弟兄用的正是同一個字。許多教父、改革宗與福音派學者採此說；千禧年方面，有歷史前千禧、無千禧、後千禧等不同組合。<\/p><p><strong>難處：<\/strong>單憑 ἀπάντησις 一個字不能定案，經文沒有明說迎接之後往哪裡去；這個讀法也需要解釋 5:9「不是預定我們受刑」在大災難中的意思，並面對信徒在災難中受苦的牧養問題。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義並陳災前、災中、災後被提，與前千禧、無千禧、後千禧各說；各派都有敬虔愛主的人，各派都是弟兄。本講義不替各教會決定被提的時間點，也不算日子。<\/strong>本講義堅持各派共同承認的：主要親自、身體地、可見地再來（4:16），死人要復活，信的人要永遠與主同在（4:17）。ἀπάντησις 的畫面是迎駕，不是逃難。<\/p><p>被提的重點不是「提」，是「這樣，我們就要和主永遠同在」（4:17）；這段經文的用途是「所以，你們當用這些話彼此勸慰」（4:18）。本講義明確拒絕用「你會被留下來」恐嚇人。本講義的全卷立場見議題「主再來、被提與末世時間表」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你從小被「被留下來」的講法嚇大，你可以放下那份恐懼了：4:13--18 是寫給正在哭的人的，保羅要他們放心，連先睡了的人一個都不會被留下。各派弟兄對時間點看法不同，但都等候同一位主。讀完這一段，該問自己的不是「我排在哪一派」，而是：我是更害怕主來，還是更想念主來？<\/p>"]],"con":[],"say":"本講義的立場：災前、災中、災後被提與前千禧、無千禧、後千禧並陳，各派都是弟兄，本講義不替各教會決定時間點、不算日子；被提的重點是與主永遠同在，這段經文的用途是彼此勸慰，不用「被留下來」恐嚇人。本講義的全卷立場見議題「主再來、被提與末世時間表」。","care":"會眾席上有從小被被提電影、「被留下來」的講道嚇大，至今一找不到家人就心慌的人；有曾經參加末日預言團體、辭職賣房後預言落空、連信仰一起失落的人；也有容易焦慮的孩子與青少年。講台上不要用被提催逼決志或奉獻，不要放恐怖的影像，不要嘲笑任何一派的弟兄。對曾被末日講法傷害的人，先承認那份傷害是真的，不嘲笑他當年的天真，再陪他讀 4:17--18：這是寫來安慰人的。"},{"id":"ISS04_9","t":"4:15「我們這活著還存留到主降臨的人」——保羅以為主會在他有生之年回來嗎？","r":"4:15；4:17；5:1--2；腓1:23；林後5:8","ch":[4],"why":"保羅兩次說「我們這活著還存留的人」（4:15、4:17），把自己算在可能活到主來的人裡。有學者據此說保羅預期錯了，於是聖經的權威受到質疑；也有人據此推論「我們這一代一定會活到主來」，開始排時間表。這一題兩邊都會傷人：前者動搖單純信徒的信心，後者製造恐慌與失望。","pos":[["【一】經文問的是甚麼","","<p>「我們現在照主的話告訴你們一件事：我們這活著還存留到主降臨的人，斷不能在那已經睡了的人之先」（4:15）。<strong>ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι<\/strong> 用的是第一人稱「我們」；<strong>ἐν λόγῳ κυρίου<\/strong> 標明權柄在主。可是同一位保羅在下一章說「論到時候、日期，不用寫信給你們」（5:1）。經文問的是：「我們」是保羅對日期的預測，還是別的意思？<\/p>"],["預期落空說","","<p>部分學者認為保羅在寫帖撒羅尼迦前書時，確實預期主會在他有生之年回來，「我們這活著的人」就是他自己和他那一代；後來主沒有回來，保羅在晚期書信（腓 1:23、提後 4:6）才轉而預備死亡。所以保羅的末世觀有「發展」，早期的預期是錯的。<\/p><p><strong>難處：<\/strong>4:15 並沒有說「我們一定會活到」，只是把自己放在活著的人那一邊；同一封信 5:1--2 明說日子像夜間的賊，不可知；寫信時，保羅也已經面對過被石頭打、幾乎喪命的經歷（徒 14:19）。把一個姿態讀成一個預測，是把句子推得比它說的更遠。<\/p>"],["一般第一人稱說（「我們」只是分類）","","<p>認為「我們」只是把人分成兩類：到主來時活著的信徒，和已經睡了的信徒。保羅說話時自己是活著的，所以很自然地說「我們這活著的人」；就像今天的人說「我們這一代」，並不是在預測自己的壽命。<\/p><p><strong>難處：<\/strong>這個讀法可能淡化了保羅語氣中真實的盼望——他是真的盼望主可能在他這一生回來；若把「我們」只當成文法上的分類，也會失去這幾節經文給每一代信徒的那股迫切。<\/p>"],["迫近但不定時說","","<p>認為保羅確實活在「主可能隨時回來」的盼望裡，所以把自己放在可能活著的人當中；但他從來沒有定下日子，而且同時也預備自己可能先睡了（後來說「情願離世與基督同在」，腓 1:23）。這是一種姿態：每一代信徒都該活得像主可能在自己這一生回來，卻不排時間表。<\/p><p><strong>難處：<\/strong>這個說法需要同時抓住兩件看似拉扯的事：迫切與不知道；講得不好，會滑向前一種（迫切變成推算），或滑向後一種（不知道變成不在乎）。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採迫近但不定時說，也吸收一般第一人稱說的觀察；不採預期落空說。<\/strong>保羅把自己放在每一代信徒該站的位置上——主可能在我有生之年來——卻從來沒有說主哪一年回來。他後來面對死亡同樣平安，因為無論活著見主來，或先睡了，結局都是「和主永遠同在」（4:17）。<\/p><p>所以這節經文不能拿來推算年份，也不能拿來說「保羅算錯了」。本講義的全卷立場見議題「主再來、被提與末世時間表」；這類爭議與信心的關係，見議題「這些爭議該不該影響一個人的信心？」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。保羅給我們的不是一張日曆，是一種活法：今天做好手上的工（4:11），今天彼此勸慰（4:18），因為主可能今天回來；也不慌張，因為就算我先睡了，也一樣在耶穌裡。兩千年來，每一代信徒都這樣等候；你不是在等一個日子，你是在等一個人。<\/p>"]],"con":[],"say":"本講義的立場：保羅把自己放在每一代信徒該站的位置上——主可能在我有生之年回來——卻從未定下日子；4:15 不能拿來推算年份，也不能拿來說「保羅算錯了」。本講義的全卷立場見議題「主再來、被提與末世時間表」，爭議與信心見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上有讀過批判學者的書、開始懷疑聖經可靠性的大學生，也有曾經相信「我們這一代一定會被提」、把人生計畫都擱下的長輩。講台上不要嘲笑提問的人，也不要用「主快來了」叫人放下讀書、工作與照顧家人的責任。陪伴時，讓提問的人慢慢問完，陪他讀 4:15 與 5:1--2 的上下文；對曾經因末日預期而錯過人生機會的人，先承認那份失落是真的。"},{"id":"ISS05_1","t":"5:1--2「時候、日期」——時事、預言與對號入座：可以推算主再來的日子嗎？","r":"5:1--3；太24:36；徒1:7；太24:42--44","ch":[5],"why":"幾乎每一代都有人宣布主再來的年份，華人教會也經歷過好幾次：有人辭了工作、賣了房子，有人等到那一天落空，從此不再相信。今天的版本是群組裡轉來轉去的末日影片與「預言應驗」圖表。帖撒羅尼迦人問的正是這個問題，保羅的回答很短，卻是全卷最清楚的一個拒絕。","pos":[["【一】經文問的是甚麼","","<p>「弟兄們，論到時候、日期，不用寫信給你們，因為你們自己明明曉得，主的日子來到，好像夜間的賊一樣。」（5:1–2）原文 <strong>τῶν χρόνων καὶ τῶν καιρῶν<\/strong>（tōn chronōn kai tōn kairōn）一個問「還要多久」，一個問「是哪一刻」；復活的主對門徒用的也是這一對字：「父憑著自己的權柄所定的時候、日期，不是你們可以知道的」（徒 1:7）。問題是：保羅不寫，是因為不能知道，還是因為帖撒羅尼迦人已經知道？我們今天可以從聖經和時事推算出來嗎？<\/p>"],["推算可行說（從經文數字與歷史週期算出年份）","","<p>歷代都有人認為，但以理書的七十個七、啟示錄的一千二百六十天、創造的「六千年」等數字是密碼，配合歷史事件，可以算出主再來的年份；十九世紀美國的米勒耳算出 1844 年，二十世紀以來也有人公布過 1988、1994、2011 等年份。他們的動機常常是真誠的：要人趕快悔改。<\/p><p><strong>難處：<\/strong>每一次都落空了，而且每一次都留下一批失望、離開信仰的人。更根本的是，它正面違背主耶穌的話：「但那日子，那時辰，沒有人知道，連天上的使者也不知道，子也不知道，惟獨父知道。」（太 24:36）連子都說不知道的事，人不可能比他知道得更多。<\/p>"],["徵兆辨識說（不定日期，但從時事判斷「就在這一代」）","","<p>這一派不公布年份，但認為主耶穌給了徵兆（太 24 章：戰爭、饑荒、地震、以色列的事），所以可以從新聞判斷「已經非常近了」，甚至「我們這一代一定會看見」。部分時代論的通俗作品、許多末世講座屬於這一類；他們提醒人不要麻木，這是對的。<\/p><p><strong>難處：<\/strong>主耶穌講徵兆時說「這些事是必須有的，只是末期還沒有到」（太 24:6）；徵兆是叫人警醒的，不是叫人計算的。把新聞對號入座，其實是換一種方式在算日子；兩千年來每一代都有人確信自己就是最後一代，結果製造的多半是恐慌，而不是 5:8 的盼望。<\/p>"],["不可知、常預備說（多數教父與宗教改革傳統）","","<p>認為主再來的日子是神隱藏的，人不能知道，也不必知道；保羅說「不用寫信給你們」，因為他早就教過他們：那日子像賊，不預告。所以要做的不是推算，而是每一天都活成白晝之子（5:4–8）。這是奧古斯丁、加爾文以來多數教會的立場。<\/p><p><strong>難處：<\/strong>若講得不好，容易變成「反正不知道，就不用想」，把主再來從生活裡移走，失去了 5:6 的醒與 1:10 的等候；也可能讓一些真誠關心時局的弟兄姊妹覺得被嘲笑。不可知，不等於不重要。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見議題「主再來、被提與末世時間表」，本章不另立說法。<\/strong>主耶穌一定會親自、身體地、可見地再來；但時候、日期不可推算，本講義不寫時間表、不公布年份、不把時事對號入座、不用「被留下來」恐嚇人。被提時間與千禧年各派並陳，持守的都是弟兄。<\/p><p>保羅的回答方式本身就是答案：他不給日期，給身分（5:5）；不給圖表，給盔甲（5:8）；不給倒數，給應許（5:9）。認真等候主的人，不是緊張地盯著日曆，而是每一天把手上的事做好、把身邊的人顧好。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你曾經被某一個日期預言騙過，那不是聖經失敗了，是有人說了聖經沒有說的話。主再來的確定，從來不建立在任何人算得準不準上，而是建立在那位「從死裡復活的」耶穌身上（1:10）。你不必知道日子；你只要知道是誰要來，並且每天都把燈點著。<\/p>"]],"con":[],"say":"本講義的立場：主一定會再來，但時候、日期不可推算——保羅拒絕寫時間表，我們也不寫；不公布年份、不把時事對號入座、不用「被留下來」恐嚇人。本講義的全卷立場見議題「主再來、被提與末世時間表」。","care":"會眾席上可能有人曾經為某一個「預言年份」辭職、賣房、跟家人鬧翻，落空之後羞愧得不敢再談信仰；也可能有人因為長期看末日影片而焦慮失眠，或有孩子被「被提」嚇得哭著睡不著。不要嘲笑曾經相信的人，也不要說「你被騙是因為你不讀經」。陪他把失望說出來，再陪他回到 5:9 的應許；若焦慮已經影響睡眠與生活，協助他尋求專業協助。"},{"id":"ISS05_2","t":"5:9「神不是預定我們受刑」——預定論與得救的確據：我怎麼知道自己不是被預定受刑的那一個？","r":"5:9--10；1:4；弗1:4--5；約10:28","ch":[5],"why":"「預定」兩個字一出現，有人立刻想到加爾文與阿米念的辯論，有人卻在半夜裡反覆問自己：萬一我不在名單上呢？5:9 本來是一句安慰的話，卻常常被拉進預定論的戰場，或被敏感的人讀成另一種恐懼。這一題關乎怎樣讀這一節，也關乎得救的確據放在哪裡。","pos":[["【一】經文問的是甚麼","","<p>「因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救。他替我們死，叫我們無論醒著，睡著，都與他同活。」（5:9–10）原文 <strong>οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν<\/strong>（ouk etheto hēmas ho theos eis orgēn），ἔθετο（etheto）是「安置、指定」；全卷另一處相關的話是 1:4「被揀選」。問題是：這一節是在講神永遠的揀選名單，還是在講神為信徒定下的方向？讀的人怎樣才能確知自己屬於救恩？<\/p>"],["無條件揀選說（改革宗）","","<p>認為 5:9 與 1:4「知道你們是蒙揀選的」連在一起，說明神在永恆裡主動揀選了這些人，並且必定保守到底（5:24）；得救的根基在神的旨意，不在人的選擇，所以確據是堅固的：「誰也不能從我手裡把他們奪去」（約 10:28）。<\/p><p><strong>難處：<\/strong>若把預定講成一張冷冰冰的名單，敏感的人會開始往自己裡面挖：「我的信是真的嗎？我是不是被揀選的？」確據反而變成焦慮；也容易讓人對「沒有被揀選的人」說出經文沒有說的斷語。<\/p>"],["條件預定說（阿米念、衛斯理傳統）","","<p>認為神所預定的是一條路——「藉著我們主耶穌基督」得救；凡信靠基督的人都在這條路上。神預知人的回應，人的信心是真實的回應，不是被程式設定好的。這一派強調神願意萬人得救，也強調信徒要持續回應恩典。<\/p><p><strong>難處：<\/strong>若強調人的回應過了頭，確據會悄悄回到自己的表現上：「我夠不夠忠心？我會不會掉出去？」這樣讀，也容易低估 5:24「他必成就」裡神主動的保守。<\/p>"],["處境方向說（多數當代釋經者）","","<p>認為 5:9 的上下文是末世與安慰，不是在建構預定論：保羅剛講完夜裡的賊與醉漢，立刻告訴嬰孩教會，神為你們定的方向是救恩，不是忿怒（回指 1:10）。ἔθετο 的重點是「神把我們放在哪一條路上」，根據是 5:10「他替我們死」。這一讀法可以和上面兩種系統並存。<\/p><p><strong>難處：<\/strong>不能因此說保羅不在乎神的主權——1:4 的揀選與 5:24 的「他必成就」都很清楚；處境讀法回答了這一節的用途，卻沒有替揀選與預定的大問題下結論。<\/p>"],["【三】本講義站在哪裡","","<p><strong>揀選與預定的系統討論，本講義回指以弗所書立場二，本卷不另立說法；5:9 的末世面向見全卷立場議題「主再來、被提與末世時間表」。<\/strong><\/p><p>本講義讀 5:9 的落點是：這是一句給信徒的應許，不是一份讓人去猜的名單。確據不在往自己心裡挖，而在往十字架看——「他替我們死」（5:10）；不是我們醒得夠久，是他死得夠徹底。凡投靠這位替我們死的主的人，可以放心地說：神為我定的方向是救恩。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。改革宗與衛斯理傳統的弟兄姊妹爭論了幾百年，卻都在同一個十字架前得救。你今晚不必解決預定論，才能睡得安穩；你只要知道，那召你的是信實的（5:24）。若你一直擔心自己不在名單上，這份擔心本身，正說明你在乎神——把它帶到主面前，而不是帶進更深的自我檢查。<\/p>"]],"con":[],"say":"本講義的立場：5:9 不是一張讓人去猜的名單，是給信徒的末世應許——神為我們定的方向是救恩，根據是「他替我們死」（5:10）。揀選與預定的系統討論回指以弗所書立場二；末世面向見本講義的全卷立場議題「主再來、被提與末世時間表」。","care":"會眾席上可能有人長期陷在「我是不是被揀選、我是不是犯了不得赦免的罪」的反覆恐懼裡，越禱告越不安。不要對他說「你會擔心，可能就表示你不是」，也不要丟給他一堆神學名詞。陪他把眼光從自己移到基督身上，一起讀 5:9–10；若這種反覆的念頭已經讓他無法睡眠、工作，溫和地協助他尋求專業協助，這和信心並不衝突。"},{"id":"ISS05_3","t":"5:12--13「敬重……治理你們、勸戒你們的」——怎樣敬重領袖？領袖可以被質疑嗎？","r":"5:12--13；5:21；2:6--9；來13:17","ch":[5],"why":"華人教會有兩種傷：一種是領袖被神化，提出問題就被說成悖逆，有人在屬靈控制裡受傷多年；另一種是牧者被消耗，會眾把他當成雇員，挑剔、冷漠、不代禱。5:12–13 常被兩邊各拿一半來用。這一題要問：保羅到底叫人敬重甚麼？","pos":[["【一】經文問的是甚麼","","<p>「弟兄們，我們勸你們敬重那在你們中間勞苦的人，就是在主裡面治理你們、勸戒你們的；又因他們所做的工，用愛心格外尊重他們。」（5:12–13）原文「敬重」是 <strong>εἰδέναι<\/strong>（eidenai），「認識」；三個描寫領袖的字 κοπιῶντας（kopiōntas）、προϊσταμένους（proistamenous）、νουθετοῦντας（nouthetountas）都是分詞，排第一的是「勞苦」。問題是：敬重是對職分的順服，還是對工作的肯定？敬重和察驗（5:21）怎樣並存？<\/p>"],["職分權柄說（敬重即順服神所設立的權柄）","","<p>認為教會領袖是神所設立的，會眾應當順服，並引用「你們要依從那些引導你們的，且要順服」（來 13:17）的教導；「治理」προϊσταμένους 有站在前面帶領、管理的意思，所以 5:12 包含真實的權柄。這一派重視秩序，避免教會人人各行其是。<\/p><p><strong>難處：<\/strong>保羅用的是動詞，不是頭銜；若把敬重講成對職位的無條件順服，很容易被濫權的人利用，受傷的人也會以為「質疑」就是得罪神。這一派若不同時講 5:21 的察驗與 2:6–9 保羅自己放下權柄的榜樣，就只講了半段。<\/p>"],["平等弟兄說（淡化職分，敬重只是彼此尊重）","","<p>認為保羅這封信沒有提長老、執事的頭銜，帖撒羅尼迦教會只有幾個月大，所以 5:12 只是一般性地叫人尊重熱心服事的人；教會是弟兄姊妹組成的家，不需要特別的權柄階層。這一派警惕屬靈控制，保護一般信徒的聲音。<\/p><p><strong>難處：<\/strong>低估了 5:13「格外尊重」ὑπερεκπερισσοῦ（hyperekperissou）的分量——那是「超乎尋常、加倍再加倍」；保羅確實要教會看重勞苦帶領的人。只講平等不講敬重，牧者與同工很容易在冷漠裡被消耗殆盡。<\/p>"],["【三】本講義站在哪裡","","<p><strong>屬靈權柄的整體立場，本講義回指哥林多後書立場三，本卷不另立說法。<\/strong>5:12–13 本身說得很清楚：敬重從「認識」開始；敬重的理由是「因他們所做的工」（5:13），不是坐的位子；敬重的方式是「用愛心」。<\/p><p>同一段後面保羅說「但要凡事察驗」（5:21），講台的話也在其中；保羅自己「雖然可以叫人尊重」，卻選擇像母親一樣餵養、晝夜做工（2:6–9）。所以敬重與質疑並不對立：真正勞苦的領袖歡迎被認識、被察驗；用敬重之名封住所有問題，就是屬靈控制（紅線七）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你若曾被一位領袖傷害，那不是神要你承受的「順服功課」；你若是一位疲憊的領袖，會眾的冷漠也不代表你的勞苦白費。教會的頭是基督，不是任何一位牧者。我們可以誠實地認識領袖的軟弱，也可以真心地感謝他們的勞苦——兩件事可以在同一個禮拜發生。<\/p>"]],"con":[],"say":"本講義的立場：敬重從「認識」開始，理由是他們所做的工，不是頭銜；5:21 凡事察驗也包括講台，敬重不是不可質疑，用敬重包裝控制就是屬靈控制。屬靈權柄的整體立場回指哥林多後書立場三。","care":"會眾席上可能有人在上一間教會被「屬靈父親」控制過：被要求交出決定權、被說離開就會受咒詛，至今一聽到「順服」就發抖。也可能有牧者與同工正在無聲地耗盡。講台上不點名、不翻舊帳；對受傷的人，先相信他、聽他說完，不要說「你要饒恕、要順服」；若牽涉權勢性侵或財務不當，要啟動公平的處理與外部協助。對疲憊的同工，教會要具體地照顧他的休息與家庭。"},{"id":"ISS05_4","t":"5:14「勉勵灰心的人」——憂鬱、焦慮是信心不足嗎？教會怎樣陪伴？","r":"5:14；4:13；王上19:4--8；腓2:27","ch":[5],"why":"華人教會裡，憂鬱與焦慮常常被當成屬靈問題處理：多讀經、多禱告、認罪、趕鬼；吃藥看醫生被看成不信。結果正在受苦的人把病藏起來，有人甚至在沉默裡走上絕路。5:14 是保羅給一間嬰孩教會的牧養指令，正好讓我們重新問：教會該怎樣對待心縮小了的人？","pos":[["【一】經文問的是甚麼","","<p>「我們又勸弟兄們，要警戒不守規矩的人，勉勵灰心的人，扶助軟弱的人，也要向眾人忍耐。」（5:14）原文「灰心的人」<strong>ὀλιγοψύχους<\/strong>（oligopsychous）字面是「魂小的、心縮小的人」，動詞 παραμυθεῖσθε（paramytheisthe）是溫和地安慰、在旁邊說話。保羅沒有把四種人放在同一個籃子裡：灰心的人要勉勵，不是警戒。問題是：今天的憂鬱症、焦慮症，是 5:14 的「灰心」嗎？是信心不足嗎？教會能做甚麼、不能做甚麼？<\/p>"],["屬靈根源說（憂鬱是罪、不信或屬靈攻擊）","","<p>認為信徒既有主的喜樂（5:16），長期的憂鬱就表示屬靈上出了問題：可能是隱藏的罪、不肯饒恕、信心軟弱，或屬靈的攻擊；解藥是悔改、讀經、禱告、趕鬼。這一派認真看待人的屬靈生命，也提醒人不要只把人當成一堆化學物質。<\/p><p><strong>難處：<\/strong>保羅對灰心的人用的動詞正是「勉勵」，不是「警戒」；先知以利亞在羅騰樹下求死，神給他的是食物和睡眠（王上 19:4–8），不是責備。把病講成罪，會讓受苦的人更羞愧、更不敢求助，甚至停藥；阻止就醫，可能延誤到危險的地步（紅線八）。<\/p>"],["純醫療說（交給專業，教會不必介入）","","<p>認為憂鬱症、焦慮症是醫學上的疾病，有生理、心理與環境的成因，應當由精神科醫師與心理師處理；教會若插手，常常講錯話、造成二度傷害，所以最好保持距離，只負責轉介。這一派尊重專業，避免了許多屬靈濫用。<\/p><p><strong>難處：<\/strong>5:14 是對「弟兄們」說的，勉勵灰心的人是全教會的工作，不能整個外包出去；許多受苦的人最需要的，除了治療，還有一個不離開的群體。只轉介不陪伴，灰心的人會在教會裡變成隱形人。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在整全陪伴：禱告、陪伴、就醫與服藥並不衝突。<\/strong>焦慮與憂鬱是否等於信心不足，腓立比書講義第 4 章議題已處理（保羅自己也會「憂上加憂」，腓 2:27）；本章補上的是 5:14 的牧養次序：先分辨眼前是哪一種人，對灰心的人用勉勵的動詞，對軟弱的人伸出扶助的手，對所有人長長地忍耐。<\/p><p>具體地說：不責備、不追問、不急著給答案；陪他吃飯、陪他去看醫生、陪他走過治療的起伏；小組長手上要有可以轉介的醫師與輔導名單。若有人說出不想活的話，當天就陪他尋求專業協助（紅線八）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。灰心、憂鬱、焦慮不表示你不是神的孩子；保羅在信裡特別點名，要全教會勉勵你。聖經裡最愛神的人，也有過求死的夜晚。你今天需要治療，就像身體受傷需要包紮一樣，那是照顧神所造的人，不是背叛信心。<\/p>"]],"con":[],"say":"本講義的立場：5:14 對灰心的人用的動詞是「勉勵」，不是「警戒」；憂鬱、焦慮是需要陪伴與治療的真實處境，禱告、陪伴、就醫與服藥並不衝突。憂鬱焦慮是否等於不信，回指腓立比書講義第 4 章議題。","care":"會眾席上一定有人正在服藥、正在諮商，卻不敢讓教會知道；也可能有人的家人因為憂鬱自殺，這一題會撕開他的傷口。講台上不說「信心夠就不會憂鬱」，不對正在流淚的人說「你要有信心」，不追問細節。會後單獨關心，陪伴的人自己也要有人支持；若有人透露自傷或輕生的念頭，不要獨自承擔，當天協助他尋求專業協助與危機資源。"},{"id":"ISS05_5","t":"5:16--18「常常喜樂，不住地禱告，凡事謝恩」——連壞事也要謝恩嗎？","r":"5:16--18；4:13；弗5:20；羅8:28","ch":[5],"why":"「凡事謝恩」是華人教會最常貼在牆上的經文之一，也是最常被拿來壓住眼淚的經文之一：孩子病了要謝恩、被裁員要謝恩、被侵害也要謝恩。受傷的人聽了，以為神喜歡他受傷，或以為自己難過就是不屬靈。這一題要問：保羅到底要人為甚麼謝恩？","pos":[["【一】經文問的是甚麼","","<p>「要常常喜樂，不住地禱告，凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。」（5:16–18）原文 <strong>ἐν παντὶ εὐχαριστεῖτε<\/strong>（en panti eucharisteite）是「在凡事中謝恩」；但以弗所書另有一句，說要「凡事」常常感謝父神（弗 5:20），原文用的是 ὑπὲρ πάντων（hyper pantōn），「為一切」。這封信又是寫給剛埋葬親人、正在被逼迫的人（4:13；3:3）。問題是：謝恩包括為惡事本身感謝嗎？常常喜樂是不准難過嗎？<\/p>"],["為凡事謝恩說（連惡事也感謝，因神掌權）","","<p>認為神掌管萬有，「萬事都互相效力，叫愛神的人得益處」（羅 8:28），所以信徒可以、也應當為一切臨到的事感謝，包括疾病、損失與苦難；弗 5:20 的「為一切」支持這個讀法。這一派要人在苦難裡仍然信靠神的主權，許多受苦的聖徒也這樣作過美好的見證。<\/p><p><strong>難處：<\/strong>若講成為罪惡本身感謝——為家暴、為性侵、為不公義感謝——神就像是惡的作者，受害者被迫說謝謝。羅 8:28 說的是神使萬事「效力」，不是說萬事本身都是好的；弗 5:20 的上下文是被聖靈充滿的敬拜，也不是要人為罪惡道謝。<\/p>"],["在凡事中謝恩說（在任何處境裡，向神保持感謝）","","<p>認為 5:18 的 ἐν παντί 是「在一切處境之中」：不論處境多黑，都不要失去對神的感謝——感謝他的同在、他的應許、他替我們死（5:10）；但不是為惡事本身感謝。病床邊的人可以說：這個病我不感謝，但我感謝你在這裡。這讀法保護受傷的人，也保留了謝恩的真實。<\/p><p><strong>難處：<\/strong>若講得太輕，可能把謝恩縮小成「找一點好事來感謝」，漏掉神在一切之上的主權與弗 5:20 更寬的視野；有些受苦的聖徒確實在多年以後，能為那段苦難本身感恩——那是神在他們身上的工作，不能被否定，只是不能拿來要求別人。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在「在凡事中謝恩」：在任何處境裡向神開口感謝，不是為惡事本身道謝，也不是否認情緒。<\/strong>受苦與家人反對的整體立場見全卷立場議題「受苦、逼迫與家人反對」；哀傷與眼淚見議題「哀傷與盼望：死亡、喪禮與祭祖」。<\/p><p>保羅寫「常常喜樂」的對象，正是在哭的人；喜樂與眼淚可以同時存在。5:18 說這是神「所定的旨意」——和 4:3 一樣，神的旨意是「你要成為怎樣的人」：一個在黑夜裡仍然認得神、向他開口的人。若有人多年以後能為苦難本身感恩，那是恩典的果子，不是給正在流淚的人的作業（紅線八）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你今天說不出感謝，不表示你失去了信心；你今天還在哭，也不表示你違背了 5:16。從一句很小的感謝開始就好：感謝你今天沒有離開我。神不需要你假裝，他要的是你在真實裡仍然對他說話。<\/p>"]],"con":[],"say":"本講義的立場：5:18 是在凡事中謝恩，不是為惡事謝恩；常常喜樂不是否認情緒，喜樂可以和眼淚同在。受苦與家人反對見本講義的全卷立場議題「受苦、逼迫與家人反對」，哀傷與眼淚見議題「哀傷與盼望：死亡、喪禮與祭祖」。","care":"會眾席上可能有剛失去孩子的父母、剛被侵害的人、剛被裁員的中年人，曾經被人用「凡事謝恩」要求他們馬上感恩。講台上不要說「你應該感謝神讓這件事發生」，不對正在流淚的人說「你要有信心」，不要求受害者原諒或感謝。會後單獨關心，先陪他哭；涉及侵害或暴力，協助他尋求專業與法律協助。"},{"id":"ISS05_6","t":"5:19--21「不要消滅聖靈的感動，不要藐視先知的講論」——今天還有先知講論嗎？怎樣察驗？","r":"5:19--22；林前14:3；林前14:29；約壹4:1","ch":[5],"why":"有的教會一聽到「先知講論」就緊張，乾脆全部禁止；有的教會常有人說「神告訴我」，甚至替別人決定婚姻、工作與去留。5:19–21 兩邊都碰到：不要熄滅，也要察驗。這一題直接影響主日的敬拜、小組的禱告，也影響有人會不會被「預言」傷害。","pos":[["【一】經文問的是甚麼","","<p>「不要消滅聖靈的感動；不要藐視先知的講論。但要凡事察驗；善美的要持守，各樣的惡事要禁戒不做。」（5:19–22）原文 5:19 只有四個字 <strong>τὸ πνεῦμα μὴ σβέννυτε<\/strong>（to pneuma mē sbennyte），「不要熄滅那靈」；和合本的「聖」與「的感動」是小字補充。σβέννυτε 是滅火的字，δοκιμάζετε（dokimazete）是驗金子的字。問題是：帖撒羅尼迦教會的「先知講論」是甚麼？今天還有嗎？若有，要怎樣察驗？<\/p>"],["止息論（先知與啟示性恩賜已經停止）","","<p>認為新約時代的先知講論是聖經正典完成以前，神暫時賜給教會的啟示；正典完成之後，這類恩賜已經止息，今天的「先知講論」就是忠實地講解聖經。這一派保護了聖經的獨特權威，避免各種「新啟示」與聖經並列。<\/p><p><strong>難處：<\/strong>5:19–20 的命令沒有附上期限，保羅叫人「不要藐視」；若一律否定，容易把聖靈今天在教會裡的引導、安慰與光照一併熄滅，也可能讓來自靈恩背景的弟兄姊妹覺得被貶低。<\/p>"],["延續論（先知講論今天仍然存在）","","<p>認為聖靈的恩賜持續到主再來，今天仍有先知講論，它的功用是「造就、安慰、勸勉人」（林前 14:3）；它的權威低於聖經，要在聚會中被眾人察驗（林前 14:29）。這一派重視聖靈在群體中活潑的工作，也提醒人不要讓教會冷掉。<\/p><p><strong>難處：<\/strong>實際操作上，「神告訴我」很容易越過察驗，變成控制別人的工具：預言婚姻、預言醫治、預言某人該離開或留下；落空的時候，受傷的往往是聽的人，而不是說的人。延續論若不同時認真執行 5:21，就只講了一半。<\/p>"],["【三】本講義站在哪裡","","<p><strong>先知講論與屬靈恩賜的整體立場，本講義回指哥林多前書 12–14 章議題，本卷不另立說法。<\/strong><\/p><p>5:19–22 自己的平衡是本講義的落點：不要熄滅，也要察驗；不怕火，也不怕驗。不論各教會在止息論與延續論之間站在哪裡，都有兩件事可以一起做：不藐視聖靈在群體中的工作，也讓一切「神的話」——包括講台——接受聖經與眾人的察驗。任何人都不可以用「神告訴我」替別人決定婚姻、工作與去留（紅線七）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你若曾經被一句落空的「預言」傷害，那不是聖靈欺騙了你，是有人沒有經過察驗就說話。聖經已經把最確定的話交給我們：那召你們的本是信實的（5:24）。善美的要持守，其餘的可以放下。<\/p>"]],"con":[],"say":"本講義的立場：5:19–21 要我們不要熄滅那靈，也要凡事察驗——一切「神的話」都要接受聖經與眾人的察驗，不可用來控制人。先知講論與屬靈恩賜回指哥林多前書 12–14 章議題。","care":"會眾席上可能有人被「預言」說過會嫁給某人、會得醫治、會發大財，結果落空，從此懷疑神；也可能有人從靈恩教會來，常被說成「太情緒」。不要嘲笑任何一邊的經歷。對被預言傷害的人，先聽他說完，幫他分清楚神的應許與人的話；若「預言」牽涉到控制、金錢或身體界線，要啟動教會的處理與外部協助。"},{"id":"ISS05_7","t":"5:23「靈與魂與身子」——二分說、三分說與整全說；倪柝聲《屬靈人》怎樣看？","r":"5:23；來4:12；太10:28；可12:30","ch":[5],"why":"華人教會受倪柝聲弟兄《屬靈人》影響很深，「靈、魂、體」是許多信徒認識自己的框架；但也有人用「屬魂的」貶低別人的眼淚、思考與性格，把信徒分成屬靈和屬魂兩等。另一邊又有人嘲笑三分說是異端。5:23 是全卷最接近「人觀」的一節，值得把各家說清楚，再回到保羅禱告的重點。","pos":[["【一】經文問的是甚麼","","<p>「願賜平安的神親自使你們全然成聖！又願你們的靈與魂與身子得蒙保守，在我們主耶穌基督降臨的時候，完全無可指摘！」（5:23）原文 <strong>ὁλοτελεῖς<\/strong>（holoteleis）是「徹徹底底」，<strong>ὁλόκληρον<\/strong>（holoklēron）是「每一部分都在、完整無缺」，接著列出 τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα。問題是：保羅在這裡是教導人由三個部分組成嗎？還是用三個詞說「整個人」？<\/p>"],["三分說（部分教父；倪柝聲《屬靈人》、華人地方教會傳統）","","<p>認為人由靈、魂、體三部分構成：靈與神相交，魂是思想、情感、意志，體是身體；並以來 4:12「魂與靈……都能刺入、剖開」為佐證。倪柝聲弟兄據此教導信徒分辨靈與魂，幫助了無數華人信徒認真對待內在的生命；他為主長年受苦、至死忠心的見證，值得尊敬。<\/p><p><strong>難處：<\/strong>聖經其他地方常常只用兩個詞，甚至「靈」與「魂」互換（路 1:46–47）；更大的危險在應用：把「屬魂」當成標籤，否定人的情感、理性與性格，或把信徒分成屬靈與屬魂兩個階級（紅線五）。<\/p>"],["二分說（奧古斯丁以來多數西方神學）","","<p>認為人由物質的身體與非物質的靈魂兩部分構成，「靈」與「魂」是同一個非物質部分的兩種說法；主耶穌說「那殺身體不能殺靈魂的，不要怕他們」（太 10:28），只分身體與靈魂。這一派在西方教會是主流。<\/p><p><strong>難處：<\/strong>它要解釋為甚麼保羅在 5:23 刻意列出三個詞，來 4:12 也把魂與靈分開；若只說「保羅只是隨口列舉」，也可能太快略過經文的用字。<\/p>"],["整全說（多數當代學者）","","<p>認為 5:23 是禱告的修辭，像主耶穌說「要盡心、盡性、盡意、盡力愛主你的神」（可 12:30），列出幾個詞是為了說「整個人」，不是給人體做解剖圖；ὁλοτελεῖς 與 ὁλόκληρον 兩個「全」字，正說明重點在完整。聖經看人是一個整體，身體與內在不可分割。<\/p><p><strong>難處：<\/strong>它回答了 5:23 的重點，卻沒有直接回答人的構成問題；若講得太快，也可能讓人覺得三分說傳統被輕看了。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」，本章不另立說法。<\/strong>三分說、二分說、整全說並陳，持守的都是弟兄；尊重倪柝聲弟兄對華人教會的貢獻與為主受苦的見證，不攻擊、不嘲笑。<\/p><p>5:23 的落點是兩個「全」字：神要保守整個人——你與神的相交、你的眼淚與思想、你的身體與每天做工的手，全都在他的保守裡。所以不要把「屬魂的」當成罵人的話：流淚的人不是「魂在作工」，會思考的人不是「不夠屬靈」（紅線五）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你相信人有三部分還是兩部分，保羅禱告的對象都是同一位：賜平安的神親自使你全然成聖。他

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321帖撒羅尼迦前書講義">
<meta name="application-name" content="321帖撒羅尼迦前書講義">
<meta name="description" content="321帖撒羅尼迦前書講義：全書五章逐節原文解經、講章逐字稿與321生命應用。">
<title>321帖撒羅尼迦前書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}

function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);

    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"離棄偶像，歸向神","sub":"工、印、歸","lv":"A","arc":"歸","sec":[["1:1","保羅、西拉、提摩太寫信給帖撒羅尼迦在父神和主耶穌基督裡的教會：問安"],["1:2--5","不住地記念你們因信心所做的工夫：信愛望與蒙揀選"],["1:6--8","領受真道就效法我們，也效法了主：榜樣與傳開"],["1:9--10","離棄偶像，歸向神：服事與等候"]],"serm":{"pts":[["信愛望的勞動","1:2--5","「因信心所做的工夫，因愛心所受的勞苦」——帖撒羅尼迦人信主才三個安息日；保羅記念的不是他們懂多少，是他們手上的工、身上的累、心裡撐住的忍耐"],["被蓋了印的人","1:6--8","「領受真道就效法我們，也效法了主」——在大難之中蒙了聖靈所賜的喜樂；被蓋了印的人自己也成了印，主的道從他們那裡像鐘聲一樣響出去"],["轉身與等候","1:9--10","「離棄偶像，歸向神」——信主是一個轉身：轉離偶像、服事又真又活的神、「等候他兒子從天降臨」；今天的轉身，常常發生在家裡的神明桌前"]]},"q":"你還記得自己是怎麼信主的嗎？有人記得很清楚：一場佈道會、醫院走廊上的一次禱告、朋友在速食店裡把福音講完。也有人說不出日期，只記得家裡那張神明桌，從某一年開始，自己就不再上香了；接著是第一個過年、第一個清明，飯桌上忽然沒有人跟你說話。\n也有另一種人，信主已經二十年，聖經讀過好幾遍，揀選、末世都說得出幾派；只是很久沒有為信耶穌付上一點代價，很久沒有累過，也很久沒有抬頭等過誰。\n這一章問的是：一個屬靈生命到底是怎麼生出來的？是從懂得夠多開始，還是從一個轉身開始——轉向那位先愛了你、正在救你、而且一定會回來的主？","truth":"信心長出手來做工，愛心肯累到筋疲力盡，盼望在重擔底下不走開——這是神在一間只有幾個禮拜大的教會裡做成的事，因為他們是被神所愛、蒙揀選的，福音帶著權能和聖靈臨到他們（1:3–5）。\n信主就是出生：一個轉身，從偶像轉向又真又活的神，一面服事他，一面等候那位從死裡復活、現在就在救我們的耶穌。","mv":{"t":"你們是怎樣離棄偶像，歸向神，要服事那又真又活的神","r":"帖前1:9"},"card":["這一章在講出生——全卷是一個孩子的成長：歸、養、穩、聖、醒，第一步是「歸」。一間創辦人被連夜送走、只有幾個禮拜大的教會，保羅回頭看它是怎麼生出來的：福音帶著聖靈臨到，他們在大難中領受真道，轉身離開偶像，開始服事又真又活的神，也開始等候。全章拎起來就是一句：「離棄偶像，歸向神」（1:9）——一個屬靈生命，是從一個轉身開始的。","這一章裡，第一個動的是神。他們是「被神所愛的弟兄」（1:4），原文是完成式被動：還沒做甚麼，已經被愛，而且一直被愛著。揀選是神的；福音能進門，是因為「也在乎權能和聖靈」（1:5）；苦裡的喜樂，是「聖靈所賜的喜樂」（1:6）；他們等候的那一位，是神「從死裡復活的」（1:10），而且現在就在救他們。人轉身，是因為神先轉向了人。","1:6「領受真道」的「領受」，原文 δεξάμενοι（dexamenoi），是接待客人的字：開門、迎進來、請他坐下。帖撒羅尼迦人迎進門的這位客人，是帶著麻煩一起來的——耶孫開了門，暴民就闖進了耶孫的家（徒 17:5）。這改變今天的讀法：信主不只是心裡同意一套道理，是在自己的家裡給主一個位子，連他帶來的代價一起接待。2:13 會用同一個動詞再說一次：他們接待的，是神的道。","這一章照出一個信主多年的人不太敢承認的事：我知道的比帖撒羅尼迦人多太多，手上的工、身上的累、心裡的等候卻比他們少。他們信了幾個禮拜，信心已經有手；我信了二十年，信心可能只剩下一張嘴。也照出另一件事：我家裡沒有神明桌，中間那一格卻不一定空著——孩子的成績、帳戶的數字、老闆的一句肯定。偶像不一定有香爐；凡是我一失去就活不下去的，都在搶那個位子。","「離棄偶像，歸向神」（1:9）。全章最該被記住的動作是「歸向」——轉身。路加福音那個浪子也是這樣：「於是起來，往他父親那裡去」（路 15:20）；可是他還在半路，「相離還遠，他父親看見，就動了慈心」（路 15:20），跑了過來。轉身的人只走了幾步，迎面跑來的是父。你的轉身不必走得漂亮，只要臉朝著他；剩下的路，他會跑過來。","這一週去接一個剛出生的生命：找一位一年內信主、或剛開始來聚會的人——小組的新朋友、剛受洗的同事、今年過年第一次沒有上香的親戚。約他吃一頓飯，不必教他甚麼，先問兩句：「信主以後，家裡怎麼樣？」「最近哪一件事最難？」然後具體告訴他，你在他身上看見的一樣工、一樣累、一樣忍耐。保羅給嬰孩教會的第一封信，先說的是他看見了甚麼；你也可以。","最終整合：帖撒羅尼迦，港邊的一條巷子，耶孫家的一個晚上。\n門已經修好了，門框上還看得見那一夜被撞裂的痕跡。\n屋裡擠滿了人：染布的、搬貨的、幾位尊貴的婦女，還有一個每天清晨在作坊裡燒窯的老人。\n從南方來的弟兄從懷裡拿出一捲信。屋子一下子安靜了。這是保羅走後，他們收到的第一封信。\n他們怕信裡寫的是責備：你們懂得太少，你們還不夠好。\n信一開頭卻是：「我們為你們眾人常常感謝神，禱告的時候提到你們」（1:2）。\n讀到「並且你們在大難之中，蒙了聖靈所賜的喜樂」（1:6），耶孫抬頭看了一眼那道門框。\n讀到「你們是怎樣離棄偶像，歸向神」（1:9），燒窯的老人轉過頭，看著灶邊牆上那一格空了的壁龕。\n從前那裡站著一家人的守護神，每天要點燈、要倒一點酒。如今只剩一個空格，和一片被油燈燻黑的牆。\n「等候他兒子從天降臨」（1:10）。\n那一晚散會以後，老人沒有把油燈放回壁龕裡。\n他把燈拿到門口，放在剛修好的門邊，讓它一直亮著——\n像家裡有一個人出了遠門，還沒有回來。\n剛出生的嬰孩，學會的第一個動作，是把頭轉向那個認得的聲音。\n一間教會出生，也是這樣：轉身，然後朝著那位一定會回來的主，把燈留著。"],"self":"這一章照出來的「有己」，是一個把信仰變成「知道」的人：懂得越來越多，手卻越來越空；會分析揀選、會辯論末世，卻很久沒有為信主付上一點代價，也很久沒有抬頭等過誰。\n有己也會藏在轉身裡：以為信主是我做對了選擇、我離開了偶像、我撐過了逼迫，把神的揀選講成自己的眼光；其實在我轉身以前，我已經是「被神所愛的弟兄」（1:4）。","t321":{"k":"耶穌是我的榜樣：1:6 的效法鏈，最上面一環不是保羅，是主自己；而主自己也是一個效法者。他說：「子憑著自己不能做甚麼，惟有看見父所做的，子才能做」（約 5:19）——這條鏈子是從父與子之間開始的。他也是帶著喜樂走過苦難的：「他因那擺在前面的喜樂，就輕看羞辱，忍受了十字架的苦難」（來 12:2）。喜樂沒有讓十字架變輕，是讓他沒有轉身離開。學他，不是演一個完美的樣子給人看，是每天先看父在做甚麼，再跟著做；也不是假裝不痛，是在痛裡知道前面有誰。","g":"讓耶穌作王：這一章要人讓出來的位子，是家裡正中間的那一格。帖撒羅尼迦人先歸向神，然後去服事——δουλεύειν（douleuein），作奴僕；一個人只能有一位主人。今天那一格可能不是神像，是孩子的前途、一份不能失去的工作、是我對日子的掌控——連等候主來，都想先拿到一張時間表才肯等。讓耶穌作王，是把中間那一格空出來給他，也承認他甚麼時候來、怎麼來，是王的事；我的事，是轉身、服事、抬頭。可以自己檢查：這一週我最怕失去的那一樣，坐在誰的位子上？","p":"建立屬神的體系：1:7 的 τύπον（typon）是單數——不是幾個明星信徒，是整間教會一起成了一個印。這一章給建造一群人三個做法。第一，從一開始就是團隊：1:1 三個名字並排，保羅、西拉、提摩太——321 的「235」，帶頭的人身邊先有兩個同伴。第二，每一個新生命都要有人接：被家人冷落的新信徒，教會要成為他的家，有人陪他過第一個年、第一個清明、第一次被嘲笑。第三，讓鏈子傳下去：被帶的人學會帶人，不是一輩子坐在台下；一間教會成熟不成熟，不是看有多少人聽懂，是看有多少人自己成了印，把主印到下一個人身上。"},"grp":["【一、破冰】說一次你搬到新地方的第一個禮拜——新學校、新城市、新公司都可以：那一週最難的是甚麼？是誰、在哪裡，第一次讓你覺得自己不是外人？","【二、扎心】經文說：「不住地記念你們因信心所做的工夫，因愛心所受的勞苦，因盼望我們主耶穌基督所存的忍耐」（1:3）。如果保羅今天為你禱告，他記得起你最近的哪一樣工夫、哪一樣勞苦、哪一樣忍耐？說出一件具體的事——哪一天、在哪裡、為了誰。說不出來的話，也誠實說說：是甚麼讓你的信心只剩下知道？","【三、福音】讀 1:4 的「被神所愛的」——原文是完成式被動：在你做任何事以前，你已經被愛了，而且一直被愛著。回頭看你信主的那一段日子，說出一件當時不懂、現在才認出「原來是神先動手」的事：一個人、一句話、一場病、一次搬家。","【四、行動】說出一位這一週你要去接的新生命：一年內信主的人、剛來小組的新朋友、或因為信主被家人冷落的人（名字或關係）。哪一天、用甚麼方式——一通電話、一頓飯、陪他回家吃一次飯？你準備對他說的第一句話是甚麼？","【五、代禱】為三種人指名禱告：一位因為信主正被家人反對、冷落的弟兄姊妹，求主在他的大難中賜下聖靈的喜樂，也保守他的安全；一位家裡還有神明桌、祖先牌位的未信家人，求主讓他看見又真又活的神；一位信主很久、卻已經不再等候主的人——也可能就是你自己，求主讓他重新抬起頭來。"],"prac":{"main":"這一週，數一數自己手上的工、身上的累、心裡的等候，然後去接住一個剛出生的屬靈生命。","items":["對神：每天早上讀一次 1:9–10，讀到「歸向神」停下來，向主說出今天你最想抓住、最可能取代他的一樣東西，然後說：「主，今天我轉向你。」每晚回想：今天有沒有哪一刻，我因為等候主而做了一件不一樣的事？","對自己：拿一張紙寫三欄：工夫、勞苦、忍耐。這七天，每天在三欄底下各寫一件因為信主才做的事，哪怕很小——一個為人禱告的早晨、一次多走的一段路、一句忍住沒說出口的話。週末看看哪一欄空著，把那一欄帶到主面前；不是自責，是求他讓那一欄長出來。","對人：約一位一年內信主或剛來聚會的人，具體說出你在他身上看見的一樣工、一樣累或一樣忍耐。若他正因為信主被家人反對，陪他想一件這個月可以回家孝敬父母的事：一頓飯、一次陪診、一通問候。","對生活：在家裡或辦公桌上，找出一樣「一失去就活不下去」的東西——工作、成績、存款、某一個人的肯定。這一週為它做一件鬆手的小事：準時下班陪家人吃一次晚飯、一整天不看股票、孩子拿成績單回來時，先問他今天好不好。","對使命：在小組裡提一個具體安排——為每一位新來或剛信主的人配一位陪伴的人，陪他過第一個節期（過年、清明、中秋）。也為一位還不認識主的家人或同事每天指名禱告，並在這一週讓他看見你一個改變了的地方，而不是一場辯論。"]},"safe":["① 用處境取消原則：「離棄偶像是一世紀外邦人的事，跟我們無關」；或把處境硬搬：把華人家庭的每一樣習俗都說成拜偶像。","書信三問要走完：處境是一間大多由外邦人組成、創辦人被趕走、被本地鄉親逼迫的嬰孩教會；原則是轉向又真又活的神、服事他、等候他兒子；今天的落點要分辨——拜偶像要離開，孝敬與記念是神所喜悅的，判斷的理由要講出來（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你講完，會眾說得出他家裡哪一樣是要「離棄」的、哪一樣是要更用心孝敬的嗎？","② 用 1:6「在大難之中，蒙了聖靈所賜的喜樂」要求正在受家暴、虐待、威脅的人留下來，說「這是你為主受的苦，要喜樂忍耐」。","帖撒羅尼迦人的大難是為福音被鄉親逼迫（徒 17:5–9），不是在家裡被打；把暴力講成屬靈操練，是把受害的人留在危險裡，也是浪漫化受苦。保羅自己遇到暴動，是連夜離開那座城（紅線六；全卷立場見議題「受苦、逼迫與家人反對」）。","檢驗標準：一位正在家裡被打的姊妹聽完，是更敢找一位信得過的人說出來、尋求安全與保護，還是更覺得留下來才算屬靈？","③ 把 1:6 的喜樂講成「真正屬靈的人受苦也不會難過」，叫受苦的人先笑一下，或責備流淚的人信心不夠。","原文 ἐν θλίψει πολλῇ（en thlipsei pollē）與 μετὰ χαρᾶς（meta charas）並排在同一節，誰也沒有取消誰；耶穌在朋友的墳前也哭了。把喜樂講成否認痛苦，會讓受苦的人多背一層羞愧（紅線六、八；議題見議題「1:6『在大難之中，蒙了聖靈所賜的喜樂』」）。","檢驗標準：一位剛被家人趕出門、正在哭的弟兄聽完，是覺得可以帶著眼淚來到主面前，還是覺得自己又不及格了一次？","④ 把 1:5「權能」與 1:8「傳開了」講成成功神學：「信主以後事業會順、家庭會和、教會會一直增長；沒有，就是信心不夠」。","這間教會的權能，是在逼迫中出生、在大難中領受真道；它被傳開，傳的是一個轉身，不是一份成績單。信耶穌不保證一帆風順，但保證你不是一個人受苦（全卷立場見議題「受苦、逼迫與家人反對」）。","檢驗標準：一位信主以後反而失業、被家人反對的人聽完，是覺得神離開了他，還是知道神正在他的苦裡？","⑤ 把 1:4「蒙揀選」講成一份秘密名冊，讓會眾回家睡不著：「我是不是被揀選的？我的孩子、我過世的父母是不是？」","保羅是用 1:5 的「因為」——看福音在人身上的果效——認出揀選；這是回頭看時的感恩，不是往前看的審查。揀選在這一章是安慰一間嬰孩教會的話，不是篩選人的工具（議題見議題「1:4『我知道你們是蒙揀選的』」）。","檢驗標準：一位常常懷疑自己有沒有得救的弟兄姊妹聽完，是更焦慮，還是更確定自己是被神所愛的？","⑥ 把 1:5「也在乎權能和聖靈」講成「沒有神蹟醫治、方言異象的傳福音都是死的」，或反過來斷言「今天神已經不行神蹟了」。","1:5 的權能包括人心被打開、生命被翻轉、在逼迫中站得住；神今天仍可以行神蹟，但福音的能力不靠場面證明。兩頭講偏，一頭叫平凡的見證人自卑，一頭把神關在書房裡（議題見議題「1:5『不獨在乎言語，也在乎權能和聖靈』」；屬靈恩賜回指哥林多前書 12–14 章議題）。","檢驗標準：一位只會默默照顧生病鄰居的姊妹聽完，覺得自己的見證有沒有權能？","⑦ 用 1:9「離棄偶像」鼓勵剛信主的人回家摔神像、燒祖先牌位、跟父母當面翻臉，說「不這樣就是信得不真」。","帖撒羅尼迦人的轉身被各處傳開，是因為人看見了一個改變的生命，不是因為他們砸了甚麼；原文先「向神」，才「離開偶像」。用對抗代替見證，會讓家人把福音記成「不要祖宗」（全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」、議題「受苦、逼迫與家人反對」；議題見議題「1:9『離棄偶像，歸向神』」）。","檢驗標準：剛信主的人聽完，回家的第一個動作是去拆，還是去孝敬？他的父母三年以後記得的，是一場衝突，還是一個變溫柔了的孩子？","⑧ 講 1:9–10 時，對會眾已經過世、生前沒有信主的父母祖先下斷語：「他們拜了一輩子偶像，現在都在忿怒底下」。","本章講的是活人的轉身與等候，不是判定亡者的去處；把亡者交在公義又慈愛的神手中，是我們該守的界線（全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」）。這樣的話，會把一個剛失去父親的新信徒推離教會，也讓未信的家人從此關上門。","檢驗標準：一位父親上個月剛過世、生前沒有信主的弟兄聽完，是被安慰，還是覺得全家都被定了罪？","⑨ 用 1:10「將來的忿怒」恐嚇人信主；或從「等候他兒子從天降臨」推算主來的日子、定末世時間表、把時事對號入座。","1:10 的重點是 ῥυόμενον（rhyomenon），現在分詞，「正在救」；本卷給信徒的末世論是一個應許（5:9），保羅也明說論到時候、日期「不用寫信給你們」（5:1）（全卷立場見議題「主再來、被提與末世時間表」；議題見議題「1:10『救我們脫離將來忿怒』」）。","檢驗標準：會眾聽完，是更害怕主來，還是更想念主來？","⑩ 把 1:6「效法我們」講成「要效法屬靈領袖、照領袖說的做」，把 321「耶穌是我的榜樣」講成要人模仿某一位牧者的一切。","保羅寫的次序是先效法我們，再補一句也效法了主——人是透過保羅看見主，鏈子的源頭和終點都是主；先講 321 理念再拿 1:6–7 去印證，是把經文當成理念的插圖（鐵律五）。","檢驗標準：會眾聽完，記得的是某一位領袖的樣子，還是那位領袖指著的主？","⑪ 把 1:3「勞苦」與 1:8「傳開了」變成給新信徒的業績：剛受洗就排滿服事、要求每個月帶人來，累倒了就說他愛主不夠。","κόπος（kopos）是保羅「記念」的，不是他指派的；帖撒羅尼迦人的傳開，是生命被看見以後自己響出去的。把嬰孩當成勞力，孩子常常在第一年就累垮、離開。","檢驗標準：你們教會裡信主一年內的人，是被陪伴得最多，還是被分派得最多？"]},{"n":2,"t":"如同母親乳養自己的孩子","sub":"膽、乳、冠","lv":"A","arc":"養","sec":[["2:1--6","我們進到你們那裡並不是徒然的：放開膽量、討神喜歡"],["2:7--12","如同母親乳養自己的孩子：母親與父親"],["2:13--16","這道實在是神的：領受與受苦"],["2:17--20","我們暫時與你們離別：孤兒與冠冕"]],"serm":{"pts":[["討神喜歡","2:1--6","「不是要討人喜歡，乃是要討那察驗我們心的神喜歡」——剛在腓立比被害受辱，又在帖撒羅尼迦被趕走；保羅的事奉沒有諂媚、沒有貪心、不求人的榮耀"],["母親與父親","2:7--12","「連自己的性命也願意給你們」——可以叫人尊重的使徒，選擇當一個餵奶的母親、一個勸勉兒女的父親；屬靈父母的權柄是用來餵養的，不是用來壓人的"],["冠冕是人","2:13--20","「因為你們就是我們的榮耀，我們的喜樂」——神的道在受苦的人心裡運行；撒但能挖斷保羅的路，卻奪不走他的冠冕"]]},"q":"你信主以後，是誰餵你的？也許是一位每週六早上帶你讀經、讀到你終於讀得懂的姊妹；也許是一位半夜接你電話、聽你哭完才說「我們一起禱告」的弟兄。你記得他們說過的道理，但你更記得的，是他們把時間、把飯桌、把自己給了你。\n再問一題，比較扎人：現在有沒有人是被你餵的？還是你在教會裡這麼多年，一直坐在被餵的位置，總覺得還不夠格去餵別人？\n也有人帶人帶久了，不知不覺，從餵奶的母親變成了要人聽話的家長——這一章要問的是：一個可以叫人尊重的人，為甚麼選擇蹲下來？被這樣餵過的人，會長成甚麼樣子？","truth":"神把福音託付給被他驗中的人（2:4），他們不靠諂媚、不藏貪心、不求人的榮耀，卻連自己的性命也給出去，像母親乳養、像父親勸勉；而那道實在是神的，在受苦的人心中運行（2:13）。\n屬靈父母的權柄是用來餵養的，不是用來壓人的；他們的冠冕不是自己的名字，是主來的時候，一張一張站在主面前的臉。","mv":{"t":"我們既是這樣愛你們，不但願意將神的福音給你們，連自己的性命也願意給你們，因你們是我們所疼愛的。","r":"帖前2:8"},"card":["全卷是一個孩子的成長：歸、養、穩、聖、醒。第 2 章是「養」——一個剛出生的教會，被餵。創辦人被連夜送走，城裡有人說他是騙子；保羅不辯護自己，只把那一段日子攤開：沒有諂媚、沒有貪心、沒有求榮耀，有的是一個母親的溫度、一個父親的叮嚀，和一份被神的道在心裡運行的生命。全章拎起來就是一句：「如同母親乳養自己的孩子」（2:7）。","這一章的主詞常常是保羅，可是每到要緊處，主詞就換成神：是神「驗中了我們，把福音託付我們」（2:4）；是神在察驗人心，是神作見證（2:5、2:10）；是神召人「進他國、得他榮耀」（2:12）；最後是神的道自己動起來——「這道實在是神的，並且運行在你們信主的人心中」（2:13）。保羅只是一個餵奶的人；奶是神的，叫孩子長大的，也是神。","和合本 2:11 父親的第二個動作「安慰」，原文 παραμυθούμενοι（paramythoumenoi，在 SBLGNT 屬 2:12）。同一個字，保羅在 5:14 又用了一次：「勉勵灰心的人」（5:14）。原來在保羅的家裡，父親最重要的工作之一，是坐到灰心的孩子旁邊，輕聲說話。這改變今天的讀法：屬靈父親不是那個在台上把話說最重的人，而是那個願意在灰心的人身邊多坐一會兒、不急著糾正他的人。","這一章照出兩種走偏的我。一種是餵人的時候，心裡在等回報：等一句謝謝、等奉獻、等被稱作「屬靈的媽媽」，被我帶過的人去了別的教會，我心裡就像被偷了東西——那是 2:6「求榮耀」換了一件溫柔的外衣。另一種是永遠不肯長大：在教會很多年，仍然只等別人來餵，聚會不合口味就換一間，從沒想過自己也可以把一碗飯端到一個新朋友面前。","「連自己的性命也願意給你們」（2:8）。全章最該被記住的，是給的方向：從有分量的人，給到最小的人；不是孩子把性命交給父母，是父母把性命給孩子。耶穌自己就是這樣說的：「我多次願意聚集你的兒女，好像母雞把小雞聚集在翅膀底下」（太 23:37）。保羅這個母親，是先被那隻張開翅膀的母雞捂熱過的。被愛過的人，才給得出去。","這一週選定一位「你來餵」的人：一位新朋友、一位剛受洗的弟兄姊妹、一位最近很少出現的人。約他吃一頓飯，聽他說話多過你說話；回家以後，把他的名字寫在你的禱告本上，每天為他禱告。同時問自己一個問題：我這樣做，是希望他以後離不開我，還是希望他有一天自己會讀經、自己會禱告、也會去餵別人？","最終整合：帖撒羅尼迦，耶孫的家，一個晚上。\n門閂比從前多了一道。那一夜暴民闖進來以後，耶孫被拉到地方官面前，交了保才放回來（徒 17:9）。\n屋裡坐的人不多。一個年輕的銀匠坐在角落——他不再替廟裡打神像了，父親把他趕出了家門，他的工具還寄放在別人那裡。\n門邊坐著一位年輕的母親，懷裡抱著剛滿月的孩子。\n送信的人從懷裡拿出信。讀信的人念到：「只在你們中間存心溫柔，如同母親乳養自己的孩子」（2:7）\n孩子這時哭了。母親低下頭，把他抱近，用自己的衣服裹住。\n屋裡的人都看著她，沒有人說話。他們都想起了那個人：才來三個安息日，晚上在作坊裡縫帳棚，一邊縫一邊叫每一個人的名字，從來沒拿過他們一個錢。\n讀信的人繼續念：「我們暫時與你們離別，是面目離別，心裡卻不離別」（2:17）\n那個銀匠把臉埋進手裡。被家裡趕出來的人，原來不是孤兒；寫信的人，也正在想念他。\n「因為你們就是我們的榮耀，我們的喜樂」（2:20）\n孩子吃飽了，睡了。\n這一屋子被趕、被打、被罵的人，第一次知道：自己是被餵過的人。\n下一個安息日，那個銀匠帶了一個人來——是他從前作坊裡的學徒。他坐在學徒旁邊，把聽來的話，一句一句，慢慢講給他聽。\n被餵過的人，開始餵人了。"],"self":"這一章照出來的「有己」，常常不是兇的，是溫柔的：我很愛你，但你要聽我的；我為你付出這麼多，你怎麼可以離開？它把「餵養」變成了「擁有」，把屬靈的孩子當成自己的成績單，在乎的是「我帶出來的人」，不是「主的人」。\n還有一種有己是討人喜歡：講話先看台下的臉色，貼文先算有幾個讚，該說的真話吞回去，因為怕被人說不溫柔。保羅的溫柔不是怕人，是愛人；他可以把話說重，因為他向一位察驗人心的神交帳（2:4）。","t321":{"k":"耶穌是我的榜樣：保羅這個母親，是從耶穌那裡學來的。耶穌對著殺害先知的耶路撒冷說：「我多次願意聚集你的兒女，好像母雞把小雞聚集在翅膀底下」（太 23:37）——一位有一切權柄的主，選擇用母雞的翅膀來形容自己。他復活以後，在海邊升起炭火，先預備早飯，等彼得吃完，才對他說「你餵養我的小羊」（約 21:15）。他先餵飽人，再把餵人的工作交出去。學他，是先坐下來被他餵，再起身去餵他的小羊；不是把他的小羊變成我的。","g":"讓耶穌作王：這一章要人讓出來的位置，是「被需要的人」。2:6 保羅「可以叫人尊重」，我們也常常有一點分量：組長、主管、父母、資深同工。讓耶穌作王，是承認每一個被我帶過的人都是主的羊，不是我的；他們有一天不再需要我、去了別處服事、甚至比我更被看重，那是我的冠冕（2:19），不是我的損失。也是把「討人喜歡」的座位讓出來：讚、掌聲、別人的眼光不再坐在中心，坐在中心的是那位察驗人心的神。可以自己檢查：我最難放手的一個人、一個位子，是誰？","p":"建立屬神的體系：第 2 章給一群人一套「養」的系統。第一，有母親也有父親（2:7、2:11）——235 的「3 屬靈父母兒女」：每一位新人都要有人餵、有人陪，也有人在方向上提醒；溫度與方向缺一不可。第二，權柄要可以被檢驗：保羅請人作見證（2:10），也教會「凡事察驗」（5:21）；帳目公開、決策透明、有申訴的管道。第三，目標是繁殖不是依附：被餵的孩子站穩（3:8），然後去餵下一個——這是 235 的傳遞，也是八大步驟的「繁殖」。一個只有孩子、沒有長大成父母的團契，是一個永遠在吃奶的家。"},"grp":["【一、破冰】說一個你小時候生病或難過時，被家人照顧的記憶：是誰？他做了甚麼？是一碗粥、一條毛巾，還是一個整晚沒睡的背影？","【二、扎心】經文說：「不是要討人喜歡，乃是要討那察驗我們心的神喜歡」（2:4）。說出最近一次你為了被人喜歡、怕被人說，而沒有說真話或沒有做該做的事——在哪裡、對誰、你怕的是甚麼？","【三、福音】讀 2:13：神的道「運行在你們信主的人心中」，不是靠帶你的人一直在你身邊。說出一節曾經在你最孤單的時候，自己在你心裡動起來的經文。如果神的道今天仍在你裡面做工，這一週哪一件事你可以不再只等別人來餵？","【四、行動】說出一位這一週你要「餵」的人（名字或關係）：哪一天、在哪裡、做甚麼——約一頓飯、一起讀一章聖經、傳一則問候、陪他走一段路。也說出一位曾經餵過你的人，這一週你要怎樣向他說一聲謝謝。","【五、代禱】為三種人指名禱告：一位因為信主被家人反對、甚至被趕出家門的人，求主像父親一樣安慰他；一位在教會或小組裡帶人帶到累的屬靈母親或父親，求主先餵飽他；一位曾經被屬靈領袖控制或傷害、不敢再進教會的人，求主醫治他，也為他預備安全、可信任的屬靈家人。"],"prac":{"main":"這一週，先坐下來被神的道餵飽，再起身去餵一個人——為了他站穩，不是為了他離不開你。","items":["對神：每天早上讀 2:1–13 中的幾節，求主像母親一樣餵你；讀到「這道實在是神的」（2:13），停下來說：「主啊，今天請你的道在我裡面運行。」晚上回想：今天哪一刻，我是在討人喜歡，哪一刻是在討你喜歡？","對自己：這七天，留意自己在甚麼時候特別需要被看見——貼文後一直看讚、服事後等人道謝、被帶的人沒有回訊息就心裡不舒服；每一次都記下來。週末把這張單子帶到主面前，說：「我的冠冕是人，不是掌聲。」","對人：選一位你要「餵」的人，約他吃一頓飯或一起讀一章聖經，記住他說的一件事，下一次見面主動問起。也打一通電話或寫一張卡片，給一位曾經餵過你的人，具體說出他哪一件事幫助了你。","對生活：在職場或家裡，若你是主管、父母或資深的人，這一週刻意放下一次分量：把一件你可以命令的事改成邀請，把一次可以指正的話先換成聆聽；也像保羅「晝夜做工」那樣，把今天的工作當作見證，不叫身邊的人因你受累。","對使命：在小組或團契裡提一個具體安排——為每一位新朋友配一位陪伴的人，三個月內一起吃飯、讀經、禱告；並邀請一位被你帶過的人，這一次由他來帶，你在旁邊陪。也為一位還沒信主、或因信仰與家人有衝突的人，每天指名禱告。"]},"safe":["① 把 2:7、2:11「母親」「父親」講成「你的屬靈父親說的你就要順服；質疑屬靈遮蓋就是悖逆」。","保羅的父母權柄是放下（2:6）、餵養（2:7）、自己做工（2:9），目標是孩子「靠主站立得穩」（3:8），不是離不開；他請人作見證（2:10），也叫教會「凡事察驗」（5:21）。講成絕對順服，是把最溫柔的一幅畫拿來控制人（紅線七；議題見議題「2:7、11『母親』『父親』」；回指哥林多後書立場三）。","檢驗標準：一位正被屬靈領袖控制、不敢提問的人聽完，是更敢找人說出來，還是更覺得質疑就是不屬靈？","② 用 2:14–16「這猶太人殺了主耶穌」說任何貶低猶太人或其他民族的話，或講成「猶太人被神棄絕、活該受報應」。","保羅自己是猶太人；2:14 的榜樣正是猶太地的教會；這幾節說的是殺主、趕走使徒、攔阻福音的逼迫者，不是一個民族。歷史上這幾節曾被拿來合理化仇恨與屠殺，講台不可以重複這個錯（紅線三；全卷立場見議題「受苦、逼迫與家人反對」；議題見議題「2:14--16『這猶太人殺了主耶穌』」、議題「2:16『神的忿怒臨在他們身上已經到了極處』」）。","檢驗標準：如果一位猶太朋友坐在台下，他聽完會覺得自己被當成敵人嗎？會眾走出去，是更恨某一群人，還是更低頭察看自己有沒有攔阻人親近神？","③ 把 2:16「神的忿怒臨在他們身上已經到了極處」對號入座到今天的某個國家、某場戰爭或某個新聞事件。","「神的」是和合本補的小字，εἰς τέλος 有「到了極處／終於／直到末了」幾種讀法；保羅自己後來說「上帝棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）。把時事配進這節，是在替神宣判，也落進紅線一（全卷立場見議題「主再來、被提與末世時間表」、議題「受苦、逼迫與家人反對」；議題見議題「2:16『神的忿怒臨在他們身上已經到了極處』」）。","檢驗標準：你講完，會眾記得的是某個新聞的「應驗」，還是神的忍耐與救恩的門還開著？","④ 先講 321 的「屬靈父母兒女」與「無己」，再拿 2:7–8 當印證，彷彿保羅是在說明我們的理念。","次序永遠是：先讓保羅那個「可以叫人尊重」卻選擇餵奶的畫面站穩（2:6–7），讓 2:13 把功勞推回神的道，321 才在末端認出它。讀到 2:7–11 就以為讀到了自己的理念，是本卷最大的試探（鐵律五）。","檢驗標準：你講到 321 以前，會眾有沒有先看見那個放下分量的使徒與那位捨命的主？講完以後，他們更佩服這套理念，還是更愛主？","⑤ 把 2:8「連自己的性命也願意給你們」講成「好的屬靈父母不必休息、不能有界線，要隨叫隨到、燒完為止」。","給出去不是燒完；保羅晝夜做工，也懂得打發提摩太代替自己（3:2），在信裡坦白說自己「不能再忍」（3:1）。一個累垮的母親是餵不了孩子的；把耗竭講成愛，會讓小組長、同工與牧者的家庭先倒下。","檢驗標準：你的教會有沒有讓帶人的人也被餵、被陪、可以休息？講完以後，累到快撐不住的同工，是更自責，還是更敢說「我需要幫助」？","⑥ 用 2:9「晝夜做工，免得叫你們一人受累」說「領薪水的傳道人不屬靈」「真正愛主的傳道人不該收錢」。","保羅自己說「主也是這樣命定，叫傳福音的靠著福音養生」（林前 9:14），他在帖撒羅尼迦不收錢，是為了不叫福音被阻隔、不給說他騙錢的人留口實；這是處境中的選擇，不是給所有傳道人的規條（議題見議題「2:6--9『可以叫人尊重』『晝夜做工』」、議題「2:9『晝夜做工』」）。","檢驗標準：你講完，會眾是更願意公平地供養工人，還是更懷疑台上領薪水的人？","⑦ 反過來，用 2:6「可以叫人尊重」替傳道人的特權、排場或不透明的財務辯護：「使徒本來就有權柄。」","2:6 的重點在後半——有權柄而不用；2:5 說「也沒有藏著貪心，這是神可以作見證的」。拿這一節要求會眾供奉、或拒絕帳目公開，是把保羅放下的東西又撿了回來（紅線七；回指哥林多後書立場三）。","檢驗標準：你的教會有沒有公開、可查核的帳目與一個不必看人臉色的提問管道？","⑧ 把 2:4「不是要討人喜歡」講成「傳道人不必在乎會眾的回饋」「被批評就是在為主受苦」。","保羅不討好人，卻極在乎人：他請他們作見證（2:10），他「極力地想法子」要見他們的面（2:17）；在乎人是愛，討好人是怕。把 2:4 當成拒絕一切批評的盾牌，會讓講台失去被察驗的機會（議題見議題「2:4『不是要討人喜歡』」）。","檢驗標準：最近一次有人指出你的錯，你是先查驗他說的是不是對的，還是先引用 2:4 保護自己？","⑨ 用處境取消原則：「2:7–12 是保羅對一間特別的教會，今天制度化的教會不必這樣」；或把處境硬搬：「保羅才待三個安息日，所以帶人不必長期陪伴。」","書信三問要走完：處境是一間創辦人被趕走、手上只有一封信的嬰孩教會；原則是福音要連同生命一起給、權柄是用來餵養的；今天的落點是每一個剛信主、剛被家人反對、手上只有一本聖經的弟兄姊妹（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你講完，會眾知道這原則落在今天的誰身上嗎？他們能說出一個這一週要去陪的人的名字嗎？","⑩ 把 2:14「受了本地人的苦害」講成「家人反對你，就是逼迫你的仇敵，可以跟他們斷絕」，或反過來浪漫化：「被家人趕出來才是真信徒。」","保羅沒有叫帖撒羅尼迦人反擊或斷絕，而是把他們放進一條受苦的隊伍裡；家人反對時用改變的生命與孝順作見證。若是遭遇暴力或人身危險，先保護安全，不可用這節要人留在危險裡（全卷立場見議題「受苦、逼迫與家人反對」）。","檢驗標準：一位剛被家人反對的新信徒聽完，是更想回家對抗，還是知道自己不孤單、也知道怎樣用孝順與溫柔活出信仰？","⑪ 把 2:18「撒但阻擋了我們」講成「凡計畫受阻都是撒但攻擊」，或反過來「凡去不成都是神關門」，再拿來替自己的決定背書。","保羅在徒 16:6–7 把去不成讀成聖靈的引導，在這裡讀成撒但的攔阻；兩次都是回頭才說得清楚，他沒有給公式。隨口把每一次受阻屬靈化，會讓人逃避檢討，也讓人活在驚慌裡（議題見議題「2:18『撒但阻擋了我們』」）。","檢驗標準：你講完，會眾遇到一扇關上的門，是急著判定是誰關的，還是像保羅一樣換一條路繼續愛？","⑫ 把 2:19「你們在他面前站立得住」講成「你們若站不住，就是我的失敗，我的冠冕就沒了」，用來給信徒壓力，或叫牧者用人數衡量自己。","「站立得住」是和合本補的小字，原文只說「豈不就是你們嗎」；重點是「你們就是」，不是以表現為條件。把冠冕講成業績，會讓帶人的人焦慮，也讓被帶的人覺得自己是別人的成績單。","檢驗標準：會眾聽完，是更感到被愛，還是更感到被評分？","⑬ 用 2:19「主耶穌來的時候」推算主來的日子，或說「你不站穩，主來時你就會被留下來」來恐嚇人。","這是 παρουσία 在本卷第一次出現，保羅用它給一個被拆散的家一個重逢的日子，不是一張時間表；本卷的末世教導用途是安慰（4:18），不是恐嚇（紅線一；全卷立場見議題「主再來、被提與末世時間表」）。","檢驗標準：會眾聽完，是更害怕主來，還是更想念主來？"]},{"n":3,"t":"你們若靠主站立得穩，我們就活了","sub":"忍、穩、增","lv":"A","arc":"穩","sec":[["3:1--5","我們既不能再忍：打發提摩太"],["3:6--10","但提摩太剛才從你們那裡回來：好消息"],["3:11--13","願神－我們的父和我們的主耶穌：為你們禱告"]],"serm":{"pts":[["不能再忍","3:1--5","「我們受患難原是命定的」——保羅獨自等在雅典，掛念一間剛出生就被逼迫的教會；患難不是意外，受苦的人需要的是有人被打發來陪伴"],["我們就活了","3:6--10","「你們若靠主站立得穩，我們就活了」——屬靈父親的生命掛在孩子站不站得住；好消息報的是信心和愛心，信心的不足還要補滿"],["愛的增長","3:11--13","「又願主叫你們彼此相愛的心，並愛眾人的心都能增長，充足」——禱告的終點是主來的時候「心裡堅固，成為聖潔，無可責備」"]]},"q":"有沒有一個人，你的心一直掛在他身上？也許是你帶信主、後來搬到另一座城市的年輕人，也許是群組裡那個已經三個禮拜沒有出現的頭像，也許是剛信主、就被家裡罵「不要祖宗了」的同事。\n你想知道他還好不好，卻不敢問，怕問出一個你承受不住的答案；你也可能就是那個撐不住的人，家裡反對、身體出狀況、禱告好像打在牆上，卻不知道該跟誰說。\n這一章是一個撐不住的屬靈父親寫的。他要問的是：一個人在苦裡，怎樣才能站得住？而那些愛他的人，又要怎樣陪他站起來？","truth":"站起來：患難不是意外，信主不保證一帆風順，但神不讓受苦的人獨自受苦——他差人來堅固、勸慰，讓孩子在父母不在的時候，仍然「靠主」站立得穩。\n孩子站穩，父母就活了；信心的缺口可以補，愛可以漲滿，而把人的心堅固到主來那一天的，最後是主自己。","mv":{"t":"你們若靠主站立得穩，我們就活了。","r":"帖前3:8"},"card":["這一章說的是：孩子站起來了。全卷五章是一個孩子的成長——出生、被餵、站起來、學走路、守夜；第一章歸向神，第二章被母親乳養，到了第三章是「穩」：創辦人被趕走、本地人逼迫、保羅自己也撐不住了，可是提摩太回來報信說，他們還站著。全章從保羅打發人去堅固他們開始，在求主親自堅固他們的心結束；中間那一句是全卷的樞紐：「你們若靠主站立得穩，我們就活了。」（3:8）","這一章的神，是安放人、也差派人的神。他把受苦的人安放在一個他看得見的位置上（3:3），不是任人掉進黑洞；他讓一個撐不住的使徒，還有一個同工可以打發出去（3:2）；他托住一間沒有大人在場的教會，叫他們在患難裡沒有被搖走（3:8）；他是保羅晝夜禱告的對象，父與子一同修直被攔住的路（3:11）；他叫愛增長、充足（3:12），最後親自堅固人的心，直到主耶穌來的那一天（3:13）。孩子能站，是因為地面是主。","3:8「你們若……站立得穩」，原文 ἐὰν ὑμεῖς στήκετε（ean hymeis stēkete）。ἐάν 平常接假設語氣，這裡卻接直說語氣：它同時是一句喜訊——「既然你們正站著」，也是一個邀請——「只要你們繼續站著」。這改變今天的讀法：3:8 不是父母對孩子說「你要是倒下，我就活不成了」，把父母的情緒壓在孩子肩上；是一個父親聽見好消息時的歡呼，同時溫柔地說：繼續在主裡站著。被這節經文對待的人，得到的是喜樂，不是罪疚。","這一章照出來的我，常常兩邊都不對勁。我撐不住的時候，寧可假裝很剛強，不肯像保羅一樣說「我不能再忍」；我看見別人在苦裡，第一個反應是丟一段經文、一句「要有信心」，卻很少把自己的時間和人差出去。我帶過的人站穩了，我心裡偷偷有點失落，因為他不那麼需要我了；他跌倒了，我先想到的是「我的勞苦白費了」，而不是他現在一個人怎麼辦。","「所以，弟兄們，我們在一切困苦患難之中，因著你們的信心就得了安慰。」（3:7）全章最大的翻轉，是安慰的方向倒過來了：保羅打發提摩太去勸慰孩子，結果是孩子的信心安慰了保羅。屬神的家不是單行道。年幼的人不是只能被扶的人，他站穩的那一刻，就成了扶住長輩的力量；而長輩也被允許承認：我需要你們的好消息才能活過來。","這一週做一件事：做那個把好消息帶回去的提摩太。想一位曾經帶你信主、陪你讀經、在你最難的時候為你禱告的人，不論他現在在哪一個城市、哪一個國家。寫一段具體的話給他——不是「謝謝你」，而是「這一年，我在哪一件事上還靠主站著」。若你此刻正撐不住，就反過來，把這段話寫成「我現在撐不住了」，傳給一位信得過的人。兩種訊息，都是 3:6--7 的路。","最終整合：帖撒羅尼迦，耶孫的家，一個晚上。\n門閂是新換的。幾個月前，暴動的人群就是從這扇門闖進來的。\n屋裡點著一盞燈，二十幾個人擠在一起：有剛把家裡神像搬出去的陶匠，有被丈夫的族人冷眼看的婦人，有一個年輕人，因為不肯再去廟裡，被父親趕出了家門，已經在耶孫家住了一個月。\n提摩太走了以後，大家一直在等。今天，信到了。\n念信的人念到「我們既不能再忍，就願意獨自等在雅典」，屋裡有人低下頭——原來那個被連夜送走的人，也撐不住過。\n念到「我們受患難原是命定的」，陶匠摸了摸手上還沒好的傷，沒有說話。\n念到「你們若靠主站立得穩，我們就活了」，念信的人停了一下，又念了一遍。\n那個年輕人站了起來。沒有人叫他站，他只是覺得，聽這一句的時候不能坐著。\n他們一直以為，是自己在等保羅；原來，保羅也一直在等他們。\n念到「補滿你們信心的不足」，坐在角落那位剛送走丈夫的婦人哭了——她不知道死了的人在主來的時候會怎樣，她以為只有她的信心破了洞。\n原來破洞的不只她一個，原來破洞是可以補的。\n最後念到「當我們主耶穌同他眾聖徒來的時候」，燈芯跳了一下。\n保羅來不了，提摩太也走了。可是有一位，不會被攔在路上，他要親自來。\n那一晚散會的時候，年輕人沒有回耶孫家的客房；他說，明天要回家一趟，給父親送一點吃的。\n他還是不去廟裡。可是他要讓父親看見：信耶穌的兒子，更會愛他。"],"self":"這一章照出來的「有己」，第一個樣子是要顯得撐得住：我把軟弱藏起來，把「不能再忍」吞回去，以為承認撐不住就是信心不夠；結果我既不肯讓人來堅固我，也沒有空去堅固別人。\n第二個樣子是要被需要：我帶人、扶人，心裡卻希望他一直離不開我，他站穩了我反而失落；我把別人的跌倒算成我的勞苦白費，把別人的站立算成我的功勞——兩樣都把自己放在了「主」的位置上。","t321":{"k":"耶穌是我的榜樣：主耶穌也知道「撐不住」的夜晚。在客西馬尼，他對門徒說「我心裡甚是憂傷，幾乎要死」（太 26:38），他沒有假裝剛強，他要人陪他警醒。他也是那一位先為人的信心禱告的：「但我已經為你祈求，叫你不至於失了信心。你回頭以後，要堅固你的弟兄。」（路 22:32）這裡的「堅固」，就是 3:2、3:13 的同一個字。他知道彼得會跌倒，卻沒有放棄他，反而預先為他禱告、預先差派他去扶別人。他差門徒兩個兩個地出去，門徒回來報好消息的時候，他歡喜快樂。保羅在第三章，是照著主的樣子在牧養。","g":"讓耶穌作王：這一章要人讓出兩個位置。第一個是「我是撐住大家的那個人」：保羅承認自己不能再忍，把唯一的同伴差出去，等於說「堅固他們的不是我」；3:8 的「靠主」，原文是「在主裡」——孩子站立的地面是主，不是我。第二個是「這條路由我來開」：2:18 他試了兩次都被攔住，到 3:11 他把路交給父與子。讓耶穌作王，就是讓他作那個真正堅固人心的主（3:13），我只是被差派的人。可以自己檢查：這一週，我在誰的生命裡，還坐在只有主能坐的那個位置上？","p":"建立屬神的體系：經文先說完它自己的話，321 才接上來。保羅沒有說「我不在，你們自己保重」，他建立了一條來回的線：打發一個人去（3:2）、帶回消息（3:6）、晝夜禱告（3:10）、寫一封信。提摩太是 321「235」裡那個「2」：不是跑腿，是同工。今天一個健康的體系要有幾樣具體的東西：每一位剛信主、特別是家人反對的新朋友，都有一位固定陪他的人；散在不同城市、不同國家的弟兄姊妹，有人定期打聽他的信心如何，也讓他的好消息傳回來；帶領人自己也有人可以說「我撐不住了」；遇到家暴與不安全的處境，教會知道怎樣保護、陪伴，也備好可以轉介的專業與法律協助。"},"grp":["【一、破冰】你第一次一個人離家住（住校、當兵、出國讀書或工作）是幾歲、在哪裡？那時候家裡是怎麼打聽你的消息的？你記得自己寄回去、或打回去的第一個「報平安」說了甚麼嗎？","【二、扎心】「我們既不能再忍，就願意獨自等在雅典」（3:1）。保羅承認自己撐不住了。說一件具體的事：現在你生活裡最接近「撐不住」的是哪一件？從甚麼時候開始的？這件事，你身邊有幾個人知道？說出一個名字，或者說「還沒有人知道」。","【三、福音】「補滿你們信心的不足。」（3:10）保羅沒有罵信心有缺口的人，他為他們晝夜禱告，想去補。說一段日子：哪一年、在甚麼事上，你的信心破了一個洞？那時候是誰、用甚麼方式來陪你、補你，而不是責備你？回頭看，神是怎樣透過那個人托住你的？","【四、行動】說出這一週你要做的一件事：那位帶你信主、或在你最難時陪你的人，叫甚麼名字、現在住在哪裡？說出你要在哪一天、用甚麼方式（一則訊息、一封信、一通視訊）把你「還靠主站著」的好消息告訴他；或者說出一位剛信主、正被家人反對的人，你要在哪一天去他旁邊坐一坐。","【五、代禱】為三種人指名禱告：一位家族裡第一個信主、正被家人反對的人，求主讓他站得穩，也更會愛家人；一位家裡不安全、正在受傷害的人，求主保護他，讓他有勇氣和管道尋求幫助；一位撐不住卻不敢說的牧者或小組長，求主差一個「提摩太」到他身邊。"],"prac":{"main":"這一週，承認撐不住，也做被差派的人：讓好消息在屬靈的家裡來回流動，陪一個人在主裡站穩。","items":["對神：每天早上慢慢讀一次 3:7--8，為一位你帶過、或為你禱告過的人說出他的名字，感謝神讓他還站著；晚上讀 3:11--13，把一條你被攔住的路說給父與子聽，求主修直，也求主堅固你的心。","對自己：這七天每天晚上寫一行：今天哪一件事讓我最接近「不能再忍」？我有沒有說出來、說給誰聽？若連續兩個禮拜睡不好、吃不下、提不起勁，就預約一次門診或諮商；承認極限不是信心不夠，保羅也說過。","對人：寫一段好消息給帶你信主或陪過你的人，說出這一年你在哪一件事上還靠主站著；再想一位剛信主、正在被家人反對或被逼迫的人，這一週主動去他旁邊，問一句「你的信心最近怎麼樣」，然後聽完。","對生活：在家人反對你的信仰的事上，這一週做一件更孝順的事——回家吃一頓飯、多陪父母說一次話、主動分擔一件家務；不辯論、不對抗，讓改變的生命替你說話。若家裡讓你不安全，這一條改成：找一位信得過的人說出來。","對使命：為一位在外地、外國的弟兄姊妹或宣教同工做一件「提摩太」的事：問候他、打聽他的信心、把他的近況帶回小組一起禱告；並為一間正在受逼迫的教會或地區，具體地代禱一次。"]},"safe":["① 用 3:3「我們受患難原是命定的」要求家暴、虐待的受害者「回去忍耐」：「這是神給你的十字架，命定要受的。」","3:3 的患難是為福音、為跟隨基督而來的壓力，不是家庭暴力、性暴力或職場霸凌；保羅打發提摩太是去「堅固」人，不是去勸人留在危險裡。把這一節拿去綁住受害者，可能延誤到危及生命（紅線六，全卷立場見議題「受苦、逼迫與家人反對」）。","檢驗標準：一位正在被打的姊妹聽完，是更覺得自己應該回去忍，還是知道離開危險、尋求保護與專業和法律協助不是沒有信心？","② 浪漫化逼迫：「沒有被逼迫的就不是真基督徒」「受苦越多越屬靈」，或鼓勵新信徒去激怒家人、挑戰官府，好證明自己的信心。","保羅說患難不是意外，卻沒有叫人去找苦吃；苦難不是勳章，也不是屬靈等級。把受苦講成目標，會讓人製造衝突、輕看自己的安全，也讓沒受逼迫的人懷疑自己的得救（紅線六，全卷立場見議題「受苦、逼迫與家人反對」）。","檢驗標準：會眾聽完，是更想去製造衝突、證明自己，還是在苦來的時候知道不必驚慌，苦沒來的時候也不必心虛？","③ 講成功神學：「真信的人，神必叫你健康、發財、一帆風順；你受苦是因為信心不夠、或有隱藏的罪。」","保羅「預先告訴你們，我們必受患難」（3:4），帖撒羅尼迦人信主以後反而更難；這一章直接反駁成功神學。這種講法把受苦的人推進雙重的痛：苦本身，再加上被論斷（紅線六，全卷立場見議題「受苦、逼迫與家人反對」）。","檢驗標準：一位信主以後失業、生病或被家人趕出門的人聽完，是覺得自己被神懲罰了，還是知道自己沒有信錯、也不是一個人？","④ 用 3:8 把屬靈父母的情緒壓在會眾身上：「你們不來聚會、不服事，我就活不下去了」，或要求門徒凡事向帶領人報告、離不開帶領人。","3:8 的 ἐάν 接直說語氣，是喜訊兼邀請，不是情緒勒索；孩子是「靠主」站穩，不是靠保羅站穩。保羅的屬靈父權柄是放下與餵養，目標是孩子在父母不在時站得住，不是控制（紅線七）。","檢驗標準：會眾聽完，是更依賴帶領人、更怕讓帶領人失望，還是更知道自己站立的地面是主？","⑤ 把 3:1「不能再忍」講成帶領人不可以累：「真正屬靈的傳道人不會撐不住」；或反過來把保羅的孤單講成服事者的標準配備，要人一直燃燒到倒下。","保羅公開承認自己撐不住，又因為孩子的好消息「活」過來（3:7--8）——屬靈父母也是需要被安慰的人。把撐不住講成不屬靈，會讓帶領人把軟弱藏到崩潰；把孤單講成榮耀，會讓教會不去照顧自己的牧者。","檢驗標準：一位疲倦到想辭職的傳道人或小組長聽完，是更不敢說出來，還是知道自己可以說「我不能再忍」，而且有人會被差到他身邊？","⑥ 用 3:5「那誘惑人的」給離開教會的人貼標籤：「他就是被撒但抓走了」「他從來就沒有真的得救」；或用它恐嚇信徒「你隨時會失去救恩」。","保羅在這裡沒有給定罪的判斷，也沒有給恐嚇，他給的是一個父親的行動：打發人去。替別人下斷語，會讓還在門邊猶豫的人永遠不敢回來；用恐嚇催人，會讓敏感的人活在不安裡（議題「3:5『恐怕那誘惑人的到底誘惑了你們』」）。","檢驗標準：一位很久沒來聚會的人如果聽見這一段，是覺得門已經關上了，還是知道有人正想去找他？","⑦ 用 3:10「信心的不足」羞辱人：「你的病沒好、孩子還不信、生意不順，就是因為你信心不足。」","保羅說的「不足」是一間幾個月大的教會還沒學到的功課，他用的是補網、接骨的字，回應是感謝、禱告和去見面，不是責備。把信心的缺口講成罪名，等於把破網丟掉，而不是坐下來補（議題「3:10『補滿你們信心的不足』」）。","檢驗標準：一位禱告很久仍沒有看見答案的人聽完，是更自責，還是知道自己的信心可以被補、而且有人願意陪他補？","⑧ 用 3:12「愛眾人」要求受害者立刻與加害者和好、繼續同住；或要新信徒為了「愛家人」參與拜偶像的儀式。","愛眾人不等於讓人一直傷害你，也不等於放下信仰；保羅求的是愛滿溢，不是界線消失。這一節在家人反對的處境裡，指的是用改變的生命與孝順代替對抗，不是用順從代替信仰（紅線六，全卷立場見議題「受苦、逼迫與家人反對」）。","檢驗標準：一位受過傷害、或家人逼他上香的人聽完，是覺得愛就是沒有界線，還是知道可以守住安全與信仰，同時更會愛人？","⑨ 拿 3:2 的異文說「和合本譯錯了，聖經不可靠」；或反過來，在講台上把異文藏起來，有人問就說「不要質疑聖經」。","和合本自己的註腳就記著「有古卷是與神同工的」；兩種讀法都說提摩太是神福音上的僕人，信仰沒有因此動搖。誇大會叫人失去信心，掩蓋會叫人以為教會怕真相（議題「3:2 和合本『作神執事的』與 SBLGNT『神的同工』，哪一個是保羅寫的？」，全卷立場見議題「這些爭議該不該影響一個人的信心？」）。","檢驗標準：一位剛發現這個異文的大學生聽完，是更不信任聖經和教會，還是更知道聖經的傳承可以被誠實地檢驗？","⑩ 用 3:13「無可責備」或「同他眾聖徒來的時候」恐嚇人：「主隨時會來，你現在若還有一點不聖潔，就要被留下」，或拿它推算主來的日期。","3:13 是禱告，主詞是主——是主親自堅固人的心；「無可責備」緊接在 3:10「信心的不足」之後，不是要人先完美。本系列不算日子、不定時間表，果效是忍耐，不是恐慌（紅線一，全卷立場見議題「主再來、被提與末世時間表」）。","檢驗標準：會眾聽完，是更害怕主來，還是更想念主來、更相信那位堅固人心的主？","⑪ 用處境取消原則：「3:1--5 是保羅和帖撒羅尼迦人的事，我們今天沒有逼迫，跟我們無關」；或反過來，把「打發提摩太」照抄成一套固定的探訪制度，卻不問今天誰在苦裡。","書信三問的第三問要走完：處境是一間被趕走了創辦人、被鄉親逼迫的嬰孩教會；原則是受苦的人不可以獨自受苦，要有人被差去堅固、勸慰，也要有好消息傳回來。今天它落在家族裡第一個信主的人、散在各國的弟兄姊妹、撐不住的帶領人身上——判斷的理由要說出來（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你有沒有具體說出，這一章的原則今天在你的教會落在哪些人身上，並且說出判斷的理由？","⑫ 把這一章講成 321 的插圖：先講「235」的「2」、「建立屬神的體系」，再拿提摩太和 3:7 來印證。","次序是經文先講：一個撐不住的父親、一個被差去的同工、一間在患難裡站著的教會、一個晝夜的禱告；說完了，321 才在末端認出它。經文不是理念的配圖（鐵律五）。","檢驗標準：會眾聽完，記住的是一套團契的術語，還是那一位把人安放、差人去堅固、最後親自來的主？"]},{"n":4,"t":"神的旨意就是要你們成為聖潔","sub":"聖、靜、遇","lv":"A","arc":"聖","sec":[["4:1--8","神的旨意就是要你們成為聖潔：身體與聖潔"],["4:9--12","論到弟兄們相愛：安靜做工"],["4:13--18","論到睡了的人：不要像沒有指望的人"]],"serm":{"pts":[["神的旨意","4:1--8","「神的旨意就是要你們成為聖潔，遠避淫行」——在一個性很隨便的城裡，聖潔包括身體；性的罪也是「欺負他的弟兄」，聖潔的力量是「那賜聖靈給你們的神」"],["拚命去安靜","4:9--12","「又要立志作安靜人，辦自己的事，親手做工」——弟兄相愛是神親自教的；愛的樣子包括不讓別人替你付帳，「向外人行事端正」"],["還會再見面","4:13--18","「這樣，我們就要和主永遠同在」——教會裡有人過世了；保羅沒有說不要哭，是說不要像沒有指望的人；被提這段經文的結論是「彼此勸慰」"]]},"q":"深夜十二點，房門關著，手機亮著。沒有人看見你，你也知道自己正往哪裡滑；或者，那個沒有人看見的人不是你——是那個上司、那位長輩、那個你曾經信任的人，而你到今天還覺得髒的是自己。\n也許你的難處不在夜裡，在白天：你被裁員了，或者你每天加班到十一點，已經分不清自己是在「做工」還是在被工作吞掉。\n也許你剛從加護病房外的走廊回來，有人拍拍你說「不要哭，他去天家了」。這一章要問的是：一個剛學走路的信徒，在身體、工作與墳前，要怎樣一步一步走，而且不是一個人走？","truth":"神的旨意就是要你們成為聖潔：聖潔是一個孩子學走路，從身體、工作走到墳前，每一步都有那一直在賜聖靈的神扶著；跌倒的人不是被除名的人，被欺負的人不是不聖潔的人。\n所以我們可以帶著眼淚等候：在耶穌裡睡了的人一個都不會被留下，主必親自回來，我們就要和主永遠同在——這些話，是寫來彼此勸慰的。","mv":{"t":"神的旨意就是要你們成為聖潔，遠避淫行；","r":"帖前4:3"},"card":["這一章是成長的第四步：聖——孩子學走路。歸、養、穩之後，站起來的孩子要開始走了：保羅教他們怎樣用身體走（4:1–8），怎樣在弟兄中間、在工作上走（4:9–12），最後扶著他們走到一位弟兄的墳前，再從墳前一路走上山頂（4:13–18）。走路的目的不是被打分數，是走向那一位一定會回來的主。","這一章的主詞，一再是神。是神的旨意要我們成聖（4:3），是神召我們進入聖潔（4:7），是神一直把他的聖靈賜進我們裡面（4:8）；是神親自教一群陌生人彼此相愛（4:9）；是主替被欺負的人伸冤（4:6）。到了墳前，是神把在耶穌裡睡了的人與耶穌一同帶來（4:14），是主親自從天降臨（4:16）。人學走路，神扶著，而且從頭扶到尾。","4:15「斷不能在那已經睡了的人之先」，原文 οὐ μὴ φθάσωμεν 是希臘文最強的否定：絕對不會搶先一步。帖撒羅尼迦人怕的，正是「被留下」——怕先走的弟兄錯過主來的那一天。保羅用最重的一個否定回答：一個都不會。這改變今天的讀法：被提這段經文原本是在消除「被留下」的恐懼，不是製造它。誰拿這幾節嚇人，就是把保羅最溫柔的一句雙重否定，讀成了相反的意思。","這一章照出來的我，常常把聖潔當成自己的成績單：守住了就看不起人，跌倒了就躲起來，兩樣都是只看自己。我把別人的身體、時間和錢當成可以多拿一點的東西，還說服自己「沒傷到誰」；我很會管別人的閒事，卻不太會安靜做好自己的工；到了喪禮上，我急著說一句漂亮的話，好讓自己不必陪人沉默。根在這裡：我要自己作主，不肯讓主扶。","「所以，你們當用這些話彼此勸慰。」（4:18）全章最該記住的是這個「所以」。主再來、死人復活、被提到雲裡——這一切不是寫來排路線圖的，是寫來放在一個哭泣的人耳邊的。保羅沒有叫教會等使徒來安慰，他說「你們彼此」：一間只有幾個月大的教會，已經可以用神的話，扶起彼此。末世論的終點不是一張時間表，是一隻扶在別人肩上的手。","這一週做一件事：打開手機的通話紀錄，找一位最近三個月內失去親人的人——喪禮已經辦完、花圈已經撤走、大家也不太再問起的那一位。這個禮拜打給他，或帶一份簡單的食物去他家。不必準備講道，只問一句「你最近最想他的是甚麼時候」，然後聽他講完。若他願意，最後一起讀 4:17–18，再約好下一次見面的日子。","最終整合：帖撒羅尼迦，耶孫家裡，一個晚上。\n提摩太帶回來的那封信，今晚要念第二次。屋裡擠著染布的、打鐵的、碼頭扛貨的，油燈只有兩盞。\n角落裡坐著一位婦人，她的丈夫上個月下葬。她的小兒子剛滿一歲，正扶著長凳，一步一步學走路。\n念信的人念到「神的旨意就是要你們成為聖潔」，幾個年輕人低下了頭；念到「主必報應」，一位做過奴隸的姊妹抬起頭來，這是第一次有人說，她受的事，神要伸冤。\n念到「親手做工」，打鐵的看了看自己的手。\n然後，念信的人停了一下，聲音放慢：「論到睡了的人……」\n屋裡忽然很安靜。所有的人都沒有看信，都在看她。\n「恐怕你們憂傷，像那些沒有指望的人一樣。」她哭了。沒有人叫她不要哭。\n「那在基督裡死了的人必先復活。」她停住了。\n「這樣，我們就要和主永遠同在。」\n那個孩子這時候鬆開了長凳，搖搖晃晃，跨出三步，跌進一位弟兄的懷裡。\n念信的人念完最後一句：「所以，你們當用這些話彼此勸慰。」\n於是，他們真的這樣做了。有人坐到她旁邊，有人把孩子抱回她手上。\n這間教會還在學走路，跌跌撞撞；可是他們知道自己要走向誰，也知道路上，沒有一個人會被留下。"],"self":"這一章照出來的「有己」，第一個樣子是越界：我把別人的身體、別人的婚姻、別人的時間與信任，當成可以多拿一點的東西，只要沒人看見、對方沒說不，我就說服自己沒有傷到誰——這正是 4:6 的「越分，欺負他的弟兄」。\n第二個樣子是自己扛、自己判：守得住的時候我看不起跌倒的人，跌倒的時候我躲起來不讓人扶；在別人的喪禮上，我急著說一句對的話來結束沉默，因為我受不了自己沒有答案。兩樣都是不肯讓主扶，也不肯讓弟兄扶。","t321":{"k":"耶穌是我的榜樣：這一章的四層關係，主耶穌在地上一層一層活過。與父，他天未亮就到曠野禱告，一生所求的是討父的喜悅；與自己的身體，他受過試探，卻從不越分；與人，他對被眾人指指點點的婦人說「我也不定你的罪。去吧，從此不要再犯罪了」（約 8:11），既不羞辱她，也不降低聖潔的標準；與工作，他是拿撒勒人口中「這不是那木匠嗎」（可 6:3）的那一位，用自己的手做工三十年。最後，他自己真的死了、又復活了，成了那位會叫醒睡了的人的主——他先走過這一整條路，我們才能跟著學走。","g":"讓耶穌作王：這一章要人讓出兩個位置。第一個是「我身體的主人」：身體是神所要的聖潔所在，不是由我、由慾望、也不是由別人的權勢來作主，所以我不越別人的界線，也不讓人越我的界線。第二個是「時間表的主人」：我想知道主哪一天來、想決定別人的眼淚甚麼時候該停、想斷定已經過世的人去了哪裡；讓耶穌作王，就是把日子交還給他，把審判交還給他，只做他交給我的那件事——用這些話彼此勸慰。可以自己檢查：這一週，我在哪一件事上，還坐在只有主能坐的位子上？","p":"建立屬神的體系：經文先說完它自己的話，321 才接上來。4:3–12 一段之內，關係的四層次序全到：與神（4:3「神的旨意」）、與自己（4:4 守著自己的身體）、與人（4:9 彼此相愛）、與事（4:11 親手做工），次序不能倒過來，一間只會辦事、不顧人的教會，會在第二層、第三層出事。所以一個健康的體系要有具體的東西：有清楚的保護與通報流程，讓被權勢侵害的人說得出口、被相信、被保護；有人在弟兄姊妹失業時一起找工作、一起度過帳單；有一組人在喪禮結束後的第一個月、第三個月、第一個清明，繼續上門；也有讓跌倒的人可以安全回來的小組。4:18 的「彼此」，就是這個體系的運作方式。"},"grp":["【一、破冰】你記得自己的孩子、姪子姪女或弟妹，第一次走路是在哪裡、幾歲的時候嗎？當時旁邊的大人做了甚麼？如果你自己沒有見過，說說你學會騎腳踏車的那一天，是誰在後面扶著你。","【二、扎心】「不要一個人在這事上越分，欺負他的弟兄」（4:6）。不談細節，只說一件：在你的工作、網路或關係裡，哪一條界線是你最容易「多拿一點」的地方——別人的時間、信任、注意力，還是身體？上一次你發現自己越了線，是在甚麼場合？","【三、福音】「所以，那棄絕的，不是棄絕人，乃是棄絕那賜聖靈給你們的神。」（4:8）神是一直在賜聖靈的神。說一段日子：哪一年、在甚麼處境裡，你曾經以為自己跌得太深、回不來了，後來卻發現神沒有收回他的靈？那時候是誰陪你走回來的？","【四、行動】說出一個名字：一位最近一年內失去親人、而且喪禮之後就比較少人關心的人。說出你要在這一週的哪一天、用甚麼方式（一通電話、一頓飯、陪他去掃墓）去看他，以及你打算只問、不講的那一句話是甚麼。","【五、代禱】為三種人指名禱告：一位正在喪親哀傷裡、喪禮過後沒有人再提起的人，求主差人坐在他身邊；一位曾經被權勢侵害、至今不敢說出口的弟兄姊妹，求主讓他在教會裡被相信、被保護；一位剛失業或在加班文化裡被工作吞掉的人，求主讓他安靜做工，也有尊嚴地被扶持。"],"prac":{"main":"這一週學走路：把身體交還給神，安靜做好手上的工，再走到一位哭泣的人身邊，用這些話彼此勸慰。","items":["對神：每天早上讀一段：週一 4:1–3、週二 4:4–8、週三 4:9–12、週四 4:13–14、週五 4:15–18；每讀完一段，用一句話對神說「你今天要我成為怎樣的人」，再為那位一直在賜聖靈的神感謝一次。","對自己：找出你最容易越界、最常跌倒的那一個時段與地點（例如深夜、一個人的房間、出差的旅館），這一週為它做一件具體的安排：手機放在房門外、裝上過濾、或約一位同性的屬靈同伴每週問你一次。跌倒了不躲起來，當天就說出來。","對人：打電話或探望一位最近失去親人的人，只問一句「你最近最想他的是甚麼時候」，聽完，不急著勸，也不說「你應該高興」；若你知道有人曾被侵害，不追問細節，只讓他知道你相信他，並願意陪他去找專業與法律的協助。","對生活：檢查你的「工」：這一週記下每天工作的時數，若超過你能照顧家人與身體的程度，與家人談一次怎樣調整；若你正失業或在家照顧人，寫下一件你這一週仍能「親手做」的事，並讓小組知道你的需要。","對使命：這一週替你的小組或教會想一件「彼此勸慰」的具體安排：例如一份喪禮後三個月的探訪名單、一位失業弟兄的求職協助，或一個讓跌倒的人可以安全回來的時段；把它提出來，並自己認領其中一項。"]},"safe":["① 把 4:16–17 講成被提時間表，或用「被提的時候，你若還在犯罪、沒有準備好，就會被留下來」恐嚇會眾。","4:15 的 οὐ μὴ φθάσωμεν 正是在消除「被留下」的恐懼；這段經文寫給正在哭的人，結論是「所以，你們當用這些話彼此勸慰」（4:18）。把安慰講成恐嚇，是把經文的用途整個翻過來（紅線一，全卷立場見議題「主再來、被提與末世時間表」）。","檢驗標準：會眾聽完，是更想念主來，還是更害怕主來？一位剛喪親的人聽完，是被安慰，還是多了一層恐懼？","② 用 5:1–3 或 4:15 推算日期、或把時事對號入座：「照這些預言推算，主會在某年回來」「最近的戰爭、疫情就是 5:3 的災禍忽然臨到」。","保羅明說「論到時候、日期，不用寫信給你們」（5:1），主耶穌也說那日子「沒有人知道」；歷史上每一次宣布日期都落空，而且每一次都傷了最單純的信徒（鐵律四、六，紅線一，全卷立場見議題「主再來、被提與末世時間表」）。","檢驗標準：講章裡有沒有出現任何年份、倒數，或「這條新聞應驗了」一類的句子？會眾聽完，是更忍耐，還是更恐慌？","③ 用 4:15「我們這活著還存留到主降臨的人」說「保羅算錯了日子，所以聖經不可靠」；或反過來說「保羅以為自己會活到，我們這一代一定會活到」。","保羅把自己放在每一代信徒該站的位置上，卻從未定下日子；兩種講法都把一個姿態讀成了一張日曆（全卷立場見議題「主再來、被提與末世時間表」）。","檢驗標準：會眾聽完，是學會每天活得像主可能今天回來，還是開始懷疑聖經，或開始排自己這一代的時間表？","④ 在追思禮拜上用 4:13 叫人不要哭：「聖經說不要憂傷，他已經在天家了，你哭就是不信」「你應該高興才對」。","保羅說的是不要「像那些沒有指望的人一樣」憂傷，不是不要憂傷；這使我們想起「耶穌哭了」（約 11:35）。叫喪親的人收起眼淚，是用經文再傷他一次（紅線二，全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」）。","檢驗標準：一位剛送走親人的人聽完，是覺得自己可以帶著眼淚來到主面前，還是覺得要先擦乾眼淚才算有信心？","⑤ 在喪禮或家屬面前，對未信主的亡者下斷語：「他沒信主，所以……」，或用亡者的去處催逼家屬當場決志。","4:13–18 的盼望是對「在耶穌裡睡了的人」說的，保羅在這裡沒有討論其他人；審判在「審判全地的主」手中，不在講台上，更不在棺木旁（紅線二，全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」）。","檢驗標準：未信主的家屬聽完，是看見一位又公義又慈愛的神，還是覺得這間教會在他最痛的時候判了他的家人？","⑥ 遇到自殺者家屬、嬰孩夭折、流產或意外喪親，急著解釋：「這是神的旨意」「神要用這件事教你功課」「他現在比較好」。","4:13 的對象是正在哀傷的人，保羅給的是陪伴與盼望，不是解釋；急著解釋，常常是為了減輕說話的人自己的不安。這時先陪伴、不解釋，必要時協助尋求哀傷輔導（紅線二，全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」）。","檢驗標準：你在這些家庭面前說出口的第一句話，是一個答案，還是一個陪伴？他們事後記得的是道理，還是有人坐在身邊？","⑦ 把 4:3–5 講成羞辱與恐嚇：「你已經不純潔了，就像被嚼過的口香糖」，或在台上公開點名、要人當眾認罪。","「成聖」是一個過程，不是一張只能用一次的證書；那要我們聖潔的神，也是「必成就這事」的神（5:24）。羞辱只會把跌倒的人趕出教會，趕回黑暗裡（紅線四，全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」）。","檢驗標準：一位正在這方面掙扎或曾經跌倒的人聽完，是想回家，還是想躲起來、再也不來？","⑧ 把性侵、性暴力的受害者算成「不聖潔」：「她穿成那樣，自己也有責任」，或用「要饒恕、要合一、不要張揚」把權勢性侵壓下去。","4:6 說的是「越分，欺負他的弟兄」——錯在越界佔便宜的一方，被侵害的人不是不聖潔的人；「主必報應」首先是對受害者說的：神替你伸冤。保護受害者，比保護加害者的名聲與教會的面子更要緊（紅線四，全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」）。","檢驗標準：一位曾被侵害的弟兄姊妹聽完，是更被保護、更敢說出來，還是更羞愧、更沉默？教會有沒有會後單獨關心、協助尋求專業與法律協助的管道？","⑨ 用 4:4 的「娶妻」讀法說「妻子是丈夫的器具」，或把 4:3–8 講成只是對女人的貞潔要求。","保羅在一個男人可以任意找女人的城市裡說話，兩種讀法的落點都是「聖潔、尊貴」對「私慾的邪情」：性要放在尊重裡，不放在佔有裡；命令是對「各人」說的，不是只對一個性別說的（全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」）。","檢驗標準：一位姊妹聽完，是覺得自己被當成一件物品，還是看見神要每一個人被尊重？","⑩ 把 4:8「不是棄絕人，乃是棄絕神」講成「你不聽我，就是不聽神」，用來要求會眾絕對順服講台。","保羅在這一節正好是把自己移開：命令是「憑主耶穌」傳的（4:2），不是使徒的喜好；屬靈父母是把孩子帶到神面前，不是站在神的位置上（紅線七）。","檢驗標準：會眾聽完，是更敬畏神、也更敢凡事察驗，還是更怕質疑牧者？","⑪ 把聖潔講成只靠咬緊牙關：「你再努力一點、再禁食一次就能勝過」，完全不提 4:8 那一直在賜聖靈的神。","原則是：命令是給我們的，成就是神的（5:23–24）；διδόντα 是現在式，神今天還在給。只剩意志力的講法，會讓反覆跌倒的人最後放棄（全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」）。","檢驗標準：一位反覆跌倒的人聽完，聽見的只有「你要努力」，還是也聽見「那要你聖潔的神，親自住在你裡面，而且不放棄你」？","⑫ 把 4:11「作安靜人」講成「基督徒不要管社會的事」，或用「親手做工」責備失業、生病、在家照顧家人的人：「你就是懶」。","安靜的反面是到處攪動、靠人供養卻管別人的事，不是對公義沉默；帖後 3:10 責備的是「不肯」做工，不是「不能」做工。把經文用來貶低失業者，是在他最需要扶持的時候再推他一把（紅線八）。","檢驗標準：一位剛失業或在家照顧失智父母的人聽完，是被扶起來，還是被壓下去？","⑬ 把 4:11「親手做工」講成「為公司拚命就是榮耀神」，替過勞與無止境的加班文化背書。","保羅叫人安靜做工，好叫自己「沒有甚麼缺乏」、不成為別人的重擔，不是叫人讓工作吞掉家庭、身體與敬拜；等候主的人手上有活兒，但他的生命不屬於工作。","檢驗標準：一位每天加班到深夜的人聽完，是更有罪疚地再加一小時，還是更敢為家人、身體與安息設下界線？","⑭ 用 4:13–18 在華人喪葬裡製造對抗：「拿香就是拜偶像，鞠躬就是背道」，在靈堂上與長輩當場衝突，或說孝順是次要的。","基督徒不拜偶像（1:9），但可以盡孝、記念、感恩；用溫柔而不是對抗作見證，正是「向外人行事端正」（4:12）。喪禮是家人最脆弱的時候，不是辯論的場合（全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」、議題「受苦、逼迫與家人反對」）。","檢驗標準：未信主的長輩看完你在喪禮上的樣子，是覺得信耶穌的人不孝，還是覺得信耶穌的人最懂得記念親人？","⑮ 用處境取消原則：「4:3–8 是古代港口城市的事，今天的性觀念不同了」；或反過來不分處境，把當時的話原封不動壓在今天每一個人身上。","書信三問要走完：帖撒羅尼迦人的處境是一座性很隨便、雙重標準的城；保羅從福音推出的原則是神的旨意是聖潔、性的罪也是對人的不公義；今天的原則落在手機、同居與職場的權勢關係裡——判斷的理由要說出來（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你有沒有具體說出，這一章的原則今天在你的教會落在哪些人、哪些場合，並且說出判斷的理由？","⑯ 把這一章講成 321 的插圖：先講「關係的次序」，再把 4:3–12 拿來印證，或把 4:18 直接講成小組制度的證明。","次序是經文先講：神的旨意、守著身體、彼此相愛、安靜做工、墳前的盼望、彼此勸慰；說完了，321 才在末端認出它。經文不是理念的配圖（鐵律五）。","檢驗標準：會眾聽完，記住的是一套團契的術語，還是那一位會親自回來、叫醒睡了的人的主？"]},{"n":5,"t":"總要警醒謹守","sub":"光、醒、成","lv":"A","arc":"醒","sec":[["5:1--11","論到時候、日期：光明之子"],["5:12--15","我們勸你們敬重那在你們中間勞苦的人：彼此和睦"],["5:16--22","要常常喜樂：不住地禱告、凡事察驗"],["5:23--28","願賜平安的神親自使你們全然成聖：他必成就"]],"serm":{"pts":[["白天的人","5:1--11","「你們都是光明之子，都是白晝之子」——主的日子來到好像夜間的賊；保羅不給日期，只給身分：天還沒亮，你已經是白天的人了，「所以，你們該彼此勸慰，互相建立」"],["四種人四種對待","5:12--22","「要警戒不守規矩的人，勉勵灰心的人，扶助軟弱的人，也要向眾人忍耐」——等候主的教會，是一群懂得分辨、彼此扶持、常常喜樂、凡事謝恩的人"],["他必成就","5:23--28","「那召你們的本是信實的，他必成就這事」——命令是給我們的，成就是神的；新約第一封信，最後一個命令是把信念給眾弟兄聽"]]},"q":"夜裡兩點，你醒著的理由是甚麼？是在醫院值大夜班、在床邊替失智的父親翻身、在等一個還沒回家的孩子，還是在教會群組裡看完第五支「末日倒數」的影片，越看越睡不著？\n也許你不怕主來，你怕的是自己：怕他來的那一刻，你正好軟弱、正好灰心、正好又跌倒了。也許你就是那個在小組裡被說「信心太小」的人，從此不太敢開口。\n這一章寫給一間在夜裡等候的嬰孩教會。保羅不給日期，他問的是：天還沒亮，你知道自己是誰嗎？你身邊那個快撐不住的人，有沒有人坐到他旁邊？","truth":"守夜：天還沒亮，我們已經是光明之子、白晝之子（5:5），所以不算日子，只是醒著、彼此扶持，在凡事中向神謝恩（5:18）；能守到天亮，不是因為我們守得夠好，是那召我們的本是信實的，他必成就（5:24）。\n這個盼望不歸少數人保管：要把這信念給眾弟兄聽（5:27）——念給灰心的、軟弱的、沒能來的，一個都不能少。","mv":{"t":"那召你們的本是信實的，他必成就這事。","r":"帖前5:24"},"card":["這一章說的是：守夜。歸、養、穩、聖、醒，這個孩子走到第五步，長大了——不再只是被人守著，而是開始替別人守夜。保羅拒絕給時間表（5:1），只給一個身分：你們是白晝之子；然後教這群剛長大的孩子怎樣在夜裡過日子：清醒、穿上信愛望、認識勞苦的人、分辨身邊的四種人、常常喜樂、不住禱告、凡事謝恩。最後他把所有守夜的人，交給一位比他們更醒的神：他必成就。","這一章的神，整夜都醒著。他不是預定我們受刑，乃是預定我們得救（5:9）；他的兒子替我們死，叫醒著的、睡了的都與他同活（5:10），死亡沒有把一個人從他的家裡除名；他的靈像火一樣在教會裡燒（5:19）；他是賜平安的神，親自使人全然成聖，連靈、魂、身子都保守（5:23）；他一直在呼召，而且他必成就（5:24）。人能醒著，是因為神從來沒有睡——這使我們想起詩 121:4。","5:12「敬重」，原文 εἰδέναι（eidenai）是「認識、知道」。保羅不是先叫人尊重頭銜，而是叫人去認識那些在你們中間勞苦的人：知道他們為甚麼累、晚上在忙甚麼、家裡過得怎樣。這改變今天的讀法：敬重不是站遠一點仰望，是走近一點認識。被認識的領袖，不能躲在講台後面；真認識他的會眾，也不會把他神化。一間連牧者家裡有人住院都不知道的教會，談不上敬重；一位不准會眾認識自己軟弱的領袖，也不是保羅說的那種勞苦的人。","這一章照出來的我，常常在夜裡把自己灌醉——不是酒，是新聞、工作、別人的讚美，好讓自己不必清醒地面對神。我對末世時間表很有興趣，對身邊的人卻沒甚麼耐心：我會轉傳一支預言影片，卻不會打一通電話給那個三個禮拜沒來的弟兄。我用同一種方式對待所有人：對灰心的人講道理，對脫隊的人陪笑臉，對軟弱的人只說一句「加油」。我謝恩，多半是在事情順利的那幾天。","「那召你們的本是信實的，他必成就這事。」（5:24）保羅一口氣下了十幾個命令——要醒、要謹守、要勸慰、要敬重、要警戒、要勉勵、要扶助、要忍耐、要喜樂、要禱告、要謝恩、要察驗——最後一句，卻把整份清單的重量從你肩上挪到他手裡。這一句翻轉了守夜的意義：守夜的人不是那個必須撐到天亮的人。你今晚可以安心地睡，因為真正醒著的那一位不是你；明天早上你醒來，他還在做他開始做的工。","這一週做一件事：寫下你身邊三個人的名字，在每個名字旁邊寫上 5:14 的一個動詞——警戒、勉勵、扶助、忍耐。然後挑出寫著「勉勵」的那一位，這週找一個晚上打電話給他，或約他喝一杯熱的，只做兩件事：聽他說完，再告訴他一件你為他感謝神的事。若他提到已經兩個禮拜以上睡不著、吃不下，或說出不想活的話，不要等下一次，陪他去找醫師或輔導，那一天就去。","最終整合：帖撒羅尼迦，耶孫的家，天亮以前。\n一個在碼頭搬貨的奴隸剛下夜工，站在門口不敢進來——他不識字，上一次念信他沒趕上。\n屋裡有人起身把他拉進來：「坐這裡。這封信，一個都不能少。」\n念信的人念到：「你們都是光明之子，都是白晝之子。」窗外還是黑的。\n角落裡，上個月才埋葬丈夫的寡婦把頭抬起來：天還沒亮，保羅說她已經是白天的人。\n念到「勉勵灰心的人」，坐在她旁邊的姊妹，把手放在她的手上。\n念到「凡事謝恩」，她哭了。她沒有為丈夫的死感謝；她感謝的，是此刻握著她的這一隻手。\n念到「那召你們的本是信實的，他必成就這事」，耶孫想起那一夜：暴民衝進他家，保羅被連夜送出城。\n保羅走了。可是那一位呼召他們的，一天也沒有走。\n最後念到「我指著主囑咐你們，要把這信念給眾弟兄聽」，全屋的人都轉頭看門口那個搬運工。\n他是今晚最後一個聽見的人，也是保羅用起誓的語氣，不肯漏掉的那一個。\n東邊的天開始發白。守夜的人可以回家睡了——\n因為真正守夜的那一位，從來不打盹，而且他必成就。"],"self":"這一章照出來的「有己」，第一個樣子是要掌握時間：我想知道主哪一天來、問題哪一天解決、孩子哪一天回頭；不給我日期，我就不安，於是自己去排，排不出來就用加班、追劇和刷手機把夜晚填滿，好讓自己不必清醒。\n第二個樣子是要掌握人：我用同一把尺量所有的人，嫌灰心的人太慢、嫌軟弱的人太麻煩，對領袖不是盲從就是冷嘲；我還想當那個「必成就」的人，好像教會、家人、連我自己的成聖，都要靠我一個人撐到天亮。","t321":{"k":"耶穌是我的榜樣：最長的那一夜，是主耶穌自己在客西馬尼守夜。門徒睡著了，他叫醒他們：「總要警醒禱告，免得入了迷惑。你們心靈固然願意，肉體卻軟弱了」（太 26:41）——他叫醒人，卻替睡著的人說了一句體諒的話。被賣的那一夜，他還在謝恩：「主耶穌被賣的那一夜，拿起餅來，祝謝了」（林前 11:23–24）。這就是 ἐν παντὶ εὐχαριστεῖτε（en panti eucharisteite）：不是為背叛感謝，是在背叛的夜裡仍然向父感謝。他對彼得、多馬、撒瑪利亞婦人、法利賽人各有不同的對待，因為每一個人都不一樣；「壓傷的蘆葦，他不折斷；將殘的燈火，他不吹滅」（太 12:20）——5:14 的四個動詞，他全都活過。","g":"讓耶穌作王：這一章要人讓出兩個位置。第一個是時間的主人：主甚麼時候來、苦難甚麼時候結束、那個人甚麼時候改變，這些時候、日期握在父自己的權柄裡（徒 1:7），保羅連寫都不寫；讓耶穌作王，就是不再自己排時間表，也不再用忙碌把不安灌醉。第二個是成就者的位置：5:23 的主詞是「神親自」，5:24 是「他必成就」。我不是自己成聖的總工程師，也不是別人成聖的監工；我可以勸、可以扶、可以等，成就在他。凡事謝恩，就是每天把這兩個位置還給他一次。可以自己檢查：這一週，我在哪一件事上，還把自己當成那個必須撐到天亮的人？","p":"建立屬神的體系：經文先講完它自己的話——5:11 一個建造另一個，5:12–13 認識並敬重勞苦的人，5:14 四種人四種對待，5:25 彼此代禱，5:27 這信要念給眾弟兄聽。說完了，321 才在末端認出它：這就是「920」，每一個「2」都不一樣，所以帶人不能只有一套流程。一個健康的體系要有幾樣具體的東西：小組長學會分辨脫隊的、灰心的、軟弱的，手上有可以轉介的醫師與輔導名單；領袖的工作被會眾認識，也有清楚的管道讓人提出問題（5:21 凡事察驗，講台也在其中）；值夜班的、照顧病人的，有人替他們禱告、送飯；聚會有錄音、有文字、有翻譯，送到不識字的長輩、週日上班的同工、不識中文的看護手上；凡事謝恩成為聚會的習慣，把榮耀歸給耶穌，不是歸給辦得好的人。"},"grp":["【一、破冰】你這輩子熬過最長的一個夜是哪一晚？在哪裡——產房外、急診室、考場前、還是值夜班？那一晚你在等甚麼？天亮的時候，第一個跟你說話的人是誰、說了甚麼？","【二、扎心】「我們又勸弟兄們，要警戒不守規矩的人，勉勵灰心的人，扶助軟弱的人，也要向眾人忍耐。」（5:14）想一個你這個月實際接觸過的人（可以不說名字，只說關係：同事、孩子、組員）。他是這四種人裡的哪一種？你上一次對他說的話，用的是哪一個動詞？有沒有用錯——該勉勵的，你警戒了；該警戒的，你一直陪笑臉？","【三、福音】「他替我們死，叫我們無論醒著，睡著，都與他同活。」（5:10）說一段日子：哪一年、在哪裡，你屬靈上是睡著的——不禱告、不聚會，甚至不太想信了。那段日子裡，神怎樣沒有放開你？是誰、用甚麼方式把你叫醒，而不是把你罵醒？","【四、行動】「我指著主囑咐你們，要把這信念給眾弟兄聽。」（5:27）說出一位這個月沒聽到神話語的人：臥病在家的長輩、週日要上班的同事、不識中文的看護、剛被裁員不敢來教會的弟兄。說出你要在哪一天、用甚麼方式（念給他聽、送一段錄音、陪他一起上線聚會），把這一章帶到他那裡。","【五、代禱】為三種人指名禱告：一位正在憂鬱、焦慮或灰心裡的人，求主差人坐到他身邊，也讓他願意接受專業的幫助；一位在夜裡工作或守夜的人——護理師、保全、照顧者、夜班司機，求主作他的護心鏡和頭盔；一位在教會裡勞苦帶領的同工，說出他的名字，為他的身體、家庭和疲累禱告（5:25）。"],"prac":{"main":"這一週，在夜裡作白天的人：不算日子，只守住身邊的人；在凡事中謝恩，把結果交給那必成就的神。","items":["對神：每天晚上睡前，照 5:18 寫一句「在＿＿之中，我感謝你＿＿」——在凡事中，不是為凡事：在失業之中感謝你給我今天的飯，在病房之中感謝你沒有離開。寫完讀一次 5:24，對主說：「今晚你醒著，我可以睡了。」七天之後，把這七句念一遍，看看榮耀歸給了誰。","對自己：照 5:6–8 做一次清醒檢查：這一週讓你「醉」的是甚麼——追劇到兩點、刷末日影片、用加班躲開家裡？挑一樣，訂出一條界線（例如晚上十一點手機放在客廳）。也許你需要的不是更警醒，而是好好睡一覺；身體的休息不是屬靈的昏睡。","對人：照 5:14 看清楚三個人：找一位灰心的人，坐下來聽他說完，不給道理；找一位軟弱的人，做一件具體的扶助（接送、一頓飯、陪他去看醫生）；對那位最讓你難以忍耐的人，這一週至少一次不以惡報惡，改說一句良善的話（5:15）。","對生活：這一週不轉傳任何「末日時間表」「某則新聞應驗了預言」的訊息；看到時先照 5:21 察驗，再問自己：轉出去，會讓人更愛主，還是更恐慌？把省下來的時間，用來為新聞裡正在受苦的人禱告一次。","對使命：照 5:27，把這一章帶給一位沒有聽到的人：為不識字的長輩念一次 5:1–11，給臥病的弟兄送一段錄音，或邀一位週日要上班的同事參加線上的團契；並照 5:25，為你的牧者與帶領同工具體地禱告一次，再傳一則訊息告訴他：你為他禱告了。"]},"safe":["① 用 5:1–3 推算主再來的日子、畫末世時間表，或說「照這幾年的局勢看，主再來就在某某年」。","保羅手上明明可以寫，卻說「弟兄們，論到時候、日期，不用寫信給你們」（5:1）；主耶穌自己說「惟獨父知道」（太 24:36）。推算日期，等於做了一件使徒拒絕做的事，每一次落空都在磨損人的信心（紅線一，全卷立場見議題「主再來、被提與末世時間表」）。","檢驗標準：會眾聽完，記住的是一個年份、一張圖表，還是「我是白晝之子，每天都可以平靜地等候」？","② 用「被提的時候你會被留下來」恐嚇人，特別是嚇孩子、嚇剛信主的人，好叫他們乖乖聚會、奉獻。","「神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救」（5:9）——給信徒的末世論是應許，不是威脅；用恐懼換來的順從，會讓人一輩子以為神在等著抓他（紅線一，全卷立場見議題「主再來、被提與末世時間表」）。","檢驗標準：一個聽完講道的孩子，晚上睡覺時是更怕爸媽突然不見，還是更確定耶穌愛他、會來接他？","③ 把 5:3「平安穩妥」對號入座到某一份和平協議、某一場停火、某一位國家領袖身上，說「五章三節應驗了」。","5:3 說的是一切自以為穩妥的人，很可能呼應當時羅馬的口號，不是一則替今天新聞準備的預告；對號入座是換一種方式在算日子，而且很容易把某個國家、某個民族妖魔化（紅線一，全卷立場見議題「主再來、被提與末世時間表」）。","檢驗標準：會眾看完新聞，是更想替受苦的人禱告、更謹守自己的心，還是更興奮地轉傳「預言應驗了」？","④ 把 5:6「警醒」講成不准休息：熬夜禱告才屬靈、累了就是「睡著了」、休假就是對主冷淡。","5:7 的「睡」與「醉」是屬靈的昏睡麻木，不是身體的睡眠；保羅自己晝夜做工，也要睡覺。把警醒講成永不鬆懈，會讓值夜班的、照顧病人的、本來就睡不夠的人，再背上一層罪疚，最後耗盡。","檢驗標準：一位剛下夜班、一位整夜照顧孩子的人聽完，是更有罪疚，還是知道自己可以安心睡覺，因為醒著的是神？","⑤ 用 5:12–13「敬重」要求絕對順服：「質疑牧者就是消滅聖靈」「屬靈父親說的話不可以問為甚麼」「離開就是悖逆」。","敬重原文是「認識」，理由是「因他們所做的工」（5:13），不是頭銜；同一段要全教會「但要凡事察驗」（5:21），講台也在其中。保羅的父母權柄是放下、餵養、自己做工（2:6–9），目標是孩子站穩，不是離不開——用敬重包裝控制，是把 5:12 講反了（紅線七；屬靈權柄回指哥林多後書立場三）。","檢驗標準：會眾聽完，是更敢向領袖提出誠實的問題，還是更怕一開口就被說成不順服、不屬靈？","⑥ 對灰心的人說「你就是信心太小」「多讀經禱告就好，不用看醫生、不用吃藥」，把憂鬱、焦慮講成屬靈失敗。","5:14 對灰心的人用的動詞是「勉勵」，不是「警戒」；用錯動詞，扶人的手就變成推人的手。憂鬱症、焦慮症是需要治療的病，禱告、陪伴、就醫與服藥並不衝突；阻止就醫，可能延誤到危險的地步（紅線八）。","檢驗標準：一位正在服藥、不敢讓小組知道的人聽完，是更想藏起來、更想停藥，還是更敢說出來、也更安心地繼續治療？","⑦ 把 5:16–18 講成否認情緒：「基督徒不可以難過」「凡事謝恩，所以你要為孩子的病、為被裁員、為被侵害感謝神」。","ἐν παντὶ（en panti）是在凡事中謝恩，不是為惡事謝恩；這封信寫給剛埋葬親人、正被逼迫的人，保羅沒有叫他們不哭（4:13）。逼人為惡事謝恩，會讓受傷的人以為神喜歡他受傷（紅線八；全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」、議題「受苦、逼迫與家人反對」）。","檢驗標準：一位正在病床邊、剛被裁員或剛受了傷害的人聽完，是覺得要先擠出笑容才配禱告，還是知道可以帶著眼淚，在這處境裡仍向神開口？","⑧ 用 5:14「不守規矩的人」貶低失業者、領補助的人、病中無法工作的人：「不做工的就是懶」。","ἀτάκτους（ataktous）是脫隊的兵，回指 4:11，指有能力卻拒絕自己那一份、等著別人供養的人；不是被裁員的、生病的、為照顧家人而無法上班的人。把失業講成罪，等於把軟弱的人放進要被警戒的名單（紅線八）。","檢驗標準：一位剛失業的弟兄聽完，是更不敢來教會，還是知道自己屬於「扶助軟弱的人」那一句、會有人撐住他？","⑨ 把 5:23「靈與魂與身子」講成屬靈階級：「屬靈的人活在靈裡，屬魂的人還在情感、理性裡打轉」，用「你太屬魂了」否定人的眼淚、思考與性格。","5:23 的重點是 ὁλοτελεῖς（holoteleis，全然）與 ὁλόκληρον（holoklēron，完全）——神要保守整個人；三分說、二分說、整全說並陳，持守的都是弟兄。把「屬魂」當標籤，會讓會流淚、會提問、個性外向的人以為自己次等（紅線五，全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」）。","檢驗標準：一位剛在小組裡哭過的弟兄聽完，是覺得自己的眼淚也在神的保守裡，還是覺得自己被分到了「屬魂」那一級？","⑩ 反過來嘲笑三分說、攻擊倪柝聲弟兄或地方教會傳統：「靈魂體那一套是異端」「《屬靈人》害了華人教會」。","倪柝聲弟兄幫助過無數華人信徒認真對待內在的生命，也為主長年受苦；三分說在部分教父那裡就有。用輕蔑的口氣處理另一個傳統，正違背了同一章的「你們也要彼此和睦」與「常要追求良善」（紅線五）。","檢驗標準：一位從地方教會背景來的弟兄姊妹坐在台下，聽完是覺得被尊重、可以一起查考，還是覺得自己的屬靈出身被嘲笑？","⑪ 用 5:19–20「不要消滅聖靈的感動」取消分辨：「你質疑這個預言，就是消滅聖靈」；或用「神告訴我」替別人決定婚姻、工作、去留。","保羅緊接著說「但要凡事察驗；善美的要持守」（5:21）——δοκιμάζετε（dokimazete）是驗金子的字；不怕火，也不怕驗。任何「神的話」都要能被聖經與眾人察驗，不能被拿來控制人（先知講論回指哥林多前書 12–14 章議題）。","檢驗標準：會眾聽完，是更敢把一句「預言」拿到聖經和眾人面前察驗，還是更怕一察驗就被說成沒有信心？","⑫ 把 5:22「各樣的惡事要禁戒不做」講成形象管理：「凡看起來像惡的都不要碰」，於是不准跟未信的同事吃飯、不准走進某些地方，免得「被人誤會」。","εἴδους（eidous）在這裡是「各樣、各種」，指真實的惡事，不是別人眼中的觀感（英王欽定本譯作外表，把重點移到了觀感上）；把它變成怕被誤會的清單，會讓信徒遠離最需要福音的人，也把聖潔變成面子。","檢驗標準：會眾聽完，是更專心遠離真實的惡，還是更在乎別人怎麼看自己、更不敢走近未信的朋友？","⑬ 把 5:23–24 講成完美主義的壓力或消極的藉口：「你要完全無可指摘，所以不准跌倒」；或「反正神必成就，我甚麼都不用做」。","5:23 的「無可指摘」是神親自保守的結果，主詞是神；5:24 的「他必成就」也沒有取消前面的命令——命令是真的，成就靠他。兩種講法都把神的信實，換成了人的表現或人的懶散（全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」；成聖與完全回指腓立比書立場四）。","檢驗標準：一位剛跌倒的人聽完，是自責到想放棄，還是知道那召他的是信實的，他可以再站起來，而且這一週就有一件可以做的事？","⑭ 用處境取消原則，或把形式當成原則：說「5:26 親嘴問安是古代風俗，跟今天無關」；或硬要人照做身體接觸，甚至藉「聖潔的親嘴」越界碰觸別人。","書信三問的第三問要走完：處境是第一世紀家人之間的問安；原則是在主裡真誠、聖潔地彼此接納；今天它落在握手、擁抱、一句叫得出名字的問候，也落在尊重每個人的身體界線——「務要聖潔」本身就是界線。判斷的理由要說出來（全卷立場見議題「書信的處境與原則」、議題「聖潔、性與整個人：身體、婚姻與靈魂體」）。","檢驗標準：你有沒有說出這個原則今天在你的教會落在甚麼動作上，並且確定沒有一個人——特別是曾經受過侵害的人——因為這一節被迫接受不想要的碰觸？","⑮ 把這一章講成 321 的插圖：先講「920」和「凡事謝恩把榮耀歸給耶穌」，再拿 5:14、5:18 來證明。","經文要先講完：保羅不給日期給身分、四種人四個動詞、在凡事中謝恩、他必成就、一個都不能少；說完了，321 才在末端認出它。經文不是理念的配圖（鐵律五）；讀完的人應該更愛主，不是更佩服一套術語或一位作者。","檢驗標準：會眾聽完，記住的是「920」這個號碼，還是那位替我們死、整夜醒著、必成就這事的主？"]}],"txt":{"1":["保羅、西拉、提摩太寫信給帖撒羅尼迦在父神和主耶穌基督裡的教會。願恩惠、平安歸與你們！","我們為你們眾人常常感謝神，禱告的時候提到你們，","在神－我們的父面前，不住地記念你們因信心所做的工夫，因愛心所受的勞苦，因盼望我們主耶穌基督所存的忍耐。","被神所愛的弟兄啊，我知道你們是蒙揀選的；","因為我們的福音傳到你們那裡，不獨在乎言語，也在乎權能和聖靈，並充足的信心。正如你們知道，我們在你們那裡，為你們的緣故是怎樣為人。","並且你們在大難之中，蒙了聖靈所賜的喜樂，領受真道就效法我們，也效法了主；","甚至你們作了馬其頓和亞該亞所有信主之人的榜樣。","因為主的道從你們那裡已經傳揚出來。你們向神的信心不但在馬其頓和亞該亞，就是在各處也都傳開了，所以不用我們說甚麼話。","因為他們自己已經報明我們是怎樣進到你們那裡，你們是怎樣離棄偶像，歸向神，要服事那又真又活的神，","等候他兒子從天降臨，就是他從死裡復活的－那位救我們脫離將來忿怒的耶穌。"],"2":["弟兄們，你們自己原曉得我們進到你們那裡並不是徒然的。","我們從前在腓立比被害受辱，這是你們知道的；然而還是靠我們的神放開膽量，在大爭戰中把神的福音傳給你們。","我們的勸勉不是出於錯誤，不是出於污穢，也不是用詭詐。","但神既然驗中了我們，把福音託付我們，我們就照樣講，不是要討人喜歡，乃是要討那察驗我們心的神喜歡。","因為我們從來沒有用過諂媚的話，這是你們知道的；也沒有藏著貪心，這是神可以作見證的。","我們作基督的使徒，雖然可以叫人尊重，卻沒有向你們或向別人求榮耀；","只在你們中間存心溫柔，如同母親乳養自己的孩子。","我們既是這樣愛你們，不但願意將神的福音給你們，連自己的性命也願意給你們，因你們是我們所疼愛的。","弟兄們，你們記念我們的辛苦勞碌，晝夜做工，傳神的福音給你們，免得叫你們一人受累。","我們向你們信主的人，是何等聖潔、公義、無可指摘，有你們作見證，也有神作見證。","你們也曉得，我們怎樣勸勉你們，安慰你們，囑咐你們各人，好像父親待自己的兒女一樣，","要叫你們行事對得起那召你們進他國、得他榮耀的神。","為此，我們也不住地感謝神，因你們聽見我們所傳神的道就領受了；不以為是人的道，乃以為是神的道。這道實在是神的，並且運行在你們信主的人心中。","弟兄們，你們曾效法猶太中在基督耶穌裡神的各教會；因為你們也受了本地人的苦害，像他們受了猶太人的苦害一樣。","這猶太人殺了主耶穌和先知，又把我們趕出去。他們不得神的喜悅，且與眾人為敵，","不許我們傳道給外邦人使外邦人得救，常常充滿自己的罪惡。神的忿怒臨在他們身上已經到了極處。","弟兄們，我們暫時與你們離別，是面目離別，心裡卻不離別；我們極力地想法子，很願意見你們的面。","所以我們有意到你們那裡；我－保羅有一兩次要去，只是撒但阻擋了我們。","我們的盼望和喜樂，並所誇的冠冕是甚麼呢？豈不是我們主耶穌來的時候、你們在他面前站立得住嗎？","因為你們就是我們的榮耀，我們的喜樂。"],"3":["我們既不能再忍，就願意獨自等在雅典，","打發我們的兄弟在基督福音上作神執事的提摩太前去，堅固你們，並在你們所信的道上勸慰你們，","免得有人被諸般患難搖動。因為你們自己知道，我們受患難原是命定的。","我們在你們那裡的時候，預先告訴你們，我們必受患難，以後果然應驗了，你們也知道。","為此，我既不能再忍，就打發人去，要曉得你們的信心如何，恐怕那誘惑人的到底誘惑了你們，叫我們的勞苦歸於徒然。","但提摩太剛才從你們那裡回來，將你們信心和愛心的好消息報給我們，又說你們常常記念我們，切切地想見我們，如同我們想見你們一樣。","所以，弟兄們，我們在一切困苦患難之中，因著你們的信心就得了安慰。","你們若靠主站立得穩，我們就活了。","我們在神面前，因著你們甚是喜樂；為這一切喜樂，可用何等的感謝為你們報答神呢？","我們晝夜切切地祈求，要見你們的面，補滿你們信心的不足。","願神－我們的父和我們的主耶穌一直引領我們到你們那裡去。","又願主叫你們彼此相愛的心，並愛眾人的心都能增長，充足，如同我們愛你們一樣，","好使你們當我們主耶穌同他眾聖徒來的時候，在我們父神面前，心裡堅固，成為聖潔，無可責備。"],"4":["弟兄們，我還有話說：我們靠著主耶穌求你們，勸你們，你們既然受了我們的教訓，知道該怎樣行可以討神的喜悅，就要照你們現在所行的更加勉勵。","你們原曉得，我們憑主耶穌傳給你們甚麼命令。","神的旨意就是要你們成為聖潔，遠避淫行；","要你們各人曉得怎樣用聖潔、尊貴守著自己的身體，","不放縱私慾的邪情，像那不認識神的外邦人。","不要一個人在這事上越分，欺負他的弟兄；因為這一類的事，主必報應，正如我預先對你們說過、又切切囑咐你們的。","神召我們，本不是要我們沾染污穢，乃是要我們成為聖潔。","所以，那棄絕的，不是棄絕人，乃是棄絕那賜聖靈給你們的神。","論到弟兄們相愛，不用人寫信給你們；因為你們自己蒙了神的教訓，叫你們彼此相愛。","你們向馬其頓全地的眾弟兄固然是這樣行，但我勸弟兄們要更加勉勵。","又要立志作安靜人，辦自己的事，親手做工，正如我們從前所吩咐你們的，","叫你們可以向外人行事端正，自己也就沒有甚麼缺乏了。","論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣。","我們若信耶穌死而復活了，那已經在耶穌裡睡了的人，神也必將他們與耶穌一同帶來。","我們現在照主的話告訴你們一件事：我們這活著還存留到主降臨的人，斷不能在那已經睡了的人之先。","因為主必親自從天降臨，有呼叫的聲音和天使長的聲音，又有神的號吹響；那在基督裡死了的人必先復活。","以後我們這活著還存留的人必和他們一同被提到雲裡，在空中與主相遇。這樣，我們就要和主永遠同在。","所以，你們當用這些話彼此勸慰。"],"5":["弟兄們，論到時候、日期，不用寫信給你們，","因為你們自己明明曉得，主的日子來到，好像夜間的賊一樣。","人正說「平安穩妥」的時候，災禍忽然臨到他們，如同產難臨到懷胎的婦人一樣，他們絕不能逃脫。","弟兄們，你們卻不在黑暗裡，叫那日子臨到你們像賊一樣。","你們都是光明之子，都是白晝之子。我們不是屬黑夜的，也不是屬幽暗的。","所以，我們不要睡覺像別人一樣，總要警醒謹守。","因為睡了的人是在夜間睡，醉了的人是在夜間醉。","但我們既然屬乎白晝，就應當謹守，把信和愛當作護心鏡遮胸，把得救的盼望當作頭盔戴上。","因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救。","他替我們死，叫我們無論醒著，睡著，都與他同活。","所以，你們該彼此勸慰，互相建立，正如你們素常所行的。","弟兄們，我們勸你們敬重那在你們中間勞苦的人，就是在主裡面治理你們、勸戒你們的；","又因他們所做的工，用愛心格外尊重他們。你們也要彼此和睦。","我們又勸弟兄們，要警戒不守規矩的人，勉勵灰心的人，扶助軟弱的人，也要向眾人忍耐。","你們要謹慎，無論是誰都不可以惡報惡；或是彼此相待，或是待眾人，常要追求良善。","要常常喜樂，","不住地禱告，","凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。","不要消滅聖靈的感動；","不要藐視先知的講論。","但要凡事察驗；善美的要持守，","各樣的惡事要禁戒不做。","願賜平安的神親自使你們全然成聖！又願你們的靈與魂與身子得蒙保守，在我們主耶穌基督降臨的時候，完全無可指摘！","那召你們的本是信實的，他必成就這事。","請弟兄們為我們禱告。","與眾弟兄親嘴問安，務要聖潔。","我指著主囑咐你們，要把這信念給眾弟兄聽。","願我主耶穌基督的恩常與你們同在！"]},"blk":{"1":[{"a":1,"z":1,"star":1,"grk":"<p lang=\"grc\">Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη<\/p>","lit":"<p>保羅和西拉和提摩太，給帖撒羅尼迦人的教會，在父神和主耶穌基督裡的：恩典給你們，和平安。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Σιλουανὸς<\/td><td>Silouanos<\/td><td>西拉（羅馬名）<\/td><td>徒 15--17 的西拉，與保羅同坐腓立比的監<\/td><\/tr><tr><td>Τιμόθεος<\/td><td>Timotheos<\/td><td>提摩太<\/td><td>3:2 被打發回去堅固他們的那一位<\/td><\/tr><tr><td>τῇ ἐκκλησίᾳ Θεσσαλονικέων<\/td><td>tē ekklēsia Thessalonikeōn<\/td><td>給帖撒羅尼迦人的教會<\/td><td>教會以「人」稱，不以城稱<\/td><\/tr><tr><td>ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ<\/td><td>en theō patri kai kyriō Iēsou Christō<\/td><td>在父神和主耶穌基督裡<\/td><td>一個 ἐν 管父與子兩位<\/td><\/tr><tr><td>χάρις ὑμῖν καὶ εἰρήνη<\/td><td>charis hymin kai eirēnē<\/td><td>恩典和平安給你們<\/td><td>希臘問候與希伯來問候合在一起<\/td><\/tr><\/table>","gram":"<p><strong>1:1 是保羅書信裡最短的開頭。<\/strong>Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος（Paulos kai Silouanos kai Timotheos）——三個名字平排，用兩個 καί（kai） 串起來，保羅沒有給自己加任何頭銜。到 2:6 才出現 ἀπόστολοι（apostoloi），而且是複數，連同伴一起算。對照加拉太書一開口就強調自己的使徒身分，這裡的低調很醒目：寫給一間信主才幾個月的教會，他先站在弟兄的位置上。<\/p><p>收信人寫成 τῇ ἐκκλησίᾳ Θεσσαλονικέων（tē ekklēsia Thessalonikeōn），「帖撒羅尼迦人的教會」，教會是一群人，不是一棟建築，也不是一座城。接著 ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ（en theō patri kai kyriō Iēsou Christō）：一個介詞 ἐν（en） 同時管「父神」與「主耶穌基督」，兩個名詞都沒有冠詞，緊緊並排。在很可能是新約最早寫成的這一卷裡，耶穌已經和父並列為教會所在的「地方」。<\/p><blockquote><p>χάρις ὑμῖν καὶ εἰρήνη（charis hymin kai eirēnē）：希臘信的問候是 χαίρειν（chairein），保羅把它換成同音近形的 χάρις（charis）；再接上希伯來人的平安。本卷的問候沒有後來書信常見的「從神我們的父……」，是最原始、最短的形式。<\/p><\/blockquote>","exp":"<p>〔背景〕徒 17:1--10（使徒行傳講義第 17 章）<\/p><p>帖撒羅尼迦人遇到甚麼？本系列使徒行傳講義第 17 章講過這間教會怎樣誕生：保羅在會堂「一連三個安息日」（徒 17:2）講解聖經，有人信了，接著猶太會堂的一些人鼓動暴民，闖進耶孫的家；最後「弟兄們隨即在夜間打發保羅和西拉往庇哩亞去」（徒 17:10）。創辦人走了，留下的是一群剛剛轉身的人，和一個被鄉親盯上的家。這封信就寫給這樣一間嬰孩教會。<\/p><p>所以 1:1 的三個名字很要緊。新約裡很可能最早的一封信，是一個團隊寫的：保羅、西拉、提摩太。西拉是跟保羅在腓立比被打、半夜唱詩的那一位；提摩太年輕，後來被差回去堅固他們。321 說 235，一個人帶兩個人，兩個人再帶五個人——在這裡，帶頭的人自己身邊就有兩個人。<strong>一間教會從一開始，就不是一個明星的作品。<\/strong><\/p><p>「在父神和主耶穌基督裡的教會」（1:1）。帖撒羅尼迦城很大，教會很小，被人逼迫，可是保羅先告訴他們：你們住在哪裡。你們的地址不只是帖撒羅尼迦，你們在父神和主耶穌基督裡面。一個被家人趕出門的新信徒，讀到這一句，就知道自己不是無家可歸。<\/p>"},{"a":2,"z":3,"star":3,"grk":"<p lang=\"grc\">Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως<\/p><p lang=\"grc\">μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,<\/p>","lit":"<p>我們感謝神，總是為你們眾人，在我們的禱告上作出提名，不住地，<\/p><p>記念著你們信心的工作、愛的勞苦、和我們主耶穌基督之盼望的忍耐，在神、就是我們父的面前；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Εὐχαριστοῦμεν<\/td><td>Eucharistoumen<\/td><td>我們感謝<\/td><td>1:2--7 長句的主幹動詞<\/td><\/tr><tr><td>μνείαν ποιούμενοι<\/td><td>mneian poioumenoi<\/td><td>作出提名<\/td><td>分詞一：禱告時一個一個點名<\/td><\/tr><tr><td>ἀδιαλείπτως<\/td><td>adialeiptōs<\/td><td>不間斷地<\/td><td>不是不停口，是不斷線<\/td><\/tr><tr><td>μνημονεύοντες<\/td><td>mnēmoneuontes<\/td><td>記念著<\/td><td>分詞二：把人放在記憶裡<\/td><\/tr><tr><td>τοῦ ἔργου τῆς πίστεως<\/td><td>tou ergou tēs pisteōs<\/td><td>信心的工作<\/td><td>信心長出手來<\/td><\/tr><tr><td>τοῦ κόπου τῆς ἀγάπης<\/td><td>tou kopou tēs agapēs<\/td><td>愛的勞苦<\/td><td>κόπος：做到筋疲力盡<\/td><\/tr><tr><td>τῆς ὑπομονῆς τῆς ἐλπίδος<\/td><td>tēs hypomonēs tēs elpidos<\/td><td>盼望的忍耐<\/td><td>ὑπομονή：在重擔底下留下來<\/td><\/tr><\/table>","gram":"<p><strong>1:2--7 在原文是一條長句<\/strong>，SBLGNT 到 1:7 末才下句號。骨架是這樣的：<\/p><blockquote><p>主幹：Εὐχαριστοῦμεν τῷ θεῷ πάντοτε（我們常常感謝神）<br>　分詞一：μνείαν ποιούμενοι（禱告時提到你們）<br>　分詞二：μνημονεύοντες（記念你們信、愛、望的工作）<br>　分詞三：εἰδότες（1:4，知道你們蒙揀選）——再由 1:5 的 ὅτι（hoti） 與 1:6--7 推出理由與結果<\/p><\/blockquote><p>三個分詞都掛在「感謝」底下：提名、記念、知道，是感謝的三個動作。ἀδιαλείπτως（adialeiptōs） 放在 1:2 末，可以往前修飾「提到」，也可以往後修飾「記念」，和合本放到 1:3「不住地記念」，兩種讀法意思相去不遠。<\/p><p>1:3 是三組平行的屬格片語：τοῦ ἔργου τῆς πίστεως（tou ergou tēs pisteōs）、τοῦ κόπου τῆς ἀγάπης（tou kopou tēs agapēs）、τῆς ὑπομονῆς τῆς ἐλπίδος（tēs hypomonēs tēs elpidos）。每一組都是「行動＋源頭」：信心生出工作，愛生出勞苦，盼望生出忍耐。這很可能是新約第一次把信、愛、望排在一起，5:8 會以「信和愛當作護心鏡，得救的盼望當作頭盔」收回來，首尾呼應。第三組最長，盼望的對象點名是「我們主耶穌基督」——全卷的盼望不是一種心情，是一位要回來的人。ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν（emprosthen tou theou kai patros hēmōn） 收尾：這些工作是在父面前被記住的。<\/p>","exp":"<p>〔腓〕腓 1:3--5（腓立比書講義第 1 章）<\/p><p>保羅從福音推出的第一個原則，不是一條命令，是一聲感謝。腓立比書講義第 1 章讀過他對另一間馬其頓教會說：「我每逢想念你們，就感謝我的神」（腓 1:3），因為他們「從頭一天直到如今」（腓 1:5）與他同工。對帖撒羅尼迦人，保羅還說不出「好多年」，這間教會只有三個安息日大。可是他照樣感謝，而且是一個一個點名地感謝。<\/p><p>他記得甚麼？不是他們懂了多少教義，是三樣看得見的東西：「因信心所做的工夫，因愛心所受的勞苦，因盼望我們主耶穌基督所存的忍耐」（1:3）。信心不是只在心裡點頭，它有手，會做工；愛不是一種感覺，κόπος（kopos） 是做到腰痠背痛、晚上倒頭就睡的那種累；盼望也不是樂觀，ὑπομονή（hypomonē） 是重擔壓在肩上，人卻沒有走開。<strong>信心有手，愛心會累，盼望站得住。<\/strong><\/p><p>這三樣是一個家的三根柱子。一個剛信主的媽媽，信心表現在她開始為全家禱告；愛心表現在她煮完晚飯還去看生病的姊妹；盼望表現在先生罵她信洋教的時候，她沒有離開，也沒有回罵。保羅看得見這些，神也看得見——「在神－我們的父面前」（1:3），這些沒人鼓掌的勞苦，在父面前都有記錄。<\/p><p>這也給今天帶門徒的人一個次序：先感謝，再教導。保羅在第 4、5 章有很多要糾正的話，但他先花了三章感謝和回憶。321 說屬靈父母兒女，屬靈的父母第一個功課，不是挑毛病，是看見孩子已經在做的工、已經受的累。<\/p>"},{"a":4,"z":5,"star":2,"grk":"<p lang=\"grc\">εἰδότες, ἀδελφοὶ ἠγαπημένοι ὑπὸ θεοῦ τὴν ἐκλογὴν ὑμῶν,<\/p><p lang=\"grc\">ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ἐν ὑμῖν διʼ ὑμᾶς·<\/p>","lit":"<p>知道著，被神所愛的弟兄們，你們的揀選，<\/p><p>因為我們的福音臨到你們，不是只在話語裡，而是也在能力裡，也在聖靈裡，也在許多的充足確信裡，正如你們知道，我們在你們中間，為了你們的緣故，成了怎樣的人；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>εἰδότες<\/td><td>eidotes<\/td><td>知道著<\/td><td>分詞三：保羅的確信<\/td><\/tr><tr><td>ἀδελφοὶ ἠγαπημένοι ὑπὸ θεοῦ<\/td><td>adelphoi ēgapēmenoi hypo theou<\/td><td>被神所愛的弟兄們<\/td><td>完成式被動：被愛，而且一直被愛<\/td><\/tr><tr><td>τὴν ἐκλογὴν ὑμῶν<\/td><td>tēn eklogēn hymōn<\/td><td>你們的揀選<\/td><td>ἐκλογή：保羅用果效來認<\/td><\/tr><tr><td>ὅτι<\/td><td>hoti<\/td><td>因為<\/td><td>1:5 給出「知道」的根據<\/td><\/tr><tr><td>ἐν λόγῳ μόνον<\/td><td>en logō monon<\/td><td>只在話語裡<\/td><td>不是不要話語，是不只話語<\/td><\/tr><tr><td>πληροφορίᾳ πολλῇ<\/td><td>plērophoria pollē<\/td><td>許多的充足確信<\/td><td>像滿載的船<\/td><\/tr><tr><td>οἷοι ἐγενήθημεν<\/td><td>hoioi egenēthēmen<\/td><td>我們成了怎樣的人<\/td><td>福音帶著傳福音者的生命<\/td><\/tr><\/table>","gram":"<p><strong>1:4 的「弟兄們」是全卷十四次稱呼「弟兄們」的第一次。<\/strong>ἀδελφοὶ ἠγαπημένοι ὑπὸ θεοῦ（adelphoi ēgapēmenoi hypo theou）：ἠγαπημένοι（ēgapēmenoi） 是完成式被動分詞，被愛的動作已經發生，結果一直存留。這個片語在七十士譯本常用來稱呼以色列，保羅把它用在一群剛離棄偶像的外邦人身上。<\/p><p>εἰδότες（eidotes）……τὴν ἐκλογὴν ὑμῶν（tēn eklogēn hymōn），接著 1:5 用 ὅτι（hoti） 交代：保羅怎麼「知道」？不是看名冊，是看果效。ὅτι（hoti） 可以讀成「就是」（說明揀選的內容），也可以讀成「因為」（說明知道的根據）；和合本取「因為」，本講義從之，因為 1:5--10 列出來的全是看得見的證據。<\/p><p>1:5 的結構是 οὐκ（ouk）……ἐν λόγῳ μόνον ἀλλὰ καὶ（en logō monon alla kai）……：「不只……而是也……」。三個 ἐν（en） 片語接在後面——權能、聖靈、充足的確信。πληροφορίᾳ πολλῇ（plērophoria pollē） 的 πληροφορία（plērophoria） 由「滿」與「承載」合成，有人想到滿帆的船。末了 οἷοι ἐγενήθημεν ἐν ὑμῖν διʼ ὑμᾶς（hoioi egenēthēmen en hymin di' hymas）：ἐγενήθη（福音「成了」）與 ἐγενήθημεν（我們「成了」）同一個動詞，信息怎樣來到，信使就怎樣活。<\/p>","exp":"<p>「被神所愛的弟兄啊，我知道你們是蒙揀選的」（1:4）。揀選這個詞，在華人教會常常引起焦慮：我怎麼知道我是不是被揀選的？保羅的路徑剛好相反。他不是先打開一本秘密的名冊，再決定要不要愛這群人；他是看見神在他們身上做的事，就認出神的揀選。<strong>揀選不是讓人睡不著的謎題，是回頭看時認出來的恩典。<\/strong><\/p><p>他看見甚麼？「因為我們的福音傳到你們那裡，不獨在乎言語，也在乎權能和聖靈，並充足的信心」（1:5）。這裡不是說話語不重要，保羅在會堂講了三個安息日的聖經。他說的是：話語之外，還有神親自做的工——人心被打開、生命被翻轉、在逼迫裡還站得住。權能不一定是神蹟奇事，一個拜了四十年偶像的人肯把神像請出門，就是權能。<\/p><p>最後一句常被略過：「正如你們知道，我們在你們那裡，為你們的緣故是怎樣為人」（1:5）。福音不是一封掛號信，送到就好。它帶著送信人的體溫。保羅在第 2 章會詳細回憶他們怎樣晝夜做工、像母親乳養孩子。今天傳福音也一樣，人先讀到的往往不是我們的講章，是我們怎樣待人。<strong>信息怎樣來，信使就怎樣活。<\/strong><\/p>"},{"a":6,"z":7,"star":2,"grk":"<p lang=\"grc\">καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,<\/p><p lang=\"grc\">ὥστε γενέσθαι ὑμᾶς τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ἐν τῇ Ἀχαΐᾳ.<\/p>","lit":"<p>而你們成了我們和主的效法者，在許多的患難中，帶著聖靈的喜樂，接受了這道，<\/p><p>以致你們成為一個榜樣，給所有在馬其頓和在亞該亞信的人。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>μιμηταὶ<\/td><td>mimētai<\/td><td>效法者、模仿者<\/td><td>英文 mimic 的字根<\/td><\/tr><tr><td>ἐγενήθητε<\/td><td>egenēthēte<\/td><td>你們成了<\/td><td>接續 1:5 的「我們成了」<\/td><\/tr><tr><td>δεξάμενοι τὸν λόγον<\/td><td>dexamenoi ton logon<\/td><td>接受了這道<\/td><td>像接待客人一樣迎進門<\/td><\/tr><tr><td>ἐν θλίψει πολλῇ<\/td><td>en thlipsei pollē<\/td><td>在許多的患難中<\/td><td>θλῖψις：被壓、被擠<\/td><\/tr><tr><td>μετὰ χαρᾶς πνεύματος ἁγίου<\/td><td>meta charas pneumatos hagiou<\/td><td>帶著聖靈的喜樂<\/td><td>與患難同在一節<\/td><\/tr><tr><td>τύπον<\/td><td>typon<\/td><td>榜樣（單數）<\/td><td>印、模子：整間教會是一個印<\/td><\/tr><\/table>","gram":"<p><strong>1:6 的字序值得放慢。<\/strong>καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου（kai hymeis mimētai hēmōn egenēthēte kai tou kyriou）：先說「效法我們」，再補「也效法了主」。保羅不是把自己放在主前面，是照他們實際經歷的次序寫——他們先看見保羅，透過保羅看見主。ἐγενήθητε（egenēthēte） 與 1:5 的 ἐγενήθημεν（egenēthēmen） 對應：我們成了怎樣的人，你們就成了效法者。<\/p><p>δεξάμενοι τὸν λόγον（dexamenoi ton logon） 之後，兩個介詞片語並排：ἐν θλίψει πολλῇ（en thlipsei pollē） 與 μετὰ χαρᾶς πνεύματος ἁγίου（meta charas pneumatos hagiou）。θλῖψις（thlipsis） 原是擠壓葡萄、橄欖的字；χαρά（chara） 卻「帶著」它一起來。兩樣東西在同一節，沒有誰取消誰。<\/p><blockquote><p>1:7 ὥστε γενέσθαι ὑμᾶς τύπον（hōste genesthai hymas typon）：τύπος（typos） 原指打下去留下的印痕、鑄造用的模子。SBLGNT 作單數 τύπον（typon），有些抄本作複數 τύπους（typous）；單數的讀法較有抄本支持，意思是整間教會一起成了一個樣式，不是幾個明星信徒。傳遞鏈在這裡畫完整了：主 → 我們 → 你們 → πᾶσιν τοῖς πιστεύουσιν（馬其頓和亞該亞所有信的人）。<\/p><\/blockquote>","exp":"<p>〔背景〕徒 17:5--9（使徒行傳講義第 17 章）<\/p><p>「並且你們在大難之中，蒙了聖靈所賜的喜樂，領受真道就效法我們，也效法了主」（1:6）。帖撒羅尼迦人的大難不是比喻：耶孫的家被闖，人被拖到地方官面前，還要交保。第 2 章會說，逼迫他們的是「本地人」——鄰居、親戚、同業。<\/p><p>這一節把大難和喜樂放在一起，最容易被讀歪。它不是說受苦的人應該假裝沒事，也不是說喜樂的人就不會痛。<strong>聖靈的喜樂不是止痛藥，是在痛裡多了一位同在的。<\/strong>一個人可以一邊流淚，一邊知道自己沒有被丟下。保羅也不是叫人去找苦吃，更不是叫人留在家暴或虐待的處境裡證明自己屬靈；他說的是為福音的緣故被反對時，神沒有缺席。<\/p><p>然後是 1:7：「甚至你們作了馬其頓和亞該亞所有信主之人的榜樣」（1:7）。τύπος（typos） 是印。被蓋了印的人，自己也成了印。這間嬰孩教會沒有會堂、沒有長老、創辦人被趕走，卻成了兩個省份的樣式。原因不是他們做得多漂亮，是他們在苦裡仍然喜樂，人看得見。今天一位因信主被家裡冷落、卻仍然回家孝順父母的年輕人，就是這樣的印。321 說「耶穌是我的榜樣」，在這裡它成了一條鏈子：從主傳到保羅，從保羅傳到他們，再從他們傳出去。<\/p>"},{"a":8,"z":8,"star":1,"grk":"<p lang=\"grc\">ἀφʼ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ καὶ Ἀχαΐᾳ, ἀλλʼ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ἔχειν ἡμᾶς λαλεῖν τι·<\/p>","lit":"<p>因為從你們那裡，主的道已經響出去，不只在馬其頓和亞該亞，而是在每一個地方，你們那向著神的信心已經出去了，以致我們沒有需要說甚麼；<\/p>","key":"","gram":"<p><strong>1:8 用 γὰρ（gar） 接上前一節<\/strong>，說明他們怎麼成了榜樣。主動詞 ἐξήχηται（exēchētai） 是全本新約只出現這一次的字，字根是「聲音」，指鐘聲、號聲、雷聲向四面響開。它是完成式：已經響出去了，回聲現在還在。<\/p><p>主詞有兩個：前半是 ὁ λόγος τοῦ κυρίου（主的道），後半換成 ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν（你們向神的信心），動詞也換成 ἐξελήλυθεν（已經出去了），兩個都是完成式。神的道與他們的信心，從同一個地方傳出去。句子在 οὐ μόνον（ou monon）……ἀλλʼ（all'） 之後擴張到 ἐν παντὶ τόπῳ（en panti topō），文法有點不平順，像一個人說得太興奮，句子收不攏。<\/p>","exp":"<p>「因為主的道從你們那裡已經傳揚出來」（1:8）。帖撒羅尼迦在羅馬大道旁邊，是一座港口，商人、軍人、旅客來來去去。這間教會沒有差派宣教士，他們只是活出來，消息就隨著往來的人響到各處。像山谷裡敲了一口鐘，敲的人沒有動，聲音卻走遍了。<\/p><p>保羅甚至說：「所以不用我們說甚麼話」（1:8）。他到了別處，人家先告訴他帖撒羅尼迦發生了甚麼事。這是 321 八大步驟裡「繁殖」最自然的樣子：不是辦活動，是生命被看見之後自己傳開。<strong>主的道借他們的生命發聲。<\/strong>今天一個家裡的人，最先聽到的福音，往往不是一篇講道，是一個人變了。<\/p><p>這一節也很安慰小教會。帖撒羅尼迦教會人不多、時間不長，卻被神用來讓福音傳開。影響力不是看人數、看規模，是看那口鐘有沒有被敲響。<\/p>"},{"a":9,"z":9,"star":2,"grk":"<p lang=\"grc\">αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,<\/p>","lit":"<p>因為他們自己論到我們正在報告，我們有了怎樣的進入到你們那裡，以及你們怎樣從偶像轉向神，來服事一位活的、真實的神，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀπαγγέλλουσιν<\/td><td>apangellousin<\/td><td>他們正在報告<\/td><td>現在式：別人還在講<\/td><\/tr><tr><td>ὁποίαν εἴσοδον ἔσχομεν<\/td><td>hopoian eisodon eschomen<\/td><td>我們有了怎樣的進入<\/td><td>保羅進城的方式<\/td><\/tr><tr><td>ἐπεστρέψατε<\/td><td>epestrepsate<\/td><td>你們轉向了<\/td><td>篇名「歸」：一次決定性的轉身<\/td><\/tr><tr><td>ἀπὸ τῶν εἰδώλων<\/td><td>apo tōn eidōlōn<\/td><td>從偶像<\/td><td>收信人多是外邦人<\/td><\/tr><tr><td>δουλεύειν<\/td><td>douleuein<\/td><td>去服事（作奴僕）<\/td><td>轉身的目的<\/td><\/tr><tr><td>θεῷ ζῶντι καὶ ἀληθινῷ<\/td><td>theō zōnti kai alēthinō<\/td><td>活的、真實的神<\/td><td>對照不會動的偶像<\/td><\/tr><\/table>","gram":"<p><strong>1:9 的主詞換人了。<\/strong>αὐτοὶ γὰρ（autoi gar）……ἀπαγγέλλουσιν（apangellousin）——「他們自己」指馬其頓、亞該亞各處的人，現在式，消息還在傳。他們傳兩件事，用兩個疑問詞帶出：ὁποίαν εἴσοδον ἔσχομεν（我們怎樣進到你們那裡），以及 πῶς ἐπεστρέψατε（你們怎樣轉向）。前者是保羅那一邊，後者是帖撒羅尼迦人這一邊，第 2 章會把前者展開。<\/p><p>ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων（epestrepsate pros ton theon apo tōn eidōlōn）：不定過去式，一次決定性的轉身。注意字序，「向神」在前，「離開偶像」在後——他們不是先把偶像清掉，再慢慢找神；是先看見了神，偶像就留不住了。接著用不定詞 δουλεύειν（douleuein） 說出轉身的目的：服事 θεῷ ζῶντι καὶ ἀληθινῷ（theō zōnti kai alēthinō）。兩個形容詞都沒有冠詞，強調性質：活的，對照木石；真的，對照虛假。<\/p>","exp":"<p>〔背景〕徒 17:4（使徒行傳講義第 17 章）<\/p><p>使徒行傳記載在帖撒羅尼迦信主的，「並有許多虔敬的希臘人，尊貴的婦女也不少」（徒 17:4）。1:9 告訴我們，教會的大多數是外邦人，他們原本家裡有神龕、街上有廟、行會吃祭偶像的飯。「你們是怎樣離棄偶像，歸向神」（1:9），這不是換一個宗教習慣，是整個生活重新排過。<\/p><p>這就是本章的「歸」，全卷成長的第一步：出生。信主是一個轉身。轉身有方向：先面向神，背後的偶像自然離開。<strong>不是先把家裡清乾淨才能來，是看見了神，手裡的東西就放下了。<\/strong>轉身也有目的：「要服事那又真又活的神」（1:9）。信主不是只是不拜了，而是開始服事一位活的、會說話、會回應的神。<\/p><p>今天華人的轉身，常常就發生在家裡的神明桌和祖先牌位前。這裡要分清楚兩件事：不再拜偶像，是轉身；記念祖先、孝敬父母，卻是神所喜悅的。剛信主的人不必用摔神像、和家人翻臉來證明自己；轉身歸向神，同時用更溫柔、更孝順的生命面對家人，那才是活神在家裡的見證。帖撒羅尼迦人的鄰居看見的，就是這樣一個轉身。<\/p>"},{"a":10,"z":10,"star":3,"grk":"<p lang=\"grc\">καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ἐκ τῆς ὀργῆς τῆς ἐρχομένης.<\/p>","lit":"<p>並且等候他的兒子從諸天而來，就是他從死人中所叫起來的，耶穌，那位正在救我們脫離那將要來的忿怒的。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀναμένειν<\/td><td>anamenein<\/td><td>等候<\/td><td>全本新約只此一次<\/td><\/tr><tr><td>τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν<\/td><td>ton huion autou ek tōn ouranōn<\/td><td>他的兒子從諸天<\/td><td>追蹤二起點：主的來臨<\/td><\/tr><tr><td>ὃν ἤγειρεν ἐκ τῶν νεκρῶν<\/td><td>hon ēgeiren ek tōn nekrōn<\/td><td>神從死人中叫起來的<\/td><td>等候的根據<\/td><\/tr><tr><td>τὸν ῥυόμενον ἡμᾶς<\/td><td>ton rhyomenon hēmas<\/td><td>那正在救我們的<\/td><td>現在分詞：救的動作在進行<\/td><\/tr><tr><td>ἐκ τῆς ὀργῆς τῆς ἐρχομένης<\/td><td>ek tēs orgēs tēs erchomenēs<\/td><td>脫離那將要來的忿怒<\/td><td>忿怒是將來的，救已經開始<\/td><\/tr><\/table>","gram":"<p><strong>1:10 用第二個不定詞收住 1:9。<\/strong>δουλεύειν（douleuein） 之後接 καὶ ἀναμένειν（kai anamenein）：轉身的目的有兩面，一面是服事，一面是等候。ἀναμένειν（anamenein） 是全本新約只出現這一次的字，ἀνά（ana） 有「向上、持續」的意味：抬頭望著、一直等著。等的不是一件事，是一個人：τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν（ton huion autou ek tōn ouranōn）。<\/p><p>這一節是新約裡很早的信仰摘要，一口氣說出耶穌的四件事：他是神的兒子、他在天上、神叫他從死裡復活（ὃν ἤγειρεν ἐκ τῶν νεκρῶν（hon ēgeiren ek tōn nekrōn），不定過去式，一次完成的事實）、他要回來。最後落在一個現在分詞 τὸν ῥυόμενον ἡμᾶς（ton rhyomenon hēmas）——不是「將要救」，是「正在救」。對照 ἐκ τῆς ὀργῆς τῆς ἐρχομένης（ek tēs orgēs tēs erchomenēs） 的 ἐρχομένης（erchomenēs） 也是現在分詞，「正在來的忿怒」：兩個動作都在進行，但耶穌那一個已經先到。<\/p><blockquote><p>本卷五章都以主的來臨收尾：1:10；2:19；3:13；4:13--18；5:23。παρουσία（parousia） 要到 2:19 才第一次出現，但第 1 章已經用「等候……從天」把這條線拉起來了。5:9 會把它說完：神不是預定我們受刑。<\/p><\/blockquote>","exp":"<p>「等候他兒子從天降臨」（1:10）。帖撒羅尼迦人信主的時候，學到的第一課不是一套末世時間表，是「等候」。保羅在這裡沒有給日期，到第 5 章也明說「論到時候、日期……不用寫信給你們」（5:1）。等候不是算日子，是一種活法：轉身離開偶像以後，臉朝著一個方向，盼望一個人。這是全卷的種子，也是本章地勢的山峰。<\/p><p>等候的根據在中間那一句：「就是他從死裡復活的」（1:10）。我們等的不是一個傳說，是一位已經從墳墓走出來的人。神既然叫他從死裡復活，就一定會叫他回來。這也是第 4 章安慰的根：已經睡了的親人，和那位復活的主連在一起。<\/p><p>「那位救我們脫離將來忿怒的耶穌」（1:10）。有人問：慈愛的神為甚麼有忿怒？聖經裡神的忿怒不是情緒失控，是神對罪與不義認真的反應——一位對惡毫不在意的神，也不可能真的愛受害的人。但這一節的重點不在忿怒，在拯救：ῥυόμενον（rhyomenon） 是現在分詞，耶穌現在就在救。保羅後來在羅馬書說，我們「藉著他免去神的忿怒」（羅 5:9）；本卷第 5 章更直接：「因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救」（5:9）。<\/p><p>所以讀完 1:10，人應該更想念主來，而不是更害怕主來。用將來的忿怒嚇唬人信主，不是這一節的用法；這一節給嬰孩教會的，是一個應許：<strong>你們等候的那一位，就是救你們的那一位。<\/strong>一個被鄉親逼迫、被家人誤會的新信徒，可以抬起頭來等，因為他等的人在天上，而且正在救他。<\/p>"}],"2":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,<\/p><p lang=\"grc\">ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.<\/p>","lit":"<p>因為你們自己知道，弟兄們，我們進到你們那裡的這一趟，並不是成了空的；<\/p><p>反而，我們先前受了苦、又被凌辱，如你們所知道的，在腓立比；我們卻在我們的神裡放開膽量，向你們講說神的福音，在許多的爭戰中。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τὴν εἴσοδον ἡμῶν<\/td><td>tēn eisodon hēmōn<\/td><td>我們的進入<\/td><td>接回 1:9 外人傳說的那一趟<\/td><\/tr><tr><td>οὐ κενὴ γέγονεν<\/td><td>ou kenē gegonen<\/td><td>沒有成了空的<\/td><td>完成式：果效到今天還在<\/td><\/tr><tr><td>προπαθόντες<\/td><td>propathontes<\/td><td>先前受了苦<\/td><td>字首：在來你們這裡以前<\/td><\/tr><tr><td>ὑβρισθέντες<\/td><td>hybristhentes<\/td><td>被凌辱<\/td><td>ὕβρις：公開羞辱人的尊嚴<\/td><\/tr><tr><td>ἐπαρρησιασάμεθα<\/td><td>eparrēsiasametha<\/td><td>我們放開膽量<\/td><td>公開、坦然地講<\/td><\/tr><tr><td>ἐν τῷ θεῷ ἡμῶν<\/td><td>en tō theō hēmōn<\/td><td>在我們的神裡<\/td><td>膽量的出處<\/td><\/tr><tr><td>ἐν πολλῷ ἀγῶνι<\/td><td>en pollō agōni<\/td><td>在許多的爭戰中<\/td><td>競技場的字<\/td><\/tr><\/table>","gram":"<p><strong>2:1 用 γάρ（gar） 接回 1:9。<\/strong>第 1 章末了，是馬其頓和亞該亞的人在傳說「我們是怎樣進到你們那裡」（1:9）；2:1 保羅把同一個字 τὴν εἴσοδον ἡμῶν（tēn eisodon hēmōn） 撿起來：外人在傳，你們自己更知道。Αὐτοὶ（Autoi） 放在句首，語氣是「你們自己就是證人」。<\/p><p>οὐ κενὴ γέγονεν（ou kenē gegonen） 用完成式。κενός（kenos） 是空的、空手的、沒有內容也沒有結果的；完成式說的是那一趟留下來的東西到今天還在。保羅被趕走了，教會卻沒有散，這就是「不是空的」最好的證據。<\/p><p>2:2 以 ἀλλά（alla） 轉折，兩個不定過去分詞並排：προπαθόντες（propathontes） 的字首是「在這以前」，ὑβρισθέντες（hybristhentes） 出自 ὕβρις（hybris），指公開踐踏一個人的尊嚴——在腓立比，保羅是被剝了衣裳、當眾用棍打的羅馬公民。主要動詞 ἐπαρρησιασάμεθα（eparrēsiasametha） 是「放開膽量」，原是公民在議會裡自由發言的權利；但保羅加上 ἐν τῷ θεῷ ἡμῶν（en tō theō hēmōn）：膽量不出於性格，出於神。ἐν πολλῷ ἀγῶνι（en pollō agōni） 的 ἀγών（agōn） 是競技場、摔角場的字，腓 1:30 的「爭戰」也用它。<\/p>","exp":"<p>〔背景〕徒 16:19--40（使徒行傳講義第 16 章）<\/p><p>帖撒羅尼迦人遇到甚麼？創辦人才來三個安息日就被連夜送走，城裡開始有人說閒話：那個人說得好聽，一出事就跑了。第 2 章前半是保羅的回應。他沒有寄一份履歷，只說了一句：「弟兄們，你們自己原曉得我們進到你們那裡並不是徒然的」（2:1）。證據不在保羅身上，在讀信的人身上——你們還在，你們還信，這就是證明。<\/p><p>接著他輕輕提了一句腓立比：「我們從前在腓立比被害受辱，這是你們知道的」（2:2）。本系列使徒行傳講義第 16 章講過那一夜：「官長吩咐剝了他們的衣裳，用棍打」（徒 16:22），然後下監、腳上了木狗。保羅沒有描寫背上的傷，只用兩個字帶過：被害、受辱。<strong>一個講自己傷口講太多的人，會把聽眾的眼睛留在自己身上。<\/strong>保羅把傷口折成兩個字，把篇幅留給福音。<\/p><p>傷還沒好，他就到了下一座城，「然而還是靠我們的神放開膽量，在大爭戰中把神的福音傳給你們」（2:2）。膽量不是不怕，是怕了還開口；而且是「靠我們的神」，不是靠自己的硬。今天剛被家人罵、剛在職場因信仰吃了虧的弟兄姊妹，讀到這裡會知道：受辱不等於失敗，被趕走也不等於白來。神的工作常常就在大爭戰中開始。<\/p>"},{"a":3,"z":4,"star":2,"grk":"<p lang=\"grc\">ἡ γὰρ παράκλησις ἡμῶν οὐκ ἐκ πλάνης οὐδὲ ἐξ ἀκαθαρσίας οὐδὲ ἐν δόλῳ,<\/p><p lang=\"grc\">ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.<\/p>","lit":"<p>因為我們的勸勉不是出於迷誤，也不是出於不潔，也不是在詭詐裡，<\/p><p>反而，正如我們已被神驗中，得以被託付福音，我們就照樣講說，不是像討人喜歡的，而是討那察驗我們心的神喜歡。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἡ γὰρ παράκλησις ἡμῶν<\/td><td>hē gar paraklēsis hēmōn<\/td><td>因為我們的勸勉<\/td><td>παράκλησις 追蹤在本章第一站<\/td><\/tr><tr><td>οὐκ ἐκ πλάνης<\/td><td>ouk ek planēs<\/td><td>不是出於迷誤<\/td><td>源頭<\/td><\/tr><tr><td>οὐδὲ ἐξ ἀκαθαρσίας<\/td><td>oude ex akatharsias<\/td><td>也不是出於不潔<\/td><td>動機<\/td><\/tr><tr><td>οὐδὲ ἐν δόλῳ<\/td><td>oude en dolō<\/td><td>也不是在詭詐裡<\/td><td>手段：δόλος 原指魚餌<\/td><\/tr><tr><td>δεδοκιμάσμεθα<\/td><td>dedokimasmetha<\/td><td>我們已被驗中<\/td><td>完成式被動：驗過、合格<\/td><\/tr><tr><td>πιστευθῆναι τὸ εὐαγγέλιον<\/td><td>pisteuthēnai to euangelion<\/td><td>被託付福音<\/td><td>福音是寄存在我們手裡的<\/td><\/tr><tr><td>ἀνθρώποις ἀρέσκοντες<\/td><td>anthrōpois areskontes<\/td><td>討人喜歡<\/td><td>ἀρέσκω：迎合<\/td><\/tr><tr><td>τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν<\/td><td>tō dokimazonti tas kardias hēmōn<\/td><td>察驗我們心的<\/td><td>現在分詞：神一直在驗<\/td><\/tr><\/table>","gram":"<p><strong>2:3 是三個否定，2:4 是一個 ἀλλά（alla）。<\/strong>οὐκ ἐκ πλάνης（ouk ek planēs）、οὐδὲ ἐξ ἀκαθαρσίας（oude ex akatharsias）、οὐδὲ ἐν δόλῳ（oude en dolō）

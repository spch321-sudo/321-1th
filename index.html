保守的不是你身上比較屬靈的那一部分，是整個你；而且下一節說，他必成就這事（5:24）。<\/p>"]],"con":[],"say":"本講義的立場：三分說、二分說、整全說並陳，都是弟兄；5:23 的重點是「全然」與「完全」——神要保守整個人，不把「屬魂的」當成標籤或屬靈階級，也尊重倪柝聲弟兄。本講義的全卷立場見議題「聖潔、性與整個人：身體、婚姻與靈魂體」。","care":"會眾席上可能有人長年被說「你太屬魂了」，從此不敢在聚會裡流淚、不敢提問題、懷疑自己的性格是罪；也可能有人從地方教會背景來，聽到批評倪柝聲就覺得自己的屬靈出身被否定。講台上不嘲笑任何一個傳統，不用「屬魂」形容任何一個人。會後若有人說出被貼標籤的傷，先肯定他的情感與思考也是神所造、神所保守的。"},{"id":"ISS05_8","t":"5:3「平安穩妥」——世界和平與末世：基督徒該怎樣看新聞？","r":"5:3；耶6:14；太24:6；太5:9","ch":[5],"why":"每當某國簽下和平協議、某地停火，就有人轉傳「5:3 應驗了」；也有人因此認為基督徒不必關心和平、不必關心政治，反正世界要毀滅。新聞每天都在進來，信徒每天都在轉傳。5:3 該怎樣讀，直接影響一個人是帶著恐慌還是帶著禱告看世界。","pos":[["【一】經文問的是甚麼","","<p>「人正說『平安穩妥』的時候，災禍忽然臨到他們，如同產難臨到懷胎的婦人一樣，他們絕不能逃脫。」（5:3）原文 <strong>Εἰρήνη καὶ ἀσφάλεια<\/strong>（Eirēnē kai asphaleia）很可能呼應羅馬帝國的宣傳口號 pax et securitas；也使我們想起耶利米時代的假先知：「平安了！平安了！其實沒有平安」（耶 6:14）。問題是：5:3 是一則預告某一個和平協議的預言嗎？基督徒該怎樣面對今天的新聞與和平？<\/p>"],["預言新聞說（把時事當成預言應驗的清單）","","<p>認為末世前會有一個假的和平局面，所以當某一份國際和平協議出現時，就是 5:3 正在應驗，主的日子已經非常近了；這一派熱心研讀預言，提醒人不要把盼望放在政治人物身上，這個提醒是對的。<\/p><p><strong>難處：<\/strong>每一代都有人把當時的協議、條約、領袖對號入座，然後落空；這其實是換一種方式在算日子（紅線一）。它也容易把某個國家、某個民族妖魔化，讓信徒帶著興奮而不是憐憫看待戰爭與苦難。<\/p>"],["退避世界說（世界注定毀滅，不必關心和平與公共事務）","","<p>認為既然人造的和平終將崩潰，基督徒就不必投入和平、公義與社會事務，只要傳福音、等候被提；這一派正確地看見人的努力不能帶來最終的救贖。<\/p><p><strong>難處：<\/strong>保羅在同一章說「或是彼此相待，或是待眾人，常要追求良善」（5:15）；主耶穌說「使人和睦的人有福了」（太 5:9）。把 5:3 讀成不必關心世界，會讓教會對受苦的人冷漠，也和 4:11–12 要人在外人面前行事端正的教導相反。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見議題「主再來、被提與末世時間表」，本章不另立說法。<\/strong>5:3 說的「他們」是一切把盼望放在人造平安上的人，這是對所有自以為穩妥者的警告，不是一則替今天某一份協議準備的預告；本講義不把時事對號入座。<\/p><p>基督徒看新聞的方式是：為受苦的人禱告、在自己的位置上追求和平與良善、不把盼望放在任何政權上、也不被恐慌帶走。我們不反對和平；我們只是知道，真正的平安來自那位「賜平安的神」（5:23）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。世界的局勢會起伏，新聞會一天比一天吵，但你的盼望從來不掛在任何一份協議上。你可以關掉一支令人恐慌的影片，打開一個為某地禱告的時間——這不是逃避，這是清醒（5:6）。<\/p>"]],"con":[],"say":"本講義的立場：5:3 是對一切把盼望放在人造平安上的人的警告，不是替某一份協議準備的預告；不把時事對號入座，基督徒為和平禱告、在自己的位置上追求良善。本講義的全卷立場見議題「主再來、被提與末世時間表」。","care":"會眾席上可能有人的家人正住在戰區或衝突地帶，聽到「戰爭是末世應驗、要高興」會非常受傷；也可能有人因為每天追末世新聞而焦慮失眠。講台上不拿任何一場戰爭當作證明，不對受苦的民族說輕佻的話。會後關心有親人在戰區的弟兄姊妹，一起為他們的家人指名禱告；焦慮嚴重的，協助他減少資訊攝取、必要時尋求專業協助。"},{"id":"ISS05_9","t":"5:26「親嘴問安」——聖經的命令，還是當時的文化？","r":"5:26；羅16:16；林前16:20；彼前5:14","ch":[5],"why":"新約四次叫人用「聖潔的親嘴」彼此問安，幾乎沒有華人教會照字面實行，卻很少有人說得出為甚麼可以不照做。這一題看似小，卻是學習「書信三問」最好的練習：哪些是原則、哪些是形式？同時也牽涉身體界線——有人曾因「屬靈的擁抱」受過傷。","pos":[["【一】經文問的是甚麼","","<p>「與眾弟兄親嘴問安，務要聖潔。」（5:26）原文 <strong>ἐν φιλήματι ἁγίῳ<\/strong>（en philēmati hagiō），「用聖潔的親吻」。第一世紀的地中海世界，家人與親近的朋友之間以親吻問安是常見的禮節；保羅把這個禮節放進教會，並加上「聖潔」。類似的吩咐也出現在羅 16:16、林前 16:20、林後 13:12、彼前 5:14。問題是：這是今天所有教會都要照做的命令，還是當時文化中的一個形式？<\/p>"],["照字面持守說（今天仍應實行聖吻）","","<p>認為新約四次明說，又加上「聖潔」二字，這是使徒的命令，不應隨文化改變；早期教會在聖餐前行「平安之吻」，部分東方教會禮儀與一些重洗派、弟兄會傳統至今仍保留。這一派提醒我們：教會是真實的家，彼此的接納要具體，不能只停在口頭上。<\/p><p><strong>難處：<\/strong>在今天許多文化裡，親吻有完全不同的意思，強行實行可能令人不安，甚至造成越界與傷害；若連這個形式都要照做，同一個邏輯也要套到洗腳、蒙頭等其他吩咐上，讀經的原則會變得不一致。<\/p>"],["純文化說（只是古代風俗，與今天無關）","","<p>認為親吻問安是第一世紀的社交習慣，保羅只是順著當時的文化說話，今天不必理會；這一派正確地看見形式會隨文化改變，避免把古代習俗變成今天的律法。<\/p><p><strong>難處：<\/strong>它常常連原則一起丟掉了：保羅要的是一個彼此真誠接納、沒有階級的家——奴隸與主人、猶太人與外邦人都用同一個問安；「務要聖潔」也是一條清楚的界線。只說「那是文化」，教會很容易變成彼此不打招呼的陌生人。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的全卷立場見議題「書信的處境與原則」（書信的處境與原則），身體與聖潔的界線見議題「聖潔、性與整個人：身體、婚姻與靈魂體」。<\/strong>書信三問走一遍：處境是第一世紀家人之間的親吻問安；原則是在主裡真誠、平等、聖潔地彼此接納；今天的落點是握手、擁抱（在對方願意時）、一句叫得出名字的問候，特別是對新來的、孤單的、被忽略的人。<\/p><p>「務要聖潔」本身就是界線：任何問安都要尊重對方的身體與意願；不得藉「屬靈的親密」越界碰觸，也不強迫任何人接受擁抱。原則照守，形式隨處境，判斷的理由要說出來。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你的教會不行聖吻，並沒有違背聖經；但若你的教會裡有人連續三個禮拜沒有人跟他說一句話，那才是真正違背了 5:26。這一節要問你的不是「親不親」，而是：這個家裡，有沒有一個人沒有被問候到？<\/p>"]],"con":[],"say":"本講義的立場：原則照守、形式隨處境——5:26 的原則是在主裡真誠、平等、聖潔地彼此接納，今天落在握手、擁抱與叫得出名字的問候；「務要聖潔」本身就是身體界線。本講義的全卷立場見議題「書信的處境與原則」，身體與聖潔見議題「聖潔、性與整個人：身體、婚姻與靈魂體」。","care":"會眾席上可能有人曾在教會裡被藉著「屬靈的擁抱」越界碰觸，一聽到這一節就不安；也可能有獨居的長輩，已經很久沒有人碰過他的手。講台上不要求任何人做身體接觸，不拿這一節開玩笑。問安的同工要被教導尊重界線；若有人透露過去被侵害的經歷，不追問細節，會後單獨關心，協助他尋求專業與法律協助。"}],"terrain":{"points":[[0.75,78,3,"因信心所做的工夫",null],[1.05,32,6,"在大難之中","bot"],[1.45,90,10,"等候他兒子從天降臨","top"],[1.875,84,8,"連自己的性命也願意給你們",null],[2.325,16,17,"我們暫時與你們離別","bot"],[2.425,88,19,"我們的盼望和喜樂，並所誇的冠冕","top"],[2.846,20,5,"叫我們的勞苦歸於徒然","bot"],[3.077,92,8,"你們若靠主站立得穩，我們就活了","top"],[3.639,74,3,"神的旨意就是要你們成為聖潔",null],[4.194,10,13,"像那些沒有指望的人一樣","bot"],[4.417,98,17,"我們就要和主永遠同在","top"],[4.589,18,3,"災禍忽然臨到他們","bot"],[5.125,86,18,"凡事謝恩",null],[5.339,95,24,"他必成就這事","top"]]},"tracks":[{"gk":"πίστις／ἀγάπη／ἐλπίς","tr":"pistis / agapē / elpis","gl":"信心、愛心、盼望（指望）","code":"G4102","root":"πίστις——信、信心、信實；ἀγάπη——愛、愛心；ἐλπίς——盼望、指望。三個字在 1:3 第一次排在一起（很可能是新約最早的一次，比林前 13:13 早五、六年），在 5:8 再排一次。全卷 8＋5＋4＝17 次。約翰福音講義追過 πιστεύω、ἀγαπάω，哥林多前書講義追過 ἀγάπη；本卷追的是三個字作為一組的發展","ins":"信、愛、望在帖撒羅尼迦前書不是三種美德，是三種勞動。第一站就把三個字排在一起：「因信心所做的工夫，因愛心所受的勞苦，因盼望我們主耶穌基督所存的忍耐」（1:3）——信心會動手，愛心會累，盼望撐得住。接著信心成了新聞：「你們向神的信心……在各處也都傳開了」（1:8）。2:19 是一個翻轉：保羅說他的盼望是甚麼？「我們的盼望和喜樂，並所誇的冠冕是甚麼呢」——答案是一群人。第三章信心進入危險：提摩太被打發去「在你們所信的道上勸慰你們」（3:2），保羅擔心，「要曉得你們的信心如何」（3:5）。好消息回來了：「將你們信心和愛心的好消息報給我們」（3:6）——只報了兩樣，盼望沒有提。保羅「因著你們的信心就得了安慰」（3:7），卻還要「補滿你們信心的不足」（3:10），又禱告「愛眾人的心都能增長，充足」（3:12）。缺的那一樣終於被點名：有人過世了，保羅說不要「像那些沒有指望的人一樣」（4:13）。最後一站，三樣重新到齊，而且穿在身上：「把信和愛當作護心鏡遮胸，把得救的盼望當作頭盔戴上」（5:8）；愛又落回領袖身上：「用愛心格外尊重他們」（5:13）。從三種勞動，到少了一樣的報告，到被點名的缺口，到一整副盔甲——盼望是全卷補上去的那一塊。","stops":[["1:3","因信心所做的工夫，因愛心所受的勞苦，因盼望我們主耶穌基督所存的忍耐","top"],["1:8","你們向神的信心……在各處也都傳開了",""],["2:19","我們的盼望和喜樂，並所誇的冠冕是甚麼呢",""],["3:2","在你們所信的道上勸慰你們",""],["3:5","要曉得你們的信心如何","bot"],["3:6","將你們信心和愛心的好消息報給我們","top"],["3:7","因著你們的信心就得了安慰",""],["3:10","補滿你們信心的不足",""],["3:12","愛眾人的心都能增長，充足",""],["4:13","像那些沒有指望的人一樣","bot"],["5:8","把信和愛當作護心鏡遮胸，把得救的盼望當作頭盔戴上","top"],["5:13","用愛心格外尊重他們",""]]},{"gk":"παρουσία＋降臨字群","tr":"parousia","gl":"來、降臨、從天降臨、相遇、等候","code":"G3952","root":"παρουσία——在場、來到；在希臘羅馬世界常指君王或官長正式駕臨一座城。ἀναμένω——等候（全本新約只此一次）；καταβαίνω——降下；ἀπάντησις——出城迎接。五章每一章都以主的來臨收尾（1:10；2:19；3:13；4:13--18；5:23）","ins":"帖撒羅尼迦前書五章，每一章都停在同一個地方：主要來。第一站是等候：「等候他兒子從天降臨」（1:10）——信主的人轉身離開偶像，然後抬頭等一個人。2:19 主來的時候，保羅想帶著一群人去見他：「豈不是我們主耶穌來的時候」，他們就是他的冠冕。3:13 主來的時候，要被看見的是聖潔：「當我們主耶穌同他眾聖徒來的時候」，心裡堅固，無可責備。第四章是全卷最詳細的一段：「我們這活著還存留到主降臨的人」不會比睡了的人先（4:15）；「主必親自從天降臨」（4:16）——不是派代表，是他自己；「在空中與主相遇」（4:17）——這個字是城裡的人出城迎接來訪的君王。5:2 是翻轉：對等候的家是迎接的同一件事，對昏睡的人是賊——「主的日子來到，好像夜間的賊一樣」。最後一站回到禱告：「在我們主耶穌基督降臨的時候，完全無可指摘」（5:23）。保羅從來不給日期；他給的是一個方向——抬頭、站穩、成聖、彼此勸慰。被提這段經文的用途是安慰，不是恐嚇。","stops":[["1:10","等候他兒子從天降臨","top"],["2:19","豈不是我們主耶穌來的時候",""],["3:13","當我們主耶穌同他眾聖徒來的時候",""],["4:15","我們這活著還存留到主降臨的人",""],["4:16","主必親自從天降臨","top"],["4:17","在空中與主相遇","top"],["5:2","主的日子來到，好像夜間的賊一樣","bot"],["5:23","在我們主耶穌基督降臨的時候，完全無可指摘","top"]]},{"gk":"ἅγιος／ἁγιασμός／ἁγιωσύνη／ἁγιάζω","tr":"hagios / hagiasmos","gl":"聖、聖靈、聖徒、聖潔、成聖","code":"G38","root":"ἅγιος——聖的、分別出來歸神的；ἁγιασμός——成聖、聖潔（過程與狀態）；ἁγιωσύνη——聖潔的品質；ἁγιάζω——使成聖。全卷 5＋3＋1＋1＝10 次","ins":"聖從聖靈開始。福音傳到帖撒羅尼迦，「也在乎權能和聖靈」（1:5），在大難之中他們「蒙了聖靈所賜的喜樂」（1:6）。3:13 聖潔第一次成為禱告：願主使你們「心裡堅固，成為聖潔，無可責備」。4:3 聖潔成為命令，而且是全本新約少數直說「神的旨意」的地方：「神的旨意就是要你們成為聖潔」。聖潔落到身體：「用聖潔、尊貴守著自己的身體」（4:4）——身體是尊貴的，不是骯髒的。聖潔是呼召：「乃是要我們成為聖潔」（4:7）；聖潔有力量：「那賜聖靈給你們的神」（4:8），原文是現在式，神一直在賜。5:23 是翻轉：成聖的主詞換成神——「願賜平安的神親自使你們全然成聖」，下一節說「他必成就這事」。最後一站，聖潔回到一個問候：「與眾弟兄親嘴問安，務要聖潔」（5:26）。聖從聖靈來，成為禱告、命令、身體的事、呼召，最後是神親自做成——聖潔不是靠自己把自己洗乾淨。","stops":[["1:5","也在乎權能和聖靈",""],["1:6","蒙了聖靈所賜的喜樂",""],["3:13","心裡堅固，成為聖潔，無可責備","top"],["4:3","神的旨意就是要你們成為聖潔","top"],["4:4","用聖潔、尊貴守著自己的身體",""],["4:7","乃是要我們成為聖潔",""],["4:8","那賜聖靈給你們的神",""],["5:23","願賜平安的神親自使你們全然成聖","top"],["5:26","與眾弟兄親嘴問安，務要聖潔",""]]},{"gk":"ἀδελφός＋家的意象","tr":"adelphos","gl":"弟兄、乳母（母親）、父親、兒女、離別（成為孤兒）、弟兄相愛","code":"G80","root":"ἀδελφός——弟兄（同一個母腹出來的）；全卷 19 次，89 節，平均不到五節就出現一次。τροφός——乳母、自己餵奶的母親；πατήρ——父親；τέκνον——孩子；ἀπορφανίζω——成為孤兒、被奪去孩子；φιλαδελφία——弟兄相愛","ins":"帖撒羅尼迦前書是一封家書。第一個稱呼就是家人：「被神所愛的弟兄啊」（1:4）。第二章保羅把自己畫成父母：「如同母親乳養自己的孩子」（2:7），「好像父親待自己的兒女一樣」（2:11）。然後家被拆散了：「我們暫時與你們離別」（2:17）——原文是「成了孤兒」，被奪走孩子的父母，也是失去父母的孩子。提摩太被打發回去，他是「我們的兄弟」（3:2）。3:7 是翻轉：「所以，弟兄們」，我們在患難中因著你們的信心得了安慰——孩子反過來安慰了父母。第四章家人也會被欺負：聖潔的反面是「欺負他的弟兄」（4:6），性的罪是越界佔家人的便宜。然後家學會了自己愛：「論到弟兄們相愛」，不用人寫信，是神親自教的（4:9）；家大到一整個省：「你們向馬其頓全地的眾弟兄」（4:10）。保羅再勸「弟兄們」去扶持灰心與軟弱的人（5:14）；最後一站，一個都不能少：「要把這信念給眾弟兄聽」（5:27）。家從一個稱呼，變成母親與父親，被拆散，反過來安慰父母，學會彼此相愛，最後大到每一個人都要被叫來聽信——屬靈父母兒女，長成屬靈同伴。","stops":[["1:4","被神所愛的弟兄啊",""],["2:7","如同母親乳養自己的孩子","top"],["2:11","好像父親待自己的兒女一樣","top"],["2:17","我們暫時與你們離別","bot"],["3:2","打發我們的兄弟",""],["3:7","所以，弟兄們","top"],["4:6","欺負他的弟兄","bot"],["4:9","論到弟兄們相愛","top"],["4:10","你們向馬其頓全地的眾弟兄",""],["5:14","我們又勸弟兄們",""],["5:27","要把這信念給眾弟兄聽","top"]]},{"gk":"παρακαλέω／παράκλησις","tr":"parakaleō / paraklēsis","gl":"勸勉、勸慰、安慰、求","code":"G3870","root":"παρακαλέω——字面是「叫到身邊來」：勸、求、安慰、鼓勵，一個字兼有這幾個意思；παράκλησις 是名詞。全卷 8＋1＝9 次。哥林多後書講義追過名詞 παράκλησις（從神而來、經過受苦的人傳下去）；本卷追的是動詞的方向翻轉","ins":"παρακαλέω 字面是「叫到身邊來」——勸、求、安慰都是這個字。第一站是使徒的勸勉：「我們的勸勉不是出於錯誤」（2:3），沒有詭詐、沒有諂媚。保羅離開以後，打發提摩太去「在你們所信的道上勸慰你們」（3:2）——安慰要有人親自走一趟。3:7 是翻轉：提摩太回來，保羅說「因著你們的信心就得了安慰」——被勸慰的換成使徒，孩子安慰了父母。第四章勸勉成了請求：「我們靠著主耶穌求你們，勸你們」（4:1）；做得好的，還要「更加勉勵」（4:10）。然後勸慰交到每個人手上，而且是在喪禮上：「你們當用這些話彼此勸慰」（4:18）。5:11 變成教會的日常：「你們該彼此勸慰，互相建立」。最後一站勸慰有了對象：「我們又勸弟兄們」去勉勵灰心的人、扶助軟弱的人（5:14）。勸慰從使徒對教會，轉成教會安慰使徒，最後交給所有人「彼此」——安慰不再是牧師的專業，是一家人的習慣。建立屬神的體系，運作的方式就是「彼此」。","stops":[["2:3","我們的勸勉不是出於錯誤",""],["3:2","在你們所信的道上勸慰你們",""],["3:7","因著你們的信心就得了安慰","top"],["4:1","我們靠著主耶穌求你們，勸你們",""],["4:10","但我勸弟兄們要更加勉勵",""],["4:18","你們當用這些話彼此勸慰","top"],["5:11","你們該彼此勸慰，互相建立","top"],["5:14","我們又勸弟兄們",""]]}],"lesson":{"1":{"no":1,"vol":"《321帖撒羅尼迦前書講義》第一課·帖撒羅尼迦前書第一章","title":"被神所愛的弟兄啊——工、印、歸","chars":5238,"min":60,"deep":8,"dchars":1745,"tchars":1377,"blocks":[["h","一、一封信被念出來的那個晚上"],["p","弟兄姊妹平安。一封信從哥林多出發，走了好些天的路，送進帖撒羅尼迦港邊一條巷子裡的一間屋子。屋裡擠著二三十個人，其中有一個做皮革的年輕人。他信主以後，父親站在家門口對他說：你不要再回來了。送信的人把信打開，屋子一下子安靜了。大家心裡其實有點怕。保羅走得那麼急，連一句交代都來不及說；這封信，會不會是一張清單，寫滿他們還不懂的、還做錯的？"],["p","念信的人開口了：「保羅、西拉、提摩太寫信給帖撒羅尼迦在父神和主耶穌基督裡的教會。」（1:1）那個年輕人聽到「在父神和主耶穌基督裡」，愣了一下。父親不要他了，信上卻寫著他有一個住址。接下去不是責備，是感謝；保羅說他記得他們的工夫、勞苦和忍耐。然後念信的人停下來，吸了一口氣，念出下一句：「被神所愛的弟兄啊」（1:4）。"],["p","弟兄。一個剛從自己家門口被趕出來的人，在這封信裡聽見的第一個稱呼，是弟兄，而且是被神所愛的。後半句「我知道你們是蒙揀選的」，他那天晚上也許沒有完全聽懂，可是前半句，他聽懂了。散會以後，他一路走回那間租來的小屋，一路在心裡重複這幾個字。"],["p","以上是想像。經文沒有告訴我們那天是誰念的信、屋裡坐了哪些人。可是有幾件事不是想像。使徒行傳記載，保羅在那城「一連三個安息日，本著聖經與他們辯論」（徒 17:2），接著暴民闖進耶孫的家，「弟兄們隨即在夜間打發保羅和西拉往庇哩亞去。」（徒 17:10）這封信很可能是新約最早寫成的一卷，收信的是一間創辦人被連夜送走、被本地鄉親逼迫的嬰孩教會。全卷保羅叫了他們十四次「弟兄們」，第一次就在 1:4。這是一封家書，不是一份說明書。"],["p","這一課我們走完第一章，用三個字：工、印、歸。全卷五章像一個孩子長大：歸、養、穩、聖、醒；第一章是「歸」，是出生。照書信三問，先問第一問：帖撒羅尼迦人遇到甚麼？創辦人走了，手上沒有新約，沒有長老，沒有會堂，只有一個被盯上的家和一段很短的記憶。所以第一章要回答的問題是：這樣一個嬰孩，活得下來嗎？"],["d",["帖撒羅尼迦前書真的是新約最早寫成的一卷嗎？和加拉太書哪一封先？","學界大致同意，帖撒羅尼迦前書是保羅在哥林多寫的，約在主後五十到五十一年，因為信裡提到提摩太剛從帖撒羅尼迦回來，這和使徒行傳十八章對得上。至於加拉太書，要看它是寫給南加拉太還是北加拉太的教會：若是南加拉太，可能更早，寫在耶路撒冷會議之前；若是北加拉太，就晚得多。所以本講義說「很可能是最早的一卷」，不說死。這件事不該影響你的信心；不論哪一封先，在四福音寫成以前，教會已經在說耶穌從死裡復活、一定會回來。全卷立場見議題「作者、寫作地點與年代」。"]],["h","二、信心有手，愛心會累，盼望站得住"],["p","先看寫信的人。第一節三個名字並排，保羅沒有給自己加任何頭銜，連「使徒」兩個字都沒有寫。新約的第一封信不是一個明星寫的，是一個團隊寫的。帶頭的人身邊，先有兩個同伴。"],["p","再看他寫的第一個動詞：「我們為你們眾人常常感謝神，禱告的時候提到你們」（1:2）。不是糾正，不是提醒，是感謝。「提到」原文是作出提名，一個一個名字在禱告裡念出來。第四、五章還有很多要糾正的，保羅卻先花了三章感謝和回憶。帶人的次序在這裡：先看見，再教導。"],["p","他看見甚麼？「不住地記念你們因信心所做的工夫，因愛心所受的勞苦，因盼望我們主耶穌基督所存的忍耐。」（1:3）請留意，他記得的不是他們懂了多少。他記得的是看得見的三樣：手上的工，身上的累，心裡撐住的忍耐。這很可能是新約第一次把信、愛、望排在一起，而且三樣全是會流汗的字。"],["p","「工夫」，原文是 ἔργον，工作。信心不是只在心裡點頭，信心有手。一位剛信主的阿嬤，不識幾個字，卻開始每天清早坐在床邊，把兒子、媳婦、孫子的名字一個一個念給主聽。「勞苦」，原文是 κόπος，不是一般的辛苦，是做到筋疲力盡、晚上倒頭就睡的那種累。愛心會累。一位輪三班的弟兄，下了大夜班沒有回家睡覺，先去醫院替一位住院的弟兄守了兩個鐘頭。"],["p","「忍耐」，原文是 ὑπομονή，字面是在底下、留下來：重擔壓在肩上，人卻沒有走開。盼望站得住。而保羅說盼望的對象是「我們主耶穌基督」，盼望不是心情，是一位要回來的人。這三樣，是一個家的三根柱子。保羅還說，這些是「在神－我們的父面前」記念的。阿嬤的清早沒有人看見，那兩個鐘頭沒有人鼓掌，在父面前都有記錄。"],["d",["我信主很多年，卻說不出最近有甚麼工夫、勞苦和忍耐，該從哪裡開始？","先不要急著給自己加一堆服事，那常常只是換一種方式忙。可以從三件很小的事開始。第一，這一週每天晚上花三分鐘回想：今天有沒有一件事，是因為信主才做的，哪怕只是忍住一句話、多打一通電話。把它寫下來，那就是信心長出的手。第二，選一個人，具體為他擺上一次會累的愛：陪一位長輩去看醫生、替一位剛生產的姊妹送一餐。第三，找出一件你正在扛、卻想放棄的事，在主面前說：主，因為盼望你，我再留下來一個禮拜。保羅記念的不是大事，是看得見的小事；神在父面前都記得。"]],["h","三、原文亮光：被愛、印、響出去"],["p","第一個原文字：ἠγαπημένοι，「被神所愛的」。這是完成式被動分詞：被愛的動作已經發生，結果一直留著。在他們做任何事以前，已經被愛了，而且一直被愛著。接著是一個在華人教會常常引起焦慮的詞：揀選。請看保羅怎麼「知道」：他沒有打開一本秘密的名冊，下一節第一個字是「因為」。「因為我們的福音傳到你們那裡，不獨在乎言語，也在乎權能和聖靈，並充足的信心。」（1:5）他是看見神在他們身上做的事，才認出神的揀選。揀選不是讓人睡不著的謎題，是回頭看時認出來的恩典。"],["p","這裡的權能，不一定是神蹟奇事。使徒行傳記帖撒羅尼迦的那一段，沒有記任何一件神蹟。人心被打開、生命被翻轉、被逼迫了還站得住，就是權能。一個拜了四十年偶像的人，肯把神像請出門，那就是權能。第五節最後還有一句常被跳過：「正如你們知道，我們在你們那裡，為你們的緣故是怎樣為人。」（1:5）福音不是一封掛號信，送到就好；它帶著送信人的體溫。信息怎樣來，信使就怎樣活。"],["p","第六節把兩樣東西放在一起：「並且你們在大難之中，蒙了聖靈所賜的喜樂，領受真道就效法我們，也效法了主」（1:6）。「大難」原是擠壓葡萄、橄欖的字，對他們不是比喻：家被闖，人被拖去見官。喜樂沒有取消大難，大難也沒有取消喜樂。聖靈的喜樂不是止痛藥，是在痛裡多了一位同在的。所以一個人可以一邊流淚，一邊知道自己沒有被丟下。也要說清楚：這是為福音被反對，不是在家裡被打；若你正處在暴力或威脅裡，你需要的是安全，不是留下來證明自己屬靈。"],["p","第二個原文字：τύπον，「榜樣」。原本的意思是打下去留下的印痕、鑄造用的模子。「甚至你們作了馬其頓和亞該亞所有信主之人的榜樣。」（1:7）而且是單數：不是幾個明星信徒，是整間教會一起成了一個印。次序也要看清楚：先說效法我們，再補一句也效法了主。剛信主的人還沒有福音書可讀，他能看見的耶穌，就是那幾個白天做工、晚上講道的人。可是鏈子的源頭和終點都是主：主蓋在保羅身上，保羅蓋在他們身上，他們又蓋在兩個省份的信徒身上。被蓋了印的人，自己也成了印。"],["p","第三個原文字：ἐξήχηται，「傳揚出來」，全本新約只出現這一次。字根是聲音，像鐘聲、號聲向四面響開；又是完成式：已經響出去了，回聲現在還在。「因為主的道從你們那裡已經傳揚出來。」（1:8）帖撒羅尼迦是個港口，人來人往。這間教會沒有差派宣教士，他們只是活出來，消息就跟著往來的人走了。所以保羅說「所以不用我們說甚麼話」。"],["d",["「我知道你們是蒙揀選的」，我怎麼知道自己是不是被揀選的？","請照保羅的走法來回答：他不是先翻名冊，是從 1:5 的「因為」看見果效，回頭認出揀選。所以你也可以回頭看：當初是誰把福音帶到你面前？哪一句話打開了你的心？你是怎樣從某一樣東西轉身的？這些都是神先動手的記號。神學上，改革宗、循道宗和其他傳統對揀選的解釋不同，本講義並陳，各派都是弟兄；但各派都同意，得救出於神的恩典，人要真實地信。主說到他那裡來的，他「總不丟棄」。所以若你今天想到主，心裡想要他，這個想要本身就是他在你身上動工。揀選的用途是讓你感謝，不是讓你失眠。詳見本章議題頁。"]],["d",["1:5 說福音在乎權能和聖靈，傳福音一定要有神蹟奇事才算數嗎？","不一定。保羅在帖撒羅尼迦的那三個安息日，使徒行傳沒有記任何一件神蹟；1:6 到 1:10 列出來的證據，是他們在大難中領受真道、有聖靈的喜樂、轉身離開偶像。所以這裡的權能包括、但不限於神蹟，首先是聖靈使福音進入人心、翻轉生命的能力。神今天仍然可以行神蹟，教會可以為病人禱告、期待神作工；但福音的真實不靠場面證明。一位默默照顧生病鄰居十年的姊妹，她的見證是有權能的。屬靈恩賜與神蹟延續的爭議，回指哥林多前書十二到十四章的議題。"]],["h","四、轉身，然後抬頭"],["p","別人到底在傳他們甚麼？第九節說，傳出去的只有一件事：一個轉身。「你們是怎樣離棄偶像，歸向神，要服事那又真又活的神」（1:9）。「歸向」，原文是 ἐπεστρέψατε，轉身，而且是一次決定性的轉身。請留意原文的字序：先「向神」，後「離開偶像」。他們不是先把家裡清乾淨，再慢慢去找神；是先看見了神，偶像就留不住了。"],["p","轉身也有目的：「要服事那又真又活的神」。信主不是只是不拜了，是開始服事一位活的、會回應的神。今天華人的轉身，常常就發生在家裡的神明桌和祖先牌位前。這裡要分清楚兩件事：不再拜偶像，是轉身；記念祖先、孝敬父母，卻是神所喜悅的。剛信主的人不必用摔神像、和家人翻臉來證明自己信得真。過年回家不拿香，卻可以第一個到、最後一個走。轉身歸向神，同時轉身更愛家人。"],["p","然後第十節，本章最高的地方：「等候他兒子從天降臨，就是他從死裡復活的－那位救我們脫離將來忿怒的耶穌。」（1:10）「等候」，原文是 ἀναμένειν，全本新約也只出現這一次，有抬頭望著、一直等著的意思。他們等的不是一件事，是一個人。保羅沒有給他們一張時間表，到第五章還明說：「弟兄們，論到時候、日期，不用寫信給你們」（5:1）。等候不是算日子，是一種活法：轉過身來以後，臉朝著一個方向。"],["p","等候的根據在中間：「就是他從死裡復活的」。我們等的不是一個傳說，是一位已經從墳墓走出來的人。最後一句說他「救我們脫離將來忿怒」，「救」是現在分詞，不是將要救，是正在救。忿怒是將來的，救已經開始了。第五章把它說完：「因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救。」（5:9）用將來的忿怒嚇人信主，不是這一節的用法。你們等候的那一位，就是救你們的那一位。"],["p","我們回到那間屋子。創辦人被人連夜送出城，保羅沒有叫他們等保羅回來，他叫他們等候神的兒子從天降臨。保羅可以被趕走，這一位連墳墓都關不住他。創辦人走了，教會的主沒有走。所以這間嬰孩教會可以活下來，剛被家人反對的你也可以。不是因為你懂得夠多，是因為他抓得夠緊。"],["d",["信主以後，家裡的祖先牌位、清明掃墓、喪禮上香，我該怎麼做？","可以分三層來想。第一，不拜是轉身：不拿香、不跪拜、不燒紙錢，因為我們只敬拜又真又活的神。第二，孝敬與記念是神所喜悅的：可以獻花、鞠躬致意、整理墳墓、在家族聚會裡說出祖先的好，喪禮上可以陪在家人身邊，做最多的事。第三，祖先牌位本身不必由剛信主的你去拆，那是家裡的東西，等家人也信了，再一起商量。實際上，最好在節日以前先跟父母講清楚，態度溫和，說明你不拜但會盡孝，不要在祭拜當下爭吵。也不要對已經過世、生前沒有信主的親人下斷語，把他們交在公義又慈愛的神手中。全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」。"]],["d",["神既然是慈愛的，1:10 為甚麼還說有「將來的忿怒」？","聖經裡神的忿怒不是脾氣失控，是神對罪與不義認真的反應。一位對惡毫不在意的神，也不可能真的愛受害的人；所以慈愛和忿怒在神身上並不衝突。可是請看 1:10 的重心：耶穌是那位「救」我們的，原文是現在分詞，正在救。第五章說得更直接，神不是預定我們受刑，乃是預定我們得救。因此這一節是給信徒的應許，不是拿來恐嚇人的工具。向家人傳福音的時候，不要先講「你會被燒」，先講那一位從死裡復活、正在救人的耶穌。詳見本章議題頁。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 1:4 的揀選講成一本秘密名冊，叫人往前推算：我在不在名單上？我的孩子、我那沒有信主就過世的父母在不在？保羅是用「因為」看果效認出揀選，那是回頭看時的感謝，不是往前看的審查。揀選在這一章是安慰嬰孩教會的話，不是篩選人的工具；預定論各派的辯論，本講義並陳、不在這裡裁決。"],["p","第二個偏差，是拿 1:6 對受苦的人說「真正屬靈的人受苦也會喜樂」，叫正在哭的人先笑一下；更糟的是要求正在受家暴、虐待的人留下來「喜樂忍耐」。大難和喜樂在同一節，誰也沒有取消誰；帖撒羅尼迦人的大難是為福音被鄉親逼迫，不是在家裡被打。保羅自己遇到暴動，是連夜離開那座城。"],["p","第三個偏差，是把 1:9 講成要剛信主的人回家摔神像、燒牌位、和父母當面翻臉，或在講台上對已經過世、生前沒有信主的祖先下斷語。原文先向神，才離開偶像；傳開的是一個改變了的生命，不是一場衝突。亡者交在公義又慈愛的神手中，那不是我們能判的。"],["p","第四個偏差，是從 1:10「等候他兒子從天降臨」推算主來的日子、把新聞對號入座，或用「將來的忿怒」「你會被留下來」嚇唬人。保羅拒絕給時間表；1:10 的救是現在分詞，正在救。讀完這一章，人應該更想念主來，而不是更害怕主來。"],["p","第五個偏差，是把 1:6「效法我們」講成「照屬靈領袖說的做」，或把 1:3 的勞苦、1:8 的傳開變成新信徒的業績：剛受洗就排滿服事、要求每個月帶人來，累倒了就說他愛主不夠。效法的終點是主，不是某一位牧者；勞苦是保羅記念的，不是他指派的；嬰孩需要的是陪伴，不是分派。"],["d",["我在家裡被打、被威脅，是不是 1:6 說的「大難」，要喜樂地忍下去？","不是。帖撒羅尼迦人的大難，是為福音的緣故被本地鄉親逼迫；家暴、虐待、威脅不是為主受的苦，你不需要留在那裡證明自己屬靈。保羅自己遇到暴動，是連夜離開那座城。實際上，第一，若有立即的危險，先保護自己和孩子，必要時撥打當地的緊急電話。第二，找一位信得過的人說出來，像另一位牧者、輔導或社工，必要時尋求法律協助。第三，你可以哭，也可以害怕，聖靈的喜樂不是叫你否認痛苦，是在痛裡知道神沒有離開你。組長若在組裡聽見這樣的事，不追問細節，不要求原諒，會後單獨關心，必要時協助尋求專業協助。全卷立場見議題「受苦、逼迫與家人反對」。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：過年、清明和神明桌。很多弟兄姊妹信主以後，最難的不是讀經禱告，是第一個過年、第一個清明。全家拿香，只有你站著；飯桌上沒有人跟你說話，親戚說你信洋教、不要祖宗。這一章給的路是轉身，不是對抗：不拜，但更孝順。可以提早到、多出力，掃墓時獻上花，說出祖先的好；把要說的話先跟父母講清楚，不在祭拜的當下爭吵。帖撒羅尼迦人的鄰居看見的，就是一群轉了身、卻更好相處的人。"],["p","第二個問題：沒有香爐的偶像。也有人家裡從來沒有神明桌，心裡中間那一格卻不一定空著：孩子的成績、補習班的排名、帳戶的數字、老闆的一句肯定。偶像不一定有香爐；凡是我一失去就活不下去的，都在搶那個位子。我們會為一張成績單吼孩子、為一個職位失眠。1:9 的轉身，今天常常是在一張書桌前、一個手機螢幕前發生的：把中間那一格還給又真又活的神。"],["h","七、活出321——轉過身來的人，臉朝著一位"],["p","神做的事講完了：被愛、揀選、權能、聖靈、正在救。我們才把國度321空中團契常說的幾句話接上去，讓經文替它們定準。"],["p","耶穌是我的榜樣：1:6 的效法鏈，最上面一環不是保羅，是主；而主自己也是一個效法者，他說：「子憑著自己不能做甚麼，惟有看見父所做的，子才能做」（約 5:19）。學他，不是演一個完美的樣子給人看，是每天先看父在做甚麼，再跟著做。"],["p","聖經是我的準則：次序不能倒。先讀到「被神所愛的」，才講勞苦；先讀到「正在救」，才講等候。把 1:3 讀成業績表、把 1:10 讀成時間表，都是讓別的東西坐上準則的位子。"],["p","聖靈是我的引導：福音能進門，是因為「也在乎權能和聖靈」；苦裡的喜樂，是「聖靈所賜的喜樂」。哪一樣習俗要離開，哪一樣孝道要更用心，回家怎樣開口，求聖靈給你分辨。"],["p","讓耶穌作王：帖撒羅尼迦人轉身以後去「服事」，原文是作奴僕；一個人只能有一位主人。把家裡、心裡正中間那一格空出來給他；也承認他甚麼時候來、怎麼來，是王的事，我的事是轉身、服事、抬頭。"],["p","讓耶穌得著一切的榮耀：這一章傳開的不是帖撒羅尼迦人的成績，是「你們向神的信心」。被傳開的教會，人看見的是神做的事；我們被人看見的時候，也要把話題轉回那位使我們轉身的主。"],["p","建立屬神的體系：從一開始就是團隊，1:1 三個名字並排，這是 235 的樣子；每一個新生命都要有人接，被家人冷落的新信徒，教會要成為他的家，有人陪他過第一個年、第一個清明；讓印傳下去，被帶的人學會帶人。教會成不成熟，不是看多少人聽懂，是看多少人自己成了印。"],["h","八、四種心，面對那一聲「弟兄」"],["p","驕傲型的心，覺得自己懂得比帖撒羅尼迦人多太多，會分析揀選、會比較末世各派，卻說不出最近一樣工、一樣累。這一章輕輕問你一句：保羅記念的是手上的工，不是腦子裡的資料；你的信心，還有手嗎？"],["p","恐懼型的心，怕的是兩件事：怕自己不是被揀選的，怕主來的那一天被留下。請回到 1:4 的完成式：你已經被愛了，而且一直被愛著；也回到 1:10 的現在分詞：你等候的那一位，現在就在救你。等候不是提心吊膽，是抬頭盼望。"],["p","羞恥型的心，覺得自己信得太晚、懂得太少、家裡太亂，不配被叫一聲弟兄姊妹。帖撒羅尼迦人信了才三個安息日，保羅第一封信就叫他們「被神所愛的弟兄」。你不必先把家裡清乾淨才能來；臉朝著他，就是轉身了。"],["p","受傷型的心，也許你曾因為信主被家人趕出門、被親戚羞辱，也許曾被人用「受苦要喜樂」壓過。你的眼淚不是信心不夠，大難和喜樂可以同時在你身上。若你正處在不安全的處境裡，請告訴一位信得過的人，讓人陪你找到安全和專業的幫助。你不是一個人等。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀一次 1:9–10，讀到「歸向神」停下來，說出今天最可能取代主的一樣東西，然後說：主，今天我轉向你；出門以前抬頭一下，說：主耶穌，我在等你。"],["p","第二，拿一張紙畫三欄：工夫、勞苦、忍耐。這七天每天在三欄底下各寫一件因為信主才做的事，週末看看哪一欄空著，帶到主面前，不是自責，是求他讓那一欄長出來。"],["p","第三，像保羅一樣點名感謝：想一位在你身邊默默做工、受累、忍耐的人，在禱告裡念他的名字，這一週也親口或寫一張字條告訴他，你看見了他的哪一樣工。"],["p","第四，去接一個剛出生的生命：約一位一年內信主或剛來聚會的人吃一頓飯，先問兩句：信主以後，家裡怎麼樣？最近哪一件事最難？"],["p","第五，若你家裡有未信主的父母，這個月做一件具體的孝敬：一頓飯、一次陪診、一通問候，讓他們看見一個轉了身、卻更溫柔的孩子。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我是被神所愛的，在我做任何事以前，我已經被愛，而且一直被愛著。"],["p","我宣告：我離棄偶像，歸向神，要服事那又真又活的神；我心裡中間那一格，是留給耶穌的。"],["p","我宣告：我等候神的兒子從天降臨，他從死裡復活，現在就在救我；我不算日子，我抬頭盼望。"],["p","我宣告：主蓋在我身上的印，我要蓋到下一個人身上；我要去接一個剛出生的生命。"],["d",["家人因為我信主很不高興，這一週我可以做一件甚麼事，讓他們看見我轉身了？","選一件他們最在意、你又做得到的事。第一，先問自己：家人最常抱怨我信主以後的哪一點？是星期天不回家吃飯，還是過年不拿香？第二，在那一點旁邊補上一件更孝順的事：星期六先回家陪吃一頓飯；過年提早一天回去幫忙大掃除；打電話給爸媽，問他們身體好不好，不提教會。第三，不辯論，被說兩句也先不回嘴。帖撒羅尼迦人的轉身之所以傳開，是因為鄰居看見了一個改變的生命。三年以後，你的父母記得的應該是一個變溫柔了的孩子，而不是一場衝突。"]],["h","十、結語"],["p","我們回到港邊那間屋子。信念完了，送信的人把它捲起來，交給弟兄們保存。那個做皮革的年輕人，也許有一年過年，提著一包東西站在父親門口，等那扇門打開。我們不知道。我們只知道，他在等的不只是那扇門，他在等一位從天降臨的主。"],["p","可是這一課的焦點，不在帖撒羅尼迦人多勇敢，也不在保羅多會寫信，更不在我們學會了「工、印、歸」三個字。焦點在那一位：他先愛了這群人，用權能和聖靈把福音帶進他們的家，在大難裡把喜樂放進他們心裡，從死裡復活，現在就在救他們，而且一定會回來。你不必更佩服誰，只要更愛這一位主，更想念他來。"],["p","我們一起低頭禱告。天父，謝謝你在我們做任何事以前，就先愛了我們，叫我們成為被你所愛的弟兄姊妹。赦免我們懂得很多、手卻很空，赦免我們把心裡中間那一格讓給了別的東西。求你看顧那些因為信主被家人冷落、被趕出門的弟兄姊妹，在大難裡賜下聖靈的喜樂，也保守他們的安全。求你讓我們轉身歸向你，也轉身更愛家人；讓我們抬起頭來，等候你的兒子從天降臨。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰懂得多，是讓每一個人說出自己手上的一樣工、身上的一樣累，也說出這一週要去接的那一個新生命；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是工、印、歸。席上可能有剛信主、正被家人反對的人，也可能有信主多年、手卻很空的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：揀選是回頭認出的恩典；大難和喜樂可以同時存在；信主是先向神、再離開偶像的轉身。"],["n","1. ★ 說一次你搬到新地方的第一個禮拜：新學校、新城市或新公司。那一週最難的是甚麼？是誰第一次讓你覺得自己不是外人？"],["n","2. ★★★ 保羅記念的是他們的工夫、勞苦、忍耐，不是他們懂了多少。請用一句話說：為甚麼一個信主才三個安息日的教會，已經可以被這樣記念？"],["n","3. ★★ 保羅怎麼「知道」他們是蒙揀選的？請從 1:5 的「因為」找出他看見的證據，說出兩樣。"],["n","4. ★★ 1:9 是先「歸向神」還是先「離棄偶像」？這個次序對一個家裡還有神明桌的新信徒，有甚麼不同？"],["m","帶領提醒：讀 1:2–10 時請一口氣讀完，先不要討論揀選的神學爭論，指向議題頁即可。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己手上有沒有工、身上有沒有累、心裡有沒有等候，並從「我是被神所愛的」出發，說出這一週要轉身的地方。"],["t","【看】看見自己"],["n","5. ★★★ 如果保羅今天為你禱告，他記得起你最近的哪一樣工、哪一樣累、哪一樣忍耐？說出一件，哪一天、在哪裡、為了誰。說不出來，也誠實說是甚麼讓你的信心只剩下知道。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:4 兩遍，第二遍把「弟兄」換成你自己的名字，讀完說一句：在你做任何事以前，神怎樣看你？"],["t","【想】想通關卡"],["n","7. ★★★ 你心裡中間那一格，現在坐著甚麼：孩子的成績、一份工作、一個人的肯定、對家人反對的害怕？選一個說出來，說說為甚麼它很難讓出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我是被神所愛的，這一週我要轉身向他。」右手邊的人只回一句「神一直愛你」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要為中間那一格做的一件鬆手的事：星期幾、在哪裡、對誰、要做的第一個動作是甚麼。"],["m","帶領提醒：這一化可能碰到被家人趕出門、家庭衝突、甚至家庭暴力的經驗；不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」或「受苦要喜樂」。若有人說出正處在危險中，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：點名感謝一個人、接住一個新生命、向家人做一件孝敬的事、把這一課傳下去。"],["n","10. ★★ 說出一位你這一週要點名感謝的人：他默默做了哪一樣工？你要在哪一天、用甚麼方式告訴他你看見了？"],["n","11. ★★ 說出一位一年內信主或剛來聚會的人，這一週哪一天你要約他吃飯或打電話？你要問他的第一句話是甚麼？"],["n","12. ★ 若你家裡有未信主的父母或長輩，說出這個月你要做的一件孝敬：哪一天、做甚麼，是一頓飯、一次陪診，還是一通電話？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：在他做任何事以前，神已經愛他了。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，有一群人信了耶穌才幾個禮拜就被趕出家門，可是神叫他們「被神所愛的」。第二句，信耶穌就是轉身，從抓住你的東西轉向一位又真又活的神。第三句，耶穌從死裡復活，現在就在救人，而且一定會回來。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更愛主」這類答案；正被家人反對的組員，鼓勵他先選一件溫和的孝敬，不鼓勵他回家攤牌。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要轉身離開的那一樣是甚麼，要去接的人是誰。"],["p","然後彼此代禱，為三種人指名禱告：一位因為信主正被家人反對、冷落的弟兄姊妹，求主在大難中賜下聖靈的喜樂，也保守他的安全；一位家裡還有神明桌的未信家人，求主讓他看見又真又活的神；一位信主很久、卻已經不再等候主的人，也可能就是你自己，求主讓他重新抬起頭來。"],["p","散會以前，確認紙上寫了三樣：要點名感謝的那個人、要去接的那個新生命、你的那個「2」。下次帶來對。"]]},"2":{"no":2,"vol":"《321帖撒羅尼迦前書講義》第二課·帖撒羅尼迦前書第二章","title":"作坊裡的那盞燈——膽、乳、冠","chars":5187,"min":60,"deep":8,"dchars":1719,"tchars":1394,"blocks":[["h","一、作坊裡的那盞燈"],["p","弟兄姊妹平安。那幾個月，我睡在作坊最裡面的角落。天還沒亮，我總是先聽見一個聲音：錐子穿過羊皮，線拉緊，再穿過去。是保羅。燈只有一盞，他把它挪得離皮子很近，離自己的臉很遠。白天要講道的人，夜裡在縫帳棚。"],["p","天一亮，作坊的門開了，人就來了。有人來買帳棚，有人來問那位釘十字架的耶穌。我最記得的，是他叫人的樣子。他從來不說「那位弟兄」，他叫名字：耶孫，亞里達古，還有不太敢抬頭的西公都。誰昨天被父親趕出家門，他都記得。叫完名字，他會放下手上的活，彎著身子聽，像父親聽孩子說話。"],["p","有一晚我問他：「你是使徒，為甚麼不讓他們供養你？」他把線咬斷，才說：「這城裡有人說我們是來騙錢的。這些人剛離棄偶像，家裡正在逼他們。我不要成為他們身上多一塊石頭。」那晚，我看見他背上腓立比的棍傷，還沒有全好。"],["p","然後是那一夜。弟兄們在黑夜裡把保羅和西拉送出城。我站在路邊，看他走幾步就回頭一次。"],["p","以上是想像。經文沒有說提摩太那幾個月睡在哪裡，也沒有說保羅在帖撒羅尼迦做哪一門手藝；織帳棚是從路加的記載推的：「他們本是製造帳棚為業。保羅因與他們同業，就和他們同住做工。」（徒 18:3）亞里達古和西公都，是路加記下的兩位帖撒羅尼迦人（徒 20:4）。可是保羅自己寫了「晝夜做工」，也寫了「各人」，原文是一個一個地，這不是想像。腓立比的弟兄確實送過供給來（腓 4:16）：他收了遠方的，卻不肯加重眼前這一群人。"],["p","這一課走完第二章，用三個字：膽、乳、冠。全卷是一個孩子的成長：歸、養、穩、聖、醒；第二章是「養」，剛出生的教會被餵。照書信三問，先問第一問：帖撒羅尼迦人遇到甚麼？創辦人才來三個安息日就被連夜送走，城裡有人說，那個人講得好聽，一出事就跑了。保羅沒有替自己辯護，只把那一段日子攤開來，請他們自己看。"],["h","二、被打過的人，還開口：膽"],["p","保羅的第一句是：「弟兄們，你們自己原曉得我們進到你們那裡並不是徒然的。」（2:1）「徒然」原文是空的。證據不是履歷，是讀信的人：你們還在，你們還信。"],["p","接著他輕輕提了一句別的城：「我們從前在腓立比被害受辱，這是你們知道的」（2:2）。本系列使徒行傳講義第 16 章講過那一夜：「官長吩咐剝了他們的衣裳，用棍打」（徒 16:22），然後下監、上木狗。保羅只用兩個詞帶過：被害，受辱。一個講自己傷口講太多的人，會把聽的人的眼睛留在自己身上。"],["p","傷還沒好，他就進了下一座城，「然而還是靠我們的神放開膽量，在大爭戰中把神的福音傳給你們」（2:2）。膽量不是他的性格，是從神來的；膽量也不是不怕，是怕了，還開口。如果你這一週剛被家人說了重話，或在公司因為信仰吃了虧，請你聽清楚：受辱不等於失敗，被趕走也不等於白來。"],["p","那時城裡常有巡迴的演說家，收了錢，風聲一緊就走。保羅很容易被歸成同一類，所以他說了三個「不是」：「我們的勸勉不是出於錯誤，不是出於污穢，也不是用詭詐。」（2:3）「詭詐」原是釣魚的餌：外面是食物，裡面是鉤子。保羅說，我們不釣人。"],["p","理由在下一節：「但神既然驗中了我們，把福音託付我們，我們就照樣講，不是要討人喜歡，乃是要討那察驗我們心的神喜歡。」（2:4）「驗中」和「察驗」是同一個字根，原是試驗金子成色的字。驗中是過去的事，被驗卻從來沒有停過。只要向一位交帳，就不必向一千個人演戲。可是保羅極在乎人：在乎人，是愛；討好人，是怕。"],["p","然後他攤開三樣東西：「因為我們從來沒有用過諂媚的話，這是你們知道的；也沒有藏著貪心，這是神可以作見證的。」（2:5）一樣是嘴，一樣是錢，再加上 2:6 的一樣：名，「沒有向你們或向別人求榮耀」。說出口的，請你們作證；藏在外衣底下的，請神作證。講話先看台下臉色，說得屬靈、心裡算奉獻，做得辛苦、等一句「你好棒」。這三樣都把自己放回中心。"],["d",["「不是要討人喜歡」，是不是說基督徒或傳道人可以不在乎別人的看法？","不是。保羅反對的是以討好為動機、以自己為目的的事奉，不是叫人不理會人。同一章裡他請人作見證，連性命都願意給；他極在乎人，只是不靠討好換取接納。他在別處也說：「我們各人務要叫鄰舍喜悅，使他得益處，建立德行。」（羅 15:2）同一個「喜悅」，為了自己被接納而取悅人，是怕；為了別人得益處而體貼人，是愛。所以 2:4 不是拒絕批評的盾牌：有人指出你的錯，先查驗他說得對不對。正因為只向一位察驗人心的神交帳，你才有膽量說真話，也才有安全感聽真話。本章議題頁有細講。"]],["h","三、原文亮光：分量、捂熱、性命"],["p","整章在這裡轉彎。請先不要想我們常講的任何一句話，讓保羅畫的這幅畫自己站起來。"],["p","第一個原文字：βάρος，「分量」。和合本 2:6 下半「雖然可以叫人尊重」，在希臘文屬 2:7 句首：δυνάμενοι ἐν βάρει εἶναι，可以有分量。它有兩種讀法：可以擺使徒的架子，或可以要求教會供養；本講義認為兩義都在，保羅兩樣都放下了。三節以後，他說晝夜做工是「免得叫你們一人受累」（2:9），「受累」原文 ἐπιβαρῆσαί，正是同一個字根。他可以有分量，卻不肯成為別人的重量。有權柄的人把權柄放下，才是謙卑。"],["p","放下以後，他去了哪裡？「只在你們中間存心溫柔，如同母親乳養自己的孩子。」（2:7）「溫柔」一字，古抄本有的作 ἤπιοι，溫柔，有的作 νήπιοι，嬰孩，只差一個字母；本講義照和合本讀溫柔，議題頁有細講，兩讀的落點相同：有權柄的人，選了最小、最軟的位置。第二個原文字就在這一句的末了：θάλπῃ，「乳養」，字面是用體溫捂暖。母鳥伏在雛鳥身上，就是這個字。「母親」原文 τροφὸς，餵奶的人；τὰ ἑαυτῆς τέκνα，她自己的孩子：不是雇來的奶媽。而且是在你們中間，不是在上面。"],["p","母親捂熱孩子，有幾件事是省不了的：要坐下來，站著趕時間的人捂不熱誰；要把孩子抱近，隔著一張桌子傳不過體溫；要配合孩子的節奏。一間只有三個安息日大的教會，保羅先給的不是規條，是溫度。新朋友需要的常常不是一整套課程，是有人記得他的名字，陪他吃一頓飯。"],["p","第三個原文字：ὁμειρόμενοι，「這樣愛你們」，全本新約只出現這一次，有學者說它帶著哄孩子的口氣。「我們既是這樣愛你們，不但願意將神的福音給你們，連自己的性命也願意給你們，因你們是我們所疼愛的。」（2:8）「性命」原文 τὰς ἑαυτῶν ψυχάς，是整個人、自己。福音可以像快遞一樣送到，保羅卻是連人帶福音一起給。也請看給的方向：是母親給孩子，不是孩子給母親。保羅沒有說你們要把性命交給我們。"],["p","所以第九節不是一段帳目，是同一幅畫的另一面：「弟兄們，你們記念我們的辛苦勞碌，晝夜做工，傳神的福音給你們，免得叫你們一人受累。」（2:9）不收錢，不是因為收錢不屬靈，保羅自己說：「主也是這樣命定，叫傳福音的靠著福音養生。」（林前 9:14）他在這裡不收，是因為這一群人正被逼迫，城裡又有人說他騙錢。你一邊上班一邊帶小組，你的辦公桌也可以是講台。"],["d",["2:7 有的譯本作「溫柔」，有的作「嬰孩」，這是不是表示聖經不可靠？","不是。古抄本在這裡有兩種寫法：ἤπιοι，溫柔；νήπιοι，嬰孩，只差一個字母。前一個字正好以這個字母結尾，抄寫時很容易多寫或少寫。支持「嬰孩」的是較早、較多的抄本；支持「溫柔」的是上下文，溫柔像乳母，意象一致。兩派都承認光憑抄本無法完全決定，本講義照和合本讀「溫柔」，並陳「嬰孩」。正因為新約抄本多到可以比對，我們才知道這裡有差別、差別有多大；大多數異文都是這樣的小差別，沒有一處動搖核心信仰。而兩個讀法的落點相同：可以叫人尊重的使徒，選了最小、最軟的位置。全卷立場見議題「這些爭議該不該影響一個人的信心？」。"]],["d",["保羅晝夜做工、不收錢，是不是表示領薪水的傳道人比較不屬靈？","不是。保羅自己說「主也是這樣命定，叫傳福音的靠著福音養生」，他也收過腓立比教會一次兩次的供給。他在帖撒羅尼迦不收，是處境中的選擇：這一群人剛離棄偶像、正受逼迫，城裡又有人說他是來騙錢的；他放下本來有的權利，免得福音被阻隔。今天的落點有兩面。會眾這一面：公平、甘心地供養工人，「工人得工價是應當的」。傳道人這一面：不藏貪心、帳目透明、可以被檢驗。全職與帶職都是呼召，沒有屬靈高低。屬靈權柄回指哥林多後書立場三；全卷立場見議題「書信的處境與原則」。"]],["h","四、父親、孤兒、冠冕"],["p","母親之後，保羅換了一個畫面：「你們也曉得，我們怎樣勸勉你們，安慰你們，囑咐你們各人，好像父親待自己的兒女一樣」（2:11）。這三個動詞在希臘文屬 2:12。勸勉是推一把；安慰是對灰心的人輕聲說話；囑咐原文是見證，把話說重。母親重在溫度，父親重在方向。「各人」原文 ἕνα ἕκαστον，一個一個地。保羅認得每一張臉。"],["p","目標是：「要叫你們行事對得起那召你們進他國、得他榮耀的神。」（2:12）對得起的是神，不是保羅。他的權柄也可以被檢驗：「有你們作見證，也有神作見證」。不肯被檢驗的權柄，不是父親的權柄。下一章保羅把目標說得更明白：「你們若靠主站立得穩，我們就活了。」（3:8）"],["p","到第十三節，保羅把功勞一把推開：「這道實在是神的，並且運行在你們信主的人心中。」（2:13）「運行」是現在式。創辦人被趕走了，手上只剩聽過的道和一封信，保羅說：夠了。傳道人會離開，道不會離開。"],["p","道做工的第一個樣子，出人意料：是受了苦還站著。「因為你們也受了本地人的苦害」（2:14）。「本地人」原文是自己的鄉親。接下去兩節曾被拿來合理化仇恨，所以三件事要先放在桌上。第一，保羅自己是猶太人，他說：「為我弟兄，我骨肉之親，就是自己被咒詛，與基督分離，我也願意。」（羅 9:3）第二，前一節的榜樣正是猶太地的教會。第三，說的是殺主、攔阻福音的逼迫者，不是一個民族。2:16「神的」是和合本補的小字；保羅後來自己說：「我且說，神棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）讀這幾節，是低頭問：我有沒有用權力攔住別人親近神？"],["p","然後是全章最低的地方：「弟兄們，我們暫時與你們離別，是面目離別，心裡卻不離別」（2:17）。「離別」原文 ἀπορφανισθέντες，字根是孤兒。一章之內，保羅是母親，是父親，現在成了孤兒。「只是撒但阻擋了我們」（2:18），「阻擋」原文 ἐνέκοψεν，在路上挖斷。哪一次是撒但、哪一次是神關門，保羅沒有給公式，可是他的反應很清楚：不怪人，不自責，也不停止愛。去不了，就寫信，就打發提摩太回去「堅固你們，並在你們所信的道上勸慰你們」（3:2）。"],["p","最低的地方，緊接著最高的地方：「我們的盼望和喜樂，並所誇的冠冕是甚麼呢？豈不是我們主耶穌來的時候、你們在他面前站立得住嗎？」（2:19）「來的時候」原文 παρουσίᾳ，君王駕臨一座城，全城出去迎接。和合本的「站立得住」是補的小字，原文只說：豈不就是你們嗎？不是等你們表現夠好才算，是你們就是。「因為你們就是我們的榮耀，我們的喜樂。」（2:20）主一定會回來；保羅提這件事不是排時間表，是給一個被拆散的家一個重逢的日子。"],["d",["屬靈父母、屬靈遮蓋，要怎樣分辨是在餵養我，還是在控制我？","可以用這一章給的問題檢查。第一，這個關係讓我越來越認識主，還是越來越怕某一個人？第二，我可以提問、可以說不、可以離開，而不被威嚇或羞辱嗎？保羅也請人作見證。第三，我的婚姻、金錢、工作與身體，是我在神面前負責的，還是要交給某個人決定？第四，這個人的目標是我靠主站穩，還是我離不開他？若答案偏向後者，那已經是屬靈虐待，不是 2:7 的母親，也不是 2:11 的父親。請找一位信得過的人說出來；涉及性、金錢或人身控制，要尋求專業與法律協助。組長聽見這樣的事，不追問細節，不要求原諒，會後單獨關心。屬靈權柄回指哥林多後書立場三。"]],["d",["2:15 說「這猶太人殺了主耶穌」，新約是不是反猶太人？","不是，而且這一處必須講清楚，因為歷史上它曾被拿來合理化仇恨與屠殺。第一，保羅自己是猶太人，為骨肉之親說就是自己被咒詛也願意。第二，前一節的榜樣正是猶太地的教會；耶穌和使徒也都是猶太人。第三，原文是一串描寫行為的分詞：殺了主、趕出使徒、攔阻向外邦人傳道，說的是做了這些事的逼迫者，不是一個民族。2:16 的忿怒是對攔阻福音之人的審判，原則對誰都一樣，也包括教會；保羅後來明說神沒有棄絕他的百姓。全卷立場見議題「受苦、逼迫與家人反對」。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 2:7、2:11 的「母親」「父親」講成屬靈控制：屬靈父親說的就要順服，質疑遮蓋就是悖逆。保羅的父母權柄是放下、餵養、自己做工；他請人作見證，目標是孩子靠主站穩，不是離不開。讓人越來越不敢自己讀經、自己判斷的關係，已經把這一章讀反了。"],["p","第二個偏差，是把 2:8「連自己的性命也願意給你們」講成好的屬靈父母不必休息、不能有界線、要隨叫隨到、燒完為止。保羅會打發提摩太代替自己，也坦白說自己「不能再忍」。給出去不是燒完；一個累垮了的母親，餵不了孩子。"],["p","第三個偏差，是用 2:14–16 說任何貶低猶太人或其他民族的話，或把 2:16 對號入座到今天某個國家、某場戰爭、某條新聞。說的是逼迫者，不是一個民族；審判在神手裡。"],["p","第四個偏差，是拿 2:9 說領薪水的傳道人不屬靈；或反過來，拿 2:6「可以叫人尊重」替特權、排場和不透明的帳目辯護。保羅不收錢是處境中的選擇，不是給所有傳道人的規條；而 2:6 的重點在後半：有權柄而不用。"],["p","第五個偏差，是把 2:19 的冠冕講成業績：你們站不穩，我的冠冕就沒了；或用「主來的時候你站不住」恐嚇人。「站立得住」是補的小字，原文說的是你們就是。冠冕是人，不是人數；保羅講主來，是要人更想念主來，不是更害怕主來。"],["d",["我帶小組帶到很累，2:8「連自己的性命也願意給」是不是要我燒完為止？","不是。2:8 說的是給的方向與心意，不是要你把自己耗盡。保羅懂得打發提摩太代替自己去，也坦白說自己「不能再忍」。一個累垮了的母親，是餵不了孩子的；真正的無己，是長久地給，不是一次燒完。實際上可以這樣做：第一，這一週找組長或牧者，說出你真實的累。第二，把一項服事交給組裡另一位已經站穩的人，你在旁邊陪；這不是推卸，是讓他長大，也是繁殖。第三，每週留一段不接服事訊息的時間，陪家人，也讓神先餵飽你。教會也要問：帶人的人有沒有人餵？"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：最痛的反對，來自最近的人。2:14 的「本地人」是自己的鄉親。信了耶穌被說不孝、背祖，過年回家成了最難走的一段路。保羅沒有叫帖撒羅尼迦人反擊，也沒有叫他們和家人斷絕，他把他們放進一條更長的隊伍：在你們以前，已經有人這樣走過。除夕那一晚，不必在飯桌上辯贏誰，可以先洗碗、陪父母說話，用孝順作見證。若遇到暴力或人身危險，先保護安全，不可用這一節要人留在危險裡。"],["p","第二個問題：一日為師，終身為父。敬重長輩是美德；可是放進教會，屬靈父母很容易變成孩子永遠不能長大的家長。帶人的人說「我帶出來的人」，被帶的人換了小組就被說忘恩負義，有意見也不敢說。2:12 說得很清楚：孩子要對得起的是神，不是對得起帶他的人。被帶過的人有一天去了別處服事，甚至比你更被看重，那不是你的損失，那是你的冠冕。"],["d",["家人因為我信主很反對，過年回家要怎樣面對，才不會變成吵架？","保羅沒有叫帖撒羅尼迦人反擊，也沒有叫他們和家人斷絕，所以目標不是辯贏，是讓家人看見信耶穌的人更懂得愛父母。實際上可以這樣做：第一，回家以前先為每一位家人指名禱告，求主給你溫柔。第二，在家裡多做事、少辯論：洗碗、陪長輩說話、主動照顧老人家；祭祖時不拜偶像，但可以恭敬地記念、感恩，幫忙準備。第三，被問到信仰時，用一兩句自己的經歷回答，不攻擊家人。第四，若遇到的是打罵、威脅或人身危險，先保護自己的安全，必要時尋求協助；受患難不是要你留在危險裡。祭祖與受苦的全卷立場見議題「哀傷與盼望：死亡、喪禮與祭祖」、議題「受苦、逼迫與家人反對」。"]],["h","七、活出321——可以有分量的人，蹲下來餵人"],["p","那個可以有分量、卻選擇捂熱孩子的使徒站穩了，我們才把國度321空中團契常說的兩句話接上去，讓這一章替它們定準。第一句是「3 屬靈父母兒女」：這一章就是它最完整的一幅畫，保羅是母親，是父親，也是孤兒；而屬靈父母的權柄是用來餵養的，不是用來壓人的。第二句是「無己」：2:8 就是它在本卷的本文。無己不是沒有自己，是把自己給出去；保羅有渴想、有掛念，他給出去的正是那個自己。"],["p","耶穌是我的榜樣：保羅這個母親是從耶穌那裡學來的。耶穌說：「我多次願意聚集你的兒女，好像母雞把小雞聚集在翅膀底下」（太 23:37）。他復活以後先預備早飯，等彼得吃完，才說：「你餵養我的小羊。」（約 21:15）是我的小羊，不是你的。"],["p","聖經是我的準則：次序不能倒。先讓 2:6–8 那幅畫站穩，再講我們的理念；讀到母親與父親，就以為讀到了自己的理念，是這一卷最大的試探。而且 2:13 把功勞推回神的道：帶人的人不能把自己的意見說成神說。"],["p","聖靈是我的引導：餵誰、怎樣餵、甚麼時候該退一步讓孩子自己走，沒有公式。求聖靈讓你看見那一張你這一週要記住名字的臉，也讓你知道甚麼時候該說「我需要休息」。"],["p","讓耶穌作王：這一章要人讓出來的位置，是「被需要的人」。每一個被我帶過的人都是主的羊；坐在中心的是察驗人心的神，不是我的分量。讓耶穌作王，也不是讓某一位屬靈父親坐上那個位置，替你決定一切。"],["p","讓耶穌得著一切的榮耀：保羅不求人的榮耀，他說「你們就是我們的榮耀」，可是那一天，他是把這些人帶到「我們主耶穌」面前。冠冕最後要放在主的腳前。建立屬神的體系：只有孩子、沒有長大成父母的團契，是永遠在吃奶的家。所以每一位新朋友要有人餵、有人陪；權柄要可以被檢驗，帳目公開，有提問的管道；被餵的人站穩以後，去餵下一個，這是 235 的傳遞，也是八大步驟的繁殖。"],["h","八、四種心，誰在餵你，你在餵誰"],["p","驕傲型的心，餵人的時候在等回報：等一句謝謝，等被稱作屬靈的媽媽；被帶過的人去了別的教會，心裡像被偷了東西。這一章只問你：那位可以有分量的使徒都放下了，你手裡抓著的那一點「我帶出來的」，真的是你的嗎？"],["p","恐懼型的心，不敢說真話，怕被人說不溫柔、怕被說不屬靈，於是一直討人喜歡。請回到 2:4：神已經驗中了你，你只要向一位交帳。"],["p","羞恥型的心，常常是那個在教會坐了很多年、一直覺得自己不夠格去餵別人的人。你覺得自己太軟弱、讀經讀得太少、說話不好聽。可是保羅說，那道「運行在你們信主的人心中」：你被餵過，你手上的那一碗飯，就可以端給一個新朋友。"],["p","受傷型的心，也許你曾經被一位「屬靈父親」或「屬靈母親」控制、羞辱過，到今天聽到這幾個字還會發抖；也許你因為信主被家人趕出來，覺得自己像一個孤兒。今天請你聽：2:7 的母親、2:11 的父親，正是傷害你的人應該成為、卻沒有成為的樣子；那不是你的錯，你可以直接到神面前，也不必急著原諒誰。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 2:1–13 中的幾節，讀到「這道實在是神的」，停下來說：主啊，今天請你的道在我裡面運行；晚上回想，今天哪一刻我在討人喜歡，哪一刻在討你喜歡。"],["p","第二，選定一位這一週由你來餵的人：一位新朋友或最近很少出現的人。約他吃一頓飯，記住他說的一件事，下次主動問起。"],["p","第三，像保羅那樣叫名字：把小組或團契裡你叫不出名字的人，找出一位，這一週問清楚他的名字，寫在禱告本上，每天為他指名禱告。"],["p","第四，若你是主管、父母或資深同工，刻意放下一次分量：把一件可以命令的事改成邀請，把一句可以指正的話先換成聆聽。"],["p","第五，打一通電話或寫一張卡片，給一位曾經餵過你的人，具體說出他哪一件事幫助了你。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：神已經驗中了我，把福音託付我；我只向那察驗人心的神交帳，所以我可以說真話。"],["p","我宣告：我是被餵過的人；那道實在是神的，現在正在我心裡運行。"],["p","我宣告：我願意把自己給出去，不是燒完，是為了一個人有一天靠主站立得穩。"],["p","我宣告：我所帶的每一個人都是主的羊；我的冠冕是人，那一天要放在主耶穌的腳前。"],["d",["這一週要「餵」一位新朋友，怎樣做才不會讓他變得依賴我？","從一開始就把目標放對：不是讓他離不開你，是讓他有一天靠主站立得穩，也去餵別人。實際上可以這樣做：第一，約他吃一頓飯，聽他說話多過你說話，記住他的名字和他說的一件事。第二，和他一起讀 2:13，讓他自己說出讀到甚麼；你要他看見的是神的道會做工，不是你很會講。第三，介紹他認識小組裡另外兩三位弟兄姊妹，不讓自己成為他唯一的窗口。第四，三個月內邀請他和你一起服事一次。若他的難處超過你能承擔的，誠實告訴他，陪他找牧者或專業協助。"]],["h","十、結語"],["p","回到那間作坊。後來保羅在雅典放心不下，把那個在路邊看他回頭的年輕人差了回去。提摩太帶回好消息：他們「常常記念我們，切切地想見我們」（3:6）。被餵過的人，開始去餵人了。膽，是被打過還開口；乳，是有分量還蹲下來；冠，是那一天一張一張的臉。"],["p","可是這一課的焦點，不在保羅多會帶人，也不在我們學會說「屬靈父母兒女」。焦點在那一位先把性命給了我們的主：「他替我們死，叫我們無論醒著，睡著，都與他同活。」（5:10）保羅會餵人，因為他先被餵過；他願意把性命給出去，因為有一位先把性命給了他。你不必更佩服保羅，也不必更佩服帶你的人，只要更愛這一位主。"],["p","我們一起低頭禱告。天父，謝謝你差你的兒子為我們捨命，用他自己的生命捂熱了我們。赦免我們在餵人的時候想抓住人。求你扶起被屬靈權柄傷害過的人，保守他們的安全；也安慰因信主被家人反對、覺得自己像孤兒的人。讓你的道在我們心裡運行，使我們這一週叫得出一個人的名字，把自己給出去，直到他靠主站立得穩。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰帶過最多人，是讓每一個人說出一位餵過自己的人，也說出這一週要叫出名字、要去餵的那一個人；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是膽、乳、冠。席上可能有帶人帶到累的人，也可能有曾被屬靈權柄傷害、或因信主被家人反對的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：在乎人是愛、討好人是怕；有分量的人放下分量，才是謙卑；屬靈父母的目標是孩子站穩，不是離不開。"],["n","1. ★ 說一個你小時候生病時被家人照顧的記憶：是誰？是一碗粥、一條毛巾，還是一個整晚沒睡的背影？"],["n","2. ★★★ 保羅「可以叫人尊重」，卻選擇像母親一樣捂熱孩子。請用一句話說：為甚麼有權柄的人放下權柄才叫謙卑，沒有權柄的人不擺架子不算？"],["n","3. ★★ 2:4 說不是要討人喜歡，可是保羅又極在乎人。請各舉一個例子：在教會或職場裡，甚麼樣的在乎是愛，甚麼樣的討好是怕？"],["n","4. ★★ 2:12 說孩子要對得起的是神，3:8 說目標是孩子靠主站穩。照這兩節，一位好的屬靈父母和一位控制人的領袖，最大的差別在哪裡？"],["m","帶領提醒：讀 2:6–9 時請一口氣讀完，先停在那幅畫上，不要急著談我們的理念；談到 2:14–16 時，不容許任何貶低民族的話。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一位餵過自己的人，看見自己現在是在餵人、等人餵，還是抓住人，並說出這一週要去餵的那一個人。"],["t","【看】看見自己"],["n","5. ★★★ 說出你信主以後第一個餵你的人：他叫甚麼名字、做了甚麼？再說出你現在比較像哪一種：在餵人、一直等人來餵，還是帶人帶到不肯放手？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 2:7–8 兩遍，第二遍讀完，說出一個最打動你的詞，以及神透過這個詞對你說了一句甚麼話。"],["t","【想】想通關卡"],["n","7. ★★★ 你不肯去餵人，或放不下帶過的人，卡在哪裡：覺得自己不夠格、怕被拒絕、怕不再被需要，還是曾被屬靈權柄傷過？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我是被餵過的人，那道在我心裡運行；這一週我要把自己給出去，不是為了被需要，是為了他站穩。」右手邊的人只回一句「主看見你」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要去餵的那一個人：他的名字、哪一天、在哪裡、做甚麼，例如吃一頓飯、一起讀一章聖經，以及你見面要說的第一句話。"],["m","帶領提醒：這一化可能碰到被屬靈權柄控制、被家人趕出家門或家庭傷害的經驗；不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」。若有人說出正處在危險或控制裡，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：叫出一個名字、放下一次分量、謝謝一位餵過你的人、帶一個人站穩，並把這一課講出去。"],["n","10. ★★ 說出一位你在小組或團契裡叫不出名字的人，這一週哪一天、在哪一個場合，你要主動問他的名字，並記在禱告本上？"],["n","11. ★★ 若你是主管、父母或資深同工，說出這一週你要把哪一件可以命令的事改成邀請：對誰、哪一天、要怎麼開口？"],["n","12. ★ 說出一位曾經餵過你的人，這一週哪一天你要打電話或寫卡片給他，具體謝謝他做過的哪一件事？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要陪他站穩的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：那道實在是神的，會在他心裡運行。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，耶穌有一切的權柄，卻為我們捨了性命。第二句，最早的基督徒照著他的樣子，不靠身分壓人，像母親捂熱孩子一樣愛人。第三句，我也被這樣愛過，所以想陪你走一段。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多關心人」這類答案；正在耗竭的組員，鼓勵他這一週先找人分擔，不再加擔子。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要叫出名字、要去餵的那一個人是誰。可以只說關係。"],["p","然後為三種人指名代禱：一位因信主被家人反對、覺得自己像孤兒的人；一位帶人帶到累的屬靈母親或父親，求主先餵飽他；一位曾被屬靈領袖傷害、不敢再進教會的人，求主醫治他，為他預備安全的屬靈家人。"],["p","散會以前，確認紙上寫了三樣：要去餵的那一個人、要謝謝的那一個人、你的那個「2」。下次帶來對。"]]},"3":{"no":3,"vol":"《321帖撒羅尼迦前書講義》第三課·帖撒羅尼迦前書第三章","title":"我們就活了——忍、穩、增","chars":5212,"min":60,"deep":8,"dchars":1704,"tchars":1438,"blocks":[["h","一、你上一次說「我活過來了」"],["p","弟兄姊妹平安。你上一次鬆一口氣、說「我活過來了」，是為了甚麼？是為了自己的事，還是為了一個人？先不要回答，在心裡停十秒鐘。"],["p","很多人的答案是自己的事：體檢報告沒事，裁員名單上沒有自己的名字。這很正常，也值得感謝。可是有些人的答案是一個人：孩子半夜的班機落地，手機跳出兩個字「到了」；那個你帶過、後來去外地讀書的年輕人，在朋友圈貼了一張主日聚會的照片。那一刻你才發現，原來自己的一口氣，一直掛在他身上。"],["p","帖撒羅尼迦前書第三章，就有一個人為了別人活過來：「你們若靠主站立得穩，我們就活了。」（3:8）這是全卷的樞紐，前半卷回憶與等待，後半卷教導與勸勉。全卷五章是一個孩子的成長：歸、養、穩、聖、醒。第一章孩子出生，第二章孩子被餵，到了第三章，孩子自己站起來了。這一課用三個字走完這一章：忍、穩、增。"],["p","先用書信三問的第一問：帖撒羅尼迦人遇到甚麼？本系列使徒行傳講義第 17 章講過，這是一間只有三個安息日大的教會。暴動的人闖進耶孫的家，弟兄們連夜把保羅送走；到了庇哩亞又起風波，他被送到雅典。創辦人走了，鄰居還在逼迫。保羅呢？他說：「我們既不能再忍，就願意獨自等在雅典」（3:1）。"],["p","「不能再忍」，原文 μηκέτι στέγοντες。στέγω 和「屋頂」同一個字根，屋頂的工作是擋住風雨、承受得住。保羅說：我心裡那一片屋頂，撐不住了。寫下全卷最穩那一句話的人，先承認自己撐不住了。可是撐不住的他，做了一件很奇怪的事：把身邊唯一的同伴送走。原文的「獨自」μόνοι 放在句子的最後一個字，最重。孤單是他自己付的代價，好讓那群孩子不孤單。"],["p","被送去的是誰？「打發我們的兄弟在基督福音上作神執事的提摩太前去，堅固你們，並在你們所信的道上勸慰你們」（3:2）。和合本作「作神執事的」，SBLGNT 作 συνεργὸν τοῦ θεοῦ，神的同工；和合本的小字註腳也記著另一讀。多數學者以「同工」為原文，議題頁有整理，講台上照和合本讀無妨。提摩太去做兩件事：στηρίξαι，撐住、使站穩；παρακαλέσαι，「旁邊」加上「呼喚」，走到一個人旁邊，叫他的名字。受苦的人最先需要的，常常不是一段經文，是一個被打發來的人。"],["d",["3:2 和合本作「作神執事的」，原文卻可能是「神的同工」，這會不會表示和合本不可靠？","不會。和合本自己在註腳就記著另一讀，這是誠實，不是錯誤。新約的抄本多到可以彼此對照，抄寫時產生的不同讀法能被找出、被陳列；3:2 有三種傳統：同工、執事、兩個並列。學者判斷的原則是：哪一個讀法最能解釋其他讀法怎麼來。「神的同工」很大膽，抄寫的人容易改成較保守的「執事」，反過來就很難想像，所以多數學者以「同工」為原文。可是兩種讀法都說提摩太是在基督福音上服事神的人，沒有任何一條教義因此改變。若有朋友問你，可以和他一起翻開和合本的註腳。"]],["h","二、被安放，不是被丟下"],["p","提摩太去，是為了一件事：「免得有人被諸般患難搖動。因為你們自己知道，我們受患難原是命定的。」（3:3）「搖動」是 σαίνεσθαι，全本新約只用了這一次，原來是說一隻狗對著主人搖尾巴，引申為被好話哄動。苦難從外面搖，諂媚從旁邊哄。有人說：回來吧，拜一拜又不會怎樣。保羅在意的是「沒有一個人」被搖走；他數的是人頭，不是平均值。"],["p","然後是這一章最重、也最容易被用錯的一句：命定。原文 κείμεθα，意思是「被安放」，我們被放在這個位置上。被安放，就有一位安放的人；他知道你在哪裡。接著保羅說：「我們在你們那裡的時候，預先告訴你們，我們必受患難，以後果然應驗了，你們也知道。」（3:4）「預先告訴」是未完成式，一說再說。主耶穌也說過：「在世上，你們有苦難」（約 16:33）。信耶穌，不保證一帆風順；可是保證你不是一個人受苦。帖撒羅尼迦人不是因為信心不夠才受苦，是因為信了才受苦；這一章直接反駁成功神學。"],["p","這裡我必須說得很清楚。3:3 的患難，是為福音受的苦，是因為信主、跟隨基督而來的壓力。它不是家暴、虐待、職場霸凌，或任何讓你身心處在危險裡的關係。若有人對一位被配偶打的姊妹說：這是你命定要受的，回去忍耐吧。那不是這一節經文，那是把一節經文變成一道鎖。保羅說完命定，接著做的不是叫人忍，是打發提摩太去堅固、勸慰。如果你今天就在這樣的處境裡，離開危險、尋求保護，找信得過的人和專業與法律的幫助，不是沒有信心。"],["p","這一節也沒有叫人去找苦吃，沒有叫人去激怒官府、和家人吵翻來證明信心。苦難不是勳章，不必去找；它來了，就不必驚慌，因為它沒有在神的手外面。"],["p","第五節是本章地勢最低的一節：「為此，我既不能再忍，就打發人去，要曉得你們的信心如何，恐怕那誘惑人的到底誘惑了你們，叫我們的勞苦歸於徒然。」（3:5）他怕的不是人數變少，是信心如何。逼迫從前門打進來，那誘惑人的從後門溜進來，在人最累、最孤單的時候說：放棄吧。真信徒會不會離開信仰？議題頁並陳各家；可是保羅在這裡沒有給理論，他給的是一個父親的反應：打發人去。不要讓任何一個人，獨自面對試探。"],["d",["3:3 說受患難是命定的，那我在家裡被打、被罵，是不是也應該忍下來？","不是。3:3 的患難，是為福音、為跟隨基督而來的壓力，它不是家庭暴力、性暴力、虐待或職場霸凌。保羅說完命定，緊接著做的是打發提摩太去堅固、勸慰，他沒有叫人留在危險裡。如果你此刻在家裡不安全，請先保護自己和孩子：告訴一位信得過的人，聯絡當地的保護專線或社工，必要時報警、尋求法律協助。這不是沒有信心，也不是不愛家人。若有長輩對你說這是你的十字架，你可以溫和地說：謝謝你，但這不是聖經的意思。"]],["d",["我身邊有一位曾經很熱心、後來離開教會的朋友，我該怎樣看他？還要不要去找他？","要去找他，但不必先替他的永恆下結論。真信徒會不會離開信仰，永蒙保守說和可能失落說各有經文，議題頁並陳，兩派都是弟兄。可是兩派都同意保羅在 3:5 做的那件事：打發人去，要曉得他的信心如何。所以這一週你可以傳一則訊息給他，不是勸他回來聚會，也不是辯論，只是說：最近想起你，你好嗎？若他願意說，就聽他為甚麼離開。不要說他被撒但抓走了，也不要說他從來沒有得救；把他交在信實的神手中，然後做提摩太。"]],["h","三、原文亮光：報好消息、站住、補網"],["p","接著，作坊的門打開了。「但提摩太剛才從你們那裡回來，將你們信心和愛心的好消息報給我們」（3:6）。第一個字是「報給我們」：εὐαγγελισαμένου。這就是「傳福音」那個字。當初保羅把福音帶到帖撒羅尼迦；如今提摩太把帖撒羅尼迦的福音帶回給保羅。一間教會還站著，本身就是一個福音。"],["p","可是請留意這份報告少了一樣。第一章說的是信、愛、望三根柱子，提摩太報了信心，報了愛心，盼望沒有報。為甚麼？到第四章就明白：教會裡有人過世了，他們不知道死了的人在主來的時候會怎樣。保羅沒有責備，他先禱告，再慢慢教。"],["p","於是保羅說：「所以，弟兄們，我們在一切困苦患難之中，因著你們的信心就得了安慰。」（3:7）第二節，提摩太是去勸慰他們的；第七節，卻是保羅自己得了安慰，同一個字。本來是父母安慰孩子，現在是孩子安慰了父母。困苦還在，他心裡卻有了一口氣。"],["p","第二個字是「站立得穩」：ἐὰν ὑμεῖς στήκετε。στήκω 是站住、站定。這裡有一個文法上的小驚喜：ἐάν 平常接假設語氣，這裡卻接直說語氣。它同時是一句喜訊——既然你們正站著；也是一個邀請——只要你們繼續站著。所以 3:8 不是父母對孩子說：你要是倒下，我就活不成了，把大人的情緒壓在孩子肩上。它是一個父親聽見好消息時的歡呼，然後溫柔地說：繼續在主裡站著。"],["p","「我們就活了」，原文 νῦν ζῶμεν：現在，我們活了。不是從今以後，是消息進門的這一刻。再看站著的是誰：「你們」。保羅不在，提摩太也走了，沒有人扶著他們，他們自己站著。屬靈父母最大的成就，不是孩子離不開你，是你不在的時候，他們仍然站得住。還有兩個字不能漏：「靠主」，原文是「在主裡」。站得穩，不靠腿力，靠地面；孩子站立的地面是主，不是保羅。"],["p","好消息之後，保羅沒有說這樣就夠了。他先感謝：「可用何等的感謝為你們報答神呢？」（3:9）孩子站穩了，功勞不在父母，在托住地面的神。然後他說：「我們晝夜切切地祈求，要見你們的面，補滿你們信心的不足。」（3:10）第三個字是「補滿」：καταρτίσαι。這是補網、接骨的字；「不足」ὑστερήματα 是複數，好幾個洞。漁夫看見網破了，不會罵網，他坐下來，一個洞一個洞地補。站穩了，也有缺口，兩件事同時成立。補網的次序是：先感謝，再禱告，再去見面。"],["d",["3:8 保羅說孩子站穩他就活了，那作父母、作帶領人的，可以把自己的喜樂掛在別人身上嗎？","可以掛念，但不可以壓在別人肩上。保羅的「我們就活了」是聽見好消息時的歡呼，不是事先的要求；原文 ἐάν 接直說語氣，是喜訊兼邀請，不是威脅。分辨的方法很簡單：你的掛念，是叫對方更自由地在主裡站著，還是叫他更怕讓你失望？若你常說「你這樣我會很傷心」、「你不聽我的就是不孝」、「你不來聚會我就白帶你了」，那已經從掛念變成控制。保羅的做法是放手：他不在場，提摩太也走了，孩子靠主自己站著，他反而最高興。這一週可以練習對孩子說：你自己決定，我為你禱告。"]],["d",["我的信心常常破洞，禱告很久沒有答案，是不是表示我的信心不夠、神不喜悅我？","信心會不足，這是真的；可是信心不足不等於罪，也不等於神不喜悅你。保羅在同一章裡稱讚帖撒羅尼迦人靠主站立得穩，又說他們的信心有不足；站穩和有缺口，可以同時是真的。他用的是補網、接骨的字，他的回應是感謝、晝夜禱告、想去見面，不是寫信罵人。福音書裡那位父親說：「我信！但我信不足，求主幫助。」（可 9:24）主耶穌沒有趕他走，醫好了他的孩子。所以你可以把這句話當成今天的禱告。找一位信得過的人，請他陪你讀經、為你禱告一個月；補網是兩個人一起做的事。"]],["h","四、交出去的路，漲起來的愛"],["p","第三章最後三節，保羅不再對帖撒羅尼迦人說話，他轉過身，向神說話：「願神－我們的父和我們的主耶穌一直引領我們到你們那裡去。」（3:11）上一章他才說：「我－保羅有一兩次要去，只是撒但阻擋了我們。」（2:18）他試過，不只一次，都沒成功。到了這裡，他不再說我要再試一次，他把這條路交出去。「引領」κατευθύναι 是把路修直：被攔住的路，交給神修直。"],["p","這一節還藏著一件大事。主詞有兩個，神我們的父，和我們的主耶穌；動詞卻只有一個，而且是單數。這不能單靠文法證明三一論，可是在新約最早的書信之一裡，保羅已經毫不猶豫地把耶穌放在獨一真神的身邊，一同開路。禱告的答案有時是「是」，有時是「等」。"],["p","接著他為一間被逼迫的教會求甚麼？「又願主叫你們彼此相愛的心，並愛眾人的心都能增長，充足，如同我們愛你們一樣」（3:12）。不是求逼迫的人受報應，是求他們的愛多起來。「增長，充足」是兩個意思很近的字疊在一起：πλεονάσαι καὶ περισσεύσαι，像水漲了又漲，漫過堤岸。愛有兩個方向：彼此，也眾人。眾人包括誰？包括闖進耶孫家的鄰居，包括罵他們背祖的親戚。可是愛眾人，不等於讓人一直傷害你，也不等於放下信仰去參加拜偶像的儀式。"],["p","最後一節：「好使你們當我們主耶穌同他眾聖徒來的時候，在我們父神面前，心裡堅固，成為聖潔，無可責備。」（3:13）「心裡堅固」又是 στηρίξαι。第二節提摩太被打發去堅固他們，第十三節保羅求主堅固他們的心：這一章從人去堅固開始，在主親自堅固結束。「無可責備」緊接在信心的不足之後，所以它不是說從來沒有破洞，是補好了，站穩了，那一天可以抬起頭來。「眾聖徒」指天使還是已睡了的信徒，各家看法不同，議題頁有陳列。這裡沒有日子和時間表；主來是應許，不是恐嚇。保羅去不了，只能打發人去；可是有一位，不打發別人，他要親自來。"],["d",["3:12 要我愛眾人，可是傷害過我的人也算在裡面嗎？我是不是要和他和好、繼續來往？","愛眾人是真的包括仇敵；保羅為一間被鄰居逼迫的教會禱告，求的就是他們的愛漫過堤岸，漫到闖進耶孫家的人身上。可是愛眾人不等於讓人一直傷害你，也不等於界線消失。你可以為傷害你的人禱告，求神讓他悔改，同時不和他同住、不單獨見面、保留法律的保護。饒恕是一段路，不是一句馬上要說出口的話；和好需要對方真實的悔改和改變，而且要在安全的情況下才談。若有人催你立刻原諒、立刻回去，這不是 3:12 的意思。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是用 3:3 叫受害者回去忍耐：這是你的十字架，命定要受的。3:3 的患難是為福音受的苦，不是家暴、性暴力或職場霸凌；保羅打發提摩太是去堅固人，不是勸人留在危險裡。把這一節拿去綁住受害者，可能延誤到危及生命。"],["p","第二個偏差，是浪漫化逼迫：沒有被逼迫的就不是真基督徒，受苦越多越屬靈，甚至鼓勵新信徒去激怒家人、挑戰官府，好證明自己的信心。保羅說患難不是意外，卻從沒有叫人去找苦吃；苦難不是勳章，也不是屬靈等級。"],["p","第三個偏差，是成功神學和它的反面：真信的人一定健康、發財、一帆風順；你病沒好、孩子不信、生意不順，就是信心不足或有隱藏的罪。保羅預先告訴他們必受患難；他說的「不足」用的是補網的字，回應是感謝和禱告，不是論斷。"],["p","第四個偏差，是用 3:8 情緒勒索：你們不來聚會、不服事，我就活不下去了；或要求門徒凡事向帶領人報告、離不開帶領人。3:8 是喜訊兼邀請，孩子是靠主站穩，不是靠保羅。屬靈父母的目標是孩子在父母不在時站得住，不是控制。"],["p","第五個偏差，是用 3:5 給離開的人貼標籤，或用 3:13 恐嚇人：他就是被撒但抓走了，他從來沒有得救；主隨時會來，你現在還有一點不聖潔就要被留下。保羅沒有下斷語，也沒有恐嚇，他打發人去；3:13 的主詞是主，是主親自堅固人的心。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：家族裡第一個信主的人。過年回家，不去上香，長輩一句「你不要祖宗了」，整桌的人都安靜下來。3:3 告訴這位弟兄：這不是意外，你沒有信錯；3:12 又告訴他：愛要漲過堤岸，漫到罵你的人身上。所以不要對打，用一個改變的生命回答：更孝順，更體貼，更願意回家吃飯。你可以不上香，但可以在祭祖的日子帶著花回去，記念、感恩，說出你為這位先人感謝神的地方。孝順，就是你最好的見證。若家裡已經不安全，就先找一位信得過的人說出來。"],["p","第二個問題：報喜不報憂。我們從小學會，有事自己扛，家醜不可外揚；當父母的、當小組長的、當傳道的，更覺得自己不可以倒。於是撐不住的時候，臉上還在笑，群組裡還在回「感謝主」。保羅剛好相反，他在一封要當眾念的信裡寫：我不能再忍了。一間健康的教會，是一位帶領人說出「我撐不住了」以後，大家不是急著勸他要有信心，而是有人被打發到他旁邊。"],["d",["我是家裡第一個信主的，過年祭祖不上香，家人說我不孝，我該怎麼辦？","先記得 3:3：這不是意外，你沒有信錯；也記得 3:12：你的愛要比以前更多。具體可以做三件事。第一，不在飯桌上辯論，私下找一位比較能談的家人，溫和地說：我不上香，不是不記得祖先，是我只敬拜一位神。第二，在祭祖的日子照樣回家，幫忙準備、打掃、陪長輩說話，帶一束花，說出你為這位先人感謝神的事；不拜偶像，但盡孝、記念、感恩。第三，平日比以前更孝順：更常回家、更常打電話、主動分擔家用。改變的生命，比任何辯論都有說服力。若家人的反對已經變成暴力或威脅，先保護自己的安全，告訴一位信得過的人。"]],["h","七、活出321——站立的地面是主"],["p","經文說完了它自己的話，我們國度321空中團契才接上去。全卷五個字：歸、養、穩、聖、醒；走到這一章是「穩」。"],["p","耶穌是我的榜樣：主耶穌也有撐不住的夜晚。在客西馬尼，他說「我心裡甚是憂傷，幾乎要死」（太 26:38），他沒有假裝剛強，他要門徒陪他警醒。他也是先為人的信心禱告的那一位，他對彼得說：「但我已經為你祈求，叫你不至於失了信心。你回頭以後，要堅固你的弟兄。」（路 22:32）那個「堅固」，就是提摩太被打發去做的事。"],["p","聖經是我的準則：讀 3:3 的「命定」，一定連著 3:2 的「堅固」和「勸慰」一起讀；讀 3:8 的「活了」，一定連著「靠主」一起讀。次序對了，經文才不會被拿去替壓迫或控制背書。"],["p","聖靈是我的引導：這一週，誰是我該被打發去的那一位？哪一件撐不住的事，是我該說出來的？求聖靈給我們分辨和開口的勇氣。"],["p","讓耶穌作王：這一章要人讓出兩個位子。第一個是「撐住大家的那個人」，保羅承認撐不住，把唯一的同伴差出去，等於說堅固他們的不是我。第二個是「這條路由我來開」，他把被攔住的路交給父與子修直。讓耶穌得著一切的榮耀：孩子站穩了，保羅第一個反應不是誇自己的牧養，是問「可用何等的感謝為你們報答神呢？」（3:9）"],["p","建立屬神的體系：保羅沒有說我不在，你們自己保重；他建立了一條來回的線：打發一個人去，帶回消息，晝夜禱告，寫一封信。提摩太是 321「235」裡那個「2」，不是跑腿，是同工。這也是 5:11「彼此勸慰，互相建立」的運作方式。今天一個健康的體系，至少要有幾樣：每一位剛信主的人身邊有一位提摩太；每一位帶領人也有一個可以說撐不住的地方。"],["h","八、四種心，各怎樣站"],["p","驕傲型的心，想當那個撐住大家的人。我帶過的人站穩了，我偷偷失落；他跌倒了，我先想到我的勞苦白費了。這一章對你說：孩子是靠主站著，不是靠你；你的喜樂若建立在人需要你，你會不知不覺讓人離不開你。"],["p","恐懼型的心，怕的事很多：怕家人翻臉，怕自己哪一天也離開信仰，怕主來的時候自己不夠好。這一章對你說：你被安放在一個神看得見的位置上；把你的怕說出來，讓一位提摩太來陪你；那位要來的主，是親自堅固你的心的那一位。"],["p","羞恥型的心，覺得自己的信心破了好幾個洞，不配坐在這裡。也許是禱告了很久還沒有答案，也許是一次跌倒。請聽 3:10：保羅用的是補網的字。站穩和有缺口，可以同時是真的；補網的漁夫不會罵網。"],["p","受傷型的心，也許曾經在家裡受傷害，卻被長輩勸「這是你的十字架」；也許生病、失業時聽見「你信心不夠」。這一章不是要你回到危險裡，也不是要你先原諒誰。今天你不必勉強說沒事。若你此刻身處危險，或已經很久睡不著、吃不下、覺得沒有指望，請先告訴一位信得過的人，讓人陪你找到安全和專業的幫助。"],["d",["我是小組長，其實已經撐不住了，可是不敢說，怕組員失望，我該怎麼辦？","請你先聽保羅說的：「我們既不能再忍，就願意獨自等在雅典」（3:1）。寫下全卷最穩那一句話的人，先承認自己撐不住了；他也因為孩子的好消息，才活過來。帶領人也是需要被安慰的人。這一週可以做三件事：第一，找一位你信得過的同工或牧者，把那一句話說出來，不必包裝；第二，和他商量，把一兩件服事暫時交出去，或者請人代帶一次小組；第三，若你已經連續好幾週睡不好、吃不下、提不起勁，請預約醫生或諮商，那不是信心不夠。你的組員反而會學到：在屬神的家裡，撐不住是可以說的。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，想一位最近在苦中、而你很久沒有聯絡的弟兄姊妹。這一週不要只轉一段經文，打一通電話，或約他喝一杯茶，坐在他旁邊，問一句：你的信心最近怎麼樣？然後聽完。"],["p","第二，做那個把好消息帶回去的人。寫一段話給帶你信主、或在你最難時陪過你的人，不只是謝謝你，而是說出這一年你在哪一件事上還靠主站著。"],["p","第三，若你自己正撐不住，這一週就把這段話改成「我現在撐不住了」，傳給一位信得過的人。若已經連續兩個禮拜睡不好、吃不下，就預約一次門診或諮商；承認極限不是信心不夠。"],["p","第四，若你是家裡第一個信主的人，這一週做一件更孝順的事：回家吃一頓飯，陪父母說一次話，分擔一件家務；不辯論，讓改變的生命替你說話。"],["p","第五，拿出一張紙，寫下一條你被攔住的路：想見卻見不到的人、想修卻修不好的關係。每天晚上讀一次 3:11–13，把它交給父與子，然後做一件手上能做的事。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我受的苦不是意外，我被安放在神看得見的地方；我不是一個人受苦。"],["p","我宣告：我可以說我撐不住了，承認極限不是沒有信心；神會差人到我身邊。"],["p","我宣告：我站立的地面是主，不是我自己，也不是任何一位帶領人；我的信心有缺口，可以被補。"],["p","我宣告：我要做一個被打發去的人，讓愛漲過我的家門口，等候那一位親自要來的主。"],["h","十、結語"],["p","我們回到開頭那個問題：你上一次鬆一口氣、說「我活過來了」，是為了甚麼？如果你的答案是一個人，你已經懂得 3:8 了。願這一課以後，你的答案裡多一個名字：一個你被打發去陪伴、後來在主裡站穩的人。"],["p","這一課的焦點，不在保羅有多會牧養，也不在我們能撐多久。焦點在那一位托住地面的主：他把受苦的人安放在他看得見的地方，他差人去堅固、勸慰，他把被攔住的路修直，他叫愛漲過堤岸；最後，他不打發別人，他要親自來，看見他的孩子心裡堅固，站在父面前。你不必更佩服保羅，你只要更想念那一位要來的主。"],["p","我們一起低頭禱告。親自要來的主耶穌，謝謝你在我們撐不住的時候，差人來到我們旁邊。求你赦免我們假裝剛強，也赦免我們用一句「這是你命定的」或「你信心不夠」，把受苦的人推得更遠。保守正在被家人反對的弟兄姊妹，讓他們站得穩，也更會愛家人；保護家裡不安全的人，讓他們有勇氣和管道尋求幫助；扶持撐不住卻不敢說的帶領人。補滿我們信心的不足，叫我們彼此相愛、愛眾人的心增長充足，直到你來的那一天。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最剛強，是讓每一個人說出自己的一口氣掛在誰身上、最接近撐不住的那一件事，以及這一週要被打發去的那一個人；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是忍、穩、增。席上可能有家族裡第一個信主、正被家人反對的人，也可能有家裡不安全的人，或撐不住卻不敢說的帶領人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：3:3 的患難是為福音受的苦，不是家暴；3:8 是喜訊兼邀請，孩子站立的地面是主；3:10 的信心不足可以補，不是罪名。"],["n","1. ★ 你上一次鬆一口氣、說「我活過來了」，是為了甚麼？是為了自己的事，還是為了一個人？"],["n","2. ★★★ 請用自己的話說出：3:3 的「命定」和「回去忍耐」差在哪裡？保羅說完命定，接著做了甚麼？"],["n","3. ★★ 3:2 提摩太去勸慰他們，3:7 卻是保羅得了安慰。這個方向倒過來，對長輩和年輕人各說了甚麼？"],["n","4. ★★ 漁夫補網不罵網。讀完 3:10，你會怎樣對一位覺得自己信心不夠的朋友說話？"],["m","帶領提醒：第一題輕鬆帶，每人一分鐘；討論 3:3 時若有人提到家裡的狀況，不在組裡追問，只說謝謝你告訴我們，會後再單獨關心。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己最接近撐不住的那一件事，說出口，並寫下這一週要走的一步。"],["t","【看】看見自己"],["n","5. ★★★ 現在你生活裡最接近「不能再忍」的是哪一件事？從甚麼時候開始的？這件事，你身邊有幾個人知道？說出一個數字，或者說還沒有人知道。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 3:7–8 兩遍，第二遍把「你們」換成你自己的名字。你聽見主在說你站立的地面是甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你為甚麼一直沒有把那一件撐不住的事說出來？是怕被說信心不夠、怕別人失望，還是不知道能說給誰聽？不必說細節。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我也有撐不住的地方，可是我站立的地面是主。」右手邊的人只回一句「你不是一個人」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要走的一步：哪一天、用甚麼方式，把那件事告訴哪一位信得過的人；若它已經壓了你超過兩個禮拜，再寫下你要預約門診或諮商的日子。"],["m","帶領提醒：這一化可能碰到家庭暴力、家人反對、長期無望感或想放棄信仰的掙扎。不追問細節，不要求任何人原諒誰或回去和好，不對正在流淚的人說「你要有信心」或「這是你命定的」；若有人說出正處在危險中，或有傷害自己的念頭，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個要陪的人、一則好消息、一個要帶的人。"],["n","10. ★★ 說出一位最近在苦中、而你很久沒有聯絡的弟兄姊妹的名字。這一週哪一天，你要打電話或約他喝茶，坐在他旁邊問一句：你的信心最近怎麼樣？"],["n","11. ★★ 帶你信主、或在你最難時陪過你的人叫甚麼名字、現在住在哪裡？這一週哪一天，你要用甚麼方式告訴他：這一年我在哪一件事上還靠主站著？"],["n","12. ★ 如果你是家裡第一個信主的人，說出這一週你要做的一件更孝順的事：哪一天回家、陪誰、做甚麼。如果不是，說出一位你可以為他禱告的這樣的人。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、剛信主或正撐不住的那一個人。當場說出他的名字，說出這一週哪一天你要去他旁邊坐一坐，並向他分享：你被安放的地方，神看得見。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，我讀到一封兩千年前的信，寫信的人承認自己撐不住了，卻把唯一的同伴送去陪一群受苦的朋友。第二句，後來同伴帶回消息說那群人還站著，他說了一句：你們若站立得穩，我們就活了。第三句，我發現信耶穌不保證不受苦，卻保證受苦的時候不是一個人，所以我想問你：你最近好嗎？這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多關心」這類答案；談到家人反對時，不鼓勵任何人去和家人對抗，若有人家裡不安全，先談安全，再談見證。"],["s","收尾（5分鐘）"],["p","請每人用一句話說：這一週我要去陪誰，或要把撐不住的事說給誰聽。"],["p","然後彼此代禱，為三種人指名禱告：一位家族裡第一個信主、正被家人反對的人，求主讓他站得穩，也更會愛家人；一位家裡不安全的人，求主保護他，讓他有勇氣和管道尋求幫助；一位撐不住卻不敢說的牧者或小組長，求主差一個提摩太到他身邊。"],["p","散會以前，確認紙上寫了三樣：要去陪伴的人、要寫好消息的對象、你的那個「2」。下次帶來對。"]]},"4":{"no":4,"vol":"《321帖撒羅尼迦前書講義》第四課·帖撒羅尼迦前書第四章","title":"睡了，還會醒——聖、靜、遇","chars":5227,"min":60,"deep":8,"dchars":1630,"tchars":1386,"blocks":[["h","一、人死如燈滅，差在哪裡"],["p","弟兄姊妹平安。人死如燈滅，這五個字，很多華人長輩都會說。在醫院的走廊，在出殯的車上，有人嘆一口氣：唉，人死如燈滅，甚麼都沒有了。說這句話的人，常常只是太累了，用這五個字，把一個太大的問題關起來。"],["p","這句話很誠實：燈滅了，屋子就暗了，你叫他，他不會應。可是今天，我想請你把它和保羅的一句話並排放：「論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣。」（4:13）保羅沒有說滅了的人，他說睡了的人。燈和睡，差了三個地方。第一是結局：燈滅了，就是滅了；睡著的人，會醒。第二是有沒有人來：燈滅了，屋子裡沒有人管；睡著的人，有一位會親自來叫醒他。第三是今天怎麼活：如果人死如燈滅，那麼燈還亮著的時候，身體怎麼用、日子怎麼過，都只是趁現在；如果死只是睡，這個身體、這雙手、這一段路，都要帶到一個早晨，去見一個人。"],["p","所以這一章有一個小小的驚訝：保羅講墳前以前，先講走路。這一課用三個字走完第四章：聖、靜、遇。聖，是身體怎樣走；靜，是雙手怎樣做工；遇，是在墳前，也在空中，我們要遇見誰。"],["p","先用書信三問的第一問：帖撒羅尼迦人遇到甚麼？本系列使徒行傳講義第 17 章講過，這間教會只有三個安息日大，保羅就被連夜送走。留下來的人住在一座性很隨便的港口城；有人覺得主快來了，何必上班；然後，教會裡第一次有人過世了。他們心裡的問題，和每一個華人家庭一樣：他還在嗎？我們還會見面嗎？"],["p","保羅這一章的第一句是：「弟兄們，我還有話說：我們靠著主耶穌求你們，勸你們」（4:1）。要談身體、工作、死亡這三件最難的事，他先叫一聲弟兄。這一卷書寫的是一個孩子長大：出生、被餵、站起來，到第四章，學走路。教孩子走路的人，手上不拿扣分表。"],["d",["「人死如燈滅」不對，那麼基督徒死了以後，到復活之前在哪裡？是靈魂睡著了嗎？","保羅用「睡」說死，是要說死不是終點，會醒；這個字講的是結局，不是在描寫死後的知覺。他在別處說：「情願離世與基督同在，因為這是好得無比的」（腓 1:23）；4:14 也說神要把睡了的人「與耶穌一同帶來」，暗示他們現在已經與主同在。教會歷史上也有「靈魂睡眠」的看法，議題頁有並陳。本講義的落點是：死亡沒有把在主裡的人從耶穌裡面拿走，他們不是孤魂，也不需要後人供奉才能安息。你可以這樣對孩子說：阿公在耶穌那裡，等耶穌回來，他的身體也會醒過來。"]],["h","二、學走路：聖潔包括身體"],["p","「知道該怎樣行可以討神的喜悅，就要照你們現在所行的更加勉勵。」（4:1）「行」這個字是 περιπατεῖν，就是走路。請留意保羅插的那一句：照你們現在所行的。意思是，你們已經在走了。孩子搖搖晃晃跨出一步，父親不會說走得真差，他會拍手，然後說：再來一步。「更加勉勵」，原文是滿出來；走得好的孩子，被邀請走得更遠。"],["p","然後是一句很多人找了一輩子的話：「神的旨意就是要你們成為聖潔，遠避淫行」（4:3）。我們為神的旨意禱告，常常問的是念哪一科、換哪一份工作、跟誰結婚。這封信直說「神的旨意」只有兩次，這裡一次，第五章「凡事謝恩」一次；兩次都不是告訴你要去哪裡，而是告訴你要成為誰。而這個成為，包括身體。在一座趁燈還亮、及時行樂的城裡，保羅說得很直接：「淫行」涵蓋婚姻以外一切的性。今天的帖撒羅尼迦在每一支手機裡，教會要講，而且要講清楚。根在哪裡？「不放縱私慾的邪情，像那不認識神的外邦人。」（4:5）一個人不認識神，慾望就成了他的神。"],["p","第四節的「身體」，原文 σκεῦος 是器皿，歷代有兩種讀法：和合本讀作自己的身體，也有人讀作娶妻，議題頁兩種都有整理。兩種讀法的落點一樣：「要你們各人曉得怎樣用聖潔、尊貴守著自己的身體」（4:4）。性不是拿來用的，是放在尊重裡的。身體不是骯髒的，所以要被尊重；配偶也不是一件器具，是一個要被敬重的人。"],["p","第六節翻轉了很多人的想像：「不要一個人在這事上越分，欺負他的弟兄」（4:6）。ὑπερβαίνειν 是跨過一條不該跨的線，πλεονεκτεῖν 是多拿，拿走不屬於你的。這是講不公義的字，不是講髒的字，所以這一節也包括用職位、年紀、權勢得來的性。我要說得很清楚：錯在越界的那一方；被侵害的人，不是不聖潔的人。「主必報應」原文是 ἔκδικος，主是伸冤者，這句話先是對受害的人說的：你的冤屈，神看見了。若你有一段說不出口的經歷，聚會後可以單獨找一位信得過的同工；我們會先相信你，陪你，也協助你找專業與法律的幫助。"],["p","那麼，一個孩子怎樣學會聖潔地走路？「所以，那棄絕的，不是棄絕人，乃是棄絕那賜聖靈給你們的神。」（4:8）保羅在這裡把自己移開：這不是保羅的規矩，所以這一節不能拿來說「你不聽我，就是不聽神」。「賜」是 διδόντα，現在式，一直在賜。反覆跌倒的人要聽見的不只是你要努力，還有：那要你聖潔的神，今天還在給。"],["d",["我曾經被人侵害，到今天還覺得自己髒，4:3 說的「淫行」是在說我嗎？","不是。4:6 說的是「越分，欺負他的弟兄」：跨過界線、拿走別人東西的，是越界的那一方。你是被拿走東西的人，不是不聖潔的人，不需要為別人的罪悔改。那種髒的感覺是真實的，但它不是神對你的判決；主在這裡是伸冤者，他站在你這一邊。你不必在小組裡說任何細節，也不必因為有人說要饒恕，就急著原諒或和好。請找一位信得過的牧者或輔導陪你；若事情還在發生，或對方仍能接觸你或別人，先求安全，教會應該協助你尋求專業與法律協助。"]],["d",["我在色情上反覆跌倒，悔改了又跌，是不是神已經放棄我了？具體可以怎麼做？","4:8 說神是「那賜聖靈給你們的神」，原文是一直在賜；他沒有在你第一次跌倒時就把聖靈收回。保羅說的是學走路，跌倒是學步的一部分。具體可以做四件事。第一，找出你的時段與地點，多半是深夜、一個人、累了或受了委屈的時候，事先安排：手機放在房門外，裝上過濾。第二，找一位同性、信得過的同伴，每週問你一次。第三，跌倒了當天就說出來，不要等變好了才回來。第四，留意背後的空：是寂寞、壓力還是傷口？若和憂鬱、創傷綁在一起，也可以找輔導協助。"]],["h","三、拚了命去安靜"],["p","孩子會走路了，下一步是走到別人身邊。「論到弟兄們相愛，不用人寫信給你們；因為你們自己蒙了神的教訓，叫你們彼此相愛。」（4:9）「蒙了神的教訓」原文只有一個字，θεοδίδακτοί，神親自教的，全本新約只出現這一次。是神自己，教一群染布的、打鐵的、扛貨的陌生人，彼此叫一聲弟兄。"],["p","接著是一句很奇怪的話：「又要立志作安靜人，辦自己的事，親手做工」（4:11）。「立志」是 φιλοτιμεῖσθαι，本來是愛面子、爭榮譽的字，城裡的有錢人捐一座建築、辦一場慶典，用的就是這個字；保羅把它和 ἡσυχάζειν，安靜，綁在一起。拚了命，去安靜。為甚麼？可能有人想：主快來了，何必上班？保羅說，愛弟兄的人，會盡力不成為弟兄的重擔。愛的樣子，包括不讓別人替你付帳。"],["p","保羅自己就是這樣。他在帖撒羅尼迦「晝夜做工」（2:9），用自己的手縫帳棚。他用一雙長了繭的手，給福音作了一張名片。「叫你們可以向外人行事端正，自己也就沒有甚麼缺乏了。」（4:12）「行事」又是那個走路的字。同事、鄰居、還沒信主的爸媽，是先看我們怎樣走路，才聽我們說甚麼。"],["p","這裡有兩件事要說清楚。「安靜」不是不關心社會，基督徒當然要關心城市與公義，只是第一步，常常是先把手上的工作做好。「親手做工」也不是拿來責備失業的人；保羅後來責備的是「若有人不肯做工，就不可吃飯」（帖後 3:10），是不肯，不是不能。失業的、生病的、在家照顧父母的，是教會要扶一把的人。一邊是加班文化，一邊是躺平；安靜做工的人兩邊都不跟：不讓工作吞掉生命，也不讓自己成為別人的負擔。"],["p","人死如燈滅的人，有兩種活法：拚命燒，或乾脆不點。保羅剛講完做工，下一句就講主的再來；等候主的人，手上有活兒，而且做得安安靜靜。"],["d",["我被裁員好幾個月了，在教會聽到「親手做工」，覺得很羞愧，這一節是在責備我嗎？","不是。保羅責備的是「不肯」做工的人，不是「不能」做工的人；帖撒羅尼迦有人覺得主快來了就不上班，保羅說的是他們。失業、生病、在家照顧家人的人，正是 4:9 那一份弟兄相愛要扶持的人。這一週你可以做三件事：讓小組知道你的需要，彼此供應本來就是教會的樣子；每天安排一段親手做的事，投履歷、學一樣技能、幫鄰居一個忙；若失業已經讓你吃不下、睡不著，告訴一位信得過的人。你的價值不在那份薪水上。"]],["h","四、原文亮光：睡、死、迎接"],["p","現在走到墳前。請仔細聽 4:13，它在喪禮上常常被讀錯。有人對家屬說：聖經說不要憂傷。可是保羅說的是：「恐怕你們憂傷，像那些沒有指望的人一樣。」（4:13）關鍵在「像」這個字。問題不在眼淚，在盼望。主耶穌站在拉撒路的墳前，明知道過一會兒就要叫他出來，聖經還是記下：「耶穌哭了。」（約 11:35）主自己都哭了，我們就不必要求任何人在棺木前忍住眼淚。"],["p","第一個字是睡：κοιμωμένων，動詞是 κοιμάω。希臘人用睡來說死，本來只是一個好聽一點的說法；到了基督徒口中，它有了內容：會醒的睡。後來教會把墓地叫作睡覺的地方。人死如燈滅，說的是沒有明天；保羅的睡，說的是還有一個早晨。"],["p","第二個字是死：ἀπέθανεν。「我們若信耶穌死而復活了，那已經在耶穌裡睡了的人，神也必將他們與耶穌一同帶來。」（4:14）請留意，說到耶穌，保羅用的是死；說到信徒，用的是睡。在這一節裡，真正的死只用在耶穌一個人身上。他替我們嚐了那盞燈真正滅掉的黑，所以屬他的人的死，只是睡。主自己也這樣說：「我們的朋友拉撒路睡了，我去叫醒他。」（約 11:11）"],["p","帖撒羅尼迦人最怕的是：先走的人，會不會錯過主來的那一天？保羅用希臘文最強的否定回答，οὐ μὴ φθάσωμεν：「我們這活著還存留到主降臨的人，斷不能在那已經睡了的人之先。」（4:15）一個都不會被留下，而且「那在基督裡死了的人必先復活」（4:16）。等得最久的人，先被叫醒。保羅把自己算在「活著的」裡面，不是定了日子，是每一代信徒該站的姿態。"],["p","第三個字是迎接：ἀπάντησιν。「以後我們這活著還存留的人必和他們一同被提到雲裡，在空中與主相遇。這樣，我們就要和主永遠同在。」（4:17）當時王要來到一座城，城裡的人出城迎接，再陪著王一起進城，用的就是這個字。這不是逃難，是迎駕。被提在大災難之前、之中，還是之後？千禧年怎樣讀？議題頁都並陳，各派都是弟兄，本講義不替各教會決定時間點，也不算日子。保羅自己在下一章說：「論到時候、日期，不用寫信給你們」（5:1）。經文的重點不在路線圖，在「和他們一同」，和「永遠同在」。"],["p","然後是這一段的結論：「所以，你們當用這些話彼此勸慰。」（4:18）保羅寫這段話，對象是正在哭的人。被提的經文是寫來安慰的，誰拿它嚇人說你會被留下來，就把那一句「斷不能」讀反了。「勸慰」是 παρακαλεῖτε，在旁邊扶一把，一直扶下去；而且是「彼此」，一間幾個月大的教會，已經可以用神的話扶起彼此。"],["d",["被提到底是災前、災中還是災後？如果我信錯了，會不會被留下來？","敬虔愛主的弟兄姊妹在這件事上各有所持。災前被提認為主先在空中接走教會，大災難之後再與聖徒降臨；災中被提認為教會經過大災難的一部分；災後被提認為只有一次再來，教會出城迎接主，再陪他降到地上。千禧年也有前千禧、無千禧、後千禧幾種讀法。各派都是弟兄，本講義不替各教會決定時間點。各派共同相信的才是重點：主一定親自回來，死人要復活，信的人要永遠與主同在。你不會因為選錯一種讀法被留下；得救靠的是主耶穌，不是你的末世圖表。"]],["d",["去參加喪禮或探訪喪家，我應該說甚麼？哪些話最好不要說？","少說，多陪。進門以後，可以只說一句「我很難過」，然後坐下來。不要說「不要哭」「你應該高興」「這是神的旨意」「神要教你功課」；這些話多半是為了減輕我們自己的不安。遇到失去孩子、流產、意外或親人自己結束生命的家庭，更不要解釋，也不要急著引經文。可以做具體的事：帶一餐飯、接送孩子、陪他處理文件。等他願意的時候，再一起讀 4:13--18。最要緊的是喪禮以後：第一個月、第三個月、第一個清明，再去一次；若哀傷久久沒有緩解，陪他找哀傷輔導。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 4:16--17 講成被提時間表，或用「被提的時候你若還沒準備好，就會被留下來」嚇人，甚至把時事對號入座、推算年份。保羅拒絕給日子；這段話的結論是彼此勸慰。會眾聽完應該更想念主來，不是更害怕。"],["p","第二個偏差，是用 4:13 叫喪親的人不要哭：你哭就是不信、你應該高興；或在棺木旁對未信主的亡者下斷語，用他的去處催逼家屬決志。保羅說的是不要像沒有指望的人；審判在公義又慈愛的神手中，不在講台上，更不在靈堂裡。"],["p","第三個偏差，是把 4:3--8 講成羞辱：你已經不純潔了、像被揉皺的白紙；或把性侵的受害者算成不聖潔，說她自己也有責任，再用要饒恕、不要張揚把事情壓下去。成聖是一條路，不是一張只能用一次的證書；4:6 錯在越界的一方。"],["p","第四個偏差，是把 4:8 講成你不聽我就是不聽神，要人對講台絕對順服；或把聖潔講成只靠咬緊牙關，不提那一直在賜聖靈的神。保羅正是在這一節把自己移開，把力量的源頭指向神。"],["p","第五個偏差，是用 4:11 叫人不要管社會的事，或對失業、生病、在家照顧人的弟兄姊妹說你就是懶；反過來，也有人把親手做工講成替公司拚命就是榮耀神，替過勞背書。安靜做工，是不成為別人的重擔，也不讓工作吞掉生命。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：忌諱談死，到了墳前又不知道怎樣盡孝。電梯沒有四樓，小孩不准說死字，長輩病重了，沒有人敢問他怕不怕；出殯那天，一家人又為拿香、燒紙吵起來。人死如燈滅和避而不談，其實是同一種沒有指望。4:13 給的是一個說得出口的盼望：可以在病床前說，我們還會再見面。清明、祭祖的時候，基督徒不拜偶像，但可以盡孝、記念、感恩：帶一束花，說他生前的故事，為他的一生謝謝神。這就是「向外人行事端正」（4:12），讓家人看見，信耶穌的人最懂得記念親人。"],["p","第二個問題：家醜不可外揚。在性這件事上，華人教會常常同時犯兩個錯：對跌倒的人說得太重，對越界的人說得太輕。一位青年的色情掙扎，被當成天大的醜事；一位同工對年輕人越界，卻被一句「為了教會的見證，不要張揚」蓋過去。4:6 正好倒過來：越界的一方要負責，主是被欺負的人的伸冤者。健康的教會，對跌倒的人說話溫柔，對越界的事處理清楚：有保護與通報的流程，讓受害的人被相信、被保護。"],["d",["清明掃墓和家裡拜祖先，基督徒可以參加嗎？要怎樣做才不得罪長輩，又不拜偶像？","可以參加，而且要好好參加。基督徒不上香、不燒紙、不向牌位祈求；但可以盡孝、記念、感恩：清掃墓地、帶一束花、說說先人生前的故事、為他的一生謝謝神。關鍵是事先溝通，不是當場衝突。可以在清明前一週溫和地對長輩說：我會去，會幫忙打掃，也會鞠躬表示敬意，只是香我不拿，我用禱告來記念阿公。在現場，做最勤快的那一個。掃墓是家人最脆弱的時候，不是辯論的場合；讓長輩看見，信耶穌的人最懂得記念親人。"]],["h","七、活出321——還會再見面的一家人"],["p","經文說完了它自己的話，我們國度321空中團契才接上去。全卷五個字：歸、養、穩、聖、醒；走到這一章是「聖」，孩子學走路，而且一路走到墳前，再走上山頂。"],["p","耶穌是我的榜樣：這一章的路，主耶穌先走過。他受過試探，卻從不越分；他對被眾人拉到前面的婦人說「我也不定你的罪。去吧，從此不要再犯罪了」（約 8:11），不羞辱人，也不降低聖潔；他是拿撒勒人口中的木匠，用手做工三十年；他在拉撒路的墳前哭了，然後他自己真的死了，又復活了。"],["p","聖經是我的準則：讀 4:16--17 以前，先讀 4:13 是誰在哭；讀完以後，一定讀到 4:18 的「所以」。次序對了，被提的經文才不會被拿去排時間表、去嚇人。聖靈是我的引導：在深夜的手機前、在不知道該說甚麼的靈堂裡，求那一直在賜下的聖靈告訴我下一步怎樣走，也告訴我甚麼時候該閉口，只坐著陪。"],["p","讓耶穌作王：這一章要我讓出兩個位子。一個是我身體的主人，我不越別人的界線，也不讓別人越我的；一個是時間表的主人：主哪一天來、別人的眼淚甚麼時候該停、過世的人去了哪裡，都還給他。讓耶穌得著一切的榮耀：「那在基督裡死了的人必先復活」（4:16），叫醒睡了的人的是主，不是我們的追思禮拜辦得多體面。"],["p","建立屬神的體系：4:18 的「彼此」，就是這個體系的運作方式。具體來說，教會要有清楚的保護與通報流程，讓被權勢侵害的人說得出口、被相信、被保護；有人在弟兄姊妹失業時，一起找工作、一起撐過帳單；有一組人在喪禮結束後的第一個月、第三個月、第一個清明，繼續上門；也有讓跌倒的人可以安全回來的小組。"],["h","八、四種心，各在路上和墳前站在哪裡"],["p","驕傲型的心，把聖潔當成成績單：守住了，就看不起跌倒的人；到了喪禮上，急著說一句對的話，好結束讓自己不舒服的沉默。這一章對你說：要你聖潔的是神，成就的也是神；在墳前，與哀哭的人同哭，比一句漂亮的話更像福音。"],["p","恐懼型的心，把主的再來聽成一場突襲考試：怕被留下，怕還沒準備好，每次聽見末世的講道就睡不著。請你聽 4:15 那一句最強的否定：斷不能。帖撒羅尼迦人怕的，正是被留下；保羅說，一個都不會。主回來，是為了接我們，不是為了抓我們。"],["p","羞恥型的心，躲在第四章前半：也許是深夜離不開的螢幕，也許是一段不敢讓教會知道的過去。你以為自己已經不配了。請聽 4:8：神一直在賜聖靈，不是只給一次；保羅照樣稱這群人弟兄。今天不必躲起來，找一位信得過的同性同伴，一起禱告，再走一步。"],["p","受傷型的心，也許曾被人越過了界線，卻聽見有人說你自己也有責任；也許在喪禮上，有人拍拍你說不要哭。這一章不是要你把眼淚擦乾才能來。主是伸冤者，他看見了；主也在墳前哭過，他懂得。你不必在這裡說出細節；若你仍在危險中，或已經很久吃不下、睡不著，請先告訴一位信得過的人，讓人陪你找到安全和專業的幫助。"],["d",["我的父親沒有信主就過世了，他現在怎麼樣了？我還能有盼望嗎？","這是一個很痛的問題，請先允許自己為他哭。4:13--18 的盼望，保羅是對「在耶穌裡睡了的人」說的，他在這裡沒有討論沒有信主的人；所以我們不替任何一個人下斷語，你不知道他最後的日子心裡發生了甚麼，我們也不知道。我們把他交在那位又公義又慈愛的神手中：「審判全地的主豈不行公義嗎？」（創 18:25）你不必聽任何人在靈堂上對你父親下判決。你可以為他的一生感恩，把不捨一句一句說給神聽；若這份掛念讓你長久無法安睡，請讓牧者或哀傷輔導陪你走一段。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，打開手機的通話紀錄，找一位最近一年內失去親人、喪禮辦完以後就少有人問起的人。這一週打給他，或帶一份簡單的食物去他家，只問一句：你最近最想他的是甚麼時候？聽他講完，不勸、不解釋。"],["p","第二，找出你最容易越界或跌倒的那一個時段與地點，例如深夜、一個人的房間、出差的旅館，為它做一件具體的安排：手機放在房門外、裝上過濾，或約一位同性的同伴每週問你一次。跌倒了不躲起來，當天就說出來。"],["p","第三，這一週記下每天工作的時數；若已經壓過了家人與身體，和家人談一次怎樣調整。若你正在失業，寫下一件這一週仍能親手做的事，也讓小組知道你的需要。"],["p","第四，和家裡一位長輩談一次死：說說他記得的一位故人，或一起去掃墓；用自己的話告訴他，你為甚麼相信我們還會再見面。"],["p","第五，每天早上讀一段：週一 4:1--3，週二 4:4--8，週三 4:9--12，週四 4:13--14，週五 4:15--18；讀完對神說一句：你今天要我成為怎樣的人。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：神的旨意就是要我成為聖潔；我還在學走路，那一直在賜聖靈的神，今天還在扶我。"],["p","我宣告：我不越別人的界線，也不讓人越我的界線；被欺負的人不是不聖潔的人，主是伸冤者。"],["p","我宣告：我要立志作安靜人，親手做工，不成為弟兄的重擔，也不讓工作吞掉我的生命。"],["p","我宣告：在耶穌裡睡了的人還會醒，我們還會再見面；我們就要和主永遠同在，我要用這些話彼此勸慰。"],["h","十、結語"],["p","我們回到那一句俗語：人死如燈滅。下一次在醫院走廊聽見長輩這樣嘆氣，你不必和他辯論。你可以握著他的手，在心裡多加一句：燈會滅，可是睡著的人會醒；而且，有一位會親自來叫醒他。"],["p","這一課的焦點，不在我們能不能排出一張末世路線圖，也不在我們守得多聖潔、做工多勤快。焦點在那一位真的死了、又復活的主：他替我們嚐了真正的死，所以屬他的人只是睡；他在拉撒路的墳前流過淚，所以懂得你的眼淚；他一定會回來，叫醒他所愛的人。我們學走路，不是怕被扣分，是因為要去見的那一位，值得我們好好地走。讀完這一章，請問自己：我是更害怕主來，還是更想念主來？"],["p","我們一起低頭禱告。死而復活的主，謝謝你替我們嚐了真正的死，讓我們的死只是睡。求你赦免我們把聖潔當成成績單，也赦免我們用經文叫哭的人閉嘴、叫受害的人沉默。扶起正在跌倒裡掙扎的人，保護曾經被欺負的人，扶持失業和被工作壓垮的人；安慰剛送走親人的家庭，差我們坐在他們旁邊。主啊，我們等候你回來，教我們用這些話彼此勸慰。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最屬靈，是讓每一個人說出自己在身體、工作與墳前，走到了哪一步，以及這一週要扶誰一把；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是聖、靜、遇。席上可能有剛喪親、經歷過流產的人，也可能有曾被侵害、從未說出口的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：死了的信徒是睡了，會醒；4:13 不是不要憂傷，是不像沒有指望的人；聖潔包括身體，而 4:6 的錯在越界的一方。"],["n","1. ★ 你第一次聽見「人死如燈滅」是在甚麼場合、誰說的？那時候你心裡同意，還是覺得哪裡不對？"],["n","2. ★★★ 請用自己的話說出：保羅說的「睡了」和「人死如燈滅」差在哪三個地方？"],["n","3. ★★ 4:14 說耶穌是「死」，信徒是「睡」。這個用字的差別，對一位剛送走父母的人有甚麼安慰？"],["n","4. ★★ 4:6 用的是「越分」與「欺負」兩個講不公義的字。這兩個字怎樣改變你對性的罪、以及對被侵害的人的看法？"],["m","帶領提醒：第一題輕鬆帶；若有人談起喪禮而落淚，先停下來陪他，不說「你要有信心」；被提不辯論派別，只回到 4:18 的「所以」。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己在身體、工作或墳前，走到了哪一步，說出一個卡住的地方，並寫下這一週要走的一步。"],["t","【看】看見自己"],["n","5. ★★★ 這一章三個字：聖、靜、遇。你這一季最卡的是哪一個？是夜裡的身體、白天的工作，還是一座還沒走出來的墳？只說哪一個，不必說細節。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 4:13--18 兩遍，第二遍讀到「睡了的人」時，在心裡放進一位你送走的人的名字。你聽見神對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 是甚麼讓你在那個卡住的地方一直不肯讓人扶？是怕被看不起、覺得自己不配，還是曾經說出來卻被說錯了話？不必說細節。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我還在學走路；那一直在賜聖靈的神，這一週要扶我走的是……」右手邊的人只回一句「主在你身邊」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要走的一步：哪一天、在哪裡、做甚麼；若需要人陪，再寫下你要告訴的那一位人的名字，或要預約輔導的日子。"],["m","帶領提醒：這一化可能碰到喪親、流產、嬰孩夭折、親人自殺、性侵或性暴力、長期無望感。不追問細節，不要求任何人原諒誰或和好，不對正在流淚的人說「你要有信心」或「你應該高興」，不對未信主的亡者下斷語；若有人說出被侵害的經歷，或提到傷害自己的念頭，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助與法律協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一次探訪、一次談話、一個要帶的人。"],["n","10. ★★★ 說出一位最近一年內失去親人、喪禮後就少有人問起的人的名字。這一週哪一天、用甚麼方式去看他，你打算只問、不講的那一句話是甚麼？"],["n","11. ★★ 你家裡哪一位長輩，是你最想、卻最不敢和他談死的人？下一次回家的哪一天，你要怎樣開口？"],["n","12. ★ 下一次清明或家族祭祖，你打算事先對哪一位長輩說甚麼、在現場做哪一件盡孝的事？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、正在哀傷或正在跌倒裡掙扎的那一個人。當場說出他的名字、這一週哪一天約他，並向他分享：睡了的人還會醒。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，我們常說人死如燈滅，可是聖經說信耶穌的人死了是睡了，睡著的人會醒。第二句，因為耶穌替我們真的死了、又復活了，他說他會親自回來叫醒他所愛的人，我們還會再見面。第三句，所以我想好好過今天，身體、工作和身邊的人都要好好對待，因為我要去見的那一位值得。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多關心」這類答案；探訪喪家少說多陪、不解釋；不在組裡評論誰家祭祖的做法。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要去看的那一位哀傷的人是誰，或我要讓神扶我走的那一步是甚麼。"],["p","然後彼此代禱，為三種人禱告：一位喪禮過後沒有人再提起的人，求主差人坐在他身邊；一位曾被侵害、至今不敢說出口的人，求主讓他被相信、被保護；一位剛失業的人，求主讓他有尊嚴地被扶持。"],["p","散會以前，確認紙上寫了三樣：要去探訪的人、要談死的那一位長輩、你的那個「2」。最後一起讀一次：「所以，你們當用這些話彼此勸慰。」下次帶來對。"]]},"5":{"no":5,"vol":"《321帖撒羅尼迦前書講義》第五課·帖撒羅尼迦前書第五章","title":"替別人守夜——光、醒、成","chars":5208,"min":60,"deep":8,"dchars":1728,"tchars":1342,"blocks":[["h","一、天還沒亮，她醒著"],["p","弟兄姊妹平安。凌晨三點，一間醫院的病房走廊，燈調得很暗。一位護理師推著小車，一床一床地走：量血壓、換點滴、替一位老伯伯把被子拉好。整層樓的人都睡了，她醒著。她醒著，不是因為她怕天亮，也不是因為她在算還有幾個鐘頭下班；她醒著，是為了照顧睡著的人。"],["p","帖撒羅尼迦前書第五章要我們成為的，就是這樣的人。這是全卷最後一章，也是這個孩子成長的最後一步。全卷五章，我們用五個字走過來：歸、養、穩、聖、醒。第一章是出生，第二章是被餵，第三章是站起來，第四章是學走路；到第五章，孩子長大了，不再只是被人守著，開始替別人守夜。"],["p","這一課用三個字走完這一章：光、醒、成。"],["p","照書信三問的第一問：帖撒羅尼迦人遇到甚麼？一間才三個安息日大的教會，創辦人被趕走，教會裡已經有人過世了。上一章保羅告訴他們：主要降臨，「這樣，我們就要和主永遠同在。」（4:17）任何人讀到這裡，下一個問題都一樣：那是甚麼時候？"],["p","保羅的回答是：「弟兄們，論到時候、日期，不用寫信給你們」（5:1）。「時候」是 χρόνων，時間的長度；「日期」是 καιρῶν，那一個時刻。多久，和哪一天，保羅兩樣都不寫。主耶穌自己說過，那日子那時辰，「惟獨父知道」（太 24:36）。使徒拒絕寫的東西，我們不必替他補上。"],["p","他給的是一幅畫：「主的日子來到，好像夜間的賊一樣。」（5:2）這是主耶穌自己的比喻：「家主若知道幾更天有賊來，就必警醒，不容人挖透房屋」（太 24:43）。賊的特點不是可怕，是不預告；這幅畫要你做的，不是猜賊幾點來，是每晚把門顧好。接著是 5:3：「人正說『平安穩妥』的時候，災禍忽然臨到他們」。「平安穩妥」很可能是當時羅馬帝國的口號，說的是一切自以為穩妥的人，不是替今天新聞準備的預告。把某份和平協議說成「五章三節應驗了」，是把保羅拒絕給的時間表從後門塞回去。"],["d",["既然主耶穌說只有父知道，為甚麼還有那麼多人推算主再來的日子？我該怎樣分辨？","推算日期常出於兩種心：一種是想念主，盼望苦難快一點結束，這心是好的，只是走錯了路；另一種是想掌握，覺得知道日子就安全，這正是這一章要我們讓出的位子。分辨的方法很簡單：凡是給出年份、給出倒數、把某則新聞對號入座的說法，都做了保羅在 5:1 拒絕做的事，也做了主耶穌說只有父知道的事，就可以放下。歷史上這樣的推算每一次落空，都讓一些人從此不信主會再來。真正的預備不是知道日子，是每天把燈點著：今天有沒有活得像白天的人，有沒有照顧身邊的人。你不必和推算的人辯論，只說：我也相信主會再來，只是我不算日子。"]],["h","二、在夜裡穿上白天的衣服"],["p","保羅講到這裡轉了一個彎，「他們」換成「你們」：「弟兄們，你們卻不在黑暗裡，叫那日子臨到你們像賊一樣。」（5:4）賊來的時候，誰會被嚇到？睡著的屋主。那位夜班護理師不會被嚇到，她本來就醒著；有人來到門口，那不叫驚嚇，叫迎接。"],["p","然後是這一章最重要的一句身分宣告：「你們都是光明之子，都是白晝之子。」（5:5）保羅沒有說你們要努力變成光明之子，他說你們已經是了。而且「白晝」和 5:2「主的日子」的「日子」，原文是同一個字 ἡμέρα。意思是：你是那一天的孩子。主再來的那一天，不是闖進你家的陌生人，是你所屬的那一天終於到了。天還沒亮，你已經是白天的人了。"],["p","既然是白天的人，就活得像白天：「所以，我們不要睡覺像別人一樣，總要警醒謹守。」（5:6）「謹守」是 νήφωμεν，本義是沒有喝醉、頭腦清醒。下一節說得很生活：「因為睡了的人是在夜間睡，醉了的人是在夜間醉。」（5:7）這裡的睡不是身體休息；剛下夜班的護理師回家倒頭就睡，那不是屬靈的昏睡。保羅說的睡，是活得好像沒有主要來；他說的醉，是讓別的東西把你灌到不清醒：成功、怨恨、滑不完的螢幕。"],["p","守夜的人要穿衣服：「把信和愛當作護心鏡遮胸，把得救的盼望當作頭盔戴上。」（5:8）這使我們想起賽 59:17 神自己出征的裝備。信、愛、望在 1:3 是三種勞動，到這裡成了盔甲。信和愛護住胸口，因為夜裡最常見的兩種傷，就是懷疑神、冷淡人；盼望護住頭，因為人最容易被打倒的，是腦子裡那一句「一切都白費了」。頭盔是讓這句話打不穿。"],["p","可是萬一主來的時候，我正好跌倒了呢？保羅接著說：「因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救。」（5:9）給信徒的末世論是一個應許，不是一個威脅。所以請不要用「被提的時候你會被留下來」去嚇人；那是把 5:9 倒過來讀。被提在災前、災中或災後，各派都是弟兄，議題頁有並陳；但沒有一派可以拿它來恐嚇人。"],["p","救恩的根據在下一節：「他替我們死，叫我們無論醒著，睡著，都與他同活。」（5:10）不是我們醒得夠久，是他死得夠徹底。5:6 說「不要睡覺」，這裡的「睡著」卻指上一章已經離世的弟兄姊妹。保羅用一個字，一邊叫醒昏睡的人，一邊安慰哀傷的人。所以 5:11 收在：「所以，你們該彼此勸慰，互相建立，正如你們素常所行的。」兩段講末世，兩次都收在彼此；一套末世觀若讓你更緊張、更孤立、更愛辯論，就走偏了。"],["d",["小時候常聽「被提時你會被留下來」，到現在一想到主再來就害怕，該怎麼辦？","你的害怕可以理解，那是有人用錯了經文，不是你信心不好。請把 5:9 慢慢讀幾次：「因為神不是預定我們受刑，乃是預定我們藉著我們主耶穌基督得救。」再讀 5:10：他替我們死。你等候的那一位，不是來抓你的人，是為你死的人。被提的時間點，各派弟兄各有看法，但沒有一派給人權利拿它來嚇唬人。可以先放下那些讓你害怕的影片，每晚讀 5:5 一次，也把害怕說給一位信得過的人聽。若恐懼已經影響睡眠很久，也可以找輔導談談。"]],["d",["5:4 的「像賊一樣」，有的抄本作「像賊」複數，兩種讀法差在哪裡？","我們的原文 SBLGNT 作 κλέπτης，單數，賊是比喻那日子：那日子臨到你們像賊一樣，和合本也是這樣翻。幾份重要的古抄本作 κλέπτας，複數：那日子抓住你們如同抓住賊，像天亮時被逮個正著的小偷。複數是較難的讀法；單數接續 5:2 的比喻、見證較廣，多數現代譯本採用。本講義照 SBLGNT 與和合本。最要緊的是，兩種讀法的落點一樣：會被天亮嚇到的，是屬黑夜的人。你是白晝之子，那日子臨到你，不是被抓，是被接。抄本的差異沒有動搖任何一條信仰的根基。"]],["h","三、原文亮光：認識、心小、長氣"],["p","真的轉身照顧旁邊的人，你會發現每一個人都不一樣。這一段保羅教嬰孩教會怎樣看人，我們拆三個原文字。"],["p","第一個字在 5:12：「弟兄們，我們勸你們敬重那在你們中間勞苦的人，就是在主裡面治理你們、勸戒你們的」。「敬重」原文是 εἰδέναι，意思是認識、知道。保羅不是叫人仰望頭銜，是叫人走近去認識勞苦的人：知道他們為甚麼累，家裡過得怎樣。勞苦、治理、勸戒，三個都是動詞，沒有一個是頭銜。下一節說尊重的理由是「又因他們所做的工」（5:13），不是因為他坐的位子。所以這兩節不能講成絕對順服屬靈父親。同一段後面，保羅要全教會「但要凡事察驗」（5:21），講台上的話也在察驗之列，包括這一課。"],["p","第二個字在 5:14：「我們又勸弟兄們，要警戒不守規矩的人，勉勵灰心的人，扶助軟弱的人，也要向眾人忍耐。」四種人，四個動詞。「不守規矩」是 ἀτάκτους，脫了隊的兵，回指 4:11，指有能力卻拒絕自己那一份、等別人供養的人；對他要警戒，當面說真話。這不是在說被裁員的人、生病無法上班的人，他們屬於下面「扶助軟弱的人」那一句。「灰心的人」原文是 ὀλιγοψύχους，字面是心小的人，心縮小了的人。對他們，保羅的動詞換了，是 παραμυθεῖσθε，坐到旁邊、溫和地說話。灰心的人需要的，不是一頓責備，是一個坐下來的人。今天的灰心，有時是憂鬱症、焦慮症；那時要陪伴，也要陪他找醫師與專業協助，這和禱告不衝突。「扶助」是 ἀντέχεσθε，抓住他，撐住不放。"],["p","第三個字是「忍耐」，μακροθυμεῖτε，字面是長長的一口氣。對象是「眾人」，包括前面三種人，也包括讓你最難忍耐的那一位。夜班護理師不會給每一床同一種藥：發燒的、剛開完刀的、半夜在哭的，各有各的照顧。次序一弄錯就會傷人：該勉勵的你去警戒，該警戒的你一直陪笑臉。牧養的智慧，是先看清楚眼前這個人是哪一種。"],["p","5:15 把這一段收起來：「你們要謹慎，無論是誰都不可以惡報惡；或是彼此相待，或是待眾人，常要追求良善。」守夜的人，連對那個讓你最累的人，也不回以惡。"],["d",["我被裁員好幾個月了，讀到「警戒不守規矩的人」很難受，我是不是那種人？","不是。ἀτάκτους 是脫了隊的兵，回指 4:11：有能力做工，卻拒絕自己那一份，等著別人供養的人。被裁員、生病無法上班、為照顧家人暫停工作，都不是這一種；你更接近同一節的「扶助軟弱的人」，教會該撐住你。請你不要因為失業就不敢來教會，也不要不好意思讓小組知道你的需要；讓弟兄姊妹替你留意職缺、陪你去面試，這就是扶助。若有人對你說「不做工的就是懶」，那是把經文用錯了。若越來越灰心、睡不著，也請說出來。"]],["d",["我有一位朋友好像得了憂鬱症，我怎樣做才算「勉勵灰心的人」，而不是讓他更難過？","照 παραμυθεῖσθε 的意思，先坐到他旁邊。具體可以這樣做：第一，約他在他覺得安全的地方，少說多聽，不急著給道理，不說「你就是想太多」「信心大一點就好」。第二，接納他的感受：謝謝你告訴我，你真的很累。第三，鼓勵他就醫，必要時陪他去掛號；憂鬱症是需要治療的病，看醫生、吃藥與禱告不衝突，也不要勸他自己停藥。第四，持續但不壓迫，每週傳一則簡單的訊息。第五，若他說出不想活了、或有傷害自己的計畫，不要替他保密，當天就陪他聯絡醫師、家人或當地的求助專線。你不是他的救主，你是那個坐下來的人。"]],["h","四、他必成就"],["p","接下來是三句很短的話：「要常常喜樂，不住地禱告，凡事謝恩」（5:16–18）。這封信寫給一群剛埋葬了親人、還在被逼迫的人，保羅知道他們在哭。常常喜樂不是不准哭；喜樂可以和眼淚坐在同一張椅子上。「不住地」是 ἀδιαλείπτως，古代文獻也用它形容停不下來的咳嗽：不是每一分鐘都開口，是一再回來，像呼吸。這個字在本卷前兩次都是保羅說他自己（1:2；2:13）；命令之前，他先活出來了。"],["p","最容易被用錯的是「凡事謝恩」。原文 ἐν παντί 是「在」凡事中謝恩，不是「為」凡事謝恩。保羅不是叫你為孩子的病、為被裁員、為被侵害感謝神，是叫你在任何處境裡，都不要失去向神開口感謝的那一條路。夜班護理師守在病危的老人床邊，可以這樣禱告：主啊，這個病我不感謝，但我感謝你在這裡。這不是否認情緒。保羅說這是神的旨意，全卷第二次直說；第一次在 4:3，要你們成為聖潔。兩次都是說你要成為怎樣的人。"],["p","然後是「不要消滅聖靈的感動」（5:19）。原文只有四個字：τὸ πνεῦμα μὴ σβέννυτε，不要熄滅那靈；「聖」和「的感動」是和合本補的小字。σβέννυτε 是滅火的字，聖靈像火。可是緊接著是「但要凡事察驗」，δοκιμάζετε，驗金子的字。只有火沒有驗的教會會被帶走，只有驗沒有火的教會會慢慢冷掉；保羅要這間嬰孩教會不怕火，也不怕驗。"],["p","這麼多命令，我做得到嗎？保羅沒有再加一條，他停下來禱告：「願賜平安的神親自使你們全然成聖！又願你們的靈與魂與身子得蒙保守，在我們主耶穌基督降臨的時候，完全無可指摘！」（5:23）靈、魂、身子，有三分說、二分說、整全說，議題頁都有並陳；倪柝聲弟兄的《屬靈人》幫助過無數華人信徒，他為主受苦的見證值得尊敬。但請不要把「屬魂的」當成標籤，去否定人的眼淚、思考和性格。這一節最重的兩個字是「全然」ὁλοτελεῖς，徹徹底底；「完全」ὁλόκληρον，每一份都在。你的眼淚、你的思想、你值夜班的身體，全都在神的保守裡。"],["p","然後是全卷的最高點：「那召你們的本是信實的，他必成就這事。」（5:24）原文後半句只有三個字：ὃς καὶ ποιήσει，他，也，必做。「那召你們的」是現在分詞，是那一直在呼召的神，不是叫了你一聲就走開。命令是給我們的，成就是神的。保羅被趕走了，但他知道有一位會留下來。"],["p","最後，保羅用了全卷最重的一個字：「我指著主囑咐你們，要把這信念給眾弟兄聽。」（5:27）「囑咐」是 ἐνορκίζω，叫人指著主起誓。全卷只有這裡用起誓的語氣，為的只是一件事：這封信不能只給幾個人聽。當時很多人不識字，有人是奴隸，有人病著沒能來。眾弟兄，一個都不能少。"],["d",["「凡事謝恩」是不是連親人過世、被欺負這樣的事，也要感謝神？","不是。原文 ἐν παντί 是「在」凡事中謝恩，不是「為」凡事謝恩。保羅寫這封信給剛埋葬親人、正被逼迫的人，他沒有叫他們不哭，反而說不要「像那些沒有指望的人一樣」憂傷（4:13），可見他們是在哀傷的。主耶穌在拉撒路墳前也哭了。所以你不必為惡事感謝神。凡事謝恩的意思是：在最難的處境裡，仍然不關上向神開口的那一扇門。你可以這樣禱告：主啊，這件事我不感謝，可是我感謝你沒有離開我。若你正處在被欺負、不安全的環境，請先告訴一位信得過的人，尋求保護與專業的幫助。"]],["d",["5:23 的「靈與魂與身子」，到底人是三部分還是兩部分？我該採哪一種說法？","三分說認為靈、魂、體是三個部分，部分教父這樣看，倪柝聲弟兄的《屬靈人》也是，它幫助了無數華人信徒認真對待內在的生命。二分說認為人是物質與非物質兩部分，靈與魂是同一實體的兩個面向，奧古斯丁以來多數西方神學這樣看。整全說認為保羅在這裡不是要分析人的結構，是用修辭說「整個人」，像主耶穌說要盡心、盡性、盡意、盡力愛主。本講義的落點是：神要保守整個人。持守哪一說，都是弟兄。真正要避免的，是把「屬魂的」當作標籤，說流淚的人、愛思考的人、個性外向的人比較不屬靈；也不要反過來嘲笑地方教會的傳統。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是用 5:1–3 推算主再來的日子，或把某一份和平協議、某一場停火對號入座，說五章三節應驗了。推算日期是做一件使徒拒絕做的事，每一次落空都在磨損人的信心。"],["p","第二個偏差，是用「被提時你會被留下來」恐嚇人，好叫人乖乖聚會。5:9 說神不是預定我們受刑；給信徒的末世論是應許。用恐懼換來的順從，會讓人一輩子以為神在等著抓他。"],["p","第三個偏差，是把 5:12–13 講成絕對順服：質疑牧者就是消滅聖靈，屬靈父親說的話不可以問為甚麼。敬重原文是認識，理由是他們所做的工；5:21 凡事察驗，講台也在其中。屬靈父母的目標是孩子站穩，不是離不開。"],["p","第四個偏差，是把 5:16–18 講成否認情緒：基督徒不可以難過，你要為孩子的病感謝神。是在凡事中，不是為惡事；同樣的，對灰心、憂鬱的人說「你就是信心太小」「多禱告就好，不用看醫生」，是把 5:14 的「勉勵」換成了「警戒」，扶人的手變成推人的手。"],["p","第五個偏差，是把 5:23 講成屬靈階級：屬靈的人在靈裡，屬魂的人還在情感和理性裡打轉；或者反過來嘲笑三分說、攻擊倪柝聲弟兄。重點是全然和完全，神要保守整個人；持守不同看法的，都是弟兄。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：家族群組裡的末日影片。很多人的手機裡都有一個家族群組，長輩每隔一陣子就轉來一支影片：某國簽了協議，某地發生地震，標題寫著「末日倒數，快轉給你愛的人」。有的人越看越睡不著，有的人乾脆不想再聽主再來。5:21 給的路是「凡事察驗」：轉出去以前先問，這會讓人更愛主，還是更恐慌？你可以不和長輩辯論，私下說一句：爸，我也相信主會再來，但聖經說不用算日子，我們每天把燈點著就好。"],["p","第二個問題：把牧者當長輩，或把牧者當員工。華人教會常常在兩頭擺盪。一頭是輩分文化：牧者像家裡的長輩，說甚麼都不能問，有疑問只能吞下去或在背後講。另一頭是消費文化：我奉獻了，你就該把我服事好，牧者是教會請來的員工。5:12 的 εἰδέναι 把兩頭都拆掉：敬重是去認識，認識他的勞苦，也認識他的有限。連牧者家裡有人住院都不知道，談不上敬重；不准會眾認識自己軟弱的領袖，也不是保羅說的勞苦的人。"],["d",["家裡的長輩常在群組轉傳末日預言影片，我該怎樣回應才不失禮，又不助長恐慌？","長輩轉傳多半出於關心，所以先接住他的心，不急著糾正內容。可以這樣做：第一，不在群組裡公開反駁，免得長輩失面子。第二，私下打一通電話或當面說：謝謝你掛念我，我也相信主一定會回來；聖經說時候日期不用算，主教我們每天警醒過日子就好。第三，若影片裡有明確的日子或把某國某事對號入座，可以溫和地念 5:1 給他聽，說保羅自己都不寫。第四，邀他一起為新聞裡受苦的人禱告。第五，自己不轉傳。你不是要贏一場辯論，是要讓長輩在晚年少一點恐懼、多一點盼望。"]],["h","七、活出321——在夜裡替人守夜"],["p","經文說完了它自己的話，我們國度321空中團契才接上去。全卷五個字：歸、養、穩、聖、醒；這一章是醒，長大的孩子開始替別人守夜。"],["p","耶穌是我的榜樣：最長的那一夜，是主耶穌自己在客西馬尼守夜。門徒睡著了，他叫醒他們：「總要警醒禱告，免得入了迷惑。你們心靈固然願意，肉體卻軟弱了。」（太 26:41）他叫醒人，也替睡著的人說了一句體諒的話；被賣的那一夜，他還拿起餅來祝謝，那是在凡事中謝恩最深的一幅畫。"],["p","聖經是我的準則：讓 5:1 管住我的好奇，不算日子；讓 5:21 管住我的轉傳，先察驗。讓 5:14 的四個動詞管住我的嘴巴，先分清楚眼前這個人是哪一種，再開口。"],["p","聖靈是我的引導：不要熄滅那靈。今晚該打電話給誰、該坐到誰旁邊、哪一位該陪他去看醫生，求聖靈給我們火，也給我們分辨。"],["p","讓耶穌作王：這一章要我讓出兩個位子。一個是時間的主人：時候、日期不歸我排；一個是成就者：5:24 說他必成就，我不是自己或別人成聖的總工程師。讓耶穌得著一切的榮耀：5:18 凡事謝恩，就是每一天把眼光從處境移到那位在處境裡的主身上，把榮耀歸給他，不歸給撐得最久的自己。"],["p","建立屬神的體系：5:11 一個建造另一個，5:14 四種人四種對待，這就是 321 的「920」，每一個「2」都不一樣。一個健康的體系要有幾樣具體的東西：小組長學會分辨脫隊的、灰心的、軟弱的，手上有可以轉介的醫師與輔導名單；領袖被認識，也有清楚的管道提出問題；值夜班的、照顧病人的，有人替他們禱告；聚會有錄音、有文字，照 5:27 送到不識字的長輩、週日上班的同工、臥病在家的弟兄手上。"],["h","八、四種心，在夜裡各醒著甚麼"],["p","驕傲型的心，在夜裡醒著管時間、管別人。它想知道主哪一天來，又用同一把尺量所有的人，嫌灰心的太慢。這一章對你說：時候日期不歸你，成就也不歸你；「他必成就」的那個「他」，不是你。"],["p","恐懼型的心，在夜裡醒著怕被留下來。怕主來的那一刻自己正好跌倒。請聽 5:9：神不是預定我們受刑，乃是預定我們得救。你不是在等一個要抓你的人，你在等一個替你死的人。"],["p","羞恥型的心，在夜裡醒著責備自己：我又睡著了，我又灰心了，我在吃藥，我不敢讓小組知道。保羅特別點名要被勉勵的，就是心縮小了的人；你不是教會的負擔。5:10 說醒著的、睡著的都與他同活，死亡都不能把人從這個家裡除名，你的軟弱也不能。"],["p","受傷型的心，也許曾經在教會提出一個問題，就被說成消滅聖靈；也許在喪禮後聽見有人說，凡事謝恩，你不可以難過。這一章沒有要你先把眼淚擦乾。你可以帶著眼淚向神開口；若你已經很久睡不著、吃不下，請先告訴一位信得過的人，讓人陪你找到專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天晚上睡前，照 5:18 寫一句「在＿＿之中，我感謝你＿＿」：在凡事中，不是為凡事。寫完讀一次 5:24，對主說：今晚你醒著，我可以睡了。"],["p","第二，拿一張紙寫下身邊三個人的名字，在每個名字旁邊寫上 5:14 的一個動詞：警戒、勉勵、扶助、忍耐。挑出寫著勉勵的那一位，這週打電話給他，聽他說完。"],["p","第三，這一週不轉傳任何末日時間表或「某則新聞應驗了預言」的訊息；把那段時間拿來為新聞裡受苦的人禱告。"],["p","第四，照 5:12–13 認識一位在教會勞苦的同工：問他最近最累的是甚麼，為他具體禱告一次。"],["p","第五，照 5:27 把這一章帶給一位沒有聽到的人：為不識字的長輩念一次 5:1–11，給臥病的弟兄送一段錄音，或邀一位週日要上班的同事參加線上聚會。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我是光明之子，是白晝之子；天還沒亮，我已經是白天的人。"],["p","我宣告：我不算日子，也不用恐懼嚇人；神不是預定我受刑，乃是預定我得救。"],["p","我宣告：我要坐到灰心的人旁邊，撐住軟弱的人，向眾人長長地忍耐。"],["p","我宣告：那召我的本是信實的，他必成就這事；這個盼望，我要念給眾弟兄聽。"],["h","十、結語"],["p","我們回到那條醫院走廊。天快亮的時候，護理師把最後一床的點滴換好，走到窗邊，東邊的天開始發白。她要交班了：她不必一個人撐到天亮。弟兄姊妹，守夜的我們也是這樣。我們醒著、勸慰、扶助、謝恩，可是真正整夜不睡的，是那一位保護以色列的，他「也不打盹也不睡覺」（詩 121:4）。"],["p","帖撒羅尼迦前書走到最後，焦點不在我們守得多好，也不在保羅有多偉大，焦點在一位信實的神：「那召你們的本是信實的，他必成就這事。」（5:24）他替我們死，所以醒著的、睡著的都與他同活；他一直在呼召，所以跌倒的人可以再站起來；他必成就，所以我們可以安心交班。也因為這樣，這個盼望不歸少數人保管：「我指著主囑咐你們，要把這信念給眾弟兄聽。」（5:27）念給灰心的人聽，念給還在哭的人聽，一個都不能少。我們等的不是一個日期，我們等的是一個人。"],["p","我們一起低頭禱告。整夜醒著的主，謝謝你使我們成為光明之子、白晝之子。求你赦免我們想掌握時間，也赦免我們用同一把尺對待所有的人。求你保守正在夜裡工作、照顧病人的弟兄姊妹；求你差人坐到灰心的人旁邊，讓正在憂鬱、焦慮裡的人得著陪伴與好的幫助；安慰在主裡失去親人的家庭。教我們在凡事中謝恩。那召我們的本是信實的，你必成就這事；求你使我們把這信念念給眾弟兄聽，一個都不漏。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最警醒，是讓每一個人說出自己在夜裡醒著甚麼、身邊那四種人是誰，以及這一週要替誰守夜；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是光、醒、成，也是全卷最後一課。席上可能有剛喪親、正在憂鬱焦慮裡，或從小被末日恐嚇過的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：保羅不給日期，給身分；5:14 四種人要四種對待；凡事謝恩是在凡事中，不是為凡事。"],["n","1. ★ 你這輩子熬過最長的一個夜是哪一晚？在產房外、急診室，還是值夜班？天亮時第一個跟你說話的人是誰？"],["n","2. ★★★ 保羅被問到主甚麼時候來，他沒有給日期，給了甚麼？請用自己的話說出 5:5「白晝之子」的意思。"],["n","3. ★★ 5:14 的四種人各配哪一個動詞？若把「警戒」用在灰心的人身上，會發生甚麼事？"],["n","4. ★★ 「在」凡事中謝恩和「為」凡事謝恩，差在哪裡？請舉一個你自己或身邊的人的實際處境來說明。"],["m","帶領提醒：第一題輕鬆帶；討論主再來時，不評論任何一派的被提觀，也不在組裡點名誰轉傳過甚麼影片。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己在夜裡被甚麼灌醉、把甚麼位子抓在手裡，說出要交給那必成就之神的一件事，並寫下這一週的一步。"],["t","【看】看見自己"],["n","5. ★★★ 這一週讓你在夜裡「醉」的是甚麼：追劇、刷末日影片、加班、別人的讚美？說出最近一次因為它，晚上幾點才睡、隔天錯過了甚麼。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 5:9–10 兩遍，第二遍把「我們」換成你自己的名字。你聽見神對那個怕自己正好跌倒的你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你最想自己當「成就者」的是哪一件事：自己的成聖、孩子的信仰，還是一間小組？為甚麼放不下？不必說細節，只說是哪一件。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「那召我的本是信實的，這一件……我交給他成就。」右手邊的人只回一句「他必成就」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要走的一步：哪一晚、幾點把手機放到客廳，用十分鐘照 5:18 寫一句在甚麼之中感謝神；若你的灰心已經超過兩個禮拜，再寫下要告訴的那一位人的名字。"],["m","帶領提醒：這一化可能碰到喪親、憂鬱、焦慮、失業、長期無望感，或從小被末日恐嚇的傷。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」或「要凡事謝恩」；若有人說出曾有傷害自己的念頭或正處在危險中，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一位要勉勵的人、一位要認識的同工、一位要念給他聽的人。"],["n","10. ★★ 寫下身邊三個人的名字，各配上 5:14 的一個動詞。挑出要勉勵的那一位，說出這一週哪一個晚上、用甚麼方式坐到他旁邊。"],["n","11. ★ 說出一位在教會勞苦的同工的名字，這一週你要問他哪一句話來認識他，並為他的哪一件事具體禱告？"],["n","12. ★★ 照 5:27，說出一位這個月沒聽到神話語的人：臥病的長輩、週日上班的同事、不識中文的看護。哪一天、用甚麼方式把這一章帶到他那裡？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、正在夜裡撐著的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：天還沒亮，你已經是白天的人，那召你的必成就。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，聖經說耶穌一定會再來，可是連使徒都拒絕算日子，所以我不怕，也不猜。第二句，等候的意思是在夜裡醒著照顧身邊的人：灰心的陪他、軟弱的扶他，在難處裡仍然向神感謝。第三句，我撐不到天亮也沒關係，因為那召我的是信實的，他必成就。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多警醒」這類答案；談到教會領袖時，不在組裡評論任何一位同工的對錯。"],["s","收尾（5分鐘）"],["p","這是全卷最後一課。請每一個人用一句話說：這一卷書走完，我最想帶走的一節經文是哪一節，以及這一週我要替誰守夜。"],["p","然後彼此代禱，指名為三種人禱告：一位灰心的人，一位在夜裡工作或守夜的人，一位在教會勞苦的同工。"],["p","散會以前，一起念 5:24 和 5:27。確認紙上寫了三樣：要勉勵的人、要認識的同工、要念給他聽的人。"]]}}}</script>
